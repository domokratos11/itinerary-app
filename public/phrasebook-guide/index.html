<html lang="en">
<head>

<script>(function(){
var root=document.documentElement,host=null,win=null;
try{if(window.top!==window.self){win=window.parent;host=win.document.documentElement;root.classList.add('in-app');}}catch(e){host=null;}
var VARS={'--bg':'--background','--surface':'--card','--ink':'--foreground','--muted':'--muted-foreground','--line':'--border','--chip':'--muted','--accent':'--primary','--app-display':'--font-display'};
function own(){var t=null;try{t=localStorage.getItem('theme');}catch(e){}if(t==='light'||t==='dark')root.setAttribute('data-theme',t);}
function sync(){
if(!host){own();return;}
root.setAttribute('data-theme',host.classList.contains('dark')?'dark':'light');
var cs=win.getComputedStyle(host);
for(var k in VARS){var v=cs.getPropertyValue(VARS[k]).trim();if(v)root.style.setProperty(k,v);}
var f=win.getComputedStyle(win.document.body).fontFamily;if(f)root.style.setProperty('--font-body',f);
}
function fonts(){
if(!host)return;
var css='',sheets=win.document.styleSheets;
for(var i=0;i<sheets.length;i++){var r;try{r=sheets[i].cssRules;}catch(e){continue;}for(var j=0;j<r.length;j++)if(r[j].type===5)css+=r[j].cssText+'\n';}
if(css){var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);}
}
sync();fonts();
if(host&&window.MutationObserver)new MutationObserver(sync).observe(host,{attributes:true,attributeFilter:['class','data-palette','style']});
window.addEventListener('storage',function(e){if(!host&&e.key==='theme')own();});
})();</script>
<!-- trip-planner:end -->
<title>Japanese Trip Phrasebook</title>
<style>
/* Layout idea: one narrow phone column. Topic list -> situations -> cards.
   Blue stripe = what they say to you. Lantern yellow stripe = what you say. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --ink:#16233a; --muted:#5b6b84; --line:#d5dde9;
  --they:#2f6fd0; --they-bg:#e8f0fc; --you:#b97a00; --you-bg:#fff4d6;
  --accent:#d6336c; --chip:#e3e9f2;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif;
  --font-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",Meiryo,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1826; --surface:#18243a; --ink:#e9eef7; --muted:#9aa9c2; --line:#2b3b57;
    --they:#7fb0ff; --they-bg:#1b2f52; --you:#ffc94d; --you-bg:#3a2f12;
    --accent:#ff7aa5; --chip:#22314b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1826; --surface:#18243a; --ink:#e9eef7; --muted:#9aa9c2; --line:#2b3b57;
  --they:#7fb0ff; --they-bg:#1b2f52; --you:#ffc94d; --you-bg:#3a2f12;
  --accent:#ff7aa5; --chip:#22314b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--they);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 80px}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.back{min-width:44px;min-height:44px;border-radius:10px;font-size:22px;display:none}
.back.on{display:block}
.title{flex:1;min-width:0}
.title b{display:block;font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.title span{font-size:13px;color:var(--muted)}
.savedbtn{min-height:44px;padding:0 12px;border-radius:10px;background:var(--chip);font-size:14px;font-weight:600}
#q{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px var(--font-body)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:36px;padding:0 12px;border-radius:18px;background:var(--chip);font-size:13px;font-weight:600}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.lede{color:var(--muted);font-size:14px;margin:14px 0 10px}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.topic .jp{font:800 20px/1.1 var(--font-jp);flex:none;width:4.3em;color:var(--accent)}
.topic .tt{flex:1;min-width:0}
.topic .tt b{display:block;font-size:16px}
.topic .tt span{display:block;font-size:13px;color:var(--muted)}
.topic .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.topic.soon{opacity:.55;cursor:default}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:18px;background:var(--chip);font-size:13px;font-weight:600;white-space:nowrap}

h2{font-size:18px;line-height:1.25;margin:26px 0 2px;font-weight:800;text-wrap:balance;scroll-margin-top:185px}
.intro{color:var(--muted);font-size:14px;margin:0 0 10px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--they);border-radius:12px;padding:12px 12px 12px 14px}
.card.you{border-left-color:var(--you)}
.card.word{border-left-color:var(--muted)}
.who.word{background:var(--chip);color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
h3.vt{scroll-margin-top:185px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.who{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--they-bg);color:var(--they)}
.you .who,.who.you{background:var(--you-bg);color:var(--you)}
.lvl{font-size:12px;color:var(--muted)}
.lvl.core{color:var(--accent);font-weight:700}
.sp{flex:1}
.ib{min-width:40px;min-height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px}
.ib.fav[aria-pressed="true"]{color:var(--you)}
.jp{font:700 21px/1.4 var(--font-jp);overflow-wrap:anywhere}
.kana{font:15px/1.5 var(--font-jp);color:var(--muted);overflow-wrap:anywhere}
.ro{font-size:15px;font-style:italic;overflow-wrap:anywhere}
.mean{font-size:15px;margin-top:2px;font-weight:600}
.note{font-size:14px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sub{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sublabel{font-size:12px;font-weight:700;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--you-bg)}
.row.alt{background:var(--they-bg)}
.row .tx{flex:1;min-width:0}
.row .jp{font-size:17px}
.row .kana,.row .ro,.row .mean{font-size:14px}
body.noro .ro{display:none}
body.nomean .mean{filter:blur(6px);cursor:pointer}
body.nomean .mean.show{filter:none}

.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dlg h3{margin:0 0 2px;font-size:15px}
.line{max-width:88%;padding:8px 10px;border-radius:12px;background:var(--they-bg);align-self:flex-start}
.line.you{background:var(--you-bg);align-self:flex-end}
.line .jp{font-size:17px}
.line .kana,.line .ro,.line .mean{font-size:13px}
.line .mean{font-weight:500}
.line .who{display:inline-block;margin-bottom:2px;background:none;padding:0}

.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sign{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.sign .jp{font-size:24px;line-height:1.2}
.sign .where{font-size:12px;color:var(--muted);margin-top:4px}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
table{table-layout:fixed}
td{overflow-wrap:anywhere}
td.j{font:700 17px var(--font-jp);width:34%}
td.j+td{width:30%}
h3.vt{font-size:15px;margin:16px 0 6px}
.empty{color:var(--muted);padding:24px 0}
.pbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px}
.pbtn.ghost{background:var(--chip);color:var(--ink)}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.quiz .ask{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.quiz .big{font:700 24px/1.4 var(--font-jp);overflow-wrap:anywhere}
.quiz .bigen{font-size:20px;font-weight:700;line-height:1.35}
.quiz .ans{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.from{font-size:12px;color:var(--muted);margin-bottom:2px}
/* trip-planner:start */
.trip-home{display:inline-flex;align-self:flex-start;align-items:center;min-height:44px;padding:0 4px;color:var(--muted);font-size:14px;font-weight:600;text-decoration:none}
.trip-home:hover,.trip-home:focus-visible{color:var(--ink)}
html.in-app .trip-home{display:none}
html.in-app .title b{font-family:var(--app-display),var(--font-body)}
/* trip-planner:end *//* trip-planner:start */
.jp,.big,td.j{cursor:pointer}
.topic .jp{cursor:inherit}
[role=button].jp:focus-visible,[role=button].big:focus-visible,td.j[tabindex]:focus-visible{outline:2px solid var(--they);outline-offset:2px;border-radius:4px}
.lede::after{content:"Tap any Japanese text to show it large to staff.";display:block;margin-top:4px}
html.tp-staff-on,html.tp-staff-on body{overflow:hidden}
.tp-staff{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:12px;background:var(--surface);color:var(--ink);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tp-staff[hidden],.tp-staff [hidden]{display:none}
.tp-staff-fit{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tp-staff-in{width:100%;text-align:center;font-family:var(--font-jp);line-height:1.25}
.tp-staff-jp{font-weight:800;word-break:normal;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere;text-wrap:balance}
.tp-staff-kana{font-size:max(16px,min(.3em,40px));font-weight:500;color:var(--muted);margin-top:.5em;line-break:strict;overflow-wrap:anywhere;text-wrap:balance}
.tp-staff-mean{font-size:14px;color:var(--muted);text-align:center}
.tp-staff-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tp-staff-bar button{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-size:16px;font-weight:700}
.tp-staff-bar svg{width:20px;height:20px}
.tp-staff-say{background:var(--chip);color:var(--ink)}
.tp-staff-close{background:var(--ink);color:var(--surface)}
/* trip-planner:end */</style>
</head>
<body>
<header class="top"><div class="top-in"><!-- trip-planner:start --><a class="trip-home" href="/itinerary-app/">&#8592; Trip Planner</a><!-- trip-planner:end -->
  <div class="bar">
    <button class="back" id="back" aria-label="Back to topics">&#8249;</button>
    <div class="title"><b id="ttl">Japanese Trip Phrasebook</b><span id="sub">旅の日本語</span></div>
    <button class="savedbtn" id="savedbtn">Saved</button>
  </div>
  <input id="q" type="search" placeholder="Search: bag, fukuro, 袋, card..." autocomplete="off" aria-label="Search phrases">
  <div class="opts">
    <button class="opt" id="o-core" aria-pressed="false">Core only</button>
    <button class="opt" id="o-ro" aria-pressed="true">Romaji</button>
    <button class="opt" id="o-mean" aria-pressed="true">Meaning</button>
  </div>
</div></header>
<main class="wrap" id="main"></main>
<script>
const DATA = [{"slug":"foundations","title":"Foundations","title_jp":"基本","summary":"Openers, yes and no, repair, shop keigo, prices, paying","situations":[{"title":"Opening and closing words","intro":"A handful of words do most of the work. Each one has several jobs, so learn what each job sounds like.","phrases":[{"id":"foundations-open-01","speaker":"you","jp":"すみません","kana":"すみません","meaning":"Excuse me (to call staff). Also sorry, or thanks for the trouble.","also_heard":[{"jp":"すみませーん！","kana":"すみませーん！","meaning":"Calling staff with a hand raised","romaji":"sumimaseen!"},{"jp":"あ、すみません","kana":"あ、 すみません","meaning":"Oops, sorry","romaji":"a, sumimasen"}],"note":"This is how you call staff in restaurants and shops. Using it to say thanks is normal and humble.","level":"core","romaji":"sumimasen"},{"id":"foundations-open-02","speaker":"you","jp":"あのう…","kana":"あのう…","meaning":"Um, excuse me (soft opener)","also_heard":[{"jp":"あの、すみません","kana":"あの、 すみません","meaning":"Um, excuse me","romaji":"ano, sumimasen"}],"note":"Softens a question to staff, so you don't launch straight into it.","level":"useful","romaji":"anou..."},{"id":"foundations-open-03","speaker":"you","jp":"これ、お願いします。","kana":"これ、 おねがい します。","meaning":"This one, please.","also_heard":[{"jp":"お会計お願いします。","kana":"おかいけい おねがい します。","meaning":"The bill, please.","romaji":"okaikei onegai shimasu."},{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please (accepting an offer).","romaji":"hai, onegai shimasu."}],"note":"Safer than ください because it works for services too. It is also how you accept offers.","level":"core","romaji":"kore, onegai shimasu."},{"id":"foundations-open-04","speaker":"you","jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","also_heard":[{"jp":"どうもありがとうございます。","kana":"どうも ありがとう ございます。","meaning":"Thank you very much.","romaji":"doumo arigatou gozaimasu."}],"note":"Use this during an interaction. Use the ました form once it has finished.","level":"core","romaji":"arigatou gozaimasu."},{"id":"foundations-open-05","speaker":"you","jp":"ありがとうございました。","kana":"ありがとう ございました。","meaning":"Thank you (it's over now).","note":"Say this when leaving a shop or getting off a taxi.","level":"core","romaji":"arigatou gozaimashita."},{"id":"foundations-open-06","speaker":"you","jp":"どうも。","kana":"どうも。","meaning":"Thanks (casual).","also_heard":[{"jp":"どうも、すみません。","kana":"どうも、 すみません。","meaning":"Thanks, sorry for the trouble.","romaji":"doumo, sumimasen."}],"note":"Fine for small things like a door held. A bit brief for bigger favours.","level":"useful","romaji":"doumo."},{"id":"foundations-open-07","speaker":"you","jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"It's fine. Or: no, thanks.","also_heard":[{"jp":"あ、大丈夫です。","kana":"あ、 だいじょうぶ です。","meaning":"No, thanks (with a small hand wave)","romaji":"a, daijoubu desu."},{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine","romaji":"hai, daijoubu desu."}],"note":"TRAP: the same words can mean yes or no. To refuse, add あ or いえ and a hand wave. To accept, say はい and お願いします.","level":"core","romaji":"daijoubu desu."},{"id":"foundations-open-08","speaker":"you","jp":"結構です。","kana":"けっこう です。","meaning":"No thank you (firmer, more formal).","also_heard":[{"jp":"いいです。","kana":"いい です。","meaning":"No, it's fine (flat tone)","romaji":"ii desu."},{"jp":"いえ、結構です。","kana":"いえ、 けっこう です。","meaning":"No, thank you","romaji":"ie, kekkou desu."}],"note":"Can sound cold if flat. Staff also use it to mean that's fine, as in 'just your name is fine'.","level":"useful","romaji":"kekkou desu."},{"id":"foundations-open-09","speaker":"you","jp":"失礼します。","kana":"しつれい します。","meaning":"Excuse me (entering, leaving, passing).","also_heard":[{"jp":"ちょっと失礼します。","kana":"ちょっと しつれい します。","meaning":"Excuse me for a moment (squeezing past)","romaji":"chotto shitsurei shimasu."},{"jp":"失礼いたします。","kana":"しつれい いたします。","meaning":"Excuse me (staff, more formal, placing items)","romaji":"shitsurei itashimasu."},{"jp":"すみません、通ります。","kana":"すみません、 とおります。","meaning":"Sorry, coming through","romaji":"sumimasen, toorimasu."}],"note":"Staff use the longer form when they put items down or come into your room.","level":"core","romaji":"shitsurei shimasu."},{"id":"foundations-open-10","speaker":"you","jp":"いただきます。","kana":"いただきます。","meaning":"Let's eat (said before a meal).","note":"Pair it with ごちそうさまでした at the end of the meal.","level":"core","romaji":"itadakimasu."},{"id":"foundations-open-11","speaker":"you","jp":"ごちそうさまでした。","kana":"ごちそうさま でした。","meaning":"Thanks for the meal (said to the counter when leaving).","note":"The natural closer in restaurants. Say it to staff as you leave.","level":"core","romaji":"gochisousama deshita."},{"id":"foundations-open-12","speaker":"you","jp":"こんにちは。","kana":"こんにちは。","meaning":"Hello, good afternoon.","also_heard":[{"jp":"こんばんは。","kana":"こんばんは。","meaning":"Good evening","romaji":"konbanwa."}],"note":"Don't greet shop staff with these. A nod is enough when they say いらっしゃいませ. Use them with hotel staff and hosts.","level":"useful","romaji":"konnichiwa."},{"id":"foundations-open-13","speaker":"you","jp":"よいお年を。","kana":"よい おとし を。","meaning":"Have a good New Year (said until about Dec 31).","also_heard":[{"jp":"よいお年をお迎えください。","kana":"よい おとし を おむかえ ください。","meaning":"Have a good New Year","romaji":"yoi otoshi o omukae kudasai."}],"replies":[{"jp":"よいお年を。","kana":"よい おとし を。","meaning":"Same to you.","romaji":"yoi otoshi o."}],"note":"You will hear it constantly in late December.","level":"useful","romaji":"yoi otoshi o."},{"id":"foundations-open-14","speaker":"you","jp":"あけましておめでとうございます。","kana":"あけまして おめでとう ございます。","meaning":"Happy New Year (from Jan 1, through about mid-January).","also_heard":[{"jp":"本年もよろしくお願いいたします。","kana":"ほんねん も よろしく おねがい いたします。","meaning":"Thanks for your support this year (staff greeting)","romaji":"honnen mo yoroshiku onegai itashimasu."},{"jp":"今年もよろしくお願いします。","kana":"ことし も よろしく おねがい します。","meaning":"Please look after me this year.","romaji":"kotoshi mo yoroshiku onegai shimasu."}],"note":"Staff greet customers with it in early January. Returning it is warm and correct.","level":"useful","romaji":"akemashite omedetou gozaimasu."}]},{"title":"Yes, no and soft refusals","intro":"Japanese rarely says a flat いいえ. Learn how no really sounds, from staff and from you.","phrases":[{"id":"foundations-yesno-01","speaker":"you","jp":"はい。","kana":"はい。","meaning":"Yes, I'm listening, understood.","note":"Staff はい... often means I'm following you, not agreement.","level":"core","romaji":"hai."},{"id":"foundations-yesno-02","speaker":"you","jp":"ええ。","kana":"ええ。","meaning":"Yes (softer).","also_heard":[{"jp":"うん。","kana":"うん。","meaning":"Yeah (casual)","romaji":"un."}],"level":"listen-only","romaji":"ee."},{"id":"foundations-yesno-03","speaker":"you","jp":"いえ、大丈夫です。","kana":"いえ、 だいじょうぶ です。","meaning":"No, it's fine. No thanks.","also_heard":[{"jp":"いえいえ。","kana":"いえいえ。","meaning":"Not at all (modest)","romaji":"ieie."},{"jp":"いや…","kana":"いや…","meaning":"Well, no... (soft refusal)","romaji":"iya..."}],"note":"いえ is the real-life no. いいえ sounds textbook-stiff.","level":"core","romaji":"ie, daijoubu desu."},{"id":"foundations-yesno-04","speaker":"you","jp":"ちょっと…","kana":"ちょっと…","meaning":"That's a bit... (an implied no).","also_heard":[{"jp":"今日はちょっと…","kana":"きょう は ちょっと…","meaning":"Today's a bit tricky...","romaji":"kyou wa chotto..."},{"jp":"それはちょっと…","kana":"それ は ちょっと…","meaning":"That's a bit much...","romaji":"sore wa chotto..."}],"note":"Trailing off is the refusal, and the listener fills in the rest. Staff use it too.","level":"core","romaji":"chotto..."},{"id":"foundations-yesno-05","speaker":"you","jp":"違います。","kana":"ちがいます。","meaning":"That's not right (wrong item or order).","also_heard":[{"jp":"ちょっと違います。","kana":"ちょっと ちがいます。","meaning":"That's a bit different","romaji":"chotto chigaimasu."},{"jp":"あ、これじゃなくて…","kana":"あ、 これ じゃなくて…","meaning":"Oh, not this one...","romaji":"a, kore janakute..."}],"note":"Polite enough. Add すみません first.","level":"core","romaji":"chigaimasu."},{"id":"foundations-yesno-06","speaker":"you","jp":"見てるだけです。","kana":"みてる だけ です。","meaning":"I'm just looking.","also_heard":[{"jp":"見ているだけです。","kana":"みている だけ です。","meaning":"I'm just looking (formal)","romaji":"miteiru dake desu."},{"jp":"ちょっと見てます。","kana":"ちょっと みてます。","meaning":"I'm just having a look","romaji":"chotto mitemasu."}],"note":"The answer to 何かお探しですか (are you looking for something?).","level":"core","romaji":"miteru dake desu."},{"id":"foundations-yesno-07","speaker":"you","jp":"ちょっと考えます。","kana":"ちょっと かんがえます。","meaning":"I'll think about it.","also_heard":[{"jp":"また来ます。","kana":"また きます。","meaning":"I'll come back.","romaji":"mata kimasu."}],"note":"The polite exit from a shop or a pushy sales pitch.","level":"core","romaji":"chotto kangaemasu."},{"id":"foundations-yesno-08","speaker":"you","jp":"そうですね。","kana":"そう です ね。","meaning":"That's right. Let me think.","also_heard":[{"jp":"そうです。","kana":"そう です。","meaning":"That's right.","romaji":"sou desu."},{"jp":"そうですか。","kana":"そう です か。","meaning":"I see.","romaji":"sou desu ka."}],"note":"With a pause, そうですね is also a polite way to stall for time.","level":"useful","romaji":"sou desu ne."},{"id":"foundations-yesno-09","speaker":"staff","jp":"あいにく、売り切れです。","kana":"あいにく、 うりきれ です。","meaning":"Unfortunately, it's sold out.","note":"Bad news is coming: sold out, full or closed.","level":"listen-only","romaji":"ainiku, urikire desu."},{"id":"foundations-yesno-10","speaker":"staff","jp":"申し訳ございません、それはちょっと…","kana":"もうしわけ ございません、 それ は ちょっと…","meaning":"I'm very sorry, that's a bit difficult.","also_heard":[{"jp":"それはいたしかねます。","kana":"それ は いたしかねます。","meaning":"We're unable to do that.","romaji":"sore wa itashikanemasu."},{"jp":"それはできかねます。","kana":"それ は できかねます。","meaning":"I'm afraid that's not possible.","romaji":"sore wa dekikanemasu."}],"note":"かねます means cannot, said very politely. Plain form: できません.","level":"listen-only","romaji":"moushiwake gozaimasen, sore wa chotto..."},{"id":"foundations-yesno-11","speaker":"staff","jp":"こちらの商品は取り扱っておりません。","kana":"こちら の しょうひん は とりあつかって おりません。","meaning":"We don't carry this item.","also_heard":[{"jp":"ございません。","kana":"ございません。","meaning":"We don't have it.","romaji":"gozaimasen."}],"note":"Plain form: 置いていません (we don't stock it).","level":"listen-only","romaji":"kochira no shouhin wa toriatsukatte orimasen."},{"id":"foundations-yesno-12","speaker":"staff","jp":"お下げしてもよろしいですか？","kana":"おさげ して も よろしい です か？","meaning":"May I clear this away?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."},{"jp":"あ、まだです。","kana":"あ、 まだ です。","meaning":"Not yet.","romaji":"a, mada desu."}],"note":"Plain form: 片付けてもいいですか.","level":"useful","romaji":"osage shite mo yoroshii desu ka?"},{"id":"foundations-yesno-13","speaker":"staff","jp":"袋なくてよろしいですか？","kana":"ふくろ なくて よろしい です か？","meaning":"You don't need a bag, is that right?","replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes, I don't need one.","romaji":"hai."},{"jp":"いえ、お願いします。","kana":"いえ、 おねがい します。","meaning":"No, I'd like one, please.","romaji":"ie, onegai shimasu."}],"note":"TRAP: はい to a negative question confirms the negative. Say いえ to change it.","level":"useful","romaji":"fukuro nakute yoroshii desu ka?"}]},{"title":"Communication repair","intro":"The phrases that keep a conversation going when you get lost. Combine them with pointing and your phone.","phrases":[{"id":"foundations-repair-01","speaker":"you","jp":"すみません、もう一度お願いします。","kana":"すみません、 もういちど おねがい します。","meaning":"Sorry, once more, please.","also_heard":[{"jp":"もう一回いいですか？","kana":"もういっかい いい です か？","meaning":"Could you say that once more?","romaji":"mouikkai ii desu ka?"}],"level":"core","romaji":"sumimasen, mouichido onegai shimasu."},{"id":"foundations-repair-02","speaker":"you","jp":"もう少しゆっくりお願いします。","kana":"もう すこし ゆっくり おねがい します。","meaning":"A bit slower, please.","also_heard":[{"jp":"ゆっくり話していただけますか？","kana":"ゆっくり はなして いただけます か？","meaning":"Could you speak more slowly?","romaji":"yukkuri hanashite itadakemasu ka?"}],"level":"core","romaji":"mou sukoshi yukkuri onegai shimasu."},{"id":"foundations-repair-03","speaker":"you","jp":"すみません、聞き取れませんでした。","kana":"すみません、 ききとれませんでした。","meaning":"Sorry, I didn't catch that.","also_heard":[{"jp":"え、すみません…","kana":"え、 すみません…","meaning":"Sorry, what...?","romaji":"e, sumimasen..."}],"note":"Avoid a bare え? with a rising tone, which sounds rude.","level":"useful","romaji":"sumimasen, kikitoremasendeshita."},{"id":"foundations-repair-04","speaker":"you","jp":"日本語があまりわかりません。","kana":"にほんご が あまり わかりません。","meaning":"I don't understand much Japanese.","also_heard":[{"jp":"日本語、少しだけです。","kana":"にほんご、 すこし だけ です。","meaning":"Only a little Japanese","romaji":"nihongo, sukoshi dake desu."}],"note":"If you say this in fluent Japanese, staff may keep going in Japanese. Then ask for ゆっくり.","level":"core","romaji":"nihongo ga amari wakarimasen."},{"id":"foundations-repair-05","speaker":"you","jp":"英語、話せますか？","kana":"えいご、 はなせます か？","meaning":"Do you speak English?","also_heard":[{"jp":"英語、大丈夫ですか？","kana":"えいご、 だいじょうぶ です か？","meaning":"Is English OK?","romaji":"eigo, daijoubu desu ka?"},{"jp":"英語のメニューはありますか？","kana":"えいご の メニュー は あります か？","meaning":"Do you have an English menu?","romaji":"eigo no menyuu wa arimasu ka?"}],"replies":[{"jp":"少しだけです。","kana":"すこし だけ です。","meaning":"Only a little.","romaji":"sukoshi dake desu."},{"jp":"英語ができる者を呼びますので少々お待ちください。","kana":"えいご が できる もの を よびます の で しょうしょう おまち ください。","meaning":"I'll call someone who speaks English, so please wait a moment.","romaji":"eigo ga dekiru mono o yobimasu no de shoushou omachi kudasai."}],"level":"core","romaji":"eigo, hanasemasu ka?"},{"id":"foundations-repair-06","speaker":"you","jp":"ここに書いてもらえますか？","kana":"ここ に かいて もらえます か？","meaning":"Could you write it here?","also_heard":[{"jp":"書いていただけますか？","kana":"かいて いただけます か？","meaning":"Could you write it down, please?","romaji":"kaite itadakemasu ka?"}],"level":"useful","romaji":"koko ni kaite moraemasu ka?"},{"id":"foundations-repair-07","speaker":"you","jp":"これをお願いします。","kana":"これ を おねがい します。","meaning":"This one, please.","also_heard":[{"jp":"これください。","kana":"これ ください。","meaning":"I'll take this one.","romaji":"kore kudasai."},{"jp":"これと、これ。","kana":"これ と、 これ。","meaning":"This one and this one.","romaji":"kore to, kore."},{"jp":"これを二つ。","kana":"これ を ふたつ。","meaning":"Two of these.","romaji":"kore o futatsu."}],"note":"これ, それ, あれ for things. Staff answer with こちら, そちら, あちら.","level":"core","romaji":"kore o onegai shimasu."},{"id":"foundations-repair-08","speaker":"you","jp":"これで大丈夫ですか？","kana":"これ で だいじょうぶ です か？","meaning":"Is this OK?","also_heard":[{"jp":"これでいいですか？","kana":"これ で いい です か？","meaning":"Is this alright?","romaji":"kore de ii desu ka?"}],"note":"Use it for a form, a ticket, an item, or the way you're doing something.","level":"core","romaji":"kore de daijoubu desu ka?"},{"id":"foundations-repair-09","speaker":"you","jp":"これって何ですか？","kana":"これ って なん です か？","meaning":"What is this?","also_heard":[{"jp":"どういう意味ですか？","kana":"どういう いみ です か？","meaning":"What does that mean?","romaji":"douiu imi desu ka?"}],"level":"useful","romaji":"kore tte nan desu ka?"},{"id":"foundations-repair-10","speaker":"you","jp":"ここに行きたいんですけど…","kana":"ここ に いきたい ん です けど…","meaning":"I'd like to go here...","also_heard":[{"jp":"これ、どこですか？","kana":"これ、 どこ です か？","meaning":"Where is this?","romaji":"kore, doko desu ka?"},{"jp":"これ、ありますか？","kana":"これ、 あります か？","meaning":"Do you have this?","romaji":"kore, arimasu ka?"}],"note":"Show your phone or a photo while you say it. ～んですけど invites help and sounds natural.","level":"core","romaji":"koko ni ikitai n desu kedo..."},{"id":"foundations-repair-11","speaker":"you","jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","also_heard":[{"jp":"なるほど。","kana":"なるほど。","meaning":"I see (I get it now)","romaji":"naruhodo."}],"level":"core","romaji":"wakarimashita."},{"id":"foundations-repair-12","speaker":"staff","jp":"英語でよろしいですか？","kana":"えいご で よろしい です か？","meaning":"Is English OK?","also_heard":[{"jp":"翻訳機で失礼します。","kana":"ほんやくき で しつれい します。","meaning":"Excuse me, I'll use a translator device","romaji":"hon'yakuki de shitsurei shimasu."}],"level":"listen-only","romaji":"eigo de yoroshii desu ka?"}]},{"title":"Asking for things","intro":"The question shapes you will use in every topic. Each one comes with the answers staff typically give.","phrases":[{"id":"foundations-ask-01","speaker":"you","jp":"お手洗いはどちらですか？","kana":"おてあらい は どちら です か？","meaning":"Where is the toilet?","also_heard":[{"jp":"トイレ、どこですか？","kana":"トイレ、 どこ です か？","meaning":"Where's the toilet?","romaji":"toire, doko desu ka?"}],"replies":[{"jp":"あちらです。","kana":"あちら です。","meaning":"It's over there.","romaji":"achira desu."},{"jp":"突き当たりを右です。","kana":"つきあたり を みぎ です。","meaning":"It's on the right, at the end.","romaji":"tsukiatari o migi desu."}],"note":"Other answers: 2階になります (second floor), こちらをまっすぐ行って左です (straight ahead, then left).","level":"core","romaji":"otearai wa dochira desu ka?"},{"id":"foundations-ask-02","speaker":"you","jp":"黒はありますか？","kana":"くろ は あります か？","meaning":"Do you have it in black?","also_heard":[{"jp":"ありますか？","kana":"あります か？","meaning":"Do you have it?","romaji":"arimasu ka?"}],"replies":[{"jp":"ございます。","kana":"ございます。","meaning":"We have it.","romaji":"gozaimasu."},{"jp":"ただいま切らしております。","kana":"ただいま きらして おります。","meaning":"We're out of stock right now.","romaji":"tadaima kirashite orimasu."}],"note":"Staff may also say 在庫を確認いたします (I'll check the stock).","level":"core","romaji":"kuro wa arimasu ka?"},{"id":"foundations-ask-03","speaker":"you","jp":"これ、いくらですか？","kana":"これ、 いくら です か？","meaning":"How much is this?","also_heard":[{"jp":"全部でいくらですか？","kana":"ぜんぶ で いくら です か？","meaning":"How much in total?","romaji":"zenbu de ikura desu ka?"}],"replies":[{"jp":"千二百円でございます。","kana":"せん にひゃく えん で ございます。","meaning":"It's 1,200 yen.","romaji":"sen nihyaku en de gozaimasu."}],"level":"core","romaji":"kore, ikura desu ka?"},{"id":"foundations-ask-04","speaker":"you","jp":"写真を撮ってもいいですか？","kana":"しゃしん を とって も いい です か？","meaning":"May I take a photo?","replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Go ahead.","romaji":"douzo."},{"jp":"申し訳ございません、ご遠慮いただいております。","kana":"もうしわけ ございません、 ごえんりょ いただいて おります。","meaning":"Sorry, we ask that you refrain.","romaji":"moushiwake gozaimasen, goenryo itadaite orimasu."}],"note":"ご遠慮ください means please refrain, which is a NO. Watch for 撮影禁止 (no photos) signs.","level":"core","romaji":"shashin o totte mo ii desu ka?"},{"id":"foundations-ask-05","speaker":"you","jp":"カード、使えますか？","kana":"カード、 つかえます か？","meaning":"Can I use a card?","also_heard":[{"jp":"荷物を置いても大丈夫ですか？","kana":"にもつ を おいて も だいじょうぶ です か？","meaning":"Is it OK to leave my bags here?","romaji":"nimotsu o oite mo daijoubu desu ka?"}],"note":"The all-purpose way to ask can I. More natural than ～できますか.","level":"core","romaji":"kaado, tsukaemasu ka?"},{"id":"foundations-ask-06","speaker":"you","jp":"何時までですか？","kana":"なんじ まで です か？","meaning":"Until what time?","also_heard":[{"jp":"何時からですか？","kana":"なんじ から です か？","meaning":"From what time?","romaji":"nanji kara desu ka?"}],"replies":[{"jp":"二十一時までになります。","kana":"にじゅういちじ まで に なります。","meaning":"Until 9 pm.","romaji":"nijuuichiji made ni narimasu."},{"jp":"ラストオーダーは二十時です。","kana":"ラストオーダー は にじゅうじ です。","meaning":"Last order is at 8 pm.","romaji":"rasutooodaa wa nijuuji desu."}],"level":"core","romaji":"nanji made desu ka?"},{"id":"foundations-ask-07","speaker":"you","jp":"どれですか？","kana":"どれ です か？","meaning":"Which one?","also_heard":[{"jp":"どっちがいいですか？","kana":"どっち が いい です か？","meaning":"Which one is better?","romaji":"dotchi ga ii desu ka?"},{"jp":"おすすめはどれですか？","kana":"おすすめ は どれ です か？","meaning":"Which one do you recommend?","romaji":"osusume wa dore desu ka?"}],"replies":[{"jp":"こちらが人気です。","kana":"こちら が にんき です。","meaning":"This one is popular.","romaji":"kochira ga ninki desu."},{"jp":"一番人気はこちらです。","kana":"いちばん にんき は こちら です。","meaning":"This is the most popular.","romaji":"ichiban ninki wa kochira desu."}],"level":"core","romaji":"dore desu ka?"},{"id":"foundations-ask-08","speaker":"you","jp":"駅へはどうやって行けばいいですか？","kana":"えき へ は どうやって いけば いい です か？","meaning":"How do I get to the station?","note":"Full route phrases are in the trains topic.","level":"useful","romaji":"eki e wa douyatte ikeba ii desu ka?"},{"id":"foundations-ask-09","speaker":"you","jp":"どのくらいかかりますか？","kana":"どの くらい かかります か？","meaning":"How long does it take?","replies":[{"jp":"十分ほどです。","kana":"じゅっぷん ほど です。","meaning":"About 10 minutes.","romaji":"juppun hodo desu."},{"jp":"二十分ぐらいかかります。","kana":"にじゅっぷん ぐらい かかります。","meaning":"It takes about 20 minutes.","romaji":"nijuppun gurai kakarimasu."}],"level":"useful","romaji":"dono kurai kakarimasu ka?"},{"id":"foundations-ask-10","speaker":"you","jp":"コーヒーを二つください。","kana":"コーヒー を ふたつ ください。","meaning":"Two coffees, please.","also_heard":[{"jp":"ひとつお願いします。","kana":"ひとつ おねがい します。","meaning":"One, please.","romaji":"hitotsu onegai shimasu."}],"note":"Links to the counters list in the vocab section.","level":"core","romaji":"koohii o futatsu kudasai."},{"id":"foundations-ask-11","speaker":"staff","jp":"何かお探しですか？","kana":"なに か おさがし です か？","meaning":"Are you looking for something?","replies":[{"jp":"見てるだけです。","kana":"みてる だけ です。","meaning":"I'm just looking.","romaji":"miteru dake desu."},{"jp":"お土産を探しています。","kana":"おみやげ を さがして います。","meaning":"I'm looking for a souvenir.","romaji":"omiyage o sagashite imasu."}],"level":"listen-only","romaji":"nani ka osagashi desu ka?"}]},{"title":"Keigo by ear I: set phrases","intro":"These are fixed formulas, and each one maps to Japanese you already know. Recognise them and you won't need to answer most of them.","phrases":[{"id":"foundations-keigo-01","speaker":"staff","jp":"いらっしゃいませ。","kana":"いらっしゃいませ。","meaning":"Welcome.","note":"No reply needed. A nod is enough. Plain form: いらっしゃい.","level":"listen-only","romaji":"irasshaimase."},{"id":"foundations-keigo-02","speaker":"staff","jp":"何名様ですか？","kana":"なんめいさま です か？","meaning":"How many people?","also_heard":[{"jp":"何名様でしょうか？","kana":"なんめいさま でしょう か？","meaning":"How many in your party?","romaji":"nanmeisama deshou ka?"},{"jp":"お二人様ですか？","kana":"おふたりさま です か？","meaning":"Just the two of you?","romaji":"ofutarisama desu ka?"},{"jp":"何人ですか？","kana":"なんにん です か？","meaning":"How many people? (plain)","romaji":"nannin desu ka?"}],"replies":[{"jp":"二人です。","kana":"ふたり です。","meaning":"Two people (hold up fingers too).","romaji":"futari desu."},{"jp":"二名です。","kana":"にめい です。","meaning":"Two (staff style).","romaji":"nimei desu."}],"level":"core","romaji":"nanmeisama desu ka?"},{"id":"foundations-keigo-03","speaker":"staff","jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"One moment, please.","also_heard":[{"jp":"少々お待ちくださいませ。","kana":"しょうしょう おまち くださいませ。","meaning":"One moment, please (extra polite).","romaji":"shoushou omachi kudasaimase."},{"jp":"少々お待ちいただけますか？","kana":"しょうしょう おまち いただけます か？","meaning":"Could you wait a moment?","romaji":"shoushou omachi itadakemasu ka?"}],"note":"Plain form: ちょっと待ってください.","level":"listen-only","romaji":"shoushou omachi kudasai."},{"id":"foundations-keigo-04","speaker":"staff","jp":"お待たせいたしました。","kana":"おまたせ いたしました。","meaning":"Sorry to keep you waiting.","also_heard":[{"jp":"お待たせしました。","kana":"おまたせ しました。","meaning":"Sorry to keep you waiting.","romaji":"omatase shimashita."},{"jp":"大変お待たせいたしました。","kana":"たいへん おまたせ いたしました。","meaning":"Thank you for waiting, very sorry.","romaji":"taihen omatase itashimashita."}],"note":"Plain form: 待たせました. Said every time they come back to you.","level":"listen-only","romaji":"omatase itashimashita."},{"id":"foundations-keigo-05","speaker":"staff","jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly, understood.","also_heard":[{"jp":"承知しました。","kana":"しょうち しました。","meaning":"Understood (for an order or request).","romaji":"shouchi shimashita."},{"jp":"承知いたしました。","kana":"しょうち いたしました。","meaning":"Understood (very polite).","romaji":"shouchi itashimashita."}],"note":"Plain form: わかりました. Customers don't say this back; it belongs to staff.","level":"listen-only","romaji":"kashikomarimashita."},{"id":"foundations-keigo-06","speaker":"staff","jp":"恐れ入りますが、","kana":"おそれいります が、","meaning":"Excuse me, but...","note":"Plain form: すみませんが. Often comes right before a request.","level":"listen-only","romaji":"osoreirimasu ga,"},{"id":"foundations-keigo-07","speaker":"staff","jp":"申し訳ございません。","kana":"もうしわけ ございません。","meaning":"I'm very sorry.","also_heard":[{"jp":"申し訳ありません。","kana":"もうしわけ ありません。","meaning":"I'm sorry (a bit less formal).","romaji":"moushiwake arimasen."},{"jp":"大変申し訳ございません。","kana":"たいへん もうしわけ ございません。","meaning":"I'm terribly sorry.","romaji":"taihen moushiwake gozaimasen."}],"note":"Plain form: ごめんなさい. Usually followed by a no.","level":"listen-only","romaji":"moushiwake gozaimasen."},{"id":"foundations-keigo-08","speaker":"staff","jp":"こちらへどうぞ。","kana":"こちら へ どうぞ。","meaning":"This way, please.","also_heard":[{"jp":"ご案内いたします。","kana":"ごあんない いたします。","meaning":"I'll show you to your seat.","romaji":"goannai itashimasu."}],"note":"Plain form: こっちへ来てください.","level":"listen-only","romaji":"kochira e douzo."},{"id":"foundations-keigo-09","speaker":"staff","jp":"お次のお客様、どうぞ。","kana":"おつぎ の おきゃくさま、 どうぞ。","meaning":"Next customer, please.","also_heard":[{"jp":"次の方、こちらのレジへどうぞ。","kana":"つぎ の かた、 こちら の レジ へ どうぞ。","meaning":"Next person, this register, please.","romaji":"tsugi no kata, kochira no reji e douzo."}],"note":"Plain form: 次の人、来てください. Important to catch in queues.","level":"listen-only","romaji":"otsugi no okyakusama, douzo."},{"id":"foundations-keigo-10","speaker":"staff","jp":"ただいま参ります。","kana":"ただいま まいります。","meaning":"Coming right away.","also_heard":[{"jp":"只今お伺いします。","kana":"ただいま おうかがい します。","meaning":"I'm coming to you now.","romaji":"tadaima oukagai shimasu."}],"note":"Plain form: 今行きます. The usual reply when you call すみません in a restaurant.","level":"listen-only","romaji":"tadaima mairimasu."},{"id":"foundations-keigo-11","speaker":"staff","jp":"ごゆっくりどうぞ。","kana":"ごゆっくり どうぞ。","meaning":"Take your time, enjoy.","also_heard":[{"jp":"ごゆっくりお過ごしください。","kana":"ごゆっくり おすごし ください。","meaning":"Relax and enjoy your stay (hotels).","romaji":"goyukkuri osugoshi kudasai."}],"replies":[{"jp":"どうも。","kana":"どうも。","meaning":"Thanks.","romaji":"doumo."},{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Plain form: ゆっくりしてください.","level":"listen-only","romaji":"goyukkuri douzo."},{"id":"foundations-keigo-12","speaker":"staff","jp":"ありがとうございました、またお越しくださいませ。","kana":"ありがとう ございました、 また おこし くださいませ。","meaning":"Thank you, please come again.","also_heard":[{"jp":"またお待ちしております。","kana":"また おまち して おります。","meaning":"We look forward to seeing you again.","romaji":"mata omachi shite orimasu."},{"jp":"またどうぞ。","kana":"また どうぞ。","meaning":"Come again.","romaji":"mata douzo."}],"replies":[{"jp":"ありがとうございました。","kana":"ありがとう ございました。","meaning":"Thank you (said when leaving).","romaji":"arigatou gozaimashita."}],"note":"Plain form: また来てください. In restaurants, ごちそうさまでした also works.","level":"listen-only","romaji":"arigatou gozaimashita, mata okoshi kudasaimase."},{"id":"foundations-keigo-13","speaker":"staff","jp":"いってらっしゃいませ。","kana":"いってらっしゃいませ。","meaning":"Have a good outing (hotel staff seeing you off).","replies":[{"jp":"行ってきます。","kana":"いって きます。","meaning":"I'm off (leaving).","romaji":"itte kimasu."}],"note":"Plain form: いってらっしゃい. Hotel staff say it when you leave.","level":"useful","romaji":"itterasshaimase."},{"id":"foundations-keigo-14","speaker":"staff","jp":"おかえりなさいませ。","kana":"おかえりなさいませ。","meaning":"Welcome back (hotel).","replies":[{"jp":"ただいま。","kana":"ただいま。","meaning":"I'm back.","romaji":"tadaima."}],"note":"Plain form: おかえりなさい. Hotel staff say it when you come back.","level":"useful","romaji":"okaerinasaimase."},{"id":"foundations-keigo-15","speaker":"staff","jp":"お気をつけて。","kana":"おき を つけて。","meaning":"Take care.","note":"Plain form: 気をつけてください.","level":"useful","romaji":"oki o tsukete."}]},{"title":"Keigo by ear II: decoding patterns","intro":"These are patterns rather than fixed phrases. Strip off the keigo layer to find the plain verb you know.","phrases":[{"id":"foundations-decode-01","speaker":"staff","jp":"こちらでございます。","kana":"こちら で ございます。","meaning":"Here it is.","also_heard":[{"jp":"お手洗いはあちらでございます。","kana":"おてあらい は あちら で ございます。","meaning":"The toilet is over there.","romaji":"otearai wa achira de gozaimasu."}],"note":"でございます is just です, a more polite 'is'. Plain form: こちらです.","level":"listen-only","romaji":"kochira de gozaimasu."},{"id":"foundations-decode-02","speaker":"staff","jp":"千二百円になります。","kana":"せん にひゃく えん に なります。","meaning":"That's 1,200 yen.","also_heard":[{"jp":"こちらお釣りになります。","kana":"こちら おつり に なります。","meaning":"Here's your change.","romaji":"kochira otsuri ni narimasu."}],"note":"Literally 'becomes', but it just means 'is'. Plain form: 千二百円です. Staff use it everywhere.","level":"listen-only","romaji":"sen nihyaku en ni narimasu."},{"id":"foundations-decode-03","speaker":"staff","jp":"こちらでよろしいでしょうか？","kana":"こちら で よろしい でしょう か？","meaning":"Is this OK?","also_heard":[{"jp":"お箸は一膳でよろしいですか？","kana":"おはし は いちぜん で よろしい です か？","meaning":"One pair of chopsticks, is that OK?","romaji":"ohashi wa ichizen de yoroshii desu ka?"}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."},{"jp":"いえ、二つでお願いします。","kana":"いえ、 ふたつ で おねがい します。","meaning":"No, two please instead.","romaji":"ie, futatsu de onegai shimasu."}],"note":"Plain form: これでいいですか. You may also hear the past tense よろしかったでしょうか with the same meaning.","level":"core","romaji":"kochira de yoroshii deshou ka?"},{"id":"foundations-decode-04","speaker":"staff","jp":"ポイントカードはお持ちですか？","kana":"ポイントカード は おもち です か？","meaning":"Do you have a points card?","also_heard":[{"jp":"袋はご利用ですか？","kana":"ふくろ は ごりよう です か？","meaning":"Will you use a bag?","romaji":"fukuro wa goriyou desu ka?"},{"jp":"ご予約ですか？","kana":"ごよやく です か？","meaning":"Do you have a reservation?","romaji":"goyoyaku desu ka?"},{"jp":"お急ぎですか？","kana":"おいそぎ です か？","meaning":"Are you in a hurry?","romaji":"oisogi desu ka?"}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."},{"jp":"いいえ、大丈夫です。","kana":"いいえ、 だいじょうぶ です。","meaning":"No, I'm fine.","romaji":"iie, daijoubu desu."}],"note":"Plain form: 持っていますか. The same pattern works for ご利用ですか (will you use).","level":"core","romaji":"pointokaado wa omochi desu ka?"},{"id":"foundations-decode-05","speaker":"staff","jp":"お確かめください。","kana":"おたしかめ ください。","meaning":"Please check.","also_heard":[{"jp":"ご確認ください。","kana":"ごかくにん ください。","meaning":"Please confirm.","romaji":"gokakunin kudasai."},{"jp":"ご注意ください。","kana":"ごちゅうい ください。","meaning":"Please be careful.","romaji":"gochuui kudasai."},{"jp":"ご遠慮ください。","kana":"ごえんりょ ください。","meaning":"Please refrain (a polite no).","romaji":"goenryo kudasai."}],"note":"Plain form: 確かめてください. ご遠慮ください means please don't.","level":"listen-only","romaji":"otashikame kudasai."},{"id":"foundations-decode-06","speaker":"staff","jp":"お預かりします。","kana":"おあずかり します。","meaning":"I'll take it for you.","also_heard":[{"jp":"お包みします。","kana":"おつつみ します。","meaning":"I'll wrap it for you.","romaji":"otsutsumi shimasu."},{"jp":"ご案内します。","kana":"ごあんない します。","meaning":"I'll show you the way.","romaji":"goannai shimasu."},{"jp":"お持ちします。","kana":"おもち します。","meaning":"I'll carry it for you.","romaji":"omochi shimasu."}],"note":"Plain form: 預かります. The staff member's own action, said humbly.","level":"listen-only","romaji":"oazukari shimasu."},{"id":"foundations-decode-07","speaker":"staff","jp":"こちらにサインいただけますか？","kana":"こちら に サイン いただけます か？","meaning":"Could you sign here?","also_heard":[{"jp":"ご記入いただけますか？","kana":"ごきにゅう いただけます か？","meaning":"Could you fill this in?","romaji":"gokinyuu itadakemasu ka?"}],"note":"Plain form: サインしてもらえますか. Staff asking you to do something.","level":"listen-only","romaji":"kochira ni sain itadakemasu ka?"},{"id":"foundations-decode-08","speaker":"staff","jp":"確認させていただきます。","kana":"かくにん させて いただきます。","meaning":"I'll check it (humbly).","also_heard":[{"jp":"お預かりさせていただきます。","kana":"おあずかり させて いただきます。","meaning":"I'll take it for you (humbly).","romaji":"oazukari sasete itadakimasu."}],"note":"Plain form: 確認します.","level":"listen-only","romaji":"kakunin sasete itadakimasu."},{"id":"foundations-decode-09","speaker":"staff","jp":"在庫がございます。","kana":"ざいこ が ございます。","meaning":"We have it in stock.","note":"Example for the swap ございます = あります.","level":"listen-only","romaji":"zaiko ga gozaimasu."},{"id":"foundations-decode-10","speaker":"staff","jp":"担当の者がおります。","kana":"たんとう の もの が おります。","meaning":"The staff member is here.","note":"Example for the swap おります = います.","level":"listen-only","romaji":"tantou no mono ga orimasu."},{"id":"foundations-decode-11","speaker":"staff","jp":"すぐに参ります。","kana":"すぐ に まいります。","meaning":"I'll come right away.","note":"Example for the swap 参ります = 行きます or 来ます.","level":"listen-only","romaji":"sugu ni mairimasu."},{"id":"foundations-decode-12","speaker":"staff","jp":"どちらになさいますか？","kana":"どちら に なさいます か？","meaning":"Which will you have?","note":"Example for the swap なさいます = します.","level":"listen-only","romaji":"dochira ni nasaimasu ka?"},{"id":"foundations-decode-13","speaker":"staff","jp":"お一人でいらっしゃいますか？","kana":"おひとり で いらっしゃいます か？","meaning":"Are you here alone?","note":"Example for the swap いらっしゃいます = います or 来ます.","level":"listen-only","romaji":"ohitori de irasshaimasu ka?"},{"id":"foundations-decode-14","speaker":"staff","jp":"お味はいかがですか？","kana":"おあじ は いかが です か？","meaning":"How does it taste?","note":"Example for the swap いかが = どう.","level":"listen-only","romaji":"oaji wa ikaga desu ka?"},{"id":"foundations-decode-17","speaker":"staff","jp":"ただいま満席です。","kana":"ただいま まんせき です。","meaning":"We're full right now.","note":"Example for the swap ただいま = 今.","level":"listen-only","romaji":"tadaima manseki desu."},{"id":"foundations-decode-18","speaker":"staff","jp":"本日は定休日です。","kana":"ほんじつ は ていきゅうび です。","meaning":"Today is our regular closing day.","note":"Example for the swap 本日 = 今日.","level":"listen-only","romaji":"honjitsu wa teikyuubi desu."},{"id":"foundations-decode-19","speaker":"staff","jp":"あすは休業です。","kana":"あす は きゅうぎょう です。","meaning":"We're closed tomorrow.","note":"Example for the swap 明日 (あす) = あした.","level":"listen-only","romaji":"asu wa kyuugyou desu."},{"id":"foundations-decode-21","speaker":"staff","jp":"後ほどご確認ください。","kana":"のちほど ごかくにん ください。","meaning":"Please check it later.","note":"Example for the swap 後ほど = あとで.","level":"listen-only","romaji":"nochihodo gokakunin kudasai."},{"id":"foundations-decode-25","speaker":"staff","jp":"よろしければ、お茶をどうぞ。","kana":"よろしければ、 おちゃ を どうぞ。","meaning":"If you like, please have some tea.","note":"Example for the swap よろしければ = よかったら.","level":"listen-only","romaji":"yoroshikereba, ocha o douzo."},{"id":"foundations-decode-26","speaker":"staff","jp":"お支払いの方は、どうなさいますか？","kana":"おしはらい の ほう は、 どう なさいます か？","meaning":"How will you be paying?","note":"の方 (のほう) is a filler that adds no meaning. Plain form: お支払いは、どうしますか.","level":"listen-only","romaji":"oshiharai no hou wa, dou nasaimasu ka?"},{"id":"foundations-decode-27","speaker":"staff","jp":"お待ちくださいませ。","kana":"おまち くださいませ。","meaning":"Please wait (extra polite).","note":"Plain form: 待ってください. The ませ ending adds extra politeness.","level":"listen-only","romaji":"omachi kudasaimase."}]},{"title":"Numbers and prices at the register","intro":"This is how money is announced at the register, from the total, to a note paid, to the change.","phrases":[{"id":"foundations-price-01","speaker":"staff","jp":"1,280円になります。","kana":"せん にひゃく はちじゅう えん に なります。","meaning":"That's 1,280 yen.","also_heard":[{"jp":"お会計、1,280円でございます。","kana":"おかいけい、 せん にひゃく はちじゅう えん で ございます。","meaning":"Your total is 1,280 yen.","romaji":"okaikei, sen nihyaku hachijuu en de gozaimasu."},{"jp":"合計1,280円です。","kana":"ごうけい せん にひゃく はちじゅう えん です。","meaning":"The total is 1,280 yen.","romaji":"goukei sen nihyaku hachijuu en desu."},{"jp":"3点で1,280円です。","kana":"さんてん で せん にひゃく はちじゅう えん です。","meaning":"Three items for 1,280 yen.","romaji":"santen de sen nihyaku hachijuu en desu."}],"note":"Plain form: 1,280円です. Prices over 10,000 use 万: 12,800 yen is いちまん にせん はっぴゃく えん.","level":"listen-only","romaji":"sen nihyaku hachijuu en ni narimasu."},{"id":"foundations-price-02","speaker":"staff","jp":"5,000円からお預かりします。","kana":"ごせん えん から おあずかり します。","meaning":"I'm taking 5,000 yen from you.","also_heard":[{"jp":"5,000円お預かりします。","kana":"ごせん えん おあずかり します。","meaning":"I'm taking 5,000 yen.","romaji":"gosen en oazukari shimasu."}],"note":"から here means 'out of'. It is not a question. Your change comes next.","level":"listen-only","romaji":"gosen en kara oazukari shimasu."},{"id":"foundations-price-03","speaker":"staff","jp":"ちょうどお預かりします。","kana":"ちょうど おあずかり します。","meaning":"Exact amount, thank you.","also_heard":[{"jp":"ちょうどいただきます。","kana":"ちょうど いただきます。","meaning":"Exact amount, thank you.","romaji":"choudo itadakimasu."}],"level":"listen-only","romaji":"choudo oazukari shimasu."},{"id":"foundations-price-04","speaker":"staff","jp":"3,720円のお返しです。","kana":"さんぜん ななひゃく にじゅう えん の おかえし です。","meaning":"Here's your change, 3,720 yen.","also_heard":[{"jp":"お釣りになります。","kana":"おつり に なります。","meaning":"Here's your change.","romaji":"otsuri ni narimasu."},{"jp":"先に大きい方、3,000円のお返しです。","kana":"さき に おおきい ほう、 さんぜん えん の おかえし です。","meaning":"Bigger bills first, 3,000 yen change.","romaji":"saki ni ookii hou, sanzen en no okaeshi desu."},{"jp":"残り720円とレシートのお返しです。","kana":"のこり ななひゃく にじゅう えん と レシート の おかえし です。","meaning":"720 yen left, and your receipt.","romaji":"nokori nanahyaku nijuu en to reshiito no okaeshi desu."}],"note":"お返し is your change. Notes usually come first, then coins and the receipt.","level":"listen-only","romaji":"sanzen nanahyaku nijuu en no okaeshi desu."},{"id":"foundations-price-05","speaker":"staff","jp":"ご確認ください。","kana":"ごかくにん ください。","meaning":"Please check.","also_heard":[{"jp":"お確かめください。","kana":"おたしかめ ください。","meaning":"Please check to be sure.","romaji":"otashikame kudasai."}],"level":"listen-only","romaji":"gokakunin kudasai."},{"id":"foundations-price-06","speaker":"staff","jp":"細かいのございますか？","kana":"こまかい の ございます か？","meaning":"Do you have any small change?","also_heard":[{"jp":"80円お持ちですか？","kana":"はちじゅう えん おもち です か？","meaning":"Do you have 80 yen?","romaji":"hachijuu en omochi desu ka?"}],"replies":[{"jp":"あ、あります。","kana":"あ、 あります。","meaning":"Oh, yes I do.","romaji":"a, arimasu."},{"jp":"すみません、ないです。","kana":"すみません、 ない です。","meaning":"Sorry, I don't.","romaji":"sumimasen, nai desu."}],"note":"Staff ask this to round the change. 細かい means small coins.","level":"useful","romaji":"komakai no gozaimasu ka?"},{"id":"foundations-price-07","speaker":"you","jp":"一万円でも大丈夫ですか？","kana":"いち まん えん でも だいじょうぶ です か？","meaning":"Is a 10,000 yen note OK?","replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."},{"jp":"すみません、むずかしいです。","kana":"すみません、 むずかしい です。","meaning":"Sorry, that's difficult.","romaji":"sumimasen, muzukashii desu."}],"note":"Some small shops don't take large notes. Ask first.","level":"useful","romaji":"ichi man en demo daijoubu desu ka?"},{"id":"foundations-price-08","speaker":"staff","jp":"お一人様、二千円です。","kana":"おひとりさま、 にせん えん です。","meaning":"It's 2,000 yen per person.","note":"Per-person pricing, often seen at restaurants and attractions.","level":"useful","romaji":"ohitorisama, nisen en desu."}]},{"title":"Paying","intro":"The same questions come in the same order at most shops: method, card mode, PIN or signature, receipt, bag, points.","phrases":[{"id":"foundations-pay-01","speaker":"staff","jp":"お支払いはどうなさいますか？","kana":"おしはらい は どう なさいます か？","meaning":"How would you like to pay?","also_heard":[{"jp":"現金ですか、カードですか？","kana":"げんきん です か、 カード です か？","meaning":"Cash or card?","romaji":"genkin desu ka, kaado desu ka?"},{"jp":"お支払い方法は？","kana":"おしはらい ほうほう は？","meaning":"Payment method?","romaji":"oshiharai houhou wa?"}],"replies":[{"jp":"現金で。","kana":"げんきん で。","meaning":"Cash.","romaji":"genkin de."},{"jp":"カードで。","kana":"カード で。","meaning":"Card.","romaji":"kaado de."},{"jp":"スイカで。","kana":"スイカ で。","meaning":"Suica (IC card).","romaji":"suika de."}],"level":"core","romaji":"oshiharai wa dou nasaimasu ka?"},{"id":"foundations-pay-02","speaker":"you","jp":"クレジットカード、大丈夫ですか？","kana":"クレジットカード、 だいじょうぶ です か？","meaning":"Is a credit card OK?","also_heard":[{"jp":"カード、使えますか？","kana":"カード、 つかえます か？","meaning":"Can I use a card?","romaji":"kaado, tsukaemasu ka?"}],"replies":[{"jp":"はい、ご利用いただけます。","kana":"はい、 ごりよう いただけます。","meaning":"Yes, you can use it.","romaji":"hai, goriyou itadakemasu."},{"jp":"申し訳ございません、現金のみとなっております。","kana":"もうしわけ ございません、 げんきん のみ と なって おります。","meaning":"Sorry, cash only.","romaji":"moushiwake gozaimasen, genkin nomi to natte orimasu."}],"note":"現金のみ means cash only. Still common in small restaurants, shrines and rural shops.","level":"core","romaji":"kurejittokaado, daijoubu desu ka?"},{"id":"foundations-pay-03","speaker":"staff","jp":"一括でよろしいですか？","kana":"いっかつ で よろしい です か？","meaning":"One-time payment, OK?","also_heard":[{"jp":"一回払いでよろしいですか？","kana":"いっかいばらい で よろしい です か？","meaning":"Single payment, OK?","romaji":"ikkaibarai de yoroshii desu ka?"},{"jp":"お支払い回数はいかがなさいますか？","kana":"おしはらい かいすう は いかが なさいます か？","meaning":"How many installments?","romaji":"oshiharai kaisuu wa ikaga nasaimasu ka?"}],"replies":[{"jp":"はい、一括で。","kana":"はい、 いっかつ で。","meaning":"Yes, one-time.","romaji":"hai, ikkatsu de."}],"note":"Say はい, 一括で for one payment. 分割 (ぶんかつ) means instalments.","level":"core","romaji":"ikkatsu de yoroshii desu ka?"},{"id":"foundations-pay-04","speaker":"staff","jp":"こちらに差し込んでください。","kana":"こちら に さしこんで ください。","meaning":"Insert it here, please.","also_heard":[{"jp":"タッチしてください。","kana":"タッチ して ください。","meaning":"Tap, please.","romaji":"tatchi shite kudasai."},{"jp":"カードをお預かりします。","kana":"カード を おあずかり します。","meaning":"I'll take your card.","romaji":"kaado o oazukari shimasu."}],"note":"You often insert the card into the terminal yourself.","level":"listen-only","romaji":"kochira ni sashikonde kudasai."},{"id":"foundations-pay-05","speaker":"staff","jp":"暗証番号のご入力をお願いします。","kana":"あんしょう ばんごう の ごにゅうりょく を おねがい します。","meaning":"Please enter your PIN.","also_heard":[{"jp":"暗証番号を押して、確定を押してください。","kana":"あんしょう ばんごう を おして、 かくてい を おして ください。","meaning":"Press your PIN, then press confirm.","romaji":"anshou bangou o oshite, kakutei o oshite kudasai."}],"note":"Then press 確定 (かくてい), usually the green button.","level":"listen-only","romaji":"anshou bangou no gonyuuryoku o onegai shimasu."},{"id":"foundations-pay-06","speaker":"staff","jp":"こちらにサインをお願いします。","kana":"こちら に サイン を おねがい します。","meaning":"Please sign here.","also_heard":[{"jp":"サインいただけますか？","kana":"サイン いただけます か？","meaning":"Could you sign, please?","romaji":"sain itadakemasu ka?"}],"level":"listen-only","romaji":"kochira ni sain o onegai shimasu."},{"id":"foundations-pay-07","speaker":"staff","jp":"こちらお控えです。","kana":"こちら おひかえ です。","meaning":"Here's your copy.","also_heard":[{"jp":"カードとお控えのお返しです。","kana":"カード と おひかえ の おかえし です。","meaning":"Here's your card and your copy.","romaji":"kaado to ohikae no okaeshi desu."}],"note":"The copy is the card slip. Keep it in case you need it.","level":"listen-only","romaji":"kochira ohikae desu."},{"id":"foundations-pay-08","speaker":"you","jp":"交通系でお願いします。","kana":"こうつうけい で おねがい します。","meaning":"IC card, please.","also_heard":[{"jp":"スイカでお願いします。","kana":"スイカ で おねがい します。","meaning":"Suica, please.","romaji":"suika de onegai shimasu."}],"replies":[{"jp":"こちらにタッチしてください。","kana":"こちら に タッチ して ください。","meaning":"Please tap here.","romaji":"kochira ni tatchi shite kudasai."},{"jp":"ピッと鳴るまでお願いします。","kana":"ピッ と なる まで おねがい します。","meaning":"Hold it until it beeps.","romaji":"pi to naru made onegai shimasu."}],"note":"残高不足 means insufficient balance. Recharge (チャージ) first.","level":"core","romaji":"koutsuukei de onegai shimasu."},{"id":"foundations-pay-09","speaker":"you","jp":"タッチ決済できますか？","kana":"タッチ けっさい できます か？","meaning":"Can I pay by contactless tap?","replies":[{"jp":"はい、こちらにかざしてください。","kana":"はい、 こちら に かざして ください。","meaning":"Yes, hold it over here.","romaji":"hai, kochira ni kazashite kudasai."}],"note":"Look for the contactless symbol. Visa and Mastercard are common.","level":"useful","romaji":"tatchi kessai dekimasu ka?"},{"id":"foundations-pay-10","speaker":"staff","jp":"レシートはご利用ですか？","kana":"レシート は ごりよう です か？","meaning":"Do you need a receipt?","also_heard":[{"jp":"レシートご入用ですか？","kana":"レシート ごにゅうよう です か？","meaning":"Do you need a receipt?","romaji":"reshiito gonyuuyou desu ka?"},{"jp":"レシートは大丈夫ですか？","kana":"レシート は だいじょうぶ です か？","meaning":"Is a receipt OK?","romaji":"reshiito wa daijoubu desu ka?"}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"note":"Here 大丈夫です means no. The same words can mean yes in other questions.","level":"core","romaji":"reshiito wa goriyou desu ka?"},{"id":"foundations-pay-11","speaker":"you","jp":"領収書をお願いします。","kana":"りょうしゅうしょ を おねがい します。","meaning":"A formal receipt, please.","replies":[{"jp":"宛名はいかがなさいますか？","kana":"あてな は いかが なさいます か？","meaning":"What name should go on it?","romaji":"atena wa ikaga nasaimasu ka?"}],"note":"Answer 空欄で (くうらん, leave it blank) or 上様で (うえさま, made out to 'to whom it may concern').","level":"useful","romaji":"ryoushuusho o onegai shimasu."},{"id":"foundations-pay-12","speaker":"staff","jp":"ポイントアプリはお持ちですか？","kana":"ポイント アプリ は おもち です か？","meaning":"Do you have a points card or app?","replies":[{"jp":"はい、持っています。","kana":"はい、 もって います。","meaning":"Yes, I have it.","romaji":"hai, motte imasu."},{"jp":"持ってないです。","kana":"もって ない です。","meaning":"I don't have one.","romaji":"motte nai desu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No thanks.","romaji":"daijoubu desu."}],"level":"core","romaji":"pointo apuri wa omochi desu ka?"},{"id":"foundations-pay-13","speaker":"staff","jp":"袋は有料ですがよろしいですか？","kana":"ふくろ は ゆうりょう です が よろしい です か？","meaning":"Bags cost extra, is that OK?","also_heard":[{"jp":"袋はご利用ですか？","kana":"ふくろ は ごりよう です か？","meaning":"Do you need a bag?","romaji":"fukuro wa goriyou desu ka?"},{"jp":"袋お付けしますか？","kana":"ふくろ おつけ します か？","meaning":"Shall I put it in a bag?","romaji":"fukuro otsuke shimasu ka?"}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"note":"Bags cost about 3 to 5 yen. Say 大丈夫です to decline.","level":"core","romaji":"fukuro wa yuuryou desu ga yoroshii desu ka?"},{"id":"foundations-pay-14","speaker":"staff","jp":"こちらのトレーにどうぞ。","kana":"こちら の トレー に どうぞ。","meaning":"Please put it on this tray.","also_heard":[{"jp":"お釣りは下から出てきます。","kana":"おつり は した から でてきます。","meaning":"Change comes out from below.","romaji":"otsuri wa shita kara detekimasu."},{"jp":"お支払いはあちらの機械でお願いします。","kana":"おしはらい は あちら の きかい で おねがい します。","meaning":"Please pay at that machine over there.","romaji":"oshiharai wa achira no kikai de onegai shimasu."}],"note":"Put cash on the tray, not into the staff's hand. Self-pay machines are now common.","level":"useful","romaji":"kochira no toree ni douzo."}]},{"title":"Time, dates and opening hours","intro":"Reading hours and closures matters on this trip, because many places close or shorten hours around New Year.","phrases":[{"id":"foundations-time-01","speaker":"you","jp":"七時半に行きます。","kana":"しちじ はん に いきます。","meaning":"I'll go at 7:30.","also_heard":[{"jp":"四時です。","kana":"よじ です。","meaning":"It's 4 o'clock.","romaji":"yoji desu."},{"jp":"十分ぐらいです。","kana":"じゅっぷん ぐらい です。","meaning":"About 10 minutes.","romaji":"juppun gurai desu."}],"note":"4時 よじ, 7時 しちじ, 9時 くじ; 1分 いっぷん, 3分 さんぷん, 10分 じゅっぷん. Signs use 24-hour time, like 18:30.","level":"core","romaji":"shichiji han ni ikimasu."},{"id":"foundations-time-02","speaker":"you","jp":"明後日の午後に行きます。","kana":"あさって の ごご に いきます。","meaning":"I'll go the day after tomorrow, in the afternoon.","also_heard":[{"jp":"今日の午前","kana":"きょう の ごぜん","meaning":"This morning","romaji":"kyou no gozen"},{"jp":"昨日","kana":"きのう","meaning":"Yesterday","romaji":"kinou"}],"note":"Staff say 本日 (ほんじつ) for today and あす for tomorrow.","level":"core","romaji":"asatte no gogo ni ikimasu."},{"id":"foundations-time-03","speaker":"you","jp":"十二月三十一日に行きます。","kana":"じゅうにがつ さんじゅういちにち に いきます。","meaning":"I'll go on December 31.","also_heard":[{"jp":"一月一日はお休みですか？","kana":"いちがつ ついたち は おやすみ です か？","meaning":"Are you closed on January 1?","romaji":"ichigatsu tsuitachi wa oyasumi desu ka?"}],"note":"Irregular dates are in the vocab section. 大晦日 (おおみそか) is Dec 31, 元日 (がんじつ) is Jan 1.","level":"useful","romaji":"juunigatsu sanjuuichinichi ni ikimasu."},{"id":"foundations-time-04","speaker":"staff","jp":"十五分ほどお待ちいただきます。","kana":"じゅうごふん ほど おまち いただきます。","meaning":"Please wait about 15 minutes.","also_heard":[{"jp":"ただいま十分待ちです。","kana":"ただいま じゅっぷん まち です。","meaning":"The wait is 10 minutes right now.","romaji":"tadaima juppun machi desu."}],"replies":[{"jp":"大丈夫です、待ちます。","kana":"だいじょうぶ です、 まちます。","meaning":"That's fine, I'll wait.","romaji":"daijoubu desu, machimasu."},{"jp":"じゃ、また来ます。","kana":"じゃ、 また きます。","meaning":"Then I'll come back later.","romaji":"ja, mata kimasu."}],"note":"Plain form: 十五分ぐらい待ってください.","level":"listen-only","romaji":"juugofun hodo omachi itadakimasu."},{"id":"foundations-time-05","speaker":"you","jp":"何時に開きますか？","kana":"なんじ に あきます か？","meaning":"What time do you open?","also_heard":[{"jp":"明日もやってますか？","kana":"あした も やってます か？","meaning":"Are you open tomorrow too?","romaji":"ashita mo yattemasu ka?"}],"replies":[{"jp":"十時に開きます。","kana":"じゅうじ に あきます。","meaning":"We open at 10.","romaji":"juuji ni akimasu."},{"jp":"明日は定休日です。","kana":"あした は ていきゅうび です。","meaning":"Tomorrow is our regular closing day.","romaji":"ashita wa teikyuubi desu."}],"note":"やってますか means are you open. It is the natural spoken form.","level":"useful","romaji":"nanji ni akimasu ka?"}]}],"dialogues":[{"title":"A simple purchase","lines":[{"speaker":"staff","jp":"いらっしゃいませ。お次のお客様、どうぞ。","kana":"いらっしゃいませ。 おつぎ の おきゃくさま、 どうぞ。","meaning":"Welcome. Next customer, please.","romaji":"irasshaimase. otsugi no okyakusama, douzo."},{"speaker":"staff","jp":"袋はご利用ですか？","kana":"ふくろ は ごりよう です か？","meaning":"Do you need a bag?","romaji":"fukuro wa goriyou desu ka?"},{"speaker":"you","jp":"あ、大丈夫です。","kana":"あ、 だいじょうぶ です。","meaning":"No thanks.","romaji":"a, daijoubu desu."},{"speaker":"staff","jp":"ポイントカードはお持ちですか？","kana":"ポイントカード は おもち です か？","meaning":"Do you have a points card?","romaji":"pointokaado wa omochi desu ka?"},{"speaker":"you","jp":"いいえ。","kana":"いいえ。","meaning":"No.","romaji":"iie."},{"speaker":"staff","jp":"1,280円になります。","kana":"せん にひゃく はちじゅう えん に なります。","meaning":"That's 1,280 yen.","romaji":"sen nihyaku hachijuu en ni narimasu."},{"speaker":"staff","jp":"5,000円からお預かりします。","kana":"ごせん えん から おあずかり します。","meaning":"I'm taking 5,000 yen from you.","romaji":"gosen en kara oazukari shimasu."},{"speaker":"staff","jp":"先に大きい方、3,000円のお返しです。残り720円とレシートのお返しです。","kana":"さき に おおきい ほう、 さんぜん えん の おかえし です。 のこり ななひゃく にじゅう えん と レシート の おかえし です。","meaning":"First the bigger bills, 3,000 yen change. Then 720 yen and your receipt.","romaji":"saki ni ookii hou, sanzen en no okaeshi desu. nokori nanahyaku nijuu en to reshiito no okaeshi desu."},{"speaker":"staff","jp":"ありがとうございました。","kana":"ありがとう ございました。","meaning":"Thank you.","romaji":"arigatou gozaimashita."},{"speaker":"you","jp":"どうも。","kana":"どうも。","meaning":"Thanks.","romaji":"doumo."}]},{"title":"Asking for a place","lines":[{"speaker":"you","jp":"すみません、お手洗いはどこですか？","kana":"すみません、 おてあらい は どこ です か？","meaning":"Excuse me, where is the toilet?","romaji":"sumimasen, otearai wa doko desu ka?"},{"speaker":"staff","jp":"お手洗いでしたら、あちらの突き当たりを右に曲がっていただいて、エスカレーターの横になります。","kana":"おてあらい でしたら、 あちら の つきあたり を みぎ に まがって いただいて、 エスカレーター の よこ に なります。","meaning":"For the toilet, turn right at the end over there. It's next to the escalator.","romaji":"otearai deshitara, achira no tsukiatari o migi ni magatte itadaite, esukareetaa no yoko ni narimasu."},{"speaker":"you","jp":"すみません、もう一度ゆっくりお願いします。","kana":"すみません、 もういちど ゆっくり おねがい します。","meaning":"Sorry, once more, slowly please.","romaji":"sumimasen, mouichido yukkuri onegai shimasu."},{"speaker":"staff","jp":"はい。あちら、まっすぐ…右です。エスカレーターの横です。","kana":"はい。 あちら、 まっすぐ… みぎ です。 エスカレーター の よこ です。","meaning":"Yes. Over there, straight on, then right. It's next to the escalator.","romaji":"hai. achira, massugu... migi desu. esukareetaa no yoko desu."},{"speaker":"you","jp":"あ、わかりました。ありがとうございます。","kana":"あ、 わかりました。 ありがとう ございます。","meaning":"Oh, got it. Thank you.","romaji":"a, wakarimashita. arigatou gozaimasu."}]},{"title":"Card payment in early January","lines":[{"speaker":"staff","jp":"あけましておめでとうございます。お会計、12,800円でございます。","kana":"あけまして おめでとう ございます。 おかいけい、 いちまん にせん はっぴゃく えん で ございます。","meaning":"Happy New Year. Your total is 12,800 yen.","romaji":"akemashite omedetou gozaimasu. okaikei, ichiman nisen happyaku en de gozaimasu."},{"speaker":"you","jp":"カードで大丈夫ですか？","kana":"カード で だいじょうぶ です か？","meaning":"Is a card OK?","romaji":"kaado de daijoubu desu ka?"},{"speaker":"staff","jp":"はい、ご利用いただけます。一括でよろしいですか？","kana":"はい、 ごりよう いただけます。 いっかつ で よろしい です か？","meaning":"Yes, you can use it. One-time payment, OK?","romaji":"hai, goriyou itadakemasu. ikkatsu de yoroshii desu ka?"},{"speaker":"you","jp":"はい、一括で。","kana":"はい、 いっかつ で。","meaning":"Yes, one-time.","romaji":"hai, ikkatsu de."},{"speaker":"staff","jp":"こちらに差し込んで、暗証番号のご入力をお願いします。","kana":"こちら に さしこんで、 あんしょう ばんごう の ごにゅうりょく を おねがい します。","meaning":"Insert it here and enter your PIN.","romaji":"kochira ni sashikonde, anshou bangou no gonyuuryoku o onegai shimasu."},{"speaker":"staff","jp":"…お控えでございます。","kana":"… おひかえ で ございます。","meaning":"Here's your copy.","romaji":"... ohikae de gozaimasu."},{"speaker":"staff","jp":"恐れ入りますが、袋は有料ですがよろしいでしょうか？","kana":"おそれいります が、 ふくろ は ゆうりょう です が よろしい でしょう か？","meaning":"Excuse me, bags cost extra. Is that OK?","romaji":"osoreirimasu ga, fukuro wa yuuryou desu ga yoroshii deshou ka?"},{"speaker":"you","jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"speaker":"staff","jp":"ありがとうございました。またお越しくださいませ。","kana":"ありがとう ございました。 また おこし くださいませ。","meaning":"Thank you, please come again.","romaji":"arigatou gozaimashita. mata okoshi kudasaimase."}]}],"signs":[{"jp":"入口","kana":"いりぐち","meaning":"Entrance","where":"Doors and building entrances","romaji":"iriguchi"},{"jp":"出口","kana":"でぐち","meaning":"Exit","where":"Doors and building exits","romaji":"deguchi"},{"jp":"押","kana":"おす","meaning":"Push","where":"Doors","romaji":"osu"},{"jp":"引","kana":"ひく","meaning":"Pull","where":"Doors","romaji":"hiku"},{"jp":"営業中","kana":"えいぎょうちゅう","meaning":"Open for business","where":"Shop door or window","romaji":"eigyouchuu"},{"jp":"準備中","kana":"じゅんびちゅう","meaning":"Preparing, closed for now","where":"Shop door","romaji":"junbichuu"},{"jp":"本日休業","kana":"ほんじつ きゅうぎょう","meaning":"Closed today","where":"Shop door or notice","romaji":"honjitsu kyuugyou"},{"jp":"定休日","kana":"ていきゅうび","meaning":"Regular closing day","where":"Opening hours notice","romaji":"teikyuubi"},{"jp":"お手洗い","kana":"おてあらい","meaning":"Toilet (polite)","where":"Direction signs","romaji":"otearai"},{"jp":"トイレ","kana":"トイレ","meaning":"Toilet","where":"Direction signs","romaji":"toire"},{"jp":"化粧室","kana":"けしょうしつ","meaning":"Restroom (polite)","where":"Hotels, stations, large venues","romaji":"keshoushitsu"},{"jp":"男","kana":"おとこ","meaning":"Men","where":"Restroom doors","romaji":"otoko"},{"jp":"女","kana":"おんな","meaning":"Women","where":"Restroom doors","romaji":"onna"},{"jp":"殿方","kana":"とのがた","meaning":"Men (older style)","where":"Older restrooms","romaji":"tonogata"},{"jp":"婦人","kana":"ふじん","meanin "jp":"こちらへどうぞ。","kana":"こちら へ どうぞ。","meaning":"Please come this way.","romaji":"kochira e douzo."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes (or just walk over).","romaji":"hai."}],"note":"One queue often feeds several registers. Watch the staff's hand gesture.","level":"core","romaji":"otsugi no kata douzo."},{"id":"konbini-enter-03","speaker":"staff","jp":"お待たせしました。","kana":"おまたせ しました。","meaning":"Sorry to keep you waiting.","also_heard":[{"jp":"お待たせいたしました。","kana":"おまたせ いたしました。","meaning":"Sorry to keep you waiting (formal).","romaji":"omatase itashimashita."}],"replies":[{"jp":"いえ。","kana":"いえ。","meaning":"Not at all.","romaji":"ie."}],"level":"useful","romaji":"omatase shimashita."},{"id":"konbini-enter-04","speaker":"staff","jp":"お預かりします。","kana":"おあずかり します。","meaning":"I'll take these (and scan them).","level":"listen-only","romaji":"oazukari shimasu."},{"id":"konbini-enter-05","speaker":"staff","jp":"失礼します。","kana":"しつれい します。","meaning":"Excuse me (as they reach for your items).","level":"listen-only","romaji":"shitsurei shimasu."},{"id":"konbini-enter-06","speaker":"you","jp":"お願いします。","kana":"おねがい します。","meaning":"Please (ring these up).","note":"Say it as you put your items on the counter.","level":"core","romaji":"onegai shimasu."},{"id":"konbini-enter-07","speaker":"staff","jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"One moment, please.","also_heard":[{"jp":"ちょっとお待ちください。","kana":"ちょっと おまち ください。","meaning":"Just a moment, please.","romaji":"chotto omachi kudasai."},{"jp":"少しお待ちください。","kana":"すこし おまち ください。","meaning":"Please wait a little.","romaji":"sukoshi omachi kudasai."}],"note":"The clerk is stepping away. Wait where you are.","level":"useful","romaji":"shoushou omachi kudasai."},{"id":"konbini-enter-08","speaker":"staff","jp":"こちらでよろしいですか。","kana":"こちら で よろしい です か。","meaning":"Is this OK?","replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, that's fine.","romaji":"hai, onegai shimasu."},{"jp":"いえ、これじゃないです。","kana":"いえ、 これ じゃ ない です。","meaning":"No, not this one.","romaji":"ie, kore ja nai desu."}],"note":"Staff use this to confirm an item or choice.","level":"useful","romaji":"kochira de yoroshii desu ka."},{"id":"konbini-enter-09","speaker":"staff","jp":"以上でよろしいですか。","kana":"いじょう で よろしい です か。","meaning":"Is that everything?","also_heard":[{"jp":"以上でお間違いないですか。","kana":"いじょう で おまちがい ない です か。","meaning":"Is that everything, correct?","romaji":"ijou de omachigai nai desu ka."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, that's all.","romaji":"hai, onegai shimasu."},{"jp":"あ、あと、これもお願いします。","kana":"あ、 あと、 これ も おねがい します。","meaning":"Oh, and this one too, please.","romaji":"a, ato, kore mo onegai shimasu."}],"note":"Often comes right before the total. Name any extra item now.","level":"useful","romaji":"ijou de yoroshii desu ka."}]},{"title":"Point card or app","intro":"Almost every cashier asks. A bare no is enough.","phrases":[{"id":"konbini-point-01","speaker":"staff","jp":"ポイントカードはお持ちですか。","kana":"ポイントカード は おもち です か。","meaning":"Do you have a point card?","also_heard":[{"jp":"ポイントカードありますか。","kana":"ポイントカード あります か。","meaning":"Do you have a point card?","romaji":"pointokaado arimasu ka."},{"jp":"アプリはありますか。","kana":"アプリ は あります か。","meaning":"Do you have the app?","romaji":"apuri wa arimasu ka."}],"replies":[{"jp":"ないです。","kana":"ない です。","meaning":"No, I don't.","romaji":"nai desu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No thanks.","romaji":"daijoubu desu."},{"jp":"はい、これです。","kana":"はい、 これ です。","meaning":"Yes, here it is.","romaji":"hai, kore desu."}],"note":"A head shake also works. Each chain has its own points: Ponta, d Point, nanaco and others.","level":"core","romaji":"pointokaado wa omochi desu ka."},{"id":"konbini-point-02","speaker":"staff","jp":"dポイントやPontaなどは大丈夫ですか。","kana":"ディーポイント や ポンタ など は だいじょうぶ です か。","meaning":"Are d points or Ponta OK (do you use them)?","also_heard":[{"jp":"nanacoカードはお持ちですか。","kana":"ナナコカード は おもち です か。","meaning":"Do you have a nanaco card?","romaji":"nanakokaado wa omochi desu ka."},{"jp":"ポイントがつきました。","kana":"ポイント が つきました。","meaning":"Points have been added.","romaji":"pointo ga tsukimashita."}],"replies":[{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No thanks.","romaji":"daijoubu desu."}],"note":"At 7-Eleven the nanaco question can merge with the payment question.","level":"listen-only","romaji":"diipointo ya ponta nado wa daijoubu desu ka."},{"id":"konbini-point-03","speaker":"you","jp":"ポイントカードは持ってないです。","kana":"ポイントカード は もって ない です。","meaning":"I don't have a point card.","note":"Shorter: ないです. Also fine: 持ってません.","level":"core","romaji":"pointokaado wa motte nai desu."}]},{"title":"Bags","intro":"Bags have been charged since 2020. The question is whether you want one.","phrases":[{"id":"konbini-bag-01","speaker":"staff","jp":"袋はご利用ですか。","kana":"ふくろ は ごりよう です か。","meaning":"Do you want a bag?","also_heard":[{"jp":"袋はどうされますか。","kana":"ふくろ は どう されます か。","meaning":"What about a bag?","romaji":"fukuro wa dou saremasu ka."},{"jp":"袋はお付けしますか。","kana":"ふくろ は おつけ します か。","meaning":"Shall I include a bag?","romaji":"fukuro wa otsuke shimasu ka."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."},{"jp":"いらないです。","kana":"いらない です。","meaning":"I don't need one.","romaji":"iranai desu."}],"note":"Bags cost a few yen each. Here 大丈夫です means no.","level":"core","romaji":"fukuro wa goriyou desu ka."},{"id":"konbini-bag-02","speaker":"staff","jp":"袋は大きいのと小さいの、どちらにしますか。","kana":"ふくろ は おおきい の と ちいさい の、 どちら に します か。","meaning":"Large bag or small bag?","also_heard":[{"jp":"おサイズはSでよろしいですか。","kana":"おサイズ は エス で よろしい です か。","meaning":"Is size S OK?","romaji":"osaizu wa esu de yoroshii desu ka."}],"replies":[{"jp":"小さい方で。","kana":"ちいさい ほう で。","meaning":"The small one.","romaji":"chiisai hou de."},{"jp":"大きい方でお願いします。","kana":"おおきい ほう で おねがい します。","meaning":"The large one, please.","romaji":"ookii hou de onegai shimasu."}],"level":"useful","romaji":"fukuro wa ookii no to chiisai no, dochira ni shimasu ka."},{"id":"konbini-bag-03","speaker":"you","jp":"袋お願いします。","kana":"ふくろ おねがい します。","meaning":"A bag, please.","note":"Also works: 袋ください.","level":"core","romaji":"fukuro onegai shimasu."},{"id":"konbini-bag-04","speaker":"you","jp":"そのままで大丈夫です。","kana":"そのまま で だいじょうぶ です。","meaning":"No bag, it's fine as it is.","note":"Also works: 袋はいらないです.","level":"core","romaji":"sonomama de daijoubu desu."},{"id":"konbini-bag-05","speaker":"staff","jp":"温かいものと冷たいものは分けますか。","kana":"あたたかい もの と つめたい もの は わけます か。","meaning":"Should I separate hot and cold items?","also_heard":[{"jp":"温かいものは別にしますか。","kana":"あたたかい もの は べつ に します か。","meaning":"Shall I bag the hot items separately?","romaji":"atatakai mono wa betsu ni shimasu ka."}],"replies":[{"jp":"はい、分けてください。","kana":"はい、 わけて ください。","meaning":"Yes, please separate them.","romaji":"hai, wakete kudasai."},{"jp":"一緒で大丈夫です。","kana":"いっしょ で だいじょうぶ です。","meaning":"Together is fine.","romaji":"issho de daijoubu desu."}],"note":"In winter, hot drinks and steamed buns are often bagged apart from cold items.","level":"useful","romaji":"atatakai mono to tsumetai mono wa wakemasu ka."},{"id":"konbini-bag-06","speaker":"staff","jp":"お弁当、袋に入れてもよろしいですか。","kana":"おべんとう、 ふくろ に いれて も よろしい です か。","meaning":"Shall I put the bento in a bag?","also_heard":[{"jp":"袋に入れておきますね。","kana":"ふくろ に いれて おきます ね。","meaning":"I'll put it in a bag for you.","romaji":"fukuro ni irete okimasu ne."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"level":"listen-only","romaji":"obentou, fukuro ni irete mo yoroshii desu ka."},{"id":"konbini-bag-07","speaker":"staff","jp":"テープでよろしいですか。","kana":"テープ で よろしい です か。","meaning":"Is tape OK?","also_heard":[{"jp":"テープを貼りましょうか。","kana":"テープ を はりましょう か。","meaning":"Shall I put tape on it?","romaji":"teepu o harimashou ka."},{"jp":"シールでいいですか。","kana":"シール で いい です か。","meaning":"Is a sticker OK?","romaji":"shiiru de ii desu ka."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"That's fine.","romaji":"daijoubu desu."}],"note":"For one item with no bag, staff may stick a tape or sticker on it as proof of purchase. This is normal.","level":"useful","romaji":"teepu de yoroshii desu ka."},{"id":"konbini-bag-08","speaker":"you","jp":"袋をもう一つください。","kana":"ふくろ を もう ひとつ ください。","meaning":"One more bag, please.","note":"Also: 袋、ひとつ追加で. Each bag may be charged.","level":"useful","romaji":"fukuro o mou hitotsu kudasai."}]},{"title":"Heating food and cutlery","intro":"The microwave question and what staff add to the bag.","phrases":[{"id":"konbini-heat-01","speaker":"staff","jp":"お弁当、温めますか。","kana":"おべんとう、 あたためます か。","meaning":"Shall I heat the bento?","also_heard":[{"jp":"温めはよろしいですか。","kana":"あたため は よろしい です か。","meaning":"Do you want it heated?","romaji":"atatame wa yoroshii desu ka."},{"jp":"少しお時間かかりますが、よろしいですか。","kana":"すこし おじかん かかります が、 よろしい です か。","meaning":"It takes a little time, is that OK?","romaji":"sukoshi ojikan kakarimasu ga, yoroshii desu ka."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please heat it.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."},{"jp":"そのままで。","kana":"そのまま で。","meaning":"As it is.","romaji":"sonomama de."}],"note":"A microwave can take a few minutes. Bento stickers may show 温め or 温め不要.","level":"core","romaji":"obentou, atatamemasu ka."},{"id":"konbini-heat-02","speaker":"you","jp":"温めてください。","kana":"あたためて ください。","meaning":"Please heat it.","note":"Also works: 温めお願いします.","level":"core","romaji":"atatamete kudasai."},{"id":"konbini-heat-03","speaker":"you","jp":"温めなくて大丈夫です。","kana":"あたためなくて だいじょうぶ です。","meaning":"No need to heat it.","note":"Also works: そのままでいいです.","level":"c
