tails written down.","romaji":"taishikan"},{"jp":"運休","kana":"うんきゅう","meaning":"Service suspended","where":"Trains, buses or ferries not running that day.","romaji":"unkyuu"},{"jp":"運転見合わせ","kana":"うんてん みあわせ","meaning":"Service on hold","where":"Service is paused and may restart. Check the boards.","romaji":"unten miawase"},{"jp":"欠航","kana":"けっこう","meaning":"Flight cancelled","where":"Airport departure boards.","romaji":"kekkou"},{"jp":"遅延","kana":"ちえん","meaning":"Delay","where":"Departure boards and station boards.","romaji":"chien"},{"jp":"大雪","kana":"おおゆき","meaning":"Heavy snow","where":"Weather warnings. Expect disruption to roads and trains.","romaji":"ooyuki"},{"jp":"防災","kana":"ぼうさい","meaning":"Disaster prevention","where":"Signs for disaster information points and drills.","romaji":"bousai"}],"vocab":[{"title":"Direction words","items":[{"jp":"まっすぐ","kana":"まっすぐ","meaning":"straight","romaji":"massugu"},{"jp":"右","kana":"みぎ","meaning":"right","romaji":"migi"},{"jp":"左","kana":"ひだり","meaning":"left","romaji":"hidari"},{"jp":"曲がる","kana":"まがる","meaning":"to turn","romaji":"magaru"},{"jp":"信号","kana":"しんごう","meaning":"traffic light","romaji":"shingou"},{"jp":"交差点","kana":"こうさてん","meaning":"intersection","romaji":"kousaten"},{"jp":"角","kana":"かど","meaning":"corner","romaji":"kado"},{"jp":"橋","kana":"はし","meaning":"bridge","romaji":"hashi"},{"jp":"向かい","kana":"むかい","meaning":"opposite","romaji":"mukai"},{"jp":"隣","kana":"となり","meaning":"next to","romaji":"tonari"},{"jp":"手前","kana":"てまえ","meaning":"before, this side","romaji":"temae"},{"jp":"突き当たり","kana":"つきあたり","meaning":"end of the street","romaji":"tsukiatari"},{"jp":"反対","kana":"はんたい","meaning":"opposite side","romaji":"hantai"},{"jp":"先","kana":"さき","meaning":"ahead","romaji":"saki"},{"jp":"奥","kana":"おく","meaning":"far inside","romaji":"oku"},{"jp":"渡る","kana":"わたる","meaning":"to cross","romaji":"wataru"},{"jp":"横断歩道","kana":"おうだんほどう","meaning":"crosswalk","romaji":"oudanhodou"},{"jp":"歩道橋","kana":"ほどうきょう","meaning":"pedestrian bridge","romaji":"hodoukyou"},{"jp":"分","kana":"ふん","meaning":"minutes","romaji":"fun"},{"jp":"ぐらい","kana":"ぐらい","meaning":"about","romaji":"gurai"}]},{"title":"Colours","items":[{"jp":"黒","kana":"くろ","meaning":"black","romaji":"kuro"},{"jp":"白","kana":"しろ","meaning":"white","romaji":"shiro"},{"jp":"赤","kana":"あか","meaning":"red","romaji":"aka"},{"jp":"青","kana":"あお","meaning":"blue","romaji":"ao"},{"jp":"緑","kana":"みどり","meaning":"green","romaji":"midori"},{"jp":"茶色","kana":"ちゃいろ","meaning":"brown","romaji":"chairo"},{"jp":"灰色","kana":"はいいろ","meaning":"grey","romaji":"haiiro"},{"jp":"黄色","kana":"きいろ","meaning":"yellow","romaji":"kiiro"},{"jp":"ピンク","kana":"ピンク","meaning":"pink","romaji":"pinku"},{"jp":"紺","kana":"こん","meaning":"navy","romaji":"kon"}]},{"title":"Sizes and materials","items":[{"jp":"大きい","kana":"おおきい","meaning":"big","romaji":"ookii"},{"jp":"小さい","kana":"ちいさい","meaning":"small","romaji":"chiisai"},{"jp":"長い","kana":"ながい","meaning":"long","romaji":"nagai"},{"jp":"短い","kana":"みじかい","meaning":"short","romaji":"mijikai"},{"jp":"手のひら","kana":"てのひら","meaning":"palm-sized","romaji":"tenohira"},{"jp":"薄い","kana":"うすい","meaning":"thin","romaji":"usui"},{"jp":"厚い","kana":"あつい","meaning":"thick","romaji":"atsui"},{"jp":"革","kana":"かわ","meaning":"leather","romaji":"kawa"},{"jp":"布","kana":"ぬの","meaning":"cloth","romaji":"nuno"},{"jp":"プラスチック","kana":"プラスチック","meaning":"plastic","romaji":"purasuchikku"},{"jp":"金属","kana":"きんぞく","meaning":"metal","romaji":"kinzoku"},{"jp":"ナイロン","kana":"ナイロン","meaning":"nylon","romaji":"nairon"}]},{"title":"Items","items":[{"jp":"財布","kana":"さいふ","meaning":"wallet","romaji":"saifu"},{"jp":"携帯","kana":"けいたい","meaning":"mobile phone","romaji":"keitai"},{"jp":"スマホ","kana":"スマホ","meaning":"smartphone","romaji":"sumaho"},{"jp":"パスポート","kana":"パスポート","meaning":"passport","romaji":"pasupooto"},{"jp":"かばん","kana":"かばん","meaning":"bag","romaji":"kaban"},{"jp":"リュック","kana":"リュック","meaning":"backpack","romaji":"ryukku"},{"jp":"鍵","kana":"かぎ","meaning":"key","romaji":"kagi"},{"jp":"カード","kana":"カード","meaning":"card","romaji":"kaado"},{"jp":"傘","kana":"かさ","meaning":"umbrella","romaji":"kasa"},{"jp":"眼鏡","kana":"めがね","meaning":"glasses","romaji":"megane"},{"jp":"カメラ","kana":"カメラ","meaning":"camera","romaji":"kamera"}]},{"title":"Emergency words","items":[{"jp":"火事","kana":"かじ","meaning":"fire","romaji":"kaji"},{"jp":"地震","kana":"じしん","meaning":"earthquake","romaji":"jishin"},{"jp":"津波","kana":"つなみ","meaning":"tsunami","romaji":"tsunami"},{"jp":"避難","kana":"ひなん","meaning":"evacuation","romaji":"hinan"},{"jp":"救急車","kana":"きゅうきゅうしゃ","meaning":"ambulance","romaji":"kyuukyuusha"},{"jp":"警察","kana":"けいさつ","meaning":"police","romaji":"keisatsu"},{"jp":"事故","kana":"じこ","meaning":"accident","romaji":"jiko"},{"jp":"泥棒","kana":"どろぼう","meaning":"thief","romaji":"dorobou"},{"jp":"スリ","kana":"スリ","meaning":"pickpocket","romaji":"suri"},{"jp":"危ない","kana":"あぶない","meaning":"dangerous","romaji":"abunai"},{"jp":"助けて","kana":"たすけて","meaning":"help","romaji":"tasukete"},{"jp":"落ち着いて","kana":"おちついて","meaning":"stay calm","romaji":"ochitsuite"},{"jp":"けが","kana":"けが","meaning":"injury","romaji":"kega"},{"jp":"停電","kana":"ていでん","meaning":"power cut","romaji":"teiden"},{"jp":"断水","kana":"だんすい","meaning":"water cut","romaji":"dansui"}]}],"_num":"11"},{"slug":"kanji","title":"Kanji and signs index","title_jp":"漢字","summary":"Read machines, panels and signs, grouped by place","situations":[{"title":"Asking about a sign or a button","intro":"When a sign, button or screen beats you, ask someone nearby: staff, a station attendant or a friendly passer-by.","phrases":[{"id":"kanji-ask-01","speaker":"you","jp":"すみません、これは何と読みますか。","kana":"すみません、 これ は なん と よみます か。","meaning":"Excuse me, how do you read this?","also_heard":[{"jp":"これ、何て読むんですか。","kana":"これ、 なんて よむ ん です か。","meaning":"How do you read this?","romaji":"kore, nante yomu n desu ka."},{"jp":"この字、何ですか。","kana":"この じ、 なん です か。","meaning":"What is this character?","romaji":"kono ji, nan desu ka."}],"replies":[{"jp":"「でぐち」と読みます。","kana":"「でぐち」と よみます。","meaning":"It is read deguchi (exit).","romaji":"\"deguchi\"to yomimasu."},{"jp":"「ひじょうぐち」です。","kana":"「ひじょうぐち」です。","meaning":"It is hijoguchi (emergency exit).","romaji":"\"hijouguchi\"desu."}],"note":"Point at the sign while you ask.","level":"core","romaji":"sumimasen, kore wa nan to yomimasu ka."},{"id":"kanji-ask-02","speaker":"you","jp":"この漢字の意味は何ですか。","kana":"この かんじ の いみ は なん です か。","meaning":"What does this kanji mean?","also_heard":[{"jp":"これ、どういう意味ですか。","kana":"これ、 どういう いみ です か。","meaning":"What does this mean?","romaji":"kore, douiu imi desu ka."}],"replies":[{"jp":"「休み」っていう意味です。","kana":"「やすみ」っていう いみ です。","meaning":"It means rest or closed.","romaji":"\"yasumi\"tteiu imi desu."},{"jp":"ここは入れません、という意味です。","kana":"ここ は はいれません、 という いみ です。","meaning":"It means you cannot enter here.","romaji":"koko wa hairemasen, toiu imi desu."}],"note":"どういう意味 is the more natural way to say it when speaking.","level":"core","romaji":"kono kanji no imi wa nan desu ka."},{"id":"kanji-ask-03","speaker":"you","jp":"これは英語で何ですか。","kana":"これ は えいご で なん です か。","meaning":"What is this in English?","also_heard":[{"jp":"英語で何と言いますか。","kana":"えいご で なん と いいます か。","meaning":"What do you call this in English?","romaji":"eigo de nan to iimasu ka."},{"jp":"英語で言うと？","kana":"えいご で いう と？","meaning":"How would you say it in English?","romaji":"eigo de iu to?"}],"replies":[{"jp":"えーと、「exit」です。","kana":"えーと、 「エグジット」です。","meaning":"Um, it is exit.","romaji":"eeto, \"egujitto\"desu."},{"jp":"うーん、英語はちょっと…。","kana":"うーん、 えいご は ちょっと…。","meaning":"Hmm, my English is not great.","romaji":"uun, eigo wa chotto...."}],"note":"Many people know the word but freeze up. Be patient and point at the sign.","level":"core","romaji":"kore wa eigo de nan desu ka."},{"id":"kanji-ask-04","speaker":"you","jp":"ここに書いてもらえますか。","kana":"ここ に かいて もらえます か。","meaning":"Could you write it here?","also_heard":[{"jp":"紙に書いてもらえますか。","kana":"かみ に かいて もらえます か。","meaning":"Could you write it on paper?","romaji":"kami ni kaite moraemasu ka."},{"jp":"スマホに打ってもらえますか。","kana":"スマホ に うって もらえます か。","meaning":"Could you type it on my phone?","romaji":"sumaho ni utte moraemasu ka."}],"replies":[{"jp":"はい、いいですよ。","kana":"はい、 いい です よ。","meaning":"Yes, of course.","romaji":"hai, ii desu yo."},{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Here you go.","romaji":"douzo."}],"note":"Hand over your notebook or phone with a translation app open.","level":"core","romaji":"koko ni kaite moraemasu ka."},{"id":"kanji-ask-05","speaker":"you","jp":"ふりがなを書いてもらえますか。","kana":"ふりがな を かいて もらえます か。","meaning":"Could you write the reading (furigana)?","also_heard":[{"jp":"ひらがなで書いてもらえますか。","kana":"ひらがな で かいて もらえます か。","meaning":"Could you write it in hiragana?","romaji":"hiragana de kaite moraemasu ka."},{"jp":"読み方も書いてもらえますか。","kana":"よみかた も かいて もらえます か。","meaning":"Could you also write how to read it?","romaji":"yomikata mo kaite moraemasu ka."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."},{"jp":"これでいいですか。","kana":"これ で いい です か。","meaning":"Is this OK?","romaji":"kore de ii desu ka."}],"note":"Useful for place names and station names you cannot read.","level":"useful","romaji":"furigana o kaite moraemasu ka."},{"id":"kanji-ask-06","speaker":"you","jp":"どのボタンを押せばいいですか。","kana":"どの ボタン を おせば いい です か。","meaning":"Which button should I press?","also_heard":[{"jp":"どれを押せばいいですか。","kana":"どれ を おせば いい です か。","meaning":"Which one should I press?","romaji":"dore o oseba ii desu ka."},{"jp":"次はどこを押しますか。","kana":"つぎ は どこ を おします か。","meaning":"Where do I press next?","romaji":"tsugi wa doko o oshimasu ka."}],"replies":[{"jp":"これです。","kana":"これ です。","meaning":"This one.","romaji":"kore desu."},{"jp":"この緑のボタンを押してください。","kana":"この みどり の ボタン を おして ください。","meaning":"Press the green button.","romaji":"kono midori no botan o oshite kudasai."},{"jp":"先に「確認」を押してください。","kana":"さき に 「かくにん」 を おして ください。","meaning":"Press Confirm first.","romaji":"saki ni \"kakunin\" o oshite kudasai."}],"note":"Works on ticket machines, ATMs, toilets and lifts.","level":"core","romaji":"dono botan o oseba ii desu ka."},{"id":"kanji-ask-07","speaker":"you","jp":"これを押してもいいですか。","kana":"これ を おして も いい です か。","meaning":"Is it OK to press this?","also_heard":[{"jp":"押しても大丈夫ですか。","kana":"おして も だいじょうぶ です か。","meaning":"Is it all right to press it?","romaji":"oshite mo daijoubu desu ka."},{"jp":"これ、押していいですか。","kana":"これ、 おして いい です か。","meaning":"Can I press this?","romaji":"kore, oshite ii desu ka."}],"replies":[{"jp":"はい、大丈夫ですよ。","kana":"はい、 だいじょうぶ です よ。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu yo."},{"jp":"あ、それは押さないでください。非常用です。","kana":"あ、 それ は おさない で ください。 ひじょうよう です。","meaning":"Oh, please don't press that. It is for emergencies.","romaji":"a, sore wa osanai de kudasai. hijouyou desu."}],"note":"Ask before pressing anything red or marked 非常 or 呼出. Those are for emergencies.","level":"core","romaji":"kore o oshite mo ii desu ka."},{"id":"kanji-ask-08","speaker":"you","jp":"英語の表示に変えられますか。","kana":"えいご の ひょうじ に かえられます か。","meaning":"Can it be switched to English?","also_heard":[{"jp":"英語の画面はありますか。","kana":"えいご の がめん は あります か。","meaning":"Is there an English screen?","romaji":"eigo no gamen wa arimasu ka."},{"jp":"英語のメニューはありますか。","kana":"えいご の メニュー は あります か。","meaning":"Is there an English menu?","romaji":"eigo no menyuu wa arimasu ka."}],"replies":[{"jp":"右上の「English」を押してください。","kana":"みぎうえ の 「イングリッシュ」 を おして ください。","meaning":"Press English at the top right.","romaji":"migiue no \"ingurisshu\" o oshite kudasai."},{"jp":"すみません、日本語だけなんです。","kana":"すみません、 にほんご だけ なん です。","meaning":"Sorry, it is Japanese only.","romaji":"sumimasen, nihongo dake nan desu."}],"note":"Look first for an English button or a Language button (言語).","level":"core","romaji":"eigo no hyouji ni kaeraremasu ka."},{"id":"kanji-ask-09","speaker":"you","jp":"使い方を教えてください。","kana":"つかいかた を おしえて ください。","meaning":"Please show me how to use it.","also_heard":[{"jp":"使い方がわからないんですが…。","kana":"つかいかた が わから ない ん です が…。","meaning":"I don't know how to use it...","romaji":"tsukaikata ga wakara nai n desu ga...."},{"jp":"これ、どうやって使いますか。","kana":"これ、 どうやって つかいます か。","meaning":"How do you use this?","romaji":"kore, douyatte tsukaimasu ka."}],"replies":[{"jp":"まずここにお金を入れて、次にボタンを押します。","kana":"まず ここ に おかね を いれて、 つぎ に ボタン を おします。","meaning":"First put money in here, then press the button.","romaji":"mazu koko ni okane o irete, tsugi ni botan o oshimasu."},{"jp":"少々お待ちください、係の者を呼びます。","kana":"しょうしょう おまち ください、 かかり の もの を よびます。","meaning":"Please wait, I will call a staff member.","romaji":"shoushou omachi kudasai, kakari no mono o yobimasu."}],"note":"Works for washing machines, lockers and ticket kiosks.","level":"core","romaji":"tsukaikata o oshiete kudasai."},{"id":"kanji-ask-10","speaker":"staff","jp":"何かお困りですか。","kana":"なに か おこまり です か。","meaning":"Do you need some help?","also_heard":[{"jp":"どうされましたか。","kana":"どう されました か。","meaning":"What seems to be the matter?","romaji":"dou saremashita ka."},{"jp":"大丈夫ですか。","kana":"だいじょうぶ です か。","meaning":"Are you all right?","romaji":"daijoubu desu ka."}],"replies":[{"jp":"この機械の使い方がわからなくて…。","kana":"この きかい の つかいかた が わから なくて…。","meaning":"I don't know how to use this machine...","romaji":"kono kikai no tsukaikata ga wakara nakute...."},{"jp":"これ、何て書いてありますか。","kana":"これ、 なんて かいて あります か。","meaning":"What does this say?","romaji":"kore, nante kaite arimasu ka."}],"note":"Staff or passers-by may come to you first. You can answer with the phrases above.","level":"listen-only","romaji":"nani ka okomari desu ka."}]}],"vocab":[{"title":"Building-block kanji","intro":"Twenty kanji that build most signs; learn to spot them and you can guess half of what you see.","items":[{"jp":"入","kana":"いり","meaning":"enter, in","hint":"as in 入口, entrance","romaji":"iri"},{"jp":"出","kana":"で","meaning":"exit, out","hint":"as in 出口, exit","romaji":"de"},{"jp":"口","kana":"ぐち","meaning":"opening, gate","hint":"as in 北口, north exit","romaji":"guchi"},{"jp":"中","kana":"ちゅう","meaning":"in progress, inside","hint":"as in 工事中, under construction","romaji":"chuu"},{"jp":"上","kana":"うえ","meaning":"up, above","hint":"as in 屋上 おくじょう, rooftop","romaji":"ue"},{"jp":"下","kana":"した","meaning":"down, below","hint":"as in 地下 ちか, basement","romaji":"shita"},{"jp":"内","kana":"ない","meaning":"inside","hint":"as in 館内 かんない, inside the building","romaji":"nai"},{"jp":"前","kana":"まえ","meaning":"front, before","hint":"as in 駅前 えきまえ, in front of the station","romaji":"mae"},{"jp":"後","kana":"うしろ","meaning":"behind, back","hint":"as in 後ろ乗り, board at the rear","romaji":"ushiro"},{"jp":"止","kana":"し","meaning":"stop","hint":"as in 中止, cancelled","romaji":"shi"},{"jp":"禁","kana":"きん","meaning":"forbidden","hint":"as in 禁止, forbidden","romaji":"kin"},{"jp":"無","kana":"む","meaning":"none, without","hint":"as in 無料, free of charge","romaji":"mu"},{"jp":"有","kana":"ゆう","meaning":"with, there is","hint":"as in 有料, paid","romaji":"yuu"},{"jp":"不","kana":"ふ","meaning":"not, un-","hint":"as in 不可, not allowed","romaji":"fu"},{"jp":"可","kana":"か","meaning":"allowed, possible","hint":"as in カード可, cards accepted","romaji":"ka"},{"jp":"要","kana":"よう","meaning":"required","hint":"as in 要予約, booking needed","romaji":"you"},{"jp":"済","kana":"ずみ","meaning":"done, finished","hint":"as in 確認済み, already checked","romaji":"zumi"},{"jp":"満","kana":"まん","meaning":"full","hint":"as in 満車, car park full","romaji":"man"},{"jp":"空","kana":"あき","meaning":"empty, vacant","hint":"as in 空き, vacant","romaji":"aki"},{"jp":"料","kana":"りょう","meaning":"fee, charge","hint":"as in 料金, fare or charge","romaji":"ryou"}]},{"title":"Prohibition and warning patterns","intro":"Words that tell you not to do something, or to be careful. Learn these and most do-not signs become clear.","items":[{"jp":"禁止","kana":"きんし","meaning":"prohibited","hint":"as in 禁煙, no smoking","romaji":"kinshi"},{"jp":"厳禁","kana":"げんきん","meaning":"strictly prohibited","hint":"stronger than 禁止","romaji":"genkin"},{"jp":"火気厳禁","kana":"かきげんきん","meaning":"no open flames","hint":"common at gas stations","romaji":"kakigenkin"},{"jp":"注意","kana":"ちゅうい","meaning":"caution, watch out","hint":"as in 足元注意, watch your step","romaji":"chuui"},{"jp":"足元注意","kana":"あしもとちゅうい","meaning":"watch your step","hint":"wet or icy floors","romaji":"ashimotochuui"},{"jp":"不可","kana":"ふか","meaning":"not allowed","hint":"as in ペット不可, no pets","romaji":"fuka"},{"jp":"お断り","kana":"おことわり","meaning":"not accepted, refused","hint":"as in 撮影お断り, no photos","romaji":"okotowari"},{"jp":"ご遠慮ください","kana":"ごえんりょ ください","meaning":"please refrain","hint":"polite way to say do not","romaji":"goenryo kudasai"},{"jp":"危険","kana":"きけん","meaning":"danger","hint":"keep away","romaji":"kiken"},{"jp":"立入禁止","kana":"たちいりきんし","meaning":"no entry","hint":"as in 関係者以外立入禁止, staff only beyond this point","romaji":"tachiirikinshi"},{"jp":"飲食禁止","kana":"いんしょくきんし","meaning":"no eating or drinking","hint":"common in museums and shops","romaji":"inshokukinshi"},{"jp":"フラッシュ禁止","kana":"フラッシュきんし","meaning":"no flash photography","hint":"museums and aquariums","romaji":"furasshukinshi"},{"jp":"ポイ捨て禁止","kana":"ポイすてきんし","meaning":"no littering","hint":"streets and parks","romaji":"poisutekinshi"},{"jp":"土足禁止","kana":"どそくきんし","meaning":"no outdoor shoes","hint":"take your shoes off here","romaji":"dosokukinshi"},{"jp":"手を触れないでください","kana":"てを ふれないで ください","meaning":"please do not touch","hint":"exhibits and displays","romaji":"teo furenaide kudasai"},{"jp":"歩きスマホ","kana":"あるきスマホ","meaning":"walking while using a phone","hint":"signs often ask you to stop","romaji":"arukisumaho"},{"jp":"係員","kana":"かかりいん","meaning":"staff, attendant","hint":"as in 係員にお声がけください, please ask staff","romaji":"kakariin"}]},{"title":"Doors, lifts, floors and building boards","intro":"Getting in, out, up and down any building, station or hotel.","items":[{"jp":"入口","kana":"いりぐち","meaning":"entrance","romaji":"iriguchi"},{"jp":"出口","kana":"でぐち","meaning":"exit","romaji":"deguchi"},{"jp":"押","kana":"おす","meaning":"push","hint":"on doors","romaji":"osu"},{"jp":"引","kana":"ひく","meaning":"pull","hint":"on doors","romaji":"hiku"},{"jp":"自動ドア","kana":"じどうドア","meaning":"automatic door","hint":"stand close; it may need a button","romaji":"jidoudoa"},{"jp":"手動","kana":"しゅどう","meaning":"manual","hint":"as in 手動で開けてください, open it by hand","romaji":"shudou"},{"jp":"開","kana":"ひらく","meaning":"open","hint":"lift button: means open","romaji":"hiraku"},{"jp":"閉","kana":"しめる","meaning":"close","hint":"lift button: means close","romaji":"shimeru"},{"jp":"階","kana":"かい","meaning":"floor","hint":"as in 2階 にかい, second floor","romaji":"kai"},{"jp":"地下","kana":"ちか","meaning":"basement","hint":"B1 is 地下1階","romaji":"chika"},{"jp":"屋上","kana":"おくじょう","meaning":"rooftop","hint":"often a department store roof","romaji":"okujou"},{"jp":"定員","kana":"ていいん","meaning":"capacity","hint":"lift capacity sign","romaji":"teiin"},{"jp":"満員","kana":"まんいん","meaning":"full","hint":"lift is full; a buzzer may sound","romaji":"man'in"},{"jp":"非常停止","kana":"ひじょうていし","meaning":"emergency stop","hint":"escalator; for emergencies only","romaji":"hijouteishi"},{"jp":"手すりにおつかまりください","kana":"てすり に おつかまり ください","meaning":"please hold the handrail","hint":"escalators","romaji":"tesuri ni otsukamari kudasai"},{"jp":"段差注意","kana":"だんさちゅうい","meaning":"mind the step","hint":"uneven floor level","romaji":"dansachuui"},{"jp":"現在地","kana":"げんざいち","meaning":"you are here","hint":"on floor maps","romaji":"genzaichi"},{"jp":"非常階段","kana":"ひじょうかいだん","meaning":"emergency stairs","hint":"often at the end of hotel corridors","romaji":"hijoukaidan"},{"jp":"客室","kana":"きゃくしつ","meaning":"guest rooms","hint":"corridor sign with room numbers","romaji":"kyakushitsu"},{"jp":"従業員専用","kana":"じゅうぎょういんせんよう","meaning":"staff only","hint":"do not enter","romaji":"juugyouinsen'you"}]},{"title":"Toilets and washlet panels","intro":"Public toilets and the control panel beside the seat. Press 止 first if anything starts spraying.","items":[{"jp":"お手洗い","kana":"おてあらい","meaning":"toilet, restroom","hint":"also トイレ or 化粧室","romaji":"otearai"},{"jp":"空き","kana":"あき","meaning":"vacant","hint":"door sign: 空き or 使用中","romaji":"aki"},{"jp":"流す","kana":"ながす","meaning":"flush","hint":"button or lever","romaji":"nagasu"},{"jp":"大","kana":"だい","meaning":"big flush","hint":"lever turned to 大","romaji":"dai"},{"jp":"小","kana":"しょう","meaning":"small flush","hint":"lever turned to 小","romaji":"shou"},{"jp":"おしり","kana":"おしり","meaning":"rear wash","hint":"washlet panel","romaji":"oshiri"},{"jp":"ビデ","kana":"ビデ","meaning":"bidet, front wash","hint":"washlet panel","romaji":"bide"},{"jp":"止","kana":"とめる","meaning":"stop","hint":"washlet panel: stops the spray","romaji":"tomeru"},{"jp":"音姫","kana":"おとひめ","meaning":"flushing-sound button","hint":"product name; built into some washlets","romaji":"otohime"},{"jp":"乾燥","kana":"かんそう","meaning":"warm-air dryer","hint":"after washing","romaji":"kansou"},{"jp":"便座","kana":"べんざ","meaning":"toilet seat","hint":"as in 便座温度, seat warmth","romaji":"benza"},{"jp":"洋式","kana":"ようしき","meaning":"Western-style toilet","hint":"sit-down toilet","romaji":"youshiki"},{"jp":"和式","kana":"わしき","meaning":"Japanese-style toilet","hint":"squat toilet","romaji":"washiki"},{"jp":"多目的トイレ","kana":"たもくてきトイレ","meaning":"multipurpose toilet","hint":"accessible, often with baby changing","romaji":"tamokutekitoire"},{"jp":"呼出","kana":"よびだし","meaning":"emergency call","hint":"NOT a flush; it alerts staff","romaji":"yobidashi"},{"jp":"自動洗浄","kana":"じどうせんじょう","meaning":"automatic flush","hint":"flushes on its own","romaji":"jidousenjou"},{"jp":"手をかざしてください","kana":"てを かざして ください","meaning":"please hold your hand near the sensor","hint":"sensor flush or tap","romaji":"teo kazashite kudasai"},{"jp":"トイレットペーパー以外流さないでください","kana":"トイレットペーパー いがい ながさ ないで ください","meaning":"flush only toilet paper","hint":"use the bin for everything else","romaji":"toirettopeepaa igai nagasa naide kudasai"}]},{"title":"Vending machines, coin lockers and coin machines","intro":"Drink machines, coin lockers and any machine that takes coins or notes.","items":[{"jp":"あたたかい","kana":"あたたかい","meaning":"hot (drink)","hint":"red label under the drink","romaji":"atatakai"},{"jp":"つめたい","kana":"つめたい","meaning":"cold (drink)","hint":"blue label under the drink","romaji":"tsumetai"},{"jp":"売切","kana":"うりきれ","meaning":"sold out","hint":"lamp on the button; printed without り","romaji":"urikire"},{"jp":"つり銭切れ","kana":"つりせんぎれ","meaning":"no change available","hint":"use exact money","romaji":"tsurisengire"},{"jp":"千円札","kana":"せんえんさつ","meaning":"1,000-yen note","hint":"note slot","romaji":"sen'ensatsu"},{"jp":"紙幣","kana":"しへい","meaning":"banknotes","hint":"as in 紙幣投入口, note slot","romaji":"shihei"},{"jp":"硬貨","kana":"こうか","meaning":"coins","hint":"as in 硬貨投入口, coin slot","romaji":"kouka"},{"jp":"使用できる硬貨","kana":"しようできるこうか","meaning":"coins accepted","hint":"lists which coins the machine takes","romaji":"shiyoudekirukouka"},{"jp":"投入口","kana":"とうにゅうぐち","meaning":"insertion slot","hint":"for coins, notes or cards","romaji":"tounyuuguchi"},{"jp":"返却レバー","kana":"へんきゃく レバー","meaning":"coin return lever","hint":"as in 返却, return","romaji":"henkyaku rebaa"},{"jp":"取出口","kana":"とりだしぐち","meaning":"take-out slot","hint":"your drink drops here","romaji":"toridashiguchi"},{"jp":"おつり","kana":"おつり","meaning":"change","hint":"change comes back here","romaji":"otsuri"},{"jp":"鍵","kana":"かぎ","meaning":"key","hint":"locker key; do not lose it","romaji":"kagi"},{"jp":"施錠","kana":"せじょう","meaning":"lock","hint":"locker screen step","romaji":"sejou"},{"jp":"解錠","kana":"かいじょう","meaning":"unlock","hint":"開錠 is also seen; same reading","romaji":"kaijou"},{"jp":"超過料金","kana":"ちょうかりょうきん","meaning":"overtime charge","hint":"pay before the locker opens","romaji":"choukaryoukin"}]},{"title":"Ticket machines and gates","intro":"Screens on ticket and IC-card machines, and messages on gates. Train vocabulary itself is in the Trains module.","items":[{"jp":"枚数","kana":"まいすう","meaning":"number of tickets","hint":"pick 1枚, 2枚 and so on","romaji":"maisuu"},{"jp":"取消","kana":"とりけし","meaning":"cancel","hint":"start over","romaji":"torikeshi"},{"jp":"確認","kana":"かくにん","meaning":"confirm, check","hint":"press to go on","romaji":"kakunin"},{"jp":"戻る","kana":"もどる","meaning":"back","hint":"previous screen","romaji":"modoru"},{"jp":"次へ","kana":"つぎへ","meaning":"next","hint":"next screen","romaji":"tsugihe"},{"jp":"完了","kana":"かんりょう","meaning":"done, complete","hint":"transaction finished","romaji":"kanryou"},{"jp":"発行","kana":"はっこう","meaning":"issue","hint":"ticket or receipt","romaji":"hakkou"},{"jp":"領収書","kana":"りょうしゅうしょ","meaning":"receipt","hint":"as in 領収書発行, issue a receipt","romaji":"ryoushuusho"},{"jp":"残額","kana":"ざんがく","meaning":"remaining balance","hint":"IC card balance","romaji":"zangaku"},{"jp":"小児","kana":"しょうに","meaning":"child fare","hint":"some machines say こども instead","romaji":"shouni"},{"jp":"運賃表","kana":"うんちんひょう","meaning":"fare chart","hint":"map above the machines","romaji":"unchinhyou"},{"jp":"料金不足","kana":"りょうきんふそく","meaning":"fare insufficient","hint":"gate closes; settle at the fare adjustment machine","romaji":"ryoukinfusoku"},{"jp":"IC専用","kana":"アイシーせんよう","meaning":"IC card only","hint":"this gate takes no paper tickets","romaji":"aishiisen'you"},{"jp":"きっぷをお取りください","kana":"きっぷ を おとりください","meaning":"please take your ticket","hint":"do not leave it in the gate","romaji":"kippu o otorikudasai"},{"jp":"払いもどし","kana":"はらいもどし","meaning":"refund","hint":"ticket refund button","romaji":"haraimodoshi"},{"jp":"入場券","kana":"にゅうじょうけん","meaning":"platform ticket","hint":"also admission ticket","romaji":"nyuujouken"}]},{"title":"ATM and card terminal screens","intro":"Bank, convenience store and post-office ATMs, and the card terminal at shop counters.","items":[{"jp":"お引き出し","kana":"おひきだし","meaning":"withdrawal","hint":"cho const PLANNED = [];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let favs = new Set(store.get('jpg-favs', []));
let opt = Object.assign({core:false, ro:true, mean:true}, store.get('jpg-opt', {}));
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const ICON_SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.6 2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z"/></svg>';
const WHO = {staff:'They say', you:'You say', announcement:'Announcement', sign:'Sign'};
const LVL = {core:'Core', useful:'Useful', 'listen-only':'Listen only'};

// flat index of every phrase for search and saved
const ALL = [];
DATA.forEach(m => m.situations.forEach(s => (s.phrases || []).forEach(p => {
  const parts = [p.jp, p.kana, p.romaji, p.meaning, p.note];
  (p.also_heard || []).forEach(a => parts.push(a.jp, a.kana, a.romaji));
  (p.replies || []).forEach(a => parts.push(a.jp, a.kana, a.romaji, a.meaning));
  const t = parts.filter(Boolean).join(' ').toLowerCase();
  ALL.push({m, s, p, text: t + ' ' + t.replace(/[\s\-']/g, '')});
})));

// signs and word-list entries are searchable too
DATA.forEach(m => {
  (m.signs || []).forEach(o => ALL.push({m, s: {title: 'Signs'}, o, text: [o.jp, o.kana, o.romaji, o.meaning, o.where].filter(Boolean).join(' ').toLowerCase()}));
  (m.vocab || []).forEach(v => v.items.forEach(o => ALL.push({m, s: {title: v.title}, o, text: [o.jp, o.kana, o.romaji, o.meaning, o.hint].filter(Boolean).join(' ').toLowerCase()})));
});
ALL.forEach(x => { if(!x.p) x.text += ' ' + x.text.replace(/[\s\-']/g, ''); });
function mini(x){
  const o = x.o, extra = o.where || o.hint;
  return `<article class="card word"><div class="from">${esc(x.m.title + ' · ' + x.s.title)}</div><div class="head"><span class="who word">Written</span><span class="sp"></span>${spk(o.jp)}</div>${lines(o)}${extra ? `<div class="note">${esc(extra)}</div>` : ''}</article>`;
}
function spk(text){ return canSpeak ? `<button class="ib say" data-say="${esc(text)}" aria-label="Listen">${ICON_SPK}</button>` : ''; }
function lines(o){
  return `<div class="jp" lang="ja">${esc(o.jp)}</div><div class="kana" lang="ja">${esc(o.kana)}</div><div class="ro">${esc(o.romaji)}</div>` +
    (o.meaning ? `<div class="mean">${esc(o.meaning)}</div>` : '');
}
function card(p, from){
  const you = p.speaker === 'you';
  let h = `<article class="card${you ? ' you' : ''}">`;
  if(from) h += `<div class="from">${esc(from)}</div>`;
  h += `<div class="head"><span class="who">${WHO[p.speaker] || 'They say'}</span><span class="lvl ${p.level === 'core' ? 'core' : ''}">${LVL[p.level] || ''}</span><span class="sp"></span>${spk(p.jp)}<button class="ib fav" data-fav="${esc(p.id)}" aria-pressed="${favs.has(p.id)}" aria-label="Save">${ICON_STAR}</button></div>`;
  h += lines(p);
  if(p.also_heard && p.also_heard.length){
    h += `<div class="sub"><div class="sublabel">You may also hear</div>` + p.also_heard.map(a => `<div class="row alt"><div class="tx">${lines(a)}</div>${spk(a.jp)}</div>`).join('') + `</div>`;
  }
  if(p.replies && p.replies.length){
    h += `<div class="sub"><div class="sublabel">${you ? 'They may answer' : 'You can answer'}</div>` + p.replies.map(a => `<div class="row${you ? ' alt' : ''}"><div class="tx">${lines(a)}</div>${spk(a.jp)}</div>`).join('') + `</div>`;
  }
  if(p.note) h += `<div class="note">${esc(p.note)}</div>`;
  return h + `</article>`;
}
function dialogue(d){
  return `<div class="dlg"><h3>${esc(d.title)}</h3>` + d.lines.map(l => `<div class="line${l.speaker === 'you' ? ' you' : ''}"><span class="who${l.speaker === 'you' ? ' you' : ''}">${l.speaker === 'you' ? 'You' : 'Staff'}</span>${lines(l)}</div>`).join('') + `</div>`;
}
const show = p => !opt.core || p.level === 'core';

function home(){
  $('#ttl').textContent = 'Japanese Trip Phrasebook'; $('#sub').textContent = '旅の日本語'; $('#back').classList.remove('on');
  let h = `<p class="lede">Pick a situation. Blue cards are what you will hear, yellow cards are what you say.</p><div class="prow"><button class="pbtn" data-go="quiz-all">Practice core phrases</button><button class="pbtn ghost" data-go="quiz-saved">Practice saved</button></div><div class="topics">`;
  DATA.forEach(m => {
    const n = m.situations.reduce((a, s) => a + (s.phrases || []).length, 0);
    h += `<button class="topic" data-go="${esc(m.slug)}"><span class="jp" lang="ja">${esc(m.title_jp)}</span><span class="tt"><b>${esc(m.title)}</b><span>${esc(m.summary)}</span></span><span class="n">${n} phrases</span></button>`;
  });
  PLANNED.forEach(m => { h += `<div class="topic soon"><span class="jp" lang="ja">${esc(m.title_jp)}</span><span class="tt"><b>${esc(m.title)}</b><span>Coming next</span></span></div>`; });
  $('#main').innerHTML = h + `</div>`;
}
function module(m){
  $('#ttl').textContent = m.title; $('#sub').textContent = m.title_jp; $('#back').classList.add('on');
  const extra = [];
  if(m.dialogues && m.dialogues.length) extra.push(['dialogues', 'Dialogues']);
  if(m.signs && m.signs.length) extra.push(['signs', 'Signs']);
  if(m.vocab && m.vocab.length){ if(m.vocab.length > 8) m.vocab.forEach((v, i) => extra.push(['v' + i, v.title])); else extra.push(['vocab', 'Word lists']); }
  let h = `<nav class="chips" aria-label="Sections"><button class="chip" style="background:var(--ink);color:var(--bg)" data-go="quiz-${esc(m.slug)}">Practice</button>` + m.situations.map((s, i) => `<button class="chip" data-jump="s${i}">${esc(s.title)}</button>`).join('') + extra.map(e => `<button class="chip" data-jump="${e[0]}">${e[1]}</button>`).join('') + `</nav>`;
  m.situations.forEach((s, i) => {
    const ps = (s.phrases || []).filter(show);
    h += `<h2 id="s${i}">${esc(s.title)}</h2>` + (s.intro ? `<p class="intro">${esc(s.intro)}</p>` : '') + `<div class="cards">` + (ps.length ? ps.map(p => card(p)).join('') : `<div class="intro">No core phrases here. Turn off Core only to see all.</div>`) + `</div>`;
  });
  if(m.dialogues && m.dialogues.length) h += `<h2 id="dialogues">Dialogues</h2><p class="intro">Full exchanges, start to finish.</p><div class="cards">` + m.dialogues.map(dialogue).join('') + `</div>`;
  if(m.signs && m.signs.length) h += `<h2 id="signs">Signs and labels</h2><p class="intro">What you will see written.</p><div class="signs">` + m.signs.map(s => `<div class="sign"><div class="jp" lang="ja">${esc(s.jp)}</div><div class="kana" lang="ja">${esc(s.kana)}</div><div class="ro">${esc(s.romaji)}</div><div class="mean">${esc(s.meaning)}</div>${s.where ? `<div class="where">${esc(s.where)}</div>` : ''}</div>`).join('') + `</div>`;
  if(m.vocab && m.vocab.length){
    h += `<h2 id="vocab">Word lists</h2>`;
    m.vocab.forEach((v, i) => { h += `<h3 class="vt" id="v${i}">${esc(v.title)}</h3>` + (v.intro ? `<p class="intro">${esc(v.intro)}</p>` : '') + `<div class="tblw"><table>` + v.items.map(x => `<tr><td class="j" lang="ja">${esc(x.jp)}</td><td><span lang="ja">${esc(x.kana)}</span><br><i class="ro">${esc(x.romaji)}</i></td><td><span class="mean">${esc(x.meaning)}</span>${x.hint ? `<div class="hint">${esc(x.hint)}</div>` : ''}</td></tr>`).join('') + `</table></div>`; });
  }
  $('#main').innerHTML = h;
}
function list(title, sub, items){
  $('#ttl').textContent = title; $('#sub').textContent = sub; $('#back').classList.add('on');
  $('#main').innerHTML = items.length ? `<div class="cards" style="margin-top:14px">` + items.map(x => x.p ? card(x.p, x.m.title + ' · ' + x.s.title) : mini(x)).join('') + `</div>` : `<p class="empty">${title === 'Saved' ? 'Nothing saved yet. Tap the star on any phrase.' : 'No phrase matches. Try romaji, kana or an English word.'}</p>`;
}
let Q = {key: null, pool: [], i: 0, shown: false};
function quizPool(key){
  let pool = ALL.filter(x => x.p);
  if(key === 'saved') pool = pool.filter(x => favs.has(x.p.id));
  else if(key === 'all') pool = pool.filter(x => x.p.level === 'core');
  else { pool = pool.filter(x => x.m.slug === key); if(opt.core) pool = pool.filter(x => x.p.level === 'core'); }
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool;
}
function quiz(key){
  if(Q.key !== key){ Q = {key, pool: quizPool(key), i: 0, shown: false}; }
  const m = DATA.find(m => m.slug === key);
  $('#ttl').textContent = 'Practice'; $('#sub').textContent = m ? m.title : (key === 'saved' ? 'Saved phrases' : 'Core phrases, all topics'); $('#back').classList.add('on');
  if(!Q.pool.length){ $('#main').innerHTML = `<p class="empty">${key === 'saved' ? 'Nothing saved yet. Tap the star on any phrase first.' : 'No phrases to practise here.'}</p>`; return; }
  const x = Q.pool[Q.i], p = x.p, you = p.speaker === 'you';
  let h = `<div class="quiz"><div class="count">${Q.i + 1} of ${Q.pool.length} · ${esc(x.m.title)} · ${esc(x.s.title)}</div>`;
  if(you) h += `<div class="ask">How do you say this?</div><div class="bigen">${esc(p.meaning)}</div>`;
  else h += `<div class="ask">${p.speaker === 'announcement' ? 'You hear this announcement. What does it mean?' : 'They say this. What does it mean, and what do you answer?'}</div><div class="head"><div class="big" lang="ja">${esc(p.jp)}</div><span class="sp"></span>${spk(p.jp)}</div>`;
  if(Q.shown){
    h += `<div class="ans">`;
    if(you) h += `<div class="head"><div class="big" lang="ja">${esc(p.jp)}</div><span class="sp"></span>${spk(p.jp)}</div><div class="kana" lang="ja">${esc(p.kana)}</div><div class="ro" style="display:block">${esc(p.romaji)}</div>`;
    else {
      h += `<div class="kana" lang="ja">${esc(p.kana)}</div><div class="ro" style="display:block">${esc(p.romaji)}</div><div class="mean show" style="filter:none">${esc(p.meaning)}</div>`;
      if(p.replies && p.replies.length) h += `<div class="sub"><div class="sublabel">You can answer</div>` + p.replies.map(a => `<div class="row"><div class="tx"><div class="jp" lang="ja">${esc(a.jp)}</div><div class="ro" style="display:block">${esc(a.romaji)}</div><div class="mean show" style="filter:none">${esc(a.meaning || '')}</div></div>${spk(a.jp)}</div>`).join('') + `</div>`;
    }
    if(p.note) h += `<div class="note">${esc(p.note)}</div>`;
    h += `</div>`;
  }
  h += `<div class="prow">` + (Q.shown ? '' : `<button class="pbtn" id="q-show">Show answer</button>`) + `<button class="pbtn${Q.shown ? '' : ' ghost'}" id="q-next">Next</button><button class="ib fav" data-fav="${esc(p.id)}" aria-pressed="${favs.has(p.id)}" aria-label="Save">${ICON_STAR}</button></div></div>`;
  $('#main').innerHTML = h;
}
function render(){
  document.body.classList.toggle('noro', !opt.ro);
  document.body.classList.toggle('nomean', !opt.mean);
  $('#o-core').setAttribute('aria-pressed', opt.core); $('#o-ro').setAttribute('aria-pressed', opt.ro); $('#o-mean').setAttribute('aria-pressed', opt.mean);
  const q = $('#q').value.trim().toLowerCase();
  if(q){ const q2 = q.replace(/[\s\-']/g, ''); return list('Search', q, ALL.filter(x => x.text.includes(q) || x.text.includes(q2)).slice(0, 60)); }
  const h = location.hash.replace('#', '');
  if(h === 'saved') return list('Saved', 'Your starred phrases', ALL.filter(x => x.p && favs.has(x.p.id)));
  if(h.startsWith('quiz-')) return quiz(h.slice(5));
  Q.key = null;
  const m = DATA.find(m => m.slug === h);
  if(m) return module(m);
  home();
}
function go(h){ if(location.hash.replace('#', '') === h) render(); else location.hash = h; window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const t = e.target.closest('button,.mean'); if(!t) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.jump){ const el = document.getElementById(t.dataset.jump); if(el) el.scrollIntoView({block: 'start'}); return; }
  if(t.dataset.say){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.dataset.say); u.lang = 'ja-JP'; u.rate = 0.85; speechSynthesis.speak(u); }catch(err){} return; }
  if(t.dataset.fav){ const id = t.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); store.set('jpg-favs', [...favs]); t.setAttribute('aria-pressed', favs.has(id)); return; }
  if(t.classList.contains('mean')){ t.classList.toggle('show'); return; }
  if(t.id === 'q-show'){ Q.shown = true; return render(); }
  if(t.id === 'q-next'){ Q.i = (Q.i + 1) % Q.pool.length; Q.shown = false; render(); return window.scrollTo(0, 0); }
  if(t.id === 'back'){ $('#q').value = ''; return go('home'); }
  if(t.id === 'savedbtn'){ $('#q').value = ''; return go('saved'); }
  if(t.id === 'o-core'){ opt.core = !opt.core; } else if(t.id === 'o-ro'){ opt.ro = !opt.ro; } else if(t.id === 'o-mean'){ opt.mean = !opt.mean; } else return;
  store.set('jpg-opt', opt); render();
});
$('#q').addEventListener('input', render);
window.addEventListener('hashchange', render);
render();
</script>

<script>(function(){
var win=window,doc=document,MSG='trip-planner:phrasebook-fullscreen',PICK='.jp,.big,td.j';
var framed=!!win.parent&&win.parent!==win;
var canSpeak='speechSynthesis' in win&&'SpeechSynthesisUtterance' in win;
var box=null,fitBox,inner,jp,kana,mean,say,shut,back=null,hidden=[];
function tell(open){if(!framed)return;try{win.parent.postMessage({type:MSG,open:open},win.location.origin);}catch(e){}}
function pick(t){var el=t&&t.closest?t.closest(PICK):null;return el&&!el.closest('button,a,.tp-staff')?el:null;}
function child(scope,cls){if(!scope)return '';for(var i=0;i<scope.children.length;i++)if(scope.children[i].classList.contains(cls))return scope.children[i].textContent.trim();return '';}
function about(el){
var text=el.textContent.trim();
if(el.matches('td.j')){var row=el.parentNode,cell=row.cells&&row.cells[1],k=cell&&cell.querySelector('[lang="ja"]'),m=row.querySelector('.mean');return {jp:text,kana:k?k.textContent.trim():'',mean:m?m.textContent.trim():''};}
var scope=el.parentNode;if(el.classList.contains('big')&&scope&&scope.classList.contains('head'))scope=scope.parentNode;
return {jp:text,kana:child(scope,'kana'),mean:child(scope,'mean')};
}
function build(){
box=doc.createElement('div');box.className='tp-staff';box.hidden=true;
box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Phrase shown large');
box.innerHTML='<div class="tp-staff-fit"><div class="tp-staff-in"><div class="tp-staff-jp" lang="ja"></div><div class="tp-staff-kana" lang="ja"></div></div></div>'+
'<div class="tp-staff-mean"></div><div class="tp-staff-bar">'+
'<button type="button" class="tp-staff-say"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Listen</button>'+
'<button type="button" class="tp-staff-close"><span aria-hidden="true">&#10005;</span>Close</button></div>';
fitBox=box.querySelector('.tp-staff-fit');inner=box.querySelector('.tp-staff-in');jp=box.querySelector('.tp-staff-jp');kana=box.querySelector('.tp-staff-kana');
mean=box.querySelector('.tp-staff-mean');say=box.querySelector('.tp-staff-say');shut=box.querySelector('.tp-staff-close');
box.addEventListener('click',function(e){if(e.target.closest('.tp-staff-say'))speak();else close();});
doc.body.appendChild(box);
}
function speak(){try{var s=win.speechSynthesis;s.cancel();var u=new win.SpeechSynthesisUtterance(jp.textContent);u.lang='ja-JP';u.rate=0.85;s.speak(u);}catch(e){}}
function fit(){
if(!box||box.hidden)return;
var w=fitBox.clientWidth,h=fitBox.clientHeight;if(!w||!h)return;
var lo=16,hi=Math.max(17,Math.min(w,h)+1);
while(hi-lo>1){var mid=(lo+hi)>>1;inner.style.fontSize=mid+'px';if(inner.scrollWidth<=w&&inner.scrollHeight<=h)lo=mid;else hi=mid;}
inner.style.fontSize=lo+'px';
}
function open(el){
if(!box)build();
var a=about(el);
jp.textContent=a.jp;kana.textContent=a.kana===a.jp?'':a.kana;kana.hidden=!kana.textContent;
mean.textContent=a.mean;mean.hidden=!a.mean;say.hidden=!canSpeak;
back=el;hidden=[];
for(var c=doc.body.firstElementChild;c;c=c.nextElementSibling)if(c!==box&&!c.hasAttribute('inert')){c.setAttribute('inert','');hidden.push(c);}
box.hidden=false;doc.documentElement.classList.add('tp-staff-on');
tell(true);fit();shut.focus();
}
function close(){
if(!box||box.hidden)return;
box.hidden=true;doc.documentElement.classList.remove('tp-staff-on');

tell(false);
if(back&&back.isConnected)back.focus();back=null;
}
function mark(){var els=doc.querySelectorAll(PICK);for(var i=0;i<els.length;i++){var el=els[i];if(el.hasAttribute('tabindex')||!pick(el))continue;el.setAttribute('tabindex','0');if(el.tagName!=='TD')el.setAttribute('role','button');}}
doc.addEventListener('click',function(e){
if(box&&!box.hidden)return;
var sel=win.getSelection&&win.getSelection();if(sel&&!sel.isCollapsed&&String(sel).trim())return;
var el=pick(e.target);if(el)open(el);
});
doc.addEventListener('keydown',function(e){
if(box&&!box.hidden){
if(e.key==='Escape'){e.preventDefault();close();}
else if(e.key==='Tab'){var f=say.hidden?[shut]:[say,shut],i=f.indexOf(doc.activeElement);e.preventDefault();f[(i+(e.shiftKey?f.length-1:1))%f.length].focus();}
return;
}
var el=pick(e.target);if((e.key==='Enter'||e.key===' ')&&el){e.preventDefault();open(el);}
});
win.addEventListener('resize',fit);
win.addEventListener('pagehide',function(){if(box&&!box.hidden)tell(false);});
mark();
var main=doc.getElementById('main');
if(main&&win.MutationObserver)new win.MutationObserver(mark).observe(main,{childList:true,subtree:true});
})();</script>
