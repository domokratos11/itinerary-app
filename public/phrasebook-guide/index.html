す か？","meaning":"Would you like a receipt?","romaji":"reshiito wa goriyou desu ka?"}],"note":"Staff say the amount they received. Listen for the number, then wait for your change.","level":"listen-only","romaji":"sen en oazukari shimasu."}]},{"title":"Paying and leaving","intro":"At many casual places you pay at the register near the door, not at the table.","phrases":[{"id":"restaurants-pay-01","speaker":"you","jp":"すみません、お会計をお願いします。","kana":"すみません、 おかいけい を おねがい します。","meaning":"Excuse me, the bill please.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."},{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"Please wait a moment.","romaji":"shoushou omachi kudasai."}],"note":"Staff may not come straight away. Saying this out loud or catching their eye is normal.","level":"core","romaji":"sumimasen, okaikei o onegai shimasu."},{"id":"restaurants-pay-02","speaker":"staff","jp":"お会計はレジでお願いします。","kana":"おかいけい は レジ で おねがい します。","meaning":"Please pay at the register.","also_heard":[{"jp":"伝票をお持ちください。","kana":"でんぴょう を おもち ください。","meaning":"Please take the slip with you.","romaji":"denpyou o omochi kudasai."}],"replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"Take the slip (伝票) from your table to the register by the door.","level":"core","romaji":"okaikei wa reji de onegai shimasu."},{"id":"restaurants-pay-03","speaker":"staff","jp":"お会計は一緒ですか？","kana":"おかいけい は いっしょ です か？","meaning":"Together or separate?","also_heard":[{"jp":"ご一緒ですか？","kana":"ごいっしょ です か？","meaning":"Together?","romaji":"goissho desu ka?"}],"replies":[{"jp":"一緒でお願いします。","kana":"いっしょ で おねがい します。","meaning":"Together, please.","romaji":"issho de onegai shimasu."},{"jp":"別々でお願いします。","kana":"べつべつ で おねがい します。","meaning":"Separately, please.","romaji":"betsubetsu de onegai shimasu."}],"note":"Decide before you order in a group, since separate bills are harder to split later.","level":"core","romaji":"okaikei wa issho desu ka?"},{"id":"restaurants-pay-04","speaker":"staff","jp":"千三百五十円になります。","kana":"せん さんびゃく ごじゅう えん に なります。","meaning":"That will be 1,350 yen.","also_heard":[{"jp":"千三百五十円です。","kana":"せん さんびゃく ごじゅう えん です。","meaning":"It's 1,350 yen.","romaji":"sen sanbyaku gojuu en desu."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you go.","romaji":"hai, douzo."}],"note":"The total is said in yen. Listen for the amount and have cash or your card ready.","level":"core","romaji":"sen sanbyaku gojuu en ni narimasu."},{"id":"restaurants-pay-05","speaker":"you","jp":"カードは使えますか？","kana":"カード は つかえます か？","meaning":"Can I use a card?","replies":[{"jp":"カードは使えます。","kana":"カード は つかえます。","meaning":"Cards are accepted.","romaji":"kaado wa tsukaemasu."},{"jp":"現金のみです。","kana":"げんきん のみ です。","meaning":"Cash only.","romaji":"genkin nomi desu."}],"note":"Small ramen counters and izakaya can be cash only. Look for 現金のみ on the door or at the register.","level":"useful","romaji":"kaado wa tsukaemasu ka?"},{"id":"restaurants-pay-06","speaker":"staff","jp":"税込みです。","kana":"ぜいこみ です。","meaning":"Tax is included.","also_heard":[{"jp":"表示価格は税抜きです。","kana":"ひょうじ かかく は ぜいぬき です。","meaning":"Displayed prices exclude tax.","romaji":"hyouji kakaku wa zeinuki desu."},{"jp":"席料がかかります。","kana":"せきりょう が かかります。","meaning":"There is a table charge.","romaji":"sekiryou ga kakarimasu."}],"note":"税込 means tax included and 税抜 means before tax, so check which one the menu shows. A table charge (席料) may also be added to the bill.","level":"core","romaji":"zeikomi desu."},{"id":"restaurants-pay-07","speaker":"staff","jp":"領収書はいりますか？","kana":"りょうしゅうしょ は いります か？","meaning":"Do you need a receipt?","also_heard":[{"jp":"レシートはご利用ですか？","kana":"レシート は ごりよう です か？","meaning":"Would you like your receipt?","romaji":"reshiito wa goriyou desu ka?"}],"replies":[{"jp":"いりません。","kana":"いりません。","meaning":"No, thanks.","romaji":"irimasen."},{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"note":"領収書 is a formal receipt, while レシート is a simple one. Ask for 領収書 if your employer needs it.","level":"useful","romaji":"ryoushuusho wa irimasu ka?"},{"id":"restaurants-pay-08","speaker":"you","jp":"ごちそうさまでした。","kana":"ごちそうさまでした。","meaning":"Thank you for the meal.","replies":[{"jp":"ありがとうございました。またお越しください。","kana":"ありがとう ございました。 また おこし ください。","meaning":"Thank you. Please come again.","romaji":"arigatou gozaimashita. mata okoshi kudasai."}],"note":"Say it when you leave, as many shops expect it. A short bow is enough.","level":"core","romaji":"gochisousamadeshita."},{"id":"restaurants-pay-09","speaker":"you","jp":"おいしかったです。","kana":"おいしかった です。","meaning":"It was delicious.","replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"level":"core","romaji":"oishikatta desu."},{"id":"restaurants-pay-10","speaker":"staff","jp":"ありがとうございました。またお越しくださいませ。","kana":"ありがとう ございました。 また おこし くださいませ。","meaning":"Thank you. Please come again.","also_heard":[{"jp":"お気をつけてお帰りください。","kana":"おきを つけて おかえり ください。","meaning":"Please get home safely.","romaji":"okio tsukete okaeri kudasai."}],"level":"core","note":"A set farewell. You can answer with ありがとうございました or just nod. Tipping is not expected, so do not leave money on the table.","romaji":"arigatou gozaimashita. mata okoshi kudasaimase."},{"id":"restaurants-pay-11","speaker":"you","jp":"残りを持ち帰れますか？","kana":"のこり を もちかえれます か？","meaning":"Can I take the rest home?","replies":[{"jp":"申し訳ありません、衛生上の理由でお持ち帰りはできません。","kana":"もうしわけ ありません、 えいせいじょう の りゆう で おもちかえり は できません。","meaning":"Sorry, for hygiene reasons we can't do takeaway.","romaji":"moushiwake arimasen, eiseijou no riyuu de omochikaeri wa dekimasen."}],"note":"Often not allowed, especially for raw or wet food. Do not assume you can take it away; ask first.","level":"useful","romaji":"nokori o mochikaeremasu ka?"}]}],"dialogues":[{"title":"Walking into a busy restaurant for two","lines":[{"speaker":"staff","jp":"いらっしゃいませ！何名様ですか？","kana":"いらっしゃいませ！ なんめいさま です か？","meaning":"Welcome! How many people?","romaji":"irasshaimase! nanmeisama desu ka?"},{"speaker":"you","jp":"二人です。","kana":"ふたり です。","meaning":"Two people.","romaji":"futari desu."},{"speaker":"staff","jp":"ただいま満席なんです。30分ほどお待ちいただきますが、よろしいですか？","kana":"ただいま まんせき なん です。 さんじゅっぷん ほど おまち いただきます が、 よろしい です か？","meaning":"We're full right now. The wait is about 30 minutes. Is that OK?","romaji":"tadaima manseki nan desu. sanjuppun hodo omachi itadakimasu ga, yoroshii desu ka?"},{"speaker":"you","jp":"はい、待ちます。","kana":"はい、 まちます。","meaning":"Yes, we'll wait.","romaji":"hai, machimasu."},{"speaker":"staff","jp":"ありがとうございます。こちらにお名前を書いてお待ちください。","kana":"ありがとう ございます。 こちら に おなまえ を かいて おまち ください。","meaning":"Thank you. Please write your name here and wait.","romaji":"arigatou gozaimasu. kochira ni onamae o kaite omachi kudasai."},{"speaker":"you","jp":"レイ、二人です。","kana":"レイ、 ふたり です。","meaning":"Rei, two people.","romaji":"rei, futari desu."},{"speaker":"staff","jp":"では、お呼びしますので、外でお待ちください。","kana":"では、 およびします ので、 そと で おまち ください。","meaning":"Then we'll call you, so please wait outside.","romaji":"dewa, oyobishimasu node, soto de omachi kudasai."},{"speaker":"staff","jp":"レイ様、お待たせいたしました。カウンター席でもよろしいですか？","kana":"レイ さま、 おまたせいたしました。 カウンター せき で も よろしい です か？","meaning":"Rei, thank you for waiting. Is a counter seat OK?","romaji":"rei sama, omataseitashimashita. kauntaa seki de mo yoroshii desu ka?"},{"speaker":"you","jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."}]},{"title":"Ramen shop with ticket machine and firmness question","lines":[{"speaker":"staff","jp":"いらっしゃいませ。先に券売機で食券をお買い求めください。","kana":"いらっしゃいませ。 さき に けんばいき で しょっけん を おかいもとめ ください。","meaning":"Welcome. Please buy your meal ticket at the machine first.","romaji":"irasshaimase. saki ni kenbaiki de shokken o okaimotome kudasai."},{"speaker":"you","jp":"すみません、これを買いました。","kana":"すみません、 これ を かいました。","meaning":"Excuse me, I bought this one.","romaji":"sumimasen, kore o kaimashita."},{"speaker":"staff","jp":"ありがとうございます。お好きな席にどうぞ。","kana":"ありがとう ございます。 おすき な せき に どうぞ。","meaning":"Thank you. Sit wherever you like.","romaji":"arigatou gozaimasu. osuki na seki ni douzo."},{"speaker":"you","jp":"食券、お願いします。","kana":"しょっけん、 おねがい します。","meaning":"Here's the ticket, please.","romaji":"shokken, onegai shimasu."},{"speaker":"staff","jp":"麺の硬さはどうされますか？","kana":"めん の かたさ は どう されます か？","meaning":"How firm would you like the noodles?","romaji":"men no katasa wa dou saremasu ka?"},{"speaker":"you","jp":"普通でお願いします。","kana":"ふつう で おねがい します。","meaning":"Regular, please.","romaji":"futsuu de onegai shimasu."},{"speaker":"staff","jp":"味の濃さと油は？","kana":"あじ の こさ と あぶら は？","meaning":"Richness and oil?","romaji":"aji no kosa to abura wa?"},{"speaker":"you","jp":"全部普通で。","kana":"ぜんぶ ふつう で。","meaning":"Everything regular.","romaji":"zenbu futsuu de."},{"speaker":"staff","jp":"ニンニクは入れますか？","kana":"ニンニク は いれます か？","meaning":"Do you want garlic?","romaji":"ninniku wa iremasu ka?"},{"speaker":"you","jp":"なしでお願いします。","kana":"なし で おねがい します。","meaning":"No garlic, please.","romaji":"nashi de onegai shimasu."},{"speaker":"staff","jp":"お待たせしました。","kana":"おまたせしました。","meaning":"Thanks for waiting.","romaji":"omataseshimashita."},{"speaker":"you","jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}]},{"title":"Ordering with a request to leave something out","lines":[{"speaker":"staff","jp":"ご注文はお決まりですか？","kana":"ごちゅうもん は おきまり です か？","meaning":"Have you decided on your order?","romaji":"gochuumon wa okimari desu ka?"},{"speaker":"you","jp":"これをお願いします。それと、ねぎ抜きでお願いします。","kana":"これ を おねがい します。 それと、 ねぎ ぬき で おねがい します。","meaning":"This one, please. And without spring onion, please.","romaji":"kore o onegai shimasu. soreto, negi nuki de onegai shimasu."},{"speaker":"staff","jp":"かしこまりました。ねぎ抜きですね。ご飯は大盛りと普通、どちらにしますか？","kana":"かしこまりました。 ねぎ ぬき です ね。 ごはん は おおもり と ふつう、 どちら に します か？","meaning":"Certainly. Without spring onion, right? Rice: large or regular?","romaji":"kashikomarimashita. negi nuki desu ne. gohan wa oomori to futsuu, dochira ni shimasu ka?"},{"speaker":"you","jp":"普通で。","kana":"ふつう で。","meaning":"Regular.","romaji":"futsuu de."},{"speaker":"staff","jp":"お飲み物は？","kana":"おのみもの は？","meaning":"Drinks?","romaji":"onomimono wa?"},{"speaker":"you","jp":"熱いお茶をお願いします。あと、これにはえびが入っていますか？","kana":"あつい おちゃ を おねがい します。 あと、 これ に は えび が はいって います か？","meaning":"Hot tea, please. And does this have shrimp in it?","romaji":"atsui ocha o onegai shimasu. ato, kore ni wa ebi ga haitte imasu ka?"},{"speaker":"staff","jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"Please wait a moment.","romaji":"shoushou omachi kudasai."},{"speaker":"staff","jp":"入っていません。","kana":"はいって いません。","meaning":"No, it doesn't.","romaji":"haitte imasen."},{"speaker":"you","jp":"ありがとうございます。以上です。","kana":"ありがとう ございます。 いじょう です。","meaning":"Thank you. That's all.","romaji":"arigatou gozaimasu. ijou desu."}]},{"title":"Paying separately at the register","lines":[{"speaker":"you","jp":"すみません、お会計お願いします。","kana":"すみません、 おかいけい おねがい します。","meaning":"Excuse me, the bill please.","romaji":"sumimasen, okaikei onegai shimasu."},{"speaker":"staff","jp":"かしこまりました。伝票をお持ちになって、レジでお願いします。","kana":"かしこまりました。 でんぴょう を おもち に なって、 レジ で おねがい します。","meaning":"Certainly. Please take the slip and pay at the register.","romaji":"kashikomarimashita. denpyou o omochi ni natte, reji de onegai shimasu."},{"speaker":"staff","jp":"お会計は一緒ですか？別々ですか？","kana":"おかいけい は いっしょ です か？ べつべつ です か？","meaning":"Together or separate?","romaji":"okaikei wa issho desu ka? betsubetsu desu ka?"},{"speaker":"you","jp":"別々でお願いします。","kana":"べつべつ で おねがい します。","meaning":"Separate, please.","romaji":"betsubetsu de onegai shimasu."},{"speaker":"staff","jp":"かしこまりました。こちらのお客様は1,350円になります。","kana":"かしこまりました。 こちら の おきゃくさま は せん さんびゃく ごじゅう えん に なります。","meaning":"Certainly. For this customer it's 1,350 yen.","romaji":"kashikomarimashita. kochir き","meaning":"chicken wings (Nagoya)","romaji":"tebasaki"},{"jp":"きしめん","kana":"きしめん","meaning":"flat noodles (Nagoya)","romaji":"kishimen"},{"jp":"味噌煮込みうどん","kana":"みそにこみうどん","meaning":"udon simmered in miso broth (Nagoya)","romaji":"misonikomiudon"},{"jp":"肉玉そば","kana":"にくたまそば","meaning":"okonomiyaki with pork, egg and noodles (Hiroshima)","romaji":"nikutamasoba"},{"jp":"お好み焼き","kana":"おこのみやき","meaning":"savoury pancake cooked on the griddle (Hiroshima)","romaji":"okonomiyaki"},{"jp":"広島つけ麺","kana":"ひろしまつけめん","meaning":"dipping noodles, with spice levels (Hiroshima)","romaji":"hiroshimatsukemen"},{"jp":"たこ焼き","kana":"たこやき","meaning":"octopus balls (Osaka)","romaji":"takoyaki"},{"jp":"串カツ","kana":"くしカツ","meaning":"breaded skewers, shared sauce (Osaka)","romaji":"kushikatsu"},{"jp":"神戸牛","kana":"こうべぎゅう","meaning":"Kobe beef","romaji":"koubegyuu"},{"jp":"ほうとう","kana":"ほうとう","meaning":"flat-noodle stew (Kawaguchiko)","romaji":"houtou"},{"jp":"もんじゃ","kana":"もんじゃ","meaning":"runny savoury batter cooked on a griddle (Tokyo)","romaji":"monja"}]}],"_num":"04"},{"slug":"hotel","title":"Hotel","title_jp":"ホテル","summary":"Check-in, room help, luggage, breakfast, bath and check-out","situations":[{"title":"Arriving before check-in","intro":"You arrive with bags before the room is ready. Ask them to hold the bags and come back later.","phrases":[{"id":"hotel-arrive-01","speaker":"you","jp":"すみません、荷物を預かってもらえますか。","kana":"すみません、 にもつ を あずかって もらえます か。","meaning":"Excuse me, could you hold our bags?","replies":[{"jp":"はい、かしこまりました。","kana":"はい、 かしこまりました。","meaning":"Yes, certainly.","romaji":"hai, kashikomarimashita."},{"jp":"はい、お預かりします。","kana":"はい、 おあずかり します。","meaning":"Yes, we'll keep them.","romaji":"hai, oazukari shimasu."}],"note":"預ける means you leave bags with someone; 預かる means they keep them. Ask with 預かってもらえますか.","level":"core","romaji":"sumimasen, nimotsu o azukatte moraemasu ka."},{"id":"hotel-arrive-02","speaker":"staff","jp":"お荷物をお預かりします。","kana":"おにもつ を おあずかり します。","meaning":"We'll take your luggage.","also_heard":[{"jp":"こちらでお預かりします。","kana":"こちら で おあずかり します。","meaning":"We'll keep them here.","romaji":"kochira de oazukari shimasu."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"note":"Hand over the bags and say お願いします.","level":"core","romaji":"onimotsu o oazukari shimasu."},{"id":"hotel-arrive-03","speaker":"staff","jp":"こちらのタグにお名前をお書きください。","kana":"こちら の タグ に おなまえ を おかき ください。","meaning":"Please write your name on this tag.","replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."},{"jp":"ローマ字でいいですか。","kana":"ローマじ で いい です か。","meaning":"Is romaji OK?","romaji":"roomaji de ii desu ka."}],"note":"Keep the tag or number stub. You need it to collect your bags.","level":"core","romaji":"kochira no tagu ni onamae o okaki kudasai."},{"id":"hotel-arrive-04","speaker":"staff","jp":"貴重品はお持ちください。","kana":"きちょうひん は おもち ください。","meaning":"Please keep your valuables with you.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, I understand.","romaji":"hai, wakarimashita."}],"note":"Keep passports, cash and valuables with you, not in bags left at the desk.","level":"useful","romaji":"kichouhin wa omochi kudasai."},{"id":"hotel-arrive-05","speaker":"you","jp":"チェックインは何時からですか。","kana":"チェックイン は なんじ から です か。","meaning":"What time is check-in?","replies":[{"jp":"十五時からです。","kana":"じゅうごじ から です。","meaning":"From 15:00.","romaji":"juugoji kara desu."},{"jp":"十四時からです。","kana":"じゅうよじ から です。","meaning":"From 14:00.","romaji":"juuyoji kara desu."}],"note":"Times differ by hotel. Write down the time they give you.","level":"core","romaji":"chekkuin wa nanji kara desu ka."},{"id":"hotel-arrive-06","speaker":"you","jp":"早めにチェックインできますか。","kana":"はやめ に チェックイン できます か。","meaning":"Can we check in early?","replies":[{"jp":"お部屋の準備ができていれば可能です。","kana":"おへや の じゅんび が できて いれば かのう です。","meaning":"Yes, if the room is ready.","romaji":"oheya no junbi ga dekite ireba kanou desu."},{"jp":"まだ準備中です。","kana":"まだ じゅんびちゅう です。","meaning":"It's still being prepared.","romaji":"mada junbichuu desu."}],"note":"準備中 means the room is still being prepared. Ask whether early check-in costs extra.","level":"core","romaji":"hayame ni chekkuin dekimasu ka."},{"id":"hotel-arrive-07","speaker":"staff","jp":"準備ができましたら、ご連絡します。","kana":"じゅんび が できました ら、 ごれんらく します。","meaning":"We'll contact you when it's ready.","also_heard":[{"jp":"準備ができ次第、お電話します。","kana":"じゅんび が でき しだい、 おでんわ します。","meaning":"We'll call you as soon as it's ready.","romaji":"junbi ga deki shidai, odenwa shimasu."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"note":"They may ask for a phone number: 電話番号を教えていただけますか. Have yours ready.","level":"useful","romaji":"junbi ga dekimashita ra, gorenraku shimasu."},{"id":"hotel-arrive-08","speaker":"staff","jp":"十五時以降にまたお越しください。","kana":"じゅうごじ いこう に また おこし ください。","meaning":"Please come back after 15:00.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"以降 means from that time onward. Come back at the time they name.","level":"useful","romaji":"juugoji ikou ni mata okoshi kudasai."},{"id":"hotel-arrive-09","speaker":"you","jp":"荷物は何時まで預けられますか。","kana":"にもつ は なんじ まで あずけ られます か。","meaning":"Until what time can we leave the bags?","replies":[{"jp":"夜十時までです。","kana":"よる じゅうじ まで です。","meaning":"Until 22:00.","romaji":"yoru juuji made desu."}],"note":"Ask this before you walk away, so you know your window.","level":"useful","romaji":"nimotsu wa nanji made azuke raremasu ka."},{"id":"hotel-arrive-10","speaker":"you","jp":"あとで取りに来ます。","kana":"あとで とり に きます。","meaning":"We'll come back for them later.","note":"Show your tag or stub when you return.","level":"useful","romaji":"atode tori ni kimasu."},{"id":"hotel-arrive-11","speaker":"staff","jp":"お部屋の準備ができ次第、ご案内します。","kana":"おへや の じゅんび が でき しだい、 ごあんない します。","meaning":"We'll show you to your room as soon as it's ready.","note":"準備 means preparation and 案内 means guiding you to the place.","level":"listen-only","romaji":"oheya no junbi ga deki shidai, goannai shimasu."},{"id":"hotel-arrive-12","speaker":"you","jp":"先にお手洗いを借りてもいいですか。","kana":"さき に おてあらい を かりて も いい です か。","meaning":"May I use the restroom first?","note":"お手洗い is the polite word for toilet.","level":"useful","romaji":"saki ni otearai o karite mo ii desu ka."}]},{"title":"Check-in","intro":"At the front desk or the self check-in machine. These are the questions you will hear and the answers you need.","phrases":[{"id":"hotel-checkin-01","speaker":"you","jp":"チェックインをお願いします。","kana":"チェックイン を おねがい します。","meaning":"Check-in, please.","replies":[{"jp":"ご予約はございますか。","kana":"ごよやく は ございます か。","meaning":"Do you have a reservation?","romaji":"goyoyaku wa gozaimasu ka."},{"jp":"はい、お名前をお願いします。","kana":"はい、 おなまえ を おねがい します。","meaning":"Yes, may I have your name?","romaji":"hai, onamae o onegai shimasu."}],"note":"Then give your name, for example ディアスで予約しています.","level":"core","romaji":"chekkuin o onegai shimasu."},{"id":"hotel-checkin-02","speaker":"you","jp":"ディアスで予約しています。","kana":"ディアス で よやく して います。","meaning":"I have a reservation under Diaz.","replies":[{"jp":"ディアス様ですね。少々お待ちください。","kana":"ディアスさま ですね。 しょうしょう おまち ください。","meaning":"Mr. or Ms. Diaz, yes. Please wait a moment.","romaji":"diasusama desune. shoushou omachi kudasai."}],"note":"Swap in your own surname. Staff add 様 (sama) after it.","level":"core","romaji":"diasu de yoyaku shite imasu."},{"id":"hotel-checkin-03","speaker":"staff","jp":"ご予約のお名前をお願いします。","kana":"ごよやく の おなまえ を おねがい します。","meaning":"The name on the reservation, please?","also_heard":[{"jp":"お名前をお伺いできますか。","kana":"おなまえ を おうかがい できます か。","meaning":"May I have your name?","romaji":"onamae o oukagai dekimasu ka."}],"replies":[{"jp":"ディアスです。","kana":"ディアス です。","meaning":"Diaz.","romaji":"diasu desu."}],"note":"If they ask you to spell it, spell it letter by letter in English.","level":"core","romaji":"goyoyaku no onamae o onegai shimasu."},{"id":"hotel-checkin-04","speaker":"staff","jp":"パスポートを拝見できますか。","kana":"パスポート を はいけん できます か。","meaning":"May I see your passport?","also_heard":[{"jp":"パスポートをコピーさせていただきます。","kana":"パスポート を コピー させて いただきます。","meaning":"We'll make a copy of your passport.","romaji":"pasupooto o kopii sasete itadakimasu."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you are.","romaji":"hai, douzo."}],"note":"Foreign guests are usually asked for a passport, so keep it in your hand luggage.","level":"core","romaji":"pasupooto o haiken dekimasu ka."},{"id":"hotel-checkin-05","speaker":"staff","jp":"こちらの宿泊カードにご記入をお願いします。","kana":"こちら の しゅくはく カード に ごきにゅう を おねがい します。","meaning":"Please fill in this guest card.","replies":[{"jp":"住所は英語でもいいですか。","kana":"じゅうしょ は えいご でも いい です か。","meaning":"Is English OK for the address?","romaji":"juusho wa eigo demo ii desu ka."},{"jp":"はい、書きます。","kana":"はい、 かきます。","meaning":"Yes, I'll write it.","romaji":"hai, kakimasu."}],"note":"Usual boxes: name, address, phone, nationality and passport number.","level":"core","romaji":"kochira no shukuhaku kaado ni gokinyuu o onegai shimasu."},{"id":"hotel-checkin-06","speaker":"staff","jp":"国籍はどちらですか。","kana":"こくせき は どちら です か。","meaning":"What is your nationality?","replies":[{"jp":"アメリカです。","kana":"アメリカ です。","meaning":"American.","romaji":"amerika desu."},{"jp":"スペインです。","kana":"スペイン です。","meaning":"Spanish.","romaji":"supein desu."}],"note":"Answer with your country. If you miss a question, say もう一度お願いします (once more, please).","level":"core","romaji":"kokuseki wa dochira desu ka."},{"id":"hotel-checkin-07","speaker":"staff","jp":"お支払いは今ですか、チェックアウトのときですか。","kana":"おしはらい は いま です か、 チェックアウト の とき です か。","meaning":"Do you pay now, or at check-out?","replies":[{"jp":"チェックアウトのときにお願いします。","kana":"チェックアウト の とき に おねがい します。","meaning":"At check-out, please.","romaji":"chekkuauto no toki ni onegai shimasu."},{"jp":"今払います。","kana":"いま はらいます。","meaning":"I'll pay now.","romaji":"ima haraimasu."}],"note":"Some hotels take payment or a deposit at check-in. Either way, ask what the total will be.","level":"core","romaji":"oshiharai wa ima desu ka, chekkuauto no toki desu ka."},{"id":"hotel-checkin-08","speaker":"staff","jp":"宿泊税が別途かかります。","kana":"しゅくはくぜい が べっと かかります。","meaning":"Accommodation tax is charged separately.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."},{"jp":"いくらですか。","kana":"いくら です か。","meaning":"How much is it?","romaji":"ikura desu ka."}],"note":"Tokyo, Osaka and Hiroshima add a small per-person tax per night. The amount depends on the room price, so ask.","level":"useful","romaji":"shukuhakuzei ga betto kakarimasu."},{"id":"hotel-checkin-09","speaker":"staff","jp":"お部屋は5階の512号室です。","kana":"おへや は ごかい の ごひゃく じゅうに ごうしつ です。","meaning":"Your room is 512, on the 5th floor.","replies":[{"jp":"5階の512号室ですね。","kana":"ごかい の ごひゃく じゅうに ごうしつ です ね。","meaning":"Room 512 on the 5th floor, right?","romaji":"gokai no gohyaku juuni goushitsu desu ne."}],"note":"Repeat the number back. Floors use 階: 1階 is いっかい and 3階 is さんがい.","level":"core","romaji":"oheya wa gokai no gohyaku juuni goushitsu desu."},{"id":"hotel-checkin-10","speaker":"staff","jp":"朝食は六時半から九時まで、二階の会場です。","kana":"ちょうしょく は ろくじはん から くじ まで、 にかい の かいじょう です。","meaning":"Breakfast is from 6:30 to 9:00, in the venue on the 2nd floor.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Got it.","romaji":"wakarimashita."}],"note":"Write the times down. The breakfast topic covers the restaurant itself.","level":"core","romaji":"choushoku wa rokujihan kara kuji made, nikai no kaijou desu."},{"id":"hotel-checkin-11","speaker":"staff","jp":"チェックアウトは十一時までです。","kana":"チェックアウト は じゅういちじ まで です。","meaning":"Check-out is by 11:00.","replies":[{"jp":"十一時ですね。","kana":"じゅういちじ です ね。","meaning":"11:00, right?","romaji":"juuichiji desu ne."}],"note":"Check-out times vary by hotel. Confirm the exact time they give you.","level":"core","romaji":"chekkuauto wa juuichiji made desu."},{"id":"hotel-checkin-12","speaker":"staff","jp":"カードキーをお部屋に差し込むと電気がつきます。","kana":"カードキー を おへや に さしこむ と でんき が つきます。","meaning":"Put the key card in the slot in the room and the lights come on.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"Some rooms cut the power when the card is removed. Take the card with you when you leave.","level":"useful","romaji":"kaadokii o oheya ni sashikomu to denki ga tsukimasu."}]},{"title":"Room requests and questions","intro":"Small requests that make the room comfortable. Ask at the desk, or by phone from the room.","phrases":[{"id":"hotel-room-01","speaker":"you","jp":"禁煙の部屋をお願いします。","kana":"きんえん の へや を おねがい します。","meaning":"A non-smoking room, please.","replies":[{"jp":"はい、全室禁煙です。","kana":"はい、 ぜんしつ きんえん です。","meaning":"Yes, all rooms are non-smoking.","romaji":"hai, zenshitsu kin'en desu."}],"note":"Smoking rooms can smell strongly. Check your booking if non-smoking matters to you.","level":"core","romaji":"kin'en no heya o onegai shimasu."},{"id":"hotel-room-02","speaker":"you","jp":"高い階の部屋はありますか。","kana":"たかい かい の へや は あります か。","meaning":"Do you have a room on a high floor?","replies":[{"jp":"確認します。","kana":"かくにん します。","meaning":"I'll check.","romaji":"kakunin shimasu."},{"jp":"満室です。","kana":"まんしつ です。","meaning":"We're fully booked.","romaji":"manshitsu desu."}],"note":"満室 means no rooms are free. 空室 means a room is free.","level":"useful","romaji":"takai kai no heya wa arimasu ka."},{"id":"hotel-room-03","speaker":"you","jp":"ベッドが二つのお部屋にしてください。","kana":"ベッド が ふたつ の おへや に して ください。","meaning":"Please give us a room with two beds.","replies":[{"jp":"はい、確認します。","kana":"はい、 かくにん します。","meaning":"Yes, I'll check.","romaji":"hai, kakunin shimasu."},{"jp":"ダブルのお部屋です。","kana":"ダブル の おへや です。","meaning":"It's a room with a double bed.","romaji":"daburu no oheya desu."}],"note":"Check the bed type on your booking before you arrive. Twin means two beds; double means one large bed.","level":"useful","romaji":"beddo ga futatsu no oheya ni shite kudasai."},{"id":"hotel-room-04","speaker":"you","jp":"枕をもう一つお願いします。","kana":"まくら を もう ひとつ おねがい します。","meaning":"One more pillow, please.","replies":[{"jp":"はい、お持ちします。","kana":"はい、 おもち します。","meaning":"Yes, we'll bring one.","romaji":"hai, omochi shimasu."},{"jp":"フロントにあります。取りに来てください。","kana":"フロント に あります。 とりに きて ください。","meaning":"They're at the front desk. Please come and get one.","romaji":"furonto ni arimasu. torini kite kudasai."}],"note":"Use つ for pillows and small items, 枚 (もう一枚) for blankets and towels, and 本 (もう一本) for bottles.","level":"core","romaji":"makura o mou hitotsu onegai shimasu."},{"id":"hotel-room-05","speaker":"you","jp":"加湿器を借りられますか。","kana":"かしつき を かりられます か。","meaning":"Can I borrow a humidifier?","replies":[{"jp":"はい、貸し出しています。","kana":"はい、 かしだして います。","meaning":"Yes, we lend them.","romaji":"hai, kashidashite imasu."},{"jp":"数に限りがあります。","kana":"かず に かぎり が あります。","meaning":"There are only a few.","romaji":"kazu ni kagiri ga arimasu."}],"note":"Ask early, since the number is limited.","level":"core","romaji":"kashitsuki o kariraremasu ka."},{"id":"hotel-room-06","speaker":"you","jp":"充電器を借りられますか。","kana":"じゅうでんき を かりられます か。","meaning":"Can I borrow a charger?","replies":[{"jp":"iPhoneですか、Type-Cですか。","kana":"アイフォーン です か、 タイプシー です か。","meaning":"Is it for iPhone, or Type-C?","romaji":"aifoon desu ka, taipushii desu ka."}],"note":"Japan uses the same flat plug as the US, so most US plugs fit. Ask for a 変換プラグ (plug adapter) if you need one.","level":"useful","romaji":"juudenki o kariraremasu ka."},{"id":"hotel-room-07","speaker":"you","jp":"アイロンを貸してもらえますか。","kana":"アイロン を かして もらえます か。","meaning":"Could I borrow an iron?","replies":[{"jp":"お部屋にあります。","kana":"おへや に あります。","meaning":"It's in the room.","romaji":"oheya ni arimasu."},{"jp":"貸し出しします。","kana":"かしだし します。","meaning":"We'll lend you one.","romaji":"kashidashi shimasu."}],"note":"If there is no ironing board in the room, ask for one too.","level":"useful","romaji":"airon o kashite moraemasu ka."},{"id":"hotel-room-08","speaker":"you","jp":"暖房の使い方を教えてもらえますか。","kana":"だんぼう の つかいかた を おしえて もらえます か。","meaning":"Could you show me how to use the heating?","replies":[{"jp":"運転ボタンを押して、暖房にしてください。","kana":"うんてん ボタン を おして、 だんぼう に して ください。","meaning":"Press the run button and set it to heating.","romaji":"unten botan o oshite, danbou ni shite kudasai."}],"note":"In winter pick 暖房 (heating), not 冷房 (cooling). The labels are on the remote.","level":"core","romaji":"danbou no tsukaikata o oshiete moraemasu ka."},{"id":"hotel-room-09","speaker":"you","jp":"お風呂とトイレの使い方がわかりません。","kana":"おふろ と トイレ の つかいかた が わかりません。","meaning":"I don't know how to use the bath and the toilet controls.","replies":[{"jp":"すぐに伺います。","kana":"すぐ に うかがいます。","meaning":"We'll come right away.","romaji":"sugu ni ukagaimasu."},{"jp":"お部屋に説明書があります。","kana":"おへや に せつめいしょ が あります。","meaning":"There's an instruction sheet in the room.","romaji":"oheya ni setsumeisho ga arimasu."}],"note":"Panel labels are in the signs list at the end of this topic.","level":"useful","romaji":"ofuro to toire no tsukaikata ga wakarimasen."},{"id":"hotel-room-10","speaker":"you","jp":"掃除は要りません。","kana":"そうじ は いりません。","meaning":"We don't need housekeeping.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"On stays of more than one night, hotels often offer a choice of cleaning. Ask which option applies to you.","level":"core","romaji":"souji wa irimasen."},{"id":"hotel-room-11","speaker":"you","jp":"レイトチェックアウトはできますか。","kana":"レイトチェックアウト は できます か。","meaning":"Can we check out late?","replies":[{"jp":"十二時まで可能です。","kana":"じゅうにじ まで かのう です。","meaning":"Possible until 12:00.","romaji":"juuniji made kanou desu."},{"jp":"追加料金がかかります。","kana":"ついか りょうきん が かかります。","meaning":"There is an extra charge.","romaji":"tsuika ryoukin ga kakarimasu."}],"note":"Ask how much it costs before you agree, since the fee varies.","level":"useful","romaji":"reitochekkuauto wa dekimasu ka."},{"id":"hotel-room-12","speaker":"staff","jp":"ご用の際は内線でお知らせください。","kana":"ごよう の さい は ないせん で おしらせ ください。","meaning":"If you need anything, please call on the room phone.","note":"Check the phone for the number. Do not guess it.","level":"listen-only","romaji":"goyou no sai wa naisen de oshirase kudasai."}]},{"title":"Problems in the room","intro":"Say what is wrong in short, direct sentences, then ask for help. Call the front desk from the room phone.","phrases":[{"id":"hotel-problem-01","speaker":"you","jp":"カードキーが使えません。","kana":"カードキー が つかえません。","meaning":"The key card doesn't work.","replies":[{"jp":"キーを確認します。","kana":"キー を かくにん します。","meaning":"We'll check the key.","romaji":"kii o kakunin shimasu."},{"jp":"新しいキーをお作りします。","kana":"あたらしい キー を おつくり します。","meaning":"We'll make you a new key.","romaji":"atarashii kii o otsukuri shimasu."}],"note":"Keep cards away from phones and magnets, which can damage them.","level":"core","romaji":"kaadokii ga tsukaemasen."},{"id":"hotel-problem-02","speaker":"you","jp":"部屋に鍵を忘れてしまいました。","kana":"へや に かぎ を わすれて しまいました。","meaning":"I left my key inside the room.","replies":[{"jp":"お名前とお部屋番号をお願いします。","kana":"おなまえ と おへや ばんごう を おねがい します。","meaning":"Your name and room number, please.","romaji":"onamae to oheya bangou o onegai shimasu."}],"note":"Doors lock automatically. Never go out without your key.","level":"core","romaji":"heya ni kagi o wasurete shimaimashita."},{"id":"hotel-problem-03","speaker":"you","jp":"部屋が寒いです。","kana":"へや が さむい です。","meaning":"The room is cold.","replies":[{"jp":"すぐ見に行きます。","kana":"すぐ みに いきます。","meaning":"We'll go and look right away.","romaji":"sugu mini ikimasu."},{"jp":"設定温度を上げます。","kana":"せってい おんど を あげます。","meaning":"We'll raise the set temperature.","romaji":"settei ondo o agemasu."}],"note":"If the heat isn't working, say 暖房が効きません (the heating doesn't work).","level":"core","romaji":"heya ga samui desu."},{"id":"hotel-problem-04","speaker":"you","jp":"お湯が出ません。","kana":"おゆ が でません。","meaning":"There's no hot water.","also_heard":[{"jp":"お湯がぬるいです。","kana":"おゆ が ぬるい です。","meaning":"The water is lukewarm.","romaji":"oyu ga nurui desu."}],"replies":[{"jp":"少しお待ちください。確認します。","kana":"すこし おまち ください。 かくにん します。","meaning":"Please wait a moment. We'll check.","romaji":"sukoshi omachi kudasai. kakunin shimasu."}],"note":"Hot water can take a moment to reach the tap after you turn it on. Wait briefly before you report it.","level":"core","romaji":"oyu ga demasen."},{"id":"hotel-problem-05","speaker":"you","jp":"隣の部屋の音がうるさいです。","kana":"となり の へや の おと が うるさい です。","meaning":"The room next door is noisy.","replies":[{"jp":"申し訳ございません。確認します。","kana":"もうしわけ ございません。 かくにん します。","meaning":"We're very sorry. We'll check.","romaji":"moushiwake gozaimasen. kakunin shimasu."}],"note":"A softer way to say it: 少し気になるんですが... (It's bothering me a little...).","level":"core","romaji":"tonari no heya no oto ga urusai desu."},{"id":"hotel-problem-06","speaker":"you","jp":"Wi-Fiがつながりません。","kana":"ワイファイ が つながりません。","meaning":"The Wi-Fi isn't connecting.","replies":[{"jp":"パスワードをご確認ください。","kana":"パスワード を ごかくにん ください。","meaning":"Please check the password.","romaji":"pasuwaado o gokakunin kudasai."},{"jp":"ルーターを再起動します。","kana":"ルーター を さいきどう します。","meaning":"We'll restart the router.","romaji":"ruutaa o saikidou shimasu."}],"note":"Check the password card in the room before you call.","level":"useful","romaji":"waifai ga tsunagarimasen."},{"id":"hotel-problem-07","speaker":"you","jp":"エアコンが壊れています。","kana":"エアコン が こわれて います。","meaning":"The air conditioner is broken.","replies":[{"jp":"係の者を向かわせます。","kana":"かかり の もの を むかわせます。","meaning":"We'll send the person in charge.","romaji":"kakari no mono o mukawasemasu."}],"note":"Name the broken item: テレビ (TV), 電気 (lights) or トイレ (toilet).","level":"core","romaji":"eakon ga kowarete imasu."},{"id":"hotel-problem-08","speaker":"you","jp":"部屋を変えてもらえますか。","kana":"へや を かえて もらえます か。","meaning":"Could we change rooms?","replies":[{"jp":"空いている部屋を確認します。","kana":"あいて いる へや を かくにん します。","meaning":"I'll check for an empty room.","romaji":"aite iru heya o kakunin shimasu."},{"jp":"今は満室です。","kana":"いま は まんしつ です。","meaning":"We're fully booked right now.","romaji":"ima wa manshitsu desu."}],"note":"Give a reason if you can, such as noise or cold.","level":"core","romaji":"heya o kaete moraemasu ka."},{"id":"hotel-problem-09","speaker":"you","jp":"タオルが足りません。","kana":"タオル が たりません。","meaning":"We're short of towels.","replies":[{"jp":"すぐお持ちします。","kana":"すぐ おもち します。","meaning":"We'll bring some right away.","romaji":"sugu omochi shimasu."}],"note":"Name any missing item, for example シャンプー (shampoo) or 歯ブラシ (toothbrush).","level":"useful","romaji":"taoru ga tarimasen."},{"id":"hotel-problem-10","speaker":"staff","jp":"申し訳ございません。すぐに伺います。","kana":"もうしわけ ございません。 すぐ に うかがいます。","meaning":"We're sorry. We'll come right away.","note":"You'll hear this after you call the desk. Wait in your room.","level":"listen-only","romaji":"moushiwake gozaimasen. sugu ni ukagaimasu."},{"id":"hotel-problem-11","speaker":"staff","jp":"お部屋を移っていただくことは可能でしょうか。","kana":"おへや を うつって いただく こと は かのう でしょう か。","meaning":"Would it be possible for you to move to another room?","replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."},{"jp":"少し待ってください。","kana":"すこし まって ください。","meaning":"Please wait a little.","romaji":"sukoshi matte kudasai."}],"note":"They may ask about your bags. Say what you need.","level":"listen-only","romaji":"oheya o utsutte itadaku koto wa kanou deshou ka."},{"id":"hotel-problem-12","speaker":"you","jp":"火災報知器が鳴っています。","kana":"かさいほうちき が なって います。","meaning":"The fire alarm is ringing.","note":"Follow the 非常口 (emergency exit) signs and use the stairs, not the elevator.","level":"listen-only","romaji":"kasaihouchiki ga natte imasu."}]},{"title":"Front desk services","intro":"Luggage forwarding, taxis, umbrellas, laundry, ice and more. Ask first whether a service costs extra.","phrases":[{"id":"hotel-service-01","speaker":"you","jp":"荷物を次のホテルに送りたいです。","kana":"にもつ を つぎ の ホテル に おくりたい です。","meaning":"I want to send our luggage to the next hotel.","replies":[{"jp":"はい、宅配便でお送りできます。","kana":"はい、 たくはいびん で おおくり できます。","meaning":"Yes, we can send it by parcel delivery.","romaji":"hai, takuhaibin de ookuri dekimasu."},{"jp":"はい、こちらの伝票にご記入ください。","kana":"はい、 こちら の でんぴょう に ごきにゅう ください。","meaning":"Yes, please fill in this slip.","romaji":"hai, kochira no denpyou ni gokinyuu kudasai."}],"note":"宅配便 means parcel delivery. Ask which company the hotel uses and whether it can collect from the desk.","level":"core","romaji":"nimotsu o tsugi no hoteru ni okuritai desu."},{"id":"hotel-service-02","speaker":"staff","jp":"こちらの伝票にご記入ください。","kana":"こちら の でんぴょう に ごきにゅう ください。","meaning":"Please fill in this slip.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."},{"jp":"次のホテルの住所を書けばいいですか。","kana":"つぎ の ホテル の じゅうしょ を かけば いい です か。","meaning":"Do I write the next hotel's address?","romaji":"tsugi no hoteru no juusho o kakeba ii desu ka."}],"note":"Expect to write the next hotel's name, address and phone, plus your name and arrival date.","level":"core","romaji":"kochira no denpyou ni gokinyuu kudasai."},{"id":"hotel-service-03","speaker":"you","jp":"明日の午後に着きますか。","kana":"あした の ごご に つきます か。","meaning":"Will it arrive tomorrow afternoon?","replies":[{"jp":"はい、明日の午後に届きます。","kana":"はい、 あした の ごご に とどきます。","meaning":"Yes, it will arrive tomorrow afternoon.","romaji":"hai, ashita no gogo ni todokimasu."},{"jp":"二日かかる場合があります。","kana":"ふつか かかる ばあい が あります。","meaning":"It may take two days.","romaji":"futsuka kakaru baai ga arimasu."}],"note":"Delivery time depends on the route. Ask before you pay.","level":"core","romaji":"ashita no gogo ni tsukimasu ka."},{"id":"hotel-service-04","speaker":"staff","jp":"受付は午前十一時までです。","kana":"うけつけ は ごぜん じゅういちじ まで です。","meaning":"Drop-off closes at 11:00 in the morning.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."},{"jp":"十一時までに持って行きます。","kana":"じゅういちじ まで に もって いきます。","meaning":"I'll bring it by 11:00.","romaji":"juuichiji made ni motte ikimasu."}],"note":"Hand the parcel in before the cut-off. If the desk is closed, ask when it opens.","level":"core","romaji":"uketsuke wa gozen juuichiji made desu."},{"id":"hotel-service-05","speaker":"you","jp":"料金はいくらですか。","kana":"りょうきん は いくら です か。","meaning":"How much does it cost?","replies":[{"jp":"サイズによって変わります。","kana":"サイズ に よって かわります。","meaning":"It depends on the size.","romaji":"saizu ni yotte kawarimasu."},{"jp":"元払いですか、着払いですか。","kana":"もとばらい です か、 ちゃくばらい です か。","meaning":"Do you pay now, or on delivery?","romaji":"motobarai desu ka, chakubarai desu ka."}],"note":"元払い means you pay now. 着払い means the receiver pays. Ask which one the hotel accepts.","level":"useful","romaji":"ryoukin wa ikura desu ka."},{"id":"hotel-service-06","speaker":"you","jp":"荷物が届いていますか。","kana":"にもつ が とどいて います か。","meaning":"Has a parcel arrived for me?","replies":[{"jp":"ディアス様宛てのお荷物、届いています。","kana":"ディアスさま あて の おにもつ、 とどいて います。","meaning":"A parcel for Mr. or Ms. Diaz has arrived.","romaji":"diasusama ate no onimotsu, todoite imasu."}],"note":"宛て means addressed to. Have your name and booking ready.","level":"useful","romaji":"nimotsu ga todoite imasu ka."},{"id":"hotel-service-07","speaker":"you","jp":"タクシーを呼んでもらえますか。","kana":"タクシー を よんで もらえます か。","meaning":"Could you call a taxi for us?","replies":[{"jp":"何時に、どちらまでですか。","kana":"なんじ に、 どちら まで です か。","meaning":"What time, and where to?","romaji":"nanji ni, dochira made desu ka."}],"note":"Give the time and the destination, for example the station.","level":"core","romaji":"takushii o yonde moraemasu ka."},{"id":"hotel-service-08","speaker":"you","jp":"傘を貸してもらえますか。","kana":"かさ を かして もらえます か。","meaning":"Could I borrow an umbrella?","replies":[{"jp":"どうぞ。お戻りの際にお返しください。","kana":"どうぞ。 おもどり の さい に おかえし ください。","meaning":"Here you are. Please return it when you come back.","romaji":"douzo. omodori no sai ni okaeshi kudasai."}],"note":"Return the umbrella to the desk when you come back.","level":"useful","romaji":"kasa o kashite moraemasu ka."},{"id":"hotel-service-09","speaker":"you","jp":"コインランドリーはどこにありますか。","kana":"コインランドリー は どこ に あります か。","meaning":"Where is the coin laundry?","replies":[{"jp":"二階にあります。","kana":"にかい に あります。","meaning":"It's on the second floor.","romaji":"nikai ni arimasu."},{"jp":"洗濯機と乾燥機があります。","kana":"せんたくき と かんそうき が あります。","meaning":"There are washers and dryers.","romaji":"sentakuki to kansouki ga arimasu."}],"note":"Bring coins. Ask the desk for change (両替) if you don't have them.","level":"core","romaji":"koinrandorii wa doko ni arimasu ka."},{"id":"hotel-service-10","speaker":"you","jp":"製氷機はどこですか。","kana":"せいひょうき は どこ です か。","meaning":"Where is the ice machine?","replies":[{"jp":"五階のエレベーターの近くです。","kana":"ごかい の エレベーター の ちかく です。","meaning":"It's near the elevator on the 5th floor.","romaji":"gokai no erebeetaa no chikaku desu."}],"note":"Bring your own ice bucket if the room doesn't have one.","level":"useful","romaji":"seihyouki wa doko desu ka."},{"id":"hotel-service-11","speaker":"you","jp":"電子レンジはありますか。","kana":"でんし レンジ は あります か。","meaning":"Is there a microwave?","replies":[{"jp":"一階にあります。","kana":"いっかい に あります。","meaning":"It's on the first floor.","romaji":"ikkai ni arimasu."}],"note":"Ask the desk where the shared microwave is.","level":"useful","romaji":"denshi renji wa arimasu ka."},{"id":"hotel-service-12","speaker":"you","jp":"近くにおすすめのレストランはありますか。","kana":"ちかく に おすすめ の レストラン は あります か。","meaning":"Are there any restaurants you'd recommend nearby?","replies":[{"jp":"こちらが地図です。","kana":"こちら が ちず です。","meaning":"Here is a map.","romaji":"kochira ga chizu desu."}],"note":"Staff often hand you a map. You can also ask for a type of food, such as ラーメン (ramen).","level":"useful","romaji":"chikaku ni osusume no resutoran wa arimasu ka."}]},{"title":"Breakfast","intro":"Short exchanges at the restaurant entrance. Have your room number and the ticket ready.","phrases":[{"id":"hotel-breakfast-01","speaker":"you","jp":"朝食は何時からですか。","kana":"ちょうしょく は なんじ から です か。","meaning":"What time does breakfast start?","replies":[{"jp":"六時半から九時までです。","kana":"ろくじはん から くじ まで です。","meaning":"From 6:30 to 9:00.","romaji":"rokujihan kara kuji made desu."}],"note":"Also ask where it is: 朝食会場はどこですか. Times vary by hotel.","level":"core","romaji":"choushoku wa nanji kara desu ka."},{"id":"hotel-breakfast-02","speaker":"staff","jp":"おはようございます。お部屋番号をお願いします。","kana":"おはようございます。 おへや ばんごう を おねがい します。","meaning":"Good morning. Your room number, please.","replies":[{"jp":"512号室です。","kana":"ごひゃく じゅうに ごうしつ です。","meaning":"Room 512.","romaji":"gohyaku juuni goushitsu desu."},{"jp":"ディアスです。","kana":"ディアス です。","meaning":"Diaz.","romaji":"diasu desu."}],"note":"Keep your room key handy. They may also ask for your name.","level":"core","romaji":"ohayougozaimasu. oheya bangou o onegai shimasu."},{"id":"hotel-breakfast-03","speaker":"staff","jp":"朝食券をお願いします。","kana":"ちょうしょくけん を おねがい します。","meaning":"Your breakfast ticket, please.","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."}],"note":"The ticket is sometimes in an envelope with your key. Check before you go down.","level":"core","romaji":"choushokuken o onegai shimasu."},{"id":"hotel-breakfast-04","speaker":"staff","jp":"何名様ですか。","kana":"なんめいさま です か。","meaning":"How many in your party?","replies":[{"jp":"二人です。","kana":"ふたり です。","meaning":"Two of us.","romaji":"futari desu."},{"jp":"一人です。","kana":"ひとり です。","meaning":"Just one.","romaji":"hitori desu."}],"note":"Say the number of people. Counters: 一人 (ひとり) and 二人 (ふたり).","level":"core","romaji":"nanmeisama desu ka."},{"id":"hotel-breakfast-05","speaker":"staff","jp":"お好きなお席へどうぞ。","kana":"おすきな おせき へ どうぞ。","meaning":"Please sit wherever you like.","replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"Choose any free seat. Staff may show you to one if it is busy.","level":"useful","romaji":"osukina oseki e douzo."},{"id":"hotel-breakfast-06","speaker":"staff","jp":"お料理は取り放題です。何回でもどうぞ。","kana":"おりょうり は とりほうだい です。 なんかい でも どうぞ。","meaning":"Help yourself as much as you like, as many times as you like.","note":"取り放題 means you can take as much as you want. Go back for more as often as you like.","level":"useful","romaji":"oryouri wa torihoudai desu. nankai demo douzo."},{"id":"hotel-breakfast-07","speaker":"staff","jp":"お料理は持ち帰りできません。","kana":"おりょうり は もちかえり できません。","meaning":"Food can't be taken out.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"I understand.","romaji":"wakarimashita."}],"note":"Some places allow coffee or drinks to take away. Ask first.","level":"useful","romaji":"oryouri wa mochikaeri dekimasen."},{"id":"hotel-breakfast-08","speaker":"staff","jp":"最終入場は九時半です。","kana":"さいしゅうにゅうじょう は くじはん です。","meaning":"Last entry is at 9:30.","also_heard":[{"jp":"ラストオーダーは九時です。","kana":"ラストオーダー は くじ です。","meaning":"Last order is at 9:00.","romaji":"rasutooodaa wa kuji desu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"Last entry and last order can be different times. Ask which one applies.","level":"core","romaji":"saishuunyuujou wa kujihan desu."},{"id":"hotel-breakfast-09","speaker":"you","jp":"卵のアレルギーがあります。","kana":"たまご の アレルギー が あります。","meaning":"I have an egg allergy.","replies":[{"jp":"表示をご覧ください。","kana":"ひょうじ を ごらん ください。","meaning":"Please check the label.","romaji":"hyouji o goran kudasai."},{"jp":"確認します。","kana":"かくにん します。","meaning":"We'll check.","romaji":"kakunin shimasu."}],"note":"Name the allergen: 卵 (egg), 小麦 (wheat), 乳 (milk), えび (shrimp) or 豚肉 (pork). Menus often list them.","level":"useful","romaji":"tamago no arerugii ga arimasu."},{"id":"hotel-breakfast-10","speaker":"you","jp":"朝食は付いていますか。","kana":"ちょうしょく は ついて います か。","meaning":"Is breakfast included?","replies":[{"jp":"はい、付いています。","kana":"はい、 ついて います。","meaning":"Yes, it's included.","romaji":"hai, tsuite imasu."},{"jp":"いいえ、素泊まりです。","kana":"いいえ、 すどまり です。","meaning":"No, it's room only.","romaji":"iie, sudomari desu."}],"note":"素泊まり means room only, with no meals.","level":"useful","romaji":"choushoku wa tsuite imasu ka."},{"id":"hotel-breakfast-11","speaker":"staff","jp":"お飲み物はセルフです。","kana":"おのみもの は セルフ です。","meaning":"Drinks are self-serve.","note":"Pour your own drinks at the counter.","level":"listen-only","romaji":"onomimono wa serufu desu."},{"id":"hotel-breakfast-12","speaker":"you","jp":"ごちそうさまでした。","kana":"ごちそうさまでした。","meaning":"Thank you for the meal.","replies":[{"jp":"ありがとうございました。","kana":"ありがとうございました。","meaning":"Thank you.","romaji":"arigatougozaimashita."}],"note":"Say it as you leave the restaurant.","level":"useful","romaji":"gochisousamadeshita."}]},{"title":"Public bath at the inn","intro":"The large bath at the Kawaguchiko inn, plus the etiquette that avoids awkward moments. Business hotels often have one too.","phrases":[{"id":"hotel-bath-01","speaker":"you","jp":"大浴場はどこですか。","kana":"だいよくじょう は どこ です か。","meaning":"Where is the large bath?","replies":[{"jp":"一階です。","kana":"いっかい です。","meaning":"It's on the first floor.","romaji":"ikkai desu."},{"jp":"あちらです。","kana":"あちら です。","meaning":"It's that way.","romaji":"achira desu."}],"note":"大浴場 is the shared bath. A 貸切風呂 is a private bath you book.","level":"core","romaji":"daiyokujou wa doko desu ka."},{"id":"hotel-bath-02","speaker":"you","jp":"何時まで入れますか。","kana":"なんじ まで はいれます か。","meaning":"Until what time can we use it?","replies":[{"jp":"夜十一時までです。","kana":"よる じゅういちじ まで です。","meaning":"Until 11:00 at night.","romaji":"yoru juuichiji made desu."}],"note":"Hours can differ for men and women, and some places switch them by day. Check the posted sign.","level":"core","romaji":"nanji made hairemasu ka."},{"id":"hotel-bath-03","speaker":"staff","jp":"男湯は右です。","kana":"おとこゆ は みぎ です。","meaning":"The men's bath is on the right.","also_heard":[{"jp":"突き当たりです。","kana":"つきあたり です。","meaning":"It's at the end of the hall.","romaji":"tsukiatari desu."}],"replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Got it.","romaji":"wakarimashita."}],"note":"Look for the kanji 男 (men) and 女 (women) on the noren curtains. The colours can differ between places.","level":"useful","romaji":"otokoyu wa migi desu."},{"id":"hotel-bath-04","speaker":"you","jp":"入れ墨があっても入れますか。","kana":"いれずみ が あっても はいれます か。","meaning":"Can I go in if I have a tattoo?","replies":[{"jp":"小さければ大丈夫です。","kana":"ちいさければ だいじょうぶ です。","meaning":"It's fine if it is small.","romaji":"chiisakereba daijoubu desu."},{"jp":"申し訳ありませんが、ご遠慮ください。","kana":"もうしわけ ありませんが、 ごえんりょ ください。","meaning":"Sorry, but we ask you to refrain.","romaji":"moushiwake arimasenga, goenryo kudasai."}],"note":"Rules differ. Some places refuse, some allow tattoos covered with a sticker, and some offer a private bath. Ask before you go in.","level":"core","romaji":"irezumi ga attemo hairemasu ka."},{"id":"hotel-bath-05","speaker":"you","jp":"貸切風呂を予約したいです。","kana":"かしきりぶろ を よやく したい です。","meaning":"I'd like to book a private bath.","replies":[{"jp":"何時がいいですか。","kana":"なんじ が いい です か。","meaning":"What time would you like?","romaji":"nanji ga ii desu ka."}],"note":"Ask how long a slot lasts and whether it costs extra. The door sign shows 使用中 (in use) or 空き (free).","level":"core","romaji":"kashikiriburo o yoyaku shitai desu."},{"id":"hotel-bath-06","speaker":"staff","jp":"浴衣とスリッパをご用意しております。","kana":"ゆかた と スリッパ を ごようい して おります。","meaning":"We have yukata and slippers ready for you.","note":"Wear the yukata with the left side over the right. Right over left is only for the dead.","level":"useful","romaji":"yukata to surippa o goyoui shite orimasu."},{"id":"hotel-bath-07","speaker":"you","jp":"夕食は何時からですか。","kana":"ゆうしょく は なんじ から です か。","meaning":"What time does dinner start?","replies":[{"jp":"六時か七時から選べます。","kana":"ろくじ か しちじ から えらべます。","meaning":"You can choose 6:00 or 7:00.","romaji":"rokuji ka shichiji kara erabemasu."}],"note":"Inn dinners often have set times. Tell them about any food restrictions when you book.","level":"core","romaji":"yuushoku wa nanji kara desu ka."},{"id":"hotel-bath-08","speaker":"staff","jp":"何時にお布団を敷きましょうか。","kana":"なんじ に おふとん を しきましょう か。","meaning":"What time shall we lay out your futon?","replies":[{"jp":"夕食のあとにお願いします。","kana":"ゆうしょく の あと に おねがい します。","meaning":"After dinner, please.","romaji":"yuushoku no ato ni onegai shimasu."}],"note":"You can choose a time for the futon to be laid out.","level":"useful","romaji":"nanji ni ofuton o shikimashou ka."},{"id":"hotel-bath-09","speaker":"staff","jp":"履物は脱衣所の外で脱いでください。","kana":"はきもの は だついじょ の そと で ぬいで ください。","meaning":"Take off your shoes outside the changing room.","note":"Shoes go in the locker near the entrance. Clothes go in the basket inside.","level":"useful","romaji":"hakimono wa datsuijo no soto de nuide kudasai."},{"id":"hotel-bath-10","speaker":"staff","jp":"タオルは貸し出しです。","kana":"タオル は かしだし です。","meaning":"Towels are available to borrow here.","note":"Some baths lend towels and others expect you to bring your own. Ask if you're not sure.","level":"useful","romaji":"taoru wa kashidashi desu."},{"id":"hotel-bath-11","speaker":"staff","jp":"湯船に入る前に、体を洗ってください。","kana":"ゆぶね に はいる まえ に、 からだ を あらって ください。","meaning":"Wash your body before you get into the bath.","note":"Wash at the stations with stools, rinse off all the soap, then soak. Pouring hot water over yourself first is also normal (かけ湯).","level":"core","romaji":"yubune ni hairu mae ni, karada o aratte kudasai."},{"id":"hotel-bath-12","speaker":"staff","jp":"タオルを湯船に入れないでください。","kana":"タオル を ゆぶね に いれないで ください。","meaning":"Please don't put your towel in the bath water.","note":"Keep the small towel on your head or on the edge. Bath towels stay in the changing room.","level":"core","romaji":"taoru o yubune ni irenaide kudasai."}]},{"title":"Check-out","intro":"Return the key, settle the bill, leave bags if you need to, and get to the station.","phrases":[{"id":"hotel-checkout-01","speaker":"you","jp":"チェックアウトをお願いします。","kana":"チェックアウト を おねがい します。","meaning":"Check-out, please.","replies":[{"jp":"ありがとうございます。お部屋番号をお願いします。","kana":"ありがとうございます。 おへや ばんごう を おねがい します。","meaning":"Thank you. Your room number, please.","romaji":"arigatougozaimasu. oheya bangou o onegai shimasu."}],"note":"Have your room number and key card ready.","level":"core","romaji":"chekkuauto o onegai shimasu."},{"id":"hotel-checkout-02","speaker":"staff","jp":"ルームキーをお返しください。","kana":"ルームキー を おかえし ください。","meaning":"Please return your room key.","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."}],"note":"Some hotels have a drop box for keys. Follow the sign if the desk is closed.","level":"core","romaji":"ruumukii o okaeshi kudasai."},{"id":"hotel-checkout-03","speaker":"staff","jp":"ミニバーのご利用はありますか。","kana":"ミニバー の ごりよう は あります か。","meaning":"Did you use anything from the minibar?","replies":[{"jp":"いいえ、ありません。","kana":"いいえ、 ありません。","meaning":"No, nothing.","romaji":"iie, arimasen."},{"jp":"水を一本飲みました。","kana":"みず を いっぽん のみました。","meaning":"I drank one bottle of water.","romaji":"mizu o ippon nomimashita."}],"note":"Minibar items are charged. Check the fridge before you leave.","level":"core","romaji":"minibaa no goriyou wa arimasu ka."},{"id":"hotel-checkout-04","speaker":"staff","jp":"追加のご利用はございませんでしたか。","kana":"ついか の ごりよう は ございませんでした か。","meaning":"No other extra charges?","note":"The desk is checking nothing else was added. Answer ありません if that is right.","level":"listen-only","romaji":"tsuika no goriyou wa gozaimasendeshita ka."},{"id":"hotel-checkout-05","speaker":"staff","jp":"お支払いは現金ですか、カードですか。","kana":"おしはらい は げんきん です か、 カード です か。","meaning":"Cash or card?","replies":[{"jp":"カードでお願いします。","kana":"カード で おねがい します。","meaning":"By card, please.","romaji":"kaado de onegai shimasu."}],"note":"If you're not sure your card is accepted, ask before you check out.","level":"useful","romaji":"oshiharai wa genkin desu ka, kaado desu ka."},{"id":"hotel-checkout-06","speaker":"you","jp":"領収書をお願いします。","kana":"りょうしゅうしょ を おねがい します。","meaning":"A receipt, please.","replies":[{"jp":"宛名はどうしますか。","kana":"あてな は どう します か。","meaning":"What name should it be made out to?","romaji":"atena wa dou shimasu ka."}],"note":"領収書 is a formal receipt. Ask only if you need one. 宛名 is the name printed on it.","level":"useful","romaji":"ryoushuusho o onegai shimasu."},{"id":"hotel-checkout-07","speaker":"you","jp":"チェックアウトのあとも荷物を預かってもらえますか。","kana":"チェックアウト の あと も にもつ を あずかって もらえます か。","meaning":"Could you keep our bags after check-out?","replies":[{"jp":"はい、お預かりします。","kana":"はい、 おあずかり します。","meaning":"Yes, we'll keep them.","romaji":"hai, oazukari shimasu."},{"jp":"夜八時までです。","kana":"よる はちじ まで です。","meaning":"Until 8:00 at night.","romaji":"yoru hachiji made desu."}],"note":"Ask how late you can collect them.","level":"core","romaji":"chekkuauto no ato mo nimotsu o azukatte moraemasu ka."},{"id":"hotel-checkout-08","speaker":"you","jp":"三時ごろ荷物を取りに来ます。","kana":"さんじ ごろ にもつ を とりに きます。","meaning":"We'll come for the bags around 3:00.","replies":[{"jp":"わかりました。お待ちしております。","kana":"わかりました。 おまちして おります。","meaning":"Understood. We'll be here.","romaji":"wakarimashita. omachishite orimasu."}],"note":"Say the time with じ: 三時 (sanji) is 3:00.","level":"useful","romaji":"sanji goro nimotsu o torini kimasu."},{"id":"hotel-checkout-09","speaker":"you","jp":"預けた荷物をお願いします。","kana":"あずけた にもつ を おねがい します。","meaning":"Our bags, please.","replies":[{"jp":"お預かり票を拝見します。","kana":"おあずかりひょう を はいけん します。","meaning":"I'll need to see your luggage stub.","romaji":"oazukarihyou o haiken shimasu."}],"note":"Show the stub, or give your name and room number.","level":"core","romaji":"azuketa nimotsu o onegai shimasu."},{"id":"hotel-checkout-10","speaker":"you","jp":"駅までのシャトルバスはどこで乗れますか。","kana":"えき まで の シャトルバス は どこ で のれます か。","meaning":"Where can I catch the shuttle bus to the station?","replies":[{"jp":"出てすぐ右です。","kana":"でて すぐ みぎ です。","meaning":"Right outside, on the right.","romaji":"dete sugu migi desu."},{"jp":"九時に出ます。","kana":"くじ に でます。","meaning":"It leaves at 9:00.","romaji":"kuji ni demasu."}],"note":"Ask whether the shuttle needs a booking when you reserve. A taxi is the backup.","level":"core","romaji":"eki made no shatorubasu wa doko de noremasu ka."},{"id":"hotel-checkout-11","speaker":"you","jp":"もう一泊できますか。","kana":"もう いっぱく できます か。","meaning":"Can we stay one more night?","replies":[{"jp":"確認します。","kana":"かくにん します。","meaning":"I'll check.","romaji":"kakunin shimasu."},{"jp":"満室です。","kana":"まんしつ です。","meaning":"We're fully booked.","romaji":"manshitsu desu."}],"note":"延泊 means extending your stay. Ask early in the day, since rooms may be taken.","level":"useful","romaji":"mou ippaku dekimasu ka."},{"id":"hotel-checkout-12","speaker":"staff","jp":"ありがとうございました。またお越しください。","kana":"ありがとうございました。 また おこし ください。","meaning":"Thank you. Please come again.","replies":[{"jp":"お世話になりました。","kana":"おせわ に なりました。","meaning":"Thank you for looking after us.","romaji":"osewa ni narimashita."}],"note":"A nice thing to say when you leave.","level":"core","romaji":"arigatougozaimashita. mata okoshi kudasai."}]}],"dialogues":[{"title":"Check-in at the front desk","lines":[{"speaker":"staff","jp":"いらっしゃいませ。","kana":"いらっしゃいませ。","meaning":"Welcome.","romaji":"irasshaimase."},{"speaker":"you","jp":"ディアスで予約しています。","kana":"ディアス で よやく して います。","meaning":"I have a reservation under Diaz.","romaji":"diasu de yoyaku shite imasu."},{"speaker":"staff","jp":"パスポートを拝見できますか。","kana":"パスポート を はいけん できます か。","meaning":"May I see your passport?","romaji":"pasupooto o haiken dekimasu ka."},{"speaker":"you","jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you are.","romaji":"hai, douzo."},{"speaker":"staff","jp":"お部屋は5階の512号室です。朝食は六時半から九時までです。","kana":"おへや は ごかい の ごひゃく じゅうに ごうしつ です。 ちょうしょく は ろくじはん から くじ まで です。","meaning":"Your room is 512 on the 5th floor. Breakfast is from 6:30 to 9:00.","romaji":"oheya wa gokai no gohyaku juuni goushitsu desu. choushoku wa rokujihan kara kuji made desu."},{"speaker":"you","jp":"チェックアウトは何時までですか。","kana":"チェックアウト は なんじ まで です か。","meaning":"Until what time is check-out?","romaji":"chekkuauto wa nanji made desu ka."},{"speaker":"staff","jp":"十一時までです。","kana":"じゅういちじ まで です。","meaning":"By 11:00.","romaji":"juuichiji made desu."},{"speaker":"you","jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}]},{"title":"Leaving bags before check-in","lines":[{"speaker":"you","jp":"すみません、荷物を預かってもらえますか。","kana":"すみません、 にもつ を あずかって もらえます か。","meaning":"Excuse me, could you hold our bags?","romaji":"sumimasen, nimotsu o azukatte moraemasu ka."},{"speaker":"staff","jp":"はい、お預かりします。こちらのタグにお名前をお書きください。","kana":"はい、 おあずかり します。 こちら の タグ に おなまえ を おかき ください。","meaning":"Yes, we'll keep them. Please write your name on this tag.","romaji":"hai, oazukari shimasu. kochira no tagu ni onamae o okaki kudasai."},{"speaker":"you","jp":"ローマ字でいいですか。","kana":"ローマじ で いい です か。","meaning":"Is romaji OK?","romaji":"roomaji de ii desu ka."},{"speaker":"staff","jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."},{"speaker":"you","jp":"チェックインは何時からですか。","kana":"チェックイン は なんじ から です か。","meaning":"What time is check-in?","romaji":"chekkuin wa nanji kara desu ka."},{"speaker":"staff","jp":"十五時からです。","kana":"じゅうごじ から です。","meaning":"From 15:00.","romaji":"juugoji kara desu."},{"speaker":"you","jp":"では、十五時半ごろに戻ります。","kana":"では、 じゅうごじはん ごろ に もどります。","meaning":"Then we'll come back around 15:30.","romaji":"dewa, juugojihan goro ni modorimasu."},{"speaker":"staff","jp":"かしこまりました。お待ちしております。","kana":"かしこまりました。 おまちして おります。","meaning":"Certainly. We'll be here.","romaji":"kashikomarimashita. omachishite orimasu."},{"speaker":"you","jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}]},{"title":"Sending bags to the next hotel","lines":[{"speaker":"you","jp":"荷物を次のホテルに送りたいです。","kana":"にもつ を つぎ の ホテル に おくりたい です。","meaning":"I want to send our luggage to the next hotel.","romaji":"nimotsu o tsugi no hoteru ni okuritai desu."},{"speaker":"staff","jp":"こちらの伝票にご記入ください。","kana":"こちら の でんぴょう に ごきにゅう ください。","meaning":"Please fill in this slip.","romaji":"kochira no denpyou ni gokinyuu kudasai."},{"speaker":"you","jp":"明日の午後に着きますか。","kana":"あした の ごご に つきます か。","meaning":"Will it arrive tomorrow afternoon?","romaji":"ashita no gogo ni tsukimasu ka."},{"speaker":"staff","jp":"はい、明日の午後に届きます。","kana":"はい、 あした の ごご に とどきます。","meaning":"Yes, it will arrive tomorrow afternoon.","romaji":"hai, ashita no gogo ni todokimasu."},{"speaker":"you","jp":"何時までに出せばいいですか。","kana":"なんじ まで に だせば いい です か。","meaning":"By what time do I need to hand it in?","romaji":"nanji made ni daseba ii desu ka."},{"speaker":"staff","jp":"午前十一時までにお持ちください。","kana":"ごぜん じゅういちじ まで に おもち ください。","meaning":"Please bring it in by 11:00 in the morning.","romaji":"gozen juuichiji made ni omochi kudasai."},{"speaker":"you","jp":"料金はいくらですか。","kana":"りょうきん は いくら です か。","meaning":"How much does it cost?","romaji":"ryoukin wa ikura desu ka."},{"speaker":"staff","jp":"サイズによって変わります。","kana":"サイズ に よって かわります。","meaning":"It depends on the size.","romaji":"saizu ni yotte kawarimasu."},{"speaker":"you","jp":"控えをもらえますか。","kana":"ひかえ を もらえます か。","meaning":"Can I get a copy of the slip?","romaji":"hikae o moraemasu ka."}]}],"signs":[{"jp":"フロント","kana":"フロント","meaning":"Front desk","where":"Lobby, main desk","romaji":"furonto"},{"jp":"大浴場","kana":"だいよくじょう","meaning":"Large public bath","where":"Entrance to the bath area","romaji":"daiyokujou"},{"jp":"男湯","kana":"おとこゆ","meaning":"Men's bath","where":"Bath entrance, on the noren curtain","romaji":"otokoyu"},{"jp":"女湯","kana":"おんなゆ","meaning":"Women's bath","where":"Bath entra
