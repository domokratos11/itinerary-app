speaker":"staff","jp":"見つかりましたら、ご連絡いたします。","kana":"みつかりましたら、 ごれんらく いたします。","meaning":"If it is found, we will contact you.","also_heard":[{"jp":"お忘れ物取扱所にお問い合わせください。","kana":"おわすれもの とりあつかいじょ に おといあわせ ください。","meaning":"Please contact the lost-and-found office.","romaji":"owasuremono toriatsukaijo ni otoiawase kudasai."},{"jp":"お預かりしております。","kana":"おあずかり して おります。","meaning":"We have it here.","romaji":"oazukari shite orimasu."}],"level":"listen-only","romaji":"mitsukarimashitara, gorenraku itashimasu."},{"id":"trains-trouble-08","speaker":"you","jp":"着払いで送ってもらえますか。","kana":"ちゃくばらい で おくって もらえます か。","meaning":"Could you send it cash on delivery?","note":"着払い means the receiver pays the delivery fee.","level":"useful","romaji":"chakubarai de okutte moraemasu ka."},{"id":"trains-trouble-09","speaker":"you","jp":"ICカードが使えなくなりました。","kana":"アイシーカード が つかえなく なりました。","meaning":"My IC card has stopped working.","replies":[{"jp":"カードを確認します。","kana":"カード を かくにん します。","meaning":"I'll check the card.","romaji":"kaado o kakunin shimasu."},{"jp":"磁気の影響かもしれません。","kana":"じき の えいきょう かも しれません。","meaning":"It may be due to magnetism.","romaji":"jiki no eikyou kamo shiremasen."}],"level":"useful","romaji":"aishiikaado ga tsukaenaku narimashita."},{"id":"trains-trouble-10","speaker":"you","jp":"次の電車は何時ですか。乗り継ぎに間に合いますか。","kana":"つぎ の でんしゃ は なんじ です か。 のりつぎ に まにあいます か。","meaning":"What time is the next train? Will I make my connection?","level":"useful","romaji":"tsugi no densha wa nanji desu ka. noritsugi ni maniaimasu ka."},{"id":"trains-trouble-11","speaker":"staff","jp":"遅延証明書はあちらで配っております。","kana":"ちえんしょうめいしょ は あちら で くばって おります。","meaning":"Delay certificates are being handed out over there.","note":"A delay certificate can help you explain a late arrival to your employer or your hotel.","level":"listen-only","romaji":"chienshoumeisho wa achira de kubatte orimasu."}]}],"dialogues":[{"title":"Shinkansen, Tokyo to Nagoya, two people with large suitcases","lines":[{"speaker":"staff","jp":"いらっしゃいませ。どちらまでですか。","kana":"いらっしゃいませ。 どちら まで です か。","meaning":"Welcome. Where to?","romaji":"irasshaimase. dochira made desu ka."},{"speaker":"you","jp":"名古屋まで、大人2枚お願いします。今日の11時ごろの新幹線で。","kana":"なごや まで、 おとな に まい おねがい します。 きょう の じゅういちじ ごろ の しんかんせん で。","meaning":"Nagoya, two adults, on the Shinkansen around 11 o'clock today.","romaji":"nagoya made, otona ni mai onegai shimasu. kyou no juuichiji goro no shinkansen de."},{"speaker":"staff","jp":"指定席でよろしいですか。","kana":"していせき で よろしい です か。","meaning":"Reserved seats are OK?","romaji":"shiteiseki de yoroshii desu ka."},{"speaker":"you","jp":"はい。大きいスーツケースが2つあるので、特大荷物スペースつきの席はありますか。","kana":"はい。 おおきい スーツケース が ふたつ ある ので、 とくだい にもつ スペース つき の せき は あります か。","meaning":"Yes. We have two large suitcases, so are there seats with large-baggage space?","romaji":"hai. ookii suutsukeesu ga futatsu aru node, tokudai nimotsu supeesu tsuki no seki wa arimasu ka."},{"speaker":"staff","jp":"11時3分ののぞみでしたら、一番後ろの席が2つ並びでございます。E席とD席です。","kana":"じゅういちじ さんぷん の のぞみ でしたら、 いちばん うしろ の せき が ふたつ ならび で ございます。 イーせき と ディーせき です。","meaning":"For the 11:03 Nozomi, there are two seats together in the last row. They are seats E and D.","romaji":"juuichiji sanpun no nozomi deshitara, ichiban ushiro no seki ga futatsu narabi de gozaimasu. iiseki to diiseki desu."},{"speaker":"you","jp":"富士山が見える側ですか。","kana":"ふじさん が みえる がわ です か。","meaning":"Is that the side where Mt Fuji can be seen?","romaji":"fujisan ga mieru gawa desu ka."},{"speaker":"staff","jp":"はい、E席から見えますよ。","kana":"はい、 イーせき から みえます よ。","meaning":"Yes, you can see it from seat E.","romaji":"hai, iiseki kara miemasu yo."},{"speaker":"you","jp":"じゃあ、それでお願いします。カードで。","kana":"じゃあ、 それで おねがい します。 カード で。","meaning":"Then that one, please. By card.","romaji":"jaa, sorede onegai shimasu. kaado de."},{"speaker":"staff","jp":"こちら、乗車券と特急券です。2枚重ねて改札にお通しください。","kana":"こちら、 じょうしゃけん と とっきゅうけん です。 にまい かさねて かいさつ に おとおし ください。","meaning":"Here are your base fare ticket and express ticket. Please put both through the gate together.","romaji":"kochira, joushaken to tokkyuuken desu. nimai kasanete kaisatsu ni otooshi kudasai."}]},{"title":"Ticket rejected at the gate, Ueno to Asakusa","lines":[{"speaker":"you","jp":"すみません、カードが通らないんですが。","kana":"すみません、 カード が とおらない ん です が。","meaning":"Excuse me, my card won't go through.","romaji":"sumimasen, kaado ga tooranai n desu ga."},{"speaker":"staff","jp":"カードをお預かりします。残高が足りませんね。どちらから乗られましたか。","kana":"カード を おあずかり します。 ざんだか が たりません ね。 どちら から のられました か。","meaning":"I'll take your card. The balance is not enough. Where did you get on?","romaji":"kaado o oazukari shimasu. zandaka ga tarimasen ne. dochira kara noraremashita ka."},{"speaker":"you","jp":"上野からです。","kana":"うえの から です。","meaning":"From Ueno.","romaji":"ueno kara desu."},{"speaker":"staff","jp":"不足額を精算しますか、チャージしますか。","kana":"ふそくがく を せいさん します か、 チャージ します か。","meaning":"Will you pay the shortfall or top up?","romaji":"fusokugaku o seisan shimasu ka, chaaji shimasu ka."},{"speaker":"you","jp":"じゃあ、千円チャージしてください。","kana":"じゃあ、 せんえん チャージ して ください。","meaning":"Then please top up 1,000 yen.","romaji":"jaa, sen'en chaaji shite kudasai."},{"speaker":"staff","jp":"はい、どうぞ。そのまま改札を通れます。","kana":"はい、 どうぞ。 そのまま かいさつ を とおれます。","meaning":"Here you are. You can go through the gate now.","romaji":"hai, douzo. sonomama kaisatsu o tooremasu."}]},{"title":"On the platform: is this the right train? Osaka to Sannomiya","lines":[{"speaker":"you","jp":"すみません、この電車は三ノ宮に止まりますか。","kana":"すみません、 この でんしゃ は さんのみや に とまります か。","meaning":"Excuse me, does this train stop at Sannomiya?","romaji":"sumimasen, kono densha wa sannomiya ni tomarimasu ka."},{"speaker":"staff","jp":"これは普通なので止まりますが、時間がかかります。次の新快速が早いですよ。","kana":"これ は ふつう なので とまります が、 じかん が かかります。 つぎ の しんかいそく が はやい です よ。","meaning":"This is a local, so it stops there, but it takes longer. The next special rapid is faster.","romaji":"kore wa futsuu nanode tomarimasu ga, jikan ga kakarimasu. tsugi no shinkaisoku ga hayai desu yo."},{"speaker":"you","jp":"新快速は何番線ですか。","kana":"しんかいそく は なんばんせん maji":"untenshu"},{"jp":"住所","kana":"じゅうしょ","meaning":"address","romaji":"juusho"}]},{"title":"Direction words","items":[{"jp":"右","kana":"みぎ","meaning":"right","romaji":"migi"},{"jp":"左","kana":"ひだり","meaning":"left","romaji":"hidari"},{"jp":"右側","kana":"みぎがわ","meaning":"right side","romaji":"migigawa"},{"jp":"左側","kana":"ひだりがわ","meaning":"left side","romaji":"hidarigawa"},{"jp":"まっすぐ","kana":"まっすぐ","meaning":"straight ahead","romaji":"massugu"},{"jp":"前","kana":"まえ","meaning":"front","romaji":"mae"},{"jp":"後ろ","kana":"うしろ","meaning":"back, behind","romaji":"ushiro"},{"jp":"向こう","kana":"むこう","meaning":"over there, across","romaji":"mukou"},{"jp":"反対側","kana":"はんたいがわ","meaning":"opposite side","romaji":"hantaigawa"},{"jp":"隣","kana":"となり","meaning":"next to","romaji":"tonari"},{"jp":"手前","kana":"てまえ","meaning":"this side, just before","romaji":"temae"},{"jp":"奥","kana":"おく","meaning":"far end, inside","romaji":"oku"},{"jp":"突き当たり","kana":"つきあたり","meaning":"end of the corridor","romaji":"tsukiatari"},{"jp":"上","kana":"うえ","meaning":"up, above","romaji":"ue"},{"jp":"下","kana":"した","meaning":"down, below","romaji":"shita"},{"jp":"上の階","kana":"うえ の かい","meaning":"upper floor","romaji":"ue no kai"},{"jp":"下の階","kana":"した の かい","meaning":"lower floor","romaji":"shita no kai"},{"jp":"地下","kana":"ちか","meaning":"underground","romaji":"chika"},{"jp":"地上","kana":"ちじょう","meaning":"ground level","romaji":"chijou"},{"jp":"階段","kana":"かいだん","meaning":"stairs","romaji":"kaidan"},{"jp":"一番前","kana":"いちばんまえ","meaning":"the very front","romaji":"ichibanmae"},{"jp":"一番後ろ","kana":"いちばんうしろ","meaning":"the very back","romaji":"ichiban'ushiro"},{"jp":"端","kana":"はし","meaning":"end (of a platform)","romaji":"hashi"},{"jp":"方面","kana":"ほうめん","meaning":"direction (towards)","romaji":"houmen"},{"jp":"東京寄り","kana":"とうきょうより","meaning":"toward the Tokyo side","romaji":"toukyouyori"},{"jp":"三番目","kana":"さんばんめ","meaning":"the third one","romaji":"sanbanme"}]}],"_num":"03"},{"slug":"restaurants","title":"Restaurants and cafes","title_jp":"食事","summary":"Seating, ordering, allergies, regional dishes, paying","situations":[{"title":"Arriving and getting seated","intro":"The first 30 seconds: the count, the seat type, and waiting your turn.","phrases":[{"id":"restaurants-seat-01","speaker":"staff","jp":"いらっしゃいませ。何名様ですか？","kana":"いらっしゃいませ。 なんめいさま です か？","meaning":"Welcome. How many people?","also_heard":[{"jp":"何名様でしょうか？","kana":"なんめいさま でしょう か？","meaning":"How many in your party?","romaji":"nanmeisama deshou ka?"},{"jp":"何人ですか？","kana":"なんにん です か？","meaning":"How many people? (casual)","romaji":"nannin desu ka?"}],"replies":[{"jp":"二人です。","kana":"ふたり です。","meaning":"Two people.","romaji":"futari desu."},{"jp":"一人です。","kana":"ひとり です。","meaning":"One person.","romaji":"hitori desu."}],"note":"Often asked while you are still at the door. Holding up fingers works, but saying the number is clearer.","level":"core","romaji":"irasshaimase. nanmeisama desu ka?"},{"id":"restaurants-seat-02","speaker":"staff","jp":"ご予約はされていますか？","kana":"ごよやく は されています か？","meaning":"Do you have a reservation?","also_heard":[{"jp":"ご予約はありますか？","kana":"ごよやく は あります か？","meaning":"Do you have a reservation?","romaji":"goyoyaku wa arimasu ka?"},{"jp":"ご予約のお客様ですか？","kana":"ごよやく の おきゃくさま です か？","meaning":"Are you our reservation guests?","romaji":"goyoyaku no okyakusama desu ka?"}],"replies":[{"jp":"いいえ、してません。","kana":"いいえ、 してません。","meaning":"No, we don't have one.","romaji":"iie, shitemasen."},{"jp":"はい、レイで予約しています。","kana":"はい、 レイ で よやく しています。","meaning":"Yes, under the name Rei.","romaji":"hai, rei de yoyaku shiteimasu."}],"note":"If you booked, give your name in katakana, such as レイ. A 予約制 sign on the door means reservations are required.","level":"core","romaji":"goyoyaku wa sareteimasu ka?"},{"id":"restaurants-seat-03","speaker":"staff","jp":"禁煙席と喫煙席、どちらがよろしいですか？","kana":"きんえんせき と きつえんせき、 どちら が よろしい です か？","meaning":"Non-smoking or smoking seats?","also_heard":[{"jp":"おタバコは吸われますか？","kana":"おたばこ は すわれます か？","meaning":"Do you smoke?","romaji":"otabako wa suwaremasu ka?"}],"replies":[{"jp":"禁煙でお願いします。","kana":"きんえん で おねがい します。","meaning":"Non-smoking, please.","romaji":"kin'en de onegai shimasu."},{"jp":"喫煙席でお願いします。","kana":"きつえんせき で おねがい します。","meaning":"Smoking seat, please.","romaji":"kitsuenseki de onegai shimasu."}],"note":"Many izakaya still allow smoking, and some shops have separate heated-tobacco seats. Say 禁煙でお願いします to ask for a smoke-free seat.","level":"core","romaji":"kin'enseki to kitsuenseki, dochira ga yoroshii desu ka?"},{"id":"restaurants-seat-04","speaker":"staff","jp":"カウンターになりますが、よろしいですか？","kana":"カウンター に なります が、 よろしい です か？","meaning":"It will be a counter seat. Is that OK?","also_heard":[{"jp":"テーブルとカウンター、どちらがいいですか？","kana":"テーブル と カウンター、 どちら が いい です か？","meaning":"Table or counter?","romaji":"teeburu to kauntaa, dochira ga ii desu ka?"}],"replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."},{"jp":"できればテーブルがいいです。","kana":"できれば テーブル が いい です。","meaning":"If possible, a table, please.","romaji":"dekireba teeburu ga ii desu."}],"note":"になりますが means the seat is not what you asked for. Answer politely; you can ask for a table if one is free.","level":"core","romaji":"kauntaa ni narimasu ga, yoroshii desu ka?"},{"id":"restaurants-seat-05","speaker":"staff","jp":"ただいま満席です。","kana":"ただいま まんせき です。","meaning":"We are full right now.","also_heard":[{"jp":"席が空いておりません。","kana":"せき が あいて おりません。","meaning":"No seats are free.","romaji":"seki ga aite orimasen."},{"jp":"いっぱいです。","kana":"いっぱい です。","meaning":"We're full.","romaji":"ippai desu."}],"replies":[{"jp":"はい、待ちます。","kana":"はい、 まちます。","meaning":"Yes, we'll wait.","romaji":"hai, machimasu."},{"jp":"また今度にします。","kana":"また こんど に します。","meaning":"We'll come another time.","romaji":"mata kondo ni shimasu."}],"note":"満席 is also written on a sign at the door. If you want to wait, ask how long it will take.","level":"core","romaji":"tadaima manseki desu."},{"id":"restaurants-seat-06","speaker":"staff","jp":"20分ほどお待ちいただきますが、よろしいですか？","kana":"にじゅっぷん ほど おまち いただきます が、 よろしい です か？","meaning":"The wait is about 20 minutes. Is that OK?","also_heard":[{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"Please wait a moment.","romaji":"shoushou omachi kudasai."},{"jp":"30分くらいかかります。","kana":"さんじゅっぷん くらい かかります。","meaning":"It will take about 30 minutes.","romaji":"sanjuppun kurai kakarimasu."}],"replies":[{"jp":"はい、待ちます。","kana":"はい、 まちます。","meaning":"Yes, we'll wait.","romaji":"hai, machimasu."},{"jp":"今回は大丈夫です。","kana":"こんかい は だいじょうぶ です。","meaning":"Not this time, thanks.","romaji":"konkai wa daijoubu desu."}],"note":"ほど and くらい both mean about. Listen for the number of minutes, such as 20分 for twenty minutes.","level":"core","romaji":"nijuppun hodo omachi itadakimasu ga, yoroshii desu ka?"},{"id":"restaurants-seat-07","speaker":"staff","jp":"こちらにお名前を書いてお待ちください。","kana":"こちら に おなまえ を かいて おまち ください。","meaning":"Please write your name here and wait.","also_heard":[{"jp":"名前と人数を書いてください。","kana":"なまえ と にんずう を かいて ください。","meaning":"Write your name and party size, please.","romaji":"namae to ninzuu o kaite kudasai."}],"replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."},{"jp":"レイ、二人です。","kana":"レイ、 ふたり です。","meaning":"Rei, two people.","romaji":"rei, futari desu."}],"note":"Some places use a paper list by the door, and chains may use a tablet. Write your name in katakana, such as レイ, plus the party size.","level":"core","romaji":"kochira ni onamae o kaite omachi kudasai."},{"id":"restaurants-seat-08","speaker":"staff","jp":"お呼びしますので、外でお待ちください。","kana":"およびします ので、 そと で おまち ください。","meaning":"We'll call you, so please wait outside.","also_heard":[{"jp":"番号札をお取りください。","kana":"ばんごうふだ を おとり ください。","meaning":"Please take a numbered slip.","romaji":"bangoufuda o otori kudasai."},{"jp":"順番にお呼びします。","kana":"じゅんばん に およびします。","meaning":"We'll call you in order.","romaji":"junban ni oyobishimasu."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"A kiosk may print a numbered slip. Listen for your number, which is called as ○番のお客様 instead of your name.","level":"useful","romaji":"oyobishimasu node, soto de omachi kudasai."},{"id":"restaurants-seat-09","speaker":"staff","jp":"レイ様、お待たせいたしました。","kana":"レイ さま、 おまたせいたしました。","meaning":"Rei, thank you for waiting.","also_heard":[{"jp":"ご案内します。","kana":"ごあんないします。","meaning":"We'll show you to your seat.","romaji":"goannaishimasu."},{"jp":"お席のご用意ができました。","kana":"おせき の ごよう い が できました。","meaning":"Your seat is ready.","romaji":"oseki no goyou i ga dekimashita."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes, here I am.","romaji":"hai."}],"note":"They read the name you wrote, or call the number. Listen for the katakana name or the number.","level":"core","romaji":"rei sama, omataseitashimashita."},{"id":"restaurants-seat-10","speaker":"staff","jp":"靴を脱いでおあがりください。","kana":"くつ を ぬいで おあがり ください。","meaning":"Please take off your shoes and step up.","also_heard":[{"jp":"下駄箱に靴を入れてください。","kana":"げたばこ に くつ を いれて ください。","meaning":"Please put your shoes in the shoe locker.","romaji":"getabako ni kutsu o irete kudasai."},{"jp":"掘りごたつ席もあります。","kana":"ほりごたつ せき も あります。","meaning":"We also have sunken-floor seats.","romaji":"horigotatsu seki mo arimasu."}],"replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."}],"note":"Keep the key or tag from the shoe locker. Take off bathroom slippers before stepping onto tatami. 掘りごたつ has a sunken leg space, easier on the knees.","level":"useful","romaji":"kutsu o nuide oagari kudasai."},{"id":"restaurants-seat-11","speaker":"staff","jp":"お荷物はこちらのかごをお使いください。","kana":"おにもつ は こちら の かご を おつかい ください。","meaning":"Please use this basket for your bags.","also_heard":[{"jp":"上着はこちらにどうぞ。","kana":"うわぎ は こちら に どうぞ。","meaning":"Please hang your coat here.","romaji":"uwagi wa kochira ni douzo."},{"jp":"椅子の下に荷物入れがあります。","kana":"いす の した に にもついれ が あります。","meaning":"There is a bag space under the chair.","romaji":"isu no shita ni nimotsuire ga arimasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"The basket is under or beside the seat. Keep bags off the seat and floor in tidy shops.","level":"useful","romaji":"onimotsu wa kochira no kago o otsukai kudasai."},{"id":"restaurants-seat-12","speaker":"you","jp":"予約なしでも大丈夫ですか？","kana":"よやく なし でも だいじょうぶ です か？","meaning":"Is it OK without a reservation?","replies":[{"jp":"大丈夫ですよ。","kana":"だいじょうぶ です よ。","meaning":"Yes, that's fine.","romaji":"daijoubu desu yo."},{"jp":"申し訳ありません、本日は予約のお客様のみです。","kana":"もうしわけ ありません、 ほんじつ は よやく の おきゃくさま のみ です。","meaning":"Sorry, today we only take reservations.","romaji":"moushiwake arimasen, honjitsu wa yoyaku no okyakusama nomi desu."}],"note":"Some places are reservation-only, and the door says 予約制. Ask before you wait outside.","level":"useful","romaji":"yoyaku nashi demo daijoubu desu ka?"}]},{"title":"Ticket-machine restaurants (食券)","intro":"Ramen, gyudon, soba and curry counters often make you pay first at a machine.","phrases":[{"id":"restaurants-ticket-01","speaker":"staff","jp":"先に券売機で食券をお買い求めください。","kana":"さき に けんばいき で しょっけん を おかいもとめ ください。","meaning":"Please buy your meal ticket at the machine first.","also_heard":[{"jp":"食券を先にお願いします。","kana":"しょっけん を さき に おねがい します。","meaning":"Tickets first, please.","romaji":"shokken o saki ni onegai shimasu."},{"jp":"先払いになります。","kana":"さきばらい に なります。","meaning":"Payment is up front.","romaji":"sakibarai ni narimasu."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Buy before you sit if the machine is by the door. Insert bills first; the buttons light up as the machine reads your money. Some machines take cash only.","level":"core","romaji":"saki ni kenbaiki de shokken o okaimotome kudasai."},{"id":"restaurants-ticket-02","speaker":"staff","jp":"お好きな席にどうぞ。","kana":"おすき な せき に どうぞ。","meaning":"Sit anywhere you like.","also_heard":[{"jp":"空いてるお席へどうぞ。","kana":"あいてる おせき へ どうぞ。","meaning":"Please take any free seat.","romaji":"aiteru oseki e douzo."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"At counter shops, take the next free stool. Staff may point you to a specific seat.","level":"core","romaji":"osuki na seki ni douzo."},{"id":"restaurants-ticket-03","speaker":"staff","jp":"食券をカウンターにお出しください。","kana":"しょっけん を カウンター に おだし ください。","meaning":"Please put your ticket on the counter.","also_heard":[{"jp":"食券をお預かりします。","kana":"しょっけん を おあずかり します。","meaning":"I'll take your ticket.","romaji":"shokken o oazukari shimasu."},{"jp":"食券をこちらに置いてください。","kana":"しょっけん を こちら に おいて ください。","meaning":"Please place the ticket here.","romaji":"shokken o kochira ni oite kudasai."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Here you go.","romaji":"onegai shimasu."}],"note":"Place the ticket at the edge of the counter where staff can see it. They will take it from there.","level":"core","romaji":"shokken o kauntaa ni odashi kudasai."},{"id":"restaurants-ticket-04","speaker":"staff","jp":"麺の硬さはどうされますか？","kana":"めん の かたさ は どう されます か？","meaning":"How firm would you like the noodles?","also_heard":[{"jp":"かたさはいかがなさいますか？","kana":"かたさ は いかが なさいます か？","meaning":"How would you like the firmness?","romaji":"katasa wa ikaga nasaimasu ka?"}],"replies":[{"jp":"普通でお願いします。","kana":"ふつう で おねがい します。","meaning":"Regular, please.","romaji":"futsuu de onegai shimasu."},{"jp":"かためでお願いします。","kana":"かため で おねがい します。","meaning":"Firm, please.","romaji":"katame de onegai shimasu."},{"jp":"やわらかめで。","kana":"やわらかめ で。","meaning":"Softer, please.","romaji":"yawarakame de."}],"note":"Hakata shops also offer バリカタ and ハリガネ, which are firmer. If unsure, say 普通 (regular).","level":"core","romaji":"men no katasa wa dou saremasu ka?"},{"id":"restaurants-ticket-05","speaker":"staff","jp":"味の濃さ、油の量、ねぎはどうしますか？","kana":"あじ の こさ、 あぶら の りょう、 ねぎ は どう します か？","meaning":"How rich, how much oil, and spring onion?","also_heard":[{"jp":"ねぎ多めにしますか？","kana":"ねぎ おおめ に します か？","meaning":"Extra spring onion?","romaji":"negi oome ni shimasu ka?"}],"replies":[{"jp":"全部普通で。","kana":"ぜんぶ ふつう で。","meaning":"Everything regular.","romaji":"zenbu futsuu de."},{"jp":"濃いめで。","kana":"こいめ で。","meaning":"A bit richer, please.","romaji":"koime de."}],"note":"全部普通で is a safe shortcut. Some tonkotsu chains give you a paper order sheet to tick instead.","level":"core","romaji":"aji no kosa, abura no ryou, negi wa dou shimasu ka?"},{"id":"restaurants-ticket-06","speaker":"staff","jp":"ニンニクは入れますか？","kana":"ニンニク は いれます か？","meaning":"Do you want garlic in it?","also_heard":[{"jp":"ニンニクはどうしますか？","kana":"ニンニク は どう します か？","meaning":"What about garlic?","romaji":"ninniku wa dou shimasu ka?"}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"なしでお願いします。","kana":"なし で おねがい します。","meaning":"Without, please.","romaji":"nashi de onegai shimasu."}],"note":"Keep it plain if you are unsure: なしでお願いします. Garlic is often asked just before the bowl comes out.","level":"useful","romaji":"ninniku wa iremasu ka?"},{"id":"restaurants-ticket-07","speaker":"you","jp":"マシマシでお願いします。","kana":"マシマシ で おねがい します。","meaning":"Double the toppings, please.","replies":[{"jp":"はい、かしこまりました。","kana":"はい、 かしこまりました。","meaning":"Certainly.","romaji":"hai, kashikomarimashita."}],"note":"Jiro-style shops: マシ means more and マシマシ roughly double. Larger sizes are not accepted everywhere, so check first. Listen-only for most visitors.","level":"listen-only","romaji":"mashimashi de onegai shimasu."},{"id":"restaurants-ticket-08","speaker":"staff","jp":"大盛りは無料ですが、いかがですか？","kana":"おおもり は むりょう です が、 いかが です か？","meaning":"Large portion is free. Would you like one?","also_heard":[{"jp":"替え玉はいかがですか？","kana":"かえだま は いかが です か？","meaning":"Would you like extra noodles?","romaji":"kaedama wa ikaga desu ka?"}],"replies":[{"jp":"大盛りでお願いします。","kana":"おおもり で おねがい します。","meaning":"Large, please.","romaji":"oomori de onegai shimasu."},{"jp":"並でいいです。","kana":"なみ で いい です。","meaning":"Regular is fine.","romaji":"nami de ii desu."}],"note":"Free large portions are common at gyudon, soba and lunch shops. Look for the sign 大盛り無料 before ordering.","level":"useful","romaji":"oomori wa muryou desu ga, ikaga desu ka?"},{"id":"restaurants-ticket-09","speaker":"staff","jp":"お水はセルフサービスです。","kana":"おみず は セルフサービス です。","meaning":"Water is self-service.","also_heard":[{"jp":"お冷はあちらです。","kana":"おひや は あちら です。","meaning":"Cold water is over there.","romaji":"ohiya wa achira desu."},{"jp":"お水はご自由にどうぞ。","kana":"おみず は ごじゆう に どうぞ。","meaning":"Help yourself to water.","romaji":"omizu wa gojiyuu ni douzo."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"The water is usually by the entrance or on the counter. Take a cup and fill it. Ask for 氷 (ice) if you want ice.","level":"useful","romaji":"omizu wa serufusaabisu desu."},{"id":"restaurants-ticket-10","speaker":"staff","jp":"お待たせしました。醤油ラーメンです。","kana":"おまたせしました。 しょうゆ ラーメン です。","meaning":"Thanks for waiting. Here is your soy sauce ramen.","also_heard":[{"jp":"ラーメンのお客様、お待たせしました。","kana":"ラーメン の おきゃくさま、 おまたせしました。","meaning":"Ramen customer, thanks for waiting.","romaji":"raamen no okyakusama, omataseshimashita."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"They may call the dish name instead of the ticket number. Watch for the bowl that matches your ticket.","level":"core","romaji":"omataseshimashita. shouyu raamen desu."},{"id":"restaurants-ticket-11","speaker":"staff","jp":"食券を買い直してください。","kana":"しょっけん を かいなおして ください。","meaning":"Please buy another ticket.","also_heard":[{"jp":"追加は食券でお願いします。","kana":"ついか は しょっけん で おねがい します。","meaning":"Extras need a ticket, please.","romaji":"tsuika wa shokken de onegai shimasu."},{"jp":"食券が足りません。","kana":"しょっけん が たりません。","meaning":"You don't have enough tickets.","romaji":"shokken ga tarimasen."}],"replies":[{"jp":"すみません、追加の食券を買ってきます。","kana":"すみません、 ついか の しょっけん を かってきます。","meaning":"Sorry, I'll buy an extra ticket.","romaji":"sumimasen, tsuika no shokken o kattekimasu."},{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Okay, understood.","romaji":"hai, wakarimashita."}],"note":"Extra toppings or 替え玉 may need a new ticket from the machine. Sometimes they are paid for at the counter.","level":"useful","romaji":"shokken o kainaoshite kudasai."},{"id":"restaurants-ticket-12","speaker":"staff","jp":"食券を買ってからお並びください。","kana":"しょっけん を かって から おならびください。","meaning":"Please buy your ticket, then queue.","also_heard":[{"jp":"空いてるお席にお座りください。","kana":"あいてる おせき に おすわり ください。","meaning":"Please sit at any free seat.","romaji":"aiteru oseki ni osuwari kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"At popular ramen shops the queue forms outside. Watch what the people in front do, since routines vary by shop.","level":"useful","romaji":"shokken o katte kara onarabikudasai."}]},{"title":"Tablet, QR and call-button ordering","intro":"Staff mostly explain once, quickly, then leave you alone.","phrases":[{"id":"restaurants-tablet-01","speaker":"staff","jp":"ご注文はこちらのタブレットからお願いします。","kana":"ごちゅうもん は こちら の タブレット から おねがい します。","meaning":"Please order from this tablet.","also_heard":[{"jp":"注文はタッチパネルでお願いします。","kana":"ちゅうもん は タッチパネル で おねがい します。","meaning":"Please order on the touch panel.","romaji":"chuumon wa tatchipaneru de onegai shimasu."},{"jp":"こちらのQRコードからお願いします。","kana":"こちら の キューアールコード から おねがい します。","meaning":"Please order from this QR code.","romaji":"kochira no kyuuaarukoodo kara onegai shimasu."}],"replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"Many chains use a QR code you scan with your own phone. Some shops only have the tablet or touch panel.","level":"core","romaji":"gochuumon wa kochira no taburetto kara onegai shimasu."},{"id":"restaurants-tablet-02","speaker":"you","jp":"英語のメニューはありますか？","kana":"えいご の メニュー は あります か？","meaning":"Is there an English menu?","replies":[{"jp":"画面の右上で言語を変えられます。","kana":"がめん の みぎうえ で げんご を かえられます。","meaning":"You can change the language at the top right of the screen.","romaji":"gamen no migiue de gengo o kaeraremasu."},{"jp":"英語メニューございます。","kana":"えいご メニュー ございます。","meaning":"We have an English menu.","romaji":"eigo menyuu gozaimasu."}],"note":"Tablets usually have a language button, often labelled English. QR menus follow your phone's language setting.","level":"core","romaji":"eigo no menyuu wa arimasu ka?"},{"id":"restaurants-tablet-03","speaker":"staff","jp":"ご注文が決まりましたら、ボタンを押してお呼びください。","kana":"ごちゅうもん が きまりましたら、 ボタン を おして および ください。","meaning":"When you've decided, press the button to call us.","also_heard":[{"jp":"決まったら、ベルを押してください。","kana":"きまったら、 ベル を おして ください。","meaning":"When you've decided, press the bell.","romaji":"kimattara, beru o oshite kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"The call button is usually on the table edge. It makes a chime, and staff come over.","level":"core","romaji":"gochuumon ga kimarimashitara, botan o oshite oyobi kudasai."},{"id":"restaurants-tablet-04","speaker":"staff","jp":"ご注文はお決まりですか？","kana":"ごちゅうもん は おきまり です か？","meaning":"Have you decided on your order?","also_heard":[{"jp":"ご注文お伺いします。","kana":"ごちゅうもん おうかがい します。","meaning":"I'll take your order now.","romaji":"gochuumon oukagai shimasu."},{"jp":"お決まりでしたらお伺いします。","kana":"おきまり でしたら おうかがい します。","meaning":"If you've decided, I'll take your order.","romaji":"okimari deshitara oukagai shimasu."}],"replies":[{"jp":"はい、これをお願いします。","kana":"はい、 これ を おねがい します。","meaning":"Yes, this one, please.","romaji":"hai, kore o onegai shimasu."},{"jp":"もう少し待ってください。","kana":"もう すこし まって ください。","meaning":"Please give us a little more time.","romaji":"mou sukoshi matte kudasai."}],"note":"Usually said after you press the call button. Point at the menu item while you answer.","level":"core","romaji":"gochuumon wa okimari desu ka?"},{"id":"restaurants-tablet-05","speaker":"staff","jp":"先にお飲み物だけ入力してください。","kana":"さき に おのみもの だけ にゅうりょく して ください。","meaning":"Please enter your drinks first.","also_heard":[{"jp":"まずはお飲み物から。","kana":"まず は おのみもの から。","meaning":"Drinks first.","romaji":"mazu wa onomimono kara."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Some places, especially izakaya, want drinks ordered first. Food can follow in a second round.","level":"useful","romaji":"saki ni onomimono dake nyuuryoku shite kudasai."},{"id":"restaurants-tablet-06","speaker":"staff","jp":"注文確定ボタンを押してください。","kana":"ちゅうもんかくてい ボタン を おして ください。","meaning":"Please press the confirm order button.","also_heard":[{"jp":"ご注文は三点で承りました。","kana":"ごちゅうもん は さんてん で うけたまわりました。","meaning":"We have received your order for three items.","romaji":"gochuumon wa santen de uketamawarimashita."}],"replies":[{"jp":"はい、ボタンを押します。","kana":"はい、 ボタン を おします。","meaning":"Yes, I'll press the button.","romaji":"hai, botan o oshimasu."}],"note":"Items only go to the kitchen after you tap confirm. Forgetting this last tap is a common beginner mistake.","level":"core","romaji":"chuumonkakutei botan o oshite kudasai."},{"id":"restaurants-tablet-07","speaker":"staff","jp":"料理は順番にお持ちします。","kana":"りょうり は じゅんばん に おもちします。","meaning":"Dishes will come in order.","also_heard":[{"jp":"ドリンクは先にお持ちします。","kana":"ドリンク は さき に おもちします。","meaning":"Drinks will come first.","romaji":"dorinku wa saki ni omochishimasu."},{"jp":"出てくる順番は決まっておりません。","kana":"でてくる じゅんばん は きまって おりません。","meaning":"There is no fixed order for the dishes.","romaji":"detekuru junban wa kimatte orimasen."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"At izakaya, dishes arrive as the kitchen finishes them, so the order can be mixed up. That is normal.","level":"useful","romaji":"ryouri wa junban ni omochishimasu."},{"id":"restaurants-tablet-08","speaker":"staff","jp":"配膳ロボットがお持ちします。お料理をお取りください。","kana":"はいぜん ロボット が おもちします。 おりょうり を おとり ください。","meaning":"A serving robot will bring it. Please take your dishes.","also_heard":[{"jp":"ロボットが来たら、料理を取って画面のボタンを押してください。","kana":"ロボット が きたら、 りょうり を とって がめん の ボタン を おして ください。","meaning":"When the robot arrives, take the food and press the button on the screen.","romaji":"robotto ga kitara, ryouri o totte gamen no botan o oshite kudasai."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Some chains use serving robots. Take your dish, then tap the screen or button so the robot can return.","level":"useful","romaji":"haizen robotto ga omochishimasu. oryouri o otori kudasai."},{"id":"restaurants-tablet-09","speaker":"staff","jp":"追加のご注文はこちらからどうぞ。","kana":"ついか の ごちゅうもん は こちら から どうぞ。","meaning":"For more orders, use this.","also_heard":[{"jp":"追加注文はタブレットでお願いします。","kana":"ついか ちゅうもん は タブレット で おねがい します。","meaning":"Please add more orders on the tablet.","romaji":"tsuika chuumon wa taburetto de onegai shimasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"The tablet shows your order history (注文履歴) and the running total. Check it before you ask for the bill.","level":"useful","romaji":"tsuika no gochuumon wa kochira kara douzo."},{"id":"restaurants-tablet-10","speaker":"staff","jp":"注文は一回につき三点までです。","kana":"ちゅうもん は いっかい に つき さんてん まで です。","meaning":"Up to three items per order.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"Rare, but some tablets limit how many items you can add at once. Place a second order if you need more.","level":"listen-only","romaji":"chuumon wa ikkai ni tsuki santen made desu."},{"id":"restaurants-tablet-11","speaker":"you","jp":"これはどうやって注文しますか？","kana":"これ は どう やって ちゅうもん します か？","meaning":"How do I order this?","replies":[{"jp":"こちらのボタンです。","kana":"こちら の ボタン です。","meaning":"It's this button.","romaji":"kochira no botan desu."}],"note":"Safe line when the tablet is confusing. Point at the item or the button while you ask.","level":"useful","romaji":"kore wa dou yatte chuumon shimasu ka?"}]},{"title":"Ordering from staff","intro":"When a person comes to the table: pointing plus a polite fixed phrase works every time.","phrases":[{"id":"restaurants-order-01","speaker":"staff","jp":"ご注文、よろしいですか？","kana":"ごちゅうもん、 よろしい です か？","meaning":"Are you ready to order?","also_heard":[{"jp":"お決まりになりましたらお呼びください。","kana":"おきまり に なりましたら および ください。","meaning":"Please call me when you've decided.","romaji":"okimari ni narimashitara oyobi kudasai."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"すみません、もう少し待ってください。","kana":"すみません、 もう すこし まって ください。","meaning":"Sorry, please give us a little more time.","romaji":"sumimasen, mou sukoshi matte kudasai."}],"note":"Staff come to the table when you call, or on their rounds. Pointing at the menu works.","level":"core","romaji":"gochuumon, yoroshii desu ka?"},{"id":"restaurants-order-02","speaker":"you","jp":"おすすめは何ですか？","kana":"おすすめ は なん です か？","meaning":"What do you recommend?","replies":[{"jp":"本日のおすすめは、味噌カツです。","kana":"ほんじつ の おすすめ は、 みそカツ です。","meaning":"Today's recommendation is miso katsu.","romaji":"honjitsu no osusume wa, misokatsu desu."},{"jp":"当店の名物は手羽先です。","kana":"とうてん の めいぶつ は てばさき です。","meaning":"Our specialty is chicken wings.","romaji":"touten no meibutsu wa tebasaki desu."}],"also_heard":[],"note":"Ask for a recommendation when the menu is unclear. Also try 人気メニューはどれですか? (Which is most popular?).","level":"core","romaji":"osusume wa nan desu ka?"},{"id":"restaurants-order-03","speaker":"you","jp":"これは何ですか？","kana":"これ は なん です か？","meaning":"What is this?","replies":[{"jp":"味噌カツです。","kana":"みそカツ です。","meaning":"It's miso katsu.","romaji":"misokatsu desu."},{"jp":"豚肉の料理です。","kana":"ぶたにく の りょうり です。","meaning":"It's a pork dish.","romaji":"butaniku no ryouri desu."}],"note":"Point at the menu photo while you ask. Short answers like 肉 (meat) or 魚 (fish) help you choose.","level":"core","romaji":"kore wa nan desu ka?"},{"id":"restaurants-order-04","speaker":"you","jp":"これをください。","kana":"これ を ください。","meaning":"This one, please.","also_heard":[],"replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."},{"jp":"二つですね。","kana":"ふたつ です ね。","meaning":"Two, right?","romaji":"futatsu desu ne."}],"note":"Point at the menu item while you say これ. Add a number, such as これを二つください, for two.","level":"core","romaji":"kore o kudasai."},{"id":"restaurants-order-05","speaker":"staff","jp":"セットにしますか？","kana":"セット に します か？","meaning":"Would you like the set?","also_heard":[{"jp":"単品でよろしいですか？","kana":"たんぴん で よろしい です か？","meaning":"Just the single item, is that OK?","romaji":"tanpin de yoroshii desu ka?"}],"replies":[{"jp":"セットでお願いします。","kana":"セット で おねがい します。","meaning":"The set, please.","romaji":"setto de onegai shimasu."},{"jp":"単品で大丈夫です。","kana":"たんぴん で だいじょうぶ です。","meaning":"Just the single item is fine.","romaji":"tanpin de daijoubu desu."}],"note":"A set usually means the main dish with rice, miso soup and pickles, or with a drink. 定食 is the set-meal word.","level":"core","romaji":"setto ni shimasu ka?"},{"id":"restaurants-order-06","speaker":"staff","jp":"ご飯の量はどうしますか？","kana":"ごはん の りょう は どう します か？","meaning":"How much rice would you like?","also_heard":[{"jp":"ご飯大盛りは無料です。","kana":"ごはん おおもり は むりょう です。","meaning":"Large rice is free.","romaji":"gohan oomori wa muryou desu."}],"replies":[{"jp":"普通でお願いします。","kana":"ふつう で おねがい します。","meaning":"Regular, please.","romaji":"futsuu de onegai shimasu."},{"jp":"小盛りでお願いします。","kana":"こもり で おねがい します。","meaning":"Small, please.","romaji":"komori de onegai shimasu."}],"note":"Rice comes in large (大盛り), regular (普通) or small (小盛り). Large is sometimes free, so check for the sign.","level":"core","romaji":"gohan no ryou wa dou shimasu ka?"},{"id":"restaurants-order-07","speaker":"staff","jp":"お飲み物は食事と一緒ですか？","kana":"おのみもの は しょくじ と いっしょ です か？","meaning":"Would you like your drink with the meal?","also_heard":[{"jp":"食後にコーヒーをお持ちしますか？","kana":"しょくご に コーヒー を おもち します か？","meaning":"Shall I bring the coffee after the meal?","romaji":"shokugo ni koohii o omochi shimasu ka?"}],"replies":[{"jp":"食事と一緒にお願いします。","kana":"しょくじ と いっしょ に おねがい します。","meaning":"With the meal, please.","romaji":"shokuji to issho ni onegai shimasu."},{"jp":"食後でお願いします。","kana":"しょくご で おねがい します。","meaning":"After the meal, please.","romaji":"shokugo de onegai shimasu."}],"note":"At cafes and lunch sets, the drink often comes after the meal unless you say otherwise.","level":"core","romaji":"onomimono wa shokuji to issho desu ka?"},{"id":"restaurants-order-08","speaker":"staff","jp":"ホットでよろしいですか？","kana":"ホット で よろしい です か？","meaning":"Hot, is that OK?","also_heard":[{"jp":"アイスになさいますか？","kana":"アイス に なさいます か？","meaning":"Would you like it iced?","romaji":"aisu ni nasaimasu ka?"}],"replies":[{"jp":"ホットでお願いします。","kana":"ホット で おねがい します。","meaning":"Hot, please.","romaji":"hotto de onegai shimasu."},{"jp":"アイスで。","kana":"アイス で。","meaning":"Iced.","romaji":"aisu de."}],"note":"Hot or iced is asked for coffee and tea. Iced drinks are on the menu in winter too.","level":"core","romaji":"hotto de yoroshii desu ka?"},{"id":"restaurants-order-09","speaker":"staff","jp":"ご注文は以上でよろしいですか？","kana":"ごちゅうもん は いじょう で よろしい です か？","meaning":"Is that everything for your order?","also_heard":[{"jp":"他にご注文はございますか？","kana":"ほか に ごちゅうもん は ございます か？","meaning":"Do you have any other orders?","romaji":"hoka ni gochuumon wa gozaimasu ka?"}],"replies":[{"jp":"はい、以上です。","kana":"はい、 いじょう です。","meaning":"Yes, that's all.","romaji":"hai, ijou desu."},{"jp":"あとで追加します。","kana":"あとで ついか します。","meaning":"I'll add more later.","romaji":"atode tsuika shimasu."}],"note":"以上 means that's all. Say はい、以上です when you have finished ordering.","level":"core","romaji":"gochuumon wa ijou de yoroshii desu ka?"},{"id":"restaurants-order-10","speaker":"staff","jp":"ご注文を繰り返させていただきます。","kana":"ごちゅうもん を くりかえさせて いただきます。","meaning":"Let me repeat your order.","also_heard":[{"jp":"確認させていただきます。","kana":"かくにん させて いただきます。","meaning":"Let me confirm.","romaji":"kakunin sasete itadakimasu."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"すみません、それは一つです。","kana":"すみません、 それ は ひとつ です。","meaning":"Sorry, that's only one.","romaji":"sumimasen, sore wa hitotsu desu."}],"note":"Use the repeat to catch mistakes. Listen for the count of each item and correct it there.","level":"useful","romaji":"gochuumon o kurikaesasete itadakimasu."},{"id":"restaurants-order-11","speaker":"staff","jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly. Understood.","also_heard":[{"jp":"承知いたしました。","kana":"しょうち いたしました。","meaning":"Understood.","romaji":"shouchi itashimashita."}],"note":"Means your order is taken. No reply is needed; a nod is enough.","level":"core","romaji":"kashikomarimashita."},{"id":"restaurants-order-12","speaker":"staff","jp":"申し訳ございません、ラーメンは売り切れです。","kana":"もうしわけ ございません、 ラーメン は うりきれ です。","meaning":"Sorry, we're out of ramen.","also_heard":[{"jp":"品切れです。","kana":"しなぎれ です。","meaning":"It's out of stock.","romaji":"shinagire desu."},{"jp":"終了しました。","kana":"しゅうりょう しました。","meaning":"That's finished for today.","romaji":"shuuryou shimashita."}],"replies":[{"jp":"じゃあ、これをお願いします。","kana":"じゃあ、 これ を おねがい します。","meaning":"Then this one, please.","romaji":"jaa, kore o onegai shimasu."}],"note":"売り切れ on the menu or a board means sold out. Point to another item and say じゃあ、これをお願いします.","level":"useful","romaji":"moushiwake gozaimasen, raamen wa urikire desu."}]},{"title":"Dietary needs and changes","intro":"Keep requests short and clear. Dashi, lard and bonito can turn up in dishes you would not expect, so ask about them.","phrases":[{"id":"restaurants-diet-01","speaker":"you","jp":"ねぎ抜きでお願いします。","kana":"ねぎ ぬき で おねがい します。","meaning":"Without spring onion, please.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."},{"jp":"それは抜けません。","kana":"それ は ぬけません。","meaning":"We can't leave that out.","romaji":"sore wa nukemasen."}],"note":"抜き means without. Swap ねぎ for the ingredient you want left out, such as 玉ねぎ抜き (no onion).","level":"core","romaji":"negi nuki de onegai shimasu."},{"id":"restaurants-diet-02","speaker":"you","jp":"これには卵が入っていますか？","kana":"これ に は たまご が はいって います か？","meaning":"Does this have egg in it?","replies":[{"jp":"入っています。","kana":"はいって います。","meaning":"Yes, it does.","romaji":"haitte imasu."},{"jp":"入っていません。","kana":"はいって いません。","meaning":"No, it doesn't.","romaji":"haitte imasen."},{"jp":"確認します。","kana":"かくにん します。","meaning":"I'll check.","romaji":"kakunin shimasu."}],"also_heard":[{"jp":"卵は使っていますか？","kana":"たまご は つかって います か？","meaning":"Do you use egg?","romaji":"tamago wa tsukatte imasu ka?"}],"note":"Dashi (soup stock) can contain fish, and some broths contain pork or lard. Ask about the stock too when it matters.","level":"core","romaji":"kore ni wa tamago ga haitte imasu ka?"},{"id":"restaurants-diet-03","speaker":"you","jp":"卵アレルギーがあります。","kana":"たまご アレルギー が あります。","meaning":"I have an egg allergy.","replies":[{"jp":"少々お待ちください、確認いたします。","kana":"しょうしょう おまち ください、 かくにん いたします。","meaning":"Please wait, I'll check.","romaji":"shoushou omachi kudasai, kakunin itashimasu."},{"jp":"こちらのアレルギー表をご覧ください。","kana":"こちら の アレルギーひょう を ごらん ください。","meaning":"Please look at this allergy chart.","romaji":"kochira no arerugiihyou o goran kudasai."}],"note":"Swap 卵 for another item. The eight mandatory items are shrimp, crab, walnut, wheat, buckwheat, egg, milk and peanut. Buckwheat allergies can be serious.","level":"core","romaji":"tamago arerugii ga arimasu."},{"id":"restaurants-diet-04","speaker":"you","jp":"あまり辛くしないでください。","kana":"あまり からく しないで ください。","meaning":"Please don't make it too spicy.","replies":[{"jp":"辛さは選べます。","kana":"からさ は えらべます。","meaning":"You can choose the spice level.","romaji":"karasa wa erabemasu."},{"jp":"辛さは普通にしますか？","kana":"からさ は ふつう に します か？","meaning":"Shall I make it regular?","romaji":"karasa wa futsuu ni shimasu ka?"}],"note":"辛さ控えめで means a milder version. 甘口 on a menu means mild.","level":"core","romaji":"amari karaku shinaide kudasai."},{"id":"restaurants-diet-05","speaker":"staff","jp":"辛さはどうされますか？","kana":"からさ は どう されます か？","meaning":"How spicy would you like it?","also_heard":[{"jp":"辛いのと普通、どちらにしますか？","kana":"からい の と ふつう、 どちら に します か？","meaning":"Spicy or regular?","romaji":"karai no to futsuu, dochira ni shimasu ka?"}],"replies":[{"jp":"普通でお願いします。","kana":"ふつう で おねがい します。","meaning":"Regular, please.","romaji":"futsuu de onegai shimasu."},{"jp":"辛さ控えめで。","kana":"からさ ひかえめ で。","meaning":"Mild, please.","romaji":"karasa hikaeme de."}],"note":"激辛 is extremely spicy, 中辛 is medium and 甘口 is mild. If unsure, choose the middle level.","level":"useful","romaji":"karasa wa dou saremasu ka?"},{"id":"restaurants-diet-06","speaker":"you","jp":"生ものは食べられません。","kana":"なま もの は たべられません。","meaning":"I can't eat raw food.","replies":[{"jp":"焼いたものをお出しします。","kana":"やいた もの を おだし します。","meaning":"We'll serve something grilled.","romaji":"yaita mono o odashi shimasu."},{"jp":"加熱したものもあります。","kana":"かねつ した もの も あります。","meaning":"We also have cooked options.","romaji":"kanetsu shita mono mo arimasu."}],"note":"生 means raw. Raw egg (生卵) is common in gyudon, sukiyaki and some other dishes. Ask before you order.","level":"core","romaji":"nama mono wa taberaremasen."},{"id":"restaurants-diet-07","speaker":"you","jp":"わさび抜きでお願いします。","kana":"わさび ぬき で おねがい します。","meaning":"Without wasabi, please.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."},{"jp":"わさびは最初から入っています。","kana":"わさび は さいしょ から はいって います。","meaning":"Wasabi is already in it.","romaji":"wasabi wa saisho kara haitte imasu."}],"note":"Sushi shops write さび抜き. Wasabi is often already placed in nigiri, so say it when you order.","level":"core","romaji":"wasabi nuki de onegai shimasu."},{"id":"restaurants-diet-08","speaker":"you","jp":"豚肉は入っていますか？","kana":"ぶたにく は はいって います か？","meaning":"Does it contain pork?","replies":[{"jp":"はい、豚骨です。","kana":"はい、 とんこつ です。","meaning":"Yes, it's pork bone broth.","romaji":"hai, tonkotsu desu."},{"jp":"入っていません。","kana":"はいって いません。","meaning":"No, it doesn't.","romaji":"haitte imasen."}],"note":"Swap 豚肉 for 牛肉 (beef) or 鶏肉 (chicken). Pork bone broth is common in ramen. Dashi can also hide fish: ask 出汁に魚は入っていますか?","level":"core","romaji":"butaniku wa haitte imasu ka?"},{"id":"restaurants-diet-09","speaker":"you","jp":"少なめでお願いします。","kana":"すくなめ で おねがい します。","meaning":"A smaller portion, please.","replies":[{"jp":"小盛りもできます。","kana":"こもり も できます。","meaning":"We can do a small portion.","romaji":"komori mo dekimasu."},{"jp":"ハーフサイズもあります。","kana":"ハーフサイズ も あります。","meaning":"We also have a half size.","romaji":"haafusaizu mo arimasu."}],"note":"If you can't finish a regular bowl, ask for less noodles. The price usually stays the same.","level":"useful","romaji":"sukuname de onegai shimasu."},{"id":"restaurants-diet-10","speaker":"you","jp":"食べられないものがあります。","kana":"たべられない もの が あります。","meaning":"There are some things I can't eat.","replies":[{"jp":"何でしょうか？","kana":"なん でしょう か？","meaning":"What are they?","romaji":"nan deshou ka?"}],"note":"Use 苦手 (I'm not fond of) for dislikes, such as ピーマンが苦手です. Use the allergy wording for real allergies.","level":"useful","romaji":"taberarenai mono ga arimasu."},{"id":"restaurants-diet-11","speaker":"you","jp":"薄味にできますか？","kana":"うすあじ に できます か？","meaning":"Can you make it lighter in flavour?","replies":[{"jp":"はい、できます。","kana":"はい、 できます。","meaning":"Yes, we can.","romaji":"hai, dekimasu."},{"jp":"申し訳ありません、できません。","kana":"もうしわけ ありません、 できません。","meaning":"Sorry, we can't.","romaji":"moushiwake arimasen, dekimasen."}],"note":"薄味 means lightly seasoned. The answer depends on the dish, so ask before you order.","level":"useful","romaji":"usuaji ni dekimasu ka?"},{"id":"restaurants-diet-12","speaker":"you","jp":"これは辛いですか？","kana":"これ は からい です か？","meaning":"Is this spicy?","replies":[{"jp":"少し辛いです。","kana":"すこし からい です。","meaning":"It's a little spicy.","romaji":"sukoshi karai desu."},{"jp":"辛くないです。","kana":"からく ない です。","meaning":"It's not spicy.","romaji":"karaku nai desu."}],"note":"Ask before you order if you can't handle heat. 甘い means sweet, and 辛い means spicy.","level":"core","romaji":"kore wa karai desu ka?"}]},{"title":"During the meal","intro":"What staff say when they serve, explain and refill.","phrases":[{"id":"restaurants-meal-01","speaker":"staff","jp":"お待たせいたしました。とんかつでございます。","kana":"おまたせいたしました。 とんかつ で ございます。","meaning":"Thank you for waiting. Here is your tonkatsu.","also_heard":[{"jp":"お待たせしました。","kana":"おまたせしました。","meaning":"Thanks for waiting.","romaji":"omataseshimashita."},{"jp":"こちら、とんかつになります。","kana":"こちら、 とんかつ に なります。","meaning":"Here is your tonkatsu.","romaji":"kochira, tonkatsu ni narimasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"でございます and になります are polite service phrases. Saying thank you is all you need.","level":"core","romaji":"omataseitashimashita. tonkatsu de gozaimasu."},{"id":"restaurants-meal-02","speaker":"staff","jp":"熱いのでお気をつけください。","kana":"あつい の で、 おきをつけ ください。","meaning":"It's hot, so please be careful.","also_heard":[{"jp":"鉄板が熱いのでお気をつけください。","kana":"てっぱん が あつい の で、 おきをつけ ください。","meaning":"The hot plate is hot, so please be careful.","romaji":"teppan ga atsui no de, okiotsuke kudasai."},{"jp":"器が熱くなっております。","kana":"うつわ が あつく なって おります。","meaning":"The bowl has become hot.","romaji":"utsuwa ga atsuku natte orimasu."}],"replies":[{"jp":"はい、ありがとうございます。","kana":"はい、 ありがとう ございます。","meaning":"Yes, thank you.","romaji":"hai, arigatou gozaimasu."}],"note":"Hot plates (鉄板) and clay pots (土鍋) stay hot for a long time. Wait a moment before you touch them.","level":"core","romaji":"atsui no de, okiotsuke kudasai."},{"id":"restaurants-meal-03","speaker":"staff","jp":"こちらは塩でお召し上がりください。","kana":"こちら は しお で おめしあがり ください。","meaning":"Please eat this with salt.","also_heard":[{"jp":"ポン酢でお召し上がりください。","kana":"ポンず で おめしあがり ください。","meaning":"Please eat it with citrus soy sauce.","romaji":"ponzu de omeshiagari kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Tempura, yakitori and tonkatsu come with salt or sauce. Staff tell you which one, so follow their lead.","level":"useful","romaji":"kochira wa shio de omeshiagari kudasai."},{"id":"restaurants-meal-04","speaker":"staff","jp":"よく混ぜてお召し上がりください。","kana":"よく まぜて おめしあがり ください。","meaning":"Please mix it well before eating.","also_heard":[{"jp":"卵と混ぜてお召し上がりください。","kana":"たまご と まぜて おめしあがり ください。","meaning":"Mix it with the egg before you eat.","romaji":"tamago to mazete omeshiagari kudasai."},{"jp":"薬味を入れてどうぞ。","kana":"やくみ を いれて どうぞ。","meaning":"Add the condiments, please.","romaji":"yakumi o irete douzo."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Common with bibimbap, egg over rice (卵かけご飯) and hitsumabushi. 薬味 means condiments such as spring onion or wasabi.","level":"useful","romaji":"yoku mazete omeshiagari kudasai."},{"id":"restaurants-meal-05","speaker":"staff","jp":"ご飯のおかわりは無料です。","kana":"ごはん の おかわり は むりょう です。","meaning":"Rice refills are free.","also_heard":[{"jp":"ご飯おかわり自由です。","kana":"ごはん おかわり じゆう です。","meaning":"Rice refills are free.","romaji":"gohan okawari jiyuu desu."},{"jp":"キャベツもおかわり自由です。","kana":"キャベツ も おかわり じゆう です。","meaning":"Cabbage refills are free too.","romaji":"kyabetsu mo okawari jiyuu desu."}],"replies":[{"jp":"おかわりお願いします。","kana":"おかわり おねがい します。","meaning":"A refill, please.","romaji":"okawari onegai shimasu."}],"note":"おかわり means a refill. 自由 means help yourself as much as you like. Common at teishoku and tonkatsu shops.","level":"core","romaji":"gohan no okawari wa muryou desu."},{"id":"restaurants-meal-06","speaker":"you","jp":"替え玉をお願いします。","kana":"かえだま を おねがい します。","meaning":"One extra noodle portion, please.","replies":[{"jp":"硬さはどうしますか？","kana":"かたさ は どう します か？","meaning":"How firm would you like them?","romaji":"katasa wa dou shimasu ka?"},{"jp":"食券をお買い求めください。","kana":"しょっけん を おかいもとめ ください。","meaning":"Please buy a ticket.","romaji":"shokken o okaimotome kudasai."}],"note":"替え玉 is ordered once the noodles are gone, and you keep some soup for them. It may need a ticket or be paid at the end. Check the machine.","level":"core","romaji":"kaedama o onegai shimasu."},{"id":"restaurants-meal-07","speaker":"you","jp":"すみません、お冷をください。","kana":"すみません、 おひや を ください。","meaning":"Excuse me, cold water please.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"お冷 (ohiya) is cold water. お水 is fine too. Say 氷なしで if you don't want ice.","level":"core","romaji":"sumimasen, ohiya o kudasai."},{"id":"restaurants-meal-08","speaker":"you","jp":"もう一杯お願いします。","kana":"もう いっぱい おねがい します。","meaning":"One more, please.","replies":[{"jp":"同じものでよろしいですか？","kana":"おなじ もの で よろしい です か？","meaning":"The same one?","romaji":"onaji mono de yoroshii desu ka?"}],"note":"Works for drinks. Say 同じのをください to repeat the same drink.","level":"core","romaji":"mou ippai onegai shimasu."},{"id":"restaurants-meal-09","speaker":"you","jp":"取り皿と箸をもらえますか？","kana":"とりざら と はし を もらえます か？","meaning":"Could I have small plates and chopsticks?","replies":[{"jp":"はい、お持ちします。","kana":"はい、 おもちします。","meaning":"Yes, I'll bring them.","romaji":"hai, omochishimasu."}],"note":"取り皿 are small plates for sharing. Ask for フォーク if you want a fork instead of chopsticks.","level":"core","romaji":"torizara to hashi o moraemasu ka?"},{"id":"restaurants-meal-10","speaker":"staff","jp":"おしぼりをどうぞ。","kana":"おしぼり を どうぞ。","meaning":"Here is a wet towel.","replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Use the towel for your hands only, not your face.","level":"useful","romaji":"oshibori o douzo."},{"id":"restaurants-meal-11","speaker":"staff","jp":"ラストオーダーの時間です。","kana":"ラストオーダー の じかん です。","meaning":"It's last order time.","also_heard":[{"jp":"L.O.です。","kana":"エルオー です。","meaning":"It's last order.","romaji":"eruoo desu."},{"jp":"ご注文はございますか？","kana":"ごちゅうもん は ございます か？","meaning":"Do you have any orders?","romaji":"gochuumon wa gozaimasu ka?"}],"replies":[{"jp":"じゃあ、コーヒーをお願いします。","kana":"じゃあ、 コーヒー を おねがい します。","meaning":"Then, coffee please.","romaji":"jaa, koohii o onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No more, thanks.","romaji":"daijoubu desu."}],"note":"Last order often comes before closing. Food and drinks can have separate last orders, shown as フードL.O. and ドリンクL.O.","level":"core","romaji":"rasutooodaa no jikan desu."},{"id":"restaurants-meal-12","speaker":"staff","jp":"お皿をお下げしてもよろしいですか？","kana":"おさら を おさげして も よろしい です か？","meaning":"May I clear the plates?","replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"まだ食べています。","kana":"まだ たべて います。","meaning":"I'm still eating.","romaji":"mada tabete imasu."}],"note":"Some places have a two-hour limit (2時間制) and staff may tell you the time you must leave by.","level":"useful","romaji":"osara o osageshite mo yoroshii desu ka?"}]},{"title":"Regional specialities of this trip","intro":"One line to order, one reply to expect, one thing to know for each dish.","phrases":[{"id":"restaurants-regional-01","speaker":"you","jp":"味噌カツ定食をお願いします。","kana":"みそカツ ていしょく を おねがい します。","meaning":"Miso katsu set meal, please.","replies":[{"jp":"味噌だれは別にしますか？","kana":"みそだれ は べつ に します か？","meaning":"Would you like the miso sauce on the side?","romaji":"misodare wa betsu ni shimasu ka?"},{"jp":"ご飯は大盛りにしますか？","kana":"ごはん は おおもり に します か？","meaning":"Would you like a large rice?","romaji":"gohan wa oomori ni shimasu ka?"}],"note":"Nagoya miso katsu is pork cutlet with a dark miso sauce. ヒレ is the fillet cut and ロース is the loin cut.","level":"useful","romaji":"misokatsu teishoku o onegai shimasu."},{"id":"restaurants-regional-02","speaker":"you","jp":"ひつまぶしをひとつお願いします。","kana":"ひつまぶし を ひとつ おねがい します。","meaning":"One hitsumabushi, please.","replies":[{"jp":"まずはそのまま、次は薬味をのせて。","kana":"まず は そのまま、 つぎ は やくみ を のせて。","meaning":"First plain, then add the toppings.","romaji":"mazu wa sonomama, tsugi wa yakumi o nosete."},{"jp":"四等分にしてお召し上がりください。","kana":"よんとうぶん に して おめしあがり ください。","meaning":"Please divide it into four and enjoy.","romaji":"yontoubun ni shite omeshiagari kudasai."}],"note":"Four portions: plain first, then with toppings (薬味), then ochazuke with dashi, then your own way. Toppings include nori, wasabi and green onion.","level":"core","romaji":"hitsumabushi o hitotsu onegai shimasu."},{"id":"restaurants-regional-03","speaker":"you","jp":"手羽先を五本ください。","kana":"てばさき を ごほん ください。","meaning":"Five chicken wings, please.","replies":[{"jp":"辛いのと普通、どちらにしますか？","kana":"からい の と ふつう、 どちら に します か？","meaning":"Spicy or regular?","romaji":"karai no to futsuu, dochira ni shimasu ka?"},{"jp":"胡椒味もあります。","kana":"こしょうあじ も あります。","meaning":"We also have pepper flavour.","romaji":"koshouaji mo arimasu."}],"note":"Count wings in 本 (hon), so 五本 is five. Eat them with your hands and use the oshibori.","level":"useful","romaji":"tebasaki o gohon kudasai."},{"id":"restaurants-regional-04","speaker":"you","jp":"きしめんをお願いします。","kana":"きしめん を おねがい します。","meaning":"Kishimen, please.","replies":[{"jp":"かつおぶし入れますか？","kana":"かつおぶし いれます か？","meaning":"Do you want bonito flakes in it?","romaji":"katsuobushi iremasu ka?"},{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"Flat noodles in a light soy broth. Say なし if you don't want the bonito flakes on top.","level":"useful","romaji":"kishimen o onegai shimasu."},{"id":"restaurants-regional-05","speaker":"you","jp":"味噌煮込みうどんをお願いします。","kana":"みそにこみうどん を おねがい します。","meaning":"Miso nikomi udon, please.","replies":[{"jp":"土鍋が熱いのでお気をつけください。","kana":"どなべ が あつい の で、 おきをつけ ください。","meaning":"The clay pot is hot, so please be careful.","romaji":"donabe ga atsui no de, okiotsuke kudasai."}],"note":"Served bubbling in a clay pot. The noodles are firm by design, and the pot stays hot for a long time.","level":"useful","romaji":"misonikomiudon o onegai shimasu."},{"id":"restaurants-regional-06","speaker":"you","jp":"肉玉そばを一つお願いします。","kana":"にくたまそば を ひとつ おねがい します。","meaning":"One pork and egg soba, please.","replies":[{"jp":"そばとうどん、どちらにしますか？","kana":"そば と うどん、 どちら に します か？","meaning":"Soba or udon?","romaji":"soba to udon, dochira ni shimasu ka?"},{"jp":"ヘラで召し上がってください。","kana":"ヘラ で めしあがって ください。","meaning":"Please eat it with the spatula.","romaji":"hera de meshiagatte kudasai."}],"note":"Standard Hiroshima style: pork, egg and noodles stacked on the griddle. Toppings such as green onion, squid or cheese are common. Eat it with a small spatula (ヘラ).","level":"core","romaji":"nikutamasoba o hitotsu onegai shimasu."},{"id":"restaurants-regional-07","speaker":"you","jp":"焼き牡蠣と牡蠣フライをお願いします。","kana":"やきがき と かきフライ を おねがい します。","meaning":"Grilled oysters and oyster fry, please.","replies":[{"jp":"生牡蠣もありますよ。","kana":"なまがき も あります よ。","meaning":"We have raw oysters too.","romaji":"namagaki mo arimasu yo."},{"jp":"牡蠣は何個にしますか？","kana":"かき は なんこ に します か？","meaning":"How many oysters?","romaji":"kaki wa nanko ni shimasu ka?"}],"note":"Winter is the main oyster season, and Hiroshima is known for them. 生 means raw. Ask for a count of pieces if the menu allows it.","level":"core","romaji":"yakigaki to kakifurai o onegai shimasu."},{"id":"restaurants-regional-08","speaker":"you","jp":"辛さは普通でお願いします。","kana":"からさ は ふつう で おねがい します。","meaning":"Regular spice, please.","replies":[{"jp":"あつもりとひやもりがございます。","kana":"あつもり と ひやもり が ございます。","meaning":"We have hot-served and chilled noodles.","romaji":"atsumori to hiyamori ga gozaimasu."},{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"Tsukemen comes as hot noodles (あつもり) or chilled noodles (ひやもり). Spice levels are numbered, so start low if unsure. Keep tissues handy.","level":"useful","romaji":"karasa wa futsuu de onegai shimasu."},{"id":"restaurants-regional-09","speaker":"you","jp":"たこ焼きを八個ください。","kana":"たこやき を はっこ ください。","meaning":"Eight takoyaki, please.","replies":[{"jp":"ソースとマヨネーズはかけますか？","kana":"ソース と マヨネーズ は かけます か？","meaning":"Shall I add sauce and mayonnaise?","romaji":"soosu to mayoneezu wa kakemasu ka?"},{"jp":"熱いのでお気をつけください。","kana":"あつい の で、 おきをつけ ください。","meaning":"They're hot, so please be careful.","romaji":"atsui no de, okiotsuke kudasai."}],"note":"Takoyaki is sold by the count, so pick the number on the menu. The inside is molten, so wait before biting.","level":"core","romaji":"takoyaki o hakko kudasai."},{"id":"restaurants-regional-10","speaker":"you","jp":"串カツの五本セットをお願いします。","kana":"くしカツ の ごほん セット を おねがい します。","meaning":"The five-skewer set of kushikatsu, please.","replies":[{"jp":"ソースの二度づけは禁止です。","kana":"ソース の にどづけ は きんし です。","meaning":"Double dipping in the sauce is not allowed.","romaji":"soosu no nidozuke wa kinshi desu."},{"jp":"キャベツでソースをすくってください。","kana":"キャベツ で ソース を すくって ください。","meaning":"Please scoop up the sauce with the cabbage.","romaji":"kyabetsu de soosu o sukutte kudasai."}],"note":"The sauce pot is shared, so never dip a bitten skewer again. Use the free cabbage to scoop extra sauce.","level":"core","romaji":"kushikatsu no gohon setto o onegai shimasu."},{"id":"restaurants-regional-11","speaker":"staff","jp":"焼き加減はいかがなさいますか？","kana":"やきかげん は いかが なさいます か？","meaning":"How would you like it cooked?","replies":[{"jp":"ミディアムでお願いします。","kana":"ミディアム で おねがい します。","meaning":"Medium, please.","romaji":"midiamu de onegai shimasu."},{"jp":"レアでお願いします。","kana":"レア で おねがい します。","meaning":"Rare, please.","romaji":"rea de onegai shimasu."}],"note":"Doneness words: レア (rare), ミディアム (medium), ウェルダン (well done). Kobe beef is often cooked to order at teppanyaki and steak places.","level":"core","romaji":"yakikagen wa ikaga nasaimasu ka?"},{"id":"restaurants-regional-12","speaker":"you","jp":"ほうとうをお願いします。","kana":"ほうとう を おねがい します。","meaning":"Houtou, please.","replies":[{"jp":"鍋が熱いのでお気をつけください。","kana":"なべ が あつい の で、 おきをつけ ください。","meaning":"The pot is hot, so please be careful.","romaji":"nabe ga atsui no de, okiotsuke kudasai."}],"note":"Yamanashi stew of flat noodles and vegetables, served in a hot pot. In Tokyo, もんじゃ may be cooked for you: staff may ask 作りましょうか？ (Shall I make it?).","level":"useful","romaji":"houtou o onegai shimasu."}]},{"title":"Sushi: conveyor belt and counter","intro":"Two very different rhythms: the belt is self-service, the counter is a conversation with the chef.","phrases":[{"id":"restaurants-sushi-01","speaker":"staff","jp":"タッチパネルで受付してください。","kana":"タッチパネル で うけつけして ください。","meaning":"Please check in on the touch panel.","also_heard":[{"jp":"何名様ですか？","kana":"なんめいさま です か？","meaning":"How many people?","romaji":"nanmeisama desu ka?"}],"replies":[{"jp":"二人です。","kana":"ふたり です。","meaning":"Two people.","romaji":"futari desu."}],"note":"The kiosk by the entrance prints a number. Wait until your number is called.","level":"core","romaji":"tatchipaneru de uketsukeshite kudasai."},{"id":"restaurants-sushi-02","speaker":"staff","jp":"カウンターとボックス席、どちらがいいですか？","kana":"カウンター と ボックスせき、 どちら が いい です か？","meaning":"Counter or booth?","replies":[{"jp":"ボックス席でお願いします。","kana":"ボックスせき で おねがい します。","meaning":"Booth, please.","romaji":"bokkususeki de onegai shimasu."},{"jp":"カウンターでお願いします。","kana":"カウンター で おねがい します。","meaning":"Counter, please.","romaji":"kauntaa de onegai shimasu."}],"level":"useful","romaji":"kauntaa to bokkususeki, dochira ga ii desu ka?"},{"id":"restaurants-sushi-03","speaker":"staff","jp":"注文はタッチパネルからお願いします。","kana":"ちゅうもん は タッチパネル から おねがい します。","meaning":"Please order from the touch panel.","also_heard":[{"jp":"流れているお寿司もお取りください。","kana":"ながれて いる おすし も おとり ください。","meaning":"You can also take the sushi going past on the belt.","romaji":"nagarete iru osushi mo otori kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Some chains make sushi to order and send it to your seat by an express lane (特急レーン).","level":"core","romaji":"chuumon wa tatchipaneru kara onegai shimasu."},{"id":"restaurants-sushi-04","speaker":"staff","jp":"お皿の色で値段が違います。","kana":"おさら の いろ で ねだん が ちがいます。","meaning":"The plate colour shows the price.","note":"Price depends on the colour or pattern of the plate. Some chains charge one price for all plates, so check the menu.","level":"useful","romaji":"osara no iro de nedan ga chigaimasu."},{"id":"restaurants-sushi-05","speaker":"you","jp":"さび抜きでお願いします。","kana":"さび ぬき で おねがい します。","meaning":"No wasabi, please.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"Wasabi is often already placed in nigiri, so say さび抜き early when you order from the belt or the counter.","level":"core","romaji":"sabi nuki de onegai shimasu."},{"id":"restaurants-sushi-06","speaker":"staff","jp":"お会計はボタンを押してください。","kana":"おかいけい は ボタン を おして ください。","meaning":"Please press the checkout button.","note":"On some chains the panel totals your bill. On others, staff count your plates and you pay at the register.","level":"core","romaji":"okaikei wa botan o oshite kudasai."},{"id":"restaurants-sushi-07","speaker":"staff","jp":"お皿を数えます。","kana":"おさら を かぞえます。","meaning":"I'll count the plates.","also_heard":[{"jp":"皿の枚数を数えます。","kana":"さら の まいすう を かぞえます。","meaning":"We will count the number of plates.","romaji":"sara no maisuu o kazoemasu."}],"note":"Staff may come to count your plates. The number of plates gives the total.","level":"listen-only","romaji":"osara o kazoemasu."},{"id":"restaurants-sushi-08","speaker":"staff","jp":"お茶はセルフサービスです。","kana":"おちゃ は セルフサービス です。","meaning":"Tea is self-service.","note":"Green tea powder goes in the cup and hot water comes from a tap at your seat. Press the button if you need help.","level":"useful","romaji":"ocha wa serufusaabisu desu."},{"id":"restaurants-sushi-09","speaker":"staff","jp":"おまかせになさいますか？","kana":"おまかせ に なさいます か？","meaning":"Would you like omakase?","also_heard":[{"jp":"おまかせコースとお好みがございます。","kana":"おまかせ コース と おこのみ が ございます。","meaning":"We have an omakase course and à la carte.","romaji":"omakase koosu to okonomi ga gozaimasu."}],"replies":[{"jp":"おまかせでお願いします。","kana":"おまかせ で おねがい します。","meaning":"Omakase, please.","romaji":"omakase de onegai shimasu."},{"jp":"お好みでお願いします。","kana":"おこのみ で おねがい します。","meaning":"Choose by piece, please.","romaji":"okonomi de onegai shimasu."}],"note":"おまかせ means the chef's choice. Ask the price first, since courses have a set price.","level":"core","romaji":"omakase ni nasaimasu ka?"},{"id":"restaurants-sushi-10","speaker":"you","jp":"これをもう一つください。","kana":"これ を もう ひとつ ください。","meaning":"One more of this, please.","replies":[{"jp":"はい、少々お待ちください。","kana":"はい、 しょうしょう おまち ください。","meaning":"Yes, one moment.","romaji":"hai, shoushou omachi kudasai."}],"note":"Point at the topping (ネタ) in the case while you say これ.","level":"core","romaji":"kore o mou hitotsu kudasai."},{"id":"restaurants-sushi-11","speaker":"staff","jp":"お茶はどうなさいますか？","kana":"おちゃ は どう なさいます か？","meaning":"What about tea?","also_heard":[{"jp":"あがりです。","kana":"あがり です。","meaning":"Here's your tea.","romaji":"agari desu."},{"jp":"熱いお茶をどうぞ。","kana":"あつい おちゃ を どうぞ。","meaning":"Here's some hot tea.","romaji":"atsui ocha o douzo."}],"replies":[{"jp":"お茶をお願いします。","kana":"おちゃ を おねがい します。","meaning":"Tea, please.","romaji":"ocha o onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No tea, thanks.","romaji":"daijoubu desu."}],"note":"あがり is the tea served at sushi counters. お茶 is always a safe word to use.","level":"core","romaji":"ocha wa dou nasaimasu ka?"},{"id":"restaurants-sushi-12","speaker":"staff","jp":"そのままお召し上がりください。","kana":"そのまま おめしあがり ください。","meaning":"Please eat it as it is.","also_heard":[{"jp":"醤油はつけずにどうぞ。","kana":"しょうゆ は つけず に どうぞ。","meaning":"Please go ahead without dipping it in soy sauce.","romaji":"shouyu wa tsukezu ni douzo."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Chefs often season a piece already. Do not dip it again unless you are told to. Eating by hand is normal.","level":"core","romaji":"sonomama omeshiagari kudasai."}]},{"title":"Izakaya","intro":"Drinks first, a charge for a starter, and sharing plates in rounds.","phrases":[{"id":"restaurants-izakaya-01","speaker":"staff","jp":"お通しです。","kana":"おとおし です。","meaning":"Here is your otoshi, the starter.","also_heard":[{"jp":"席料としてお通しをいただいております。","kana":"せきりょう として おとおし を いただいて おります。","meaning":"We charge for the otoshi as a seat fee.","romaji":"sekiryou toshite otooshi o itadaite orimasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"The otoshi is a small starter charged to the table, often a few hundred yen. Most shops do not let you decline it. Allergies and religious diets are the usual exceptions, so tell staff early.","level":"core","romaji":"otooshi desu."},{"id":"restaurants-izakaya-02","speaker":"staff","jp":"お飲み物はお決まりですか？","kana":"おのみもの は おきまり です か？","meaning":"Have you decided on drinks?","also_heard":[{"jp":"まず飲み物をお伺いします。","kana":"まず のみもの を おうかがい します。","meaning":"First, let me take your drink order.","romaji":"mazu nomimono o oukagai shimasu."}],"replies":[{"jp":"とりあえず生を二つお願いします。","kana":"とりあえず なま を ふたつ おねがい します。","meaning":"Two draft beers for now, please.","romaji":"toriaezu nama o futatsu onegai shimasu."},{"jp":"ウーロン茶をお願いします。","kana":"ウーロンちゃ を おねがい します。","meaning":"Oolong tea, please.","romaji":"uuroncha o onegai shimasu."}],"note":"とりあえず生 means a draft beer for now, the usual izakaya opener. Ordering a drink first is normal.","level":"core","romaji":"onomimono wa okimari desu ka?"},{"id":"restaurants-izakaya-03","speaker":"you","jp":"ノンアルコールビールをお願いします。","kana":"ノンアルコールビール を おねがい します。","meaning":"A non-alcoholic beer, please.","replies":[{"jp":"ソフトドリンクもございます。","kana":"ソフトドリンク も ございます。","meaning":"We have soft drinks too.","romaji":"sofutodorinku mo gozaimasu."}],"note":"For non-drinkers. Ask for ソフトドリンク or ウーロン茶 if you want something without alcohol.","level":"useful","romaji":"non'arukoorubiiru o onegai shimasu."},{"id":"restaurants-izakaya-04","speaker":"staff","jp":"飲み放題にしますか？","kana":"のみほうだい に します か？","meaning":"Would you like the all-you-can-drink plan?","also_heard":[{"jp":"飲み放題プランは二時間です。","kana":"のみほうだい プラン は にじかん です。","meaning":"The all-you-can-drink plan is two hours.","romaji":"nomihoudai puran wa nijikan desu."}],"replies":[{"jp":"はい、飲み放題でお願いします。","kana":"はい、 のみほうだい で おねがい します。","meaning":"Yes, all-you-can-drink, please.","romaji":"hai, nomihoudai de onegai shimasu."},{"jp":"いいえ、単品でお願いします。","kana":"いいえ、 たんぴん で おねがい します。","meaning":"No, individual drinks, please.","romaji":"iie, tanpin de onegai shimasu."}],"note":"Plans usually have a two-hour limit, with last orders before the end. Often everyone at the table has to join.","level":"core","romaji":"nomihoudai ni shimasu ka?"},{"id":"restaurants-izakaya-05","speaker":"you","jp":"乾杯！","kana":"かんぱい！","meaning":"Cheers!","note":"Say it when the drinks arrive. Everyone at the table raises a glass together.","level":"core","romaji":"kanpai!"},{"id":"restaurants-izakaya-06","speaker":"you","jp":"枝豆をください。","kana":"えだまめ を ください。","meaning":"Please bring edamame.","replies":[{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"Please wait a moment.","romaji":"shoushou omachi kudasai."}],"note":"Dishes come out when the kitchen is ready, so order a few at a time. Add more with あと、 and the dish name.","level":"core","romaji":"edamame o kudasai."},{"id":"restaurants-izakaya-07","speaker":"you","jp":"おかわりをお願いします。","kana":"おかわり を おねがい します。","meaning":"Another round, please.","replies":[{"jp":"同じものでよろしいですか？","kana":"おなじ もの で よろしい です か？","meaning":"The same one?","romaji":"onaji mono de yoroshii desu ka?"},{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"Say 同じもので for the same drink again, or name the next drink if you want something different.","level":"useful","romaji":"okawari o onegai shimasu."},{"id":"restaurants-izakaya-08","speaker":"staff","jp":"取り皿をお持ちしますか？","kana":"とりざら を おもち します か？","meaning":"Shall I bring small plates?","also_heard":[{"jp":"取り分けましょうか？","kana":"とりわけましょう か？","meaning":"Shall I divide it for you?","romaji":"toriwakemashou ka?"}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"note":"Izakaya dishes are often shared. Say お願いします to get small plates, and ask for them early.","level":"useful","romaji":"torizara o omochi shimasu ka?"},{"id":"restaurants-izakaya-09","speaker":"staff","jp":"追加のご注文はございますか？","kana":"ついか の ごちゅうもん は ございます か？","meaning":"Would you like anything else?","also_heard":[{"jp":"ラストオーダーです。","kana":"ラストオーダー です。","meaning":"It's last order.","romaji":"rasutooodaa desu."}],"replies":[{"jp":"はい、もう一品お願いします。","kana":"はい、 もう いっぴん おねがい します。","meaning":"Yes, one more dish, please.","romaji":"hai, mou ippin onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, that's all.","romaji":"daijoubu desu."}],"note":"Last order means the kitchen soon stops taking new orders. Decide quickly if you want more.","level":"core","romaji":"tsuika no gochuumon wa gozaimasu ka?"},{"id":"restaurants-izakaya-10","speaker":"you","jp":"お会計は別々でお願いします。","kana":"おかいけい は べつべつ で おねがい します。","meaning":"Separate bills, please.","replies":[{"jp":"割り勘ですね、かしこまりました。","kana":"わりかん です ね、 かしこまりました。","meaning":"Split evenly, right? Certainly.","romaji":"warikan desu ne, kashikomarimashita."},{"jp":"別々のお会計はできません。","kana":"べつべつ の おかいけい は できません。","meaning":"We can't do separate bills.","romaji":"betsubetsu no okaikei wa dekimasen."}],"note":"割り勘 means split evenly, and 別々 means each person pays their own. Ask at the start, since some izakaya will not itemise.","level":"useful","romaji":"okaikei wa betsubetsu de onegai shimasu."},{"id":"restaurants-izakaya-11","speaker":"staff","jp":"席のご利用は二時間制です。","kana":"せき の ごりよう は にじかんせい です。","meaning":"Seats are limited to two hours.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"A two-hour limit (2時間制) is common at busy places. Plan your order around it.","level":"listen-only","romaji":"seki no goriyou wa nijikansei desu."},{"id":"restaurants-izakaya-12","speaker":"staff","jp":"焼き鳥はタレと塩、どちらにしますか？","kana":"やきとり は タレ と しお、 どちら に します か？","meaning":"Yakitori: sauce or salt?","replies":[{"jp":"塩でお願いします。","kana":"しお で おねがい します。","meaning":"Salt, please.","romaji":"shio de onegai shimasu."},{"jp":"タレでお願いします。","kana":"タレ で おねがい します。","meaning":"Sauce, please.","romaji":"tare de onegai shimasu."},{"jp":"おまかせで。","kana":"おまかせ で。","meaning":"Leave it to the chef.","romaji":"omakase de."}],"note":"タレ is a sweet-soy glaze, and 塩 is salt. Both are the usual choices for yakitori.","level":"useful","romaji":"yakitori wa tare to shio, dochira ni shimasu ka?"}]},{"title":"Cafes, bakeries and fast food","intro":"Counter service, a number tag, and tidy-up routines.","phrases":[{"id":"restaurants-cafe-01","speaker":"staff","jp":"こちらでお召し上がりですか？","kana":"こちら で おめしあがり です か？","meaning":"Is this to eat here?","also_heard":[{"jp":"お持ち帰りですか？","kana":"おもちかえり です か？","meaning":"Is it to take away?","romaji":"omochikaeri desu ka?"},{"jp":"店内ですか？","kana":"てんない です か？","meaning":"Eating in?","romaji":"tennai desu ka?"}],"replies":[{"jp":"店内でお願いします。","kana":"てんない で おねがい します。","meaning":"Eat in, please.","romaji":"tennai de onegai shimasu."},{"jp":"持ち帰りでお願いします。","kana":"もちかえり で おねがい します。","meaning":"To take away, please.","romaji":"mochikaeri de onegai shimasu."}],"note":"The tax rate differs. Food to take away is taxed at 8% and food eaten in at 10%, so staff ask to charge the right rate.","level":"core","romaji":"kochira de omeshiagari desu ka?"},{"id":"restaurants-cafe-02","speaker":"staff","jp":"サイズはいかがなさいますか？","kana":"サイズ は いかが なさいます か？","meaning":"What size would you like?","also_heard":[{"jp":"Mでよろしいですか？","kana":"エム で よろしい です か？","meaning":"Is M OK?","romaji":"emu de yoroshii desu ka?"}],"replies":[{"jp":"Mでお願いします。","kana":"エム で おねがい します。","meaning":"M, please.","romaji":"emu de onegai shimasu."},{"jp":"普通でお願いします。","kana":"ふつう で おねがい します。","meaning":"Regular, please.","romaji":"futsuu de onegai shimasu."}],"note":"Sizes are often S, M and L (エス, エム, エル). Check the board before you order.","level":"core","romaji":"saizu wa ikaga nasaimasu ka?"},{"id":"restaurants-cafe-03","speaker":"staff","jp":"ホットですか？","kana":"ホット です か？","meaning":"Hot?","replies":[{"jp":"ホットでお願いします。","kana":"ホット で おねがい します。","meaning":"Hot, please.","romaji":"hotto de onegai shimasu."},{"jp":"アイスでお願いします。","kana":"アイス で おねがい します。","meaning":"Iced, please.","romaji":"aisu de onegai shimasu."}],"note":"Asked for hot or iced drinks. The other option is アイス.","level":"core","romaji":"hotto desu ka?"},{"id":"restaurants-cafe-04","speaker":"staff","jp":"砂糖やミルクはお付けしますか？","kana":"さとう や ミルク は おつけ します か？","meaning":"Shall I add sugar or milk?","replies":[{"jp":"いりません。","kana":"いりません。","meaning":"No, thanks.","romaji":"irimasen."},{"jp":"ミルクだけください。","kana":"ミルク だけ ください。","meaning":"Just milk, please.","romaji":"miruku dake kudasai."}],"level":"useful","romaji":"satou ya miruku wa otsuke shimasu ka?"},{"id":"restaurants-cafe-05","speaker":"staff","jp":"トレーとトングをお取りください。","kana":"トレー と トング を おとり ください。","meaning":"Please take a tray and tongs.","replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Self-service bakery: pick the bread with the tongs, not your hands. Put it on the tray and take it to the register.","level":"core","romaji":"toree to tongu o otori kudasai."},{"id":"restaurants-cafe-06","speaker":"staff","jp":"温めましょうか？","kana":"あたためましょう か？","meaning":"Shall I heat it up?","also_heard":[{"jp":"温めますか？","kana":"あたためます か？","meaning":"Would you like it warmed?","romaji":"atatamemasu ka?"}],"replies":[{"jp":"はい、温めてください。","kana":"はい、 あたためて ください。","meaning":"Yes, please heat it.","romaji":"hai, atatamete kudasai."},{"jp":"そのままで。","kana":"そのまま で。","meaning":"As it is.","romaji":"sonomama de."}],"level":"useful","romaji":"atatamemashou ka?"},{"id":"restaurants-cafe-07","speaker":"staff","jp":"番号札をお持ちになってお席でお待ちください。","kana":"ばんごうふだ を おもち に なって おせき で おまち ください。","meaning":"Take the number tag and wait at your seat.","also_heard":[{"jp":"出来上がったらお席までお持ちします。","kana":"できあがったら おせき まで おもちします。","meaning":"When it's ready, we'll bring it to your seat.","romaji":"dekiagattara oseki made omochishimasu."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"The tag stands on the table. Staff bring the order to your seat once it is ready.","level":"core","romaji":"bangoufuda o omochi ni natte oseki de omachi kudasai."},{"id":"restaurants-cafe-08","speaker":"staff","jp":"呼び出しベルが鳴ったら取りに来てください。","kana":"よびだし ベル が なったら とりに きて ください。","meaning":"When the pager buzzes, come and collect your order.","also_heard":[{"jp":"席までお持ちします。","kana":"せき まで おもちします。","meaning":"We'll bring it to your seat.","romaji":"seki made omochishimasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Some places give you a pager that vibrates and lights up. When it goes off, go to the counter to collect the order.","level":"useful","romaji":"yobidashi beru ga nattara torini kite kudasai."},{"id":"restaurants-cafe-09","speaker":"staff","jp":"お済みのトレーは返却口にお戻しください。","kana":"おすみ の トレー は へんきゃくぐち に おもどし ください。","meaning":"Please return used trays to the return counter.","also_heard":[{"jp":"ゴミは分別してください。","kana":"ゴミ は ぶんべつ して ください。","meaning":"Please sort your rubbish.","romaji":"gomi wa bunbetsu shite kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Trays go to the return counter. Sort rubbish into burnable waste, PET bottles and cans.","level":"core","romaji":"osumi no toree wa henkyakuguchi ni omodoshi kudasai."},{"id":"restaurants-cafe-10","speaker":"staff","jp":"甘さはどうなさいますか？","kana":"あまさ は どう なさいます か？","meaning":"How sweet would you like it?","also_heard":[{"jp":"氷の量はどうしますか？","kana":"こおり の りょう は どう します か？","meaning":"How much ice would you like?","romaji":"koori no ryou wa dou shimasu ka?"}],"replies":[{"jp":"甘さは普通で、氷は少なめでお願いします。","kana":"あまさ は ふつう で、 こおり は すくなめ で おねがい します。","meaning":"Regular sweetness, less ice, please.","romaji":"amasa wa futsuu de, koori wa sukuname de onegai shimasu."},{"jp":"無糖でお願いします。","kana":"むとう で おねがい します。","meaning":"Unsweetened, please.","romaji":"mutou de onegai shimasu."}],"note":"Bubble tea shops ask about sweetness and ice. 無糖 means no sugar, and 少なめ means less.","level":"useful","romaji":"amasa wa dou nasaimasu ka?"},{"id":"restaurants-cafe-11","speaker":"staff","jp":"セットにしますか？","kana":"セット に します か？","meaning":"Would you like it as a set?","also_heard":[{"jp":"ポテトとドリンクのセットはいかがですか？","kana":"ポテト と ドリンク の セット は いかが です か？","meaning":"Would you like the potato and drink set?","romaji":"poteto to dorinku no setto wa ikaga desu ka?"}],"replies":[{"jp":"セットでお願いします。","kana":"セット で おねがい します。","meaning":"The set, please.","romaji":"setto de onegai shimasu."},{"jp":"単品でお願いします。","kana":"たんぴん で おねがい します。","meaning":"Just the item, please.","romaji":"tanpin de onegai shimasu."}],"note":"Fast-food sets add fries and a drink for a fixed extra price.","level":"useful","romaji":"setto ni shimasu ka?"},{"id":"restaurants-cafe-12","speaker":"staff","jp":"千円お預かりします。","kana":"せん えん おあずかり します。","meaning":"I'll take your 1,000 yen.","also_heard":[{"jp":"レシートはご利用ですか？","kana":"レシート は ごりよう で
