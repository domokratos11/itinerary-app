"level":"useful","romaji":"poppukoon baketto wa hitori hitotsu made desu."},{"id":"sightseeing-park-10","speaker":"staff","jp":"楽しんでくださいね！","kana":"たのしんで ください ね！","meaning":"Enjoy yourselves!","replies":[{"jp":"ありがとうございます！","kana":"ありがとう ございます！","meaning":"Thank you!","romaji":"arigatou gozaimasu!"}],"also_heard":[{"jp":"いってらっしゃい！","kana":"いってらっしゃい！","meaning":"Have a great time, see you!","romaji":"itterasshai!"},{"jp":"メリークリスマス！","kana":"メリークリスマス！","meaning":"Merry Christmas!","romaji":"meriikurisumasu!"}],"note":"Cast greetings are cheerful. Wave back, or say こんにちは.","level":"useful","romaji":"tanoshinde kudasai ne!"},{"id":"sightseeing-park-11","speaker":"announcement","jp":"本日はご来園ありがとうございました。","kana":"ほんじつ は ごらいえん ありがとう ございました。","meaning":"Thank you for visiting the park today.","also_heard":[{"jp":"閉園時間です。","kana":"へいえん じかん です。","meaning":"It is closing time.","romaji":"heien jikan desu."}],"note":"A closing announcement. Allow extra time for the crowd at the exit.","level":"listen-only","romaji":"honjitsu wa goraien arigatou gozaimashita."}]},{"title":"Bus tours and guided visits","intro":"Meeting points, seats, free time and getting back on time on a guided day tour.","phrases":[{"id":"sightseeing-tour-01","speaker":"you","jp":"集合場所はどこですか。","kana":"しゅうごうばしょ は どこ です か。","meaning":"Where is the meeting point?","replies":[{"jp":"あちらの出口です。","kana":"あちら の でぐち です。","meaning":"It's at that exit.","romaji":"achira no deguchi desu."}],"note":"Check the exact station and exit on your tour voucher, since large stations have several exits.","level":"core","romaji":"shuugoubasho wa doko desu ka."},{"id":"sightseeing-tour-02","speaker":"you","jp":"集合は何時ですか。","kana":"しゅうごう は なんじ です か。","meaning":"What time is the meeting?","replies":[{"jp":"七時四十分集合です。","kana":"しちじ よんじゅっぷん しゅうごう です。","meaning":"Meet at 7:40.","romaji":"shichiji yonjuppun shuugou desu."}],"note":"集合 is when to gather and 出発 is when the bus leaves. Arrive early, and ask about both if unclear.","level":"core","romaji":"shuugou wa nanji desu ka."},{"id":"sightseeing-tour-03","speaker":"staff","jp":"座席は十五番です。","kana":"ざせき は じゅうごばん です。","meaning":"Your seat is number 15.","replies":[{"jp":"十五番ですね、ありがとうございます。","kana":"じゅうごばん です ね、 ありがとう ございます。","meaning":"Number 15, thank you.","romaji":"juugoban desu ne, arigatou gozaimasu."}],"note":"You usually keep the same seat all day. Remember your number.","level":"core","romaji":"zaseki wa juugoban desu."},{"id":"sightseeing-tour-04","speaker":"staff","jp":"ここで自由時間は一時間です。","kana":"ここ で じゆうじかん は いちじかん です。","meaning":"You have one hour of free time here.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"Listen for the number, then note the time you must be back on the bus.","level":"core","romaji":"koko de jiyuujikan wa ichijikan desu."},{"id":"sightseeing-tour-05","speaker":"staff","jp":"十二時五十分までにバスにお戻りください。","kana":"じゅうにじごじゅっぷん まで に バス に おもどり ください。","meaning":"Please be back on the bus by 12:50.","replies":[{"jp":"十二時五十分ですね。","kana":"じゅうにじごじゅっぷん です ね。","meaning":"12:50, right?","romaji":"juunijigojuppun desu ne."}],"also_heard":[{"jp":"バスは定刻に出発いたします。","kana":"バス は ていこく に しゅっぱつ いたします。","meaning":"The bus leaves exactly on time.","romaji":"basu wa teikoku ni shuppatsu itashimasu."}],"note":"Repeat the time back to confirm it, and try to return a little early.","level":"core","romaji":"juunijigojuppun made ni basu ni omodori kudasai."},{"id":"sightseeing-tour-06","speaker":"you","jp":"戻りの時間をもう一度お願いします。","kana":"もどり の じかん を もういちど おねがい します。","meaning":"Could you say the return time once more?","replies":[{"jp":"十二時五十分です。","kana":"じゅうにじごじゅっぷん です。","meaning":"It's 12:50.","romaji":"juunijigojuppun desu."}],"note":"Asking again is fine. It is especially useful in a big group.","level":"core","romaji":"modori no jikan o mouichido onegai shimasu."},{"id":"sightseeing-tour-07","speaker":"staff","jp":"旗を目印にしてください。","kana":"はた を めじるし に して ください。","meaning":"Use the flag as your landmark.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"Guides often carry a flag in crowds. Keep it in sight.","level":"useful","romaji":"hata o mejirushi ni shite kudasai."},{"id":"sightseeing-tour-08","speaker":"staff","jp":"人数を確認します。","kana":"にんずう を かくにん します。","meaning":"We are checking the headcount.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"全員そろいました。","kana":"ぜんいん そろいました。","meaning":"Everyone is here.","romaji":"zen'in soroimashita."}],"note":"Stay close to the group while the count is taken.","level":"useful","romaji":"ninzuu o kakunin shimasu."},{"id":"sightseeing-tour-09","speaker":"you","jp":"お昼ごはんは付いていますか。","kana":"おひるごはん は ついて います か。","meaning":"Is lunch included?","replies":[{"jp":"はい、含まれています。","kana":"はい、 ふくまれて います。","meaning":"Yes, it's included.","romaji":"hai, fukumarete imasu."},{"jp":"いいえ、各自でお願いします。","kana":"いいえ、 かくじ で おねがい します。","meaning":"No, each person arranges their own.","romaji":"iie, kakuji de onegai shimasu."}],"note":"各自 means each person on their own. Check the tour details before the day.","level":"core","romaji":"ohirugohan wa tsuite imasu ka."},{"id":"sightseeing-tour-10","speaker":"staff","jp":"トイレ休憩は十分間です。","kana":"トイレ きゅうけい は じゅっぷんかん です。","meaning":"The restroom break is 10 minutes.","replies":[{"jp":"じゅっぷん ですね。","kana":"じゅっぷん です ね。","meaning":"Ten minutes, got it.","romaji":"juppun desu ne."}],"note":"Breaks are short. Use the time well and be back on time.","level":"core","romaji":"toire kyuukei wa juppunkan desu."},{"id":"sightseeing-tour-11","speaker":"you","jp":"すみません、少し遅れます。","kana":"すみません、 すこし おくれます。","meaning":"Sorry, I'll be a little late.","replies":[{"jp":"大丈夫ですよ。","kana":"だいじょうぶ です よ。","meaning":"That's fine.","romaji":"daijoubu desu yo."},{"jp":"連絡先に電話してください。","kana":"れんらくさき に でんわ して ください。","meaning":"Please call the contact number.","romaji":"renrakusaki ni denwa shite kudasai."}],"note":"Save the tour operator's phone number before the day, in case you need to call.","level":"core","romaji":"sumimasen, sukoshi okuremasu."}]},{"title":"Museums and memorial sites","intro":"Quiet visits, English explanations and closing times at museums and memorial sites.","phrases":[{"id":"sightseeing-museum-01","speaker":"you","jp":"英語の説明はありますか。","kana":"えいご の せつめい は あります か。","meaning":"Are there explanations in English?","replies":[{"jp":"はい、英語の解説があります。","kana":"はい、 えいご の かいせつ が あります。","meaning":"Yes, there are English notes.","romaji":"hai, eigo no kaisetsu ga arimasu."}],"note":"Some displays have English panels, and an audio guide may be available. Ask at the entrance desk.","level":"core","romaji":"eigo no setsumei wa arimasu ka."},{"id":"sightseeing-museum-02","speaker":"you","jp":"どこから見ればいいですか。","kana":"どこ から みれば いい です か。","meaning":"Where should we start?","replies":[{"jp":"順路に沿ってご覧ください。","kana":"じゅんろ に そって ごらん ください。","meaning":"Please follow the route.","romaji":"junro ni sotte goran kudasai."}],"note":"順路 is the set route. Follow the arrows in order.","level":"core","romaji":"doko kara mireba ii desu ka."},{"id":"sightseeing-museum-03","speaker":"you","jp":"全部見るのにどのくらいかかりますか。","kana":"ぜんぶ みる の に どのくらい かかります か。","meaning":"How long does it take to see everything?","replies":[{"jp":"一時間半くらいです。","kana":"いちじかんはん くらい です。","meaning":"About an hour and a half.","romaji":"ichijikanhan kurai desu."}],"note":"所要時間 means the time needed. The answer is only an example, since it depends on your pace.","level":"core","romaji":"zenbu miru no ni donokurai kakarimasu ka."},{"id":"sightseeing-museum-04","speaker":"you","jp":"時間が短い場合は何を見ればいいですか。","kana":"じかん が みじかい ばあい は なに を みれば いい です か。","meaning":"If I have little time, what should I see?","replies":[{"jp":"こちらの展示がおすすめです。","kana":"こちら の てんじ が おすすめ です。","meaning":"I recommend this display.","romaji":"kochira no tenji ga osusume desu."}],"note":"If time is short, ask for the main highlights and skip the side rooms.","level":"useful","romaji":"jikan ga mijikai baai wa nani o mireba ii desu ka."},{"id":"sightseeing-museum-05","speaker":"staff","jp":"館内ではお静かにお願いします。","kana":"かんない で は おしずか に おねがい します。","meaning":"Please be quiet inside.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"会話は小さな声でお願いします。","kana":"かいわ は ちいさな こえ で おねがい します。","meaning":"Please keep your conversation to a quiet voice.","romaji":"kaiwa wa chiisana koe de onegai shimasu."}],"note":"Memorial sites expect a quiet, respectful tone. Keep your voice low.","level":"core","romaji":"kannai de wa oshizuka ni onegai shimasu."},{"id":"sightseeing-museum-06","speaker":"staff","jp":"写真撮影は一部だけ可能です。","kana":"しゃしん さつえい は いちぶ だけ かのう です。","meaning":"Photography is allowed in only some areas.","replies":[{"jp":"どこが禁止ですか。","kana":"どこ が きんし です か。","meaning":"Where is it not allowed?","romaji":"doko ga kinshi desu ka."}],"also_heard":[{"jp":"一部撮影禁止です。","kana":"いちぶ さつえい きんし です。","meaning":"Photos are banned in some areas.","romaji":"ichibu satsuei kinshi desu."}],"note":"Check the sign at each room before you take a photo.","level":"useful","romaji":"shashin satsuei wa ichibu dake kanou desu."},{"id":"sightseeing-museum-07","speaker":"you","jp":"展示に触ってもいいですか。","kana":"てんじ に さわって も いい です か。","meaning":"May I touch the exhibit?","replies":[{"jp":"触らないでください。","kana":"さわらないで ください。","meaning":"Please don't touch.","romaji":"sawaranaide kudasai."}],"note":"Exhibits are often fragile. Assume touching is not allowed.","level":"useful","romaji":"tenji ni sawatte mo ii desu ka."},{"id":"sightseeing-museum-08","speaker":"you","jp":"ミュージアムショップはどこですか。","kana":"ミュージアムショップ は どこ です か。","meaning":"Where is the museum shop?","replies":[{"jp":"出口の近くです。","kana":"でぐち の ちかく です。","meaning":"Near the exit.","romaji":"deguchi no chikaku desu."}],"note":"The shop is often near or past the exit, so keep that in mind before you leave your bags.","level":"core","romaji":"myuujiamushoppu wa doko desu ka."},{"id":"sightseeing-museum-09","speaker":"you","jp":"入口と出口は別々ですか。","kana":"いりぐち と でぐち は べつべつ です か。","meaning":"Are the entrance and exit separate?","replies":[{"jp":"はい、別々です。","kana":"はい、 べつべつ です。","meaning":"Yes, they're separate.","romaji":"hai, betsubetsu desu."},{"jp":"いいえ、同じです。","kana":"いいえ、 おなじ です。","meaning":"No, they're the same.","romaji":"iie, onaji desu."}],"note":"Know this before you leave, so you find the right way out.","level":"useful","romaji":"iriguchi to deguchi wa betsubetsu desu ka."},{"id":"sightseeing-museum-10","speaker":"staff","jp":"本日の入場は終了しました。","kana":"ほんじつ の にゅうじょう は しゅうりょう しました。","meaning":"Entry for today has ended.","replies":[{"jp":"明日は開いていますか。","kana":"あした は あいて います か。","meaning":"Is it open tomorrow?","romaji":"ashita wa aite imasu ka."}],"note":"Check the 休館日 (closed day) on the official website before you go.","level":"listen-only","romaji":"honjitsu no nyuujou wa shuuryou shimashita."},{"id":"sightseeing-museum-11","speaker":"you","jp":"とても勉強になりました。","kana":"とても べんきょう に なりました。","meaning":"I learned a lot.","replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"A polite way to close your visit. Staff will usually reply with thanks.","level":"useful","romaji":"totemo benkyou ni narimashita."}]},{"title":"Asking locals and information centres","intro":"Tourist information desks and passers-by for what to do nearby, maps and opening times.","phrases":[{"id":"sightseeing-info-01","speaker":"you","jp":"この近くでおすすめの場所はありますか。","kana":"この ちかく で おすすめ の ばしょ は あります か。","meaning":"Is there a place you would recommend nearby?","replies":[{"jp":"はい、夜のイルミネーションがきれいですよ。","kana":"はい、 よる の イルミネーション が きれい です よ。","meaning":"Yes, the night illuminations are beautiful.","romaji":"hai, yoru no irumineeshon ga kirei desu yo."}],"note":"Ask 歩いて行けますか next, to find out whether it is within walking distance.","level":"core","romaji":"kono chikaku de osusume no basho wa arimasu ka."},{"id":"sightseeing-info-02","speaker":"you","jp":"歩いて行けますか。","kana":"あるいて いけます か。","meaning":"Can we walk there?","replies":[{"jp":"はい、歩いて十分くらいです。","kana":"はい、 あるいて じゅっぷん くらい です。","meaning":"Yes, about 10 minutes on foot.","romaji":"hai, aruite juppun kurai desu."}],"note":"徒歩 means on foot. Times are estimates, so allow a little extra.","level":"core","romaji":"aruite ikemasu ka."},{"id":"sightseeing-info-03","speaker":"you","jp":"英語の地図はありますか。","kana":"えいご の ちず は あります か。","meaning":"Do you have a map in English?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you are.","romaji":"hai, douzo."}],"note":"If there is none, ask for a Japanese map and point at the place you want.","level":"core","romaji":"eigo no chizu wa arimasu ka."},{"id":"sightseeing-info-04","speaker":"you","jp":"ここに印をつけてもらえますか。","kana":"ここ に しるし を つけて もらえます か。","meaning":"Could you mark it here on the map?","replies":[{"jp":"はい、いいですよ。","kana":"はい、 いい です よ。","meaning":"Sure.","romaji":"hai, ii desu yo."}],"note":"Ask them to mark a sight, your hotel or a station on the map.","level":"useful","romaji":"koko ni shirushi o tsukete moraemasu ka."},{"id":"sightseeing-info-05","speaker":"you","jp":"今日は開いていますか。","kana":"きょう は あいて います か。","meaning":"Is it open today?","replies":[{"jp":"はい、やっています。","kana":"はい、 やって います。","meaning":"Yes, it's open.","romaji":"hai, yatte imasu."},{"jp":"今日は休みです。","kana":"きょう は やすみ です。","meaning":"It's closed today.","romaji":"kyou wa yasumi desu."}],"note":"休み means closed. Check the posted hours before you go.","level":"core","romaji":"kyou wa aite imasu ka."},{"id":"sightseeing-info-06","speaker":"you","jp":"夜に行く価値はありますか。","kana":"よる に いく かち は あります か。","meaning":"Is it worth going at night?","replies":[{"jp":"はい、夜景がきれいですよ。","kana":"はい、 やけい が きれい です よ。","meaning":"Yes, the night view is beautiful.","romaji":"hai, yakei ga kirei desu yo."}],"note":"夜景 means night view. Useful for the winter lights.","level":"useful","romaji":"yoru ni iku kachi wa arimasu ka."},{"id":"sightseeing-info-07","speaker":"you","jp":"写真スポットはどこですか。","kana":"しゃしん スポット は どこ です か。","meaning":"Where is a good photo spot?","replies":[{"jp":"橋の上がおすすめです。","kana":"はし の うえ が おすすめ です。","meaning":"The top of the bridge is recommended.","romaji":"hashi no ue ga osusume desu."}],"note":"Ask what the view is like before you walk there, so you can plan your time.","level":"core","romaji":"shashin supotto wa doko desu ka."},{"id":"sightseeing-info-08","speaker":"you","jp":"ここからどう行けばいいですか。","kana":"ここ から どう いけば いい です か。","meaning":"How do I get there from here?","replies":[{"jp":"まっすぐ行って、右です。","kana":"まっすぐ いって、 みぎ です。","meaning":"Go straight, then turn right.","romaji":"massugu itte, migi desu."}],"note":"Ask them to point, and repeat the directions back to check you have them right.","level":"core","romaji":"koko kara dou ikeba ii desu ka."},{"id":"sightseeing-info-09","speaker":"you","jp":"混んでいますか。","kana":"こんで います か。","meaning":"Is it crowded?","replies":[{"jp":"週末は混みます。","kana":"しゅうまつ は こみます。","meaning":"It gets busy on weekends.","romaji":"shuumatsu wa komimasu."}],"note":"空いていますか asks the opposite, Is it empty?","level":"useful","romaji":"konde imasu ka."},{"id":"sightseeing-info-10","speaker":"you","jp":"荷物を預けるところはありますか。","kana":"にもつ を あずける ところ は あります か。","meaning":"Is there a place to leave bags?","replies":[{"jp":"駅にあります。","kana":"えき に あります。","meaning":"There is one at the station.","romaji":"eki ni arimasu."}],"note":"手荷物預かり means baggage deposit. Look for it at stations.","level":"useful","romaji":"nimotsu o azukeru tokoro wa arimasu ka."},{"id":"sightseeing-info-11","speaker":"you","jp":"ありがとうございます、助かりました。","kana":"ありがとう ございます、 たすかりました。","meaning":"Thank you, that was a big help.","replies":[{"jp":"どういたしまして。","kana":"どういたしまして。","meaning":"You're welcome.","romaji":"douitashimashite."}],"note":"A simple way to close the conversation.","level":"core","romaji":"arigatou gozaimasu, tasukarimashita."},{"id":"sightseeing-info-12","speaker":"you","jp":"現在地はどこですか。","kana":"げんざいち は どこ です か。","meaning":"Where is our current location?","replies":[{"jp":"ここです。","kana":"ここ です。","meaning":"Here.","romaji":"koko desu."}],"note":"現在地 means your current location on a map.","level":"useful","romaji":"genzaichi wa doko desu ka."}]}],"dialogues":[{"title":"Timed tickets for an observation deck","lines":[{"speaker":"you","jp":"展望台のチケットを二枚ください。","kana":"てんぼうだい の チケット を にまい ください。","meaning":"Two tickets for the observation deck, please.","romaji":"tenboudai no chiketto o nimai kudasai."},{"speaker":"staff","jp":"何時のご入場がよろしいですか。","kana":"なんじ の ごにゅうじょう が よろしい です か。","meaning":"What entry time would you like?","romaji":"nanji no gonyuujou ga yoroshii desu ka."},{"speaker":"you","jp":"夕方で、一番早い時間はいつですか。","kana":"ゆうがた で、 いちばん はやい じかん は いつ です か。","meaning":"Evening, please. When is the earliest time?","romaji":"yuugata de, ichiban hayai jikan wa itsu desu ka."},{"speaker":"staff","jp":"四時十五分なら空いています。","kana":"よじじゅうごふん なら あいて います。","meaning":"4:15 is available.","romaji":"yojijuugofun nara aite imasu."},{"speaker":"you","jp":"それでお願いします。","kana":"それ で おねがい します。","meaning":"That one, please.","romaji":"sore de onegai shimasu."},{"speaker":"staff","jp":"大人二名で、こちらになります。","kana":"おとな にめい で、 こちら に なります。","meaning":"For two adults, here you are.","romaji":"otona nimei de, kochira ni narimasu."},{"speaker":"you","jp":"カードで払えますか。","kana":"カード で はらえます か。","meaning":"Can I pay by card?","romaji":"kaado de haraemasu ka."},{"speaker":"staff","jp":"はい。こちらのQRコードで入場してください。","kana":"はい。 こちら の キューアールコード で にゅうじょう して ください。","meaning":"Yes. Enter with this QR code.","romaji":"hai. kochira no kyuuaarukoodo de nyuujou shite kudasai."},{"speaker":"you","jp":"再入場はできますか。","kana":"さいにゅうじょう は できます か。","meaning":"Can we re-enter?","romaji":"sainyuujou wa dekimasu ka."}]},{"title":"Asking someone to take a photo","lines":[{"speaker":"you","jp":"すみません、写真をお願いできますか。","kana":"すみません、 しゃしん を おねがい できます か。","meaning":"Excuse me, could you take a photo for us?","romaji":"sumimasen, shashin o onegai dekimasu ka."},{"speaker":"staff","jp":"はい、いいですよ。","kana":"はい、 いい です よ。","meaning":"Yes, sure.","romaji":"hai, ii desu yo."},{"speaker":"you","jp":"ここを押すだけです。富士山が入るようにお願いします。","kana":"ここ を おす だけ です。 ふじさん が はいる よう に おねがい します。","meaning":"You just press here. Please get Mt. Fuji in the shot.","romaji":"koko o osu dake desu. fujisan ga hairu you ni onegai shimasu."},{"speaker":"staff","jp":"はい、撮りますよ。はい、チーズ。","kana":"はい、 とります よ。 はい、 チーズ。","meaning":"OK, I'm taking it. Say cheese.","romaji":"hai, torimasu yo. hai, chiizu."},{"speaker":"you","jp":"もう一枚お願いします。縦でも。","kana":"もう いちまい おねがい します。 たて で も。","meaning":"One more, please. Vertical too.","romaji":"mou ichimai onegai shimasu. tate de mo."},{"speaker":"staff","jp":"はい、どうぞ。確認してください。","kana":"はい、 どうぞ。 かくにん して ください。","meaning":"Here you go. Please check it.","romaji":"hai, douzo. kakunin shite kudasai."},{"speaker":"you","jp":"ありがとうございます。よかったら、お二人も撮りましょうか。","kana":"ありがとう ございます。 よかったら、 おふたり も とりましょう か。","meaning":"Thank you. If you like, shall I take a photo of you two?","romaji":"arigatou gozaimasu. yokattara, ofutari mo torimashou ka."},{"speaker":"staff","jp":"いいんですか。お願いします。","kana":"いい ん です か。 おねがい します。","meaning":"Are you sure? Yes, please.","romaji":"ii n desu ka. onegai shimasu."}]},{"title":"Bus tour: free time and return time","lines":[{"speaker":"staff","jp":"みなさん、ここは白川郷です。自由時間は九十分です。","kana":"みなさん、 ここ は しらかわごう です。 じゆうじかん は きゅうじゅっぷん です。","meaning":"Everyone, this is Shirakawa-go. You have 90 minutes of free time.","romaji":"minasan, koko wa shirakawagou desu. jiyuujikan wa kyuujuppun desu."},{"speaker":"staff","jp":"集合は十二時四十五分です。バスの駐車場にお戻りください。","kana":"しゅうごう は じゅうにじ よんじゅうごふん です。 バス の ちゅうしゃじょう に おもどり ください。","meaning":"Meet at 12:45. Please return to the bus parking area.","romaji":"shuugou wa juuniji yonjuugofun desu. basu no chuushajou ni omodori kudasai."},{"speaker":"you","jp":"すみません、集合時間をもう一度お願いします。","kana":"すみません、 しゅうごう じかん を もういちど おねがい します。","meaning":"Sorry, could you say the meeting time once more?","romaji":"sumimasen, shuugou jikan o mouichido onegai s ","kana":"クリスマスマーケット","meaning":"Christmas market","romaji":"kurisumasumaaketto"},{"jp":"ホットワイン","kana":"ホットワイン","meaning":"mulled wine","romaji":"hottowain"},{"jp":"カウントダウン","kana":"カウントダウン","meaning":"countdown","romaji":"kauntodaun"},{"jp":"初詣","kana":"はつもうで","meaning":"first shrine visit of the year","romaji":"hatsumoude"},{"jp":"福袋","kana":"ふくぶくろ","meaning":"lucky bag","romaji":"fukubukuro"},{"jp":"おみくじ","kana":"おみくじ","meaning":"fortune slip","romaji":"omikuji"},{"jp":"お守り","kana":"おまもり","meaning":"amulet","romaji":"omamori"}]},{"title":"Rides and views","items":[{"jp":"展望台","kana":"てんぼうだい","meaning":"observation deck","romaji":"tenboudai"},{"jp":"ロープウェイ","kana":"ロープウェイ","meaning":"ropeway, cable car","romaji":"roopuwei"},{"jp":"フェリー","kana":"フェリー","meaning":"ferry","romaji":"ferii"},{"jp":"乗り場","kana":"のりば","meaning":"boarding point","romaji":"noriba"},{"jp":"視界","kana":"しかい","meaning":"visibility","romaji":"shikai"},{"jp":"景色","kana":"けしき","meaning":"view, scenery","romaji":"keshiki"},{"jp":"夜景","kana":"やけい","meaning":"night view","romaji":"yakei"},{"jp":"運休","kana":"うんきゅう","meaning":"service suspended","romaji":"unkyuu"}]},{"title":"Tours","items":[{"jp":"集合","kana":"しゅうごう","meaning":"gathering, meeting","romaji":"shuugou"},{"jp":"解散","kana":"かいさん","meaning":"breaking up, end of the group","romaji":"kaisan"},{"jp":"自由時間","kana":"じゆうじかん","meaning":"free time","romaji":"jiyuujikan"},{"jp":"添乗員","kana":"てんじょういん","meaning":"tour conductor","romaji":"tenjouin"},{"jp":"ガイド","kana":"ガイド","meaning":"guide","romaji":"gaido"},{"jp":"座席","kana":"ざせき","meaning":"seat","romaji":"zaseki"},{"jp":"旗","kana":"はた","meaning":"flag","romaji":"hata"},{"jp":"人数","kana":"にんずう","meaning":"number of people","romaji":"ninzuu"}]},{"title":"Photos","items":[{"jp":"写真","kana":"しゃしん","meaning":"photo","romaji":"shashin"},{"jp":"撮る","kana":"とる","meaning":"to take (a photo)","romaji":"toru"},{"jp":"縦","kana":"たて","meaning":"portrait (vertical)","romaji":"tate"},{"jp":"横","kana":"よこ","meaning":"landscape (horizontal)","romaji":"yoko"},{"jp":"もう一枚","kana":"もういちまい","meaning":"one more","romaji":"mouichimai"},{"jp":"背景","kana":"はいけい","meaning":"background","romaji":"haikei"}]},{"title":"Places in this module","items":[{"jp":"富士山","kana":"ふじさん","meaning":"Mt. Fuji","romaji":"fujisan"},{"jp":"宮島","kana":"みやじま","meaning":"Miyajima island","romaji":"miyajima"},{"jp":"白川郷","kana":"しらかわごう","meaning":"Shirakawa-go village","romaji":"shirakawagou"},{"jp":"高山","kana":"たかやま","meaning":"Takayama city","romaji":"takayama"},{"jp":"原爆ドーム","kana":"げんばくドーム","meaning":"Atomic Bomb Dome","romaji":"genbakudoomu"},{"jp":"平和記念資料館","kana":"へいわきねんしりょうかん","meaning":"Peace Memorial Museum","romaji":"heiwakinenshiryoukan"}]}],"_num":"08"},{"slug":"drugstore","title":"Drugstore and health","title_jp":"薬局","summary":"Pharmacy, symptoms, medicine labels and clinic visits","situations":[{"title":"Finding things in a drugstore","intro":"Language help, not medical advice; follow the pharmacist or doctor. Drugstore shelves are often labelled by symptom, so ask for the item, then the shelf.","phrases":[{"id":"drugstore-find-01","speaker":"you","jp":"すみません、風邪薬はどこにありますか。","kana":"すみません、 かぜぐすり は どこ に あります か。","meaning":"Excuse me, where is the cold medicine?","replies":[{"jp":"あちらの棚です。","kana":"あちら の たな です。","meaning":"It is on that shelf.","romaji":"achira no tana desu."},{"jp":"ご案内します。","kana":"ごあんない します。","meaning":"I will show you.","romaji":"goannai shimasu."}],"note":"Swap the noun to ask for something else, such as 痛み止め, 胃腸薬, 目薬 or 酔い止め. The pattern noun + はどこですか always works.","level":"core","romaji":"sumimasen, kazegusuri wa doko ni arimasu ka."},{"id":"drugstore-find-02","speaker":"you","jp":"絆創膏とマスクはどこですか。","kana":"ばんそうこう と マスク は どこ です か。","meaning":"Where are the plasters and the masks?","replies":[{"jp":"絆創膏はこちらです。","kana":"ばんそうこう は こちら です。","meaning":"The plasters are here.","romaji":"bansoukou wa kochira desu."},{"jp":"マスクはレジの近くです。","kana":"マスク は レジ の ちかく です。","meaning":"The masks are near the register.","romaji":"masuku wa reji no chikaku desu."}],"note":"Many people say バンドエイド for any plaster, though it is a brand name. Masks may be in a different area from the medicine shelves.","level":"core","romaji":"bansoukou to masuku wa doko desu ka."},{"id":"drugstore-find-03","speaker":"you","jp":"貼るカイロはありますか。","kana":"はる カイロ は あります か。","meaning":"Do you have stick-on heat packs?","replies":[{"jp":"はい、こちらにあります。","kana":"はい、 こちら に あります。","meaning":"Yes, they are here.","romaji":"hai, kochira ni arimasu."},{"jp":"今、品切れです。","kana":"いま、 しなぎれ です。","meaning":"Sorry, they are sold out now.","romaji":"ima, shinagire desu."}],"note":"貼る means it sticks to clothing. Follow the pack and keep it off bare skin.","level":"core","romaji":"haru kairo wa arimasu ka."},{"id":"drugstore-find-04","speaker":"you","jp":"貼らないカイロはありますか。","kana":"はらない カイロ は あります か。","meaning":"Do you have the kind that goes in a pocket?","replies":[{"jp":"冬の商品はあちらの棚です。","kana":"ふゆ の しょうひん は あちら の たな です。","meaning":"The winter goods are on that shelf.","romaji":"fuyu no shouhin wa achira no tana desu."}],"note":"This is the pocket type, not the stick-on kind. Ask staff if you cannot see it on display.","level":"useful","romaji":"haranai kairo wa arimasu ka."},{"id":"drugstore-find-05","speaker":"you","jp":"リップクリームとハンドクリームを探しています。","kana":"リップクリーム と ハンドクリーム を さがして います。","meaning":"I am looking for lip balm and hand cream.","replies":[{"jp":"こちらです。どうぞ。","kana":"こちら です。 どうぞ。","meaning":"Here you are.","romaji":"kochira desu. douzo."}],"note":"探しています is a softer way to say what you need than a bare question. Winter air is dry, so these are useful everyday buys.","level":"core","romaji":"rippukuriimu to handokuriimu o sagashite imasu."},{"id":"drugstore-find-06","speaker":"you","jp":"乾燥しているので、保湿クリームはありますか。","kana":"かんそう して いる ので、 ほしつ クリーム は あります か。","meaning":"My skin is dry, so do you have a moisturiser?","replies":[{"jp":"こちらです。香りがあるものとないものがあります。","kana":"こちら です。 かおり が ある もの と ない もの が あります。","meaning":"Here. Some are scented and some are not.","romaji":"kochira desu. kaori ga aru mono to nai mono ga arimasu."}],"note":"Use the word 無香料 (unscented) if you have sensitive skin.","level":"useful","romaji":"kansou shite iru node, hoshitsu kuriimu wa arimasu ka."},{"id":"drugstore-find-07","speaker":"you","jp":"喉が痛いので、のど飴かトローチはありますか。","kana":"のど が いたい ので、 のどあめ か トローチ は あります か。","meaning":"My throat hurts, so do you have throat candy or lozenges?","replies":[{"jp":"のど飴はお菓子の棚にもあります。","kana":"のどあめ は おかし の たな に も あります。","meaning":"Throat candy is also on the sweets shelf.","romaji":"nodoame wa okashi no tana ni mo arimasu."},{"jp":"トローチはこちらです。","kana":"トローチ は こちら です。","meaning":"The medicated lozenges are here.","romaji":"toroochi wa kochira desu."}],"note":"のど飴 are candy-style lozenges. トローチ are medicated lozenges. Ask staff which one suits you.","level":"useful","romaji":"nodo ga itai node, nodoame ka toroochi wa arimasu ka."},{"id":"drugstore-find-08","speaker":"you","jp":"頭痛に効く薬はありますか。","kana":"ずつう に きく くすり は あります か。","meaning":"Do you have medicine that works for a headache?","replies":[{"jp":"どんな症状ですか。","kana":"どんな しょうじょう です か。","meaning":"What symptoms do you have?","romaji":"donna shoujou desu ka."},{"jp":"こちらはいかがですか。","kana":"こちら は いかが です か。","meaning":"How about this one?","romaji":"kochira wa ikaga desu ka."}],"note":"効く means to work. Swap 頭痛 for another symptom, such as 咳 (cough) or 下痢 (diarrhoea). This is the key pattern for asking about a symptom.","level":"core","romaji":"zutsuu ni kiku kusuri wa arimasu ka."},{"id":"drugstore-find-09","speaker":"staff","jp":"何かお探しですか。","kana":"なに か おさがし です か。","meaning":"Are you looking for something?","also_heard":[{"jp":"お困りですか。","kana":"おこまり です か。","meaning":"Do you need help?","romaji":"okomari desu ka."}],"replies":[{"jp":"風邪薬を探しています。","kana":"かぜぐすり を さがして います。","meaning":"I am looking for cold medicine.","romaji":"kazegusuri o sagashite imasu."},{"jp":"大丈夫です、見ているだけです。","kana":"だいじょうぶ です、 みて いる だけ です。","meaning":"I am fine, I am just looking.","romaji":"daijoubu desu, mite iru dake desu."}],"note":"大丈夫です is the safe polite way to say no thanks.","level":"core","romaji":"nani ka osagashi desu ka."},{"id":"drugstore-find-10","speaker":"you","jp":"どの棚ですか。","kana":"どの たな です か。","meaning":"Which shelf is it on?","replies":[{"jp":"上から二段目の右側です。","kana":"うえ から にだんめ の みぎがわ です。","meaning":"The second shelf from the top, on the right.","romaji":"ue kara nidanme no migigawa desu."}],"note":"Listen for 上 (top), 下 (bottom), 右 (right), 左 (left) and 真ん中 (middle).","level":"useful","romaji":"dono tana desu ka."},{"id":"drugstore-find-11","speaker":"staff","jp":"薬剤師がいるカウンターでご相談ください。","kana":"やくざいし が いる カウンター で ごそうだん ください。","meaning":"Please consult at the counter where the pharmacist is.","replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"jp":"薬剤師さんと話したいです。","kana":"やくざいしさん と はなし たい です。","meaning":"I would like to talk to the pharmacist.","romaji":"yakuzaishisan to hanashi tai desu."}],"note":"Some medicines are pharmacist-only. Registered sellers (登録販売者) can sell only 第2類 and 第3類 products, so 第1類 goes to the pharmacist.","level":"core","romaji":"yakuzaishi ga iru kauntaa de gosoudan kudasai."},{"id":"drugstore-find-12","speaker":"you","jp":"英語の説明書はありますか。","kana":"えいご の せつめいしょ は あります か。","meaning":"Is there an English leaflet?","replies":[{"jp":"英語はありません。ごめんなさい。","kana":"えいご は ありません。 ごめんなさい。","meaning":"There is no English, sorry.","romaji":"eigo wa arimasen. gomennasai."}],"note":"Staff may not have one. A translation app on your phone can help you read the labels.","level":"useful","romaji":"eigo no setsumeisho wa arimasu ka."}]},{"title":"Describing symptoms","intro":"Short symptom sentences with から (since) get you most of the way. The pattern is body part + が + 痛い, or symptom + が + します or 出ます.","phrases":[{"id":"drugstore-symp-01","speaker":"you","jp":"風邪をひいたみたいです。","kana":"かぜ を ひいた みたい です。","meaning":"I think I have caught a cold.","replies":[{"jp":"どんな症状ですか。","kana":"どんな しょうじょう です か。","meaning":"What symptoms do you have?","romaji":"donna shoujou desu ka."},{"jp":"お大事に。","kana":"おだいじに。","meaning":"Take care.","romaji":"odaijini."}],"note":"風邪をひく is the verb for catching a cold. Do not say 風邪があります.","level":"core","romaji":"kaze o hiita mitai desu."},{"id":"drugstore-symp-02","speaker":"you","jp":"熱があります。","kana":"ねつ が あります。","meaning":"I have a fever.","replies":[{"jp":"何度ですか。","kana":"なんど です か。","meaning":"What is the temperature?","romaji":"nando desu ka."},{"jp":"熱は測りましたか。","kana":"ねつ は はかりました か。","meaning":"Did you take your temperature?","romaji":"netsu wa hakarimashita ka."}],"note":"熱 is fever. Japan uses Celsius, so say the number and 度 (degrees).","level":"core","romaji":"netsu ga arimasu."},{"id":"drugstore-symp-03","speaker":"you","jp":"熱が三十八度あります。","kana":"ねつ が さんじゅうはちど あります。","meaning":"I have a temperature of 38 degrees.","note":"Practise the numbers: 三十八 is read さんじゅうはち, then 度 for degrees.","level":"useful","romaji":"netsu ga sanjuuhachido arimasu."},{"id":"drugstore-symp-04","speaker":"you","jp":"喉が痛いです。","kana":"のど が いたい です。","meaning":"I have a sore throat.","replies":[{"jp":"咳も出ますか。","kana":"せき も でます か。","meaning":"Do you also have a cough?","romaji":"seki mo demasu ka."}],"note":"The pattern body part + が + 痛い works for most body parts.","level":"core","romaji":"nodo ga itai desu."},{"id":"drugstore-symp-05","speaker":"you","jp":"咳と鼻水が出ます。","kana":"せき と はなみず が でます。","meaning":"I have a cough and a runny nose.","note":"出る (to come out) goes with 咳, 鼻水, くしゃみ and 熱. Say it that way: 咳が出ます.","level":"core","romaji":"seki to hanamizu ga demasu."},{"id":"drugstore-symp-06","speaker":"you","jp":"頭が痛いです。","kana":"あたま が いたい です。","meaning":"I have a headache.","replies":[{"jp":"いつからですか。","kana":"いつ から です か。","meaning":"Since when?","romaji":"itsu kara desu ka."}],"note":"頭痛がします (I have a headache) is also common. Use the pattern you find easiest.","level":"core","romaji":"atama ga itai desu."},{"id":"drugstore-symp-07","speaker":"you","jp":"腰が痛いです。","kana":"こし が いたい です。","meaning":"My lower back hurts.","note":"腰 is the lower back. 背中 is the back in general, so use it for the upper back.","level":"useful","romaji":"koshi ga itai desu."},{"id":"drugstore-symp-08","speaker":"you","jp":"お腹が痛いです。","kana":"おなか が いたい です。","meaning":"My stomach hurts.","replies":[{"jp":"食べ過ぎですか。","kana":"たべすぎ です か。","meaning":"Did you eat too much?","romaji":"tabesugi desu ka."}],"note":"お腹 is your stomach or belly. 胃 is the organ, and 胃腸薬 is the word on stomach medicine shelves.","level":"core","romaji":"onaka ga itai desu."},{"id":"drugstore-symp-09","speaker":"you","jp":"下痢をしています。","kana":"げり を して います。","meaning":"I have diarrhoea.","note":"If you also feel sick, say 吐き気がします (I feel nauseous).","level":"useful","romaji":"geri o shite imasu."},{"id":"drugstore-symp-10","speaker":"you","jp":"めまいがします。","kana":"めまい が します。","meaning":"I feel dizzy.","replies":[{"jp":"座ってください。","kana":"すわって ください。","meaning":"Please sit down.","romaji":"suwatte kudasai."}],"note":"If it is severe or comes with other symptoms, go to Situation 8.","level":"useful","romaji":"memai ga shimasu."},{"id":"drugstore-symp-11","speaker":"you","jp":"昨日から調子が悪いです。","kana":"きのう から ちょうし が わるい です。","meaning":"I have not felt well since yesterday.","replies":[{"jp":"ずっとですか。","kana":"ずっと です か。","meaning":"All the time?","romaji":"zutto desu ka."}],"note":"調子が悪い is a useful general phrase when you cannot name the symptom. から means since.","level":"core","romaji":"kinou kara choushi ga warui desu."},{"id":"drugstore-symp-12","speaker":"you","jp":"妻の薬を探しています。","kana":"つま の くすり を さがして います。","meaning":"I am looking for medicine for my wife.","replies":[{"jp":"奥様は大人ですか。","kana":"おくさま は おとな です か。","meaning":"Is your wife an adult?","romaji":"okusama wa otona desu ka."}],"note":"Say who the medicine is for. Staff will ask about that person's age and symptoms.","level":"core","romaji":"tsuma no kusuri o sagashite imasu."}]},{"title":"The pharmacist's questions and instructions","intro":"Pharmacists often ask a few standard questions before selling a medicine. These instruction lines are examples of what a pharmacist says: always follow the label and the pharmacist.","phrases":[{"id":"drugstore-ask-01","speaker":"staff","jp":"どんな症状ですか。","kana":"どんな しょうじょう です か。","meaning":"What symptoms do you have?","replies":[{"jp":"熱と喉の痛みがあります。","kana":"ねつ と のど の いたみ が あります。","meaning":"I have a fever and a sore throat.","romaji":"netsu to nodo no itami ga arimasu."},{"jp":"頭が痛いです。","kana":"あたま が いたい です。","meaning":"I have a headache.","romaji":"atama ga itai desu."}],"note":"This is usually the first question at the counter. Answer with the patterns from Situation 2.","level":"core","romaji":"donna shoujou desu ka."},{"id":"drugstore-ask-02","speaker":"staff","jp":"いつからですか。","kana":"いつ から です か。","meaning":"Since when?","replies":[{"jp":"昨日からです。","kana":"きのう から です。","meaning":"Since yesterday.","romaji":"kinou kara desu."},{"jp":"三日前からです。","kana":"みっか まえ から です。","meaning":"Since three days ago.","romaji":"mikka mae kara desu."}],"note":"Answer with から (since) and the time.","level":"core","romaji":"itsu kara desu ka."},{"id":"drugstore-ask-03","speaker":"staff","jp":"アレルギーはありますか。","kana":"アレルギー は あります か。","meaning":"Do you have any allergies?","replies":[{"jp":"ありません。","kana":"ありません。","meaning":"No, I do not.","romaji":"arimasen."},{"jp":"はい、卵のアレルギーがあります。","kana":"はい、 たまご の アレルギー が あります。","meaning":"Yes, I am allergic to eggs.","romaji":"hai, tamago no arerugii ga arimasu."}],"note":"Staff will ask, so know your allergies in Japanese before you travel. Keep a note of them on your phone.","level":"core","romaji":"arerugii wa arimasu ka."},{"id":"drugstore-ask-04","speaker":"staff","jp":"今、ほかのお薬を飲んでいますか。","kana":"いま、 ほか の おくすり を のんで います か。","meaning":"Are you taking any other medicine now?","replies":[{"jp":"いいえ、飲んでいません。","kana":"いいえ、 のんで いません。","meaning":"No, I am not.","romaji":"iie, nonde imasen."},{"jp":"はい、飲んでいます。","kana":"はい、 のんで います。","meaning":"Yes, I am.","romaji":"hai, nonde imasu."}],"note":"If you are taking something, show the box or a photo of it.","level":"core","romaji":"ima, hoka no okusuri o nonde imasu ka."},{"id":"drugstore-ask-05","speaker":"staff","jp":"お薬手帳はお持ちですか。","kana":"おくすりてちょう は おもち です か。","meaning":"Do you have a medicine notebook?","replies":[{"jp":"持っていません。","kana":"もっていません。","meaning":"I do not have one.","romaji":"motteimasen."}],"note":"お薬手帳 is a record book that many Japanese patients carry. Travellers usually do not have one, so say 持っていません.","level":"useful","romaji":"okusuritechou wa omochi desu ka."},{"id":"drugstore-ask-06","speaker":"staff","jp":"大人の方ですか。","kana":"おとな の かた です か。","meaning":"Is this for an adult?","replies":[{"jp":"はい、大人です。","kana":"はい、 おとな です。","meaning":"Yes, an adult.","romaji":"hai, otona desu."},{"jp":"子どもです。","kana":"こども です。","meaning":"It is for a child.","romaji":"kodomo desu."}],"note":"Labels set age limits, for example 15歳以上. Answer for the person who will take the medicine.","level":"core","romaji":"otona no kata desu ka."},{"id":"drugstore-ask-07","speaker":"staff","jp":"お酒と一緒には飲まないでください。","kana":"おさけ と いっしょ に は のまないで ください。","meaning":"Please do not take it with alcohol.","replies":[{"jp":"はい、気をつけます。","kana":"はい、 きを つけます。","meaning":"Yes, I will be careful.","romaji":"hai, kio tsukemasu."}],"note":"Staff may also say 飲酒は控えてください (please avoid drinking alcohol). ください is the polite request ending.","level":"core","romaji":"osake to issho ni wa nomanaide kudasai."},{"id":"drugstore-ask-08","speaker":"staff","jp":"第一類医薬品なので、薬剤師の説明が必要です。","kana":"だいいちるい いやくひん なので、 やくざいし の せつめい が ひつよう です。","meaning":"This is a Category 1 medicine, so the pharmacist must explain it.","replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"note":"Category 1 medicines are sold only by a pharmacist, who must explain them before the sale. Wait for the pharmacist at the counter.","level":"listen-only","romaji":"daiichirui iyakuhin nanode, yakuzaishi no setsumei ga hitsuyou desu."},{"id":"drugstore-ask-09","speaker":"staff","jp":"一日三回、食後に飲んでください。","kana":"いちにち さんかい、 しょくご に のんで ください。","meaning":"Take it three times a day, after meals.","replies":[{"jp":"一回何錠ですか。","kana":"いっかい なんじょう です か。","meaning":"How many tablets each time?","romaji":"ikkai nanjou desu ka."}],"note":"Sample wording only. 食後 means within about 30 minutes after eating. Always follow the label and the pharmacist.","level":"core","romaji":"ichinichi sankai, shokugo ni nonde kudasai."},{"id":"drugstore-ask-10","speaker":"staff","jp":"一回二錠、水で飲んでください。","kana":"いっかい にじょう、 みず で のんで ください。","meaning":"Take two tablets at a time with water.","replies":[{"jp":"一日何回までですか。","kana":"いちにち なんかい まで です か。","meaning":"Up to how many times a day?","romaji":"ichinichi nankai made desu ka."}],"note":"一回 is per dose and 一日 is per day. 錠 counts tablets and 包 counts sachets. Sample wording only: follow the label.","level":"core","romaji":"ikkai nijou, mizu de nonde kudasai."},{"id":"drugstore-ask-11","speaker":"staff","jp":"眠くなることがありますので、車の運転はしないでください。","kana":"ねむく なる こと が あります ので、 くるま の うんてん は しないで ください。","meaning":"It may make you sleepy, so please do not drive.","replies":[{"jp":"分かりました。運転はしません。","kana":"わかりました。 うんてん は しません。","meaning":"Understood. I will not drive.","romaji":"wakarimashita. unten wa shimasen."}],"note":"Look for 眠くなる成分 (ingredient that causes drowsiness) on the box. Drivers should check this first.","level":"core","romaji":"nemuku naru koto ga arimasu node, kuruma no unten wa shinaide kudasai."},{"id":"drugstore-ask-12","speaker":"staff","jp":"数日飲んでもよくならなければ、医師か薬剤師に相談してください。","kana":"すうじつ のんでも よく ならなければ、 いし か やくざいし に そうだん して ください。","meaning":"If it does not get better after a few days, please ask a doctor or pharmacist.","replies":[{"jp":"はい、そうします。ありがとうございます。","kana":"はい、 そうします。 ありがとうございます。","meaning":"Yes, I will. Thank you.","romaji":"hai, soushimasu. arigatougozaimasu."}],"note":"Standard closing advice. If you feel worse, see a doctor sooner rather than later.","level":"core","romaji":"suujitsu nondemo yoku naranakereba, ishi ka yakuzaishi ni soudan shite kudasai."}]},{"title":"Choosing between medicines and care products","intro":"When there are many similar boxes, ask staff to compare them for you. Useful contrast words are stronger and milder, drowsy, form, size and price.","phrases":[{"id":"drugstore-choose-01","speaker":"you","jp":"どれがおすすめですか。","kana":"どれ が おすすめ です か。","meaning":"Which one do you recommend?","replies":[{"jp":"症状によります。","kana":"しょうじょう に よります。","meaning":"It depends on your symptoms.","romaji":"shoujou ni yorimasu."},{"jp":"こちらがよく出ています。","kana":"こちら が よく でて います。","meaning":"This one sells well.","romaji":"kochira ga yoku dete imasu."}],"note":"Ask to be shown the options. Staff may ask about your symptoms first.","level":"useful","romaji":"dore ga osusume desu ka."},{"id":"drugstore-choose-02","speaker":"you","jp":"こっちとあっち、どう違いますか。","kana":"こっち と あっち、 どう ちがいます か。","meaning":"What is the difference between this one and that one?","replies":[{"jp":"こちらは大人用です。","kana":"こちら は おとな よう です。","meaning":"This one is for adults.","romaji":"kochira wa otona you desu."}],"note":"違い means difference. Ask about the ingredients, the form and the age group.","level":"useful","romaji":"kotchi to atchi, dou chigaimasu ka."},{"id":"drugstore-choose-03","speaker":"you","jp":"もう少し弱いのはありますか。","kana":"もう すこし よわい の は あります か。","meaning":"Do you have a milder one?","replies":[{"jp":"こちらのほうが穏やかです。","kana":"こちら の ほう が おだやか です。","meaning":"This one is gentler.","romaji":"kochira no hou ga odayaka desu."},{"jp":"強いものは薬剤師の説明が必要です。","kana":"つよい もの は やくざいし の せつめい が ひつよう です。","meaning":"A stronger one needs the pharmacist's explanation.","romaji":"tsuyoi mono wa yakuzaishi no setsumei ga hitsuyou desu."}],"note":"Stronger products may need a pharmacist to explain them first, as in Situation 3.","level":"useful","romaji":"mou sukoshi yowai no wa arimasu ka."},{"id":"drugstore-choose-04","speaker":"you","jp":"眠くならないものはありますか。","kana":"ねむく ならない もの は あります か。","meaning":"Do you have one that does not make you sleepy?","replies":[{"jp":"こちらは眠くなりにくいです。","kana":"こちら は ねむく なり にくい です。","meaning":"This one is less likely to make you sleepy.","romaji":"kochira wa nemuku nari nikui desu."},{"jp":"眠くなる成分は入っていません。","kana":"ねむく なる せいぶん は はいって いません。","meaning":"It does not contain a drowsiness ingredient.","romaji":"nemuku naru seibun wa haitte imasen."}],"note":"Check the box for 眠くなる成分. Anyone who will drive should check this before buying.","level":"core","romaji":"nemuku naranai mono wa arimasu ka."},{"id":"drugstore-choose-05","speaker":"you","jp":"錠剤と粉薬と液体、どれがありますか。","kana":"じょうざい と こなぐすり と えきたい、 どれ が あります か。","meaning":"Which do you have: tablets, powder or liquid?","replies":[{"jp":"錠剤と顆粒があります。","kana":"じょうざい と かりゅう が あります。","meaning":"We have tablets and granules.","romaji":"jouzai to karyuu ga arimasu."}],"note":"粉薬 is the everyday word for powder medicine. 顆粒 (granules) is also printed on some boxes.","level":"useful","romaji":"jouzai to konagusuri to ekitai, dore ga arimasu ka."},{"id":"drugstore-choose-06","speaker":"you","jp":"小さいパックはありますか。","kana":"ちいさい パック は あります か。","meaning":"Do you have a small pack?","replies":[{"jp":"小さいサイズはこれだけです。","kana":"ちいさい サイズ は これ だけ です。","meaning":"This is the only small size.","romaji":"chiisai saizu wa kore dake desu."}],"note":"A small pack suits a short trip. Look at the 入り figure on the box, which shows how many it contains.","level":"useful","romaji":"chiisai pakku wa arimasu ka."},{"id":"drugstore-choose-07","speaker":"you","jp":"これは大人用ですか。","kana":"これ は おとな よう です か。","meaning":"Is this one for adults?","replies":[{"jp":"はい、大人用です。","kana":"はい、 おとな よう です。","meaning":"Yes, it is for adults.","romaji":"hai, otona you desu."},{"jp":"小児用はこちらです。","kana":"しょうに よう は こちら です。","meaning":"The one for children is here.","romaji":"shouni you wa kochira desu."}],"note":"大人 means adult and 小児 means child. Check the age limit on the box.","level":"core","romaji":"kore wa otona you desu ka."},{"id":"drugstore-choose-08","speaker":"you","jp":"値段の違いは何ですか。","kana":"ねだん の ちがい は なん です か。","meaning":"What is the difference in price?","replies":[{"jp":"成分の数が違います。","kana":"せいぶん の かず が ちがいます。","meaning":"The number of ingredients is different.","romaji":"seibun no kazu ga chigaimasu."},{"jp":"基本的に同じ成分です。","kana":"きほんてき に おなじ せいぶん です。","meaning":"Basically it is the same ingredient.","romaji":"kihonteki ni onaji seibun desu."}],"note":"Do not assume a higher price means a stronger product. Ask what is different.","level":"useful","romaji":"nedan no chigai wa nan desu ka."},{"id":"drugstore-choose-09","speaker":"you","jp":"これを飲む前に、何か注意することはありますか。","kana":"これ を のむ まえ に、 なに か ちゅうい する こと は あります か。","meaning":"Is there anything I should be careful about before taking this?","replies":[{"jp":"眠くなることがあります。","kana":"ねむく なる こと が あります。","meaning":"It may make you sleepy.","romaji":"nemuku naru koto ga arimasu."},{"jp":"説明書をよく読んでください。","kana":"せつめいしょ を よく よんで ください。","meaning":"Please read the leaflet carefully.","romaji":"setsumeisho o yoku yonde kudasai."}],"note":"Ask about side effects (副作用) too. If the leaflet is unclear, ask the pharmacist.","level":"useful","romaji":"kore o nomu mae ni, nani ka chuui suru koto wa arimasu ka."},{"id":"drugstore-choose-10","speaker":"staff","jp":"こちらでよろしいですか。","kana":"こちら で よろしい です か。","meaning":"Is this one all right?","replies":[{"jp":"はい、これにします。","kana":"はい、 これ に します。","meaning":"Yes, I will take this one.","romaji":"hai, kore ni shimasu."},{"jp":"もう少し考えます。","kana":"もう すこし かんがえます。","meaning":"I will think about it a little longer.","romaji":"mou sukoshi kangaemasu."}],"note":"にします means you have decided on that one.","level":"core","romaji":"kochira de yoroshii desu ka."}]},{"title":"Everyday care items","intro":"Winter dryness, lots of walking and travel mean you will buy small items. Most are self-serve, so ask only if you cannot find them.","phrases":[{"id":"drugstore-care-01","speaker":"you","jp":"日焼け止めはありますか。","kana":"ひやけどめ は あります か。","meaning":"Do you have sunscreen?","replies":[{"jp":"こちらです。冬は品数が少ないです。","kana":"こちら です。 ふゆ は しなかず が すくない です。","meaning":"Here. There are fewer items in winter.","romaji":"kochira desu. fuyu wa shinakazu ga sukunai desu."}],"note":"Winter stock is smaller. Look for 無香料 (unscented) if you have sensitive skin.","level":"useful","romaji":"hiyakedome wa arimasu ka."},{"id":"drugstore-care-02","speaker":"you","jp":"コンタクトレンズの洗浄液はありますか。","kana":"コンタクトレンズ の せんじょうえき は あります か。","meaning":"Do you have contact lens solution?","replies":[{"jp":"ソフト用はこちらです。","kana":"ソフト よう は こちら です。","meaning":"The soft lens solution is here.","romaji":"sofuto you wa kochira desu."}],"note":"Say ソフト (soft) or ハード (hard) so staff pick the right bottle.","level":"core","romaji":"kontakutorenzu no senjoueki wa arimasu ka."},{"id":"drugstore-care-03","speaker":"you","jp":"剃刀はどこですか。","kana":"かみそり は どこ です か。","meaning":"Where are the razors?","replies":[{"jp":"日用品のコーナーです。","kana":"にちようひん の コーナー です。","meaning":"It is in the household goods section.","romaji":"nichiyouhin no koonaa desu."}],"note":"剃刀 is read かみそり. Shop signs may use the katakana カミソリ instead.","level":"useful","romaji":"kamisori wa doko desu ka."},{"id":"drugstore-care-04","speaker":"you","jp":"歯ブラシと歯磨き粉はありますか。","kana":"はぶらし と はみがきこ は あります か。","meaning":"Do you have a toothbrush and toothpaste?","replies":[{"jp":"こちらです。","kana":"こちら です。","meaning":"Here.","romaji":"kochira desu."}],"note":"柔らかめ means a softer brush and 硬め means a firmer one. Say which you want.","level":"useful","romaji":"haburashi to hamigakiko wa arimasu ka."},{"id":"drugstore-care-05","speaker":"you","jp":"生理用品はどこですか。","kana":"せいりようひん は どこ です か。","meaning":"Where are the sanitary products?","replies":[{"jp":"奥の棚です。","kana":"おく の たな です。","meaning":"On the shelf at the back.","romaji":"oku no tana desu."}],"note":"A single line is enough to find the shelf. Ask staff only if you still cannot find it.","level":"useful","romaji":"seiriyouhin wa doko desu ka."},{"id":"drugstore-care-06","speaker":"you","jp":"虫刺されの薬はありますか。","kana":"むしさされ の くすり は あります か。","meaning":"Do you have medicine for insect bites?","replies":[{"jp":"こちらです。","kana":"こちら です。","meaning":"Here.","romaji":"kochira desu."}],"note":"Insect bites are less common in winter, so this may be seasonal stock.","level":"useful","romaji":"mushisasare no kusuri wa arimasu ka."},{"id":"drugstore-care-07","speaker":"you","jp":"ビタミンのドリンクはありますか。","kana":"ビタミン の ドリンク は あります か。","meaning":"Do you have vitamin drinks?","replies":[{"jp":"栄養ドリンクはこちらです。","kana":"えいようドリンク は こちら です。","meaning":"The nutrition drinks are here.","romaji":"eiyoudorinku wa kochira desu."}],"note":"栄養ドリンク is the usual shelf name for these bottled drinks. Ask staff if you want a specific type.","level":"useful","romaji":"bitamin no dorinku wa arimasu ka."},{"id":"drugstore-care-08","speaker":"you","jp":"経口補水液はありますか。","kana":"けいこうほすいえき は あります か。","meaning":"Do you have an oral rehydration drink?","replies":[{"jp":"経口補水液はこちらです。","kana":"けいこうほすいえき は こちら です。","meaning":"The rehydration drink is here.","romaji":"keikouhosuieki wa kochira desu."}],"note":"経口補水液 is made for dehydration and is not the same as a sports drink. Ask for it by name.","level":"useful","romaji":"keikouhosuieki wa arimasu ka."},{"id":"drugstore-care-09","speaker":"you","jp":"体温計はありますか。","kana":"たいおんけい は あります か。","meaning":"Do you have a thermometer?","replies":[{"jp":"電池は入っています。","kana":"でんち は はいって います。","meaning":"The battery is included.","romaji":"denchi wa haitte imasu."}],"note":"Japanese readings are in Celsius, so check the unit on the display.","level":"useful","romaji":"taionkei wa arimasu ka."},{"id":"drugstore-care-10","speaker":"you","jp":"冷えピタはありますか。","kana":"ひえピタ は あります か。","meaning":"Do you have cooling fever sheets?","replies":[{"jp":"子ども用と大人用があります。","kana":"こども よう と おとな よう が あります。","meaning":"There are ones for children and for adults.","romaji":"kodomo you to otona you ga arimasu."}],"note":"冷えピタ is a brand name that many people use for cooling sheets. 冷却シート is the general term.","level":"useful","romaji":"hiepita wa arimasu ka."},{"id":"drugstore-care-11","speaker":"you","jp":"敏感肌用のものはありますか。","kana":"びんかんはだ よう の もの は あります か。","meaning":"Do you have one for sensitive skin?","replies":[{"jp":"こちらに無香料のものがあります。","kana":"こちら に むこうりょう の もの が あります。","meaning":"Here are the unscented ones.","romaji":"kochira ni mukouryou no mono ga arimasu."}],"note":"敏感肌 means sensitive skin. Pair it with 無香料 if you want a fragrance-free product.","level":"useful","romaji":"binkanhada you no mono wa arimasu ka."}]},{"title":"At a clinic or hospital reception","intro":"Clinics have a reception window (受付). Without a Japanese insurance card you will usually pay the full cost (自費), so ask for the right papers.","phrases":[{"id":"drugstore-clinic-01","speaker":"you","jp":"診察をお願いしたいのですが。","kana":"しんさつ を おねがい したい の です が。","meaning":"I would like to see a doctor, please.","replies":[{"jp":"予約はありますか。","kana":"よやく は あります か。","meaning":"Do you have an appointment?","romaji":"yoyaku wa arimasu ka."},{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"Please wait a moment.","romaji":"shoushou omachi kudasai."}],"note":"Some clinics need a phone or online booking, so check the clinic's website before you go.","level":"core","romaji":"shinsatsu o onegai shitai no desu ga."},{"id":"drugstore-clinic-02","speaker":"you","jp":"初めてです。","kana":"はじめて です。","meaning":"It is my first time.","replies":[{"jp":"初診ですね。こちらの用紙に記入してください。","kana":"しょしん です ね。 こちら の ようし に きにゅう して ください。","meaning":"A first visit, then. Please fill in this form.","romaji":"shoshin desu ne. kochira no youshi ni kinyuu shite kudasai."}],"note":"初診 means a first consultation. You will be asked to fill in a form.","level":"core","romaji":"hajimete desu."},{"id":"drugstore-clinic-03","speaker":"staff","jp":"保険証はお持ちですか。","kana":"ほけんしょう は おもち です か。","meaning":"Do you have your health insurance card?","replies":[{"jp":"日本の保険証はありません。海外旅行保険に入っています。","kana":"にほん の ほけんしょう は ありません。 かいがい りょこう ほけん に はいって います。","meaning":"I have no Japanese insurance card. I have overseas travel insurance.","romaji":"nihon no hokenshou wa arimasen. kaigai ryokou hoken ni haitte imasu."}],"note":"Travellers do not have a Japanese 保険証. You may also hear マイナ保険証, so if you have neither, say so.","level":"core","romaji":"hokenshou wa omochi desu ka."},{"id":"drugstore-clinic-04","speaker":"staff","jp":"自費診療になりますが、よろしいですか。","kana":"じひ しんりょう に なります が、 よろしい です か。","meaning":"This will be self-pay treatment. Is that all right?","replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that is fine.","romaji":"hai, daijoubu desu."},{"jp":"費用はいくらぐらいですか。","kana":"ひよう は いくら ぐらい です か。","meaning":"Roughly how much will it cost?","romaji":"hiyou wa ikura gurai desu ka."}],"note":"自費 means you pay the full cost yourself. Ask roughly how much before treatment starts.","level":"useful","romaji":"jihi shinryou ni narimasu ga, yoroshii desu ka."},{"id":"drugstore-clinic-05","speaker":"you","jp":"保険会社に請求したいので、領収書と診療明細書をお願いします。","kana":"ほけんがいしゃ に せいきゅう したい ので、 りょうしゅうしょ と しんりょうめいさいしょ を おねがい します。","meaning":"I want to claim from my insurer, so please give me the receipt and the itemised statement.","replies":[{"jp":"診断書は別料金です。","kana":"しんだんしょ は べつりょうきん です。","meaning":"A medical certificate costs extra.","romaji":"shindansho wa betsuryoukin desu."}],"note":"Ask for the receipt (領収書) and the itemised statement (診療明細書) to claim from your insurer. Check your policy's rules before you travel.","level":"core","romaji":"hokengaisha ni seikyuu shitai node, ryoushuusho to shinryoumeisaisho o onegai shimasu."},{"id":"drugstore-clinic-06","speaker":"staff","jp":"こちらの問診票に記入してください。","kana":"こちら の もんしんひょう に きにゅう して ください。","meaning":"Please fill in this questionnaire.","replies":[{"jp":"英語のはありますか。","kana":"えいご の は あります か。","meaning":"Is there an English one?","romaji":"eigo no wa arimasu ka."},{"jp":"書けない部分は手伝ってもらえますか。","kana":"かけない ぶぶん は てつだって もらえます か。","meaning":"Can you help me with the parts I cannot write?","romaji":"kakenai bubun wa tetsudatte moraemasu ka."}],"note":"The 問診票 asks about your name, age, symptoms, allergies and medicines. Prepare these in Japanese before you go.","level":"core","romaji":"kochira no monshinhyou ni kinyuu shite kudasai."},{"id":"drugstore-clinic-07","speaker":"staff","jp":"熱を測ってください。","kana":"ねつ を はかって ください。","meaning":"Please take your temperature.","replies":[{"jp":"はい、分かりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"You may be asked to take your temperature before the doctor sees you.","level":"useful","romaji":"netsu o hakatte kudasai."},{"id":"drugstore-clinic-08","speaker":"staff","jp":"名前を呼びますので、お待ちください。","kana":"なまえ を よびます ので、 おまち ください。","meaning":"We will call your name, so please wait.","replies":[{"jp":"はい、分かりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"Staff call patients by name, often with さん. Listen for your surname.","level":"core","romaji":"namae o yobimasu node, omachi kudasai."},{"id":"drugstore-clinic-09","speaker":"staff","jp":"保険証がなければ、先に全額お支払いをお願いします。","kana":"ほけんしょう が なければ、 さき に ぜんがく おしはらい を おねがい します。","meaning":"If you have no insurance card, please pay the full amount first.","replies":[{"jp":"カードは使えますか。","kana":"カード は つかえます か。","meaning":"Can I pay by card?","romaji":"kaado wa tsukaemasu ka."},{"jp":"現金で払います。","kana":"げんきん で はらいます。","meaning":"I will pay in cash.","romaji":"genkin de haraimasu."}],"note":"Check whether cards are accepted before you pay, and carry some cash just in case.","level":"useful","romaji":"hokenshou ga nakereba, saki ni zengaku oshiharai o onegai shimasu."},{"id":"drugstore-clinic-10","speaker":"staff","jp":"処方箋を出しますので、近くの薬局で薬をもらってください。","kana":"しょほうせん を だします ので、 ちかく の やっきょく で くすり を もらって ください。","meaning":"I will issue a prescription, so please get the medicine at a nearby pharmacy.","replies":[{"jp":"薬局はどこですか。","kana":"やっきょく は どこ です か。","meaning":"Where is the pharmacy?","romaji":"yakkyoku wa doko desu ka."},{"jp":"薬局は近いですか。","kana":"やっきょく は ちかい です か。","meaning":"Is the pharmacy nearby?","romaji":"yakkyoku wa chikai desu ka."}],"note":"Keep the 処方箋 (prescription). The pharmacy needs it to give you the medicine.","level":"core","romaji":"shohousen o dashimasu node, chikaku no yakkyoku de kusuri o moratte kudasai."},{"id":"drugstore-clinic-11","speaker":"you","jp":"英語が話せる先生はいますか。","kana":"えいご が はなせる せんせい は います か。","meaning":"Is there a doctor who speaks English?","replies":[{"jp":"英語はあまり話せません。","kana":"えいご は あまり はなせません。","meaning":"I cannot speak much English.","romaji":"eigo wa amari hanasemasen."},{"jp":"予約をしてください。","kana":"よやく を して ください。","meaning":"Please make an appointment.","romaji":"yoyaku o shite kudasai."}],"note":"Larger hospitals in cities are more likely to have English speakers. A translation app can help at smaller clinics.","level":"useful","romaji":"eigo ga hanaseru sensei wa imasu ka."},{"id":"drugstore-clinic-12","speaker":"staff","jp":"今日は午前の受付は終了しました。","kana":"きょう は ごぜん の うけつけ は しゅうりょう しました。","meaning":"Morning reception has ended for today.","replies":[{"jp":"明日は開いていますか。","kana":"あした は あいて います か。","meaning":"Is it open tomorrow?","romaji":"ashita wa aite imasu ka."},{"jp":"午後は何時からですか。","kana":"ごご は なんじ から です か。","meaning":"What time does the afternoon start?","romaji":"gogo wa nanji kara desu ka."}],"note":"Clinics may close between morning and afternoon sessions. Check the hours on the door or the website.","level":"useful","romaji":"kyou wa gozen no uketsuke wa shuuryou shimashita."}]},{"title":"With the doctor (simple)","intro":"Doctor speech varies, so every line here is sample wording, not a fixed phrase. You mostly listen and nod; have a few answers ready.","phrases":[{"id":"drugstore-doctor-01","speaker":"staff","jp":"どうされましたか。","kana":"どう されました か。","meaning":"What seems to be the problem?","replies":[{"jp":"昨日から熱があって、喉が痛いです。","kana":"きのう から ねつ が あって、 のど が いたい です。","meaning":"I have had a fever since yesterday, and my throat hurts.","romaji":"kinou kara netsu ga atte, nodo ga itai desu."}],"note":"Opening question. Answer with the patterns from Situation 2.","level":"core","romaji":"dou saremashita ka."},{"id":"drugstore-doctor-02","speaker":"staff","jp":"口を開けてください。","kana":"くち を あけて ください。","meaning":"Please open your mouth.","also_heard":[{"jp":"「あーん」と言ってください。","kana":"「あーん」 と いって ください。","meaning":"Please say ahh.","romaji":"\"aan\" to itte kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"level":"listen-only","romaji":"kuchi o akete kudasai."},{"id":"drugstore-doctor-03","speaker":"staff","jp":"息を吸って、吐いてください。","kana":"いき を すって、 はいて ください。","meaning":"Breathe in, and breathe out.","replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Often done with a stethoscope (聴診器). 深呼吸 means a deep breath.","level":"listen-only","romaji":"iki o sutte, haite kudasai."},{"id":"drugstore-doctor-04","speaker":"staff","jp":"ここは痛いですか。","kana":"ここ は いたい です か。","meaning":"Does it hurt here?","replies":[{"jp":"はい、痛いです。","kana":"はい、 いたい です。","meaning":"Yes, it hurts.","romaji":"hai, itai desu."},{"jp":"いいえ、痛くないです。","kana":"いいえ、 いたく ない です。","meaning":"No, it does not hurt.","romaji":"iie, itaku nai desu."}],"note":"Point to the spot and say ここ (here).","level":"core","romaji":"koko wa itai desu ka."},{"id":"drugstore-doctor-05","speaker":"staff","jp":"いつからですか。","kana":"いつ から です か。","meaning":"Since when?","replies":[{"jp":"二日前からです。","kana":"ふつか まえ から です。","meaning":"Since two days ago.","romaji":"futsuka mae kara desu."}],"note":"Same question as the pharmacist asks in Situation 3.","level":"core","romaji":"itsu kara desu ka."},{"id":"drugstore-doctor-06","speaker":"staff","jp":"薬のアレルギーはありますか。","kana":"くすり の アレルギー は あります か。","meaning":"Do you have any drug allergies?","replies":[{"jp":"ありません。","kana":"ありません。","meaning":"No, I do not.","romaji":"arimasen."},{"jp":"はい、薬でアレルギーが出たことがあります。","kana":"はい、 くすり で アレルギー が でた こと が あります。","meaning":"Yes, I have had an allergic reaction to a medicine.","romaji":"hai, kusuri de arerugii ga deta koto ga arimasu."}],"note":"The most important answer to know. Write down any medicine you react to, in Japanese or English.","level":"core","romaji":"kusuri no arerugii wa arimasu ka."},{"id":"drugstore-doctor-07","speaker":"staff","jp":"インフルエンザの検査をします。","kana":"インフルエンザ の けんさ を します。","meaning":"We will do a flu test.","replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"note":"検査 means a test. The test may use a 綿棒 (cotton swab) in your nose. Flu tests are common in winter.","level":"useful","romaji":"infuruenza no kensa o shimasu."},{"id":"drugstore-doctor-08","speaker":"staff","jp":"風邪ですね。薬を出しておきます。","kana":"かぜ です ね。 くすり を だして おきます。","meaning":"It is a cold. I will prescribe some medicine.","replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."},{"jp":"何日分ですか。","kana":"なんにちぶん です か。","meaning":"How many days' worth is it?","romaji":"nannichibun desu ka."}],"note":"〜日分 means a supply for that many days. Ask how long to take it, and follow the label and the pharmacist.","level":"core","romaji":"kaze desu ne. kusuri o dashite okimasu."},{"id":"drugstore-doctor-09","speaker":"staff","jp":"ゆっくり休んで、水分をたくさんとってください。","kana":"ゆっくり やすんで、 すいぶん を たくさん とって ください。","meaning":"Rest well and drink plenty of fluids.","replies":[{"jp":"はい、分かりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"水分をとる means to drink fluids. Rest and fluids are common advice when you are unwell.","level":"core","romaji":"yukkuri yasunde, suibun o takusan totte kudasai."},{"id":"drugstore-doctor-10","speaker":"staff","jp":"悪くなったら、また来てください。","kana":"わるく なったら、 また きて ください。","meaning":"If it gets worse, please come back.","replies":[{"jp":"はい、そうします。","kana":"はい、 そうします。","meaning":"Yes, I will.","romaji":"hai, soushimasu."},{"jp":"休みの日でも診てもらえますか。","kana":"やすみ の ひ でも みて もらえます か。","meaning":"Can I be seen on a day off?","romaji":"yasumi no hi demo mite moraemasu ka."}],"note":"For closures over New Year, see Situation 8.","level":"core","romaji":"waruku nattara, mata kite kudasai."},{"id":"drugstore-doctor-11","speaker":"you","jp":"旅行中なので、できるだけ早く治りたいです。","kana":"りょこう ちゅう なので、 できるだけ はやく なおりたい です。","meaning":"I am travelling, so I want to get better as soon as possible.","replies":[{"jp":"熱が下がれば大丈夫です。","kana":"ねつ が さがれば だいじょうぶ です。","meaning":"If your fever goes down, you will be fine.","romaji":"netsu ga sagareba daijoubu desu."},{"jp":"今日は安静にしてください。","kana":"きょう は あんせい に して ください。","meaning":"Please rest today.","romaji":"kyou wa ansei ni shite kudasai."}],"note":"Doctors answer differently. Listen for 大丈夫 (fine) or だめ (not fine).","level":"useful","romaji":"ryokou chuu nanode, dekirudake hayaku naoritai desu."},{"id":"drugstore-doctor-12","speaker":"you","jp":"診断書を書いていただけますか。","kana":"しんだんしょ を かいて いただけます か。","meaning":"Could you write a medical certificate for me?","replies":[{"jp":"受付でお願いしてください。","kana":"うけつけ で おねがい して ください。","meaning":"Please ask at reception.","romaji":"uketsuke de onegai shite kudasai."},{"jp":"書けますが、時間がかかります。","kana":"かけます が、 じかん が かかります。","meaning":"I can write it, but it takes time.","romaji":"kakemasu ga, jikan ga kakarimasu."}],"note":"Certificates may cost extra (see Situation 6). Say you need it for your travel insurance.","level":"useful","romaji":"shindansho o kaite itadakemasu ka."}]},{"title":"Urgent help","intro":"In an emergency, say the problem first, then the place. 119 is for ambulance and fire, and 110 is the police number for accidents and crime. Keep it short and clear.","phrases":[{"id":"drugstore-urgent-01","speaker":"you","jp":"助けてください！","kana":"たすけて ください！","meaning":"Please help!","replies":[{"jp":"どうしましたか！","kana":"どう しました か！","meaning":"What happened?","romaji":"dou shimashita ka!"},{"jp":"大丈夫ですか！","kana":"だいじょうぶ です か！","meaning":"Are you all right?","romaji":"daijoubu desu ka!"}],"note":"Say it loudly. People nearby will come.","level":"core","romaji":"tasukete kudasai!"},{"id":"drugstore-urgent-02","speaker":"you","jp":"救急車を呼んでください。","kana":"きゅうきゅうしゃ を よんで ください。","meaning":"Please call an ambulance.","replies":[{"jp":"分かりました、今、呼びます。","kana":"わかりました、 いま、 よびます。","meaning":"Understood, I will call now.","romaji":"wakarimashita, ima, yobimasu."},{"jp":"どこですか。","kana":"どこ です か。","meaning":"Where are you?","romaji":"doko desu ka."}],"note":"救急車 is the word for ambulance. Be ready to give the place next.","level":"core","romaji":"kyuukyuusha o yonde kudasai."},{"id":"drugstore-urgent-03","speaker":"you","jp":"119番に電話してください。","kana":"ひゃくじゅうきゅうばん に でんわ して ください。","meaning":"Please call 119.","replies":[{"jp":"分かりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"119 is the number for ambulance and fire. The operator will ask 火事ですか、救急ですか (fire or emergency?).","level":"core","romaji":"hyakujuukyuuban ni denwa shite kudasai."},{"id":"drugstore-urgent-04","speaker":"you","jp":"救急です。","kana":"きゅうきゅう です。","meaning":"It is an emergency.","replies":[{"jp":"火事ですか、救急ですか。住所はどこですか。","kana":"かじ です か、 きゅうきゅう です か。 じゅうしょ は どこ です か。","meaning":"Is it a fire or an emergency? Where is the address?","romaji":"kaji desu ka, kyuukyuu desu ka. juusho wa doko desu ka."}],"note":"When the operator asks, answer 救急です. Have the hotel or street address on your phone.","level":"core","romaji":"kyuukyuu desu."},{"id":"drugstore-urgent-05","speaker":"you","jp":"妻が倒れました。","kana":"つま が たおれました。","meaning":"My wife has collapsed.","replies":[{"jp":"場所はどこですか。","kana":"ばしょ は どこ です か。","meaning":"Where are you?","romaji":"basho wa doko desu ka."},{"jp":"意識はありますか。","kana":"いしき は あります か。","meaning":"Is she conscious?","romaji":"ishiki wa arimasu ka."}],"note":"倒れる means to collapse or fall down. Give the place as soon as you can.","level":"core","romaji":"tsuma ga taoremashita."},{"id":"drugstore-urgent-06","speaker":"you","jp":"胸が痛いです。","kana":"むね が いたい です。","meaning":"I have chest pain.","replies":[{"jp":"座ってください。救急車を呼びます。","kana":"すわって ください。 きゅうきゅうしゃ を よびます。","meaning":"Please sit down. We will call an ambulance.","romaji":"suwatte kudasai. kyuukyuusha o yobimasu."}],"note":"Treat chest pain as urgent and say it clearly when you call.","level":"core","romaji":"mune ga itai desu."},{"id":"drugstore-urgent-07","speaker":"you","jp":"息が苦しいです。","kana":"いき が くるしい です。","meaning":"It is hard to breathe.","replies":[{"jp":"すぐ救急車を呼びます。","kana":"すぐ きゅうきゅうしゃ を よびます。","meaning":"We will call an ambulance right away.","romaji":"sugu kyuukyuusha o yobimasu."}],"note":"苦しい means painful or hard to bear. Say it plainly and give the place.","level":"core","romaji":"iki ga kurushii desu."},{"id":"drugstore-urgent-08","speaker":"you","jp":"外国人です。日本語があまりできません。","kana":"がいこくじん です。 にほんご が あまり できません。","meaning":"I am a foreigner. I cannot speak much Japanese.","replies":[{"jp":"分かりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."},{"jp":"電話を切らないでください。","kana":"でんわ を きらないで ください。","meaning":"Please do not hang up.","romaji":"denwa o kiranaide kudasai."}],"note":"Say this early in the call so the operator knows to slow down and speak simply.","level":"core","romaji":"gaikokujin desu. nihongo ga amari dekimasen."},{"id":"drugstore-urgent-09","speaker":"you","jp":"英語が話せる医者はいますか。","kana":"えいご が はなせる いしゃ は います か。","meaning":"Is there a doctor who speaks English?","replies":[{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"Please wait a moment.","romaji":"shoushou omachi kudasai."}],"note":"For non-emergencies, the Japan Visitor Hotline (English, Chinese and Korean, 24 hours a day) can help. Look up its number on japan.travel before you go.","level":"useful","romaji":"eigo ga hanaseru isha wa imasu ka."},{"id":"drugstore-urgent-10","speaker":"you","jp":"近くの病院はどこですか。","kana":"ちかく の びょういん は どこ です か。","meaning":"Where is the nearest hospital?","replies":[{"jp":"この道をまっすぐ行って、右です。","kana":"この みち を まっすぐ いって、 みぎ です。","meaning":"Go straight along this road, and it is on the right.","romaji":"kono michi o massugu itte, migi desu."}],"note":"Show the map on your phone and ask them to point to it.","level":"core","romaji":"chikaku no byouin wa doko desu ka."},{"id":"drugstore-urgent-11","speaker":"you","jp":"今日やっている病院はありますか。","kana":"きょう やって いる びょういん は あります か。","meaning":"Is there a clinic open today?","replies":[{"jp":"当番の病院を調べます。","kana":"とうばん の びょういん を しらべます。","meaning":"I will look up the on-duty clinic.","romaji":"touban no byouin o shirabemasu."}],"note":"Holiday clinics (休日診療) and on-duty clinics (当番医) may be open on closed days. Ask for the one nearest you.","level":"core","romaji":"kyou yatte iru byouin wa arimasu ka."},{"id":"drugstore-urgent-12","speaker":"you","jp":"年末年始でも開いていますか。","kana":"ねんまつねんし でも あいて います か。","meaning":"Are any clinics open over the New Year holidays?","replies":[{"jp":"年末年始は休みの病院が多いです。","kana":"ねんまつねんし は やすみ の びょういん が おおい です。","meaning":"Many clinics are closed over New Year.","romaji":"nenmatsunenshi wa yasumi no byouin ga ooi desu."}],"note":"One Tokyo ward lists its holiday clinics as open 29 Dec to 3 Jan. Dates differ by city, so check your city's site and ask for a 休日診療 clinic.","level":"core","romaji":"nenmatsunenshi demo aite imasu ka."}]}],"dialogues":[{"title":"Cold medicine at the counter (sample wording)","lines":[{"speaker":"you","jp":"すみません、風邪薬を探しています。","kana":"すみません、 かぜぐすり を さがして います。","meaning":"Excuse me, I am looking for cold medicine.","romaji":"sumimasen, kazegusuri o sagashite imasu."},{"speaker":"staff","jp":"どんな症状ですか。","kana":"どんな しょうじょう です か。","meaning":"What symptoms do you have?","romaji":"donna shoujou desu ka."},{"speaker":"you","jp":"熱と喉の痛みがあります。昨日からです。","kana":"ねつ と のど の いたみ が あります。 きのう から です。","meaning":"I have a fever and a sore throat. Since yesterday.","romaji":"netsu to nodo no itami ga arimasu. kinou kara desu."},{"speaker":"staff","jp":"アレルギーはありますか。ほかのお薬は飲んでいますか。","kana":"アレルギー は あります か。 ほか の おくすり は のんで います か。","meaning":"Any allergies? Are you taking other medicine?","romaji":"arerugii wa arimasu ka. hoka no okusuri wa nonde imasu ka."},{"speaker":"you","jp":"いいえ、ありません。大人です。","kana":"いいえ、 ありません。 おとな です。","meaning":"No, none. It is for an adult.","romaji":"iie, arimasen. otona desu."},{"speaker":"staff","jp":"こちらはいかがですか。一日三回、食後に飲んでください。一回二錠です。","kana":"こちら は いかが です か。 いちにち さんかい、 しょくご に のんで ください。 いっかい にじょう です。","meaning":"How about this one? Take it three times a day after meals, two tablets each time. Follow the label and the pharmacist.","romaji":"kochira wa ikaga desu ka. ichinichi sankai, shokugo ni nonde kudasai. ikkai nijou desu."},{"speaker":"you","jp":"眠くなりますか。","kana":"ねむく なります か。","meaning":"Will it make me sleepy?","romaji":"nemuku narimasu ka."},{"speaker":"staff","jp":"はい、眠くなることがあります。車の運転はしないでください。","kana":"はい、 ねむく なる こと が あります。 くるま の うんてん は しないで ください。","meaning":"Yes, it may. Please do not drive.","romaji":"hai, nemuku naru koto ga arimasu. kuruma no unten wa shinaide kudasai."},{"speaker":"you","jp":"分かりました。これにします。","kana":"わかりました。 これ に します。","meaning":"Understood. I will take this one.","romaji":"wakarimashita. kore ni shimasu."}]},{"title":"Plasters and heat packs","lines":[{"speaker":"you","jp":"すみません、絆創膏はどこですか。","kana":"すみません、 ばんそうこう は どこ です か。","meaning":"Excuse me, where are the plasters?","romaji":"sumimasen, bansoukou wa doko desu ka."},{"speaker":"staff","jp":"こちらです。","kana":"こちら です。","meaning":"Over here.","romaji":"kochira desu."},{"speaker":"you","jp":"靴擦れがあるので、大きいのが欲しいです。","kana":"くつずれ が あるので、 おおきい の が ほしい です。","meaning":"I have a shoe sore, so I want a big one.","romaji":"kutsuzure ga arunode, ookii no ga hoshii desu."},{"speaker":"staff","jp":"こちらはいかがですか。水に強いタイプもあります。","kana":"こちら は いかが です か。 みず に つよい タイプ も あります。","meaning":"How about this one? There is also a water-resistant type.","romaji":"kochira wa ikaga desu ka. mizu ni tsuyoi taipu mo arimasu."},{"speaker":"you","jp":"これにします。あと、貼るカイロはありますか。","kana":"これ に します。 あと、 はる カイロ は あります か。","meaning":"I will take this. Also, do you have stick-on heat packs?","romaji":"kore ni shimasu. ato, haru kairo wa arimasu ka."},{"speaker":"staff","jp":"はい、あちらの冬のコーナーです。貼るタイプと貼らないタイプがあります。","kana":"はい、 あちら の ふゆ の コーナー です。 はる タイプ と はらない タイプ が あります。","meaning":"Yes, the winter corner is over there. There are stick-on and non-stick types.","romaji":"hai, achira no fuyu no koonaa desu. haru taipu to haranai taipu ga arimasu."},{"speaker":"you","jp":"貼るのを十個入りでお願いします。","kana":"はる の を じっこいり で おねがい します。","meaning":"The stick-on kind, a pack of ten, please.","romaji":"haru no o jikkoiri de onegai shimasu."},{"speaker":"staff","jp":"肌には直接貼らないでください。","kana":"はだ に は ちょくせつ はらないで ください。","meaning":"Please do not stick them directly on your skin.","romaji":"hada ni wa chokusetsu haranaide kudasai."},{"speaker":"you","jp":"はい、分かりました。ありがとうございます。","kana":"はい、 わかりました。 ありがとうございます。","meaning":"Yes, understood. Thank you very much.","romaji":"hai, wakarimashita. arigatougozaimasu."}]},{"title":"First visit at a clinic (sample wording)","lines":[{"speaker":"you","jp":"すみません、診てもらいたいのですが。熱があります。","kana":"すみません、 みて もらいたい の です が。 ねつ が あります。","meaning":"Excuse me, I would like to see a doctor. I have a fever.","romaji":"sumimasen, mite moraitai no desu ga. netsu ga arimasu."},{"speaker":"staff","jp":"初めてですか。","kana":"はじめて です か。","meaning":"Is it your first time?","romaji":"hajimete desu ka."},{"speaker":"you","jp":"はい、初めてです。","kana":"はい、 はじめて です。","meaning":"Yes, my first time.","romaji":"hai, hajimete desu."},{"speaker":"staff","jp":"保険証はお持ちですか。","kana":"ほけんしょう は おもち です か。","meaning":"Do you have your insurance card?","romaji":"hokenshou wa omochi desu ka."},{"speaker":"you","jp":"日本の保険証はありません。海外旅行保険に入っています。","kana":"にほん の ほけんしょう は ありません。 かいがい りょこう ほけん に はいって います。","meaning":"I have no Japanese card. I have overseas travel insurance.","romaji":"nihon no hokenshou wa arimasen. kaigai ryokou hoken ni haitte imasu."},{"speaker":"staff","jp":"自費診療になります。全額お支払いください。この問診票に記入してください。","kana":"じひ しんりょう に なります。 ぜんがく おしはらい ください。 この もんしんひょう に きにゅう して ください。","meaning":"It will be self-pay. Please pay in full. Please fill in this form.","romaji":"jihi shinryou ni narimasu. zengaku oshiharai kudasai. kono monshinhyou ni kinyuu shite kudasai."},{"speaker":"you","jp":"領収書と診療明細書もお願いします。","kana":"りょうしゅうしょ と しんりょうめいさいしょ も おねがい します。","meaning":"Please also give me the receipt and the itemised statement.","romaji":"ryoushuusho to shinryoumeisaisho mo onegai shimasu."},{"speaker":"staff","jp":"はい。熱を測ってください。名前を呼びますので、お待ちください。","kana":"はい。 ねつ を はかって ください。 なまえ を よびます ので、 おまち ください。","meaning":"Yes. Please take your temperature. We will call your name, so please wait.","romaji":"hai. netsu o hakatte kudasai. namae o yobimasu node, omachi kudasai."},{"speaker":"you","jp":"はい、分かりました。ありがとうございます。","kana":"はい、 わかりました。 ありがとうございます。","meaning":"Yes, understood. Thank you.","romaji":"hai, wakarimashita. arigatougozaimasu."}]}],"signs":[{"jp":"薬局","kana":"やっきょく","meaning":"Pharmacy","where":"Front of a pharmacy, or the counter area inside a drugstore","romaji":"yakkyoku"},{"jp":"ドラッグストア","kana":"ドラッグストア","meaning":"Drugstore","where":"Shop front","romaji":"doraggusutoa"},{"jp":"処方箋","kana":"しょほうせん","meaning":"Prescription","where":"The paper you get from a clinic; you hand it to the pharmacy","romaji":"shohousen"},{"jp":"処方箋受付","kana":"しょほうせんうけつけ","meaning":"Prescriptions accepted","where":"Sign above the pharmacy's prescription window","romaji":"shohousen'uketsuke"},{"jp":"第1類医薬品","kana":"だいいちるい いやくひん","meaning":"Category 1 OTC medicine, pharmacist only","where":"Shelf label and on the box; sold only after a pharmacist explains it","romaji":"daiichirui iyakuhin"},{"jp":"第2類医薬品","kana":"だいにるい いやくひん","meaning":"Category 2 OTC medicine","where":"Shelf label and on the box","romaji":"dainirui iyakuhin"},{"jp":"指定第2類医薬品","kana":"していだいにるい いやくひん","meaning": ning":"Adult","where":"Dosage table on the box","romaji":"otona"},{"jp":"小児","kana":"しょうに","meaning":"Children","where":"Dosage table on the box","romaji":"shouni"},{"jp":"15歳以上","kana":"じゅうごさい いじょう","meaning":"15 years old and over","where":"Dosage table on the box","romaji":"juugosai ijou"},{"jp":"錠","kana":"じょう","meaning":"Tablet (counter)","where":"Dosage table, after the number","romaji":"jou"},{"jp":"包","kana":"ほう","meaning":"Sachet (counter)","where":"Dosage table, after the number","romaji":"hou"},{"jp":"眠くなる成分","kana":"ねむくなる せいぶん","meaning":"Ingredient that causes drowsiness","where":"Warning section of the box","romaji":"nemukunaru seibun"},{"jp":"服用しないでください","kana":"ふくようしないでください","meaning":"Please do not take it","where":"Warning section of the box","romaji":"fukuyoushinaidekudasai"},{"jp":"使用期限","kana":"しようきげん","meaning":"Expiry date","where":"Printed on the box or pack","romaji":"shiyoukigen"},{"jp":"受付","kana":"うけつけ","meaning":"Reception","where":"Clinic or hospital entrance","romaji":"uketsuke"},{"jp":"内科","kana":"ないか","meaning":"Internal medicine","where":"Clinic sign at the entrance","romaji":"naika"},{"jp":"外科","kana":"げか","meaning":"Surgery","where":"Clinic or hospital sign","romaji":"geka"},{"jp":"歯科","kana":"しか","meaning":"Dentistry","where":"Clinic sign","romaji":"shika"},{"jp":"救急","kana":"きゅうきゅう","meaning":"Emergency","where":"Hospital entrance or emergency sign","romaji":"kyuukyuu"},{"jp":"休診","kana":"きゅうしん","meaning":"Clinic closed","where":"Sign on the clinic door, often with 休診日 (closed day)","romaji":"kyuushin"},{"jp":"診察時間","kana":"しんさつじかん","meaning":"Consultation hours","where":"Sign by the clinic door","romaji":"shinsatsujikan"}],"vocab":[{"title":"Pharmacy words","items":[{"jp":"薬","kana":"くすり","meaning":"medicine","romaji":"kusuri"},{"jp":"薬局","kana":"やっきょく","meaning":"pharmacy","romaji":"yakkyoku"},{"jp":"薬剤師","kana":"やくざいし","meaning":"pharmacist","romaji":"yakuzaishi"},{"jp":"登録販売者","kana":"とうろくはんばいしゃ","meaning":"registered seller (sells 第2類 and 第3類)","romaji":"tourokuhanbaisha"},{"jp":"処方箋","kana":"しょほうせん","meaning":"prescription","romaji":"shohousen"},{"jp":"用法","kana":"ようほう","meaning":"how to take it","romaji":"youhou"},{"jp":"用量","kana":"ようりょう","meaning":"dose","romaji":"youryou"},{"jp":"服用","kana":"ふくよう","meaning":"taking medicine","romaji":"fukuyou"},{"jp":"使用期限","kana":"しようきげん","meaning":"expiry date","romaji":"shiyoukigen"},{"jp":"副作用","kana":"ふくさよう","meaning":"side effect","romaji":"fukusayou"},{"jp":"アレルギー","kana":"アレルギー","meaning":"allergy","romaji":"arerugii"}]},{"title":"Body parts","items":[{"jp":"頭","kana":"あたま","meaning":"head","romaji":"atama"},{"jp":"顔","kana":"かお","meaning":"face","romaji":"kao"},{"jp":"目","kana":"め","meaning":"eye","romaji":"me"},{"jp":"鼻","kana":"はな","meaning":"nose","romaji":"hana"},{"jp":"口","kana":"くち","meaning":"mouth","romaji":"kuchi"},{"jp":"歯","kana":"は","meaning":"tooth","romaji":"wa"},{"jp":"喉","kana":"のど","meaning":"throat","romaji":"nodo"},{"jp":"首","kana":"くび","meaning":"neck","romaji":"kubi"},{"jp":"肩","kana":"かた","meaning":"shoulder","romaji":"kata"},{"jp":"胸","kana":"むね","meaning":"chest","romaji":"mune"},{"jp":"背中","kana":"せなか","meaning":"back","romaji":"senaka"},{"jp":"腰","kana":"こし","meaning":"lower back","romaji":"koshi"},{"jp":"お腹","kana":"おなか","meaning":"stomach or belly","romaji":"onaka"},{"jp":"胃","kana":"い","meaning":"stomach (organ)","romaji":"i"},{"jp":"腕","kana":"うで","meaning":"arm","romaji":"ude"},{"jp":"手","kana":"て","meaning":"hand","romaji":"te"},{"jp":"指","kana":"ゆび","meaning":"finger","romaji":"yubi"},{"jp":"足","kana":"あし","meaning":"leg or foot","romaji":"ashi"},{"jp":"膝","kana":"ひざ","meaning":"knee","romaji":"hiza"},{"jp":"皮膚","kana":"ひふ","meaning":"skin","romaji":"hifu"}]},{"title":"Symptoms","items":[{"jp":"熱","kana":"ねつ","meaning":"fever","romaji":"netsu"},{"jp":"寒気","kana":"さむけ","meaning":"chills","romaji":"samuke"},{"jp":"咳","kana":"せき","meaning":"cough","romaji":"seki"},{"jp":"鼻水","kana":"はなみず","meaning":"runny no
