se","romaji":"hanamizu"},{"jp":"鼻づまり","kana":"はなづまり","meaning":"blocked nose","romaji":"hanazumari"},{"jp":"くしゃみ","kana":"くしゃみ","meaning":"sneeze","romaji":"kushami"},{"jp":"痰","kana":"たん","meaning":"phlegm","romaji":"tan"},{"jp":"頭痛","kana":"ずつう","meaning":"headache","romaji":"zutsuu"},{"jp":"腹痛","kana":"ふくつう","meaning":"stomachache","romaji":"fukutsuu"},{"jp":"下痢","kana":"げり","meaning":"diarrhoea","romaji":"geri"},{"jp":"便秘","kana":"べんぴ","meaning":"constipation","romaji":"benpi"},{"jp":"吐き気","kana":"はきけ","meaning":"nausea","romaji":"hakike"},{"jp":"嘔吐","kana":"おうと","meaning":"vomiting","romaji":"outo"},{"jp":"めまい","kana":"めまい","meaning":"dizziness","romaji":"memai"},{"jp":"だるい","kana":"だるい","meaning":"sluggish, feeling heavy","romaji":"darui"},{"jp":"かゆい","kana":"かゆい","meaning":"itchy","romaji":"kayui"},{"jp":"腫れ","kana":"はれ","meaning":"swelling","romaji":"hare"},{"jp":"発疹","kana":"ほっしん","meaning":"rash","romaji":"hosshin"},{"jp":"靴擦れ","kana":"くつずれ","meaning":"shoe sore","romaji":"kutsuzure"},{"jp":"まめ","kana":"まめ","meaning":"blister","romaji":"mame"},{"jp":"火傷","kana":"やけど","meaning":"burn","romaji":"yakedo"},{"jp":"切り傷","kana":"きりきず","meaning":"cut","romaji":"kirikizu"},{"jp":"筋肉痛","kana":"きんにくつう","meaning":"muscle ache","romaji":"kinnikutsuu"},{"jp":"肩こり","kana":"かたこり","meaning":"stiff shoulders","romaji":"katakori"}]},{"title":"Medicine forms","items":[{"jp":"錠剤","kana":"じょうざい","meaning":"tablets","romaji":"jouzai"},{"jp":"粉薬","kana":"こなぐすり","meaning":"powder medicine","romaji":"konagusuri"},{"jp":"顆粒","kana":"かりゅう","meaning":"granules","romaji":"karyuu"},{"jp":"カプセル","kana":"カプセル","meaning":"capsule","romaji":"kapuseru"},{"jp":"シロップ","kana":"シロップ","meaning":"syrup","romaji":"shiroppu"},{"jp":"液体","kana":"えきたい","meaning":"liquid","romaji":"ekitai"},{"jp":"ドリンク","kana":"ドリンク","meaning":"drink form","romaji":"dorinku"},{"jp":"塗り薬","kana":"ぬりぐすり","meaning":"cream or ointment","romaji":"nurigusuri"},{"jp":"貼り薬","kana":"はりぐすり","meaning":"patch","romaji":"harigusuri"},{"jp":"点眼薬","kana":"てんがんやく","meaning":"eye drops (formal)","romaji":"tengan'yaku"},{"jp":"スプレー","kana":"スプレー","meaning":"spray","romaji":"supuree"},{"jp":"坐薬","kana":"ざやく","meaning":"suppository","romaji":"zayaku"},{"jp":"トローチ","kana":"トローチ","meaning":"medicated lozenge","romaji":"toroochi"}]},{"title":"Care items","items":[{"jp":"マスク","kana":"マスク","meaning":"mask","romaji":"masuku"},{"jp":"カイロ","kana":"カイロ","meaning":"disposable heat pack","romaji":"kairo"},{"jp":"リップクリーム","kana":"リップクリーム","meaning":"lip balm","romaji":"rippukuriimu"},{"jp":"ハンドクリーム","kana":"ハンドクリーム","meaning":"hand cream","romaji":"handokuriimu"},{"jp":"保湿クリーム","kana":"ほしつ クリーム","meaning":"moisturiser","romaji":"hoshitsu kuriimu"},{"jp":"日焼け止め","kana":"ひやけどめ","meaning":"sunscreen","romaji":"hiyakedome"},{"jp":"湿布","kana":"しっぷ","meaning":"medicated patch","romaji":"shippu"},{"jp":"体温計","kana":"たいおんけい","meaning":"thermometer","romaji":"taionkei"},{"jp":"冷却シート","kana":"れいきゃくシート","meaning":"cooling sheet","romaji":"reikyakushiito"},{"jp":"コンタクト洗浄液","kana":"コンタクト せんじょうえき","meaning":"contact lens solution","romaji":"kontakuto senjoueki"},{"jp":"剃刀","kana":"かみそり","meaning":"razor","romaji":"kamisori"},{"jp":"歯ブラシ","kana":"はぶらし","meaning":"toothbrush","romaji":"haburashi"},{"jp":"歯磨き粉","kana":"はみがきこ","meaning":"toothpaste","romaji":"hamigakiko"},{"jp":"生理用品","kana":"せいりようひん","meaning":"sanitary products","romaji":"seiriyouhin"},{"jp":"虫刺され薬","kana":"むしさされぐすり","meaning":"bite cream","romaji":"mushisasaregusuri"},{"jp":"栄養ドリンク","kana":"えいようドリンク","meaning":"nutrition drink","romaji":"eiyoudorinku"},{"jp":"経口補水液","kana":"けいこうほすいえき","meaning":"oral rehydration drink","romaji":"keikouhosuieki"},{"jp":"スポーツドリンク","kana":"スポーツドリンク","meaning":"sports drink","romaji":"supootsudorinku"},{"jp":"ティッシュ","kana":"ティッシュ","meaning":"tissues","romaji":"tisshu"},{"jp":"消毒液","kana":"しょうどくえき","meaning":"disinfectant","romaji":"shoudokueki"},{"jp":"うがい薬","kana":"うがいぐすり","meaning":"gargle","romaji":"ugaigusuri"}]},{"title":"Clinic words","items":[{"jp":"受付","kana":"うけつけ","meaning":"reception","romaji":"uketsuke"},{"jp":"診察","kana":"しんさつ","meaning":"consultation","romaji":"shinsatsu"},{"jp":"初診","kana":"しょしん","meaning":"first visit","romaji":"shoshin"},{"jp":"再診","kana":"さいしん","meaning":"return visit","romaji":"saishin"},{"jp":"問診票","kana":"もんしんひょう","meaning":"questionnaire form","romaji":"monshinhyou"},{"jp":"保険証","kana":"ほけんしょう","meaning":"insurance card","romaji":"hokenshou"},{"jp":"自費","kana":"じひ","meaning":"self-pay","romaji":"jihi"},{"jp":"領収書","kana":"りょうしゅうしょ","meaning":"receipt","romaji":"ryoushuusho"},{"jp":"診療明細書","kana":"しんりょうめいさいしょ","meaning":"itemised statement","romaji":"shinryoumeisaisho"},{"jp":"診断書","kana":"しんだんしょ","meaning":"medical certificate","romaji":"shindansho"},{"jp":"待合室","kana":"まちあいしつ","meaning":"waiting room","romaji":"machiaishitsu"},{"jp":"検査","kana":"けんさ","meaning":"test","romaji":"kensa"},{"jp":"点滴","kana":"てんてき","meaning":"drip (IV)","romaji":"tenteki"},{"jp":"注射","kana":"ちゅうしゃ","meaning":"injection","romaji":"chuusha"},{"jp":"会計","kana":"かいけい","meaning":"payment desk","romaji":"kaikei"},{"jp":"休日診療所","kana":"きゅうじつしんりょうじょ","meaning":"holiday clinic","romaji":"kyuujitsushinryoujo"},{"jp":"当番医","kana":"とうばんい","meaning":"on-duty doctor","romaji":"touban'i"}]}],"_num":"09"},{"slug":"smalltalk","title":"Small talk and New Year","title_jp":"会話","summary":"Small talk questions, compliments, year-end and New Year","situations":[{"title":"Where are you from? (standard questions)","intro":"The first questions almost every taxi driver, shop owner or neighbor at the counter will ask. Know them by ear and have one-line answers ready.","phrases":[{"id":"smalltalk-from-01","speaker":"staff","jp":"どちらからいらっしゃいましたか。","kana":"どちら から いらっしゃいました か。","meaning":"Where have you come from?","also_heard":[{"jp":"どちらからですか。","kana":"どちら から です か。","meaning":"Where are you from?","romaji":"dochira kara desu ka."},{"jp":"お国はどちらですか。","kana":"おくに は どちら です か。","meaning":"Which country are you from?","romaji":"okuni wa dochira desu ka."},{"jp":"出身はどこですか。","kana":"しゅっしん は どこ です か。","meaning":"Where are you originally from?","romaji":"shusshin wa doko desu ka."}],"replies":[{"jp":"エルサルバドルから来ました。","kana":"エルサルバドル から きました。","meaning":"I came from El Salvador.","romaji":"erusarubadoru kara kimashita."},{"jp":"エルサルバドルです。","kana":"エルサルバドル です。","meaning":"El Salvador.","romaji":"erusarubadoru desu."}],"note":"どちら is the polite word for where. お国 asks about your country and 出身 asks about your origin. A country name alone is a complete answer.","level":"core","romaji":"dochira kara irasshaimashita ka."},{"id":"smalltalk-from-02","speaker":"you","jp":"エルサルバドルから来ました。","kana":"エルサルバドル から きました。","meaning":"I came from El Salvador.","replies":[{"jp":"へえ、遠いですね。","kana":"へえ、 とおい です ね。","meaning":"Oh, that is far.","romaji":"hee, tooi desu ne."},{"jp":"エルサルバドル？ どこですか。","kana":"エルサルバドル？ どこ です か。","meaning":"El Salvador? Where is that?","romaji":"erusarubadoru? doko desu ka."}],"note":"Many people in Japan do not know El Salvador well. Be ready for the next phrase.","level":"core","romaji":"erusarubadoru kara kimashita."},{"id":"smalltalk-from-03","speaker":"you","jp":"中米の国です。","kana":"ちゅうべい の くに です。","meaning":"It is a country in Central America.","note":"中米 (ちゅうべい) is the short form of 中央アメリカ, Central America. Give this after the country name.","level":"core","romaji":"chuubei no kuni desu."},{"id":"smalltalk-from-04","speaker":"you","jp":"グアテマラとホンジュラスの間にあります。","kana":"グアテマラ と ホンジュラス の あいだ に あります。","meaning":"It is between Guatemala and Honduras.","note":"A useful location line for listeners who have never heard of the country. 間 (あいだ) means between.","level":"useful","romaji":"guatemara to honjurasu no aida ni arimasu."},{"id":"smalltalk-from-05","speaker":"staff","jp":"日本は初めてですか。","kana":"にほん は はじめて です か。","meaning":"Is this your first time in Japan?","also_heard":[{"jp":"何回目ですか。","kana":"なんかいめ です か。","meaning":"How many times have you been?","romaji":"nankaime desu ka."},{"jp":"日本は初めて？","kana":"にほん は はじめて？","meaning":"First time in Japan? (casual)","romaji":"nihon wa hajimete?"}],"replies":[{"jp":"いいえ、前に一度来ました。","kana":"いいえ、 まえ に いちど きました。","meaning":"No, I came once before.","romaji":"iie, mae ni ichido kimashita."},{"jp":"はい、初めてです。","kana":"はい、 はじめて です。","meaning":"Yes, this is my first time.","romaji":"hai, hajimete desu."}],"note":"If the answer is no, start with いいえ, then say how many times you have been. 初めて means first time.","level":"core","romaji":"nihon wa hajimete desu ka."},{"id":"smalltalk-from-06","speaker":"staff","jp":"どのくらい日本にいますか。","kana":"どのくらい にほん に います か。","meaning":"How long will you be in Japan?","also_heard":[{"jp":"どのくらい滞在しますか。","kana":"どのくらい たいざい します か。","meaning":"How long will you stay?","romaji":"donokurai taizai shimasu ka."},{"jp":"いつまでいるの？","kana":"いつまで いる の？","meaning":"Until when are you staying? (casual)","romaji":"itsumade iru no?"}],"replies":[{"jp":"約四週間です。","kana":"やく よんしゅうかん です。","meaning":"About four weeks.","romaji":"yaku yonshuukan desu."},{"jp":"十二月十七日から一月十二日までです。","kana":"じゅうにがつ じゅうしちにち から いちがつ じゅうににち まで です。","meaning":"From December 17 to January 12.","romaji":"juunigatsu juushichinichi kara ichigatsu juuninichi made desu."}],"note":"約四週間 is the easy answer and matches a trip of about four weeks. Give the exact dates only if someone asks for them.","level":"core","romaji":"donokurai nihon ni imasu ka."},{"id":"smalltalk-from-07","speaker":"staff","jp":"日本のどこに行きましたか。","kana":"にほん の どこ に いきました か。","meaning":"Where in Japan have you been?","also_heard":[{"jp":"どこを回りましたか。","kana":"どこ を まわりました か。","meaning":"Which places did you visit?","romaji":"doko o mawarimashita ka."},{"jp":"日本のどこに行ったの？","kana":"にほん の どこ に いった の？","meaning":"Where in Japan did you go? (casual)","romaji":"nihon no doko ni itta no?"}],"replies":[{"jp":"東京、名古屋、広島、大阪に行く予定です。","kana":"とうきょう、 なごや、 ひろしま、 おおさか に いく よてい です。","meaning":"We plan to go to Tokyo, Nagoya, Hiroshima and Osaka.","romaji":"toukyou, nagoya, hiroshima, oosaka ni iku yotei desu."}],"note":"Use your own route. 予定 (よてい) means plan. Add Kawaguchiko and the Kobe day trip when you name your stops.","level":"core","romaji":"nihon no doko ni ikimashita ka."},{"id":"smalltalk-from-08","speaker":"staff","jp":"このあとはどこに行きますか。","kana":"この あと は どこ に いきます か。","meaning":"Where are you going next?","also_heard":[{"jp":"次はどこに行きますか。","kana":"つぎ は どこ に いきます か。","meaning":"Where will you go next?","romaji":"tsugi wa doko ni ikimasu ka."},{"jp":"明日はどちらへ？","kana":"あした は どちら へ？","meaning":"Where are you going tomorrow? (casual)","romaji":"ashita wa dochira e?"}],"replies":[{"jp":"次は広島に行きます。","kana":"つぎ は ひろしま に いきます。","meaning":"Next, I am going to Hiroshima.","romaji":"tsugi wa hiroshima ni ikimasu."},{"jp":"河口湖に行きます。","kana":"かわぐちこ に いきます。","meaning":"I am going to Kawaguchiko.","romaji":"kawaguchiko ni ikimasu."}],"note":"Use the name of the city you will visit next. 河口湖 (かわぐちこ) is a lake town near Mt Fuji.","level":"useful","romaji":"kono ato wa doko ni ikimasu ka."},{"id":"smalltalk-from-09","speaker":"staff","jp":"日本はどうですか。","kana":"にほん は どう です か。","meaning":"How do you like Japan?","also_heard":[{"jp":"日本の印象はどうですか。","kana":"にほん の いんしょう は どう です か。","meaning":"What is your impression of Japan?","romaji":"nihon no inshou wa dou desu ka."},{"jp":"日本、どう？","kana":"にほん、 どう？","meaning":"How is Japan? (casual)","romaji":"nihon, dou?"}],"replies":[{"jp":"とても好きです。","kana":"とても すき です。","meaning":"I like it very much.","romaji":"totemo suki desu."},{"jp":"食べ物がおいしいし、人が親切です。","kana":"たべもの が おいしい し、 ひと が しんせつ です。","meaning":"The food is delicious, and the people are kind.","romaji":"tabemono ga oishii shi, hito ga shinsetsu desu."}],"note":"し links two reasons, as in the second reply. 親切 (しんせつ) means kind.","level":"core","romaji":"nihon wa dou desu ka."},{"id":"smalltalk-from-10","speaker":"staff","jp":"スペイン語を話すんですか。","kana":"スペイン ごを はなす ん です か。","meaning":"So you speak Spanish?","also_heard":[{"jp":"何語を話しますか。","kana":"なにご を はなします か。","meaning":"What language do you speak?","romaji":"nanigo o hanashimasu ka."}],"replies":[{"jp":"はい、スペイン語です。","kana":"はい、 スペイン ごです。","meaning":"Yes, it is Spanish.","romaji":"hai, supein godesu."},{"jp":"はい、スペイン語を話します。","kana":"はい、 スペイン ごを はなします。","meaning":"Yes, I speak Spanish.","romaji":"hai, supein goo hanashimasu."}],"note":"Many people guess Spanish after hearing Central America. 話します means speak. 話せます means can speak.","level":"useful","romaji":"supein goo hanasu n desu ka."},{"id":"smalltalk-from-11","speaker":"staff","jp":"日本語、話せるんですね。","kana":"にほんご、 はなせる ん です ね。","meaning":"Oh, so you can speak Japanese.","also_heard":[{"jp":"日本語が話せるんですか。","kana":"にほんご が はなせる ん です か。","meaning":"You can speak Japanese?","romaji":"nihongo ga hanaseru n desu ka."},{"jp":"日本語しゃべれるんだ。","kana":"にほんご しゃべれる ん だ。","meaning":"You can speak Japanese, huh? (casual)","romaji":"nihongo shabereru n da."}],"replies":[{"jp":"少しだけ話せます。","kana":"すこし だけ はなせます。","meaning":"I can speak a little.","romaji":"sukoshi dake hanasemasu."},{"jp":"まだ勉強中です。","kana":"まだ べんきょうちゅう です。","meaning":"I am still studying.","romaji":"mada benkyouchuu desu."}],"note":"The んですね pattern shows surprise or interest. Your reply here leads into the compliment talk in the next situation.","level":"useful","romaji":"nihongo, hanaseru n desu ne."}]},{"title":"Compliments and modest replies","intro":"Japanese people often praise a foreigner's Japanese. The expected reply is modesty, not agreement.","phrases":[{"id":"smalltalk-praise-01","speaker":"staff","jp":"日本語、お上手ですね。","kana":"にほんご、 おじょうず です ね。","meaning":"Your Japanese is very good.","also_heard":[{"jp":"日本語がお上手ですね。","kana":"にほんご が おじょうず です ね。","meaning":"Your Japanese is very good.","romaji":"nihongo ga ojouzu desu ne."},{"jp":"日本語、上手ですね。","kana":"にほんご、 じょうず です ね。","meaning":"Your Japanese is good.","romaji":"nihongo, jouzu desu ne."},{"jp":"日本語うまいね。","kana":"にほんご うまい ね。","meaning":"Your Japanese is good. (casual)","romaji":"nihongo umai ne."},{"jp":"日本語ぺらぺらですね。","kana":"にほんご ぺらぺら です ね。","meaning":"You speak Japanese fluently.","romaji":"nihongo perapera desu ne."}],"replies":[{"jp":"いえいえ、まだまだです。","kana":"いえいえ、 まだまだ です。","meaning":"Not at all, I still have a long way to go.","romaji":"ieie, madamada desu."},{"jp":"ありがとうございます。まだ勉強中です。","kana":"ありがとうございます。 まだ べんきょうちゅう です。","meaning":"Thank you. I am still studying.","romaji":"arigatougozaimasu. mada benkyouchuu desu."}],"note":"Trap: answering はい、上手です sounds arrogant. Say いえいえ or thanks first. ぺらぺら means fluent, so give a modest reply.","level":"core","romaji":"nihongo, ojouzu desu ne."},{"id":"smalltalk-praise-02","speaker":"you","jp":"いえいえ、まだまだです。","kana":"いえいえ、 まだまだ です。","meaning":"Not at all, I still have a long way to go.","note":"まだまだ means not yet by far. In standard Japanese 全然 is followed by a negative, so avoid 全然上手です.","level":"core","romaji":"ieie, madamada desu."},{"id":"smalltalk-praise-03","speaker":"you","jp":"趣味で日本語を勉強しています。","kana":"しゅみ で にほんご を べんきょう して います。","meaning":"I study Japanese as a hobby.","replies":[{"jp":"いいですね。","kana":"いい です ね。","meaning":"That is nice.","romaji":"ii desu ne."}],"note":"勉強しています means you study on an ongoing basis. 趣味 (しゅみ) means hobby.","level":"core","romaji":"shumi de nihongo o benkyou shite imasu."},{"id":"smalltalk-praise-04","speaker":"staff","jp":"お箸、上手ですね。","kana":"おはし、 じょうず です ね。","meaning":"You are good with chopsticks.","also_heard":[{"jp":"お箸の使い方が上手ですね。","kana":"おはし の つかいかた が じょうず です ね。","meaning":"You use chopsticks well.","romaji":"ohashi no tsukaikata ga jouzu desu ne."},{"jp":"箸使えるんだね。","kana":"はし つかえる ん だ ね。","meaning":"You can use chopsticks, huh? (casual)","romaji":"hashi tsukaeru n da ne."}],"replies":[{"jp":"ありがとうございます。まだ練習中です。","kana":"ありがとうございます。 まだ れんしゅうちゅう です。","meaning":"Thank you. I am still practicing.","romaji":"arigatougozaimasu. mada renshuuchuu desu."},{"jp":"ありがとうございます。うれしいです。","kana":"ありがとうございます。 うれしい です。","meaning":"Thank you. I am happy.","romaji":"arigatougozaimasu. ureshii desu."}],"note":"A thank-you is enough. Do not take it as a criticism.","level":"useful","romaji":"ohashi, jouzu desu ne."},{"id":"smalltalk-praise-05","speaker":"staff","jp":"どこで日本語を勉強したんですか。","kana":"どこ で にほんご を べんきょう した ん です か。","meaning":"Where did you study Japanese?","also_heard":[{"jp":"独学ですか。","kana":"どくがく です か。","meaning":"Did you teach yourself?","romaji":"dokugaku desu ka."},{"jp":"どこで勉強したの？","kana":"どこ で べんきょう した の？","meaning":"Where did you study? (casual)","romaji":"doko de benkyou shita no?"}],"replies":[{"jp":"自分で勉強しました。","kana":"じぶん で べんきょう しました。","meaning":"I studied by myself.","romaji":"jibun de benkyou shimashita."},{"jp":"アプリで勉強しています。","kana":"アプリ で べんきょう して います。","meaning":"I study with an app.","romaji":"apuri de benkyou shite imasu."}],"note":"独学 (どくがく) means self-taught. アプリ is the katakana word for app.","level":"core","romaji":"doko de nihongo o benkyou shita n desu ka."},{"id":"smalltalk-praise-06","speaker":"staff","jp":"どうして日本語を勉強しているんですか。","kana":"どうして にほんご を べんきょう して いる ん です か。","meaning":"Why are you studying Japanese?","also_heard":[{"jp":"きっかけは何ですか。","kana":"きっかけ は なん です か。","meaning":"What got you started?","romaji":"kikkake wa nan desu ka."},{"jp":"なんで日本語を勉強してるの？","kana":"なんで にほんご を べんきょう してる の？","meaning":"Why are you studying Japanese? (casual)","romaji":"nande nihongo o benkyou shiteru no?"}],"replies":[{"jp":"日本の文化が好きだからです。","kana":"にほん の ぶんか が すき だから です。","meaning":"Because I like Japanese culture.","romaji":"nihon no bunka ga suki dakara desu."},{"jp":"日本の音楽を聞くのが好きです。","kana":"にほん の おんがく を きく の が すき です。","meaning":"I like listening to Japanese music.","romaji":"nihon no ongaku o kiku no ga suki desu."}],"note":"きっかけ means the trigger that got you started. から means because.","level":"core","romaji":"doushite nihongo o benkyou shite iru n desu ka."},{"id":"smalltalk-praise-07","speaker":"staff","jp":"日本語が分かるんですね。","kana":"にほんご が わかる ん です ね。","meaning":"So you understand Japanese.","also_heard":[{"jp":"すごいですね。","kana":"すごい です ね。","meaning":"That is impressive.","romaji":"sugoi desu ne."},{"jp":"すごい！","kana":"すごい！","meaning":"Wow! (casual)","romaji":"sugoi!"}],"replies":[{"jp":"聞くのは少し分かりますが、話すのはまだ難しいです。","kana":"きく の は すこし わかります が、 はなす の は まだ むずかしい です。","meaning":"I understand a little when I listen, but speaking is still hard.","romaji":"kiku no wa sukoshi wakarimasu ga, hanasu no wa mada muzukashii desu."}],"note":"An honest reply: listening is stronger than speaking. The contrast 聞くのは / 話すのは is a useful pattern.","level":"useful","romaji":"nihongo ga wakaru n desu ne."},{"id":"smalltalk-praise-08","speaker":"you","jp":"ゆっくりお願いします。","kana":"ゆっくり おねがい します。","meaning":"Slowly, please.","replies":[{"jp":"はい、ゆっくりいいますね。","kana":"はい、 ゆっくり いいますね。","meaning":"Yes, I will say it slowly.","romaji":"hai, yukkuri iimasune."}],"note":"Works best right after the greeting. Add a smile. For a longer request, say ゆっくり話してくだされば、分かります.","level":"useful","romaji":"yukkuri onegai shimasu."},{"id":"smalltalk-praise-09","speaker":"you","jp":"日本語は難しいですが、楽しいです。","kana":"にほんご は むずかしい です が、 たのしい です。","meaning":"Japanese is difficult, but it is fun.","replies":[{"jp":"日本人にも難しいですよ。","kana":"にほんじん に も むずかしい です よ。","meaning":"Even for Japanese people it is difficult.","romaji":"nihonjin ni mo muzukashii desu yo."}],"note":"が means but. 漢字が難しいです (kanji is hard) and 漢字がまだ苦手です (I am still weak at kanji) are good extras.","level":"useful","romaji":"nihongo wa muzukashii desu ga, tanoshii desu."}]},{"title":"Talking about yourself simply","intro":"Short, ready-made lines for introducing yourself, your wife, your work and your hobbies.","phrases":[{"id":"smalltalk-self-01","speaker":"you","jp":"レイナルドです。","kana":"レイナルド です。","meaning":"I am Reynaldo.","also_heard":[{"jp":"レイナルドと申します。","kana":"レイナルド と もうします。","meaning":"My name is Reynaldo. (polite and humble)","romaji":"reinarudo to moushimasu."},{"jp":"レイナルドといいます。","kana":"レイナルド と いいます。","meaning":"I am called Reynaldo.","romaji":"reinarudo to iimasu."}],"replies":[{"jp":"こちらこそ、よろしくお願いします。","kana":"こちら こそ、 よろしく おねがい します。","meaning":"Likewise, nice to meet you.","romaji":"kochira koso, yoroshiku onegai shimasu."}],"note":"Foreign names are written in katakana. Use your own name in the same pattern. 申します is humble and works well at hotels.","level":"core","romaji":"reinarudo desu."},{"id":"smalltalk-self-02","speaker":"staff","jp":"お仕事は何をしていますか。","kana":"おしごと は なに を して います か。","meaning":"What do you do for work?","also_heard":[{"jp":"お仕事は何ですか。","kana":"おしごと は なん です か。","meaning":"What is your work?","romaji":"oshigoto wa nan desu ka."},{"jp":"仕事は何してるの？","kana":"しごと は なに してる の？","meaning":"What do you do for work? (casual)","romaji":"shigoto wa nani shiteru no?"}],"replies":[{"jp":"ソフトウェアエンジニアです。","kana":"ソフトウェア エンジニア です。","meaning":"I am a software engineer.","romaji":"sofutowea enjinia desu."},{"jp":"IT関係の仕事です。","kana":"アイティー かんけい の しごと です。","meaning":"I work in IT.","romaji":"aitii kankei no shigoto desu."}],"note":"Software engineer is widely understood. ソフトウェア開発者 sounds stiffer. IT関係 (アイティーかんけい) means IT related.","level":"core","romaji":"oshigoto wa nani o shite imasu ka."},{"id":"smalltalk-self-03","speaker":"you","jp":"ソフトウェアエンジニアです。","kana":"ソフトウェア エンジニア です。","meaning":"I am a software engineer.","replies":[{"jp":"へえ、すごいですね。","kana":"へえ、 すごい です ね。","meaning":"Oh, that is impressive.","romaji":"hee, sugoi desu ne."},{"jp":"大変そうですね。","kana":"たいへん そう です ね。","meaning":"That sounds tough.","romaji":"taihen sou desu ne."}],"level":"core","romaji":"sofutowea enjinia desu."},{"id":"smalltalk-self-04","speaker":"you","jp":"銀行のシステムを作っています。","kana":"ぎんこう の システム を つくって います。","meaning":"I build banking systems.","note":"Say this only if you are comfortable sharing your sector. 作っています means you are making or building them now.","level":"useful","romaji":"ginkou no shisutemu o tsukutte imasu."},{"id":"smalltalk-self-05","speaker":"you","jp":"こちらは妻です。","kana":"こちら は つま です。","meaning":"This is my wife.","also_heard":[{"jp":"妻と一緒に来ました。","kana":"つま と いっしょ に きました。","meaning":"I came with my wife.","romaji":"tsuma to issho ni kimashita."}],"replies":[{"jp":"奥さんですね。","kana":"おくさん です ね。","meaning":"Oh, your wife.","romaji":"okusan desu ne."},{"jp":"はじめまして。","kana":"はじめまして。","meaning":"Nice to meet you.","romaji":"hajimemashite."}],"note":"妻 (つま) is the word for your own wife. 奥さん is what others call someone's wife, so do not use it for your own.","level":"core","romaji":"kochira wa tsuma desu."},{"id":"smalltalk-self-06","speaker":"staff","jp":"ご結婚されていますか。","kana":"ごけっこん されて います か。","meaning":"Are you married?","also_heard":[{"jp":"結婚していますか。","kana":"けっこん して います か。","meaning":"Are you married?","romaji":"kekkon shite imasu ka."},{"jp":"結婚してるの？","kana":"けっこん してる の？","meaning":"Are you married? (casual)","romaji":"kekkon shiteru no?"}],"replies":[{"jp":"はい、結婚しています。","kana":"はい、 けっこん して います。","meaning":"Yes, I am married.","romaji":"hai, kekkon shite imasu."},{"jp":"はい、妻と来ました。","kana":"はい、 つま と きました。","meaning":"Yes, I came with my wife.","romaji":"hai, tsuma to kimashita."}],"note":"A routine small-talk question in Japan, not a rude one. A short answer is enough.","level":"useful","romaji":"gokekkon sarete imasu ka."},{"id":"smalltalk-self-07","speaker":"you","jp":"趣味は日本語の勉強です。","kana":"しゅみ は にほんご の べんきょう です。","meaning":"My hobby is studying Japanese.","also_heard":[{"jp":"日本語を勉強するのが好きです。","kana":"にほんご を べんきょう する の が すき です。","meaning":"I like studying Japanese.","romaji":"nihongo o benkyou suru no ga suki desu."}],"replies":[{"jp":"いい趣味ですね。","kana":"いい しゅみ です ね。","meaning":"That is a nice hobby.","romaji":"ii shumi desu ne."}],"note":"趣味 (しゅみ) means hobby. Add your other hobbies to this line when you want to.","level":"core","romaji":"shumi wa nihongo no benkyou desu."},{"id":"smalltalk-self-08","speaker":"you","jp":"日本の食べ物が大好きです。","kana":"にほん の たべもの が だいすき です。","meaning":"I love Japanese food.","also_heard":[{"jp":"日本食が大好きです。","kana":"にほんしょく が だいすき です。","meaning":"I love Japanese food.","romaji":"nihonshoku ga daisuki desu."}],"replies":[{"jp":"何が一番好きですか。","kana":"なに が いちばん すき です か。","meaning":"Which one do you like best?","romaji":"nani ga ichiban suki desu ka."}],"note":"大好き means really like. 日本食 is the general word for Japanese cuisine.","level":"core","romaji":"nihon no tabemono ga daisuki desu."},{"id":"smalltalk-self-09","speaker":"you","jp":"一番好きなのはラーメンです。","kana":"いちばん すき な の は ラーメン です。","meaning":"My favorite is ramen.","also_heard":[{"jp":"寿司が一番好きです。","kana":"すし が いちばん すき です。","meaning":"Sushi is my favorite.","romaji":"sushi ga ichiban suki desu."}],"replies":[{"jp":"いいですね。","kana":"いい です ね。","meaning":"That is nice.","romaji":"ii desu ne."}],"note":"Swap in any dish, for example tempura or okonomiyaki (お好み焼き). Pick the one you really like best.","level":"useful","romaji":"ichiban suki na no wa raamen desu."},{"id":"smalltalk-self-10","speaker":"you","jp":"今回は二回目です。","kana":"こんかい は にかいめ です。","meaning":"This is my second time in Japan.","also_heard":[{"jp":"二回目です。","kana":"にかいめ です。","meaning":"It is my second time.","romaji":"nikaime desu."}],"replies":[{"jp":"そうですか。日本が好きなんですね。","kana":"そう です か。 にほん が すき な ん です ね。","meaning":"I see. You must like Japan.","romaji":"sou desu ka. nihon ga suki na n desu ne."}],"note":"今回 means this time. If asked about the earlier visit, 前に一度来ました (I came once before) is enough.","level":"core","romaji":"konkai wa nikaime desu."},{"id":"smalltalk-self-11","speaker":"you","jp":"妻と二人で来ました。","kana":"つま と ふたり で きました。","meaning":"I came with my wife, just the two of us.","also_heard":[{"jp":"二人で旅行しています。","kana":"ふたり で りょこう して います。","meaning":"We are travelling just the two of us.","romaji":"futari de ryokou shite imasu."}],"replies":[{"jp":"いいですね。ごゆっくり。","kana":"いい です ね。 ごゆっくり。","meaning":"That is nice. Enjoy your time.","romaji":"ii desu ne. goyukkuri."}],"note":"二人 (ふたり) is the count for two people. One person is 一人 (ひとり).","level":"useful","romaji":"tsuma to futari de kimashita."}]},{"title":"Asking them back","intro":"Light questions that keep the chat going and turn you from listener into speaker. Each is a short pattern you can reuse.","phrases":[{"id":"smalltalk-ask-01","speaker":"you","jp":"この辺の方ですか。","kana":"この へん の かた です か。","meaning":"Are you from around here?","also_heard":[{"jp":"地元の方ですか。","kana":"じもと の かた です か。","meaning":"Are you a local?","romaji":"jimoto no kata desu ka."},{"jp":"ずっとここに住んでいますか。","kana":"ずっと ここ に すんで います か。","meaning":"Have you lived here for a long time?","romaji":"zutto koko ni sunde imasu ka."}],"replies":[{"jp":"はい、ずっとここです。","kana":"はい、 ずっと ここ です。","meaning":"Yes, I have always been here.","romaji":"hai, zutto koko desu."},{"jp":"いえ、大阪から来ました。","kana":"いえ、 おおさか から きました。","meaning":"No, I came from Osaka.","romaji":"ie, oosaka kara kimashita."}],"note":"地元 (じもと) means local area or hometown. This is a good way to start a chat with someone who knows the area.","level":"core","romaji":"kono hen no kata desu ka."},{"id":"smalltalk-ask-02","speaker":"you","jp":"このあたりで、おすすめの食べ物はありますか。","kana":"この あたり で、 おすすめ の たべもの は あります か。","meaning":"Is there any food you recommend around here?","also_heard":[{"jp":"おすすめは何ですか。","kana":"おすすめ は なん です か。","meaning":"What do you recommend?","romaji":"osusume wa nan desu ka."},{"jp":"名物は何ですか。","kana":"めいぶつ は なん です か。","meaning":"What is the local speciality?","romaji":"meibutsu wa nan desu ka."}],"replies":[{"jp":"お好み焼きがおすすめです。","kana":"おこのみやき が おすすめ です。","meaning":"I recommend okonomiyaki.","romaji":"okonomiyaki ga osusume desu."},{"jp":"ぜひ食べてください。","kana":"ぜひ たべて ください。","meaning":"Please do try it.","romaji":"zehi tabete kudasai."}],"note":"名物 (めいぶつ) is a local speciality. A good question in any city.","level":"core","romaji":"kono atari de, osusume no tabemono wa arimasu ka."},{"id":"smalltalk-ask-03","speaker":"you","jp":"いつもこんなに寒いですか。","kana":"いつも こんなに さむい です か。","meaning":"Is it always this cold?","also_heard":[{"jp":"毎年こんなに寒いですか。","kana":"まいとし こんなに さむい です か。","meaning":"Is it this cold every year?","romaji":"maitoshi konnani samui desu ka."},{"jp":"今年は特に寒いですか。","kana":"ことし は とくに さむい です か。","meaning":"Is it especially cold this year?","romaji":"kotoshi wa tokuni samui desu ka."}],"replies":[{"jp":"そうですね、今年は特に寒いですね。","kana":"そう です ね、 ことし は とくに さむい です ね。","meaning":"Yes, this year it is especially cold.","romaji":"sou desu ne, kotoshi wa tokuni samui desu ne."},{"jp":"今日はまだ暖かいほうですよ。","kana":"きょう は まだ あたたかい ほう です よ。","meaning":"Today is still on the warm side.","romaji":"kyou wa mada atatakai hou desu yo."}],"note":"Weather is the easiest way to open a chat. 特に (とくに) means especially.","level":"useful","romaji":"itsumo konnani samui desu ka."},{"id":"smalltalk-ask-04","speaker":"you","jp":"海外に行ったことはありますか。","kana":"かいがい に いった こと は あります か。","meaning":"Have you ever been abroad?","also_heard":[{"jp":"外国に行ったことはありますか。","kana":"がいこく に いった こと は あります か。","meaning":"Have you ever been to a foreign country?","romaji":"gaikoku ni itta koto wa arimasu ka."}],"replies":[{"jp":"ハワイに行ったことがあります。","kana":"ハワイ に いった こと が あります。","meaning":"I have been to Hawaii.","romaji":"hawai ni itta koto ga arimasu."},{"jp":"実はまだないんです。","kana":"じつは まだ ない ん です。","meaning":"Actually, not yet.","romaji":"jitsuha mada nai n desu."}],"note":"〜たことがありますか means have you ever. 海外 is the more common spoken word for abroad.","level":"useful","romaji":"kaigai ni itta koto wa arimasu ka."},{"id":"smalltalk-ask-05","speaker":"you","jp":"このお店は、何年ぐらいやっていますか。","kana":"この おみせ は、 なんねん ぐらい やって います か。","meaning":"About how many years has this shop been open?","also_heard":[{"jp":"いつからやっていますか。","kana":"いつ から やって います か。","meaning":"Since when have you been open?","romaji":"itsu kara yatte imasu ka."},{"jp":"古いお店ですか。","kana":"ふるい おみせ です か。","meaning":"Is this an old shop?","romaji":"furui omise desu ka."}],"replies":[{"jp":"三十年になります。","kana":"さんじゅうねん に なります。","meaning":"It has been about thirty years.","romaji":"sanjuunen ni narimasu."},{"jp":"父の代からです。","kana":"ちち の だい から です。","meaning":"It has been since my father's time.","romaji":"chichi no dai kara desu."}],"note":"〜年になります means it has been that many years. 代 (だい) means generation. Good for small shops and izakaya.","level":"useful","romaji":"kono omise wa, nannen gurai yatte imasu ka."},{"id":"smalltalk-ask-06","speaker":"you","jp":"これは日本語で何と言いますか。","kana":"これ は にほんご で なんと いいます か。","meaning":"What is this called in Japanese?","also_heard":[{"jp":"これは何ですか。","kana":"これ は なん です か。","meaning":"What is this?","romaji":"kore wa nan desu ka."},{"jp":"これは何という名前ですか。","kana":"これ は なんという なまえ です か。","meaning":"What is this called?","romaji":"kore wa nantoiu namae desu ka."}],"replies":[{"jp":"提灯と言います。","kana":"ちょうちん と いいます。","meaning":"It is called chochin, a paper lantern.","romaji":"chouchin to iimasu."}],"note":"A very useful question for learners. 〜と言います means it is called.","level":"core","romaji":"kore wa nihongo de nanto iimasu ka."},{"id":"smalltalk-ask-07","speaker":"you","jp":"これは何と読みますか。","kana":"これ は なんと よみます か。","meaning":"How do you read this?","also_heard":[{"jp":"この漢字はどう読みますか。","kana":"この かんじ は どう よみます か。","meaning":"How do you read this kanji?","romaji":"kono kanji wa dou yomimasu ka."}],"replies":[{"jp":"今日と読みます。","kana":"きょう と よみます。","meaning":"It is read as kyou (きょう).","romaji":"kyou to yomimasu."}],"note":"Pair this with the question above. 読み is the reading, and 名前 (なまえ) is the name.","level":"useful","romaji":"kore wa nanto yomimasu ka."},{"id":"smalltalk-ask-08","speaker":"you","jp":"広島に行ったことはありますか。","kana":"ひろしま に いった こと は あります か。","meaning":"Have you ever been to Hiroshima?","also_heard":[{"jp":"河口湖に行ったことはありますか。","kana":"かわぐちこ に いった こと は あります か。","meaning":"Have you ever been to Kawaguchiko?","romaji":"kawaguchiko ni itta koto wa arimasu ka."}],"replies":[{"jp":"はい、あります。","kana":"はい、 あります。","meaning":"Yes, I have.","romaji":"hai, arimasu."},{"jp":"いいえ、ないです。","kana":"いいえ、 ない です。","meaning":"No, I have not.","romaji":"iie, nai desu."}],"note":"Use the name of a city on your own route, such as Hiroshima or Kawaguchiko.","level":"useful","romaji":"hiroshima ni itta koto wa arimasu ka."},{"id":"smalltalk-ask-09","speaker":"you","jp":"ずっとこのお仕事をしていますか。","kana":"ずっと この おしごと を して います か。","meaning":"Have you been doing this work for a long time?","also_heard":[{"jp":"どのくらいこのお仕事をしていますか。","kana":"どのくらい この おしごと を して います か。","meaning":"How long have you been doing this work?","romaji":"donokurai kono oshigoto o shite imasu ka."}],"replies":[{"jp":"もう二十年ですよ。","kana":"もう にじゅうねん です よ。","meaning":"Already twenty years.","romaji":"mou nijuunen desu yo."}],"note":"Good for taxi drivers and craftspeople. Showing interest invites a longer answer. Do not ask about salary or age.","level":"useful","romaji":"zutto kono oshigoto o shite imasu ka."},{"id":"smalltalk-ask-10","speaker":"you","jp":"日本人はクリスマスに何をしますか。","kana":"にほんじん は クリスマス に なに を します か。","meaning":"What do Japanese people do at Christmas?","also_heard":[{"jp":"日本のクリスマスはどうですか。","kana":"にほん の クリスマス は どう です か。","meaning":"How is Christmas in Japan?","romaji":"nihon no kurisumasu wa dou desu ka."}],"replies":[{"jp":"ケーキを食べたり、チキンを食べたりします。","kana":"ケーキ を たべたり、 チキン を たべたり します。","meaning":"People eat cake, and they eat chicken too.","romaji":"keeki o tabetari, chikin o tabetari shimasu."}],"note":"Leads into the Christmas talk below. 〜たり〜たりします means things like X and Y.","level":"useful","romaji":"nihonjin wa kurisumasu ni nani o shimasu ka."}]},{"title":"Weather and season","intro":"Weather is a safe topic almost anywhere in Japan. Winter, snow and illuminations give you plenty to talk about.","phrases":[{"id":"smalltalk-weather-01","speaker":"you","jp":"今日は寒いですね。","kana":"きょう は さむい です ね。","meaning":"It is cold today, isn't it?","also_heard":[{"jp":"今日は冷えますね。","kana":"きょう は ひえます ね。","meaning":"It is chilly today.","romaji":"kyou wa hiemasu ne."},{"jp":"今日、寒いね。","kana":"きょう、 さむい ね。","meaning":"It is cold today, isn't it? (casual)","romaji":"kyou, samui ne."}],"replies":[{"jp":"そうですね、寒いですね。","kana":"そう です ね、 さむい です ね。","meaning":"Yes, it is cold.","romaji":"sou desu ne, samui desu ne."}],"note":"ですね invites agreement, and a polite listener almost always answers そうですね. 冷える means to get chilly.","level":"core","romaji":"kyou wa samui desu ne."},{"id":"smalltalk-weather-02","speaker":"staff","jp":"日本の冬は寒いでしょう？","kana":"にほん の ふゆ は さむい でしょう？","meaning":"Japan's winter is cold, isn't it?","also_heard":[{"jp":"寒くないですか。","kana":"さむく ない です か。","meaning":"Isn't it cold?","romaji":"samuku nai desu ka."},{"jp":"寒いでしょ？","kana":"さむい でしょ？","meaning":"It is cold, right? (casual)","romaji":"samui desho?"}],"replies":[{"jp":"はい、寒いですが、大丈夫です。","kana":"はい、 さむい です が、 だいじょうぶ です。","meaning":"Yes, it is cold, but I am fine.","romaji":"hai, samui desu ga, daijoubu desu."},{"jp":"エルサルバドルは暑い国なので、寒いのは苦手です。","kana":"エルサルバドル は あつい くに な ので、 さむい の は にがて です。","meaning":"El Salvador is a hot country, so I am not good with the cold.","romaji":"erusarubadoru wa atsui kuni na node, samui no wa nigate desu."}],"note":"〜でしょう？ asks for agreement. 苦手 (にがて) means not good at. El Salvador has a hot, tropical climate.","level":"useful","romaji":"nihon no fuyu wa samui deshou?"},{"id":"smalltalk-weather-03","speaker":"you","jp":"雪が降っていますね。","kana":"ゆき が ふって います ね。","meaning":"It is snowing, isn't it?","replies":[{"jp":"そうですね。","kana":"そう です ね。","meaning":"Yes, it is.","romaji":"sou desu ne."},{"jp":"今日は積もるかもしれませんね。","kana":"きょう は つもる かも しれません ね。","meaning":"It might settle on the ground today.","romaji":"kyou wa tsumoru kamo shiremasen ne."}],"note":"雪が降る means snow falls. 積もる means snow builds up on the ground.","level":"core","romaji":"yuki ga futte imasu ne."},{"id":"smalltalk-weather-04","speaker":"you","jp":"雪がきれいですね。","kana":"ゆき が きれい です ね。","meaning":"The snow is beautiful, isn't it?","replies":[{"jp":"そうですね。きれいですね。","kana":"そう です ね。 きれい です ね。","meaning":"Yes, it is beautiful.","romaji":"sou desu ne. kirei desu ne."}],"note":"きれい is often written in hiragana. Use it for scenery, lights and food alike.","level":"core","romaji":"yuki ga kirei desu ne."},{"id":"smalltalk-weather-05","speaker":"you","jp":"私の国では雪はほとんど降りません。","kana":"わたし の くに で は ゆき は ほとんど ふりません。","meaning":"In my country it almost never snows.","replies":[{"jp":"そうなんですか！いいですね。","kana":"そう なん です か！ いい です ね。","meaning":"Really? That is nice.","romaji":"sou nan desu ka! ii desu ne."},{"jp":"珍しいんですね。","kana":"めずらしい ん です ね。","meaning":"That is rare, isn't it?","romaji":"mezurashii n desu ne."}],"note":"降りません is the neutral present negative. ほとんど keeps the statement accurate: it means almost never.","level":"core","romaji":"watashi no kuni de wa yuki wa hotondo furimasen."},{"id":"smalltalk-weather-06","speaker":"you","jp":"イルミネーションがとてもきれいですね。","kana":"イルミネーション が とても きれい です ね。","meaning":"The illuminations are really beautiful.","also_heard":[{"jp":"夜の景色がきれいです。","kana":"よる の けしき が きれい です。","meaning":"The night view is beautiful.","romaji":"yoru no keshiki ga kirei desu."},{"jp":"イルミネーション、すてきですね。","kana":"イルミネーション、 すてき です ね。","meaning":"The illuminations are lovely.","romaji":"irumineeshon, suteki desu ne."}],"replies":[{"jp":"そうでしょう。","kana":"そう でしょう。","meaning":"Right, is it not?","romaji":"sou deshou."},{"jp":"今が見頃ですね。","kana":"いま が みごろ です ね。","meaning":"Now is the best time to see them.","romaji":"ima ga migoro desu ne."}],"note":"イルミネーション is the usual word for winter light displays. 見頃 (みごろ) means the best time to see something.","level":"core","romaji":"irumineeshon ga totemo kirei desu ne."},{"id":"smalltalk-weather-07","speaker":"staff","jp":"今日は天気がいいですね。","kana":"きょう は てんき が いい です ね。","meaning":"The weather is nice today, isn't it?","also_heard":[{"jp":"いい天気ですね。","kana":"いい てんき です ね。","meaning":"Nice weather, isn't it?","romaji":"ii tenki desu ne."},{"jp":"いい天気だね。","kana":"いい てんき だ ね。","meaning":"Nice weather, huh? (casual)","romaji":"ii tenki da ne."}],"replies":[{"jp":"そうですね。いい天気ですね。","kana":"そう です ね。 いい てんき です ね。","meaning":"Yes, it is nice weather.","romaji":"sou desu ne. ii tenki desu ne."},{"jp":"富士山がきれいに見えますね。","kana":"ふじさん が きれい に みえます ね。","meaning":"You can see Mt Fuji clearly.","romaji":"fujisan ga kirei ni miemasu ne."}],"note":"Repeating the point and agreeing is the easiest reply. 富士山が見える is a good phrase near Kawaguchiko.","level":"useful","romaji":"kyou wa tenki ga ii desu ne."},{"id":"smalltalk-weather-08","speaker":"staff","jp":"今日はすごく冷えますね。","kana":"きょう は すごく ひえます ね。","meaning":"It is really chilly today.","also_heard":[{"jp":"冷えますね。","kana":"ひえます ね。","meaning":"It is chilly.","romaji":"hiemasu ne."},{"jp":"さむっ！","kana":"さむっ！","meaning":"Brrr! (casual)","romaji":"samu!"}],"replies":[{"jp":"そうですね。風が冷たいですね。","kana":"そう です ね。 かぜ が つめたい です ね。","meaning":"Yes, the wind is cold.","romaji":"sou desu ne. kaze ga tsumetai desu ne."}],"note":"冷たい describes things that feel cold to the touch, such as wind or a drink. 寒い is the usual word for cold weather.","level":"useful","romaji":"kyou wa sugoku hiemasu ne."},{"id":"smalltalk-weather-09","speaker":"staff","jp":"風邪をひかないように気をつけてくださいね。","kana":"かぜ を ひかない よう に き を つけて ください ね。","meaning":"Please take care not to catch a cold.","also_heard":[{"jp":"風邪ひかないでね。","kana":"かぜ ひかない で ね。","meaning":"Don't catch a cold, okay? (casual)","romaji":"kaze hikanai de ne."},{"jp":"暖かくしてくださいね。","kana":"あたたかく して ください ね。","meaning":"Please keep yourself warm.","romaji":"atatakaku shite kudasai ne."}],"replies":[{"jp":"ありがとうございます。気をつけます。","kana":"ありがとうございます。 き を つけます。","meaning":"Thank you. I will be careful.","romaji":"arigatougozaimasu. ki o tsukemasu."}],"note":"A common parting line in winter. In 風邪をひく the verb is usually written in hiragana.","level":"useful","romaji":"kaze o hikanai you ni ki o tsukete kudasai ne."}]},{"title":"Food talk","intro":"Food is the easiest shared subject. These lines work at an izakaya counter, a ramen shop or a market stall.","phrases":[{"id":"smalltalk-food-01","speaker":"you","jp":"おいしいです！","kana":"おいしい です！","meaning":"It is delicious!","also_heard":[{"jp":"とてもおいしいです。","kana":"とても おいしい です。","meaning":"It is very delicious.","romaji":"totemo oishii desu."},{"jp":"おいしい！","kana":"おいしい！","meaning":"Delicious! (casual)","romaji":"oishii!"},{"jp":"うまい！","kana":"うまい！","meaning":"Tasty! (rough, casual)","romaji":"umai!"}],"replies":[{"jp":"ありがとうございます！","kana":"ありがとう ございます！","meaning":"Thank you!","romaji":"arigatou gozaimasu!"},{"jp":"よかったです。","kana":"よかった です。","meaning":"I am glad.","romaji":"yokatta desu."}],"note":"The most useful word here. うまい is rougher, so keep it for relaxed moments with friends.","level":"core","romaji":"oishii desu!"},{"id":"smalltalk-food-02","speaker":"you","jp":"これには何が入っていますか。","kana":"これ に は なに が はいって います か。","meaning":"What is in this?","also_heard":[{"jp":"材料は何ですか。","kana":"ざいりょう は なん です か。","meaning":"What are the ingredients?","romaji":"zairyou wa nan desu ka."},{"jp":"何が入ってるの？","kana":"なに が はいってる の？","meaning":"What is in it? (casual)","romaji":"nani ga haitteru no?"}],"replies":[{"jp":"エビが入っています。","kana":"エビ が はいって います。","meaning":"It has shrimp in it.","romaji":"ebi ga haitte imasu."}],"note":"入っています means is contained. Ask this before you order if you want to know what a dish has in it.","level":"core","romaji":"kore ni wa nani ga haitte imasu ka."},{"id":"smalltalk-food-03","speaker":"you","jp":"これは食べたことがありません。","kana":"これ は たべた こと が ありません。","meaning":"I have never eaten this.","also_heard":[{"jp":"初めて食べます。","kana":"はじめて たべます。","meaning":"I am eating this for the first time.","romaji":"hajimete tabemasu."}],"replies":[{"jp":"どうですか。おいしいでしょう？","kana":"どう です か。 おいしい でしょう？","meaning":"How is it? It is delicious, right?","romaji":"dou desu ka. oishii deshou?"}],"note":"食べたことがありません means have never eaten. 初めて食べます means eating it for the first time now. Both work.","level":"core","romaji":"kore wa tabeta koto ga arimasen."},{"id":"smalltalk-food-04","speaker":"you","jp":"ラーメンが大好きです。","kana":"ラーメン が だいすき です。","meaning":"I love ramen.","also_heard":[{"jp":"ラーメンが好きです。","kana":"ラーメン が すき です。","meaning":"I like ramen.","romaji":"raamen ga suki desu."},{"jp":"毎日でも食べたいです。","kana":"まいにち でも たべたい です。","meaning":"I would eat it even every day.","romaji":"mainichi demo tabetai desu."}],"replies":[{"jp":"いいですね。","kana":"いい です ね。","meaning":"That is nice.","romaji":"ii desu ne."},{"jp":"大阪のラーメンもおいしいですよ。","kana":"おおさか の ラーメン も おいしい です よ。","meaning":"Osaka ramen is delicious too.","romaji":"oosaka no raamen mo oishii desu yo."}],"note":"毎日でも means even every day. Swap in any food you love.","level":"useful","romaji":"raamen ga daisuki desu."},{"id":"smalltalk-food-05","speaker":"staff","jp":"辛いものは大丈夫ですか。","kana":"からい もの は だいじょうぶ です か。","meaning":"Are you OK with spicy food?","also_heard":[{"jp":"辛いのは食べられますか。","kana":"からい の は たべられます か。","meaning":"Can you eat spicy food?","romaji":"karai no wa taberaremasu ka."},{"jp":"辛いの平気？","kana":"からい の へいき？","meaning":"Can you handle spicy food? (casual)","romaji":"karai no heiki?"},{"jp":"苦手なものはありますか。","kana":"にがて な もの は あります か。","meaning":"Is there anything you do not like?","romaji":"nigate na mono wa arimasu ka."}],"replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, I am fine with it.","romaji":"hai, daijoubu desu."},{"jp":"少しなら大丈夫です。","kana":"すこし なら だいじょうぶ です。","meaning":"A little is fine.","romaji":"sukoshi nara daijoubu desu."},{"jp":"辛いのは苦手です。","kana":"からい の は にがて です。","meaning":"I am not good with spicy food.","romaji":"karai no wa nigate desu."}],"note":"Answer with how much you can take. 少しなら大丈夫です is a polite way to ask for milder food.","level":"core","romaji":"karai mono wa daijoubu desu ka."},{"id":"smalltalk-food-06","speaker":"staff","jp":"日本の食べ物で、何が一番好きですか。","kana":"にほん の たべもの で、 なに が いちばん すき です か。","meaning":"Which Japanese food do you like best?","also_heard":[{"jp":"好きな食べ物は何ですか。","kana":"すきな たべもの は なん です か。","meaning":"What food do you like?","romaji":"sukina tabemono wa nan desu ka."},{"jp":"日本食で何が好き？","kana":"にほんしょく で なに が すき？","meaning":"What Japanese food do you like? (casual)","romaji":"nihonshoku de nani ga suki?"}],"replies":[{"jp":"寿司が好きです。","kana":"すし が すき です。","meaning":"I like sushi.","romaji":"sushi ga suki desu."},{"jp":"全部おいしいです。","kana":"ぜんぶ おいしい です。","meaning":"Everything is delicious.","romaji":"zenbu oishii desu."}],"note":"全部 (ぜんぶ) means everything. It is a safe, friendly answer when you cannot choose.","level":"core","romaji":"nihon no tabemono de, nani ga ichiban suki desu ka."},{"id":"smalltalk-food-07","speaker":"staff","jp":"これはこの地方の名物なんですよ。","kana":"これ は この ちほう の めいぶつ な ん です よ。","meaning":"This is a local speciality of this area.","also_heard":[{"jp":"ここの名物です。","kana":"ここ の めいぶつ です。","meaning":"This is the speciality here.","romaji":"koko no meibutsu desu."},{"jp":"郷土料理です。","kana":"きょうどりょうり です。","meaning":"It is a regional dish.","romaji":"kyoudoryouri desu."}],"replies":[{"jp":"そうなんですね。いただきます。","kana":"そう なん です ね。 いただきます。","meaning":"I see. Thank you for the food.","romaji":"sou nan desu ne. itadakimasu."},{"jp":"そうなんですね。楽しみです。","kana":"そう なん です ね。 たのしみ です。","meaning":"I see. I am looking forward to it.","romaji":"sou nan desu ne. tanoshimi desu."}],"note":"名物 (めいぶつ) is a local speciality, and 郷土料理 is regional cooking. いただきます is said before you start eating.","level":"useful","romaji":"kore wa kono chihou no meibutsu na n desu yo."},{"id":"smalltalk-food-08","speaker":"staff","jp":"お酒は飲みますか。","kana":"おさけ は のみます か。","meaning":"Do you drink alcohol?","also_heard":[{"jp":"お酒は好きですか。","kana":"おさけ は すき です か。","meaning":"Do you like alcohol?","romaji":"osake wa suki desu ka."},{"jp":"お酒、飲める？","kana":"おさけ、 のめる？","meaning":"Can you drink? (casual)","romaji":"osake, nomeru?"}],"replies":[{"jp":"はい、少し飲みます。","kana":"はい、 すこし のみます。","meaning":"Yes, I drink a little.","romaji":"hai, sukoshi nomimasu."},{"jp":"はい、ビールが好きです。","kana":"はい、 ビール が すき です。","meaning":"Yes, I like beer.","romaji":"hai, biiru ga suki desu."},{"jp":"お酒は飲みません。","kana":"おさけ は のみません。","meaning":"I do not drink alcohol.","romaji":"osake wa nomimasen."}],"note":"Any of these answers is fine. If you do not drink, お酒は飲まないんです is a polite answer. 乾杯 (かんぱい) is the toast.","level":"useful","romaji":"osake wa nomimasu ka."},{"id":"smalltalk-food-09","speaker":"you","jp":"日本酒は詳しくないので、おすすめを教えてください。","kana":"にほんしゅ は くわしく ない ので、 おすすめ を おしえて ください。","meaning":"I do not know much about sake, so please recommend one.","also_heard":[{"jp":"甘口と辛口、どちらがいいですか。","kana":"あまくち と からくち、 どちら が いい です か。","meaning":"Would you like sweet or dry?","romaji":"amakuchi to karakuchi, dochira ga ii desu ka."},{"jp":"飲みやすいのをお願いします。","kana":"のみやすい の を おねがい します。","meaning":"Something easy to drink, please.","romaji":"nomiyasui no o onegai shimasu."}],"replies":[{"jp":"これは飲みやすいですよ。","kana":"これ は のみやすい です よ。","meaning":"This one is easy to drink.","romaji":"kore wa nomiyasui desu yo."}],"note":"甘口 (あまくち) means sweet and 辛口 (からくち) means dry. 飲みやすい means easy to drink.","level":"useful","romaji":"nihonshu wa kuwashiku nai node, osusume o oshiete kudasai."},{"id":"smalltalk-food-10","speaker":"you","jp":"ごちそうさまでした。","kana":"ごちそうさまでした。","meaning":"Thank you for the meal.","replies":[{"jp":"ありがとうございます。またお越しください。","kana":"ありがとうございます。 また おこし ください。","meaning":"Thank you. Please come again.","romaji":"arigatougozaimasu. mata okoshi kudasai."}],"note":"Say it when you finish the meal or as you leave. Add とてもおいしかったです to praise the food.","level":"core","romaji":"gochisousamadeshita."},{"id":"smalltalk-food-11","speaker":"staff","jp":"日本の食べ物は口に合いますか。","kana":"にほん の たべもの は くち に あいます か。","meaning":"Does Japanese food suit your taste?","also_heard":[{"jp":"食べ物は大丈夫ですか。","kana":"たべもの は だいじょうぶ です か。","meaning":"Is the food all right for you?","romaji":"tabemono wa daijoubu desu ka."},{"jp":"口に合う？","kana":"くち に あう？","meaning":"Does it suit you? (casual)","romaji":"kuchi ni au?"}],"replies":[{"jp":"はい、とてもおいしいです。","kana":"はい、 とても おいしい です。","meaning":"Yes, it is very delicious.","romaji":"hai, totemo oishii desu."}],"note":"口に合う is an idiom meaning it suits one's taste. Listen for it; a simple yes plus praise is enough.","level":"listen-only","romaji":"nihon no tabemono wa kuchi ni aimasu ka."}]},{"title":"Reactions and listening words (あいづち)","intro":"Japanese conversation is full of short responses. Using them makes you sound present, even with a small vocabulary.","phrases":[{"id":"smalltalk-react-01","speaker":"you","jp":"そうですか。","kana":"そう です か。","meaning":"I see. Is that so?","also_heard":[{"jp":"そっか。","kana":"そっか。","meaning":"I see. (casual)","romaji":"sokka."},{"jp":"あ、そうですか。","kana":"あ、 そう です か。","meaning":"Oh, I see.","romaji":"a, sou desu ka."}],"note":"A falling tone acknowledges what was said. A rising tone asks a real question. Add a nod, because a flat そうですか alone can sound cold.","level":"core","romaji":"sou desu ka."},{"id":"smalltalk-react-02","speaker":"you","jp":"そうなんですね。","kana":"そう なん です ね。","meaning":"I see, so that is how it is.","also_heard":[{"jp":"そうなんですか。","kana":"そう なん です か。","meaning":"Is that so?","romaji":"sou nan desu ka."},{"jp":"そうなんだ。","kana":"そう なん だ。","meaning":"Oh, is that right? (casual)","romaji":"sou nan da."}],"note":"Warmer and more engaged than そうですか. Use it when you hear new information.","level":"core","romaji":"sou nan desu ne."},{"id":"smalltalk-react-03","speaker":"you","jp":"へえ！","kana":"へえ！","meaning":"Oh! Wow.","also_heard":[{"jp":"へえ〜、そうなんですね。","kana":"へえ〜、 そう なん です ね。","meaning":"Wow, is that right?","romaji":"hee~, sou nan desu ne."},{"jp":"ふーん。","kana":"ふーん。","meaning":"Hmm. (casual, can sound uninterested)","romaji":"fuun."}],"note":"A long, friendly へえ shows interest. Plain ふーん can sound uninterested, so recognize it and use it sparingly.","level":"useful","romaji":"hee!"},{"id":"smalltalk-react-04","speaker":"you","jp":"なるほど。","kana":"なるほど。","meaning":"I see. That makes sense.","also_heard":[{"jp":"なるほどですね。","kana":"なるほど です ね。","meaning":"I see, that makes sense.","romaji":"naruhodo desu ne."},{"jp":"なるほどね。","kana":"なるほど ね。","meaning":"I see. (casual)","romaji":"naruhodo ne."}],"note":"Said when you understand an explanation. With people above you, 勉強になります (I learned a lot) is safer. Listen for it.","level":"core","romaji":"naruhodo."},{"id":"smalltalk-react-05","speaker":"you","jp":"本当ですか。","kana":"ほんとう です か。","meaning":"Really?","also_heard":[{"jp":"本当に？","kana":"ほんとう に？","meaning":"Really? (casual)","romaji":"hontou ni?"},{"jp":"えっ、本当ですか。","kana":"えっ、 ほんとう です か。","meaning":"Oh, really?","romaji":"e, hontou desu ka."}],"replies":[{"jp":"はい、本当ですよ。","kana":"はい、 ほんとう です よ。","meaning":"Yes, it is true.","romaji":"hai, hontou desu yo."}],"note":"Say it with a smile and a rising pitch. A flat tone can sound like doubt.","level":"core","romaji":"hontou desu ka."},{"id":"smalltalk-react-06","speaker":"you","jp":"すごいですね。","kana":"すごい です ね。","meaning":"That is amazing.","also_heard":[{"jp":"すごい！","kana":"すごい！","meaning":"Amazing! (casual)","romaji":"sugoi!"},{"jp":"すばらしいですね。","kana":"すばらしい です ね。","meaning":"That is wonderful.","romaji":"subarashii desu ne."}],"note":"Praise that works for almost anything.","level":"core","romaji":"sugoi desu ne."},{"id":"smalltalk-react-07","speaker":"you","jp":"いいですね。","kana":"いい です ね。","meaning":"That sounds nice.","also_heard":[{"jp":"いいなあ。","kana":"いいなあ。","meaning":"Oh, lucky you! (casual)","romaji":"iinaa."},{"jp":"素敵ですね。","kana":"すてき です ね。","meaning":"That is lovely.","romaji":"suteki desu ne."}],"note":"Here it simply shows that you like what you heard. In some other contexts it can be a polite way to decline.","level":"core","romaji":"ii desu ne."},{"id":"smalltalk-react-08","speaker":"you","jp":"たしかに。","kana":"たしか に。","meaning":"True. Good point.","also_heard":[{"jp":"たしかにそうですね。","kana":"たしか に そう です ね。","meaning":"Yes, that is true.","romaji":"tashika ni sou desu ne."},{"jp":"そうですよね。","kana":"そう です よ ね。","meaning":"Right, is it not?","romaji":"sou desu yo ne."},{"jp":"ほんとだ。","kana":"ほんとだ。","meaning":"That is true. (casual)","romaji":"hontoda."}],"note":"A very natural way to agree with someone's opinion.","level":"useful","romaji":"tashika ni."},{"id":"smalltalk-react-09","speaker":"you","jp":"えっと、あの。","kana":"えっと、 あの。","meaning":"Um, uh.","also_heard":[{"jp":"ええと。","kana":"ええと。","meaning":"Um.","romaji":"eeto."},{"jp":"あのう。","kana":"あのう。","meaning":"Um, excuse me.","romaji":"anou."},{"jp":"うーん。","kana":"うーん。","meaning":"Hmm.","romaji":"uun."}],"note":"Use these to hold the floor while you look for a word. That is better than silence.","level":"core","romaji":"etto, ano."},{"id":"smalltalk-react-10","speaker":"you","jp":"すみません、もう一度お願いします。","kana":"すみません、 もういちど おねがい します。","meaning":"Sorry, once more please.","also_heard":[{"jp":"もう一回お願いします。","kana":"もう いっかい おねがい します。","meaning":"Once more, please.","romaji":"mou ikkai onegai shimasu."},{"jp":"すみません、よく分かりませんでした。","kana":"すみません、 よく わかりません でした。","meaning":"Sorry, I did not quite understand.","romaji":"sumimasen, yoku wakarimasen deshita."}],"replies":[{"jp":"はい、ゆっくりいいますね。","kana":"はい、 ゆっくり いいますね。","meaning":"Yes, I will say it slowly.","romaji":"hai, yukkuri iimasune."}],"note":"This does not stop the chat. Add a smile.","level":"core","romaji":"sumimasen, mouichido onegai shimasu."},{"id":"smalltalk-react-11","speaker":"you","jp":"「海外」はどういう意味ですか。","kana":"「かいがい」 は どういう いみ です か。","meaning":"What does 海外 mean?","also_heard":[{"jp":"「海外」って何ですか。","kana":"「かいがい」 って なん です か。","meaning":"What is 海外? (casual)","romaji":"\"kaigai\" tte nan desu ka."}],"replies":[{"jp":"外国のことです。","kana":"がいこく の こと です。","meaning":"It means going abroad, outside the country.","romaji":"gaikoku no koto desu."}],"note":"Ask about one word, not the whole sentence. This keeps the chat alive while you get the meaning.","level":"core","romaji":"\"kaigai\" wa douiu imi desu ka."},{"id":"smalltalk-react-12","speaker":"you","jp":"英語でもいいですか。","kana":"えいご でも いい です か。","meaning":"Is English all right?","replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that is fine.","romaji":"hai, daijoubu desu."}],"note":"A fallback when your Japanese is not enough. Asking politely keeps the conversation going.","level":"core","romaji":"eigo demo ii desu ka."}]},{"title":"Christmas and year-end","intro":"Christmas in Japan is often a couple's evening with cake and fried chicken. Year-end is the real season, and the greetings change.","phrases":[{"id":"smalltalk-xmas-01","speaker":"you","jp":"メリークリスマス！","kana":"メリークリスマス！","meaning":"Merry Christmas!","replies":[{"jp":"メリークリスマス！","kana":"メリークリスマス！","meaning":"Merry Christmas!","romaji":"meriikurisumasu!"},{"jp":"ありがとうございます。メリークリスマス。","kana":"ありがとうございます。 メリークリスマス。","meaning":"Thank you. Merry Christmas.","romaji":"arigatougozaimasu. meriikurisumasu."}],"note":"Christmas Eve (クリスマスイブ) is the bigger night for couples in Japan. This greeting works on both Christmas Eve and Christmas Day.","level":"core","romaji":"meriikurisumasu!"},{"id":"smalltalk-xmas-02","speaker":"staff","jp":"日本のクリスマスはケーキとチキンですよ。","kana":"にほん の クリスマス は ケーキ と チキン です よ。","meaning":"In Japan, Christmas means cake and chicken.","also_heard":[{"jp":"クリスマスにはケーキを食べます。","kana":"クリスマス に は ケーキ を たべます。","meaning":"People eat cake at Christmas.","romaji":"kurisumasu ni wa keeki o tabemasu."},{"jp":"ケンタッキーが人気です。","kana":"ケンタッキー が にんき です。","meaning":"KFC is popular.","romaji":"kentakkii ga ninki desu."}],"replies":[{"jp":"そうなんですね。おもしろいですね。","kana":"そう なん です ね。 おもしろい です ね。","meaning":"I see. That is interesting.","romaji":"sou nan desu ne. omoshiroi desu ne."},{"jp":"いちごのケーキですか。","kana":"いちご の ケーキ です か。","meaning":"Is it a strawberry cake?","romaji":"ichigo no keeki desu ka."}],"note":"The strawberry shortcake is the usual Christmas cake. Fried chicken from a well-known chain is also a popular Christmas order.","level":"useful","romaji":"nihon no kurisumasu wa keeki to chikin desu yo."},{"id":"smalltalk-xmas-03","speaker":"staff","jp":"クリスマスは何か予定がありますか。","kana":"クリスマス は なにか よてい が あります か。","meaning":"Do you have any plans for Christmas?","also_heard":[{"jp":"クリスマスはどうしますか。","kana":"クリスマス は どう します か。","meaning":"What will you do for Christmas?","romaji":"kurisumasu wa dou shimasu ka."},{"jp":"クリスマス、どうするの？","kana":"クリスマス、 どう する の？","meaning":"What are you doing for Christmas? (casual)","romaji":"kurisumasu, dou suru no?"}],"replies":[{"jp":"妻と食事をします。","kana":"つま と しょくじ を します。","meaning":"My wife and I will have a meal out.","romaji":"tsuma to shokuji o shimasu."},{"jp":"特に予定はありません。","kana":"とくに よてい は ありません。","meaning":"I have no special plans.","romaji":"tokuni yotei wa arimasen."}],"note":"予定 (よてい) means plan. Swap in your real plan for the trip.","level":"useful","romaji":"kurisumasu wa nanika yotei ga arimasu ka."},{"id":"smalltalk-xmas-04","speaker":"staff","jp":"今年も一年、あっという間でしたね。","kana":"ことし も いちねん、 あっというま でした ね。","meaning":"This year went by in a flash, didn't it?","also_heard":[{"jp":"今年もあとわずかですね。","kana":"ことし も あと わずか です ね。","meaning":"Not much of this year is left, is there?","romaji":"kotoshi mo ato wazuka desu ne."},{"jp":"今年ももう終わりですね。","kana":"ことし も もう おわり です ね。","meaning":"This year is nearly over, isn't it?","romaji":"kotoshi mo mou owari desu ne."}],"replies":[{"jp":"そうですね。本当に早いですね。","kana":"そう です ね。 ほんとう に はやい です ね。","meaning":"Yes, it has gone very fast.","romaji":"sou desu ne. hontou ni hayai desu ne."}],"note":"Common year-end small talk in late December. あっという間 means in a flash.","level":"useful","romaji":"kotoshi mo ichinen, attoiuma deshita ne."},{"id":"smalltalk-xmas-05","speaker":"staff","jp":"良いお年をお迎えください。","kana":"よい おとし を おむかえ ください。","meaning":"Have a good New Year.","also_heard":[{"jp":"良いお年を。","kana":"よい おとし を。","meaning":"Have a good year-end and New Year.","romaji":"yoi otoshi o."},{"jp":"よいお年を！","kana":"よい おとし を！","meaning":"Have a good New Year!","romaji":"yoi otoshi o!"}],"replies":[{"jp":"良いお年を。","kana":"よい おとし を。","meaning":"Have a good New Year.","romaji":"yoi otoshi o."},{"jp":"ありがとうございます。そちらもよいお年を。","kana":"ありがとうございます。 そちら も よい おとし を。","meaning":"Thank you. You have a good New Year too.","romaji":"arigatougozaimasu. sochira mo yoi otoshi o."}],"note":"Used from about mid-to-late December until December 31, before the new year starts. From January 1, switch to あけましておめでとうございます.","level":"core","romaji":"yoi otoshi o omukae kudasai."},{"id":"smalltalk-xmas-06","speaker":"staff","jp":"今年もお世話になりました。","kana":"ことし も おせわ に なりました。","meaning":"Thank you for everything this year.","also_heard":[{"jp":"本年はお世話になりました。","kana":"ほんねん は おせわ に なりました。","meaning":"Thank you for your help this year. (formal)","romaji":"honnen wa osewa ni narimashita."}],"replies":[{"jp":"こちらこそ、ありがとうございました。","kana":"こちら こそ、 ありがとうございました。","meaning":"No, thank you for everything.","romaji":"kochira koso, arigatougozaimashita."}],"note":"Shops say this to regular customers at year-end. You will mostly hear it, but こちらこそ is a polite reply.","level":"listen-only","romaji":"kotoshi mo osewa ni narimashita."},{"id":"smalltalk-xmas-07","speaker":"staff","jp":"大晦日はどうしますか。","kana":"おおみそか は どう します か。","meaning":"What are you doing on New Year's Eve?","also_heard":[{"jp":"大晦日は何をしますか。","kana":"おおみそか は なに を します か。","meaning":"What will you do on New Year's Eve?","romaji":"oomisoka wa nani o shimasu ka."},{"jp":"年末年始はどこで過ごしますか。","kana":"ねんまつねんし は どこ で すごします か。","meaning":"Where will you spend the year-end and New Year period?","romaji":"nenmatsunenshi wa doko de sugoshimasu ka."},{"jp":"大晦日の予定は？","kana":"おおみそか の よてい は？","meaning":"Any plans for New Year's Eve? (casual)","romaji":"oomisoka no yotei wa?"}],"replies":[{"jp":"ホテルでゆっくりします。","kana":"ホテル で ゆっくり します。","meaning":"I will relax at the hotel.","romaji":"hoteru de yukkuri shimasu."},{"jp":"年越しそばを食べて、初詣に行きたいです。","kana":"としこしそば を たべて、 はつもうで に いきたい です。","meaning":"I want to eat toshikoshi soba and go to a shrine for hatsumode.","romaji":"toshikoshisoba o tabete, hatsumoude ni ikitai desu."}],"note":"大晦日 (おおみそか) is December 31. 年末年始 is the year-end and New Year period. Give your own plan here.","level":"core","romaji":"oomisoka wa dou shimasu ka."},{"id":"smalltalk-xmas-08","speaker":"staff","jp":"大晦日には年越しそばを食べるんですよ。","kana":"おおみそか に は としこしそば を たべる ん です よ。","meaning":"On New Year's Eve we eat toshikoshi soba.","also_heard":[{"jp":"年越しそばを食べますか。","kana":"としこしそば を たべます か。","meaning":"Do you eat toshikoshi soba?","romaji":"toshikoshisoba o tabemasu ka."},{"jp":"年越しそばは長生きの意味があるんです。","kana":"としこしそば は ながいき の いみ が ある ん です。","meaning":"Toshikoshi soba stands for long life.","romaji":"toshikoshisoba wa nagaiki no imi ga aru n desu."}],"replies":[{"jp":"そうなんですね。食べてみたいです。","kana":"そう なん です ね。 たべて みたい です。","meaning":"I see. I would like to try it.","romaji":"sou nan desu ne. tabete mitai desu."}],"note":"Long soba noodles are said to stand for long life, and eating them is said to cut ties with the past year.","level":"useful","romaji":"oomisoka ni wa toshikoshisoba o taberu n desu yo."},{"id":"smalltalk-xmas-09","speaker":"staff","jp":"紅白を見ますか。","kana":"こうはく を みます か。","meaning":"Will you watch Kohaku?","also_heard":[{"jp":"紅白歌合戦を見ますか。","kana":"こうはく うたがっせん を みます か。","meaning":"Will you watch the Kohaku song contest?","romaji":"kouhaku utagassen o mimasu ka."},{"jp":"紅白見る？","kana":"こうはく みる？","meaning":"Are you watching Kohaku? (casual)","romaji":"kouhaku miru?"}],"replies":[{"jp":"はい、見ます。","kana":"はい、 みます。","meaning":"Yes, I will watch.","romaji":"hai, mimasu."},{"jp":"いいえ、見ません。","kana":"いいえ、 みません。","meaning":"No, I will not.","romaji":"iie, mimasen."}],"note":"紅白歌合戦 (こうはくうたがっせん) is NHK's music show on New Year's Eve. Listen for it on TV and in shops.","level":"listen-only","romaji":"kouhaku o mimasu ka."},{"id":"smalltalk-xmas-10","speaker":"you","jp":"除夜の鐘を聞きたいです。","kana":"じょや の かね を きき たい です。","meaning":"I would like to hear the temple bells at midnight.","also_heard":[{"jp":"除夜の鐘はどこで聞けますか。","kana":"じょや の かね は どこ で きけます か。","meaning":"Where can I hear the temple bells?","romaji":"joya no kane wa doko de kikemasu ka."}],"replies":[{"jp":"近くのお寺でやっていますよ。","kana":"ちかく の おてら で やって います よ。","meaning":"They hold it at a temple nearby.","romaji":"chikaku no otera de yatte imasu yo."}],"note":"The bell is rung 108 times on New Year's Eve. Events change from year to year, so check the temple's notice locally.","level":"useful","romaji":"joya no kane o kiki tai desu."}]},{"title":"New Year (from January 1)","intro":"From January 1 the greetings change completely. Shops close for a few days, shrines are busy, and most greetings are short set phrases.","phrases":[{"id":"smalltalk-ny-01","speaker":"staff","jp":"あけましておめでとうございます。","kana":"あけまして おめでとうございます。","meaning":"Happy New Year.","also_heard":[{"jp":"あけましておめでとう。","kana":"あけまして おめでとう。","meaning":"Happy New Year. (casual)","romaji":"akemashite omedetou."},{"jp":"あけおめ。","kana":"あけおめ。","meaning":"Happy New Year. (slang, between friends)","romaji":"akeome."}],"replies":[{"jp":"あけましておめでとうございます。","kana":"あけまして おめでとうございます。","meaning":"Happy New Year.","romaji":"akemashite omedetougozaimasu."},{"jp":"今年もよろしくお願いします。","kana":"ことし も よろしく おねがい します。","meaning":"Please treat me kindly this year too (the set New Year reply).","romaji":"kotoshi mo yoroshiku onegai shimasu."}],"note":"Starts at midnight on January 1. Before that, use 良いお年を. It is commonly used until about January 7, the end of 松の内 in most places.","level":"core","romaji":"akemashite omedetougozaimasu."},{"id":"smalltalk-ny-02","speaker":"you","jp":"今年もよろしくお願いします。","kana":"ことし も よろしく おねがい します。","meaning":"Please treat me kindly this year too (the set New Year reply).","also_heard":[{"jp":"本年もよろしくお願いします。","kana":"ほんねん も よろしく おねがい します。","meaning":"I look forward to this year too. (formal)","romaji":"honnen mo yoroshiku onegai shimasu."},{"jp":"今年もよろしく。","kana":"ことし も よろしく。","meaning":"Same to you this year. (casual)","romaji":"kotoshi mo yoroshiku."}],"replies":[{"jp":"こちらこそ、よろしくお願いします。","kana":"こちら こそ、 よろしく おねがい します。","meaning":"Likewise, I look forward to it.","romaji":"kochira koso, yoroshiku onegai shimasu."}],"note":"This is the usual follow-up to あけましておめでとうございます. Say it to people you may see again, such as hotel staff.","level":"core","romaji":"kotoshi mo yoroshiku onegai shimasu."},{"id":"smalltalk-ny-03","speaker":"staff","jp":"お正月はどうでしたか。","kana":"おしょうがつ は どう でした か。","meaning":"How was your New Year?","also_heard":[{"jp":"お正月はいかがでしたか。","kana":"おしょうがつ は いかが でした か。","meaning":"How was your New Year? (polite)","romaji":"oshougatsu wa ikaga deshita ka."},{"jp":"お正月は楽しかった？","kana":"おしょうがつ は たのしかった？","meaning":"Did you enjoy New Year? (casual)","romaji":"oshougatsu wa tanoshikatta?"}],"replies":[{"jp":"楽しかったです。","kana":"たのしかった です。","meaning":"It was fun.","romaji":"tanoshikatta desu."},{"jp":"ゆっくりしました。","kana":"ゆっくり しました。","meaning":"I relaxed.","romaji":"yukkuri shimashita."}],"note":"お正月 is the polite word for New Year. Answer in the past tense. People ask this in early January.","level":"useful","romaji":"oshougatsu wa dou deshita ka."},{"id":"smalltalk-ny-04","speaker":"staff","jp":"初詣に行きましたか。","kana":"はつもうで に いきました か。","meaning":"Did you go to a shrine for hatsumode?","also_heard":[{"jp":"初詣はもう行きましたか。","kana":"はつもうで は もう いきました か。","meaning":"Have you already been for hatsumode?","romaji":"hatsumoude wa mou ikimashita ka."},{"jp":"初詣には行った？","kana":"はつもうで に は いった？","meaning":"Did you go for hatsumode? (casual)","romaji":"hatsumoude ni wa itta?"}],"replies":[{"jp":"はい、近くの神社に行きました。","kana":"はい、 ちかく の じんじゃ に いきました。","meaning":"Yes, I went to a nearby shrine.","romaji":"hai, chikaku no jinja ni ikimashita."},{"jp":"まだです。これから行きます。","kana":"まだ です。 これから いきます。","meaning":"Not yet. I will go soon.","romaji":"mada desu. korekara ikimasu."}],"note":"初詣 is the first visit to a shrine or temple in the new year, usually in the first days of January. Expect crowds at popular shrines.","level":"useful","romaji":"hatsumoude ni ikimashita ka."},{"id":"smalltalk-ny-05","speaker":"you","jp":"初詣に行きたいです。","kana":"はつもうで に いき たい です。","meaning":"I would like to go to hatsumode.","also_heard":[{"jp":"近くの神社を教えてください。","kana":"ちかく の じんじゃ を おしえて ください。","meaning":"Please tell me a shrine nearby.","romaji":"chikaku no jinja o oshiete kudasai."},{"jp":"初詣はどこがいいですか。","kana":"はつもうで は どこ が いい です か。","meaning":"Where is good for hatsumode?","romaji":"hatsumoude wa doko ga ii desu ka."}],"replies":[{"jp":"近くの神社がおすすめです。","kana":"ちかく の じんじゃ が おすすめ です。","meaning":"I recommend a shrine nearby.","romaji":"chikaku no jinja ga osusume desu."}],"note":"神社 (じんじゃ) is a Shinto shrine and お寺 (おてら) is a Buddhist temple. Both are used for hatsumode. Ask your hotel front desk for a nearby one.","level":"useful","romaji":"hatsumoude ni iki tai desu."},{"id":"smalltalk-ny-06","speaker":"staff","jp":"おせちを食べましたか。","kana":"おせち を たべました か。","meaning":"Did you eat osechi?","also_heard":[{"jp":"おせち料理を食べましたか。","kana":"おせち りょうり を たべました か。","meaning":"Did you eat osechi dishes?","romaji":"osechi ryouri o tabemashita ka."},{"jp":"おせち食べた？","kana":"おせち たべた？","meaning":"Did you eat osechi? (casual)","romaji":"osechi tabeta?"}],"replies":[{"jp":"はい、食べました。","kana":"はい、 たべました。","meaning":"Yes, I ate it.","romaji":"hai, tabemashita."},{"jp":"いいえ、まだです。食べてみたいです。","kana":"いいえ、 まだ です。 たべて みたい です。","meaning":"No, not yet. I would like to try it.","romaji":"iie, mada desu. tabete mitai desu."}],"note":"おせち are boxed New Year dishes, often prepared ahead of time. Many restaurants and shops close or shorten their hours during the New Year holiday.","level":"useful","romaji":"osechi o tabemashita ka."},{"id":"smalltalk-ny-07","speaker":"staff","jp":"お雑煮は食べましたか。","kana":"おぞうに は たべました か。","meaning":"Did you eat ozoni?","also_heard":[{"jp":"お雑煮はどうでしたか。","kana":"おぞうに は どう でした か。","meaning":"How was the ozoni?","romaji":"ozouni wa dou deshita ka."}],"replies":[{"jp":"いいえ、まだです。どんなお雑煮ですか。","kana":"いいえ、 まだ です。 どんな おぞうに です か。","meaning":"No, not yet. What kind of ozoni is it?","romaji":"iie, mada desu. donna ozouni desu ka."}],"note":"お雑煮 is a New Year soup with mochi rice cake. The style varies by region, so asking what local ozoni is like is a good question.","level":"useful","romaji":"ozouni wa tabemashita ka."},{"id":"smalltalk-ny-08","speaker":"staff","jp":"お年玉の季節ですね。","kana":"おとしだま の きせつ です ね。","meaning":"It is the season for otoshidama, isn't it?","also_heard":[{"jp":"お年玉をあげましたか。","kana":"おとしだま を あげました か。","meaning":"Did you give otoshidama?","romaji":"otoshidama o agemashita ka."}],"replies":[{"jp":"そうですね。","kana":"そう です ね。","meaning":"Yes, it is.","romaji":"sou desu ne."}],"note":"お年玉 is New Year money given to children in small envelopes. Adults normally do not receive it, so do not ask adults about it.","level":"listen-only","romaji":"otoshidama no kisetsu desu ne."},{"id":"smalltalk-ny-09","speaker":"staff","jp":"お正月休みはいつまでですか。","kana":"おしょうがつ やすみ は いつ まで です か。","meaning":"Until when is your New Year holiday?","also_heard":[{"jp":"営業は何日からですか。","kana":"えいぎょう は なんにち から です か。","meaning":"From what date are you open?","romaji":"eigyou wa nannichi kara desu ka."},{"jp":"三が日はお休みです。","kana":"さんがにち は おやすみ です。","meaning":"The first three days are holidays.","romaji":"sanganichi wa oyasumi desu."}],"replies":[{"jp":"一月三日まで休みです。","kana":"いちがつ みっか まで やすみ です。","meaning":"We are closed until January 3.","romaji":"ichigatsu mikka made yasumi desu."},{"jp":"一月四日からです。","kana":"いちがつ よっか から です。","meaning":"We open from January 4.","romaji":"ichigatsu yokka kara desu."}],"note":"三が日 (さんがにち) means January 1 to 3. Each shop sets its own hours. Many department stores close on January 1 and hold their first sales on January 2 or 3, so check each place.","level":"core","romaji":"oshougatsu yasumi wa itsu made desu ka."},{"id":"smalltalk-ny-10","speaker":"staff","jp":"新年あけましておめでとうございます。","kana":"しんねん あけまして おめでとうございます。","meaning":"Happy New Year.","also_heard":[{"jp":"本年もよろしくお願いいたします。","kana":"ほんねん も よろしく おねがい いたします。","meaning":"We look forward to your continued support this year.","romaji":"honnen mo yoroshiku onegai itashimasu."}],"replies":[{"jp":"あけましておめでとうございます。","kana":"あけまして おめでとうございます。","meaning":"Happy New Year.","romaji":"akemashite omedetougozaimasu."}],"note":"A formal greeting used by shops, hotels and in letters. Answer with a short, mirrored あけましておめでとうございます.","level":"core","romaji":"shinnen akemashite omedetougozaimasu."},{"id":"smalltalk-ny-11","speaker":"you","jp":"日本でお正月を過ごせて、うれしいです。","kana":"にほん で おしょうがつ を すごせて、 うれしい です。","meaning":"I am happy to spend New Year in Japan.","also_heard":[{"jp":"日本でお正月を迎えられて、うれしいです。","kana":"にほん で おしょうがつ を むかえられて、 うれしい です。","meaning":"I am happy to welcome the New Year in Japan.","romaji":"nihon de oshougatsu o mukaerarete, ureshii desu."}],"replies":[{"jp":"ありがとうございます。楽しんでくださいね。","kana":"ありがとうございます。 たのしんで ください ね。","meaning":"Thank you. Please enjoy yourself.","romaji":"arigatougozaimasu. tanoshinde kudasai ne."}],"note":"過ごせて means were able to spend, and うれしい means happy. A good longer line for hotel staff or hosts.","level":"useful","romaji":"nihon de oshougatsu o sugosete, ureshii desu."}]},{"title":"Ending the chat politely and thanks","intro":"Close the conversation warmly and briefly. Japanese goodbyes often include thanks and a wish for the rest of your trip.","phrases":[{"id":"smalltalk-end-01","speaker":"you","jp":"お話しできて、うれしかったです。","kana":"おはなし できて、 うれしかった です。","meaning":"It was nice talking with you.","also_heard":[{"jp":"お話しできて楽しかったです。","kana":"おはなし できて たのしかった です。","meaning":"It was fun talking with you.","romaji":"ohanashi dekite tanoshikatta desu."},{"jp":"話せて楽しかった。","kana":"はなせて たのしかった。","meaning":"It was fun talking. (casual)","romaji":"hanasete tanoshikatta."}],"replies":[{"jp":"こちらこそ、楽しかったです。","kana":"こちら こそ、 たのしかった です。","meaning":"Likewise, it was fun.","romaji":"kochira koso, tanoshikatta desu."}],"note":"〜できて means being able to. The past tense closes the chat politely.","level":"core","romaji":"ohanashi dekite, ureshikatta desu."},{"id":"smalltalk-end-02","speaker":"you","jp":"ご親切にありがとうございました。","kana":"ごしんせつ に ありがとう ございました。","meaning":"Thank you for your kindness.","also_heard":[{"jp":"親切にしてくれて、ありがとうございます。","kana":"しんせつ に して くれて、 ありがとうございます。","meaning":"Thank you for being so kind to me.","romaji":"shinsetsu ni shite kurete, arigatougozaimasu."},{"jp":"本当に助かりました。","kana":"ほんとう に たすかりました。","meaning":"That was a real help.","romaji":"hontou ni tasukarimashita."}],"replies":[{"jp":"いえいえ、どういたしまして。","kana":"いえいえ、 どういたしまして。","meaning":"Not at all, you are welcome.","romaji":"ieie, douitashimashite."},{"jp":"とんでもないです。","kana":"とんでもない です。","meaning":"Not at all.","romaji":"tondemonai desu."}],"note":"助かりました means it was a great help. Use it at the end of a favor.","level":"core","romaji":"goshinsetsu ni arigatou gozaimashita."},{"id":"smalltalk-end-03","speaker":"you","jp":"また来ます。","kana":"また きます。","meaning":"I will come again.","also_heard":[{"jp":"また来たいです。","kana":"また きたい です。","meaning":"I want to come again.","romaji":"mata kitai desu."},{"jp":"必ずまた来ます。","kana":"かならず また きます。","meaning":"I will surely come again.","romaji":"kanarazu mata kimasu."}],"replies":[{"jp":"ぜひまた来てくださいね。","kana":"ぜひ また きて ください ね。","meaning":"Please do come again.","romaji":"zehi mata kite kudasai ne."},{"jp":"待っています。","kana":"まって います。","meaning":"We will be waiting.","romaji":"matte imasu."}],"note":"If you are not sure when you will return, また来たいです is more honest than また来ます.","level":"core","romaji":"mata kimasu."},{"id":"smalltalk-end-04","speaker":"you","jp":"また会いましょう。","kana":"また あいましょう。","meaning":"See you again.","also_heard":[{"jp":"じゃあ、また。","kana":"じゃあ、 また。","meaning":"See you, then. (casual)","romaji":"jaa, mata."},{"jp":"また会えるといいですね。","kana":"また あえる と いい です ね。","meaning":"I hope we can meet again.","romaji":"mata aeru to ii desu ne."}],"replies":[{"jp":"はい、また。","kana":"はい、 また。","meaning":"Yes, see you.","romaji":"hai, mata."}],"note":"To someone you met once, また会えるといいですね is gentler. じゃあまた is casual and mostly used among friends.","level":"useful","romaji":"mata aimashou."},{"id":"smalltalk-end-05","speaker":"staff","jp":"お気をつけて。","kana":"おき を つけて。","meaning":"Take care.","also_heard":[{"jp":"気をつけてくださいね。","kana":"き を つけて ください ね。","meaning":"Please take care.","romaji":"ki o tsukete kudasai ne."},{"jp":"良い旅を。","kana":"よい たび を。","meaning":"Have a good trip.","romaji":"yoi tabi o."},{"jp":"気をつけてね。","kana":"き を つけて ね。","meaning":"Take care. (casual)","romaji":"ki o tsukete ne."}],"replies":[{"jp":"ありがとうございます。失礼します。","kana":"ありがとうございます。 しつれい します。","meaning":"Thank you. Goodbye.","romaji":"arigatougozaimasu. shitsurei shimasu."}],"note":"Said when you leave a shop or at the end of a chat. Reply with thanks and a small bow.","level":"core","romaji":"oki o tsukete."},{"id":"smalltalk-end-06","speaker":"staff","jp":"日本を楽しんでくださいね。","kana":"にほん を たのしんで ください ね。","meaning":"Enjoy Japan!","also_heard":[{"jp":"旅行、楽しんでくださいね。","kana":"りょこう、 たのしんで ください ね。","meaning":"Enjoy your trip.","romaji":"ryokou, tanoshinde kudasai ne."},{"jp":"楽しんできてくださいね。","kana":"たのしんで きて ください ね。","meaning":"Have a good time, please.","romaji":"tanoshinde kite kudasai ne."}],"replies":[{"jp":"ありがとうございます。楽しみます。","kana":"ありがとうございます。 たのしみます。","meaning":"Thank you. I will enjoy it.","romaji":"arigatougozaimasu. tanoshimimasu."}],"note":"A common blessing for travellers. いってらっしゃい is what people say to someone who is leaving.","level":"core","romaji":"nihon o tanoshinde kudasai ne."},{"id":"smalltalk-end-07","speaker":"you","jp":"一緒に写真を撮ってもいいですか。","kana":"いっしょ に しゃしん を とって も いい です か。","meaning":"May we take a photo together?","also_heard":[{"jp":"写真を撮ってもいいですか。","kana":"しゃしん を とって も いい です か。","meaning":"May I take a photo?","romaji":"shashin o totte mo ii desu ka."}],"replies":[{"jp":"いいですよ。","kana":"いい です よ。","meaning":"Yes, that is fine.","romaji":"ii desu yo."},{"jp":"すみません、写真はちょっと。","kana":"すみません、 しゃしん は ちょっと。","meaning":"Sorry, photos are not really OK.","romaji":"sumimasen, shashin wa chotto."}],"note":"Always ask first, especially with shop owners and cooks. If someone says no, いえいえ、大丈夫です (no problem) is a graceful reply.","level":"core","romaji":"issho ni shashin o totte mo ii desu ka."},{"id":"smalltalk-end-08","speaker":"you","jp":"写真を撮っていただけますか。","kana":"しゃしん を とって いただけます か。","meaning":"Could you take our photo?","also_heard":[{"jp":"写真を撮ってもらえませんか。","kana":"しゃしん を とって もらえません か。","meaning":"Could you take a photo for us?","romaji":"shashin o totte moraemasen ka."}],"replies":[{"jp":"はい、いいですよ。","kana":"はい、 いい です よ。","meaning":"Yes, of course.","romaji":"hai, ii desu yo."},{"jp":"はい、撮りますね。はい、チーズ。","kana":"はい、 とります ね。 はい、 チーズ。","meaning":"Yes, I will take it. Say cheese.","romaji":"hai, torimasu ne. hai, chiizu."}],"note":"撮ってもらえますか is easier to say, and ていただけますか is more polite. はい、チーズ means say cheese.","level":"useful","romaji":"shashin o totte itadakemasu ka."},{"id":"smalltalk-end-09","speaker":"you","jp":"インスタ、やっていますか。","kana":"インスタ、 やって います か。","meaning":"Do you use Instagram?","also_heard":[{"jp":"SNSはやっていますか。","kana":"エスエヌエス は やって います か。","meaning":"Do you use social media?","romaji":"esuenuesu wa yatte imasu ka."},{"jp":"お店のインスタを教えてください。","kana":"おみせ の インスタ を おしえて ください。","meaning":"Please tell me the shop's Instagram account.","romaji":"omise no insuta o oshiete kudasai."}],"replies":[{"jp":"はい、やっています。","kana":"はい、 やって います。","meaning":"Yes, I do.","romaji":"hai, yatte imasu."},{"jp":"すみません、やっていないんです。","kana":"すみません、 やって いない ん です。","meaning":"Sorry, I do not.","romaji":"sumimasen, yatte inai n desu."}],"note":"Only ask when the chat has gone well. Asking for a shop's account is more natural than asking for a personal one. Do not push.","level":"useful","romaji":"insuta, yatte imasu ka."},{"id":"smalltalk-end-10","speaker":"staff","jp":"奥様も楽しんでくださいね。","kana":"おくさま も たのしんで ください ね。","meaning":"Please enjoy yourself too (said to your wife).","also_heard":[{"jp":"奥さんもお元気で。","kana":"おくさん も おげんき で。","meaning":"Take care, to your wife too.","romaji":"okusan mo ogenki de."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"奥様 is the polite way staff address your wife. When you speak of her yourself, use 妻.","level":"listen-only","romaji":"okusama mo tanoshinde kudasai ne."},{"id":"smalltalk-end-11","speaker":"you","jp":"失礼します。","kana":"しつれい します。","meaning":"Excuse me, I will be going now.","also_heard":[{"jp":"今日はありがとうございました。","kana":"きょう は ありがとうございました。","meaning":"Thank you for today.","romaji":"kyou wa arigatougozaimashita."},{"jp":"では、これで失礼します。","kana":"では、 これ で しつれい します。","meaning":"Well then, I will be going now.","romaji":"dewa, kore de shitsurei shimasu."}],"replies":[{"jp":"ありがとうございました。お気をつけて。","kana":"ありがとうございました。 おき を つけて。","meaning":"Thank you. Take care.","romaji":"arigatougozaimashita. oki o tsukete."}],"note":"失礼します is a polite way to leave. It works well at a hotel counter or in a shop after a long chat.","level":"core","romaji":"shitsurei shimasu."}]}],"dialogues":[{"title":"Taxi driver chat (Tokyo, evening)","lines":[{"speaker":"staff","jp":"お客さん、外国の方ですか。どちらからですか。","kana":"おきゃくさん、 がいこく の かた です か。 どちら から です か。","meaning":"Are you a foreigner? Where are you from?","romaji":"okyakusan, gaikoku no kata desu ka. dochira kara desu ka."},{"speaker":"you","jp":"エルサルバドルです。中米にあります。","kana":"エルサルバドル です。 ちゅうべい に あります。","meaning":"El Salvador. It is in Central America.","romaji":"erusarubadoru desu. chuubei ni arimasu."},{"speaker":"staff","jp":"へえ、中米ですか。遠いですね。日本は初めてですか。","kana":"へえ、 ちゅうべい です か。 とおい です ね。 にほん は はじめて です か。","meaning":"Oh, Central America? That is far. Is this your first time in Japan?","romaji":"hee, chuubei desu ka. tooi desu ne. nihon wa hajimete desu ka."},{"speaker":"you","jp":"いいえ、前に一度来ました。今回は二回目です。","kana":"いいえ、 まえ に いちど きました。 こんかい は にかいめ です。","meaning":"No, I came once before. This time is my second.","romaji":"iie, mae ni ichido kimashita. konkai wa nikaime desu."},{"speaker":"staff","jp":"そうですか。日本語、お上手ですね。","kana":"そう です か。 にほんご、 おじょうず です ね。","meaning":"I see. Your Japanese is very good.","romaji":"sou desu ka. nihongo, ojouzu desu ne."},{"speaker":"you","jp":"いえいえ、まだまだです。ゆっくりお願いします。","kana":"いえいえ、 まだまだ です。 ゆっくり おねがい します。","meaning":"Not at all, I still have a long way to go. Slowly, please.","romaji":"ieie, madamada desu. yukkuri onegai shimasu."},{"speaker":"staff","jp":"今日は寒いでしょう？","kana":"きょう は さむい でしょう？","meaning":"It is cold today, isn't it?","romaji":"kyou wa samui deshou?"},{"speaker":"
