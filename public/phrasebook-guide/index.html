":"Do you have SIM cards?","also_heard":[{"jp":"メモリーカードはありますか。","kana":"メモリーカード は あります か。","meaning":"Do you have memory cards?","romaji":"memoriikaado wa arimasu ka."}],"replies":[{"jp":"こちらです。","kana":"こちら です。","meaning":"They are here.","romaji":"kochira desu."},{"jp":"観光客向けのSIMはこちらです。","kana":"かんこうきゃくむけ の シム は こちら です。","meaning":"The SIMs for tourists are here.","romaji":"kankoukyakumuke no shimu wa kochira desu."}],"note":"Check whether your phone is unlocked before you buy a SIM.","level":"useful","romaji":"shimukaado wa arimasu ka."},{"id":"souvenirs-elec-10","speaker":"you","jp":"説明書は英語ですか。","kana":"せつめいしょ は えいご です か。","meaning":"Is the manual in English?","also_heard":[{"jp":"英語の説明書はありますか。","kana":"えいご の せつめいしょ は あります か。","meaning":"Is there an English manual?","romaji":"eigo no setsumeisho wa arimasu ka."}],"replies":[{"jp":"日本語のみです。","kana":"にほんご のみ です。","meaning":"It is Japanese only.","romaji":"nihongo nomi desu."},{"jp":"QRコードで英語版が見られます。","kana":"キューアールコード で えいごばん が みられます。","meaning":"You can see the English version with the QR code.","romaji":"kyuuaarukoodo de eigoban ga miraremasu."}],"note":"Many manuals are Japanese only. Ask for the QR code if an English version is online.","level":"useful","romaji":"setsumeisho wa eigo desu ka."},{"id":"souvenirs-elec-11","speaker":"staff","jp":"こちらのレジでお支払いをお願いします。","kana":"こちら の レジ で おしはらい を おねがい します。","meaning":"Please pay at this till.","also_heard":[{"jp":"お会計はあちらです。","kana":"おかいけい は あちら です。","meaning":"Payment is over there.","romaji":"okaikei wa achira desu."},{"jp":"レジはあちらです。","kana":"レジ は あちら です。","meaning":"The till is over there.","romaji":"reji wa achira desu."}],"replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"I understand.","romaji":"wakarimashita."}],"level":"core","romaji":"kochira no reji de oshiharai o onegai shimasu."},{"id":"souvenirs-elec-12","speaker":"staff","jp":"箱を開けて、中身を確認させていただきます。","kana":"はこ を あけて、 なかみ を かくにん させて いただきます。","meaning":"I will open the box and check the contents.","also_heard":[{"jp":"初期不良の確認をします。","kana":"しょきふりょう の かくにん を します。","meaning":"I am checking for faults from the start.","romaji":"shokifuryou no kakunin o shimasu."}],"replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"note":"Staff may check a box before you leave, to make sure the contents are complete.","level":"listen-only","romaji":"hako o akete, nakami o kakunin sasete itadakimasu."}]},{"title":"Tax-free procedure","intro":"Since 1 November 2026 you pay the tax-included price, and the refund comes after you leave Japan.","phrases":[{"id":"souvenirs-taxfree-01","speaker":"staff","jp":"返金方法はどうなさいますか。","kana":"へんきんほうほう は どう なさいます か。","meaning":"How would you like the refund?","also_heard":[{"jp":"免税のお手続きをなさいますか。","kana":"めんぜい の おてつづき を なさいます か。","meaning":"Will you do the tax-free procedure?","romaji":"menzei no otetsuzuki o nasaimasu ka."},{"jp":"免税になさいますか。","kana":"めんぜい に なさいます か。","meaning":"Will you go for tax-free?","romaji":"menzei ni nasaimasu ka."}],"replies":[{"jp":"現金でお願いします。","kana":"げんきん で おねがい します。","meaning":"Cash, please.","romaji":"genkin de onegai shimasu."},{"jp":"カードでお願いします。","kana":"カード で おねがい します。","meaning":"By card, please.","romaji":"kaado de onegai shimasu."}],"note":"Refund methods differ by shop and refund company, and may include cash, card, bank or app. Ask which ones they offer.","level":"core","romaji":"henkinhouhou wa dou nasaimasu ka."},{"id":"souvenirs-taxfree-02","speaker":"staff","jp":"パスポートをお願いします。","kana":"パスポート を おねがい します。","meaning":"Passport, please.","also_heard":[{"jp":"パスポートを見せてください。","kana":"パスポート を みせて ください。","meaning":"Please show your passport.","romaji":"pasupooto o misete kudasai."},{"jp":"原本をお願いします。","kana":"げんぽん を おねがい します。","meaning":"The original, please.","romaji":"genpon o onegai shimasu."}],"replies":[{"jp":"はい、これです。","kana":"はい、 これ です。","meaning":"Yes, here it is.","romaji":"hai, kore desu."}],"note":"Show the original passport, not a photo or copy.","level":"core","romaji":"pasupooto o onegai shimasu."},{"id":"souvenirs-taxfree-03","speaker":"staff","jp":"短期滞在のお客様ですか。","kana":"たんきたいざい の おきゃくさま です か。","meaning":"Are you a short-stay visitor?","also_heard":[{"jp":"日本に住んでいらっしゃいますか。","kana":"にほん に すんで いらっしゃいます か。","meaning":"Do you live in Japan?","romaji":"nihon ni sunde irasshaimasu ka."}],"replies":[{"jp":"はい、観光です。","kana":"はい、 かんこう です。","meaning":"Yes, I am here for sightseeing.","romaji":"hai, kankou desu."}],"note":"短期滞在 means a short-stay visitor. Answer 観光 if you are here on holiday.","level":"core","romaji":"tankitaizai no okyakusama desu ka."},{"id":"souvenirs-taxfree-04","speaker":"staff","jp":"税抜五千円以上のお買い上げで免税の対象になります。","kana":"ぜいぬき ごせんえん いじょう の おかいあげ で めんぜい の たいしょう に なります。","meaning":"Purchases of 5,000 yen or more before tax qualify for tax-free.","replies":[{"jp":"今日の分を合計できますか。","kana":"きょう の ぶん を ごうけい できます か。","meaning":"Can I add up today's purchases?","romaji":"kyou no bun o goukei dekimasu ka."}],"note":"The total before tax must reach 5,000 yen. Ask if purchases from another shop the same day can be combined.","level":"core","romaji":"zeinuki gosen'en ijou no okaiage de menzei no taishou ni narimasu."},{"id":"souvenirs-taxfree-05","speaker":"you","jp":"買ったものを合算してもいいですか。","kana":"かった もの を がっさん して も いい です か。","meaning":"Can I add up what I bought?","also_heard":[{"jp":"別々に買ったものを一緒にできますか。","kana":"べつべつ に かった もの を いっしょ に できます か。","meaning":"Can I combine things I bought separately?","romaji":"betsubetsu ni katta mono o issho ni dekimasu ka."}],"replies":[{"jp":"はい、レシートをお持ちください。","kana":"はい、 レシート を おもち ください。","meaning":"Yes, please bring the receipts.","romaji":"hai, reshiito o omochi kudasai."},{"jp":"同じ日なら大丈夫です。","kana":"おなじ ひ なら だいじょうぶ です。","meaning":"It is fine if it is the same day.","romaji":"onaji hi nara daijoubu desu."}],"note":"Keep all the receipts. Same-day purchases may be combined, but ask the shop to be sure.","level":"useful","romaji":"katta mono o gassan shite mo ii desu ka."},{"id":"souvenirs-taxfree-06","speaker":"you","jp":"食べ物も免税の対象ですか。","kana":"たべもの も めんぜい の たいしょう です か。","meaning":"Does food also qualify for tax-free?","replies":[{"jp":"日本で食べたら、免税になりません。","kana":"にほん で たべたら、 めんぜい に なりません。","meaning":"If you eat it in Japan, it does not qualify for tax-free.","romaji":"nihon de tabetara, menzei ni narimasen."}],"note":"Food, drinks and cosmetics used or eaten in Japan do not qualify for the refund. The old sealed-bag rule no longer applies.","level":"core","romaji":"tabemono mo menzei no taishou desu ka."},{"id":"souvenirs-taxfree-07","speaker":"staff","jp":"出国の前に、空港で税関の確認をお願いします。","kana":"しゅっこく の まえ に、 くうこう で ぜいかん の かくにん を おねがい します。","meaning":"Before you leave Japan, please have customs check at the airport.","also_heard":[{"jp":"出国時に税関で確認が必要です。","kana":"しゅっこくじ に ぜいかん で かくにん が ひつよう です。","meaning":"Customs needs to check it when you leave.","romaji":"shukkokuji ni zeikan de kakunin ga hitsuyou desu."}],"replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, I understand.","romaji":"hai, wakarimashita."}],"note":"Do the check before you check in bags. Keep the tax-free goods in your hand until the check is done.","level":"core","romaji":"shukkoku no mae ni, kuukou de zeikan no kakunin o onegai shimasu."},{"id":"souvenirs-taxfree-08","speaker":"staff","jp":"こちらにサインをお願いします。","kana":"こちら に サイン を おねがい します。","meaning":"Please sign here.","also_heard":[{"jp":"ご署名をお願いします。","kana":"ごしょめい を おねがい します。","meaning":"Your signature, please.","romaji":"goshomei o onegai shimasu."},{"jp":"お名前をローマ字でお願いします。","kana":"おなまえ を ローマじ で おねがい します。","meaning":"Your name in Roman letters, please.","romaji":"onamae o roomaji de onegai shimasu."}],"replies":[{"jp":"はい、ここですね。","kana":"はい、 ここ です ね。","meaning":"Yes, here, right?","romaji":"hai, koko desu ne."}],"level":"core","romaji":"kochira ni sain o onegai shimasu."},{"id":"souvenirs-taxfree-09","speaker":"you","jp":"今は税込みの値段を払うのですか。","kana":"いま は ぜいこみ の ねだん を はらう の です か。","meaning":"Do I pay the tax-included price now?","also_heard":[{"jp":"後で返金されますか。","kana":"あとで へんきん されます か。","meaning":"Will I get a refund later?","romaji":"atode henkin saremasu ka."}],"replies":[{"jp":"はい、一度税込みでお支払いいただきます。","kana":"はい、 いちど ぜいこみ で おしはらい いただきます。","meaning":"Yes, you pay the tax-included price first.","romaji":"hai, ichido zeikomi de oshiharai itadakimasu."},{"jp":"返金は出国したあとになります。","kana":"へんきん は しゅっこく した あと に なります。","meaning":"The refund comes after you leave Japan.","romaji":"henkin wa shukkoku shita ato ni narimasu."}],"note":"Under the new system you pay full tax. The refund is paid after you leave Japan. Staff will explain how.","level":"core","romaji":"ima wa zeikomi no nedan o harau no desu ka."},{"id":"souvenirs-taxfree-10","speaker":"staff","jp":"空港の端末で手続きをしてください。","kana":"くうこう の たんまつ で てつづき を して ください。","meaning":"Please do the procedure at the airport terminal.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, I understand.","romaji":"hai, wakarimashita."}],"note":"The check is done at a machine at the departure airport. Your status decides if the online Visit Japan Web route is open.","level":"useful","romaji":"kuukou no tanmatsu de tetsuzuki o shite kudasai."},{"id":"souvenirs-taxfree-11","speaker":"staff","jp":"ビジットジャパンウェブの画面を見せてください。","kana":"ビジットジャパンウェブ の がめん を みせて ください。","meaning":"Please show me the Visit Japan Web screen.","replies":[{"jp":"これです。","kana":"これ です。","meaning":"Here it is.","romaji":"kore desu."}],"note":"Visit Japan Web can be used at some airports for some visitor statuses. If it does not apply to you, use the airport terminal.","level":"useful","romaji":"bijittojapan'webu no gamen o misete kudasai."},{"id":"souvenirs-taxfree-12","speaker":"you","jp":"レシートをください。","kana":"レシート を ください。","meaning":"May I have the receipt?","also_heard":[{"jp":"領収書をください。","kana":"りょうしゅうしょ を ください。","meaning":"May I have the receipt for my payment?","romaji":"ryoushuusho o kudasai."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you go.","romaji":"hai, douzo."}],"note":"Keep every receipt until your refund has been paid.","level":"useful","romaji":"reshiito o kudasai."}]},{"title":"Markets, street stalls and small craft shops","intro":"Craft shops and stalls in old town areas. Often cash only, and many items are fragile.","phrases":[{"id":"souvenirs-market-01","speaker":"you","jp":"これは手作りですか。","kana":"これ は てづくり です か。","meaning":"Is this handmade?","also_heard":[{"jp":"ハンドメイドですか。","kana":"ハンドメイド です か。","meaning":"Is it handmade?","romaji":"handomeido desu ka."}],"replies":[{"jp":"はい、作家さんの手作りです。","kana":"はい、 さっかさん の てづくり です。","meaning":"Yes, the artist made it by hand.","romaji":"hai, sakkasan no tezukuri desu."},{"jp":"工場で作っています。","kana":"こうじょう で つくって います。","meaning":"It is made in a factory.","romaji":"koujou de tsukutte imasu."}],"level":"useful","romaji":"kore wa tezukuri desu ka."},{"id":"souvenirs-market-02","speaker":"you","jp":"写真を撮ってもいいですか。","kana":"しゃしん を とって も いい です か。","meaning":"May I take a photo?","also_heard":[{"jp":"撮影は大丈夫ですか。","kana":"さつえい は だいじょうぶ です か。","meaning":"Is filming all right?","romaji":"satsuei wa daijoubu desu ka."}],"replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Go ahead.","romaji":"douzo."},{"jp":"撮影はご遠慮ください。","kana":"さつえい は ごえんりょ ください。","meaning":"Please refrain from photos.","romaji":"satsuei wa goenryo kudasai."}],"note":"ご遠慮ください means please refrain from doing it. Look for signs before you take photos.","level":"core","romaji":"shashin o totte mo ii desu ka."},{"id":"souvenirs-market-03","speaker":"staff","jp":"現金のみになります。","kana":"げんきん のみ に なります。","meaning":"It is cash only.","also_heard":[{"jp":"カードは使えません。","kana":"カード は つかえません。","meaning":"Cards cannot be used.","romaji":"kaado wa tsukaemasen."},{"jp":"QRコード決済のみです。","kana":"キューアールコード けっさい のみ です。","meaning":"Only QR code payment is accepted.","romaji":"kyuuaarukoodo kessai nomi desu."}],"replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"I understand.","romaji":"wakarimashita."}],"note":"Stalls often take cash only. Get enough yen before you go to a market.","level":"core","romaji":"genkin nomi ni narimasu."},{"id":"souvenirs-market-04","speaker":"you","jp":"少し安くなりませんか。","kana":"すこし やすく なりません か。","meaning":"Could it be a little cheaper?","also_heard":[{"jp":"まとめて買ったら安くなりますか。","kana":"まとめて かったら やすく なります か。","meaning":"Would it be cheaper if I bought several?","romaji":"matomete kattara yasuku narimasu ka."}],"replies":[{"jp":"すみません、定価なんです。","kana":"すみません、 ていか なん です。","meaning":"Sorry, it is the set price.","romaji":"sumimasen, teika nan desu."},{"jp":"二つで千円にします。","kana":"ふたつ で せんえん に します。","meaning":"I will make it 1,000 yen for two.","romaji":"futatsu de sen'en ni shimasu."}],"note":"Bargaining is uncommon in Japan. Ask only when buying several, and accept a no politely.","level":"useful","romaji":"sukoshi yasuku narimasen ka."},{"id":"souvenirs-market-05","speaker":"you","jp":"割れ物なので、しっかり包んでもらえますか。","kana":"われもの なので、 しっかり つつんで もらえます か。","meaning":"It is fragile, so could you wrap it well?","also_heard":[{"jp":"壊れないように包んでください。","kana":"こわれない よう に つつんで ください。","meaning":"Please wrap it so it does not break.","romaji":"kowarenai you ni tsutsunde kudasai."}],"replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."},{"jp":"プチプチで包みますね。","kana":"プチプチ で つつみます ね。","meaning":"I will wrap it in bubble wrap.","romaji":"puchipuchi de tsutsumimasu ne."}],"level":"core","romaji":"waremono nanode, shikkari tsutsunde moraemasu ka."},{"id":"souvenirs-market-06","speaker":"you","jp":"手荷物で持ち込みたいです。","kana":"てにもつ で もちこみ たい です。","meaning":"I want to carry it in my hand luggage.","also_heard":[{"jp":"機内に持ち込みます。","kana":"きない に もちこみます。","meaning":"I will take it on board.","romaji":"kinai ni mochikomimasu."}],"replies":[{"jp":"では、小さめの箱にしますね。","kana":"では、 ちいさめ の はこ に します ね。","meaning":"Then I will use a smaller box.","romaji":"dewa, chiisame no hako ni shimasu ne."}],"note":"Check the carry-on rules before you buy liquids or large boxes. They may need to go in checked bags.","level":"useful","romaji":"tenimotsu de mochikomi tai desu."},{"id":"souvenirs-market-07","speaker":"you","jp":"全部でいくらですか。","kana":"ぜんぶ で いくら です か。","meaning":"How much in total?","also_heard":[{"jp":"これとそれでいくらですか。","kana":"これ と それ で いくら です か。","meaning":"How much for this and that?","romaji":"kore to sore de ikura desu ka."}],"replies":[{"jp":"全部で二千円です。","kana":"ぜんぶ で にせんえん です。","meaning":"The total is 2,000 yen.","romaji":"zenbu de nisen'en desu."}],"level":"core","romaji":"zenbu de ikura desu ka."},{"id":"souvenirs-market-08","speaker":"you","jp":"日本製ですか。","kana":"にほんせい です か。","meaning":"Is it made in Japan?","also_heard":[{"jp":"国産ですか。","kana":"こくさん です か。","meaning":"Is it domestic?","romaji":"kokusan desu ka."},{"jp":"本物ですか。","kana":"ほんもの です か。","meaning":"Is it genuine?","romaji":"honmono desu ka."}],"replies":[{"jp":"はい、日本製です。","kana":"はい、 にほんせい です。","meaning":"Yes, it is made in Japan.","romaji":"hai, nihonsei desu."}],"level":"useful","romaji":"nihonsei desu ka."},{"id":"souvenirs-market-09","speaker":"staff","jp":"ご自由にお試しください。","kana":"ごじゆう に おためし ください。","meaning":"Please feel free to try it.","also_heard":[{"jp":"ご自由にどうぞ。","kana":"ごじゆう に どうぞ。","meaning":"Please help yourself.","romaji":"gojiyuu ni douzo."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Free to try means the sample is for you to test. Stay within what the sign allows.","level":"listen-only","romaji":"gojiyuu ni otameshi kudasai."},{"id":"souvenirs-market-10","speaker":"staff","jp":"京都の伝統工芸品です。","kana":"きょうと の でんとうこうげいひん です。","meaning":"It is a traditional craft from Kyoto.","replies":[{"jp":"きれいですね。","kana":"きれい です ね。","meaning":"It is beautiful, isn't it.","romaji":"kirei desu ne."}],"level":"listen-only","romaji":"kyouto no dentoukougeihin desu."}]},{"title":"Shipping and packing","intro":"Sending boxes home or to your hotel, extra bags, and protecting fragile goods.","phrases":[{"id":"souvenirs-ship-01","speaker":"you","jp":"これを海外に送れますか。","kana":"これ を かいがい に おくれます か。","meaning":"Can you send this overseas?","also_heard":[{"jp":"国際便で送れますか。","kana":"こくさいびん で おくれます か。","meaning":"Can you send it by international post?","romaji":"kokusaibin de okuremasu ka."}],"replies":[{"jp":"当店では海外発送はできません。","kana":"とうてん で は かいがいはっそう は できません。","meaning":"This shop cannot ship overseas.","romaji":"touten de wa kaigaihassou wa dekimasen."},{"jp":"郵便局なら送れます。","kana":"ゆうびんきょく なら おくれます。","meaning":"The post office can send it.","romaji":"yuubinkyoku nara okuremasu."}],"note":"Many shops do not ship abroad. Post offices offer international parcels.","level":"core","romaji":"kore o kaigai ni okuremasu ka."},{"id":"souvenirs-ship-02","speaker":"you","jp":"ホテルに送ってもらえますか。","kana":"ホテル に おくって もらえます か。","meaning":"Could you send it to my hotel?","also_heard":[{"jp":"宿泊先に配送できますか。","kana":"しゅくはくさき に はいそう できます か。","meaning":"Can you deliver it to my hotel?","romaji":"shukuhakusaki ni haisou dekimasu ka."}],"replies":[{"jp":"はい、ホテルの名前と日付をお願いします。","kana":"はい、 ホテル の なまえ と ひづけ を おねがい します。","meaning":"Yes, please give me the hotel name and the date.","romaji":"hai, hoteru no namae to hizuke o onegai shimasu."}],"note":"Have the hotel name and the delivery date ready. Hotel delivery depends on the shop, so ask first.","level":"core","romaji":"hoteru ni okutte moraemasu ka."},{"id":"souvenirs-ship-03","speaker":"staff","jp":"お届け先のご住所をお願いします。","kana":"おとどけさき の ごじゅうしょ を おねがい します。","meaning":"Please give me the delivery address.","also_heard":[{"jp":"配達日はいつがいいですか。","kana":"はいたつび は いつ が いい です か。","meaning":"What day would you like it delivered?","romaji":"haitatsubi wa itsu ga ii desu ka."}],"replies":[{"jp":"ホテルの名前です。","kana":"ホテル の なまえ です。","meaning":"It is the hotel name.","romaji":"hoteru no namae desu."},{"jp":"十二月二十日です。","kana":"じゅうにがつ はつか です。","meaning":"It is the 20th of December.","romaji":"juunigatsu hatsuka desu."}],"level":"listen-only","romaji":"otodokesaki no gojuusho o onegai shimasu."},{"id":"souvenirs-ship-04","speaker":"you","jp":"箱をもう一つください。","kana":"はこ を もう ひとつ ください。","meaning":"One more box, please.","also_heard":[{"jp":"大きい袋をください。","kana":"おおきい ふくろ を ください。","meaning":"A large bag, please.","romaji":"ookii fukuro o kudasai."},{"jp":"段ボールはありますか。","kana":"だんボール は あります か。","meaning":"Do you have cardboard boxes?","romaji":"danbooru wa arimasu ka."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you go.","romaji":"hai, douzo."},{"jp":"有料です。","kana":"ゆうりょう です。","meaning":"It costs extra.","romaji":"yuuryou desu."}],"note":"Boxes may cost extra. Ask the price before you take one.","level":"useful","romaji":"hako o mou hitotsu kudasai."},{"id":"souvenirs-ship-05","speaker":"you","jp":"プチプチで包んでもらえますか。","kana":"プチプチ で つつんで もらえます か。","meaning":"Could you wrap it in bubble wrap?","also_heard":[{"jp":"緩衝材で包んでください。","kana":"かんしょうざい で つつんで ください。","meaning":"Please wrap it in cushioning.","romaji":"kanshouzai de tsutsunde kudasai."}],"replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"プチプチ is bubble wrap. You will hear the word often in shops.","level":"core","romaji":"puchipuchi de tsutsunde moraemasu ka."},{"id":"souvenirs-ship-06","speaker":"you","jp":"割れ物のシールを貼ってください。","kana":"われもの の シール を はって ください。","meaning":"Please put a fragile sticker on it.","also_heard":[{"jp":"取り扱い注意のシールをお願いします。","kana":"とりあつかいちゅうい の シール を おねがい します。","meaning":"A handle-with-care sticker, please.","romaji":"toriatsukaichuui no shiiru o onegai shimasu."}],"replies":[{"jp":"はい、貼っておきますね。","kana":"はい、 はって おきます ね。","meaning":"Yes, I will stick one on.","romaji":"hai, hatte okimasu ne."}],"level":"useful","romaji":"waremono no shiiru o hatte kudasai."},{"id":"souvenirs-ship-07","speaker":"you","jp":"スーツケースを買いたいです。","kana":"スーツケース を かいたい です。","meaning":"I want to buy a suitcase.","also_heard":[{"jp":"大きいバッグはありますか。","kana":"おおきい バッグ は あります か。","meaning":"Do you have a large bag?","romaji":"ookii baggu wa arimasu ka."}],"replies":[{"jp":"こちらです。サイズはどのくらいですか。","kana":"こちら です。 サイズ は どのくらい です か。","meaning":"Here it is. What size do you need?","romaji":"kochira desu. saizu wa donokurai desu ka."}],"level":"useful","romaji":"suutsukeesu o kaitai desu."},{"id":"souvenirs-ship-08","speaker":"you","jp":"軽くて丈夫なものはありますか。","kana":"かるくて じょうぶ な もの は あります か。","meaning":"Do you have one that is light and sturdy?","also_heard":[{"jp":"軽いバッグはありますか。","kana":"かるい バッグ は あります か。","meaning":"Do you have a light bag?","romaji":"karui baggu wa arimasu ka."}],"replies":[{"jp":"こちらは軽いです。","kana":"こちら は かるい です。","meaning":"This one is light.","romaji":"kochira wa karui desu."}],"level":"useful","romaji":"karukute joubu na mono wa arimasu ka."},{"id":"souvenirs-ship-09","speaker":"you","jp":"荷物の重さを量ってもいいですか。","kana":"にもつ の おもさ を はかって も いい です か。","meaning":"May I weigh my bag?","also_heard":[{"jp":"重さは何キロですか。","kana":"おもさ は なん キロ です か。","meaning":"How many kilos is it?","romaji":"omosa wa nan kiro desu ka."}],"replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Go ahead.","romaji":"douzo."},{"jp":"二十キロです。","kana":"にじゅう キロ です。","meaning":"It is 20 kilos.","romaji":"nijuu kiro desu."}],"note":"Check your airline's weight limit before you pack.","level":"useful","romaji":"nimotsu no omosa o hakatte mo ii desu ka."},{"id":"souvenirs-ship-10","speaker":"staff","jp":"送料は千二百円になります。","kana":"そうりょう は せん にひゃく えん に なります。","meaning":"The shipping is 1,200 yen.","also_heard":[{"jp":"着払いになります。","kana":"ちゃくばらい に なります。","meaning":"It is cash on delivery.","romaji":"chakubarai ni narimasu."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"level":"listen-only","romaji":"souryou wa sen nihyaku en ni narimasu."},{"id":"souvenirs-ship-11","speaker":"you","jp":"何日くらいで届きますか。","kana":"なんにち くらい で とどきます か。","meaning":"About how many days will it take to arrive?","also_heard":[{"jp":"いつ届きますか。","kana":"いつ とどきます か。","meaning":"When will it arrive?","romaji":"itsu todokimasu ka."}],"replies":[{"jp":"三日ほどかかります。","kana":"みっか ほど かかります。","meaning":"It takes about three days.","romaji":"mikka hodo kakarimasu."}],"note":"Delivery time depends on the route and service. Ask the shop for an expected date.","level":"core","romaji":"nannichi kurai de todokimasu ka."}]},{"title":"Returns and problems","intro":"Calm, polite phrases. Returns are strict, so ask for an exchange first.","phrases":[{"id":"souvenirs-return-01","speaker":"you","jp":"すみません、違う商品が入っています。","kana":"すみません、 ちがう しょうひん が はいって います。","meaning":"Excuse me, the wrong item is in the bag.","also_heard":[{"jp":"頼んだものと違います。","kana":"たのんだ もの と ちがいます。","meaning":"It is not what I ordered.","romaji":"tanonda mono to chigaimasu."}],"replies":[{"jp":"失礼しました、すぐ交換します。","kana":"しつれい しました、 すぐ こうかん します。","meaning":"Sorry about that, I will exchange it right away.","romaji":"shitsurei shimashita, sugu koukan shimasu."}],"level":"core","romaji":"sumimasen, chigau shouhin ga haitte imasu."},{"id":"souvenirs-return-02","speaker":"you","jp":"これは壊れています。","kana":"これ は こわれて います。","meaning":"This is broken.","also_heard":[{"jp":"傷があります。","kana":"きず が あります。","meaning":"There is a scratch.","romaji":"kizu ga arimasu."},{"jp":"割れています。","kana":"われて います。","meaning":"It is cracked.","romaji":"warete imasu."}],"replies":[{"jp":"申し訳ありません。","kana":"もうしわけ ありません。","meaning":"I am very sorry.","romaji":"moushiwake arimasen."}],"level":"useful","romaji":"kore wa kowarete imasu."},{"id":"souvenirs-return-03","speaker":"you","jp":"交換をお願いします。","kana":"こうかん を おねがい します。","meaning":"I would like an exchange, please.","also_heard":[{"jp":"返品したいです。","kana":"へんぴん したい です。","meaning":"I would like to return it.","romaji":"henpin shitai desu."}],"replies":[{"jp":"交換でよろしいですか。","kana":"こうかん で よろしい です か。","meaning":"Is an exchange all right?","romaji":"koukan de yoroshii desu ka."},{"jp":"返品はできません。","kana":"へんぴん は できません。","meaning":"Returns are not possible.","romaji":"henpin wa dekimasen."}],"note":"Returns of opened items are often refused. An exchange is the easiest request.","level":"core","romaji":"koukan o onegai shimasu."},{"id":"souvenirs-return-04","speaker":"you","jp":"レシートがあります。","kana":"レシート が あります。","meaning":"I have the receipt.","also_heard":[{"jp":"レシートはここです。","kana":"レシート は ここ です。","meaning":"The receipt is here.","romaji":"reshiito wa koko desu."}],"replies":[{"jp":"では、確認します。","kana":"では、 かくにん します。","meaning":"Then I will check it.","romaji":"dewa, kakunin shimasu."}],"level":"core","romaji":"reshiito ga arimasu."},{"id":"souvenirs-return-05","speaker":"staff","jp":"返品はできかねます。","kana":"へんぴん は できかねます。","meaning":"We are unable to accept returns.","also_heard":[{"jp":"開封済みですので。","kana":"かいふうずみ です ので。","meaning":"Because it has been opened.","romaji":"kaifuuzumi desu node."},{"jp":"免税品は返品できません。","kana":"めんぜいひん は へんぴん できません。","meaning":"Tax-free goods cannot be returned.","romaji":"menzeihin wa henpin dekimasen."}],"replies":[{"jp":"そうですか、わかりました。","kana":"そう です か、 わかりました。","meaning":"I see, I understand.","romaji":"sou desu ka, wakarimashita."}],"note":"This is a polite refusal. Accept it calmly, and ask about an exchange if the item is wrong or damaged.","level":"listen-only","romaji":"henpin wa dekikanemasu."},{"id":"souvenirs-return-06","speaker":"you","jp":"二回請求されています。","kana":"にかい せいきゅう されて います。","meaning":"I was charged twice.","also_heard":[{"jp":"二重に引き落とされています。","kana":"にじゅう に ひきおとされて います。","meaning":"I was debited twice.","romaji":"nijuu ni hikiotosarete imasu."}],"replies":[{"jp":"確認しますので、少々お待ちください。","kana":"かくにん します ので、 しょうしょう おまち ください。","meaning":"I will check, so please wait a moment.","romaji":"kakunin shimasu node, shoushou omachi kudasai."}],"note":"Keep your receipt and card statement, and show them to the staff.","level":"useful","romaji":"nikai seikyuu sarete imasu."},{"id":"souvenirs-return-07","speaker":"you","jp":"忘れ物をしました。","kana":"わすれもの を しました。","meaning":"I left something behind.","also_heard":[{"jp":"白い袋を忘れたと思います。","kana":"しろい ふくろ を わすれた と おもいます。","meaning":"I think I left a white bag behind.","romaji":"shiroi fukuro o wasureta to omoimasu."}],"replies":[{"jp":"いつ頃ですか。","kana":"いつごろ です か。","meaning":"When was it?","romaji":"itsugoro desu ka."},{"jp":"どんな物ですか。","kana":"どんな もの です か。","meaning":"What kind of item is it?","romaji":"donna mono desu ka."}],"note":"Lost items are often held at the counter. Tell the staff when and where you shopped.","level":"core","romaji":"wasuremono o shimashita."},{"id":"souvenirs-return-08","speaker":"you","jp":"十一時ごろ、ここで買い物をしました。","kana":"じゅういちじ ごろ、 ここ で かいもの を しました。","meaning":"I shopped here around eleven o'clock.","also_heard":[{"jp":"今日の昼です。","kana":"きょう の ひる です。","meaning":"It was today at lunchtime.","romaji":"kyou no hiru desu."}],"replies":[{"jp":"少々お待ちください、確認します。","kana":"しょうしょう おまち ください、 かくにん します。","meaning":"Please wait a moment, I will check.","romaji":"shoushou omachi kudasai, kakunin shimasu."}],"level":"useful","romaji":"juuichiji goro, koko de kaimono o shimashita."},{"id":"souvenirs-return-09","speaker":"staff","jp":"こちらでお預かりしております。","kana":"こちら で おあずかり して おります。","meaning":"We are holding it here.","also_heard":[{"jp":"落とし物として預かっています。","kana":"おとしもの として あずかって います。","meaning":"We are keeping it as a lost item.","romaji":"otoshimono toshite azukatte imasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"level":"listen-only","romaji":"kochira de oazukari shite orimasu."},{"id":"souvenirs-return-10","speaker":"staff","jp":"店長を呼んでまいります。","kana":"てんちょう を よんで まいります。","meaning":"I will go and get the manager.","also_heard":[{"jp":"責任者を呼びます。","kana":"せきにんしゃ を よびます。","meaning":"I will call the person in charge.","romaji":"sekininsha o yobimasu."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"level":"listen-only","romaji":"tenchou o yonde mairimasu."}]}],"dialogues":[{"title":"Boxed sweets as gifts, separate bags (Tokyo Station)","lines":[{"speaker":"you","jp":"すみません、これは何個入りですか。","kana":"すみません、 これ は なんこいり です か。","meaning":"Excuse me, how many pieces are in this?","romaji":"sumimasen, kore wa nankoiri desu ka."},{"speaker":"staff","jp":"八個入りと十二個入りがあります。","kana":"はっこいり と じゅうにこいり が あります。","meaning":"There are boxes of 8 and of 12.","romaji":"hakkoiri to juunikoiri ga arimasu."},{"speaker":"you","jp":"一つずつ包装されていますか。","kana":"ひとつずつ ほうそう されて います か。","meaning":"Is each one wrapped separately?","romaji":"hitotsuzutsu housou sarete imasu ka."},{"speaker":"staff","jp":"はい、個包装になっています。","kana":"はい、 こほうそう に なって います。","meaning":"Yes, each one is individually wrapped.","romaji":"hai, kohousou ni natte imasu."},{"speaker":"you","jp":"十二個入りを三つください。それと、小分けの袋を三枚お願いします。","kana":"じゅうにこいり を みっつ ください。 それ と、 こわけ の ふくろ を さんまい おねがい します。","meaning":"Three of the 12-piece boxes, please. And three small bags.","romaji":"juunikoiri o mittsu kudasai. sore to, kowake no fukuro o sanmai onegai shimasu."},{"speaker":"staff","jp":"かしこまりました。ご自宅用ですか、贈り物ですか。","kana":"かしこまりました。 ごじたくよう です か、 おくりもの です か。","meaning":"Certainly. Is it for home or a gift?","romaji":"kashikomarimashita. gojitakuyou desu ka, okurimono desu ka."},{"speaker":"you","jp":"お土産です。のしは大丈夫です。","kana":"おみやげ です。 のし は だいじょうぶ です。","meaning":"They are souvenirs. No noshi, thanks.","romaji":"omiyage desu. noshi wa daijoubu desu."},{"speaker":"staff","jp":"保冷剤はお付けしますか。","kana":"ほれいざい は おつけ します か。","meaning":"Would you like a cold pack?","romaji":"horeizai wa otsuke shimasu ka."},{"speaker":"you","jp":"大丈夫です。ありがとうございます。","kana":"だいじょうぶ です。 ありがとう ございます。","meaning":"No thanks. Thank you.","romaji":"daijoubu desu. arigatou gozaimasu."}]},{"title":"Tax-free counter (after November 2026)","lines":[{"speaker":"you","jp":"すみません、免税カウンターはどこですか。","kana":"すみません、 めんぜい カウンター は どこ です か。","meaning":"Excuse me, where is the tax-free counter?","romaji":"sumimasen, menzei kauntaa wa doko desu ka."},{"speaker":"staff","jp":"七階です。エレベーターはあちらです。","kana":"ななかい です。 エレベーター は あちら です。","meaning":"It is on the seventh floor. The elevator is over there.","romaji":"nanakai desu. erebeetaa wa achira desu."},{"speaker":"staff","jp":"免税のお手続きですね。パスポートをお願いします。","kana":"めんぜい の おてつづき です ね。 パスポート を おねがい します。","meaning":"Tax-free procedure, right? Passport, please.","romaji":"menzei no otetsuzuki desu ne. pasupooto o onegai shimasu."},{"speaker":"you","jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."},{"speaker":"staff","jp":"税抜五千円以上なので大丈夫です。返金方法はどうなさいますか。","kana":"ぜいぬき ごせんえん いじょう なので だいじょうぶ です。 へんきんほうほう は どう なさいます か。","meaning":"It is over 5,000 yen before tax, so that is fine. How would you like the refund?","romaji":"zeinuki gosen'en ijou nanode daijoubu desu. henkinhouhou wa dou nasaimasu ka."},{"speaker":"you","jp":"今は税込みの値段を払うのですか。","kana":"いま は ぜいこみ の ねだん を はらう の です か。","meaning":"Do I pay the tax-included price now?","romaji":"ima wa zeikomi no nedan o harau no desu ka."},{"speaker":"staff","jp":"はい、税込みでお支払いいただき、返金は出国したあとになります。","kana":"はい、 ぜいこみ で おしはらい いただき、 へんきん は しゅっこく した あと に なります。","meaning":"Yes, you pay with tax, and the refund comes after you leave Japan.","romaji":"hai, zeikomi de oshiharai itadaki, henkin wa shukkoku shita ato ni narimasu."},{"speaker":"you","jp":"わかりました。空港で税関の確認をするのですね。","kana":"わかりました。 くうこう で ぜいかん の かくにん を する の です ね。","meaning":"I see. So I do the customs check at the airport, right?","romaji":"wakarimashita. kuukou de zeikan no kakunin o suru no desu ne."},{"speaker":"staff","jp":"はい、お荷物を預ける前に確認してください。","kana":"はい、 おにもつ を あずける まえ に かくにん して ください。","meaning":"Yes, please do the check before you check your bags.","romaji":"hai, onimotsu o azukeru mae ni kakunin shite kudasai."},{"speaker":"you","jp":"はい、レシートをください。","kana":"はい、 レシート を ください。","meaning":"Yes. The receipt, please.","romaji":"hai, reshiito o kudasai."},{"speaker":"staff","jp":"はい、どうぞ。ありがとうございました。","kana":"はい、 どうぞ。 ありがとう ございました。","meaning":"Here you go. Thank you.","romaji":"hai, douzo. arigatou gozaimashita."}]},{"title":"Electronics shop: does it work overseas?","lines":[{"speaker":"you","jp":"すみません、このドライヤーは海外で使えますか。","kana":"すみません、 この ドライヤー は かいがい で つかえます か。","meaning":"Excuse me, does this hair dryer work overseas?","romaji":"sumimasen, kono doraiyaa wa kaigai de tsukaemasu ka."},{"speaker":"staff","jp":"少々お待ちください。こちらは百ボルトのみです。","kana":"しょうしょう おまち ください。 こちら は ひゃく ボルト の み です。","meaning":"One moment. This one is 100 volts only.","romaji":"shoushou omachi kudasai. kochira wa hyaku boruto no mi desu."},{"speaker":"you","jp":"変圧器が必要ですか。","kana":"へんあつき が ひつよう です か。","meaning":"Do I need a transformer?","romaji":"hen'atsuki ga hitsuyou desu ka."},{"speaker":"staff","jp":"はい、必要です。海外対応のものはこちらです。","kana":"はい、 ひつよう です。 かいがいたいおう の もの は こちら です。","meaning":"Yes, you do. The overseas-ready ones are here.","romaji":"hai, hitsuyou desu. kaigaitaiou no mono wa kochira desu."},{"speaker":"you","jp":"英語の説明書はありますか。","kana":"えいご の せつめいしょ は あります か。","meaning":"Is there an English manual?","romaji":"eigo no setsumeisho wa arimasu ka."},{"speaker":"staff","jp":"QRコードで英語版が見られます。","kana":"キューアールコード で えいごばん が みられます。","meaning":"You can see the English version with the QR code.","romaji":"kyuuaarukoodo de eigoban ga miraremasu."},{"speaker":"you","jp":"保証は海外でも大丈夫ですか。","kana":"ほしょう は かいがい でも だいじょうぶ です か。","meaning":"Is the warranty valid abroad too?","romaji":"hoshou wa kaigai demo daijoubu desu ka."},{"speaker":"staff","jp":"国内のみになります。ポイントカードはお持ちですか。","kana":"こくない の み に なります。 ポイントカード は おもち です か。","meaning":"It is for Japan only. Do you have a points card?","romaji":"kokunai no mi ni narimasu. pointokaado wa omochi desu ka."},{"speaker":"you","jp":"いいえ、免税でお願いします。","kana":"いいえ、 めんぜい で おねがい します。","meaning":"No, tax-free please.","romaji":"iie, menzei de onegai shimasu."}]}],"signs":[{"jp":"お土産","kana":"おみやげ","meaning":"Souvenir","where":"Signs at station and airport gift shops","romaji":"omiyage"},{"jp":"名物","kana":"めいぶつ","meaning":"Local speciality","where":"Posters and shelf tags for regional sweets","romaji":"meibutsu"},{"jp":"限定","kana":"げんてい","meaning":"Limited","where":"Shelf tags and packaging for limited-edition goods","romaji":"gentei"},{"jp":"人気","kana":"にんき","meaning":"Popular","where":"Shelf tags and posters for best sellers","romaji":"ninki"},{"jp":"おすすめ","kana":"おすすめ","meaning":"Recommended","where":"Staff pick cards near displays","romaji":"osusume"},{"jp":"新商品","kana":"しんしょうひん","meaning":"New product","where":"Shelf tags on new arrivals","romaji":"shinshouhin"},{"jp":"賞味期限","kana":"しょうみきげん","meaning":"Best-before date","where":"Printed on the box or bag of dry snacks and sweets","romaji":"shoumikigen"},{"jp":"消費期限","kana":"しょうひきげん","meaning":"Use-by date","where":"Printed on fresh items such as cakes and pudding","romaji":"shouhikigen"},{"jp":"要冷蔵","kana":"ようれいぞう","meaning":"Keep refrigerated","where":"Label on chilled items","romaji":"youreizou"},{"jp":"常温","kana":"じょうおん","meaning":"Room temperature","where":"Storage label on shelf-stable items","romaji":"jouon"},{"jp":"個包装","kana":"こほうそう","meaning":"Individually wrapped","where":"Label on boxes where each piece has its own wrapper","romaji":"kohousou"},{"jp":"何個入り","kana":"なんこいり","meaning":"How many pieces inside","where":"On the box, near the product name","romaji":"nankoiri"},{"jp":"試食","kana":"ししょく","meaning":"Sample tasting","where":"Sample tables in food halls","romaji":"shishoku"},{"jp":"免税","kana":"めんぜい","meaning":"Tax-free","where":"Sticker at a shop entrance or window","romaji":"menzei"},{"jp":"免税カウンター","kana":"めんぜい カウンター","meaning":"Tax-free counter","where":"Floor guides and signs at department stores","romaji":"menzei kauntaa"},{"jp":"税込","kana":"ぜいこみ","meaning":"Tax included","where":"Price tags","romaji":"zeikomi"},{"jp":"税抜","kana":"ぜいぬき","meaning":"Tax excluded","where":"Price tags, showing the price before tax","romaji":"zeinuki"},{"jp":"割引","kana":"わりびき","meaning":"Discount","where":"Sale signs in shops","romaji":"waribiki"},{"jp":"半額","kana":"はんがく","meaning":"Half price","where":"Sale stickers on food and goods","romaji":"hangaku"},{"jp":"お買い得","kana":"おかいどく","meaning":"Good value","where":"Sale tags and posters","romaji":"okaidoku"},{"jp":"売り切れ","kana":"うりきれ","meaning":"Sold out","where":"Signs on empty shelves or displays","romaji":"urikire"},{"jp":"在庫あり","kana":"ざいこあり","meaning":"In stock","where":"Shelf labels and some online listings","romaji":"zaikoari"},{"jp":"現金のみ","kana":"げんきんのみ","meaning":"Cash only","where":"Sign at a stall or counter","romaji":"genkinnomi"},{"jp":"レジ","kana":"レジ","meaning":"Register","where":"Signs above checkouts","romaji":"reji"},{"jp":"案内所","kana":"あんないじょ","meaning":"Information desk","where":"Floor guides and signs near entrances","romaji":"annaijo"},{"jp":"階","kana":"かい","meaning":"Floor","where":"Floor guides and elevator signs","romaji":"kai"},{"jp":"地下","kana":"ちか","meaning":"Basement","where":"Floor guides and elevator buttons","romaji":"chika"},{"jp":"エレベーター","kana":"エレベーター","meaning":"Elevator","where":"Floor guides and signs in department stores","romaji":"erebeetaa"},{"jp":"お一人様二点限り","kana":"おひとりさま にてんかぎり","meaning":"Limit of two per person","where":"Sign by popular sweets or electronics","romaji":"ohitorisama nitenkagiri"},{"jp":"割れ物注意","kana":"われものちゅうい","meaning":"Fragile, handle with care","where":"Stickers on boxes and packing at the counter","romaji":"waremonochuui"},{"jp":"整理券","kana":"せいりけん","meaning":"Numbered ticket","where":"Ticket machine or desk at popular sweets shops","romaji":"seiriken"},{"jp":"最後尾","kana":"さいこうび","meaning":"End of the queue","where":"Sign held up at the back of a line","romaji":"saikoubi"}],"vocab":[{"title":"Gift words","items":[{"jp":"贈り物","kana":"おくりもの","meaning":"gift","romaji":"okurimono"},{"jp":"プレゼント","kana":"プレゼント","meaning":"present","romaji":"purezento"},{"jp":"包装","kana":"ほうそう","meaning":"wrapping","romaji":"housou"},{"jp":"ラッピング","kana":"ラッピング","meaning":"gift wrapping","romaji":"rappingu"},{"jp":"のし","kana":"のし","meaning":"noshi, formal gift paper","romaji":"noshi"},{"jp":"手提げ袋","kana":"てさげぶくろ","meaning":"carry bag with handles","romaji":"tesagebukuro"},{"jp":"紙袋","kana":"かみぶくろ","meaning":"paper bag","romaji":"kamibukuro"},{"jp":"リボン","kana":"リボン","meaning":"ribbon","romaji":"ribon"},{"jp":"値札","kana":"ねふだ","meaning":"price tag","romaji":"nefuda"},{"jp":"自宅用","kana":"じたくよう","meaning":"for home use","romaji":"jitakuyou"},{"jp":"贈答用","kana":"ぞうとうよう","meaning":"for giving as a gift","romaji":"zoutouyou"},{"jp":"人数分","kana":"にんずうぶん","meaning":"one for each person","romaji":"ninzuubun"}]},{"title":"Food-souvenir words","items":[{"jp":"饅頭","kana":"まんじゅう","meaning":"steamed bun-style sweet with filling","romaji":"manjuu"},{"jp":"羊羹","kana":"ようかん","meaning":"sweet bean jelly block","romaji":"youkan"},{"jp":"煎餅","kana":"せんべい","meaning":"rice cracker","romaji":"senbei"},{"jp":"抹茶","kana":"まっちゃ","meaning":"powdered green tea","romaji":"matcha"},{"jp":"詰め合わせ","kana":"つめあわせ","meaning":"assorted box","romaji":"tsumeawase"},{"jp":"ばらまき用","kana":"ばらまきよう","meaning":"for giving to many people","romaji":"baramakiyou"},{"jp":"甘さ控えめ","kana":"あまさひかえめ","meaning":"lightly sweetened","romaji":"amasahikaeme"},{"jp":"日持ち","kana":"ひもち","meaning":"shelf life","romaji":"himochi"},{"jp":"クッキー","kana":"クッキー","meaning":"cookies","romaji":"kukkii"},{"jp":"生菓子","kana":"なまがし","meaning":"fresh cake","romaji":"namagashi"},{"jp":"もみじ饅頭","kana":"もみじまんじゅう","meaning":"maple-leaf shaped sweet from Hiroshima","romaji":"momijimanjuu"},{"jp":"ういろう","kana":"ういろう","meaning":"rice-flour jelly sweet from Nagoya","romaji":"uirou"},{"jp":"神戸プリン","kana":"こうべプリン","meaning":"pudding from Kobe","romaji":"koubepurin"},{"jp":"東京ばな奈","kana":"とうきょうばなな","meaning":"sponge-cake sweet from Tokyo","romaji":"toukyoubanana"}]},{"title":"Packing words","items":[{"jp":"箱","kana":"はこ","meaning":"box","romaji":"hako"},{"jp":"段ボール","kana":"だんボール","meaning":"cardboard box","romaji":"danbooru"},{"jp":"プチプチ","kana":"プチプチ","meaning":"bubble wrap","romaji":"puchipuchi"},{"jp":"ガムテープ","kana":"ガムテープ","meaning":"packing tape","romaji":"gamuteepu"},{"jp":"割れ物","kana":"われもの","meaning":"fragile item","romaji":"waremono"},{"jp":"保冷剤","kana":"ほれいざい","meaning":"cold pack","romaji":"horeizai"},{"jp":"保冷バッグ","kana":"ほれいバッグ","meaning":"insulated bag","romaji":"horeibaggu"},{"jp":"送る","kana":"おくる","meaning":"to send","romaji":"okuru"},{"jp":"配送","kana":"はいそう","meaning":"delivery","romaji":"haisou"},{"jp":"重さ","kana":"おもさ","meaning":"weight","romaji":"omosa"},{"jp":"スーツケース","kana":"スーツケース","meaning":"suitcase","romaji":"suutsukeesu"}]},{"title":"Electronics words","items":[{"jp":"電圧","kana":"でんあつ","meaning":"voltage","romaji":"den'atsu"},{"jp":"変圧器","kana":"へんあつき","meaning":"transformer","romaji":"hen'atsuki"},{"jp":"プラグ","kana":"プラグ","meaning":"plug","romaji":"puragu"},{"jp":"充電器","kana":"じゅうでんき","meaning":"charger","romaji":"juudenki"},{"jp":"保証","kana":"ほしょう","meaning":"warranty","romaji":"hoshou"},{"jp":"保証書","kana":"ほしょうしょ","meaning":"warranty card","romaji":"hoshousho"},{"jp":"説明書","kana":"せつめいしょ","meaning":"manual","romaji":"setsumeisho"},{"jp":"容量","kana":"ようりょう","meaning":"capacity, such as storage size","romaji":"youryou"},{"jp":"在庫","kana":"ざいこ","meaning":"stock","romaji":"zaiko"},{"jp":"最新","kana":"さいしん","meaning":"newest","romaji":"saishin"},{"jp":"型番","kana":"かたばん","meaning":"model number","romaji":"kataban"},{"jp":"ポイント","kana":"ポイント","meaning":"points","romaji":"pointo"},{"jp":"海外対応","kana":"かいがいたいおう","meaning":"works overseas","romaji":"kaigaitaiou"}]}],"_num":"07"},{"slug":"sightseeing","title":"Sightseeing and tickets","title_jp":"観光","summary":"Tickets, entry, queues, photos, winter events and tours","situations":[{"title":"Ticket counters and machines","intro":"Buying entry at a counter or machine, and asking what kind of ticket you are getting.","phrases":[{"id":"sightseeing-ticket-01","speaker":"you","jp":"大人二枚ください。","kana":"おとな にまい ください。","meaning":"Two adults, please.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"Counters count tickets with 枚. 大人二人です also works. Staff then say the total; prices vary, so check the board.","level":"core","romaji":"otona nimai kudasai."},{"id":"sightseeing-ticket-02","speaker":"you","jp":"当日券はまだありますか。","kana":"とうじつけん は まだ あります か。","meaning":"Are there any same-day tickets left?","replies":[{"jp":"はい、ございます。","kana":"はい、 ございます。","meaning":"Yes, we have some.","romaji":"hai, gozaimasu."},{"jp":"申し訳ありません、本日分は完売しました。","kana":"もうしわけ ありません、 ほんじつぶん は かんばい しました。","meaning":"Sorry, today's tickets are sold out.","romaji":"moushiwake arimasen, honjitsubun wa kanbai shimashita."}],"note":"完売 means sold out. 売り切れ is the everyday word you may also hear.","level":"core","romaji":"toujitsuken wa mada arimasu ka."},{"id":"sightseeing-ticket-03","speaker":"you","jp":"一番早く入れるのは何時ですか。","kana":"いちばん はやく はいれる の は なんじ です か。","meaning":"What is the earliest time I can get in?","replies":[{"jp":"次は三時半です。","kana":"つぎ は さんじはん です。","meaning":"The next one is at 3:30.","romaji":"tsugi wa sanjihan desu."},{"jp":"今から入れます。","kana":"いま から はいれます。","meaning":"You can go in right now.","romaji":"ima kara hairemasu."}],"note":"At timed-entry places, listen for the clock time. The times here are examples only.","level":"core","romaji":"ichiban hayaku haireru no wa nanji desu ka."},{"id":"sightseeing-ticket-04","speaker":"staff","jp":"こちらは日時指定のチケットです。","kana":"こちら は にちじしてい の チケット です。","meaning":"This is a ticket for a set date and time.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."},{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."}],"note":"You must enter in the slot printed on the ticket. Check the time before you set off.","level":"useful","romaji":"kochira wa nichijishitei no chiketto desu."},{"id":"sightseeing-ticket-05","speaker":"you","jp":"入場券とセット券は何が違いますか。","kana":"にゅうじょうけん と セットけん は なに が ちがいます か。","meaning":"What is the difference between the entry ticket and the set ticket?","replies":[{"jp":"セット券は展望台とロープウェイの両方に乗れます。","kana":"セットけん は てんぼうだい と ロープウェイ の りょうほう に のれます。","meaning":"The set covers both the deck and the ropeway.","romaji":"settoken wa tenboudai to roopuwei no ryouhou ni noremasu."}],"note":"A set bundles several places. Ask what is included before you pay, and sets differ from place to place.","level":"useful","romaji":"nyuujouken to settoken wa nani ga chigaimasu ka."},{"id":"sightseeing-ticket-06","speaker":"you","jp":"このQRコードで入れますか。","kana":"この キューアールコード で はいれます か。","meaning":"Can I get in with this QR code?","replies":[{"jp":"はい、こちらにかざしてください。","kana":"はい、 こちら に かざして ください。","meaning":"Yes, hold it over here.","romaji":"hai, kochira ni kazashite kudasai."}],"note":"Turn your screen brightness up first so the reader can scan the code.","level":"core","romaji":"kono kyuuaarukoodo de hairemasu ka."},{"id":"sightseeing-ticket-07","speaker":"you","jp":"再入場はできますか。","kana":"さいにゅうじょう は できます か。","meaning":"Can I re-enter after going out?","replies":[{"jp":"はい、できます。","kana":"はい、 できます。","meaning":"Yes, you can.","romaji":"hai, dekimasu."},{"jp":"再入場はできません。","kana":"さいにゅうじょう は できません。","meaning":"No, you cannot re-enter.","romaji":"sainyuujou wa dekimasen."}],"note":"再入場不可 on a sign means no re-entry. Ask if you need a stamp or wristband to come back in.","level":"core","romaji":"sainyuujou wa dekimasu ka."},{"id":"sightseeing-ticket-08","speaker":"you","jp":"英語のパンフレットはありますか。","kana":"えいご の パンフレット は あります か。","meaning":"Do you have an English pamphlet?","replies":[{"jp":"はい、こちらです。","kana":"はい、 こちら です。","meaning":"Yes, here you are.","romaji":"hai, kochira desu."},{"jp":"英語はありませんが、QRコードで見られます。","kana":"えいご は ありません が、 キューアールコード で みられます。","meaning":"There is no English copy, but you can view it by QR code.","romaji":"eigo wa arimasen ga, kyuuaarukoodo de miraremasu."}],"note":"If there is no English copy, ask for a Japanese one or scan the QR code.","level":"core","romaji":"eigo no panfuretto wa arimasu ka."},{"id":"sightseeing-ticket-09","speaker":"you","jp":"英語の音声ガイドはありますか。","kana":"えいご の おんせい ガイド は あります か。","meaning":"Is there an audio guide in English?","replies":[{"jp":"はい、ございます。","kana":"はい、 ございます。","meaning":"Yes, we have one.","romaji":"hai, gozaimasu."},{"jp":"はい、入口で借りられます。","kana":"はい、 いりぐち で かりられます。","meaning":"Yes, you can rent one at the entrance.","romaji":"hai, iriguchi de kariraremasu."}],"note":"Rentals may ask for ID or a deposit. Listen for 返却, which means return.","level":"useful","romaji":"eigo no onsei gaido wa arimasu ka."},{"id":"sightseeing-ticket-10","speaker":"you","jp":"学生割引はありますか。","kana":"がくせい わりびき は あります か。","meaning":"Is there a student discount?","replies":[{"jp":"はい、学生証を見せてください。","kana":"はい、 がくせいしょう を みせて ください。","meaning":"Yes, please show your student ID.","romaji":"hai, gakuseishou o misete kudasai."},{"jp":"申し訳ありませんが、割引はありません。","kana":"もうしわけ ありません が、 わりびき は ありません。","meaning":"Sorry, there is no discount.","romaji":"moushiwake arimasen ga, waribiki wa arimasen."}],"note":"Discounts usually need proof of status. 大人 and 小人 are the usual ticket types.","level":"useful","romaji":"gakusei waribiki wa arimasu ka."},{"id":"sightseeing-ticket-11","speaker":"staff","jp":"前売り券はお持ちですか。","kana":"まえうりけん は おもち です か。","meaning":"Do you have an advance ticket?","replies":[{"jp":"はい、持っています。","kana":"はい、 もって います。","meaning":"Yes, I have one.","romaji":"hai, motte imasu."},{"jp":"いいえ、持っていません。","kana":"いいえ、 もって いません。","meaning":"No, I don't.","romaji":"iie, motte imasen."}],"note":"前売り means advance sale and 当日 means same day. These two are the basic pair to know.","level":"listen-only","romaji":"maeuriken wa omochi desu ka."}]},{"title":"Entry and rules","intro":"Gates, bag checks and posted rules at museums, ropeways and parks.","phrases":[{"id":"sightseeing-rule-01","speaker":"staff","jp":"チケットを拝見します。","kana":"チケット を はいけん します。","meaning":"May I see your ticket?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you go.","romaji":"hai, douzo."}],"also_heard":[{"jp":"券をお願いします。","kana":"けん を おねがい します。","meaning":"Your ticket, please.","romaji":"ken o onegai shimasu."}],"note":"A polite check at the gate. Have it ready on your phone or on paper.","level":"core","romaji":"chiketto o haiken shimasu."},{"id":"sightseeing-rule-02","speaker":"staff","jp":"お荷物の中を確認させていただきます。","kana":"おにもつ の なか を かくにん させて いただきます。","meaning":"We will check inside your bag.","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"also_heard":[{"jp":"バッグを開けてください。","kana":"バッグ を あけて ください。","meaning":"Please open your bag.","romaji":"baggu o akete kudasai."}],"note":"Bag checks are common at big venues. Open the bag when asked.","level":"core","romaji":"onimotsu no naka o kakunin sasete itadakimasu."},{"id":"sightseeing-rule-03","speaker":"you","jp":"荷物を預けられるロッカーはどこですか。","kana":"にもつ を あずけられる ロッカー は どこ です か。","meaning":"Where are the lockers where I can leave my bag?","replies":[{"jp":"あちらの階段の下にあります。","kana":"あちら の かいだん の した に あります。","meaning":"Over there, under the stairs.","romaji":"achira no kaidan no shita ni arimasu."}],"note":"Lockers usually cost money and the price varies, so check the sign. Keep some coins with you as a backup.","level":"core","romaji":"nimotsu o azukerareru rokkaa wa doko desu ka."},{"id":"sightseeing-rule-04","speaker":"staff","jp":"大きな荷物は館内に持ち込めません。","kana":"おおきな にもつ は かんない に もちこめません。","meaning":"Large bags cannot be taken inside.","replies":[{"jp":"ロッカーに入れてきます。","kana":"ロッカー に いれて きます。","meaning":"I'll put it in a locker first.","romaji":"rokkaa ni irete kimasu."},{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"Large bags may be refused at some museums and ropeways. Use a locker or leave them at your hotel.","level":"useful","romaji":"ookina nimotsu wa kannai ni mochikomemasen."},{"id":"sightseeing-rule-05","speaker":"staff","jp":"館内は飲食禁止です。","kana":"かんない は いんしょく きんし です。","meaning":"Eating and drinking are not allowed inside.","replies":[{"jp":"すみません、わかりました。","kana":"すみません、 わかりました。","meaning":"Sorry, understood.","romaji":"sumimasen, wakarimashita."}],"also_heard":[{"jp":"飲み物はご遠慮ください。","kana":"のみもの は ごえんりょ ください。","meaning":"Please refrain from drinks.","romaji":"nomimono wa goenryo kudasai."}],"note":"ご遠慮ください sounds softer but still means no. Put the drink away until you are outside.","level":"core","romaji":"kannai wa inshoku kinshi desu."},{"id":"sightseeing-rule-06","speaker":"staff","jp":"フラッシュ撮影はご遠慮ください。","kana":"フラッシュ さつえい は ごえんりょ ください。","meaning":"Please do not use flash photography.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"also_heard":[{"jp":"フラッシュは禁止です。","kana":"フラッシュ は きんし です。","meaning":"Flash is not allowed.","romaji":"furasshu wa kinshi desu."}],"note":"撮影禁止 on a sign means no photos at all. Check the sign at each room door.","level":"core","romaji":"furasshu satsuei wa goenryo kudasai."},{"id":"sightseeing-rule-07","speaker":"staff","jp":"三脚と自撮り棒は使えません。","kana":"さんきゃく と じどりぼう は つかえません。","meaning":"Tripods and selfie sticks cannot be used.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."},{"jp":"預けてもいいですか。","kana":"あずけて も いい です か。","meaning":"May I leave it here?","romaji":"azukete mo ii desu ka."}],"note":"Common at crowded sights and theme parks. Ask whether there is a place to leave the item.","level":"useful","romaji":"sankyaku to jidoribou wa tsukaemasen."},{"id":"sightseeing-rule-08","speaker":"staff","jp":"土足厳禁です。","kana":"どそく げんきん です。","meaning":"No outdoor shoes allowed.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"スリッパをお使いください。","kana":"スリッパ を おつかい ください。","meaning":"Please use the slippers.","romaji":"surippa o otsukai kudasai."}],"note":"Wear clean socks. Some rooms are tatami, and you should not wear slippers on them.","level":"useful","romaji":"dosoku genkin desu."},{"id":"sightseeing-rule-09","speaker":"staff","jp":"順路に沿ってお進みください。","kana":"じゅんろ に そって おすすみ ください。","meaning":"Please follow the route.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"順路 is the set route. Follow the arrows and do not go back the other way.","level":"core","romaji":"junro ni sotte osusumi kudasai."},{"id":"sightseeing-rule-10","speaker":"announcement","jp":"まもなく閉館のお時間です。","kana":"まもなく へいかん の おじかん です。","meaning":"It is almost closing time.","also_heard":[{"jp":"本日の最終入場は閉館の三十分前です。","kana":"ほんじつ の さいしゅうにゅうじょう は へいかん の さんじゅっぷんまえ です。","meaning":"Last entry today is 30 minutes before closing.","romaji":"honjitsu no saishuunyuujou wa heikan no sanjuppunmae desu."}],"note":"Last entry is often some minutes before closing. Check the posted time, and plan your visit around it.","level":"useful","romaji":"mamonaku heikan no ojikan desu."},{"id":"sightseeing-rule-11","speaker":"announcement","jp":"出口へお進みください。","kana":"でぐち へ おすすみ ください。","meaning":"Please head to the exit.","also_heard":[{"jp":"本日はご来館ありがとうございました。","kana":"ほんじつ は ごらいかん ありがとう ございました。","meaning":"Thank you for visiting today.","romaji":"honjitsu wa goraikan arigatou gozaimashita."}],"note":"Closing music often plays before this. Start moving toward the exit.","level":"listen-only","romaji":"deguchi e osusumi kudasai."}]},{"title":"Queues and waits","intro":"Finding the end of the line, asking about waits, and what staff say at busy spots.","phrases":[{"id":"sightseeing-queue-01","speaker":"you","jp":"最後尾はどこですか。","kana":"さいこうび は どこ です か。","meaning":"Where is the end of the line?","replies":[{"jp":"あちらです。","kana":"あちら です。","meaning":"Over there.","romaji":"achira desu."}],"note":"Look for a staff member holding a 最後尾 sign and join behind them.","level":"core","romaji":"saikoubi wa doko desu ka."},{"id":"sightseeing-queue-02","speaker":"you","jp":"これは展望台の列ですか。","kana":"これ は てんぼうだい の れつ です か。","meaning":"Is this the line for the observation deck?","replies":[{"jp":"はい、そうです。","kana":"はい、 そう です。","meaning":"Yes, it is.","romaji":"hai, sou desu."},{"jp":"いいえ、あちらです。","kana":"いいえ、 あちら です。","meaning":"No, it's over there.","romaji":"iie, achira desu."}],"note":"Swap 展望台 for another place name, such as ロープウェイ (ropeway).","level":"core","romaji":"kore wa tenboudai no retsu desu ka."},{"id":"sightseeing-queue-03","speaker":"you","jp":"待ち時間はどのくらいですか。","kana":"まちじかん は どのくらい です か。","meaning":"About how long is the wait?","replies":[{"jp":"約三十分です。","kana":"やく さんじゅっぷん です。","meaning":"About 30 minutes.","romaji":"yaku sanjuppun desu."},{"jp":"一時間くらいです。","kana":"いちじかん くらい です。","meaning":"About one hour.","romaji":"ichijikan kurai desu."}],"note":"Times are only estimates. 約 means about.","level":"core","romaji":"machijikan wa donokurai desu ka."},{"id":"sightseeing-queue-04","speaker":"staff","jp":"整理券をお配りしています。","kana":"せいりけん を おくばり して います。","meaning":"We are handing out numbered tickets.","replies":[{"jp":"何時に戻ればいいですか。","kana":"なんじ に もどれば いい です か。","meaning":"What time should I come back?","romaji":"nanji ni modoreba ii desu ka."}],"also_heard":[{"jp":"整理券をお取りください。","kana":"せいりけん を おとり ください。","meaning":"Please take a numbered ticket.","romaji":"seiriken o otori kudasai."}],"note":"You will be called by number. Note the return time printed on your ticket.","level":"useful","romaji":"seiriken o okubari shite imasu."},{"id":"sightseeing-queue-05","speaker":"you","jp":"整理券は何時から配りますか。","kana":"せいりけん は なんじ から くばります か。","meaning":"What time do you start handing out numbered tickets?","replies":[{"jp":"九時からです。","kana":"くじ から です。","meaning":"From 9 o'clock.","romaji":"kuji kara desu."},{"jp":"本日分は終了しました。","kana":"ほんじつぶん は しゅうりょう しました。","meaning":"Today's tickets are finished.","romaji":"honjitsubun wa shuuryou shimashita."}],"note":"本日終了 on a sign means it is finished for the day. Come back on another day.","level":"useful","romaji":"seiriken wa nanji kara kubarimasu ka."},{"id":"sightseeing-queue-06","speaker":"staff","jp":"立ち止まらないでください。","kana":"たちどまらないで ください。","meaning":"Please do not stop.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"止まらずにお進みください。","kana":"とまらず に おすすみ ください。","meaning":"Please keep moving without stopping.","romaji":"tomarazu ni osusumi kudasai."}],"note":"Often heard at illuminations and busy crossings. Keep moving with the crowd.","level":"core","romaji":"tachidomaranaide kudasai."},{"id":"sightseeing-queue-07","speaker":"staff","jp":"前に詰めてください。","kana":"まえ に つめて ください。","meaning":"Please move up to the front.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"前へお進みください。","kana":"まえ へ おすすみ ください。","meaning":"Please move forward.","romaji":"mae e osusumi kudasai."}],"note":"Step forward to close the gap in front of you.","level":"core","romaji":"mae ni tsumete kudasai."},{"id":"sightseeing-queue-08","speaker":"staff","jp":"二列でお並びください。","kana":"にれつ で おならび ください。","meaning":"Please line up in two rows.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"also_heard":[{"jp":"一列でお並びください。","kana":"いちれつ で おならび ください。","meaning":"Please line up in one row.","romaji":"ichiretsu de onarabi kudasai."}],"note":"二列 means two rows and 一列 means one row. Listen for the number.","level":"useful","romaji":"niretsu de onarabi kudasai."},{"id":"sightseeing-queue-09","speaker":"staff","jp":"順番にご案内します。","kana":"じゅんばん に ごあんない します。","meaning":"We will guide you in order.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"次の方どうぞ。","kana":"つぎ の かた どうぞ。","meaning":"Next person, please.","romaji":"tsugi no kata douzo."}],"note":"A standard queue call. Wait until staff direct you forward.","level":"listen-only","romaji":"junban ni goannai shimasu."},{"id":"sightseeing-queue-10","speaker":"you","jp":"お先にどうぞ。","kana":"おさき に どうぞ。","meaning":"Please go ahead.","replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Use this to let someone go ahead of you in a line. It is polite and short.","level":"useful","romaji":"osaki ni douzo."},{"id":"sightseeing-queue-11","speaker":"staff","jp":"優先パスはお持ちですか。","kana":"ゆうせん パス は おもち です か。","meaning":"Do you have a priority pass?","replies":[{"jp":"はい、持っています。","kana":"はい、 もって います。","meaning":"Yes, I have one.","romaji":"hai, motte imasu."},{"jp":"いいえ、持っていません。","kana":"いいえ、 もって いません。","meaning":"No, I don't.","romaji":"iie, motte imasen."}],"also_heard":[{"jp":"こちらは優先入場の列です。","kana":"こちら は ゆうせんにゅうじょう の れつ です。","meaning":"This is the priority entry line.","romaji":"kochira wa yuusennyuujou no retsu desu."}],"note":"Names and rules differ by park and attraction. Listen for 優先 (priority).","level":"listen-only","romaji":"yuusen pasu wa omochi desu ka."}]},{"title":"Photos","intro":"Asking strangers for a photo, giving photo directions and checking the photo rules.","phrases":[{"id":"sightseeing-photo-01","speaker":"you","jp":"すみません、写真を撮っていただけますか。","kana":"すみません、 しゃしん を とって いただけます か。","meaning":"Excuse me, could you take a photo of us?","replies":[{"jp":"はい、いいですよ。","kana":"はい、 いい です よ。","meaning":"Yes, sure.","romaji":"hai, ii desu yo."},{"jp":"すみません、ちょっと……。","kana":"すみません、 ちょっと……。","meaning":"Sorry, I'm not able to.","romaji":"sumimasen, chotto......."}],"note":"Hand over your phone and show which button to press. Say thanks afterward.","level":"core","romaji":"sumimasen, shashin o totte itadakemasu ka."},{"id":"sightseeing-photo-02","speaker":"you","jp":"ここを押すだけです。","kana":"ここ を おす だけ です。","meaning":"You just press here.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, I understand.","romaji":"hai, wakarimashita."}],"note":"Point to the shutter button on the screen. Short and clear is enough.","level":"core","romaji":"koko o osu dake desu."},{"id":"sightseeing-photo-03","speaker":"staff","jp":"はい、チーズ。","kana":"はい、 チーズ。","meaning":"Say cheese.","replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Please.","romaji":"onegai shimasu."}],"note":"The usual cue before the shutter. Smile and wait for the click.","level":"listen-only","romaji":"hai, chiizu."},{"id":"sightseeing-photo-04","speaker":"you","jp":"もう一枚お願いします。","kana":"もう いちまい おねがい します。","meaning":"One more, please.","replies":[{"jp":"はい、もう一枚。","kana":"はい、 もう いちまい。","meaning":"Yes, one more.","romaji":"hai, mou ichimai."}],"note":"Ask for another shot if the first one is not right.","level":"core","romaji":"mou ichimai onegai shimasu."},{"id":"sightseeing-photo-05","speaker":"you","jp":"縦でお願いします。","kana":"たて で おねがい します。","meaning":"Please take it vertically, in portrait.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"note":"縦 is portrait (tall) and 横 is landscape (wide). Portrait suits tall things like towers.","level":"core","romaji":"tate de onegai shimasu."},{"id":"sightseeing-photo-06","speaker":"you","jp":"富士山が入るようにお願いします。","kana":"ふじさん が はいる よう に おねがい します。","meaning":"Please get Mt. Fuji in the shot.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"The pattern が入るように means so that the thing is in the shot. Swap 富士山 for any landmark.","level":"useful","romaji":"fujisan ga hairu you ni onegai shimasu."},{"id":"sightseeing-photo-07","speaker":"you","jp":"全身が入るようにお願いします。","kana":"ぜんしん が はいる よう に おねがい します。","meaning":"Please get our full bodies in the shot.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"note":"Swap 全身 for 上半身 (upper body) if you only need the top half in the shot.","level":"useful","romaji":"zenshin ga hairu you ni onegai shimasu."},{"id":"sightseeing-photo-08","speaker":"staff","jp":"確認してください。","kana":"かくにん して ください。","meaning":"Please check it.","replies":[{"jp":"ありがとうございます、大丈夫です。","kana":"ありがとう ございます、 だいじょうぶ です。","meaning":"Thank you, it's fine.","romaji":"arigatou gozaimasu, daijoubu desu."},{"jp":"もう一枚お願いします。","kana":"もう いちまい おねがい します。","meaning":"One more, please.","romaji":"mou ichimai onegai shimasu."}],"also_heard":[{"jp":"撮れましたか。","kana":"とれました か。","meaning":"Did you get it?","romaji":"toremashita ka."}],"note":"Always say thanks, and check the screen before handing the phone back.","level":"core","romaji":"kakunin shite kudasai."},{"id":"sightseeing-photo-09","speaker":"you","jp":"よかったら、お二人も撮りましょうか。","kana":"よかったら、 おふたり も とりましょう か。","meaning":"If you like, shall I take a photo of you two too?","replies":[{"jp":"ありがとうございます、お願いします。","kana":"ありがとう ございます、 おねがい します。","meaning":"Thank you, yes please.","romaji":"arigatou gozaimasu, onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"note":"A friendly offer after someone has helped you. お二人 is a polite way to say two people.","level":"core","romaji":"yokattara, ofutari mo torimashou ka."},{"id":"sightseeing-photo-10","speaker":"you","jp":"ここで写真を撮ってもいいですか。","kana":"ここ で しゃしん を とって も いい です か。","meaning":"May I take photos here?","replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that's fine.","romaji":"hai, daijoubu desu."},{"jp":"申し訳ありません、撮影禁止です。","kana":"もうしわけ ありません、 さつえい きんし です。","meaning":"Sorry, photos are not allowed.","romaji":"moushiwake arimasen, satsuei kinshi desu."}],"note":"Ask in museums, shops and shrines. A 撮影禁止 sign means no photos.","level":"core","romaji":"koko de shashin o totte mo ii desu ka."},{"id":"sightseeing-photo-11","speaker":"staff","jp":"記念写真はいかがですか。","kana":"きねん しゃしん は いかが です か。","meaning":"Would you like a commemorative photo?","replies":[{"jp":"いくらですか。","kana":"いくら です か。","meaning":"How much is it?","romaji":"ikura desu ka."},{"jp":"結構です。","kana":"けっこう です。","meaning":"No, thank you.","romaji":"kekkou desu."}],"also_heard":[{"jp":"写真撮影はこちらです。","kana":"しゃしん さつえい は こちら です。","meaning":"The photo service is this way.","romaji":"shashin satsuei wa kochira desu."}],"note":"Official photographers sell prints. You can say no without buying anything.","level":"useful","romaji":"kinen shashin wa ikaga desu ka."},{"id":"sightseeing-photo-12","speaker":"staff","jp":"写真は出口でご覧になれます。","kana":"しゃしん は でぐち で ごらん に なれます。","meaning":"You can view the photos at the exit.","replies":[{"jp":"見るだけでもいいですか。","kana":"みる だけ でも いい です か。","meaning":"Is it OK just to look?","romaji":"miru dake demo ii desu ka."}],"note":"There is no obligation to buy, so you can look first and decide afterward.","level":"listen-only","romaji":"shashin wa deguchi de goran ni naremasu."}]},{"title":"Illuminations, Christmas markets and New Year","intro":"Winter lights, markets, and the New Year shrine and countdown crowds.","phrases":[{"id":"sightseeing-winter-01","speaker":"you","jp":"イルミネーションの点灯は何時からですか。","kana":"イルミネーション の てんとう は なんじ から です か。","meaning":"What time do the lights come on?","replies":[{"jp":"午後五時からです。","kana":"ごご ごじ から です。","meaning":"From 5 pm.","romaji":"gogo goji kara desu."},{"jp":"九時までです。","kana":"くじ まで です。","meaning":"Until 9 pm.","romaji":"kuji made desu."}],"note":"点灯 means the lights are switched on. The times here are examples. Check the posted schedule.","level":"core","romaji":"irumineeshon no tentou wa nanji kara desu ka."},{"id":"sightseeing-winter-02","speaker":"you","jp":"イルミネーションはいつまでですか。","kana":"イルミネーション は いつ まで です か。","meaning":"Until when do the illuminations run?","replies":[{"jp":"一月中旬までです。","kana":"いちがつ ちゅうじゅん まで です。","meaning":"Until mid-January.","romaji":"ichigatsu chuujun made desu."}],"note":"Dates change each year and by venue, so the date here is only an example. Check the official site.","level":"core","romaji":"irumineeshon wa itsu made desu ka."},{"id":"sightseeing-winter-03","speaker":"you","jp":"入場料はかかりますか。","kana":"にゅうじょうりょう は かかります か。","meaning":"Is there an entrance fee?","replies":[{"jp":"無料です。","kana":"むりょう です。","meaning":"It's free.","romaji":"muryou desu."},{"jp":"有料です。","kana":"ゆうりょう です。","meaning":"It costs money.","romaji":"yuuryou desu."}],"note":"Some illuminations are free, while gardens and some venues charge. Check the sign.","level":"core","romaji":"nyuujouryou wa kakarimasu ka."},{"id":"sightseeing-winter-04","speaker":"staff","jp":"マグカップにはデポジットが必要です。","kana":"マグカップ に は デポジット が ひつよう です。","meaning":"The mug needs a deposit.","replies":[{"jp":"返せばお金は戻りますか。","kana":"かえせ ば おかね は もどります か。","meaning":"If I return it, do I get the money back?","romaji":"kaese ba okane wa modorimasu ka."},{"jp":"このまま持ち帰ってもいいですか。","kana":"この まま もちかえって も いい です か。","meaning":"May I take the mug home as it is?","romaji":"kono mama mochikaette mo ii desu ka."}],"also_heard":[{"jp":"マグは返却すると、お金が戻ります。","kana":"マグ は へんきゃく する と、 おかね が もどります。","meaning":"You get the money back when you return the mug.","romaji":"magu wa henkyaku suru to, okane ga modorimasu."}],"note":"Keep the mug as a souvenir, or return it for the deposit. Amounts vary, so check the sign.","level":"core","romaji":"magukappu ni wa depojitto ga hitsuyou desu."},{"id":"sightseeing-winter-05","speaker":"you","jp":"ホットワインを二つください。","kana":"ホットワイン を ふたつ ください。","meaning":"Two mulled wines, please.","replies":[{"jp":"マグカップはどうしますか。","kana":"マグカップ は どう します か。","meaning":"What about the mug?","romaji":"magukappu wa dou shimasu ka."}],"note":"Mulled wine contains alcohol and is served hot, so let it cool a little before you drink.","level":"core","romaji":"hottowain o futatsu kudasai."},{"id":"sightseeing-winter-06","speaker":"staff","jp":"熱いのでお気をつけください。","kana":"あつい の で おき を つけ ください。","meaning":"It's hot, so please be careful.","replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"note":"Common when hot drinks are handed over. Wait a moment before the first sip.","level":"useful","romaji":"atsui no de oki o tsuke kudasai."},{"id":"sightseeing-winter-07","speaker":"announcement","jp":"年越しカウントダウンまであと十分です。","kana":"としこし カウントダウン まで あと じゅっぷん です。","meaning":"Ten minutes until the New Year countdown.","replies":[{"jp":"あけましておめでとうございます。","kana":"あけまして おめでとう ございます。","meaning":"Happy New Year.","romaji":"akemashite omedetou gozaimasu."}],"also_heard":[{"jp":"三、二、一、明けましておめでとうございます。","kana":"さん、 に、 いち、 あけまして おめでとう ございます。","meaning":"Three, two, one, happy New Year!","romaji":"san, ni, ichi, akemashite omedetou gozaimasu."}],"note":"After midnight the follow-up is 今年もよろしくお願いします, which means please treat me well this year.","level":"useful","romaji":"toshikoshi kauntodaun made ato juppun desu."},{"id":"sightseeing-winter-08","speaker":"staff","jp":"この先は一方通行です。","kana":"この さき は いっぽうつうこう です。","meaning":"Beyond this point it is one way.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"一列でお進みください。","kana":"いちれつ で おすすみ ください。","meaning":"Please go forward in a single line.","romaji":"ichiretsu de osusumi kudasai."}],"note":"New Year shrine visits can be crowded. Follow the staff and stay in the line.","level":"useful","romaji":"kono saki wa ippoutsuukou desu."},{"id":"sightseeing-winter-09","speaker":"you","jp":"おみくじを一つください。","kana":"おみくじ を ひとつ ください。","meaning":"One fortune slip, please.","replies":[{"jp":"お賽銭箱の横でどうぞ。","kana":"おさいせんばこ の よこ で どうぞ。","meaning":"Please go beside the offering box.","romaji":"osaisenbako no yoko de douzo."}],"note":"Optional. If you draw an unlucky fortune, ask staff where to tie it up at the shrine.","level":"useful","romaji":"omikuji o hitotsu kudasai."},{"id":"sightseeing-winter-10","speaker":"you","jp":"お守りはどこで買えますか。","kana":"おまもり は どこ で かえます か。","meaning":"Where can I buy an amulet?","replies":[{"jp":"授与所でどうぞ。","kana":"じゅよしょ で どうぞ。","meaning":"Please go to the amulet counter.","romaji":"juyosho de douzo."}],"note":"授与所 is the counter where amulets are given out. Optional.","level":"useful","romaji":"omamori wa doko de kaemasu ka."},{"id":"sightseeing-winter-11","speaker":"staff","jp":"福袋は並んで整理券をお取りください。","kana":"ふくぶくろ は ならんで せいりけん を おとり ください。","meaning":"For lucky bags, please line up and take a numbered ticket.","replies":[{"jp":"福袋はいくらですか。","kana":"ふくぶくろ は いくら です か。","meaning":"How much is a lucky bag?","romaji":"fukubukuro wa ikura desu ka."}],"also_heard":[{"jp":"福袋の中身は見えません。","kana":"ふくぶくろ の なかみ は みえません。","meaning":"You cannot see what is inside the lucky bags.","romaji":"fukubukuro no nakami wa miemasen."}],"note":"Lucky bags often sell out fast in early January. Check each shop's queue rules.","level":"useful","romaji":"fukubukuro wa narande seiriken o otori kudasai."}]},{"title":"Observation decks, ropeways and ferries","intro":"Observation decks, the Fuji ropeway and the Miyajima ferry: timing, weather and disruptions.","phrases":[{"id":"sightseeing-view-01","speaker":"you","jp":"展望台の時間指定チケットを二枚ください。","kana":"てんぼうだい の じかんしてい チケット を にまい ください。","meaning":"Two timed tickets for the observation deck, please.","replies":[{"jp":"四時十五分なら空いています。","kana":"よじじゅうごふん なら あいて います。","meaning":"4:15 is available.","romaji":"yojijuugofun nara aite imasu."}],"note":"Sunset slots fill fast. Ask for 夕方 (evening) if you want a view at dusk. The time is an example.","level":"core","romaji":"tenboudai no jikanshitei chiketto o nimai kudasai."},{"id":"sightseeing-view-02","speaker":"staff","jp":"往復ですか、片道ですか。","kana":"おうふく です か、 かたみち です か。","meaning":"Round trip or one way?","replies":[{"jp":"往復です。","kana":"おうふく です。","meaning":"Round trip.","romaji":"oufuku desu."},{"jp":"片道です。","kana":"かたみち です。","meaning":"One way.","romaji":"katamichi desu."}],"note":"往復 is round trip and 片道 is one way. Check which one you are buying before you pay.","level":"core","romaji":"oufuku desu ka, katamichi desu ka."},{"id":"sightseeing-view-03","speaker":"staff","jp":"強風のため運休しています。","kana":"きょうふう の ため うんきゅう して います。","meaning":"Service is suspended because of strong wind.","replies":[{"jp":"いつ再開しますか。","kana":"いつ さいかい します か。","meaning":"When will service resume?","romaji":"itsu saikai shimasu ka."}],"also_heard":[{"jp":"天候により運転を見合わせています。","kana":"てんこう により うんてん を みあわせて います。","meaning":"Service is paused because of the weather.","romaji":"tenkou niyori unten o miawasete imasu."}],"note":"Ropeways and ferries stop in strong wind or lightning. Ask at the station before you go up.","level":"core","romaji":"kyoufuu no tame unkyuu shite imasu."},{"id":"sightseeing-view-04","speaker":"you","jp":"今日は富士山が見えますか。","kana":"きょう は ふじさん が みえます か。","meaning":"Can we see Mt. Fuji today?","replies":[{"jp":"はい、よく見えますよ。","kana":"はい、 よく みえます よ。","meaning":"Yes, it's very clear.","romaji":"hai, yoku miemasu yo."},{"jp":"今日は雲で見えません。","kana":"きょう は くも で みえません。","meaning":"Clouds are blocking the view today.","romaji":"kyou wa kumo de miemasen."}],"note":"A clear view is never guaranteed, so ask staff on the day.","level":"core","romaji":"kyou wa fujisan ga miemasu ka."},{"id":"sightseeing-view-05","speaker":"staff","jp":"本日は視界不良です。","kana":"ほんじつ は しかい ふりょう です。","meaning":"Visibility is poor today.","replies":[{"jp":"払い戻しはできますか。","kana":"はらいもどし は できます か。","meaning":"Can I get a refund?","romaji":"haraimodoshi wa dekimasu ka."}],"also_heard":[{"jp":"霧が出ています。","kana":"きり が でて います。","meaning":"There is fog.","romaji":"kiri ga dete imasu."}],"note":"If a service is cancelled, ask at the counter about a refund.","level":"useful","romaji":"honjitsu wa shikai furyou desu."},{"id":"sightseeing-view-06","speaker":"staff","jp":"次の便は十時半です。","kana":"つぎ の びん は じゅうじはん です。","meaning":"The next departure is at 10:30.","replies":[{"jp":"乗り場はどこですか。","kana":"のりば は どこ です か。","meaning":"Where is the boarding point?","romaji":"noriba wa doko desu ka."}],"also_heard":[{"jp":"十五分おきに出ています。","kana":"じゅうごふんおき に でて います。","meaning":"They leave every 15 minutes.","romaji":"juugofun'oki ni dete imasu."}],"note":"乗り場 means boarding point. The time shown here is an example.","level":"useful","romaji":"tsugi no bin wa juujihan desu."},{"id":"sightseeing-view-07","speaker":"announcement","jp":"最終の下りは十六時五十分です。","kana":"さいしゅう の くだり は じゅうろくじ ごじゅっぷん です。","meaning":"The last ride down is at 4:50 pm.","note":"This time is only an example. Check the posted timetable, because last rides change by season.","level":"core","romaji":"saishuu no kudari wa juurokuji gojuppun desu."},{"id":"sightseeing-view-08","speaker":"staff","jp":"番号順にご乗車ください。","kana":"ばんごうじゅん に ごじょうしゃ ください。","meaning":"Please board in number order.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"note":"Keep your numbered slip ready and wait until your number is called.","level":"useful","romaji":"bangoujun ni gojousha kudasai."},{"id":"sightseeing-view-09","speaker":"staff","jp":"足元にご注意ください。","kana":"あしもと に ごちゅうい ください。","meaning":"Please watch your step.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"揺れますのでご注意ください。","kana":"ゆれます の で ごちゅうい ください。","meaning":"It may sway, so please be careful.","romaji":"yuremasu no de gochuui kudasai."}],"note":"Said at boarding and landing. Hold the rail if there is one.","level":"listen-only","romaji":"ashimoto ni gochuui kudasai."},{"id":"sightseeing-view-10","speaker":"you","jp":"宮島行きのフェリーはどこから出ますか。","kana":"みやじま いき の フェリー は どこ から でます か。","meaning":"Where does the ferry to Miyajima leave from?","replies":[{"jp":"あちらの乗り場からです。","kana":"あちら の のりば から です。","meaning":"From the boarding point over there.","romaji":"achira no noriba kara desu."}],"note":"The ferry usually leaves from Miyajimaguchi. More than one company runs the crossing, so check your boarding point.","level":"useful","romaji":"miyajima iki no ferii wa doko kara demasu ka."},{"id":"sightseeing-view-11","speaker":"staff","jp":"帰りの最終便は夜九時四十五分です。","kana":"かえり の さいしゅうびん は よる くじ よんじゅうごふん です。","meaning":"The last ferry back is at 9:45 pm.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"The time is an example. Check the last sailing before any evening visit.","level":"useful","romaji":"kaeri no saishuubin wa yoru kuji yonjuugofun desu."}]},{"title":"Theme park (Tokyo Disney)","intro":"Entering Tokyo Disney, rides, parades and shops, and what cast members say.","phrases":[{"id":"sightseeing-park-01","speaker":"staff","jp":"チケットのQRコードをかざしてください。","kana":"チケット の キューアールコード を かざして ください。","meaning":"Please hold up the QR code on your ticket.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"note":"Gate readers scan the code on your phone or on a printed ticket. Keep the screen bright.","level":"core","romaji":"chiketto no kyuuaarukoodo o kazashite kudasai."},{"id":"sightseeing-park-02","speaker":"staff","jp":"手荷物検査にご協力ください。","kana":"てにもつ けんさ に ごきょうりょく ください。","meaning":"Please cooperate with the bag check.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"also_heard":[{"jp":"バッグを開けてください。","kana":"バッグ を あけて ください。","meaning":"Please open your bag.","romaji":"baggu o akete kudasai."}],"note":"Bag checks happen before the entrance gate. Have your bag open and ready.","level":"core","romaji":"tenimotsu kensa ni gokyouryoku kudasai."},{"id":"sightseeing-park-03","speaker":"you","jp":"このアトラクションの待ち時間は何分ですか。","kana":"この アトラクション の まちじかん は なんぷん です か。","meaning":"How many minutes is the wait for this ride?","replies":[{"jp":"四十分です。","kana":"よんじゅっぷん です。","meaning":"It's 40 minutes.","romaji":"yonjuppun desu."}],"note":"Wait-time boards show estimates. The number can change quickly.","level":"core","romaji":"kono atorakushon no machijikan wa nanpun desu ka."},{"id":"sightseeing-park-04","speaker":"staff","jp":"お荷物は足元にお置きください。","kana":"おにもつ は あしもと に おおき ください。","meaning":"Please place your belongings at your feet.","replies":[{"jp":"はい。","kana":"はい。","meaning":"OK.","romaji":"hai."}],"note":"Often said before a ride starts. Some rides also ask you to remove your hat (帽子).","level":"core","romaji":"onimotsu wa ashimoto ni ooki kudasai."},{"id":"sightseeing-park-05","speaker":"staff","jp":"安全バーを下げてください。","kana":"あんぜん バー を さげて ください。","meaning":"Please lower the safety bar.","replies":[{"jp":"はい、下げました。","kana":"はい、 さげました。","meaning":"Yes, I lowered it.","romaji":"hai, sagemashita."}],"also_heard":[{"jp":"両手でしっかりつかまってください。","kana":"りょうて で しっかり つかまって ください。","meaning":"Hold on tightly with both hands.","romaji":"ryoute de shikkari tsukamatte kudasai."}],"note":"Staff check each bar before the ride starts. Follow their instructions even if you feel confident.","level":"core","romaji":"anzen baa o sagete kudasai."},{"id":"sightseeing-park-06","speaker":"you","jp":"シングルライダーはありますか。","kana":"シングルライダー は あります か。","meaning":"Is there a single rider line?","replies":[{"jp":"はい、あちらです。","kana":"はい、 あちら です。","meaning":"Yes, over there.","romaji":"hai, achira desu."},{"jp":"ありません。","kana":"ありません。","meaning":"No, there isn't one.","romaji":"arimasen."}],"note":"Not every ride has a single rider line. It is for people riding alone and is often a shorter queue.","level":"useful","romaji":"shingururaidaa wa arimasu ka."},{"id":"sightseeing-park-07","speaker":"staff","jp":"戻り時間になったら、また来てください。","kana":"もどり じかん に なったら、 また きて ください。","meaning":"Please come back when your return time arrives.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"If your pass gives a return window, check the return time shown on it.","level":"useful","romaji":"modori jikan ni nattara, mata kite kudasai."},{"id":"sightseeing-park-08","speaker":"staff","jp":"パレードは座ってご覧ください。","kana":"パレード は すわって ごらん ください。","meaning":"Please watch the parade seated.","replies":[{"jp":"はい、座ります。","kana":"はい、 すわります。","meaning":"Yes, I'll sit down.","romaji":"hai, suwarimasu."}],"note":"Follow staff at parade spots and keep the aisles clear for others and for strollers.","level":"core","romaji":"pareedo wa suwatte goran kudasai."},{"id":"sightseeing-park-09","speaker":"staff","jp":"ポップコーンバケットは一人一つまでです。","kana":"ポップコーン バケット は ひとり ひとつ まで です。","meaning":"Only one popcorn bucket per person.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"also_heard":[{"jp":"一人二個までです。","kana":"ひとり にこ まで です。","meaning":"Up to two per person.","romaji":"hitori niko made desu."}],"note":"Limits like this can appear on busy days. The numbers here are examples only.",
