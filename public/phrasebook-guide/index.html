ore","romaji":"atatamenakute daijoubu desu."},{"id":"konbini-cutlery-01","speaker":"staff","jp":"お箸はご利用ですか。","kana":"おはし は ごりよう です か。","meaning":"Do you want chopsticks?","also_heard":[{"jp":"お箸はお付けしますか。","kana":"おはし は おつけ します か。","meaning":"Shall I include chopsticks?","romaji":"ohashi wa otsuke shimasu ka."},{"jp":"お箸いりますか。","kana":"おはし いります か。","meaning":"Do you need chopsticks?","romaji":"ohashi irimasu ka."},{"jp":"割り箸とスプーン、どちらにしますか。","kana":"わりばし と スプーン、 どちら に します か。","meaning":"Chopsticks or a spoon?","romaji":"waribashi to supuun, dochira ni shimasu ka."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"level":"core","romaji":"ohashi wa goriyou desu ka."},{"id":"konbini-cutlery-02","speaker":"staff","jp":"お箸は何膳お付けしますか。","kana":"おはし は なんぜん おつけ します か。","meaning":"How many pairs of chopsticks?","also_heard":[{"jp":"お箸、何膳ですか。","kana":"おはし、 なんぜん です か。","meaning":"How many pairs?","romaji":"ohashi, nanzen desu ka."},{"jp":"何人様分ですか。","kana":"なんにんさま ぶん です か。","meaning":"For how many people?","romaji":"nanninsama bun desu ka."},{"jp":"お箸はおいくつですか。","kana":"おはし は おいくつ です か。","meaning":"How many pairs?","romaji":"ohashi wa oikutsu desu ka."}],"replies":[{"jp":"一つで大丈夫です。","kana":"ひとつ で だいじょうぶ です。","meaning":"One is enough.","romaji":"hitotsu de daijoubu desu."},{"jp":"二つお願いします。","kana":"ふたつ おねがい します。","meaning":"Two, please.","romaji":"futatsu onegai shimasu."},{"jp":"二膳お願いします。","kana":"にぜん おねがい します。","meaning":"Two pairs, please.","romaji":"nizen onegai shimasu."}],"note":"膳 is the counter for pairs of chopsticks. A plain number is fine.","level":"useful","romaji":"ohashi wa nanzen otsuke shimasu ka."},{"id":"konbini-cutlery-03","speaker":"staff","jp":"スプーンはお付けしますか。","kana":"スプーン は おつけ します か。","meaning":"Shall I include a spoon?","also_heard":[{"jp":"フォークは必要ですか。","kana":"フォーク は ひつよう です か。","meaning":"Do you need a fork?","romaji":"fooku wa hitsuyou desu ka."},{"jp":"スプーンいりますか。","kana":"スプーン いります か。","meaning":"Do you need a spoon?","romaji":"supuun irimasu ka."}],"replies":[{"jp":"スプーンお願いします。","kana":"スプーン おねがい します。","meaning":"A spoon, please.","romaji":"supuun onegai shimasu."},{"jp":"フォークをください。","kana":"フォーク を ください。","meaning":"A fork, please.","romaji":"fooku o kudasai."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"note":"Name only the utensil you want. Chopsticks are a separate question.","level":"core","romaji":"supuun wa otsuke shimasu ka."},{"id":"konbini-cutlery-04","speaker":"staff","jp":"ストローはお付けしますか。","kana":"ストロー は おつけ します か。","meaning":"Shall I include a straw?","also_heard":[{"jp":"ストローはご利用ですか。","kana":"ストロー は ごりよう です か。","meaning":"Do you want a straw?","romaji":"sutoroo wa goriyou desu ka."},{"jp":"ストローいりますか。","kana":"ストロー いります か。","meaning":"Do you need a straw?","romaji":"sutoroo irimasu ka."}],"replies":[{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."},{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"note":"Straws may be paper or optional.","level":"useful","romaji":"sutoroo wa otsuke shimasu ka."},{"id":"konbini-cutlery-05","speaker":"staff","jp":"おしぼりはお付けしますか。","kana":"おしぼり は おつけ します か。","meaning":"Shall I include a wet towel?","also_heard":[{"jp":"お手拭きはお付けしますか。","kana":"おてふき は おつけ します か。","meaning":"Shall I include a wet towel?","romaji":"otefuki wa otsuke shimasu ka."},{"jp":"おしぼりいりますか。","kana":"おしぼり いります か。","meaning":"Do you need a wet towel?","romaji":"oshibori irimasu ka."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"note":"おしぼり is a wet towel. ウェットティッシュ is a wet wipe. Staff may use either.","level":"useful","romaji":"oshibori wa otsuke shimasu ka."}]},{"title":"Alcohol, tobacco and age confirmation","intro":"Alcohol and tobacco need an age check on the screen. Staff may also ask for ID.","phrases":[{"id":"konbini-age-01","speaker":"staff","jp":"年齢確認をお願いします。","kana":"ねんれい かくにん を おねがい します。","meaning":"Please confirm your age.","also_heard":[{"jp":"年齢確認のボタンを押してください。","kana":"ねんれい かくにん の ボタン を おして ください。","meaning":"Please press the age check button.","romaji":"nenrei kakunin no botan o oshite kudasai."},{"jp":"画面のタッチをお願いします。","kana":"がめん の タッチ を おねがい します。","meaning":"Please touch the screen.","romaji":"gamen no tatchi o onegai shimasu."},{"jp":"画面の「はい」を押してください。","kana":"がめん の 「はい」 を おして ください。","meaning":"Please press Yes on the screen.","romaji":"gamen no \"hai\" o oshite kudasai."}],"note":"The screen faces you, so tap it yourself. Tap 20歳以上 (or はい, depending on the store).","level":"core","romaji":"nenrei kakunin o onegai shimasu."},{"id":"konbini-age-02","speaker":"staff","jp":"20歳以上ですか。","kana":"にじゅっさい いじょう です か。","meaning":"Are you 20 or over?","replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"The legal age for alcohol and tobacco is 20, not 18.","level":"listen-only","romaji":"nijussai ijou desu ka."},{"id":"konbini-age-03","speaker":"staff","jp":"年齢が確認できるものはお持ちですか。","kana":"ねんれい が かくにん できる もの は おもち です か。","meaning":"Do you have something that can confirm your age?","also_heard":[{"jp":"パスポートなど、ありますか。","kana":"パスポート など、 あります か。","meaning":"Do you have a passport or similar?","romaji":"pasupooto nado, arimasu ka."}],"replies":[{"jp":"はい、パスポートです。","kana":"はい、 パスポート です。","meaning":"Yes, here is my passport.","romaji":"hai, pasupooto desu."},{"jp":"これでいいですか。","kana":"これ で いい です か。","meaning":"Is this OK?","romaji":"kore de ii desu ka."}],"note":"Staff may occasionally ask for ID. Carry your passport.","level":"useful","romaji":"nenrei ga kakunin dekiru mono wa omochi desu ka."},{"id":"konbini-age-04","speaker":"you","jp":"二十歳以上です。","kana":"はたち いじょう です。","meaning":"I'm over 20.","note":"Also: 大人です (I'm an adult).","level":"useful","romaji":"hatachi ijou desu."},{"id":"konbini-tobacco-01","speaker":"you","jp":"たばこ、八番をください。","kana":"たばこ、 はちばん を ください。","meaning":"Cigarettes, number 8, please.","note":"Swap 八番 for the number on the tag. Cigarettes sit behind the counter. Pointing at them also works.","level":"useful","romaji":"tabako, hachiban o kudasai."},{"id":"konbini-tobacco-02","speaker":"staff","jp":"ソフトですか、ボックスですか。","kana":"ソフト です か、 ボックス です か。","meaning":"Soft pack or box?","replies":[{"jp":"ボックスで。","kana":"ボックス で。","meaning":"Box.","romaji":"bokkusu de."},{"jp":"ソフトで。","kana":"ソフト で。","meaning":"Soft pack.","romaji":"sofuto de."}],"level":"useful","romaji":"sofuto desu ka, bokkusu desu ka."},{"id":"konbini-tobacco-03","speaker":"staff","jp":"ライターはお付けしますか。","kana":"ライター は おつけ します か。","meaning":"Would you like a lighter?","replies":[{"jp":"ライターお願いします。","kana":"ライター おねがい します。","meaning":"A lighter, please.","romaji":"raitaa onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"level":"useful","romaji":"raitaa wa otsuke shimasu ka."},{"id":"konbini-alcohol-01","speaker":"staff","jp":"店内での飲酒はご遠慮ください。","kana":"てんない で の いんしゅ は ごえんりょ ください。","meaning":"Please refrain from drinking inside the store.","level":"listen-only","romaji":"tennai de no inshu wa goenryo kudasai."}]},{"title":"Total, payment, receipt and closing","intro":"The total, how you pay, the register screens, and the final exchange.","phrases":[{"id":"konbini-pay-01","speaker":"staff","jp":"三百二十八円になります。","kana":"さんびゃく にじゅう はち えん に なります。","meaning":"It comes to 328 yen.","also_heard":[{"jp":"合計三百二十八円です。","kana":"ごうけい さんびゃく にじゅう はち えん です。","meaning":"The total is 328 yen.","romaji":"goukei sanbyaku nijuu hachi en desu."},{"jp":"三百二十八円ちょうどです。","kana":"さんびゃく にじゅう はち えん ちょうど です。","meaning":"Exactly 328 yen.","romaji":"sanbyaku nijuu hachi en choudo desu."}],"note":"Numbers come fast. The total also shows on the customer screen. No reply needed, so get your payment ready.","level":"core","romaji":"sanbyaku nijuu hachi en ni narimasu."},{"id":"konbini-pay-02","speaker":"staff","jp":"お支払いはどうされますか。","kana":"おしはらい は どう されます か。","meaning":"How will you pay?","also_heard":[{"jp":"現金ですか？カードですか？","kana":"げんきん です か？ カード です か？","meaning":"Cash or card?","romaji":"genkin desu ka? kaado desu ka?"},{"jp":"交通系ICカードですか。","kana":"こうつうけい アイシー カード です か。","meaning":"Is it a transport IC card?","romaji":"koutsuukei aishii kaado desu ka."}],"replies":[{"jp":"現金で。","kana":"げんきん で。","meaning":"Cash.","romaji":"genkin de."},{"jp":"カードで。","kana":"カード で。","meaning":"By card.","romaji":"kaado de."},{"jp":"スイカで。","kana":"スイカ で。","meaning":"With Suica.","romaji":"suika de."}],"level":"core","romaji":"oshiharai wa dou saremasu ka."},{"id":"konbini-pay-03","speaker":"you","jp":"現金でお願いします。","kana":"げんきん で おねがい します。","meaning":"Cash, please.","note":"Some self-checkout registers are cashless only. Use a staffed register for cash.","level":"core","romaji":"genkin de onegai shimasu."},{"id":"konbini-pay-04","speaker":"you","jp":"カードでお願いします。","kana":"カード で おねがい します。","meaning":"By card, please.","note":"Also: クレジットカードです (it is a credit card).","level":"core","romaji":"kaado de onegai shimasu."},{"id":"konbini-pay-05","speaker":"you","jp":"Suicaでお願いします。","kana":"スイカ で おねがい します。","meaning":"With Suica, please.","note":"Tap after the total shows. タッチできますか means can I tap?","level":"core","romaji":"suika de onegai shimasu."},{"id":"konbini-pay-06","speaker":"staff","jp":"こちらにカードをお願いします。","kana":"こちら に カード を おねがい します。","meaning":"Please put your card here.","also_heard":[{"jp":"カードを差し込んでください。","kana":"カード を さしこんで ください。","meaning":"Please insert your card.","romaji":"kaado o sashikonde kudasai."},{"jp":"カードをタッチしてください。","kana":"カード を タッチして ください。","meaning":"Please tap your card.","romaji":"kaado o tatchishite kudasai."}],"note":"Staff point at the reader. Newer terminals are contactless, older ones need insertion.","level":"core","romaji":"kochira ni kaado o onegai shimasu."},{"id":"konbini-pay-07","speaker":"staff","jp":"お支払い回数は一括でよろしいですか。","kana":"おしはらい かいすう は いっかつ で よろしい です か。","meaning":"Is it a one-time payment?","also_heard":[{"jp":"一回払いでよろしいですか。","kana":"いっかい ばらい で よろしい です か。","meaning":"Is it one payment?","romaji":"ikkai barai de yoroshii desu ka."},{"jp":"一括払いですか。","kana":"いっかつ ばらい です か。","meaning":"Is it a single payment?","romaji":"ikkatsu barai desu ka."}],"replies":[{"jp":"はい、一括で。","kana":"はい、 いっかつ で。","meaning":"Yes, one payment.","romaji":"hai, ikkatsu de."},{"jp":"一回払いで。","kana":"いっかい ばらい で。","meaning":"One payment.","romaji":"ikkai barai de."}],"note":"一括 means one payment. Anything else means instalments (分割).","level":"core","romaji":"oshiharai kaisuu wa ikkatsu de yoroshii desu ka."},{"id":"konbini-pay-08","speaker":"staff","jp":"暗証番号をお願いします。","kana":"あんしょう ばんごう を おねがい します。","meaning":"Please enter your PIN.","also_heard":[{"jp":"暗証番号を入力してください。","kana":"あんしょう ばんごう を にゅうりょく して ください。","meaning":"Please enter your PIN.","romaji":"anshou bangou o nyuuryoku shite kudasai."},{"jp":"サインはいりません。","kana":"サイン は いりません。","meaning":"No signature is needed.","romaji":"sain wa irimasen."}],"note":"Small amounts usually only need a tap.","level":"listen-only","romaji":"anshou bangou o onegai shimasu."},{"id":"konbini-pay-09","speaker":"staff","jp":"画面でお支払い方法をお選びください。","kana":"がめん で おしはらい ほうほう を おえらび ください。","meaning":"Please choose your payment method on the screen.","also_heard":[{"jp":"お客様の方でお選びください。","kana":"おきゃくさま の ほう で おえらび ください。","meaning":"Please choose on your side.","romaji":"okyakusama no hou de oerabi kudasai."},{"jp":"お金をこちらに入れてください。","kana":"おかね を こちら に いれて ください。","meaning":"Please put the money in here.","romaji":"okane o kochira ni irete kudasai."}],"note":"7-Eleven: staff scan the items, then you pay on the screen. Button names and the cash slot may differ by store.","level":"core","romaji":"gamen de oshiharai houhou o oerabi kudasai."},{"id":"konbini-pay-10","speaker":"staff","jp":"千円お預かりします。","kana":"せんえん おあずかり します。","meaning":"I receive 1,000 yen.","also_heard":[{"jp":"千円からお預かりします。","kana":"せんえん から おあずかり します。","meaning":"I receive 1,000 yen from you.","romaji":"sen'en kara oazukari shimasu."},{"jp":"ちょうどお預かりします。","kana":"ちょうど おあずかり します。","meaning":"I receive the exact amount.","romaji":"choudo oazukari shimasu."}],"note":"A statement, not a question. Wait for your change.","level":"listen-only","romaji":"sen'en oazukari shimasu."},{"id":"konbini-pay-11","speaker":"staff","jp":"六百七十二円のお返しです。","kana":"ろっぴゃく ななじゅう に えん の おかえし です。","meaning":"Your change is 672 yen.","also_heard":[{"jp":"おつりが六百七十二円です。","kana":"おつり が ろっぴゃく ななじゅう に えん です。","meaning":"Your change is 672 yen.","romaji":"otsuri ga roppyaku nanajuu ni en desu."}],"note":"Take your change from the tray or return slot.","level":"listen-only","romaji":"roppyaku nanajuu ni en no okaeshi desu."},{"id":"konbini-pay-12","speaker":"staff","jp":"レシートはご利用ですか。","kana":"レシート は ごりよう です か。","meaning":"Do you want a receipt?","also_heard":[{"jp":"レシートはいりますか。","kana":"レシート は いります か。","meaning":"Do you need a receipt?","romaji":"reshiito wa irimasu ka."},{"jp":"レシートお付けしますか。","kana":"レシート おつけ します か。","meaning":"Shall I include a receipt?","romaji":"reshiito otsuke shimasu ka."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."},{"jp":"いりません。","kana":"いりません。","meaning":"I don't need one.","romaji":"irimasen."}],"note":"For a formal receipt, ask 領収書をお願いします (ryoushuusho, please).","level":"useful","romaji":"reshiito wa goriyou desu ka."},{"id":"konbini-pay-13","speaker":"staff","jp":"ありがとうございました。","kana":"ありがとう ございました。","meaning":"Thank you.","also_heard":[{"jp":"またお越しくださいませ。","kana":"また おこし くださいませ。","meaning":"Please come again.","romaji":"mata okoshi kudasaimase."},{"jp":"お気をつけて。","kana":"おき を つけて。","meaning":"Take care.","romaji":"oki o tsukete."}],"replies":[{"jp":"ありがとうございました。","kana":"ありがとう ございました。","meaning":"Thank you.","romaji":"arigatou gozaimashita."},{"jp":"どうも。","kana":"どうも。","meaning":"Thanks.","romaji":"doumo."}],"note":"In late December: よいお年を. In January: あけましておめでとうございます.","level":"core","romaji":"arigatou gozaimashita."}]},{"title":"Hot snacks, oden and coffee","intro":"Winter staples from the counter case and the self-serve coffee machine.","phrases":[{"id":"konbini-snack-01","speaker":"you","jp":"すみません、ファミチキをください。","kana":"すみません、 ファミチキ を ください。","meaning":"Excuse me, one fried chicken, please.","note":"Swap the item, e.g. 肉まん or からあげクン. Chicken names differ by chain: ファミチキ, ななチキ, Lチキ, からあげクン.","level":"core","romaji":"sumimasen, famichiki o kudasai."},{"id":"konbini-snack-02","speaker":"staff","jp":"ホットスナックはいかがですか。","kana":"ホットスナック は いかが です か。","meaning":"Would you like a hot snack?","also_heard":[{"jp":"ご一緒にいかがですか。","kana":"ごいっしょ に いかが です か。","meaning":"Would you like anything with that?","romaji":"goissho ni ikaga desu ka."}],"replies":[{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."},{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"note":"An upsell. 大丈夫です means no.","level":"useful","romaji":"hottosunakku wa ikaga desu ka."},{"id":"konbini-snack-03","speaker":"staff","jp":"おでんは、どれにしますか。","kana":"おでん は、 どれ に します か。","meaning":"Which oden would you like?","also_heard":[{"jp":"おでんは何をおつけしますか。","kana":"おでん は なに を おつけ します か。","meaning":"What oden would you like?","romaji":"oden wa nani o otsuke shimasu ka."}],"replies":[{"jp":"大根と卵とこんにゃくをください。","kana":"だいこん と たまご と こんにゃく を ください。","meaning":"Daikon, egg and konjac, please.","romaji":"daikon to tamago to konnyaku o kudasai."},{"jp":"大根を二つください。","kana":"だいこん を ふたつ ください。","meaning":"Two daikon, please.","romaji":"daikon o futatsu kudasai."}],"note":"Some stores are self-serve with tongs and a tray, paying at the register. Items are in the vocab list below.","level":"useful","romaji":"oden wa, dore ni shimasu ka."},{"id":"konbini-snack-04","speaker":"staff","jp":"おつゆはお付けしますか。","kana":"おつゆ は おつけ します か。","meaning":"Shall I include broth?","also_heard":[{"jp":"汁はお入れしますか。","kana":"しる は おいれ します か。","meaning":"Shall I add broth?","romaji":"shiru wa oire shimasu ka."},{"jp":"からしはお付けしますか。","kana":"からし は おつけ します か。","meaning":"Shall I include mustard?","romaji":"karashi wa otsuke shimasu ka."}],"replies":[{"jp":"つゆお願いします。","kana":"つゆ おねがい します。","meaning":"With broth, please.","romaji":"tsuyu onegai shimasu."},{"jp":"からし、お願いします。","kana":"からし、 おねがい します。","meaning":"Mustard, please.","romaji":"karashi, onegai shimasu."},{"jp":"つゆなしで。","kana":"つゆ なし で。","meaning":"Without broth.","romaji":"tsuyu nashi de."}],"note":"からし is strong Japanese mustard.","level":"useful","romaji":"otsuyu wa otsuke shimasu ka."},{"id":"konbini-snack-05","speaker":"staff","jp":"ホットスナックは袋に入れますか。","kana":"ホットスナック は ふくろ に いれます か。","meaning":"Shall I put the hot snack in a bag?","also_heard":[{"jp":"紙袋でよろしいですか。","kana":"かみぶくろ で よろしい です か。","meaning":"Is a paper bag OK?","romaji":"kamibukuro de yoroshii desu ka."},{"jp":"肉まんは一緒に温めますか。","kana":"にくまん は いっしょ に あたためます か。","meaning":"Shall I heat the steamed bun with it?","romaji":"nikuman wa issho ni atatamemasu ka."}],"replies":[{"jp":"そのままで大丈夫です。","kana":"そのまま で だいじょうぶ です。","meaning":"No bag, it's fine.","romaji":"sonomama de daijoubu desu."},{"jp":"袋お願いします。","kana":"ふくろ おねがい します。","meaning":"A bag, please.","romaji":"fukuro onegai shimasu."}],"level":"useful","romaji":"hottosunakku wa fukuro ni iremasu ka."},{"id":"konbini-coffee-01","speaker":"staff","jp":"コーヒーのサイズはどうされますか。","kana":"コーヒー の サイズ は どう されます か。","meaning":"What size of coffee?","also_heard":[{"jp":"レギュラーとラージ、どちらにしますか。","kana":"レギュラー と ラージ、 どちら に します か。","meaning":"Regular or large?","romaji":"regyuraa to raaji, dochira ni shimasu ka."},{"jp":"Rサイズ？Lサイズ？","kana":"アール サイズ？ エル サイズ？","meaning":"R size or L size?","romaji":"aaru saizu? eru saizu?"}],"replies":[{"jp":"レギュラーで。","kana":"レギュラー で。","meaning":"Regular.","romaji":"regyuraa de."},{"jp":"Rでお願いします。","kana":"アール で おねがい します。","meaning":"R, please.","romaji":"aaru de onegai shimasu."},{"jp":"Lお願いします。","kana":"エル おねがい します。","meaning":"L, please.","romaji":"eru onegai shimasu."}],"note":"R is regular, L is large. You make the coffee yourself at the machine.","level":"core","romaji":"koohii no saizu wa dou saremasu ka."},{"id":"konbini-coffee-02","speaker":"staff","jp":"ホットですか、アイスですか。","kana":"ホット です か、 アイス です か。","meaning":"Hot or iced?","also_heard":[{"jp":"ホットとアイス、どちらにしますか。","kana":"ホット と アイス、 どちら に します か。","meaning":"Hot or iced?","romaji":"hotto to aisu, dochira ni shimasu ka."}],"replies":[{"jp":"ホットで。","kana":"ホット で。","meaning":"Hot.","romaji":"hotto de."},{"jp":"アイスでお願いします。","kana":"アイス で おねがい します。","meaning":"Iced, please.","romaji":"aisu de onegai shimasu."}],"note":"Iced cups are separate. For iced, press the ice button first. Mostly hot in winter.","level":"core","romaji":"hotto desu ka, aisu desu ka."},{"id":"konbini-coffee-03","speaker":"staff","jp":"カップをお渡しします。あちらのマシンでお入れください。","kana":"カップ を おわたし します。 あちら の マシン で おいれ ください。","meaning":"Here is your cup. Please make it at that machine.","also_heard":[{"jp":"ボタンを押してください。","kana":"ボタン を おして ください。","meaning":"Please press the button.","romaji":"botan o oshite kudasai."}],"note":"Put the cup in, press R or L, wait for the beep, then add the lid and sleeve.","level":"useful","romaji":"kappu o owatashi shimasu. achira no mashin de oire kudasai."},{"id":"konbini-coffee-04","speaker":"staff","jp":"ミルクとお砂糖はお付けしますか。","kana":"ミルク と おさとう は おつけ します か。","meaning":"Would you like milk and sugar?","also_heard":[{"jp":"お砂糖とミルク、いりますか。","kana":"おさとう と ミルク、 いります か。","meaning":"Do you need sugar and milk?","romaji":"osatou to miruku, irimasu ka."}],"replies":[{"jp":"ミルクだけお願いします。","kana":"ミルク だけ おねがい します。","meaning":"Only milk, please.","romaji":"miruku dake onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"level":"useful","romaji":"miruku to osatou wa otsuke shimasu ka."},{"id":"konbini-coffee-05","speaker":"staff","jp":"熱いのでお気をつけください。","kana":"あつい の で おき を つけ ください。","meaning":"It's hot, so please be careful.","also_heard":[{"jp":"やけどにお気をつけください。","kana":"やけど に おき を つけ ください。","meaning":"Please be careful not to burn yourself.","romaji":"yakedo ni oki o tsuke kudasai."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとう ございます。","meaning":"Thank you.","romaji":"arigatou gozaimasu."}],"level":"listen-only","romaji":"atsui no de oki o tsuke kudasai."}]},{"title":"Asking, requesting and changing your mind","intro":"Finding things, the toilet, the ATM and trash, plus fallback phrases when you miss something.","phrases":[{"id":"konbini-ask-01","speaker":"you","jp":"すみません、カイロはありますか。","kana":"すみません、 カイロ は あります か。","meaning":"Excuse me, do you have hand warmers?","replies":[{"jp":"はい、ございます。こちらです。","kana":"はい、 ございます。 こちら です。","meaning":"Yes, over here.","romaji":"hai, gozaimasu. kochira desu."},{"jp":"申し訳ございません、品切れです。","kana":"もうしわけ ございません、 しなぎれ です。","meaning":"Sorry, we're out of stock.","romaji":"moushiwake gozaimasen, shinagire desu."}],"note":"Swap カイロ for マスク, のど飴, 手袋 or 傘. カイロ means a heat pack.","level":"core","romaji":"sumimasen, kairo wa arimasu ka."},{"id":"konbini-ask-02","speaker":"staff","jp":"はい、ございます。こちらです。","kana":"はい、 ございます。 こちら です。","meaning":"Yes, we have it. Over here.","also_heard":[{"jp":"あちらです。","kana":"あちら です。","meaning":"Over there.","romaji":"achira desu."},{"jp":"奥の棚にあります。","kana":"おく の たな に あります。","meaning":"It's on the shelf at the back.","romaji":"oku no tana ni arimasu."},{"jp":"申し訳ございません、品切れです。","kana":"もうしわけ ございません、 しなぎれ です。","meaning":"Sorry, it's out of stock.","romaji":"moushiwake gozaimasen, shinagire desu."}],"note":"売り切れ means sold out. 品切れ means out of stock.","level":"listen-only","romaji":"hai, gozaimasu. kochira desu."},{"id":"konbini-ask-03","speaker":"you","jp":"ATMはどこですか。","kana":"エーティーエム は どこ です か。","meaning":"Where is the ATM?","replies":[{"jp":"あちらです。","kana":"あちら です。","meaning":"Over there.","romaji":"achira desu."}],"note":"Swap ATM for お手洗い, or ゴミ箱. Example: お手洗いはどこですか.","level":"core","romaji":"eetiiemu wa doko desu ka."},{"id":"konbini-ask-04","speaker":"you","jp":"お手洗いをお借りしてもいいですか。","kana":"おてあらい を おかり して も いい です か。","meaning":"May I use the toilet?","replies":[{"jp":"どうぞ、奥です。","kana":"どうぞ、 おく です。","meaning":"Yes, it's at the back.","romaji":"douzo, oku desu."},{"jp":"すみません、お手洗いはございません。","kana":"すみません、 おてあらい は ございません。","meaning":"Sorry, there is no toilet here.","romaji":"sumimasen, otearai wa gozaimasen."}],"note":"Often for customers only. Buying something first is polite. Some stores have none.","level":"core","romaji":"otearai o okari shite mo ii desu ka."},{"id":"konbini-ask-05","speaker":"staff","jp":"どうぞ、奥です。","kana":"どうぞ、 おく です。","meaning":"Please, it's at the back.","also_heard":[{"jp":"お客様用ではございません。","kana":"おきゃくさまよう で は ございません。","meaning":"It's not for customers.","romaji":"okyakusamayou de wa gozaimasen."},{"jp":"清掃中です。","kana":"せいそうちゅう です。","meaning":"It's being cleaned.","romaji":"seisouchuu desu."},{"jp":"ご利用の際は一声おかけください。","kana":"ごりよう の さい は ひとこえ おかけ ください。","meaning":"Please call out to us when you use it.","romaji":"goriyou no sai wa hitokoe okake kudasai."}],"note":"Listen for 清掃中 (being cleaned) or お客様用ではございません (not for customers).","level":"useful","romaji":"douzo, oku desu."},{"id":"konbini-ask-06","speaker":"you","jp":"ATMは使えますか。","kana":"エーティーエム は つかえます か。","meaning":"Can I use the ATM?","note":"Look for 海外発行カード (foreign cards). Not every ATM accepts foreign cards.","level":"useful","romaji":"eetiiemu wa tsukaemasu ka."},{"id":"konbini-ask-07","speaker":"you","jp":"ゴミはどこに捨てればいいですか。","kana":"ゴミ は どこ に すてれば いい です か。","meaning":"Where do I throw away the trash?","replies":[{"jp":"ゴミ箱はあちらです。","kana":"ゴミ ばこ は あちら です。","meaning":"The bin is over there.","romaji":"gomi bako wa achira desu."},{"jp":"ゴミはお持ち帰りください。","kana":"ゴミ は おもちかえり ください。","meaning":"Please take your trash with you.","romaji":"gomi wa omochikaeri kudasai."}],"note":"Bins are often split: 燃えるゴミ, ペットボトル, 缶・びん. Some stores removed outside bins. Use them for items bought there.","level":"useful","romaji":"gomi wa doko ni sutereba ii desu ka."},{"id":"konbini-ask-08","speaker":"you","jp":"電子レンジをお借りしてもいいですか。","kana":"でんし レンジ を おかり して も いい です か。","meaning":"May I use the microwave?","note":"Also: 箸をもう一ついただけますか (may I have one more pair of chopsticks?).","level":"useful","romaji":"denshi renji o okari shite mo ii desu ka."},{"id":"konbini-ask-09","speaker":"you","jp":"すみません、これも追加でお願いします。","kana":"すみません、 これ も ついか で おねがい します。","meaning":"Excuse me, please add this one too.","note":"やっぱり is the natural way to change your mind. Example: やっぱりいいです (never mind).","level":"useful","romaji":"sumimasen, kore mo tsuika de onegai shimasu."},{"id":"konbini-ask-10","speaker":"you","jp":"日本語は少ししか話せません。","kana":"にほんご は すこし しか はなせません。","meaning":"I can only speak a little Japanese.","note":"Safe fallback if you miss a question. Also: ゆっくりお願いします (slowly, please) and 英語はできますか (do you speak English?).","level":"core","romaji":"nihongo wa sukoshi shika hanasemasen."}]},{"title":"Eat-in or take-out","intro":"Some stores with an eat-in corner ask, because take-out food is taxed at 8% and eat-in at 10%.","phrases":[{"id":"konbini-eat-01","speaker":"staff","jp":"店内でお召し上がりですか、お持ち帰りですか。","kana":"てんない で おめしあがり です か、 おもちかえり です か。","meaning":"Is it to eat here or to take out?","also_heard":[{"jp":"イートインですか。","kana":"イートイン です か。","meaning":"Eat-in?","romaji":"iitoin desu ka."}],"replies":[{"jp":"店内でお願いします。","kana":"てんない で おねがい します。","meaning":"To eat in, please.","romaji":"tennai de onegai shimasu."},{"jp":"持ち帰りで。","kana":"もちかえり で。","meaning":"To take out.","romaji":"mochikaeri de."}],"note":"Eat-in items are taxed at 10%, take-out food at 8%. Stay consistent with the answer you give.","level":"core","romaji":"tennai de omeshiagari desu ka, omochikaeri desu ka."},{"id":"konbini-eat-02","speaker":"staff","jp":"店内の場合は10%、お持ち帰りは8%になります。","kana":"てんない の ばあい は じゅう パーセント、 おもちかえり は はち パーセント に なります。","meaning":"Eat-in is 10%, take-out is 8%.","also_heard":[{"jp":"店内飲食の場合は10%になります。","kana":"てんないいんしょく の ばあい は じゅう パーセント に なります。","meaning":"For eating in, it is 10%.","romaji":"tennaiinshoku no baai wa juu paasento ni narimasu."}],"level":"listen-only","romaji":"tennai no baai wa juu paasento, omochikaeri wa hachi paasento ni narimasu."},{"id":"konbini-eat-03","speaker":"staff","jp":"イートインでしたら、あちらの席をご利用ください。","kana":"イートイン で したら、 あちら の せき を ごりよう ください。","meaning":"For eating in, please use the seats over there.","also_heard":[{"jp":"イートインスペースはあちらです。","kana":"イートイン スペース は あちら です。","meaning":"The eat-in area is over there.","romaji":"iitoin supeesu wa achira desu."}],"level":"listen-only","romaji":"iitoin de shitara, achira no seki o goriyou kudasai."},{"id":"konbini-eat-04","speaker":"staff","jp":"イートインはご利用いただけません。","kana":"イートイン は ごりよう いただけません。","meaning":"Sorry, the eat-in area is not available.","also_heard":[{"jp":"今は休止中です。","kana":"いま は きゅうしちゅう です。","meaning":"It's closed for now.","romaji":"ima wa kyuushichuu desu."},{"jp":"食べ歩きはご遠慮ください。","kana":"たべあるき は ごえんりょ ください。","meaning":"Please don't eat while walking.","romaji":"tabearuki wa goenryo kudasai."}],"level":"listen-only","romaji":"iitoin wa goriyou itadakemasen."},{"id":"konbini-eat-05","speaker":"you","jp":"ここで食べます。","kana":"ここ で たべます。","meaning":"I'll eat here.","note":"Use this for eat-in. It keeps the 10% rate.","level":"core","romaji":"koko de tabemasu."},{"id":"konbini-eat-06","speaker":"you","jp":"持ち帰ります。","kana":"もちかえります。","meaning":"I'm taking it out.","note":"Also: テイクアウトです.","level":"useful","romaji":"mochikaerimasu."},{"id":"konbini-eat-07","speaker":"you","jp":"すぐ食べます。","kana":"すぐ たべます。","meaning":"I'll eat it right away.","note":"Easy to mix up. If you mean eat-in, say ここで食べます to be clear.","level":"useful","romaji":"sugu tabemasu."}]},{"title":"Konbini services","intro":"Tickets, printing and parcels, mostly via a machine or the counter.","phrases":[{"id":"konbini-service-01","speaker":"staff","jp":"こちらの用紙をレジまでお持ちください。","kana":"こちら の ようし を レジ まで おもち ください。","meaning":"Please bring this slip to the register.","also_heard":[{"jp":"申込券をレジにお持ちください。","kana":"もうしこみけん を レジ に おもち ください。","meaning":"Please bring the ticket slip to the register.","romaji":"moushikomiken o reji ni omochi kudasai."},{"jp":"レシートをレジまでお持ちください。","kana":"レシート を レジ まで おもち ください。","meaning":"Please bring the receipt to the register.","romaji":"reshiito o reji made omochi kudasai."}],"note":"Ticket machines such as Loppi (Lawson) and Famiポート (FamilyMart) print a slip. Bring it within the time shown on it.","level":"useful","romaji":"kochira no youshi o reji made omochi kudasai."},{"id":"konbini-service-02","speaker":"staff","jp":"お支払いは、レジでお願いします。","kana":"おしはらい は、 レジ で おねがい します。","meaning":"Please pay at the register.","also_heard":[{"jp":"お支払いはレジでお願いいたします。","kana":"おしはらい は レジ で おねがい いたします。","meaning":"Please pay at the register (formal).","romaji":"oshiharai wa reji de onegai itashimasu."}],"level":"useful","romaji":"oshiharai wa, reji de onegai shimasu."},{"id":"konbini-service-03","speaker":"staff","jp":"お荷物のお受け取りですか。","kana":"おにもつ の おうけとり です か。","meaning":"Are you picking up a package?","also_heard":[{"jp":"受け取りは、こちらでよろしいですか。","kana":"うけとり は、 こちら で よろしい です か。","meaning":"Is it OK to collect it here?","romaji":"uketori wa, kochira de yoroshii desu ka."}],"replies":[{"jp":"はい、受け取りです。","kana":"はい、 うけとり です。","meaning":"Yes, I'm picking it up.","romaji":"hai, uketori desu."}],"note":"Amazon, Yamato and Sagawa pick-up and lockers exist at some stores.","level":"listen-only","romaji":"onimotsu no ouketori desu ka."},{"id":"konbini-service-04","speaker":"you","jp":"荷物を送りたいんですが。","kana":"にもつ を おくり たい ん です が。","meaning":"I'd like to send a parcel.","also_heard":[{"jp":"宅配便を出したいです。","kana":"たくはいびん を だし たい です。","meaning":"I want to send a parcel by courier.","romaji":"takuhaibin o dashi tai desu."}],"replies":[{"jp":"伝票をお書きください。","kana":"でんぴょう を おかき ください。","meaning":"Please fill in the slip.","romaji":"denpyou o okaki kudasai."}],"note":"Yamato counters exist at many stores. You fill in a slip (伝票). Useful for sending a suitcase.","level":"useful","romaji":"nimotsu o okuri tai n desu ga."},{"id":"konbini-service-05","speaker":"staff","jp":"伝票をお書きください。","kana":"でんぴょう を おかき ください。","meaning":"Please fill in the slip.","also_heard":[{"jp":"お届け先のご住所をお願いします。","kana":"おとどけさき の ごじゅうしょ を おねがい します。","meaning":"Please give the delivery address.","romaji":"otodokesaki no gojuusho o onegai shimasu."},{"jp":"サイズを測ります。","kana":"サイズ を はかります。","meaning":"I'll measure the size.","romaji":"saizu o hakarimasu."},{"jp":"時間帯はご希望ですか。","kana":"じかんたい は ごきぼう です か。","meaning":"Do you have a preferred time slot?","romaji":"jikantai wa gokibou desu ka."}],"level":"listen-only","romaji":"denpyou o okaki kudasai."},{"id":"konbini-copy-01","speaker":"you","jp":"コピーを取りたいです。","kana":"コピー を とり たい です。","meaning":"I want to make copies.","note":"Also: プリントしたいです (print) and コピー機はどこですか (where is the copier?). Multi-copy machines take USB or app printing. Prices are roughly 10 yen per mono page, check the machine.","level":"useful","romaji":"kopii o tori tai desu."},{"id":"konbini-ticket-01","speaker":"you","jp":"チケットを受け取りたいです。","kana":"チケット を うけとり たい です。","meaning":"I want to pick up a ticket.","note":"If asked, say 予約番号があります (I have a reservation number).","level":"useful","romaji":"chiketto o uketori tai desu."},{"id":"konbini-ticket-02","speaker":"staff","jp":"予約番号を入力してください。","kana":"よやく ばんごう を にゅうりょく して ください。","meaning":"Please enter the reservation number.","also_heard":[{"jp":"予約番号をお願いします。","kana":"よやく ばんごう を おねがい します。","meaning":"The reservation number, please.","romaji":"yoyaku bangou o onegai shimasu."}],"level":"listen-only","romaji":"yoyaku bangou o nyuuryoku shite kudasai."}]}],"dialogues":[{"title":"A simple purchase","lines":[{"speaker":"staff","jp":"いらっしゃいませ。お次の方どうぞ。","kana":"いらっしゃいませ。 おつぎ の かた どうぞ。","meaning":"Welcome. Next person, please.","romaji":"irasshaimase. otsugi no kata douzo."},{"speaker":"you","jp":"お願いします。","kana":"おねがい します。","meaning":"Please (ring these up).","romaji":"onegai shimasu."},{"speaker":"staff","jp":"ポイントカードはお持ちですか。","kana":"ポイントカード は おもち です か。","meaning":"Do you have a point card?","romaji":"pointokaado wa omochi desu ka."},{"speaker":"you","jp":"ないです。","kana":"ない です。","meaning":"No, I don't.","romaji":"nai desu."},{"speaker":"staff","jp":"袋はご利用ですか。","kana":"ふくろ は ごりよう です か。","meaning":"Do you want a bag?","romaji":"fukuro wa goriyou desu ka."},{"speaker":"you","jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."},{"speaker":"staff","jp":"三百二十八円になります。お支払いは？","kana":"さんびゃく にじゅう はち えん に なります。 おしはらい は？","meaning":"It comes to 328 yen. How will you pay?","romaji":"sanbyaku nijuu hachi en ni narimasu. oshiharai wa?"},{"speaker":"you","jp":"Suicaでお願いします。","kana":"スイカ で おねがい します。","meaning":"With Suica, please.","romaji":"suika de onegai shimasu."},{"speaker":"staff","jp":"ありがとうございました。","kana":"ありがとう ございました。","meaning":"Thank you.","romaji":"arigatou gozaimashita."}]},{"title":"Bento and alcohol","lines":[{"speaker":"staff","jp":"お次の方どうぞ。お弁当、温めますか。","kana":"おつぎ の かた どうぞ。 おべんとう、 あたためます か。","meaning":"Next, please. Shall I heat the bento?","romaji":"otsugi no kata douzo. obentou, atatamemasu ka."},{"speaker":"you","jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."},{"speaker":"staff","jp":"お箸は何膳ですか。","kana":"おはし は なんぜん です か。","meaning":"How many pairs of chopsticks?","romaji":"ohashi wa nanzen desu ka."},{"speaker":"you","jp":"二つお願いします。","kana":"ふたつ おねがい します。","meaning":"Two, please.","romaji":"futatsu onegai shimasu."},{"speaker":"staff","jp":"年齢確認をお願いします。画面のタッチをお願いします。","kana":"ねんれい かくにん を おねがい します。 がめん の タッチ を おねがい します。","meaning":"Please confirm your age. Please touch the screen.","romaji":"nenrei kakunin o onegai shimasu. gamen no tatchi o onegai shimasu."},{"speaker":"staff","jp":"温かいものと冷たいものは分けますか。","kana":"あたたかい もの と つめたい もの は わけます か。","meaning":"Should I separate hot and cold items?","romaji":"atatakai mono to tsumetai mono wa wakemasu ka."},{"speaker":"you","jp":"はい、分けてください。","kana":"はい、 わけて ください。","meaning":"Yes, please separate them.","romaji":"hai, wakete kudasai."},{"speaker":"staff","jp":"千三百円です。お支払い方法を画面でお選びください。","kana":"せん さんびゃく えん です。 おしはらい ほうほう を がめん で おえらび ください。","meaning":"It's 1,300 yen. Please choose your payment method on the screen.","romaji":"sen sanbyaku en desu. oshiharai houhou o gamen de oerabi kudasai."},{"speaker":"staff","jp":"一括でよろしいですか。","kana":"いっかつ で よろしい です か。","meaning":"Is it a one-time payment?","romaji":"ikkatsu de yoroshii desu ka."},{"speaker":"you","jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}]},{"title":"Hot snack and coffee","lines":[{"speaker":"you","jp":"すみません、ファミチキとホットコーヒーのレギュラーをお願いします。","kana":"すみません、 ファミチキ と ホットコーヒー の レギュラー を おねがい します。","meaning":"Excuse me, one fried chicken and a regular hot coffee, please.","romaji":"sumimasen, famichiki to hottokoohii no regyuraa o onegai shimasu."},{"speaker":"staff","jp":"ファミチキ一つとホットコーヒーRですね。以上でよろしいですか。","kana":"ファミチキ ひとつ と ホットコーヒー アール です ね。 いじょう で よろしい です か。","meaning":"One fried chicken and a regular hot coffee, right? Is that everything?","romaji":"famichiki hitotsu to hottokoohii aaru desu ne. ijou de yoroshii desu ka."},{"speaker":"you","jp":"はい、以上です。","kana":"はい、 いじょう です。","meaning":"Yes, that's everything.","romaji":"hai, ijou desu."},{"speaker":"staff","jp":"店内でお召し上がりですか、お持ち帰りですか。","kana":"てんない で おめしあがり です か、 おもちかえり です か。","meaning":"Is it to eat here or to take out?","romaji":"tennai de omeshiagari desu ka, omochikaeri desu ka."},{"speaker":"you","jp":"持ち帰りで。","kana":"もちかえり で。","meaning":"To take out.","romaji":"mochikaeri de."},{"speaker":"staff","jp":"四百三十円になります。カップをお渡ししますので、あちらのマシンでお入れください。","kana":"よんひゃく さんじゅう えん に なります。 カップ を おわたし します の で、 あちら の マシン で おいれ ください。","meaning":"It comes to 430 yen. I'll hand you a cup, so please make the coffee at that machine.","romaji":"yonhyaku sanjuu en ni narimasu. kappu o owatashi shimasu no de, achira no mashin de oire kudasai."},{"speaker":"you","jp":"現金で。ありがとうございます。","kana":"げんきん で。 ありがとう ございます。","meaning":"Cash. Thank you.","romaji":"genkin de. arigatou gozaimasu."},{"speaker":"staff","jp":"ファミチキは袋に入れますか。","kana":"ファミチキ は ふくろ に いれます か。","meaning":"Shall I put the fried chicken in a bag?","romaji":"famichiki wa fukuro ni iremasu ka."},{"speaker":"you","jp":"そのままで大丈夫です。","kana":"そのまま で だいじょうぶ です。","meaning":"No bag, it's fine.","romaji":"sonomama de daijoubu desu."},{"speaker":"staff","jp":"熱いのでお気をつけください。ありがとうございました。","kana":"あつい の で おき を つけ ください。 ありがとう ございました。","meaning":"It's hot, so be careful. Thank you.","romaji":"atsui no de oki o tsuke kudasai. arigatou gozaimashita."}]}],"signs":[{"jp":"年齢確認","kana":"ねんれい かくにん","meaning":"Age confirmation","where":"Title of the alcohol and tobacco screen at the register.","romaji":"nenrei kakunin"},{"jp":"20歳以上","kana":"にじゅっさい いじょう","meaning":"Over 20","where":"The button to tap on the age check screen. 20歳以上です is the spoken form.","romaji":"nijussai ijou"},{"jp":"画面にタッチ","kana":"がめん に タッチ","meaning":"Touch the screen","where":"Register prompt. Also written as タッチしてください.","romaji":"gamen ni tatchi"},{"jp":"温め","kana":"あたため","meaning":"Heat","where":"Bento sticker or register button. 温め不要 or 温めなし means no heating.","romaji":"atatame"},{"jp":"現金","kana":"げんきん","meaning":"Cash","where":"Payment button. Machines also show 現金投入口 (cash slot) and おつり返却口 (change return).","romaji":"genkin"},{"jp":"クレジット","kana":"クレジット","meaning":"Credit card","where":"Payment button on the screen. Also クレジットカード.","romaji":"kurejitto"},{"jp":"交通系電子マネー","kana":"こうつうけい でんし マネー","meaning":"Transport e-money (Suica and similar)","where":"Payment button for IC cards. Also written 交通系IC.","romaji":"koutsuukei denshi manee"},{"jp":"税込","kana":"ぜいこみ","meaning":"Tax included","where":"Price tags. 税抜 means tax excluded, and 本体価格 means base price.","romaji":"zeikomi"},{"jp":"軽減税率 8%","kana":"けいげんぜいりつ はち パーセント","meaning":"Reduced 8% tax rate","where":"Marked with ※ on take-out food. The standard rate is 10% (標準税率 10%).","romaji":"keigenzeiritsu hachi paasento"},{"jp":"店内飲食","kana":"てんないいんしょく","meaning":"Eat-in","where":"Also written イートイン. Take-out is テイクアウト or 持ち帰り.","romaji":"tennaiinshoku"},{"jp":"ホット","kana":"ホット","meaning":"Hot","where":"Coffee machine button. Also アイス (iced), and R or L for regular or large.","romaji":"hotto"},{"jp":"お手洗い","kana":"おてあらい","meaning":"Toilet","where":"Also トイレ. The door sign shows 使用中 (in use) or 空き (vacant).","romaji":"otearai"},{"jp":"電子レンジ","kana":"でんし レンジ","meaning":"Microwave","where":"Sign by the microwave. ご自由にお使いください means free to use.","romaji":"denshi renji"},{"jp":"電子マネー","kana":"でんし マネー","meaning":"E-money","where":"Payment sign. Also nanaco, iD, QUICPay and QRコード決済.","romaji":"denshi manee"},{"jp":"レジ袋 有料","kana":"レジぶくろ ゆうりょう","meaning":"Plastic bags cost money","where":"Also 袋 S, M, L, and お箸・スプーン (chopsticks and spoon) on the counter.","romaji":"rejibukuro yuuryou"},{"jp":"ATM","kana":"エーティーエム","meaning":"ATM","where":"Also 海外発行カード対応 (foreign cards accepted). Bin signs: ゴミ箱, 燃えるゴミ, ペットボトル, 缶・びん.","romaji":"eetiiemu"}],"vocab":[{"title":"Hot snacks","items":[{"jp":"肉まん","kana":"にくまん","meaning":"steamed meat bun","romaji":"nikuman"},{"jp":"あんまん","kana":"あんまん","meaning":"steamed sweet bean bun","romaji":"anman"},{"jp":"ピザまん","kana":"ピザまん","meaning":"steamed pizza bun","romaji":"pizaman"},{"jp":"からあげクン","kana":"からあげクン","meaning":"fried chicken bites (Lawson)","romaji":"karaagekun"},{"jp":"ファミチキ","kana":"ファミチキ","meaning":"fried chicken (FamilyMart)","romaji":"famichiki"}]},{"title":"Oden","items":[{"jp":"大根","kana":"だいこん","meaning":"daikon radish","romaji":"daikon"},{"jp":"卵","kana":"たまご","meaning":"boiled egg","romaji":"tamago"},{"jp":"こんにゃく","kana":"こんにゃく","meaning":"konjac jelly","romaji":"konnyaku"},{"jp":"ちくわ","kana":"ちくわ","meaning":"fish cake tube","romaji":"chikuwa"},{"jp":"はんぺん","kana":"はんぺん","meaning":"fluffy fish cake","romaji":"hanpen"},{"jp":"牛すじ","kana":"ぎゅうすじ","meaning":"beef tendon","romaji":"gyuusuji"},{"jp":"餅巾着","kana":"もちきんちゃく","meaning":"tofu pouch with mochi","romaji":"mochikinchaku"}]}],"_num":"01"},{"slug":"airport","title":"Airport and immigration","title_jp":"空港","summary":"Immigration, customs, bags, security and gate calls","situations":[{"title":"Before landing","intro":"Announcements in the last 30 to 40 minutes of the flight. Mostly listen-only, but learn the forms.","phrases":[{"id":"airport-plane-01","speaker":"announcement","jp":"入国カードと税関申告書をお配りしております。","kana":"にゅうこく カード と ぜいかん しんこくしょ を おくばり して おります。","meaning":"We are handing out landing cards and customs forms.","note":"If you registered on Visit Japan Web you may not need the paper landing card. Otherwise fill in the paper forms.","level":"useful","romaji":"nyuukoku kaado to zeikan shinkokusho o okubari shite orimasu."},{"id":"airport-plane-02","speaker":"announcement","jp":"まだお持ちでない方はお申し出ください。","kana":"まだ おもち で ない かた は おもうしで ください。","meaning":"If you do not have one yet, please ask.","note":"If you have no form, ask a crew member. They will bring one.","level":"useful","romaji":"mada omochi de nai kata wa omoushide kudasai."},{"id":"airport-plane-03","speaker":"you","jp":"すみません、入国カードをください。","kana":"すみません、 にゅうこく カード を ください。","meaning":"Excuse me, a landing card, please.","level":"useful","romaji":"sumimasen, nyuukoku kaado o kudasai."},{"id":"airport-plane-04","speaker":"you","jp":"入国カードをもう一枚いただけますか。","kana":"にゅうこく カード を もう いちまい いただけます か。","meaning":"Could I have one more landing card?","also_heard":[{"jp":"もう一枚ください。","kana":"もう いちまい ください。","meaning":"One more, please.","romaji":"mou ichimai kudasai."}],"level":"useful","romaji":"nyuukoku kaado o mou ichimai itadakemasu ka."},{"id":"airport-plane-05","speaker":"you","jp":"書き間違えました。","kana":"かきまちがえました。","meaning":"I made a mistake when writing.","note":"Use this when you need a fresh form because you wrote something wrong.","level":"useful","romaji":"kakimachigaemashita."},{"id":"airport-plane-06","speaker":"announcement","jp":"ビジットジャパンウェブをご利用の方は、QRコードを入国審査でご提示ください。","kana":"ビジットジャパンウェブ を ごりよう の かた は、 キューアール コード を にゅうこく しんさ で ごていじ ください。","meaning":"If you used Visit Japan Web, show the QR code at immigration.","note":"Have the QR code ready on your phone before you reach the immigration counter.","level":"listen-only","romaji":"bijittojapan'webu o goriyou no kata wa, kyuuaaru koodo o nyuukoku shinsa de goteiji kudasai."},{"id":"airport-plane-07","speaker":"announcement","jp":"まもなく着陸いたします。","kana":"まもなく ちゃくりく いたします。","meaning":"We will land soon.","level":"listen-only","romaji":"mamonaku chakuriku itashimasu."},{"id":"airport-plane-08","speaker":"announcement","jp":"シートベルトをお締めください。","kana":"シートベルト を おしめ ください。","meaning":"Please fasten your seatbelt.","level":"listen-only","romaji":"shiitoberuto o oshime kudasai."},{"id":"airport-plane-09","speaker":"announcement","jp":"座席を元の位置にお戻しください。","kana":"ざせき を もと の いち に おもどし ください。","meaning":"Please return your seat to the upright position.","also_heard":[{"jp":"背もたれをお戻しください。","kana":"せもたれ を おもどし ください。","meaning":"Please return your seatback.","romaji":"semotare o omodoshi kudasai."}],"level":"listen-only","romaji":"zaseki o moto no ichi ni omodoshi kudasai."},{"id":"airport-plane-10","speaker":"announcement","jp":"テーブルをお戻しください。","kana":"テーブル を おもどし ください。","meaning":"Please return your tray table.","level":"listen-only","romaji":"teeburu o omodoshi kudasai."},{"id":"airport-plane-11","speaker":"announcement","jp":"機体が完全に停止するまで、お席をお立ちにならないようお願いいたします。","kana":"きたい が かんぜん に ていし する まで、 おせき を おたち に ならない よう おねがい いたします。","meaning":"Please stay seated until the aircraft has completely stopped.","level":"listen-only","romaji":"kitai ga kanzen ni teishi suru made, oseki o otachi ni naranai you onegai itashimasu."},{"id":"airport-plane-12","speaker":"announcement","jp":"手荷物にご注意ください。","kana":"てにもつ に ごちゅうい ください。","meaning":"Please be careful with your belongings.","also_heard":[{"jp":"上の棚をお開けの際はご注意ください。","kana":"うえ の たな を おあけ の さい は ごちゅうい ください。","meaning":"Please be careful when opening the overhead bins.","romaji":"ue no tana o oake no sai wa gochuui kudasai."}],"level":"listen-only","romaji":"tenimotsu ni gochuui kudasai."},{"id":"airport-plane-13","speaker":"announcement","jp":"羽田空港に到着いたしました。","kana":"はねだくうこう に とうちゃく いたしました。","meaning":"We have arrived at Haneda Airport.","level":"listen-only","romaji":"hanedakuukou ni touchaku itashimashita."},{"id":"airport-plane-14","speaker":"announcement","jp":"現地時間は午後三時十分です。","kana":"げんち じかん は ごご さんじ じゅっぷん です。","meaning":"The local time is 3:10 in the afternoon.","note":"Japan has no daylight saving time. In winter Tokyo is 17 hours ahead of Los Angeles, so change your watch.","level":"listen-only","romaji":"genchi jikan wa gogo sanji juppun desu."},{"id":"airport-plane-15","speaker":"you","jp":"すみません、乗り継ぎではなく、日本に入国します。","kana":"すみません、 のりつぎ では なく、 にほん に にゅうこく します。","meaning":"Excuse me, I am not transferring. I am entering Japan.","note":"Use this if a crew member or ground staff points you to the transfer line. 乗り継ぎ means transfer.","level":"useful","romaji":"sumimasen, noritsugi dewa naku, nihon ni nyuukoku shimasu."}]},{"title":"Walk to immigration and quarantine","intro":"Signs, staff directing the crowd, and health questions before the immigration desk.","phrases":[{"id":"airport-queue-01","speaker":"staff","jp":"外国人の方はこちらです。","kana":"がいこくじん の かた は こちら です。","meaning":"Foreign passport holders, this way.","note":"This is the queue for foreign passports. Follow the signs and the staff hand signals. No reply needed beyond a nod.","level":"core","romaji":"gaikokujin no kata wa kochira desu."},{"id":"airport-queue-02","speaker":"staff","jp":"日本人の方はあちらです。","kana":"にほんじん の かた は あちら です。","meaning":"Japanese passport holders, over there.","level":"listen-only","romaji":"nihonjin no kata wa achira desu."},{"id":"airport-queue-03","speaker":"staff","jp":"前の人に続いてお進みください。","kana":"まえ の ひと に つづいて おすすみ ください。","meaning":"Please follow the person in front of you.","level":"listen-only","romaji":"mae no hito ni tsuzuite osusumi kudasai."},{"id":"airport-queue-04","speaker":"staff","jp":"白い線でお待ちください。","kana":"しろい せん で おまち ください。","meaning":"Please wait behind the white line.","level":"listen-only","romaji":"shiroi sen de omachi kudasai."},{"id":"airport-queue-05","speaker":"staff","jp":"体調はいかがですか。","kana":"たいちょう は いかが です か。","meaning":"How are you feeling?","replies":[{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"I am fine.","romaji":"daijoubu desu."},{"jp":"元気です。","kana":"げんき です。","meaning":"I am well.","romaji":"genki desu."}],"level":"useful","romaji":"taichou wa ikaga desu ka."},{"id":"airport-queue-06","speaker":"staff","jp":"熱や咳はありますか。","kana":"ねつ や せき は あります か。","meaning":"Do you have a fever or a cough?","replies":[{"jp":"ありません。","kana":"ありません。","meaning":"No, I don't.","romaji":"arimasen."},{"jp":"はい、あります。","kana":"はい、 あります。","meaning":"Yes, I do.","romaji":"hai, arimasu."}],"note":"Answer honestly and briefly. If you feel unwell, say so and the staff will check you.","level":"useful","romaji":"netsu ya seki wa arimasu ka."},{"id":"airport-queue-07","speaker":"staff","jp":"質問票はお持ちですか。","kana":"しつもんひょう は おもち です か。","meaning":"Do you have the health questionnaire?","replies":[{"jp":"はい、あります。","kana":"はい、 あります。","meaning":"Yes, I do.","romaji":"hai, arimasu."},{"jp":"いいえ、ありません。","kana":"いいえ、 ありません。","meaning":"No, I don't.","romaji":"iie, arimasen."}],"note":"Not confirmed for 2026. If you filled in the questionnaire online, show the screen. Otherwise say no.","level":"useful","romaji":"shitsumonhyou wa omochi desu ka."},{"id":"airport-queue-08","speaker":"staff","jp":"最近、アフリカなどの感染症の流行地域に行かれましたか。","kana":"さいきん、 アフリカ など の かんせんしょう の りゅうこうちいき に いかれました か。","meaning":"Have you recently been to an area with an infectious disease outbreak, such as in Africa?","replies":[{"jp":"いいえ、行っていません。","kana":"いいえ、 いっていません。","meaning":"No, I have not been there.","romaji":"iie, itteimasen."}],"note":"This applies only if you visited an outbreak area recently. Answer honestly.","level":"useful","romaji":"saikin, afurika nado no kansenshou no ryuukouchiiki ni ikaremashita ka."},{"id":"airport-queue-09","speaker":"you","jp":"入国審査はどちらですか。","kana":"にゅうこく しんさ は どちら です か。","meaning":"Where is immigration?","replies":[{"jp":"あちらです。","kana":"あちら です。","meaning":"Over there.","romaji":"achira desu."},{"jp":"こちらです。","kana":"こちら です。","meaning":"This way.","romaji":"kochira desu."}],"note":"Signs may say 入国審査場, which is the same place.","level":"core","romaji":"nyuukoku shinsa wa dochira desu ka."},{"id":"airport-queue-10","speaker":"you","jp":"妻と一緒に並んでもいいですか。","kana":"つま と いっしょ に ならんで も いい です か。","meaning":"May I stand in line together with my wife?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"note":"If staff send you to separate lines, ask them where to go. They will usually point you to one line.","level":"useful","romaji":"tsuma to issho ni narande mo ii desu ka."}]},{"title":"Immigration desk","intro":"The most important exchange. Officers ask short, polite questions. Answer briefly and clearly.","phrases":[{"id":"airport-immig-01","speaker":"staff","jp":"パスポートをお願いします。","kana":"パスポート を おねがい します。","meaning":"Passport, please.","also_heard":[{"jp":"パスポートを見せてください。","kana":"パスポート を みせて ください。","meaning":"Please show me your passport.","romaji":"pasupooto o misete kudasai."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."}],"note":"Hand it over with both hands, open to the photo page.","level":"core","romaji":"pasupooto o onegai shimasu."},{"id":"airport-immig-02","speaker":"staff","jp":"入国カードもお願いします。","kana":"にゅうこく カード も おねがい します。","meaning":"Landing card too, please.","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."}],"note":"Give the completed landing card together with your passport.","level":"useful","romaji":"nyuukoku kaado mo onegai shimasu."},{"id":"airport-immig-03","speaker":"staff","jp":"入国の目的は何ですか。","kana":"にゅうこく の もくてき は なん です か。","meaning":"What is the purpose of your visit?","also_heard":[{"jp":"ご旅行ですか。","kana":"ごりょこう です か。","meaning":"Are you travelling?","romaji":"goryokou desu ka."}],"replies":[{"jp":"観光です。","kana":"かんこう です。","meaning":"Sightseeing.","romaji":"kankou desu."},{"jp":"旅行です。","kana":"りょこう です。","meaning":"Travel.","romaji":"ryokou desu."}],"level":"core","romaji":"nyuukoku no mokuteki wa nan desu ka."},{"id":"airport-immig-04","speaker":"staff","jp":"何日間、滞在しますか。","kana":"なんにちかん、 たいざい します か。","meaning":"How many days will you stay?","replies":[{"jp":"約四週間です。","kana":"やく よんしゅうかん です。","meaning":"About four weeks.","romaji":"yaku yonshuukan desu."},{"jp":"二十七日間です。","kana":"にじゅうなな にちかん です。","meaning":"27 days.","romaji":"nijuunana nichikan desu."}],"note":"27 days is the same as about four weeks. Say whichever is easier for you.","level":"core","romaji":"nannichikan, taizai shimasu ka."},{"id":"airport-immig-05","speaker":"staff","jp":"どこに泊まりますか。","kana":"どこ に とまります か。","meaning":"Where will you stay?","replies":[{"jp":"上野のホテルに泊まります。","kana":"うえの の ホテル に とまります。","meaning":"I will stay at a hotel in Ueno.","romaji":"ueno no hoteru ni tomarimasu."},{"jp":"いくつかの都市を旅行します。","kana":"いくつ か の とし を りょこう します。","meaning":"I will travel to several cities.","romaji":"ikutsu ka no toshi o ryokou shimasu."}],"note":"Have the hotel name and address on your phone. Say you will visit several cities if asked about the rest of the trip.","level":"core","romaji":"doko ni tomarimasu ka."},{"id":"airport-immig-06","speaker":"staff","jp":"何回目の来日ですか。","kana":"なんかいめ の らいにち です か。","meaning":"How many times have you come to Japan?","replies":[{"jp":"二回目です。","kana":"にかいめ です。","meaning":"This is my second time.","romaji":"nikaime desu."}],"level":"useful","romaji":"nankaime no rainichi desu ka."},{"id":"airport-immig-07","speaker":"staff","jp":"日本は初めてですか。","kana":"にほん は はじめて です か。","meaning":"Is this your first time in Japan?","replies":[{"jp":"いいえ、二回目です。","kana":"いいえ、 にかいめ です。","meaning":"No, it is my second time.","romaji":"iie, nikaime desu."}],"level":"useful","romaji":"nihon wa hajimete desu ka."},{"id":"airport-immig-08","speaker":"staff","jp":"帰りの航空券はありますか。","kana":"かえり の こうくうけん は あります か。","meaning":"Do you have a return ticket?","also_heard":[{"jp":"出国の航空券はお持ちですか。","kana":"しゅっこく の こうくうけん は おもち です か。","meaning":"Do you have your departure ticket?","romaji":"shukkoku no koukuuken wa omochi desu ka."}],"replies":[{"jp":"はい、あります。一月十二日です。","kana":"はい、 あります。 いちがつ じゅうににち です。","meaning":"Yes, I have one. It is January 12.","romaji":"hai, arimasu. ichigatsu juuninichi desu."}],"note":"Keep the e-ticket on your phone. Your departure date is January 12.","level":"core","romaji":"kaeri no koukuuken wa arimasu ka."},{"id":"airport-immig-09","speaker":"staff","jp":"指紋を採ります。","kana":"しもん を とります。","meaning":"We will take your fingerprints.","note":"Fingerprints are taken at the immigration counter or a stand. The stand can also take a photo.","level":"core","romaji":"shimon o torimasu."},{"id":"airport-immig-10","speaker":"staff","jp":"両手の人差し指をここに置いてください。","kana":"りょうて の ひとさしゆび を ここ に おいて ください。","meaning":"Please place both index fingers here.","also_heard":[{"jp":"人差し指を置いてください。","kana":"ひとさしゆび を おいて ください。","meaning":"Please place your index fingers.","romaji":"hitosashiyubi o oite kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"人差し指 means index finger. Put both index fingers on the scanner, not your whole hand.","level":"core","romaji":"ryoute no hitosashiyubi o koko ni oite kudasai."},{"id":"airport-immig-11","speaker":"staff","jp":"指を離してください。","kana":"ゆび を はなして ください。","meaning":"Please lift your fingers.","note":"Lift your fingers when you are told to.","level":"useful","romaji":"yubi o hanashite kudasai."},{"id":"airport-immig-12","speaker":"staff","jp":"カメラを見てください。","kana":"カメラ を みて ください。","meaning":"Please look at the camera.","note":"Look straight at the camera and keep still for the photo.","level":"core","romaji":"kamera o mite kudasai."},{"id":"airport-immig-13","speaker":"staff","jp":"帽子とマスクとメガネを外してください。","kana":"ぼうし と マスク と メガネ を はずして ください。","meaning":"Please take off your hat, mask and glasses.","note":"Take these off before the photo so the camera can see your face clearly.","level":"core","romaji":"boushi to masuku to megane o hazushite kudasai."},{"id":"airport-immig-14","speaker":"staff","jp":"前髪を上げてください。","kana":"まえがみ を あげて ください。","meaning":"Please lift your fringe.","level":"useful","romaji":"maegami o agete kudasai."},{"id":"airport-immig-15","speaker":"staff","jp":"奥さんと一緒ですか。","kana":"おくさん と いっしょ です か。","meaning":"Are you travelling with your wife?","also_heard":[{"jp":"お連れ様ですか。","kana":"おつれさま です か。","meaning":"Are you with someone?","romaji":"otsuresama desu ka."}],"replies":[{"jp":"はい、妻と一緒です。","kana":"はい、 つま と いっしょ です。","meaning":"Yes, I am with my wife.","romaji":"hai, tsuma to issho desu."},{"jp":"いいえ、一人です。","kana":"いいえ、 ひとり です。","meaning":"No, I am alone.","romaji":"iie, hitori desu."}],"note":"Staff say 奥さん for someone else's wife. You say 妻 for your own wife.","level":"useful","romaji":"okusan to issho desu ka."},{"id":"airport-immig-16","speaker":"staff","jp":"はい、結構です。","kana":"はい、 けっこう です。","meaning":"Yes, that is fine.","level":"useful","romaji":"hai, kekkou desu."},{"id":"airport-immig-17","speaker":"staff","jp":"以上です。","kana":"いじょう です。","meaning":"That is all.","note":"以上です means that is all. どうぞ means go ahead, so you can leave the booth.","level":"listen-only","romaji":"ijou desu."},{"id":"airport-immig-18","speaker":"staff","jp":"ようこそ日本へ。","kana":"ようこそ にほん へ。","meaning":"Welcome to Japan.","replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"Before you leave the booth, check that your passport has been stamped or marked.","level":"useful","romaji":"youkoso nihon e."}]},{"title":"Baggage claim","intro":"Finding your carousel, and what to do if a bag is missing or damaged.","phrases":[{"id":"airport-bags-01","speaker":"you","jp":"ユナイテッドの荷物はどこで受け取りますか。","kana":"ユナイテッド の にもつ は どこ で うけとります か。","meaning":"Where do I collect the baggage for United?","replies":[{"jp":"三番のターンテーブルです。","kana":"さんばん の ターンテーブル です。","meaning":"Carousel number three.","romaji":"sanban no taanteeburu desu."}],"note":"Swap the airline name. Screens above each carousel show the flight number.","level":"core","romaji":"yunaiteddo no nimotsu wa doko de uketorimasu ka."},{"id":"airport-bags-02","speaker":"staff","jp":"三番のターンテーブルです。","kana":"さんばん の ターンテーブル です。","meaning":"It is carousel number three.","also_heard":[{"jp":"あちらの六番です。","kana":"あちら の ろくばん です。","meaning":"The one over there, number six.","romaji":"achira no rokuban desu."}],"note":"Check the monitor for your flight number and the carousel number.","level":"core","romaji":"sanban no taanteeburu desu."},{"id":"airport-bags-03","speaker":"you","jp":"荷物が出てきません。","kana":"にもつ が でてきません。","meaning":"My bag has not come out.","level":"core","romaji":"nimotsu ga detekimasen."},{"id":"airport-bags-04","speaker":"you","jp":"荷物が見つかりません。","kana":"にもつ が みつかりません。","meaning":"I cannot find my bag.","level":"useful","romaji":"nimotsu ga mitsukarimasen."},{"id":"airport-bags-05","speaker":"you","jp":"荷物が届いていません。","kana":"にもつ が とどいていません。","meaning":"My bag has not arrived.","level":"useful","romaji":"nimotsu ga todoiteimasen."},{"id":"airport-bags-06","speaker":"staff","jp":"荷物のタグを見せてください。","kana":"にもつ の タグ を みせて ください。","meaning":"Please show me your baggage tag.","note":"Keep the tag stub from check-in until your bag is found.","level":"useful","romaji":"nimotsu no tagu o misete kudasai."},{"id":"airport-bags-07","speaker":"staff","jp":"荷物の特徴を教えてください。","kana":"にもつ の とくちょう を おしえて ください。","meaning":"Please describe your bag.","replies":[{"jp":"黒いスーツケースです。","kana":"くろい スーツケース です。","meaning":"It is a black suitcase.","romaji":"kuroi suutsukeesu desu."},{"jp":"大きい黒いスーツケースです。","kana":"おおきい くろい スーツケース です。","meaning":"It is a large black suitcase.","romaji":"ookii kuroi suutsukeesu desu."}],"level":"useful","romaji":"nimotsu no tokuchou o oshiete kudasai."},{"id":"airport-bags-08","speaker":"staff","jp":"ホテルの住所と連絡先を書いてください。","kana":"ホテル の じゅうしょ と れんらくさき を かいて ください。","meaning":"Please write your hotel address and contact details.","replies":[{"jp":"上野のホテルです。","kana":"うえの の ホテル です。","meaning":"It is a hotel in Ueno.","romaji":"ueno no hoteru desu."}],"level":"useful","romaji":"hoteru no juusho to renrakusaki o kaite kudasai."},{"id":"airport-bags-09","speaker":"staff","jp":"ホテルにお届けします。","kana":"ホテル に おとどけ します。","meaning":"We will deliver it to your hotel.","note":"Delivery to the hotel is the usual option when a bag is lost on arrival.","level":"useful","romaji":"hoteru ni otodoke shimasu."},{"id":"airport-bags-10","speaker":"you","jp":"スーツケースが壊れています。","kana":"スーツケース が こわれています。","meaning":"My suitcase is broken.","note":"Report damage before you leave the baggage area.","level":"useful","romaji":"suutsukeesu ga kowareteimasu."},{"id":"airport-bags-11","speaker":"you","jp":"スーツケースに傷がついています。","kana":"スーツケース に きず が ついています。","meaning":"My suitcase is scratched.","level":"useful","romaji":"suutsukeesu ni kizu ga tsuiteimasu."},{"id":"airport-bags-12","speaker":"you","jp":"手荷物サービスカウンターはどこですか。","kana":"てにもつ サービス カウンター は どこ です か。","meaning":"Where is the baggage service counter?","replies":[{"jp":"あちらです。","kana":"あちら です。","meaning":"Over there.","romaji":"achira desu."}],"note":"Look for 手荷物サービスカウンター or a sign for lost baggage claims.","level":"core","romaji":"tenimotsu saabisu kauntaa wa doko desu ka."},{"id":"airport-bags-13","speaker":"staff","jp":"この荷物は違いますよ。","kana":"この にもつ は ちがいます よ。","meaning":"This bag is not yours.","also_heard":[{"jp":"間違えていませんか。","kana":"まちがえて いません か。","meaning":"Are you sure you have not made a mistake?","romaji":"machigaete imasen ka."}],"note":"Staff may check that you are picking up the right bag. Look at your tag before you take one.","level":"listen-only","romaji":"kono nimotsu wa chigaimasu yo."}]},{"title":"Customs","intro":"Mostly a QR scan at the e-gate. Officers sometimes ask a few questions or open a bag.","phrases":[{"id":"airport-customs-01","speaker":"staff","jp":"申告するものはありますか。","kana":"しんこく する もの は あります か。","meaning":"Do you have anything to declare?","also_heard":[{"jp":"申告するものはお持ちですか。","kana":"しんこく する もの は おもち です か。","meaning":"Do you have anything to declare?","romaji":"shinkoku suru mono wa omochi desu ka."}],"replies":[{"jp":"ありません。","kana":"ありません。","meaning":"No, I have nothing.","romaji":"arimasen."}],"note":"Be honest. If you have items to declare, tell the officer and follow the declaration signs.","level":"core","romaji":"shinkoku suru mono wa arimasu ka."},{"id":"airport-customs-02","speaker":"staff","jp":"QRコードを機械にかざしてください。","kana":"キューアール コード を きかい に かざして ください。","meaning":"Please hold your QR code over the machine.","note":"Show the Visit Japan Web QR code. Old tax app codes no longer work at the e-gate.","level":"core","romaji":"kyuuaaru koodo o kikai ni kazashite kudasai."},{"id":"airport-customs-03","speaker":"staff","jp":"ゲートにお進みください。","kana":"ゲート に おすすみ ください。","meaning":"Please go through the gate.","level":"listen-only","romaji":"geeto ni osusumi kudasai."},{"id":"airport-customs-04","speaker":"staff","jp":"荷物を開けてもいいですか。","kana":"にもつ を あけて も いい です か。","meaning":"May I open your bag?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"level":"core","romaji":"nimotsu o akete mo ii desu ka."},{"id":"airport-customs-05","speaker":"staff","jp":"中を見せてください。","kana":"なか を みせて ください。","meaning":"Please show me the inside.","replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"level":"core","romaji":"naka o misete kudasai."},{"id":"airport-customs-06","speaker":"staff","jp":"食べ物、肉、野菜、果物はありますか。","kana":"たべもの、 にく、 やさい、 くだもの は あります か。","meaning":"Do you have any food, meat, vegetables or fruit?","replies":[{"jp":"いいえ、ありません。","kana":"いいえ、 ありません。","meaning":"No, I don't have any.","romaji":"iie, arimasen."},{"jp":"お菓子があります。","kana":"おかし が あります。","meaning":"I have some snacks.","romaji":"okashi ga arimasu."}],"note":"Be honest. Meat, many fruits and plant items are restricted or must be declared. If you are unsure about a food, declare it.","level":"core","romaji":"tabemono, niku, yasai, kudamono wa arimasu ka."},{"id":"airport-customs-07","speaker":"staff","jp":"現金はいくら持っていますか。","kana":"げんきん は いくら もっています か。","meaning":"How much cash do you have?","replies":[{"jp":"少しだけです。","kana":"すこし だけ です。","meaning":"Only a little.","romaji":"sukoshi dake desu."}],"level":"useful","romaji":"genkin wa ikura motteimasu ka."},{"id":"airport-customs-08","speaker":"staff","jp":"百万円相当を超えていますか。","kana":"ひゃくまんえん そうとう を こえています か。","meaning":"Is it more than one million yen equivalent?","replies":[{"jp":"いいえ、超えていません。","kana":"いいえ、 こえていません。","meaning":"No, it is not more than that.","romaji":"iie, koeteimasen."}],"note":"Cash above a set limit must be declared. Check the current amount on the customs website before you travel.","level":"useful","romaji":"hyakuman'en soutou o koeteimasu ka."},{"id":"airport-customs-09","speaker":"staff","jp":"免税品の範囲を超える物はありますか。","kana":"めんぜいひん の はんい を こえる もの は あります か。","meaning":"Do you have anything over the duty-free allowance?","replies":[{"jp":"いいえ。","kana":"いいえ。","meaning":"No.","romaji":"iie."}],"level":"useful","romaji":"menzeihin no han'i o koeru mono wa arimasu ka."},{"id":"airport-customs-10","speaker":"staff","jp":"お酒やたばこはお持ちですか。","kana":"おさけ や たばこ は おもち です か。","meaning":"Do you have alcohol or cigarettes?","replies":[{"jp":"ワインが一本です。","kana":"ワイン が いっぽん です。","meaning":"I have one bottle of wine.","romaji":"wain ga ippon desu."},{"jp":"いいえ、ありません。","kana":"いいえ、 ありません。","meaning":"No, I don't.","romaji":"iie, arimasen."}],"level":"useful","romaji":"osake ya tabako wa omochi desu ka."},{"id":"airport-customs-11","speaker":"staff","jp":"何のために持ってきましたか。","kana":"なん の ため に もって きました か。","meaning":"What did you bring these for?","also_heard":[{"jp":"ご自分用ですか。","kana":"ごじぶんよう です か。","meaning":"Is it for yourself?","romaji":"gojibun'you desu ka."}],"replies":[{"jp":"自分用です。","kana":"じぶんよう です。","meaning":"It is for myself.","romaji":"jibun'you desu."},{"jp":"旅行用です。","kana":"りょこうよう です。","meaning":"It is for the trip.","romaji":"ryokouyou desu."}],"level":"useful","romaji":"nan no tame ni motte kimashita ka."},{"id":"airport-customs-12","speaker":"staff","jp":"ご協力ありがとうございました。","kana":"ごきょうりょく ありがとうございました。","meaning":"Thank you for your cooperation.","level":"listen-only","romaji":"gokyouryoku arigatougozaimashita."},{"id":"airport-customs-13","speaker":"staff","jp":"お通りください。","kana":"おとおり ください。","meaning":"Please go through.","level":"listen-only","romaji":"otoori kudasai."}]},{"title":"Arrivals hall services","intro":"Money, an IC card, a SIM or pocket Wi-Fi, and sending a suitcase ahead.","phrases":[{"id":"airport-arrival-01","speaker":"you","jp":"両替所はどこですか。","kana":"りょうがえじょ は どこ です か。","meaning":"Where is the currency exchange?","level":"core","romaji":"ryougaejo wa doko desu ka."},{"id":"airport-arrival-02","speaker":"you","jp":"ATMはどこですか。","kana":"エーティーエム は どこ です か。","meaning":"Where is the ATM?","note":"Look for ATMs that say they accept foreign cards. Not all of them do.","level":"core","romaji":"eetiiemu wa doko desu ka."},{"id":"airport-arrival-03","speaker":"you","jp":"ドルを円に両替したいです。","kana":"ドル を えん に りょうがえ したい です。","meaning":"I would like to exchange dollars into yen.","replies":[{"jp":"パスポートをお願いします。","kana":"パスポート を おねがい します。","meaning":"Passport, please.","romaji":"pasupooto o onegai shimasu."},{"jp":"おいくらですか。","kana":"おいくら です か。","meaning":"How much would you like to exchange?","romaji":"oikura desu ka."}],"level":"core","romaji":"doru o en ni ryougae shitai desu."},{"id":"airport-arrival-04","speaker":"you","jp":"二百ドルです。","kana":"にひゃく ドル です。","meaning":"Two hundred dollars.","note":"Change the amount to whatever you want to exchange.","level":"core","romaji":"nihyaku doru desu."},{"id":"airport-arrival-05","speaker":"staff","jp":"手数料がかかります。","kana":"てすうりょう が かかります。","meaning":"There is a fee.","replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that is fine.","romaji":"hai, daijoubu desu."}],"note":"Staff may ask よろしいですか (is that OK?) after this. Say はい if you accept.","level":"useful","romaji":"tesuuryou ga kakarimasu."},{"id":"airport-arrival-06","speaker":"you","jp":"ICカードを買いたいです。","kana":"アイシー カード を かいたい です。","meaning":"I would like to buy an IC card.","replies":[{"jp":"はい、ございます。","kana":"はい、 ございます。","meaning":"Yes, we have them.","romaji":"hai, gozaimasu."},{"jp":"いくら入れますか。","kana":"いくら いれます か。","meaning":"How much would you like to load?","romaji":"ikura iremasu ka."}],"level":"core","romaji":"aishii kaado o kaitai desu."},{"id":"airport-arrival-07","speaker":"you","jp":"スイカはありますか。","kana":"スイカ は あります か。","meaning":"Do you have Suica?","replies":[{"jp":"はい、ございます。","kana":"はい、 ございます。","meaning":"Yes, we have it.","romaji":"hai, gozaimasu."}],"note":"Card types change. Tourist Pasmo is sold at the Haneda rail station, so ask which card is available.","level":"useful","romaji":"suika wa arimasu ka."},{"id":"airport-arrival-08","speaker":"you","jp":"三千円お願いします。","kana":"さんぜん えん おねがい します。","meaning":"Three thousand yen, please.","note":"Say the amount you want to load. Change the number to suit your plan.","level":"core","romaji":"sanzen en onegai shimasu."},{"id":"airport-arrival-09","speaker":"you","jp":"予約したSIMカードを受け取りに来ました。","kana":"よやく した シム カード を うけとり に きました。","meaning":"I came to collect the SIM card I booked.","also_heard":[{"jp":"予約したポケットWi-Fiを受け取りに来ました。","kana":"よやく した ポケット ワイファイ を うけとり に きました。","meaning":"I came to collect the pocket Wi-Fi I booked.","romaji":"yoyaku shita poketto waifai o uketori ni kimashita."}],"replies":[{"jp":"お名前とパスポートをお願いします。","kana":"おなまえ と パスポート を おねがい します。","meaning":"Your name and passport, please.","romaji":"onamae to pasupooto o onegai shimasu."}],"note":"Have your booking number and passport ready.","level":"useful","romaji":"yoyaku shita shimu kaado o uketori ni kimashita."},{"id":"airport-arrival-10","speaker":"you","jp":"荷物をホテルに送りたいです。","kana":"にもつ を ホテル に おくり たい です。","meaning":"I would like to send my luggage to my hotel.","replies":[{"jp":"ホテル名と住所を書いてください。","kana":"ホテルめい と じゅうしょ を かいて ください。","meaning":"Please write the hotel name and address.","romaji":"hoterumei to juusho o kaite kudasai."},{"jp":"明日の午前中には届きます。","kana":"あした の ごぜんちゅう に は とどきます。","meaning":"It will arrive tomorrow morning.","romaji":"ashita no gozenchuu ni wa todokimasu."}],"note":"Use the 宅配 (delivery) counter. Bring a small bag with what you need for the first night.","level":"core","romaji":"nimotsu o hoteru ni okuri tai desu."},{"id":"airport-arrival-11","speaker":"staff","jp":"宅配カウンターはあちらです。","kana":"たくはい カウンター は あちら です。","meaning":"The delivery counter is over there.","level":"useful","romaji":"takuhai kauntaa wa achira desu."},{"id":"airport-arrival-12","speaker":"staff","jp":"何個ですか。","kana":"なんこ です か。","meaning":"How many pieces?","replies":[{"jp":"一個です。","kana":"いっこ です。","meaning":"One piece.","romaji":"ikko desu."},{"jp":"二個です。","kana":"にこ です。","meaning":"Two pieces.","romaji":"niko desu."}],"level":"useful","romaji":"nanko desu ka."},{"id":"airport-arrival-13","speaker":"staff","jp":"明日の午前中には届きます。","kana":"あした の ごぜんちゅう に は とどきます。","meaning":"It will arrive tomorrow morning.","level":"useful","romaji":"ashita no gozenchuu ni wa todokimasu."},{"id":"airport-arrival-14","speaker":"you","jp":"コインロッカーはありますか。","kana":"コインロッカー は あります か。","meaning":"Are there coin lockers?","replies":[{"jp":"はい、あります。","kana":"はい、 あります。","meaning":"Yes, there are.","romaji":"hai, arimasu."}],"level":"useful","romaji":"koinrokkaa wa arimasu ka."}]},{"title":"Getting from Haneda to Ueno","intro":"Which transport to take, where to buy tickets, and which platform to use.","phrases":[{"id":"airport-ueno-01","speaker":"you","jp":"上野までどうやって行きますか。","kana":"うえの まで どう やって いきます か。","meaning":"How do I get to Ueno?","replies":[{"jp":"京急で品川まで行って、山手線に乗り換えてください。","kana":"けいきゅう で しながわ まで いって、 やまのてせん に のりかえて ください。","meaning":"Take the Keikyu line to Shinagawa, then change to the Yamanote line.","romaji":"keikyuu de shinagawa made itte, yamanotesen ni norikaete kudasai."},{"jp":"モノレールで浜松町まで行って、山手線に乗り換えてください。","kana":"モノレール で はままつちょう まで いって、 やまのてせん に のりかえて ください。","meaning":"Take the monorail to Hamamatsucho, then change to the Yamanote line.","romaji":"monoreeru de hamamatsuchou made itte, yamanotesen ni norikaete kudasai."}],"note":"Both routes end on the Yamanote line to Ueno. Ask the staff which one is quicker from your exact spot.","level":"core","romaji":"ueno made dou yatte ikimasu ka."},{"id":"airport-ueno-02","speaker":"you","jp":"京急線の乗り場はどこですか。","kana":"けいきゅうせん の のりば は どこ です か。","meaning":"Where is the Keikyu line platform?","level":"core","romaji":"keikyuusen no noriba wa doko desu ka."},{"id":"airport-ueno-03","speaker":"you","jp":"モノレールの乗り場はどこですか。","kana":"モノレール の のりば は どこ です か。","meaning":"Where is the monorail platform?","level":"core","romaji":"monoreeru no noriba wa doko desu ka."},{"id":"airport-ueno-04","speaker":"staff","jp":"三番線です。","kana":"さんばんせん です。","meaning":"It is platform three.","note":"Check the board for the platform number and the time of the next train.","level":"core","romaji":"sanbansen desu."},{"id":"airport-ueno-05","speaker":"staff","jp":"次の電車は十時五分です。","kana":"つぎ の でんしゃ は じゅうじ ごふん です。","meaning":"The next train is at 10:05.","level":"core","romaji":"tsugi no densha wa juuji gofun desu."},{"id":"airport-ueno-06","speaker":"you","jp":"リムジンバスの切符売り場はどこですか。","kana":"リムジンバス の きっぷ うりば は どこ です か。","meaning":"Where is the limousine bus ticket counter?","replies":[{"jp":"上野方面ですか。","kana":"うえの ほうめん です か。","meaning":"Are you going towards Ueno?","romaji":"ueno houmen desu ka."},{"jp":"三番乗り場です。","kana":"さんばん のりば です。","meaning":"It is boarding area three.","romaji":"sanban noriba desu."}],"note":"Check which bus goes to Ueno before you buy a ticket. Not every route stops there.","level":"useful","romaji":"rimujinbasu no kippu uriba wa doko desu ka."},{"id":"airport-ueno-07","speaker":"you","jp":"上野まで大人二枚ください。","kana":"うえの まで おとな にまい ください。","meaning":"Two adult tickets to Ueno, please.","note":"Say the number of adults. Change the number to match your party.","level":"useful","romaji":"ueno made otona nimai kudasai."},{"id":"airport-ueno-08","speaker":"staff","jp":"乗り換えは品川です。","kana":"のりかえ は しながわ です。","meaning":"Change trains at Shinagawa.","level":"useful","romaji":"norikae wa shinagawa desu."},{"id":"airport-ueno-09","speaker":"you","jp":"タクシー乗り場はどこですか。","kana":"タクシー のりば は どこ です か。","meaning":"Where is the taxi stand?","level":"useful","romaji":"takushii noriba wa doko desu ka."},{"id":"airport-ueno-10","speaker":"you","jp":"上野のホテルまでお願いします。","kana":"うえの の ホテル まで おねがい します。","meaning":"To the hotel in Ueno, please.","note":"Show the hotel address on your phone to the driver.","level":"useful","romaji":"ueno no hoteru made onegai shimasu."},{"id":"airport-ueno-11","speaker":"staff","jp":"荷物をトランクに入れますね。","kana":"にもつ を トランク に いれます ね。","meaning":"I will put your bags in the trunk.","level":"listen-only","romaji":"nimotsu o toranku ni iremasu ne."},{"id":"airport-ueno-12","speaker":"staff","jp":"ドアが自動で開きます。","kana":"ドア が じどう で あきます。","meaning":"The door opens automatically.","level":"listen-only","romaji":"doa ga jidou de akimasu."},{"id":"airport-ueno-13","speaker":"staff","jp":"深夜料金がかかります。","kana":"しんや りょうきん が かかります。","meaning":"A late-night surcharge applies.","also_heard":[{"jp":"高速料金がかかります。","kana":"こうそく りょうきん が かかります。","meaning":"An expressway toll applies.","romaji":"kousoku ryoukin ga kakarimasu."}],"note":"Surcharges apply to some late-night taxi rides and expressway tolls. Ask the driver for the total before you go.","level":"listen-only","romaji":"shin'ya ryoukin ga kakarimasu."}]},{"title":"Departure: check-in (Jan 12)","intro":"ANA counters, bags, seats, and what you cannot pack in your carry-on.","phrases":[{"id":"airport-checkin-01","speaker":"you","jp":"ANAのカウンターはどこですか。","kana":"エーエヌエー の カウンター は どこ です か。","meaning":"Where is the ANA counter?","note":"ANA uses both Terminal 2 and Terminal 3 at Haneda for international flights. Check your ticket for the terminal.","level":"core","romaji":"eeenuee no kauntaa wa doko desu ka."},{"id":"airport-checkin-02","speaker":"you","jp":"ロサンゼルス行きです。","kana":"ロサンゼルス いき です。","meaning":"It is for the flight to Los Angeles.","level":"core","romaji":"rosanzerusu iki desu."},{"id":"airport-checkin-03","speaker":"staff","jp":"パスポートをお願いします。","kana":"パスポート を おねがい します。","meaning":"Passport, please.","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."}],"level":"core","romaji":"pasupooto o onegai shimasu."},{"id":"airport-checkin-04","speaker":"staff","jp":"ご予約の確認をいたします。","kana":"ごよやく の かくにん を いたします。","meaning":"I will check your booking.","level":"listen-only","romaji":"goyoyaku no kakunin o itashimasu."},{"id":"airport-checkin-05","speaker":"staff","jp":"お預けのお荷物はいくつですか。","kana":"おあずけ の おにもつ は いくつ です か。","meaning":"How many bags are you checking in?","also_heard":[{"jp":"預ける荷物は何個ですか。","kana":"あずける にもつ は なんこ です か。","meaning":"How many pieces of luggage are you checking?","romaji":"azukeru nimotsu wa nanko desu ka."}],"replies":[{"jp":"二つです。","kana":"ふたつ です。","meaning":"Two.","romaji":"futatsu desu."}],"level":"core","romaji":"oazuke no onimotsu wa ikutsu desu ka."},{"id":"airport-checkin-06","speaker":"staff","jp":"窓側と通路側、どちらがよろしいですか。","kana":"まどがわ と つうろがわ、 どちら が よろしい です か。","meaning":"Window or aisle, which would you prefer?","replies":[{"jp":"窓側をお願いします。","kana":"まどがわ を おねがい します。","meaning":"A window seat, please.","romaji":"madogawa o onegai shimasu."},{"jp":"通路側をお願いします。","kana":"つうろがわ を おねがい します。","meaning":"An aisle seat, please.","romaji":"tsuurogawa o onegai shimasu."},{"jp":"妻と隣にしたいです。","kana":"つま と となり に したい です。","meaning":"I would like to sit next to my wife.","romaji":"tsuma to tonari ni shitai desu."}],"level":"core","romaji":"madogawa to tsuurogawa, dochira ga yoroshii desu ka."},{"id":"airport-checkin-07","speaker":"staff","jp":"お隣同士でお取りしますね。","kana":"おとなりどうし で おとり します ね。","meaning":"I will reserve seats next to each other.","also_heard":[{"jp":"ご一緒の席ですね。","kana":"ごいっしょ の せき です ね。","meaning":"Seats together, then.","romaji":"goissho no seki desu ne."}],"level":"useful","romaji":"otonaridoushi de otori shimasu ne."},{"id":"airport-checkin-08","speaker":"staff","jp":"こちらは機内持ち込みですか。","kana":"こちら は きない もちこみ です か。","meaning":"Is this going into the cabin as carry-on?","also_heard":[{"jp":"手荷物は何個ですか。","kana":"てにもつ は なんこ です か。","meaning":"How many carry-on bags do you have?","romaji":"tenimotsu wa nanko desu ka."}],"replies":[{"jp":"はい、機内に持ち込みます。","kana":"はい、 きない に もちこみます。","meaning":"Yes, I will take it into the cabin.","romaji":"hai, kinai ni mochikomimasu."}],"level":"core","romaji":"kochira wa kinai mochikomi desu ka."},{"id":"airport-checkin-09","speaker":"staff","jp":"割れ物は入っていますか。","kana":"われもの は はいっています か。","meaning":"Is there anything fragile inside?","also_heard":[{"jp":"壊れ物は入っていますか。","kana":"こわれもの は はいっています か。","meaning":"Is there anything breakable inside?","romaji":"kowaremono wa haitteimasu ka."}],"replies":[{"jp":"はい、お土産の陶器があります。","kana":"はい、 おみやげ の とうき が あります。","meaning":"Yes, I have some ceramic souvenirs.","romaji":"hai, omiyage no touki ga arimasu."}],"note":"If you pack fragile souvenirs, tell the staff. They may attach a FRAGILE tag.","level":"useful","romaji":"waremono wa haitteimasu ka."},{"id":"airport-checkin-10","speaker":"staff","jp":"モバイルバッテリーは入っていますか。","kana":"モバイルバッテリー は はいっています か。","meaning":"Is there a power bank inside?","also_heard":[{"jp":"リチウム電池は入っていますか。","kana":"リチウム でんち は はいっています か。","meaning":"Are there any lithium batteries inside?","romaji":"richiumu denchi wa haitteimasu ka."}],"replies":[{"jp":"はい、手荷物に入れています。","kana":"はい、 てにもつ に いれています。","meaning":"Yes, I have it in my carry-on.","romaji":"hai, tenimotsu ni ireteimasu."},{"jp":"いいえ、入っていません。","kana":"いいえ、 はいっていません。","meaning":"No, there is none inside.","romaji":"iie, haitteimasen."}],"note":"Power banks cannot be checked and must go in your carry-on. Up to 160 Wh is allowed, two per person. Check the Wh figure on the battery.","level":"core","romaji":"mobairubatterii wa haitteimasu ka."},{"id":"airport-checkin-11","speaker":"staff","jp":"重量オーバーです。","kana":"じゅうりょう オーバー です。","meaning":"It is over the weight limit.","also_heard":[{"jp":"二キロ超えています。","kana":"に キロ こえています。","meaning":"It is two kilos over.","romaji":"ni kiro koeteimasu."}],"replies":[{"jp":"どうすればいいですか。","kana":"どう すれば いい です か。","meaning":"What should I do?","romaji":"dou sureba ii desu ka."}],"level":"core","romaji":"juuryou oobaa desu."},{"id":"airport-checkin-12","speaker":"staff","jp":"荷物を出してください。","kana":"にもつ を だして ください。","meaning":"Please take some items out.","note":"You can move items into your carry-on or pay an extra fee. Ask which option is cheaper for you.","level":"core","romaji":"nimotsu o dashite kudasai."},{"id":"airport-checkin-13","speaker":"staff","jp":"追加料金がかかります。","kana":"ついか りょうきん が かかります。","meaning":"There is an extra charge.","level":"core","romaji":"tsuika ryoukin ga kakarimasu."},{"id":"airport-checkin-14","speaker":"staff","jp":"搭乗口は三十二番です。","kana":"とうじょうぐち は さんじゅうにばん です。","meaning":"Your gate is number 32.","level":"core","romaji":"toujouguchi wa sanjuuniban desu."},{"id":"airport-checkin-15","speaker":"staff","jp":"搭乗開始は十一時五十分です。","kana":"とうじょう かいし は じゅういちじ ごじゅっぷん です。","meaning":"Boarding starts at 11:50.","level":"core","romaji":"toujou kaishi wa juuichiji gojuppun desu."}]},{"title":"Self bag drop, tax-free, security and exit immigration","intro":"Machines first, then the security checks, then leaving Japan.","phrases":[{"id":"airport-security-01","speaker":"you","jp":"自動手荷物預け機の使い方を教えてくだ
