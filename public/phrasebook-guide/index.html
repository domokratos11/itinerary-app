you","jp":"はい、寒いですね。エルサルバドルは暑い国なので、寒いのは苦手です。","kana":"はい、 さむい です ね。 エルサルバドル は あつい くに な ので、 さむい の は にがて です。","meaning":"Yes, it is cold. El Salvador is a hot country, so I am not good with the cold.","romaji":"hai, samui desu ne. erusarubadoru wa atsui kuni na node, samui no wa nigate desu."},{"speaker":"staff","jp":"はい、着きましたよ。お気をつけて。","kana":"はい、 つきました よ。 おき を つけて。","meaning":"Here we are. Take care.","romaji":"hai, tsukimashita yo. oki o tsukete."}]},{"title":"Izakaya counter with the owner (Osaka or Hiroshima)","lines":[{"speaker":"staff","jp":"いらっしゃい。お客さん、旅行ですか。","kana":"いらっしゃい。 おきゃくさん、 りょこう です か。","meaning":"Welcome. Are you travelling?","romaji":"irasshai. okyakusan, ryokou desu ka."},{"speaker":"you","jp":"はい、妻と二人で旅行しています。","kana":"はい、 つま と ふたり で りょこう して います。","meaning":"Yes, my wife and I are travelling.","romaji":"hai, tsuma to futari de ryokou shite imasu."},{"speaker":"staff","jp":"どちらから？","kana":"どちら から？","meaning":"Where are you from?","romaji":"dochira kara?"},{"speaker":"you","jp":"エルサルバドルから来ました。","kana":"エルサルバドル から きました。","meaning":"I came from El Salvador.","romaji":"erusarubadoru kara kimashita."},{"speaker":"staff","jp":"へえ、遠いところから。日本の食べ物は大丈夫ですか。","kana":"へえ、 とおい ところ から。 にほん の たべもの は だいじょうぶ です か。","meaning":"Wow, from far away. Is Japanese food OK for you?","romaji":"hee, tooi tokoro kara. nihon no tabemono wa daijoubu desu ka."},{"speaker":"you","jp":"はい、大好きです。おすすめは何ですか。","kana":"はい、 だいすき です。 おすすめ は なん です か。","meaning":"Yes, I love it. What do you recommend?","romaji":"hai, daisuki desu. osusume wa nan desu ka."},{"speaker":"staff","jp":"今日は牡蠣がおすすめですよ。","kana":"きょう は かき が おすすめ です よ。","meaning":"Today I recommend the oysters.","romaji":"kyou wa kaki ga osusume desu yo."},{"speaker":"you","jp":"じゃあ、それをお願いします。","kana":"じゃあ、 それ を おねがい します。","meaning":"Then I will have that, please.","romaji":"jaa, sore o onegai shimasu."},{"speaker":"staff","jp":"はい。お酒は飲みますか。","kana":"はい。 おさけ は のみます か。","meaning":"Sure. Do you drink alcohol?","romaji":"hai. osake wa nomimasu ka."}]},{"title":"Shop owner, December 30","lines":[{"speaker":"staff","jp":"いらっしゃいませ。","kana":"いらっしゃいませ。","meaning":"Welcome.","romaji":"irasshaimase."},{"speaker":"you","jp":"こんにちは。これをお願いします。","kana":"こんにちは。 これ を おねがい します。","meaning":"Hello. This one, please.","romaji":"konnichiwa. kore o onegai shimasu."},{"speaker":"staff","jp":"ありがとうございます。旅行ですか。","kana":"ありがとうございます。 りょこう です か。","meaning":"Thank you. Are you travelling?","romaji":"arigatougozaimasu. ryokou desu ka."},{"speaker":"you","jp":"はい、エルサルバドルから来ました。","kana":"はい、 エルサルバドル から きました。","meaning":"Yes, I came from El Salvador.","romaji":"hai, erusarubadoru kara kimashita."},{"speaker":"staff","jp":"そうですか。年末は寒いですね。","kana":"そう です か。 ねんまつ は さむい です ね。","meaning":"I see. It is cold at the year-end, isn't it?","romaji":"sou desu ka. nenmatsu wa samui desu ne."},{"speaker":"you","jp":"はい。でも、日本のお正月を楽しみにしています。","kana":"はい。 でも、 にほん の おしょうがつ を たのしみ に して います。","meaning":"Yes. But I am looking forward to New Year in Japan.","romaji":"hai. demo, nihon no oshougatsu o tanoshimi ni shite imasu."},{"speaker":"staff","jp":"明日で今年の営業は終わりなんですよ。","kana":"あした で ことし の えいぎょう は おわり な ん です よ。","meaning":"Tomorrow is our last day of business this year.","romaji":"ashita de kotoshi no eigyou wa owari na n desu yo."},{"speaker":"you","jp":"そうなんですか。いろいろありがとうございました。","kana":"そう なん です か。 いろいろ ありがとうございました。","meaning":"Oh, is that so? Thank you for everything.","romaji":"sou nan desu ka. iroiro arigatougozaimashita."},{"speaker":"staff","jp":"こちらこそ。良いお年を。","kana":"こちら こそ。 よい おとし を。","meaning":"Likewise. Have a good New Year.","romaji":"kochira koso. yoi otoshi o."}]},{"title":"Hotel front desk, January 2","lines":[{"speaker":"staff","jp":"あけましておめでとうございます。","kana":"あけまして おめでとうございます。","meaning":"Happy New Year.","romaji":"akemashite omedetougozaimasu."},{"speaker":"you","jp":"あけましておめでとうございます。今年もよろしくお願いします。","kana":"あけまして おめでとうございます。 ことし も よろしく おねがい します。","meaning":"Happy New Year. I look forward to this year too.","romaji":"akemashite omedetougozaimasu. kotoshi mo yoroshiku onegai shimasu."},{"speaker":"staff","jp":"こちらこそ、よろしくお願いします。お正月はいかがでしたか。","kana":"こちら こそ、 よろしく おねがい します。 おしょうがつ は いかが でした か。","meaning":"Likewise. How was your New Year?","romaji":"kochira koso, yoroshiku onegai shimasu. oshougatsu wa ikaga deshita ka."},{"speaker":"you","jp":"とても楽しかったです。初詣に行きました。","kana":"とても たのしかった です。 はつもうで に いきました。","meaning":"It was great. I went to a shrine for hatsumode.","romaji":"totemo tanoshikatta desu. hatsumoude ni ikimashita."},{"speaker":"staff","jp":"それはよかったです。人が多かったでしょう？","kana":"それ は よかった です。 ひと が おおかった でしょう？","meaning":"That is good. It was crowded, wasn't it?","romaji":"sore wa yokatta desu. hito ga ookatta deshou?"},{"speaker":"you","jp":"はい、すごい人でした。でも、よかったです。","kana":"はい、 すごい ひと でした。 でも、 よかった です。","meaning":"Yes, there were a lot of people. But it was good.","romaji":"hai, sugoi hito deshita. demo, yokatta desu."},{"speaker":"staff","jp":"今日は寒いので、お気をつけて。","kana":"きょう は さむい ので、 おき を つけて。","meaning":"It is cold today, so take care.","romaji":"kyou wa samui node, oki o tsukete."},{"speaker":"you","jp":"ありがとうございます。いってきます。","kana":"ありがとうございます。 いってきます。","meaning":"Thank you. I am heading out now.","romaji":"arigatougozaimasu. ittekimasu."},{"speaker":"staff","jp":"いってらっしゃいませ。","kana":"いってらっしゃいませ。","meaning":"Have a good trip. (said to someone leaving)","romaji":"itterasshaimase."}]}],"signs":[{"jp":"謹賀新年","kana":"きんが しんねん","meaning":"Happy New Year (formal)","where":"New Year cards and shop posters in January","romaji":"kinga shinnen"},{"jp":"迎春","kana":"げいしゅん","meaning":"Welcome the spring (New Year greeting)","where":"New Year cards and seasonal decorations","romaji":"geishun"},{"jp":"賀正","kana":"がしょう","meaning":"Happy New Year","where":"New Year cards and shop displays","romaji":"gashou"},{"jp":"初売り","kana":"はつうり","meaning":"First sales of the year","where":"Department store banners in early January","romaji":"hatsuuri"},{"jp":"福袋","kana":"ふくぶくろ","meaning":"Lucky bag (sealed bag of mixed goods)","where":"Shops and department stores in early January","romaji":"fukubukuro"},{"jp":"年末年始休業","kana":"ねんまつねんし きゅうぎょう","meaning":"Closed for the year-end and New Year period","where":"Shop doors and notices in late December","romaji":"nenmatsunenshi kyuugyou"},{"jp":"元日","kana":"がんじつ","meaning":"January 1","where":"Calendars and holiday notices","romaji":"ganjitsu"},{"jp":"営業時間","kana":"えいぎょう じかん","meaning":"Business hours","where":"Shop entrances and windows","romaji":"eigyou jikan"}],"vocab":[{"title":"Countries, languages, family","items":[{"jp":"エルサルバドル","kana":"エルサルバドル","meaning":"El Salvador","romaji":"erusarubadoru"},{"jp":"中米","kana":"ちゅうべい","meaning":"Central America (short form)","romaji":"chuubei"},{"jp":"中央アメリカ","kana":"ちゅうおう アメリカ","meaning":"Central America","romaji":"chuuou amerika"},{"jp":"グアテマラ","kana":"グアテマラ","meaning":"Guatemala","romaji":"guatemara"},{"jp":"ホンジュラス","kana":"ホンジュラス","meaning":"Honduras","romaji":"honjurasu"},{"jp":"メキシコ","kana":"メキシコ","meaning":"Mexico","romaji":"mekishiko"},{"jp":"アメリカ","kana":"アメリカ","meaning":"America","romaji":"amerika"},{"jp":"スペイン語","kana":"スペイン ご","meaning":"Spanish (language)","romaji":"supein go"},{"jp":"日本語","kana":"にほんご","meaning":"Japanese (language)","romaji":"nihongo"},{"jp":"英語","kana":"えいご","meaning":"English (language)","romaji":"eigo"},{"jp":"国","kana":"くに","meaning":"country","romaji":"kuni"},{"jp":"外国","kana":"がいこく","meaning":"foreign country","romaji":"gaikoku"},{"jp":"海外","kana":"かいがい","meaning":"overseas (common spoken word)","romaji":"kaigai"},{"jp":"観光","kana":"かんこう","meaning":"sightseeing","romaji":"kankou"},{"jp":"旅行","kana":"りょこう","meaning":"trip, travel","romaji":"ryokou"},{"jp":"妻","kana":"つま","meaning":"my wife","romaji":"tsuma"},{"jp":"奥さん","kana":"おくさん","meaning":"someone else's wife","romaji":"okusan"},{"jp":"夫","kana":"おっと","meaning":"my husband","romaji":"otto"},{"jp":"家族","kana":"かぞく","meaning":"family","romaji":"kazoku"}]},{"title":"Season and weather","items":[{"jp":"冬","kana":"ふゆ","meaning":"winter","romaji":"fuyu"},{"jp":"寒い","kana":"さむい","meaning":"cold (weather)","romaji":"samui"},{"jp":"冷える","kana":"ひえる","meaning":"to get chilly","romaji":"hieru"},{"jp":"冷たい","kana":"つめたい","meaning":"cold to the touch","romaji":"tsumetai"},{"jp":"暖かい","kana":"あたたかい","meaning":"warm","romaji":"atatakai"},{"jp":"暑い","kana":"あつい","meaning":"hot (weather)","romaji":"atsui"},{"jp":"雪","kana":"ゆき","meaning":"snow","romaji":"yuki"},{"jp":"雨","kana":"あめ","meaning":"rain","romaji":"ame"},{"jp":"晴れ","kana":"はれ","meaning":"sunny, clear","romaji":"hare"},{"jp":"天気","kana":"てんき","meaning":"weather","romaji":"tenki"},{"jp":"気温","kana":"きおん","meaning":"air temperature","romaji":"kion"},{"jp":"風邪","kana":"かぜ","meaning":"cold (illness)","romaji":"kaze"},{"jp":"イルミネーション","kana":"イルミネーション","meaning":"winter light displays","romaji":"irumineeshon"},{"jp":"見頃","kana":"みごろ","meaning":"best time to see something","romaji":"migoro"}]},{"title":"New Year words","items":[{"jp":"大晦日","kana":"おおみそか","meaning":"New Year's Eve (December 31)","romaji":"oomisoka"},{"jp":"年越し","kana":"としこし","meaning":"seeing out the old year","romaji":"toshikoshi"},{"jp":"年越しそば","kana":"としこしそば","meaning":"year-crossing soba noodles","romaji":"toshikoshisoba"},{"jp":"除夜の鐘","kana":"じょやの かね","meaning":"temple bells rung on New Year's Eve","romaji":"joyano kane"},{"jp":"紅白歌合戦","kana":"こうはくうたがっせん","meaning":"NHK year-end music show","romaji":"kouhakuutagassen"},{"jp":"カウントダウン","kana":"カウントダウン","meaning":"countdown","romaji":"kauntodaun"},{"jp":"元日","kana":"がんじつ","meaning":"January 1","romaji":"ganjitsu"},{"jp":"元旦","kana":"がんたん","meaning":"morning of January 1","romaji":"gantan"},{"jp":"お正月","kana":"おしょうがつ","meaning":"New Year (polite)","romaji":"oshougatsu"},{"jp":"三が日","kana":"さんがにち","meaning":"first three days of January","romaji":"sanganichi"},{"jp":"初詣","kana":"はつもうで","meaning":"first shrine or temple visit of the year","romaji":"hatsumoude"},{"jp":"おせち","kana":"おせち","meaning":"boxed New Year dishes","romaji":"osechi"},{"jp":"お雑煮","kana":"おぞうに","meaning":"New Year soup with mochi","romaji":"ozouni"},{"jp":"餅","kana":"もち","meaning":"rice cake","romaji":"mochi"},{"jp":"お年玉","kana":"おとしだま","meaning":"New Year money for children","romaji":"otoshidama"},{"jp":"年末年始","kana":"ねんまつねんし","meaning":"year-end and New Year period","romaji":"nenmatsunenshi"},{"jp":"良いお年を","kana":"よい おとし を","meaning":"Have a good year-end (said before New Year)","romaji":"yoi otoshi o"}]}],"_num":"10"},{"slug":"trouble","title":"Trouble and emergencies","title_jp":"緊急","summary":"Lost, police, money, phone, quakes and transport disruption","situations":[{"title":"Lost on the street, asking the way","intro":"You are lost and the phone map is not enough, so you ask a person or shop, then follow a string of directions.","phrases":[{"id":"trouble-road-01","speaker":"you","jp":"すみません、道に迷いました。","kana":"すみません、 みち に まよいました。","meaning":"Excuse me, I got lost.","replies":[{"jp":"どちらへ行きたいんですか。","kana":"どちら へ いきたい ん です か。","meaning":"Where do you want to go?","romaji":"dochira e ikitai n desu ka."}],"note":"道に迷う is for adults. 迷子 means a lost child, so avoid it. 道がわからなくなりました also works.","level":"core","romaji":"sumimasen, michi ni mayoimashita."},{"id":"trouble-road-02","speaker":"you","jp":"今、どこにいますか。","kana":"いま、 どこ に います か。","meaning":"Where am I right now?","replies":[{"jp":"ここです。","kana":"ここ です。","meaning":"Here.","romaji":"koko desu."}],"note":"Show your map on the phone and point to where you are while you ask.","level":"core","romaji":"ima, doko ni imasu ka."},{"id":"trouble-road-03","speaker":"you","jp":"この住所に行きたいんですが、どう行けばいいですか。","kana":"この じゅうしょ に いきたい ん です が、 どう いけば いい です か。","meaning":"I want to go to this address. How do I get there?","replies":[{"jp":"地図を見せてください。","kana":"ちず を みせて ください。","meaning":"Please show me the map.","romaji":"chizu o misete kudasai."}],"note":"Show the address written in Japanese on your phone or paper. Romaji is harder for people to read quickly.","level":"core","romaji":"kono juusho ni ikitai n desu ga, dou ikeba ii desu ka."},{"id":"trouble-road-04","speaker":"you","jp":"歩いて行けますか。","kana":"あるいて いけます か。","meaning":"Can I get there on foot?","replies":[{"jp":"はい、歩いて行けます。","kana":"はい、 あるいて いけます。","meaning":"Yes, you can walk.","romaji":"hai, aruite ikemasu."},{"jp":"歩くと三十分ぐらいかかります。タクシーのほうがいいですよ。","kana":"あるく と さんじゅっぷん ぐらい かかります。 タクシー の ほう が いい です よ。","meaning":"Walking takes about 30 minutes. A taxi is better.","romaji":"aruku to sanjuppun gurai kakarimasu. takushii no hou ga ii desu yo."}],"note":"In winter, also ask how long it takes on foot. Cold weather and hills can make walking slower than the map shows.","level":"core","romaji":"aruite ikemasu ka."},{"id":"trouble-road-05","speaker":"you","jp":"ここから遠いですか。","kana":"ここ から とおい です か。","meaning":"Is it far from here?","replies":[{"jp":"いいえ、すぐそこです。","kana":"いいえ、 すぐ そこ です。","meaning":"No, it is right there.","romaji":"iie, sugu soko desu."},{"jp":"ちょっと遠いですよ。","kana":"ちょっと とおい です よ。","meaning":"It is a bit far.","romaji":"chotto tooi desu yo."}],"note":"すぐそこ can still mean a few minutes' walk, so ask how many minutes if it matters.","level":"core","romaji":"koko kara tooi desu ka."},{"id":"trouble-road-06","speaker":"staff","jp":"まっすぐ行って、二つ目の信号を右に曲がってください。","kana":"まっすぐ いって、 ふたつめ の しんごう を みぎ に まがって ください。","meaning":"Go straight, then turn right at the second traffic light.","also_heard":[{"jp":"次の角を左です。","kana":"つぎ の かど を ひだり です。","meaning":"Left at the next corner.","romaji":"tsugi no kado o hidari desu."},{"jp":"交差点を渡って、左に曲がってください。","kana":"こうさてん を わたって、 ひだり に まがって ください。","meaning":"Cross the intersection, then turn left.","romaji":"kousaten o watatte, hidari ni magatte kudasai."}],"replies":[{"jp":"二つ目の信号を右ですね。","kana":"ふたつめ の しんごう を みぎ です ね。","meaning":"The second light, then right?","romaji":"futatsume no shingou o migi desu ne."},{"jp":"もう一度お願いします。","kana":"もういちど おねがい します。","meaning":"Once more, please.","romaji":"mouichido onegai shimasu."}],"note":"Repeat the key point with ですね to confirm. 二つ目 is the second light; 二つ先 means two places ahead.","level":"core","romaji":"massugu itte, futatsume no shingou o migi ni magatte kudasai."},{"id":"trouble-road-07","speaker":"staff","jp":"突き当たりを左に曲がると、右側にあります。","kana":"つきあたり を ひだり に まがる と、 みぎがわ に あります。","meaning":"Turn left at the end of the street and it is on your right.","also_heard":[{"jp":"郵便局の向かいです。","kana":"ゆうびんきょく の むかい です。","meaning":"It is across from the post office.","romaji":"yuubinkyoku no mukai desu."},{"jp":"コンビニの隣です。","kana":"コンビニ の となり です。","meaning":"It is next to the convenience store.","romaji":"konbini no tonari desu."}],"replies":[{"jp":"突き当たりを左ですね。わかりました。","kana":"つきあたり を ひだり です ね。 わかりました。","meaning":"End of the street, left. Got it.","romaji":"tsukiatari o hidari desu ne. wakarimashita."}],"note":"向かい is across the street, 隣 is next to it, 手前 is this side before the place, not the far side.","level":"core","romaji":"tsukiatari o hidari ni magaru to, migigawa ni arimasu."},{"id":"trouble-road-08","speaker":"staff","jp":"ここから歩いて五分ぐらいです。","kana":"ここ から あるいて ごふん ぐらい です。","meaning":"It is about five minutes on foot from here.","also_heard":[{"jp":"少し遠いです。","kana":"すこし とおい です。","meaning":"It is a little far.","romaji":"sukoshi tooi desu."}],"replies":[{"jp":"ありがとうございます。助かりました。","kana":"ありがとうございます。 たすかりました。","meaning":"Thank you. That really helped.","romaji":"arigatougozaimasu. tasukarimashita."}],"note":"ぐらい and くらい both mean about. 分 is minutes, so 五分 is five minutes.","level":"useful","romaji":"koko kara aruite gofun gurai desu."},{"id":"trouble-road-09","speaker":"you","jp":"もう少しゆっくりお願いします。","kana":"もう すこし ゆっくり おねがい します。","meaning":"Could you speak a little more slowly, please?","replies":[{"jp":"ゆっくり言いますね。","kana":"ゆっくり いいます ね。","meaning":"I will speak more slowly.","romaji":"yukkuri iimasu ne."},{"jp":"書きますね。","kana":"かきます ね。","meaning":"I will write it down.","romaji":"kakimasu ne."}],"note":"Asking them to write or draw on your map often works better than asking them to repeat. 日本語が少しだけわかります also helps.","level":"core","romaji":"mou sukoshi yukkuri onegai shimasu."},{"id":"trouble-road-10","speaker":"you","jp":"案内所はどこですか。","kana":"あんないじょ は どこ です か。","meaning":"Where is the information desk?","replies":[{"jp":"駅の中にあります。","kana":"えき の なか に あります。","meaning":"It is inside the station.","romaji":"eki no naka ni arimasu."}],"note":"Big stations and malls have 案内所 desks. Police boxes (交番) are good for directions too, since officers often know the area.","level":"useful","romaji":"annaijo wa doko desu ka."},{"id":"trouble-road-11","speaker":"staff","jp":"ご案内しますよ。こちらです。","kana":"ごあんない します よ。 こちら です。","meaning":"I will take you there. This way.","replies":[{"jp":"ありがとうございます。お願いします。","kana":"ありがとうございます。 おねがい します。","meaning":"Thank you. Please.","romaji":"arigatougozaimasu. onegai shimasu."}],"note":"Offers to walk you there are usually kind. Accept with thanks.","level":"useful","romaji":"goannai shimasu yo. kochira desu."}]},{"title":"Lost property away from trains","intro":"Something is lost on the street, in a shop or a taxi. Report it at a police box or police station, where found items usually end up.","phrases":[{"id":"trouble-prop-01","speaker":"you","jp":"財布をなくしました。","kana":"さいふ を なくしました。","meaning":"I lost my wallet.","also_heard":[{"jp":"携帯電話を落としました。","kana":"けいたいでんわ を おとしました。","meaning":"I dropped my phone.","romaji":"keitaidenwa o otoshimashita."},{"jp":"かばんを忘れました。","kana":"かばん を わすれました。","meaning":"I left my bag behind.","romaji":"kaban o wasuremashita."}],"replies":[{"jp":"いつ、どこですか。","kana":"いつ、 どこ です か。","meaning":"When and where?","romaji":"itsu, doko desu ka."}],"note":"なくした is lost, 落とした is dropped, 忘れた is left behind. 置き忘れました is for when you left it somewhere. Pick the verb that fits.","level":"core","romaji":"saifu o nakushimashita."},{"id":"trouble-prop-02","speaker":"you","jp":"落とし物はどこに届けますか。","kana":"おとしもの は どこ に とどけます か。","meaning":"Where do I report lost property?","replies":[{"jp":"この近くの交番に行ってください。","kana":"この ちかく の こうばん に いって ください。","meaning":"Please go to the police box nearby.","romaji":"kono chikaku no kouban ni itte kudasai."}],"note":"Taxi companies, shops and malls often have their own lost property desks. Ask 遺失物取扱所はどこですか for that office.","level":"core","romaji":"otoshimono wa doko ni todokemasu ka."},{"id":"trouble-prop-03","speaker":"staff","jp":"何をなくされましたか。","kana":"なに を なくされました か。","meaning":"What did you lose?","replies":[{"jp":"黒い長財布です。","kana":"くろい ながざいふ です。","meaning":"A long black wallet.","romaji":"kuroi nagazaifu desu."},{"jp":"赤いスマホです。","kana":"あかい スマホ です。","meaning":"A red smartphone.","romaji":"akai sumaho desu."}],"note":"なくされる is the polite form you will hear at police counters. Answer with the item and its colour.","level":"core","romaji":"nani o nakusaremashita ka."},{"id":"trouble-prop-04","speaker":"staff","jp":"いつ、どこでなくしましたか。","kana":"いつ、 どこ で なくしました か。","meaning":"When and where did you lose it?","replies":[{"jp":"今日の午後三時ごろ、駅の近くです。","kana":"きょう の ごご さんじ ごろ、 えき の ちかく です。","meaning":"Around 3 p.m. today, near the station.","romaji":"kyou no gogo sanji goro, eki no chikaku desu."},{"jp":"わかりません。たぶん駅の近くです。","kana":"わかりません。 たぶん えき の ちかく です。","meaning":"I do not know. Probably near the station.","romaji":"wakarimasen. tabun eki no chikaku desu."}],"note":"Approximate answers are fine. Say when you are not sure.","level":"core","romaji":"itsu, doko de nakushimashita ka."},{"id":"trouble-prop-05","speaker":"staff","jp":"どんな財布ですか。色や大きさを教えてください。","kana":"どんな さいふ です か。 いろ や おおきさ を おしえて ください。","meaning":"What kind of wallet? Tell me the colour and size.","replies":[{"jp":"茶色の革の財布です。手のひらぐらいの大きさです。","kana":"ちゃいろ の かわ の さいふ です。 てのひら ぐらい の おおきさ です。","meaning":"A brown leather wallet, about the size of your palm.","romaji":"chairo no kawa no saifu desu. tenohira gurai no ookisa desu."}],"note":"Use the colour, material and size words in the vocab list. Showing the size with your hands helps if words fail.","level":"core","romaji":"donna saifu desu ka. iro ya ookisa o oshiete kudasai."},{"id":"trouble-prop-06","speaker":"staff","jp":"中に何が入っていましたか。","kana":"なか に なに が はいって いました か。","meaning":"What was inside?","replies":[{"jp":"現金が三万円ぐらいと、クレジットカードが二枚です。","kana":"げんきん が さんまんえん ぐらい と、 クレジットカード が にまい です。","meaning":"About 30,000 yen in cash and two credit cards.","romaji":"genkin ga sanman'en gurai to, kurejittokaado ga nimai desu."},{"jp":"パスポートは入っていません。","kana":"パスポート は はいって いません。","meaning":"My passport was not inside.","romaji":"pasupooto wa haitte imasen."}],"note":"Give an approximate sum and the number of cards. Staff only need enough detail to match the item.","level":"core","romaji":"naka ni nani ga haitte imashita ka."},{"id":"trouble-prop-07","speaker":"staff","jp":"遺失届を書いてください。","kana":"いしつとどけ を かいて ください。","meaning":"Please fill in the lost property report.","also_heard":[{"jp":"英語の用紙もあります。","kana":"えいご の ようし も あります。","meaning":"There is also a form in English.","romaji":"eigo no youshi mo arimasu."}],"replies":[{"jp":"英語の用紙はありますか。","kana":"えいご の ようし は あります か。","meaning":"Do you have a form in English?","romaji":"eigo no youshi wa arimasu ka."},{"jp":"書き方を教えてください。","kana":"かきかた を おしえて ください。","meaning":"Please show me how to fill it in.","romaji":"kakikata o oshiete kudasai."}],"note":"遺失届 is the lost property report. Ask for a receipt or reference number if they give one, and keep it.","level":"useful","romaji":"ishitsutodoke o kaite kudasai."},{"id":"trouble-prop-08","speaker":"staff","jp":"連絡先とホテルの名前を教えてください。","kana":"れんらくさき と ホテル の なまえ を おしえて ください。","meaning":"Your contact details and hotel name, please.","replies":[{"jp":"ホテルの名前を紙に書きます。","kana":"ホテル の なまえ を かみ に かきます。","meaning":"I will write the hotel name on paper.","romaji":"hoteru no namae o kami ni kakimasu."},{"jp":"日本の電話番号はありません。メールアドレスならあります。","kana":"にほん の でんわばんごう は ありません。 メールアドレス なら あります。","meaning":"I have no Japanese phone number, but I have an email address.","romaji":"nihon no denwabangou wa arimasen. meeruadoresu nara arimasu."}],"note":"Have the hotel name written in Japanese, plus your email or phone number, ready to show.","level":"core","romaji":"renrakusaki to hoteru no namae o oshiete kudasai."},{"id":"trouble-prop-09","speaker":"staff","jp":"見つかったら、ホテルにご連絡します。","kana":"みつかったら、 ホテル に ごれんらく します。","meaning":"If it is found, we will contact your hotel.","also_heard":[{"jp":"見つかり次第、ご連絡します。","kana":"みつかりしだい、 ごれんらく します。","meaning":"As soon as it is found, we will get in touch.","romaji":"mitsukarishidai, gorenraku shimasu."}],"replies":[{"jp":"お願いします。ありがとうございます。","kana":"おねがい します。 ありがとうございます。","meaning":"Please do. Thank you.","romaji":"onegai shimasu. arigatougozaimasu."},{"jp":"帰国が一月十二日なので、それまでにお願いします。","kana":"きこく が いちがつ じゅうににち な ので、 それ まで に おねがい します。","meaning":"I fly home on January 12, so please contact me before then.","romaji":"kikoku ga ichigatsu juuninichi na node, sore made ni onegai shimasu."}],"note":"Give your departure date. Staff may not be able to send items abroad, so ask what they can do.","level":"useful","romaji":"mitsukattara, hoteru ni gorenraku shimasu."},{"id":"trouble-prop-10","speaker":"you","jp":"財布は届いていませんか。","kana":"さいふ は とどいて いません か。","meaning":"Has a wallet been handed in?","replies":[{"jp":"今のところ届いていません。","kana":"いま の ところ とどいて いません。","meaning":"Nothing has been handed in so far.","romaji":"ima no tokoro todoite imasen."},{"jp":"はい、届いています。受け取りに来てください。","kana":"はい、 とどいて います。 うけとり に きて ください。","meaning":"Yes, it has. Please come and collect it.","romaji":"hai, todoite imasu. uketori ni kite kudasai."}],"note":"Give a clear description and the date you lost it. Collecting usually needs your passport and a description of the item.","level":"core","romaji":"saifu wa todoite imasen ka."},{"id":"trouble-prop-11","speaker":"staff","jp":"拾得物として届けられています。","kana":"しゅうとくぶつ として とどけ られて います。","meaning":"It has been handed in as found property.","replies":[],"note":"拾得物 means found property. This is good news. Ask when and where you can collect it.","level":"listen-only","romaji":"shuutokubutsu toshite todoke rarete imasu."}]},{"title":"Lost or stolen passport and cards","intro":"The serious case. For a passport lost or stolen outdoors, report to police first and get a receipt number, then contact your embassy and card company.","phrases":[{"id":"trouble-doc-01","speaker":"you","jp":"パスポートをなくしました。警察に届けたいです。","kana":"パスポート を なくしました。 けいさつ に とどけ たい です。","meaning":"I lost my passport. I want to report it to the police.","also_heard":[{"jp":"盗まれました。盗難届を出したいです。","kana":"ぬすまれました。 とうなんとどけ を だし たい です。","meaning":"It was stolen. I want to file a theft report.","romaji":"nusumaremashita. tounantodoke o dashi tai desu."}],"replies":[{"jp":"交番かお近くの警察署に行ってください。","kana":"こうばん か おちかく の けいさつしょ に いって ください。","meaning":"Please go to a police box or a nearby police station.","romaji":"kouban ka ochikaku no keisatsusho ni itte kudasai."}],"note":"Lost or stolen outdoors: report to police and ask for a receipt number. Say clearly whether it was lost or stolen.","level":"core","romaji":"pasupooto o nakushimashita. keisatsu ni todoke tai desu."},{"id":"trouble-doc-02","speaker":"you","jp":"受理番号をもらえますか。","kana":"じゅりばんごう を もらえます か。","meaning":"Can I get the receipt number?","replies":[{"jp":"受理番号をお渡しします。","kana":"じゅりばんごう を おわたし します。","meaning":"I will give you the receipt number.","romaji":"juribangou o owatashi shimasu."}],"note":"Your embassy will probably ask for the police report. Confirm with them what they need before you go to the police.","level":"core","romaji":"juribangou o moraemasu ka."},{"id":"trouble-doc-03","speaker":"staff","jp":"受理番号は四四一七です。メモしてください。","kana":"じゅりばんごう は よんよんいちなな です。 メモ して ください。","meaning":"The receipt number is 4417. Please write it down.","replies":[{"jp":"もう一度お願いします。","kana":"もういちど おねがい します。","meaning":"Once more, please.","romaji":"mouichido onegai shimasu."},{"jp":"紙に書いてください。","kana":"かみ に かいて ください。","meaning":"Please write it on paper.","romaji":"kami ni kaite kudasai."}],"note":"Read each digit back to confirm. Ask them to write it down if you are not sure.","level":"core","romaji":"juribangou wa yon'yon'ichinana desu. memo shite kudasai."},{"id":"trouble-doc-04","speaker":"you","jp":"大使館に電話したいです。","kana":"たいしかん に でんわ し たい です。","meaning":"I want to call my embassy.","replies":[{"jp":"調べますね。","kana":"しらべます ね。","meaning":"Let me look it up.","romaji":"shirabemasu ne."}],"note":"Look up your embassy's contact details before the trip and write them down. Do not rely on your phone battery.","level":"core","romaji":"taishikan ni denwa shi tai desu."},{"id":"trouble-doc-05","speaker":"you","jp":"この番号に電話してください。","kana":"この ばんごう に でんわ して ください。","meaning":"Please call this number.","replies":[{"jp":"はい、かけてみます。","kana":"はい、 かけて みます。","meaning":"Yes, I will try calling.","romaji":"hai, kakete mimasu."},{"jp":"通訳をつなぎます。","kana":"つうやく を つなぎます。","meaning":"I will connect an interpreter.","romaji":"tsuuyaku o tsunagimasu."}],"note":"Keep a written note of your embassy and card company numbers and show it to staff. Add 日本語がわかりません if needed.","level":"core","romaji":"kono bangou ni denwa shite kudasai."},{"id":"trouble-doc-06","speaker":"you","jp":"カードを盗まれました。カードを止めたいです。","kana":"カード を ぬすまれました。 カード を とめ たい です。","meaning":"My card was stolen. I want to stop it.","replies":[{"jp":"カード会社に電話してください。","kana":"カード がいしゃ に でんわ して ください。","meaning":"Please call the card company.","romaji":"kaado gaisha ni denwa shite kudasai."}],"note":"Call your card company's emergency line as soon as you can, using the number on the back of the card. Japanese staff usually cannot block it for you.","level":"core","romaji":"kaado o nusumaremashita. kaado o tome tai desu."},{"id":"trouble-doc-07","speaker":"you","jp":"国際電話をかけたいです。電話を貸してもらえますか。","kana":"こくさい でんわ を かけ たい です。 でんわ を かして もらえます か。","meaning":"I want to make an international call. Could I borrow a phone?","replies":[{"jp":"こちらの電話をどうぞ。","kana":"こちら の でんわ を どうぞ。","meaning":"Please use this phone.","romaji":"kochira no denwa o douzo."},{"jp":"国際電話はできません。","kana":"こくさい でんわ は できません。","meaning":"We cannot make international calls.","romaji":"kokusai denwa wa dekimasen."}],"note":"Many offices will not allow it. Try the hotel front desk, or use your own phone if you have mobile data.","level":"useful","romaji":"kokusai denwa o kake tai desu. denwa o kashite moraemasu ka."},{"id":"trouble-doc-08","speaker":"staff","jp":"パスポートのコピーはありますか。","kana":"パスポート の コピー は あります か。","meaning":"Do you have a copy of your passport?","replies":[{"jp":"はい、スマホに写真があります。","kana":"はい、 スマホ に しゃしん が あります。","meaning":"Yes, I have a photo of it on my phone.","romaji":"hai, sumaho ni shashin ga arimasu."},{"jp":"ありません。","kana":"ありません。","meaning":"No, I do not.","romaji":"arimasen."}],"note":"Keep a photo of the passport photo page on your phone and a paper copy apart from the passport itself.","level":"useful","romaji":"pasupooto no kopii wa arimasu ka."},{"id":"trouble-doc-09","speaker":"staff","jp":"パスポート番号は分かりますか。","kana":"パスポート ばんごう は わかります か。","meaning":"Do you know your passport number?","replies":[{"jp":"はい、番号は写真にあります。","kana":"はい、 ばんごう は しゃしん に あります。","meaning":"Yes, the number is in my photo.","romaji":"hai, bangou wa shashin ni arimasu."},{"jp":"いいえ、わかりません。","kana":"いいえ、 わかりません。","meaning":"No, I do not know it.","romaji":"iie, wakarimasen."}],"note":"Save your passport number in a note on your phone, so you can answer without the document.","level":"useful","romaji":"pasupooto bangou wa wakarimasu ka."},{"id":"trouble-doc-10","speaker":"staff","jp":"犯人に心当たりはありますか。","kana":"はんにん に こころあたり は あります か。","meaning":"Do you have any idea who the culprit was?","replies":[{"jp":"ありません。","kana":"ありません。","meaning":"No, I do not.","romaji":"arimasen."},{"jp":"見ていません。","kana":"みて いません。","meaning":"I did not see anyone.","romaji":"mite imasen."}],"note":"Answer honestly. If you did not see the person, say so.","level":"listen-only","romaji":"hannin ni kokoroatari wa arimasu ka."},{"id":"trouble-doc-11","speaker":"staff","jp":"被害届を出しますか。","kana":"ひがいとどけ を だします か。","meaning":"Do you want to file a damage report?","replies":[{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"note":"被害届 reports damage from a crime. Ask which report they need, since they may say 盗難届 for theft.","level":"useful","romaji":"higaitodoke o dashimasu ka."}]},{"title":"Money problems","intro":"Card declines, ATMs that refuse foreign cards, and short cash. This is the minimum you need.","phrases":[{"id":"trouble-money-01","speaker":"staff","jp":"このカードはご利用になれません。","kana":"この カード は ごりよう に なれません。","meaning":"This card cannot be used.","replies":[{"jp":"他のカードでお願いします。","kana":"ほか の カード で おねがい します。","meaning":"Please try another card.","romaji":"hoka no kaado de onegai shimasu."},{"jp":"現金で払います。","kana":"げんきん で はらいます。","meaning":"I will pay in cash.","romaji":"genkin de haraimasu."}],"note":"Foreign cards are sometimes declined, especially at small shops. Carry some cash as a backup.","level":"core","romaji":"kono kaado wa goriyou ni naremasen."},{"id":"trouble-money-02","speaker":"you","jp":"別のカードを試してもいいですか。","kana":"べつ の カード を ためして も いい です か。","meaning":"May I try another card?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."},{"jp":"暗証番号をお願いします。","kana":"あんしょうばんごう を おねがい します。","meaning":"Please enter your PIN.","romaji":"anshoubangou o onegai shimasu."}],"note":"暗証番号 is your PIN. The shop may ask for a signature or a tap instead.","level":"core","romaji":"betsu no kaado o tameshite mo ii desu ka."},{"id":"trouble-money-03","speaker":"you","jp":"現金が足りません。","kana":"げんきん が たりません。","meaning":"I do not have enough cash.","replies":[{"jp":"ATMはコンビニにあります。","kana":"エーティーエム は コンビニ に あります。","meaning":"There is an ATM in the convenience store.","romaji":"eetiiemu wa konbini ni arimasu."}],"note":"Seven Bank ATMs in 7-Eleven stores accept many overseas cards. Some card networks do not work, and your card issuer may charge a fee.","level":"core","romaji":"genkin ga tarimasen."},{"id":"trouble-money-04","speaker":"you","jp":"このATMでカードが使えません。","kana":"この エーティーエム で カード が つかえません。","meaning":"This ATM will not accept my card.","replies":[{"jp":"セブン銀行のATMなら使えます。","kana":"セブンぎんこう の エーティーエム なら つかえます。","meaning":"A Seven Bank ATM will work.","romaji":"sebunginkou no eetiiemu nara tsukaemasu."}],"note":"Some bank ATMs do not take foreign cards, so try a Seven Bank ATM in a 7-Eleven store.","level":"core","romaji":"kono eetiiemu de kaado ga tsukaemasen."},{"id":"trouble-money-05","speaker":"you","jp":"ATMにカードが取られました。","kana":"エーティーエム に カード が とられました。","meaning":"The ATM kept my card.","replies":[{"jp":"ATMの横の電話でお問い合わせください。","kana":"エーティーエム の よこ の でんわ で おといあわせ ください。","meaning":"Please call the number beside the ATM.","romaji":"eetiiemu no yoko no denwa de otoiawase kudasai."},{"jp":"銀行の窓口に連絡してください。","kana":"ぎんこう の まどぐち に れんらく して ください。","meaning":"Please contact the bank counter.","romaji":"ginkou no madoguchi ni renraku shite kudasai."}],"note":"Call the number on or beside the ATM straight away, or go to the bank counter. Note the time and place.","level":"core","romaji":"eetiiemu ni kaado ga toraremashita."},{"id":"trouble-money-06","speaker":"you","jp":"お釣りが違います。","kana":"おつり が ちがいます。","meaning":"The change is wrong.","replies":[{"jp":"失礼しました。確認します。","kana":"しつれい しました。 かくにん します。","meaning":"Sorry. I will check.","romaji":"shitsurei shimashita. kakunin shimasu."}],"note":"Say what you paid with, for example 一万円札を出しました (I gave a 10,000 yen note).","level":"useful","romaji":"otsuri ga chigaimasu."},{"id":"trouble-money-07","speaker":"you","jp":"二重に請求されています。","kana":"にじゅう に せいきゅう されています。","meaning":"I was charged twice.","replies":[{"jp":"レシートを見せてください。","kana":"レシート を みせて ください。","meaning":"Please show me the receipt.","romaji":"reshiito o misete kudasai."}],"note":"Keep your receipts. Ask staff to cancel the extra charge, using the word 取り消し.","level":"useful","romaji":"nijuu ni seikyuu sareteimasu."},{"id":"trouble-money-08","speaker":"you","jp":"両替できる所はどこですか。","kana":"りょうがえ できる ところ は どこ です か。","meaning":"Where can I exchange money?","replies":[{"jp":"空港にあります。","kana":"くうこう に あります。","meaning":"There is one at the airport.","romaji":"kuukou ni arimasu."}],"note":"Airports and big stations are often easier than banks. Hours and rates vary, so check before you queue.","level":"useful","romaji":"ryougae dekiru tokoro wa doko desu ka."},{"id":"trouble-money-09","speaker":"staff","jp":"暗証番号をお願いします。","kana":"あんしょうばんごう を おねがい します。","meaning":"PIN, please.","also_heard":[{"jp":"サインをお願いします。","kana":"サイン を おねがい します。","meaning":"Signature, please.","romaji":"sain o onegai shimasu."},{"jp":"こちらにタッチしてください。","kana":"こちら に タッチ して ください。","meaning":"Please tap here.","romaji":"kochira ni tatchi shite kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Type the PIN on the keypad yourself. Sign or tap when asked, and keep your PIN private.","level":"core","romaji":"anshoubangou o onegai shimasu."},{"id":"trouble-money-10","speaker":"staff","jp":"こちらのカードは海外のカードのため、承認できません。","kana":"こちら の カード は かいがい の カード の ため、 しょうにん できません。","meaning":"This card cannot be approved because it is a foreign card.","also_heard":[{"jp":"現金のみです。","kana":"げんきん のみ です。","meaning":"Cash only.","romaji":"genkin nomi desu."}],"replies":[],"note":"Switch to another card or pay cash. Trying another machine may also help.","level":"listen-only","romaji":"kochira no kaado wa kaigai no kaado no tame, shounin dekimasen."}]},{"title":"Phone and internet","intro":"A dead phone is a real emergency, because your map, translator and tickets live on it.","phrases":[{"id":"trouble-phone-01","speaker":"you","jp":"携帯の電池が切れました。","kana":"けいたい の でんち が きれました。","meaning":"My phone battery died.","also_heard":[{"jp":"充電が切れそうです。","kana":"じゅうでん が きれそう です。","meaning":"My battery is about to die.","romaji":"juuden ga kiresou desu."}],"replies":[{"jp":"大変ですね。","kana":"たいへん です ね。","meaning":"That is a problem.","romaji":"taihen desu ne."}],"note":"電池が切れた and 充電が切れた are both used. A power bank helps if you carry one.","level":"core","romaji":"keitai no denchi ga kiremashita."},{"id":"trouble-phone-02","speaker":"you","jp":"ここで充電してもいいですか。","kana":"ここ で じゅうでん して も いい です か。","meaning":"May I charge my phone here?","also_heard":[{"jp":"充電器を貸してもらえますか。","kana":"じゅうでんき を かして もらえます か。","meaning":"Could you lend me a charger?","romaji":"juudenki o kashite moraemasu ka."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."},{"jp":"すみません、充電はできません。","kana":"すみません、 じゅうでん は できません。","meaning":"Sorry, charging is not possible here.","romaji":"sumimasen, juuden wa dekimasen."}],"note":"Cafés and shops may say no. Ask politely, and buy something small if you plan to stay.","level":"core","romaji":"koko de juuden shite mo ii desu ka."},{"id":"trouble-phone-03","speaker":"you","jp":"無料のWi-Fiはありますか。","kana":"むりょう の ワイファイ は あります か。","meaning":"Is there free Wi-Fi?","replies":[{"jp":"はい、あります。パスワードはこちらです。","kana":"はい、 あります。 パスワード は こちら です。","meaning":"Yes, we have it. Here is the password.","romaji":"hai, arimasu. pasuwaado wa kochira desu."},{"jp":"ありません。","kana":"ありません。","meaning":"No, we do not.","romaji":"arimasen."}],"note":"Ask for the network name and password if you need them. Say ワイファイ, the katakana form.","level":"core","romaji":"muryou no waifai wa arimasu ka."},{"id":"trouble-phone-04","speaker":"you","jp":"SIMが使えません。","kana":"シム が つかえません。","meaning":"My SIM does not work.","also_heard":[{"jp":"インターネットがつながりません。","kana":"インターネット が つながりません。","meaning":"The internet will not connect.","romaji":"intaanetto ga tsunagarimasen."},{"jp":"電波がありません。","kana":"でんぱ が ありません。","meaning":"I have no signal.","romaji":"denpa ga arimasen."},{"jp":"eSIMが動きません。","kana":"イーシム が うごきません。","meaning":"My eSIM does not work.","romaji":"iishimu ga ugokimasen."}],"replies":[{"jp":"設定を確認してください。","kana":"せってい を かくにん して ください。","meaning":"Please check the settings.","romaji":"settei o kakunin shite kudasai."}],"note":"Check that the SIM or eSIM is active and that data roaming is on. Shop staff usually cannot fix your mobile plan.","level":"core","romaji":"shimu ga tsukaemasen."},{"id":"trouble-phone-05","speaker":"you","jp":"電話を借りてもいいですか。ホテルに電話したいです。","kana":"でんわ を かりて も いい です か。 ホテル に でんわ し たい です。","meaning":"May I borrow a phone? I want to call my hotel.","replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Go ahead.","romaji":"douzo."},{"jp":"ごめんなさい、貸せません。","kana":"ごめんなさい、 かせません。","meaning":"Sorry, we cannot lend one.","romaji":"gomennasai, kasemasen."}],"note":"Show the hotel number on paper. Some staff will dial it for you.","level":"useful","romaji":"denwa o karite mo ii desu ka. hoteru ni denwa shi tai desu."},{"id":"trouble-phone-06","speaker":"you","jp":"充電器はどこで買えますか。","kana":"じゅうでんき は どこ で かえます か。","meaning":"Where can I buy a charger?","replies":[{"jp":"コンビニに売っています。","kana":"コンビニ に うって います。","meaning":"You can buy one at the convenience store.","romaji":"konbini ni utte imasu."},{"jp":"駅の近くの電気屋にあります。","kana":"えき の ちかく の でんきや に あります。","meaning":"There is one at an electronics shop near the station.","romaji":"eki no chikaku no denkiya ni arimasu."}],"note":"Convenience stores sell cables and power banks, but the prices are often higher than at electronics shops.","level":"core","romaji":"juudenki wa doko de kaemasu ka."},{"id":"trouble-phone-07","speaker":"you","jp":"モバイルバッテリーを借りたいです。","kana":"モバイルバッテリー を かりたい です。","meaning":"I want to rent a power bank.","replies":[{"jp":"駅にあります。","kana":"えき に あります。","meaning":"There is one at the station.","romaji":"eki ni arimasu."}],"note":"Some stations and shops have rental power-bank stands. Check the price and how to return it before you rent.","level":"useful","romaji":"mobairubatterii o karitai desu."},{"id":"trouble-phone-08","speaker":"you","jp":"地図を見せてもいいですか。電波がありません。","kana":"ちず を みせて も いい です か。 でんぱ が ありません。","meaning":"May I show you the map? I have no signal.","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"note":"Save a screenshot of your map and the address before you go out, so you can show them with no signal.","level":"useful","romaji":"chizu o misete mo ii desu ka. denpa ga arimasen."},{"id":"trouble-phone-09","speaker":"you","jp":"スマホを落としました。電話をかけてもらえますか。","kana":"スマホ を おとしました。 でんわ を かけて もらえます か。","meaning":"I dropped my phone. Could you call it?","replies":[{"jp":"はい、かけてみます。","kana":"はい、 かけて みます。","meaning":"Yes, I will try calling it.","romaji":"hai, kakete mimasu."}],"note":"Ask the person to call your number from their own phone. If your phone is on silent, it will not ring, so ask them to check the screen.","level":"useful","romaji":"sumaho o otoshimashita. denwa o kakete moraemasu ka."},{"id":"trouble-phone-10","speaker":"staff","jp":"こちらのWi-Fiは使えません。","kana":"こちら の ワイファイ は つかえません。","meaning":"This Wi-Fi cannot be used.","also_heard":[{"jp":"通信が混み合っています。","kana":"つうしん が こみあって います。","meaning":"The network is congested.","romaji":"tsuushin ga komiatte imasu."}],"replies":[],"note":"Try again later, or use mobile data if you have it.","level":"listen-only","romaji":"kochira no waifai wa tsukaemasen."}]},{"title":"Being separated from your partner","intro":"Crowded stations and temples in the New Year season make this likely. These phrases work with staff and information desks.","phrases":[{"id":"trouble-sep-01","speaker":"you","jp":"妻とはぐれました。","kana":"つま と はぐれました。","meaning":"I got separated from my wife.","also_heard":[{"jp":"妻が見つかりません。","kana":"つま が みつかりません。","meaning":"I cannot find my wife.","romaji":"tsuma ga mitsukarimasen."}],"replies":[{"jp":"大変ですね。どんな方ですか。","kana":"たいへん です ね。 どんな かた です か。","meaning":"That is hard. What does she look like?","romaji":"taihen desu ne. donna kata desu ka."}],"note":"はぐれる means to get separated. Use 連れ for any companion who is not your wife.","level":"core","romaji":"tsuma to haguremashita."},{"id":"trouble-sep-02","speaker":"you","jp":"妻を探しています。","kana":"つま を さがして います。","meaning":"I am looking for my wife.","also_heard":[{"jp":"妻を見ませんでしたか。","kana":"つま を みませんでしたか。","meaning":"Did you see my wife?","romaji":"tsuma o mimasendeshitaka."}],"replies":[{"jp":"見ていません。","kana":"みて いません。","meaning":"I have not seen her.","romaji":"mite imasen."},{"jp":"さっき見ました。","kana":"さっき みました。","meaning":"I saw her just now.","romaji":"sakki mimashita."}],"note":"Say where you last saw her. Show a recent photo on your phone if you have one.","level":"core","romaji":"tsuma o sagashite imasu."},{"id":"trouble-sep-03","speaker":"you","jp":"呼び出しをお願いできますか。","kana":"よびだし を おねがい できます か。","meaning":"Could you make an announcement for me?","replies":[{"jp":"お名前をお願いします。","kana":"おなまえ を おねがい します。","meaning":"Your name, please.","romaji":"onamae o onegai shimasu."},{"jp":"アナウンスしますね。","kana":"アナウンス します ね。","meaning":"I will make the announcement.","romaji":"anaunsu shimasu ne."}],"note":"Big stations and malls have 案内所 desks that can page people over the speakers. Ask there.","level":"useful","romaji":"yobidashi o onegai dekimasu ka."},{"id":"trouble-sep-04","speaker":"staff","jp":"お連れ様のお名前を教えてください。","kana":"おつれさま の おなまえ を おしえて ください。","meaning":"Please tell me your companion's name.","replies":[{"jp":"名前はカタカナで書きます。","kana":"なまえ は カタカナ で かきます。","meaning":"I will write her name in katakana.","romaji":"namae wa katakana de kakimasu."}],"note":"Write her name on paper, in katakana or English, so staff can read it easily.","level":"useful","romaji":"otsuresama no onamae o oshiete kudasai."},{"id":"trouble-sep-05","speaker":"staff","jp":"特徴を教えてください。","kana":"とくちょう を おしえて ください。","meaning":"Please tell me what she looks like.","replies":[{"jp":"髪は黒くて長いです。赤いコートを着ています。","kana":"かみ は くろくて ながい です。 あかい コート を きて います。","meaning":"Her hair is long and black. She is wearing a red coat.","romaji":"kami wa kurokute nagai desu. akai kooto o kite imasu."}],"note":"Describe clothes and colours first, then height. Use the colour words in the vocab list.","level":"useful","romaji":"tokuchou o oshiete kudasai."},{"id":"trouble-sep-06","speaker":"you","jp":"集合場所を決めましょう。","kana":"しゅうごうばしょ を きめましょう。","meaning":"Let us decide a meeting point.","also_heard":[{"jp":"改札の前で会いましょう。","kana":"かいさつ の まえ で あいましょう。","meaning":"Let us meet in front of the ticket gates.","romaji":"kaisatsu no mae de aimashou."}],"replies":[{"jp":"はい、そこで待ちます。","kana":"はい、 そこ で まちます。","meaning":"Yes, I will wait there.","romaji":"hai, soko de machimasu."}],"note":"Agree on a fixed spot before you split up, such as a station gate or the information desk.","level":"core","romaji":"shuugoubasho o kimemashou."},{"id":"trouble-sep-07","speaker":"you","jp":"ここで待っています。","kana":"ここ で まって います。","meaning":"I will wait here.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"Stay at the agreed spot, so searchers can find you there.","level":"useful","romaji":"koko de matte imasu."},{"id":"trouble-sep-08","speaker":"announcement","jp":"田中様、お連れ様が案内所でお待ちです。","kana":"たなか さま、 おつれさま が あんないじょ で おまちです。","meaning":"Mr. Tanaka, your companion is waiting at the information desk.","also_heard":[{"jp":"案内所までお越しください。","kana":"あんないじょ まで おこし ください。","meaning":"Please come to the information desk.","romaji":"annaijo made okoshi kudasai."}],"replies":[],"note":"This is how the desk reaches you. Go to the information desk straight away.","level":"listen-only","romaji":"tanaka sama, otsuresama ga annaijo de omachidesu."},{"id":"trouble-sep-09","speaker":"you","jp":"妻はスマホを持っていません。","kana":"つま は スマホ を もって いません。","meaning":"My wife does not have a phone with her.","replies":[{"jp":"何番ですか。","kana":"なんばん です か。","meaning":"What is the number?","romaji":"nanban desu ka."}],"note":"Then give staff your own phone number and ask them to call you if she is found.","level":"useful","romaji":"tsuma wa sumaho o motte imasen."},{"id":"trouble-sep-10","speaker":"you","jp":"見つかりました。ありがとうございました。","kana":"みつかりました。 ありがとうございました。","meaning":"We found her. Thank you very much.","replies":[{"jp":"よかったですね。","kana":"よかった です ね。","meaning":"That is good news.","romaji":"yokatta desu ne."}],"note":"Tell staff as soon as you find each other, so they can stop searching.","level":"useful","romaji":"mitsukarimashita. arigatougozaimashita."}]},{"title":"Police and incidents","intro":"Shouting for help, reporting a theft, and answering police questions. Keep sentences short and ask for an interpreter early.","phrases":[{"id":"trouble-police-01","speaker":"you","jp":"助けてください！","kana":"たすけて ください！","meaning":"Help me, please!","also_heard":[{"jp":"誰か来て！","kana":"だれか きて！","meaning":"Someone, come!","romaji":"dareka kite!"}],"replies":[{"jp":"どうしましたか？","kana":"どう しました か？","meaning":"What happened?","romaji":"dou shimashita ka?"}],"note":"Shout clearly and point to where you need help.","level":"core","romaji":"tasukete kudasai!"},{"id":"trouble-police-02","speaker":"you","jp":"110番に電話してください。","kana":"ひゃくとおばん に でんわ して ください。","meaning":"Please call 110.","also_heard":[{"jp":"警察を呼んでください。","kana":"けいさつ を よんで ください。","meaning":"Please call the police.","romaji":"keisatsu o yonde kudasai."}],"replies":[{"jp":"はい、今かけます。","kana":"はい、 いま かけます。","meaning":"Yes, I am calling now.","romaji":"hai, ima kakemasu."}],"note":"110 is the police emergency number. 119 is for fire and ambulance. Give the place first, then what happened.","level":"core","romaji":"hyakutooban ni denwa shite kudasai."},{"id":"trouble-police-03","speaker":"you","jp":"事故がありました。","kana":"じこ が ありました。","meaning":"There was an accident.","also_heard":[{"jp":"交通事故です。","kana":"こうつうじこ です。","meaning":"It is a traffic accident.","romaji":"koutsuujiko desu."},{"jp":"けが人がいます。","kana":"けがにん が います。","meaning":"There are injured people.","romaji":"keganin ga imasu."}],"replies":[{"jp":"場所はどこですか。","kana":"ばしょ は どこ です か。","meaning":"Where is it?","romaji":"basho wa doko desu ka."}],"note":"Say the place clearly: street, station or nearby shop. The operator will ask whether it is a crime or an accident.","level":"core","romaji":"jiko ga arimashita."},{"id":"trouble-police-04","speaker":"you","jp":"誰かにつけられています。","kana":"だれか に つけられています。","meaning":"Someone is following me.","also_heard":[{"jp":"変な人がいます。","kana":"へんな ひと が います。","meaning":"There is a strange person here.","romaji":"henna hito ga imasu."},{"jp":"あの人が怖いです。","kana":"あの ひと が こわい です。","meaning":"That person scares me.","romaji":"ano hito ga kowai desu."}],"replies":[{"jp":"こちらに来てください。","kana":"こちら に きて ください。","meaning":"Please come this way.","romaji":"kochira ni kite kudasai."}],"note":"Go into a shop, a police box or a convenience store and tell the staff there.","level":"core","romaji":"dareka ni tsukerareteimasu."},{"id":"trouble-police-05","speaker":"you","jp":"スリに遭いました。財布を盗まれました。","kana":"スリ に あいました。 さいふ を ぬすまれました。","meaning":"I was pickpocketed. My wallet was stolen.","also_heard":[{"jp":"かばんを取られました。","kana":"かばん を とられました。","meaning":"My bag was taken.","romaji":"kaban o toraremashita."}],"replies":[{"jp":"何を盗まれましたか？","kana":"なに を ぬすまれました か？","meaning":"What was stolen?","romaji":"nani o nusumaremashita ka?"}],"note":"スリ means pickpocket. Police may ask you to file a 被害届, a report of damage.","level":"core","romaji":"suri ni aimashita. saifu o nusumaremashita."},{"id":"trouble-police-06","speaker":"you","jp":"けんかをしています。止めてください。","kana":"けんか を しています。 とめて ください。","meaning":"There is a fight. Please stop it.","also_heard":[{"jp":"男の人が殴り合っています。","kana":"おとこ の ひと が なぐりあって います。","meaning":"Two men are hitting each other.","romaji":"otoko no hito ga naguriatte imasu."}],"replies":[{"jp":"どこですか。","kana":"どこ です か。","meaning":"Where?","romaji":"doko desu ka."}],"note":"Do not step in. Give the place and call 110.","level":"useful","romaji":"kenka o shiteimasu. tomete kudasai."},{"id":"trouble-police-07","speaker":"you","jp":"私は目撃者です。見ました。","kana":"わたし は もくげきしゃ です。 みました。","meaning":"I am a witness. I saw it.","replies":[{"jp":"話を聞かせてください。","kana":"はなし を きかせて ください。","meaning":"Please tell us what you saw.","romaji":"hanashi o kikasete kudasai."}],"note":"目撃 means witnessed. Describe only what you actually saw.","level":"useful","romaji":"watashi wa mokugekisha desu. mimashita."},{"id":"trouble-police-08","speaker":"staff","jp":"パスポートを見せてください。","kana":"パスポート を みせて ください。","meaning":"Please show your passport.","also_heard":[{"jp":"見せていただけますか。","kana":"みせて いただけます か。","meaning":"May I see it, please?","romaji":"misete itadakemasu ka."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you are.","romaji":"hai, douzo."},{"jp":"ホテルに置いてあります。コピーならあります。","kana":"ホテル に おいて あります。 コピー なら あります。","meaning":"It is in my hotel. I have a copy.","romaji":"hoteru ni oite arimasu. kopii nara arimasu."}],"note":"Carry your passport or a photo of it when you go out. If the original is in your hotel safe, say so and show the copy.","level":"core","romaji":"pasupooto o misete kudasai."},{"id":"trouble-police-09","speaker":"staff","jp":"お名前、国籍、泊まっているホテルを教えてください。いつ日本に来ましたか。","kana":"おなまえ、 こくせき、 とまって いる ホテル を おしえて ください。 いつ にほん に きました か。","meaning":"Your name, nationality and hotel, please. When did you arrive in Japan?","replies":[{"jp":"エルサルバドルです。","kana":"エルサルバドル です。","meaning":"I am from El Salvador.","romaji":"erusarubadoru desu."},{"jp":"十二月十七日に来ました。","kana":"じゅうにがつ じゅうしちにち に きました。","meaning":"I arrived on December 17.","romaji":"juunigatsu juushichinichi ni kimashita."}],"note":"Have your name as written in your passport, your nationality and hotel name ready. Use your real arrival date.","level":"core","romaji":"onamae, kokuseki, tomatte iru hoteru o oshiete kudasai. itsu nihon ni kimashita ka."},{"id":"trouble-police-10","speaker":"you","jp":"わかりません。通訳をお願いします。","kana":"わかりません。 つうやく を おねがい します。","meaning":"I do not understand. Please get me an interpreter.","also_heard":[{"jp":"英語の通訳はいますか。","kana":"えいご の つうやく は います か。","meaning":"Is there an English interpreter?","romaji":"eigo no tsuuyaku wa imasu ka."}],"replies":[{"jp":"通訳を手配します。","kana":"つうやく を てはい します。","meaning":"I will arrange an interpreter.","romaji":"tsuuyaku o tehai shimasu."},{"jp":"電話通訳を使いますね。","kana":"でんわ つうやく を つかいます ね。","meaning":"We will use a phone interpreter.","romaji":"denwa tsuuyaku o tsukaimasu ne."}],"note":"Ask early. If none is available, use short words or ask them to write it down. Never sign a paper you cannot read.","level":"core","romaji":"wakarimasen. tsuuyaku o onegai shimasu."},{"id":"trouble-police-11","speaker":"you","jp":"大使館に連絡したいです。","kana":"たいしかん に れんらく したい です。","meaning":"I want to contact my embassy.","also_heard":[{"jp":"弁護士を呼びたいです。","kana":"べんごし を よびたい です。","meaning":"I want to call a lawyer.","romaji":"bengoshi o yobitai desu."}],"replies":[{"jp":"はい、電話をどうぞ。","kana":"はい、 でんわ を どうぞ。","meaning":"Yes, please use the phone.","romaji":"hai, denwa o douzo."}],"note":"You can ask to contact your embassy. Keep its contact details written down before the trip.","level":"useful","romaji":"taishikan ni renraku shitai desu."}]},{"title":"Earthquake and disaster language","intro":"Know the standard warnings. Mostly you listen; your replies are simple questions to staff.","phrases":[{"id":"trouble-quake-01","speaker":"announcement","jp":"緊急地震速報です。強い揺れに警戒してください。","kana":"きんきゅう じしん そくほう です。 つよい ゆれ に けいかい して ください。","meaning":"Earthquake early warning. Be on guard for strong shaking.","replies":[],"note":"Your phone may sound an alarm too. Drop to the floor, cover your head and hold on until the shaking stops.","level":"listen-only","romaji":"kinkyuu jishin sokuhou desu. tsuyoi yure ni keikai shite kudasai."},{"id":"trouble-quake-02","speaker":"announcement","jp":"地震です。落ち着いて行動してください。","kana":"じしん です。 おちついて こうどう して ください。","meaning":"Earthquake. Stay calm and act carefully.","also_heard":[{"jp":"慌てないでください。","kana":"あわてないで ください。","meaning":"Do not panic.","romaji":"awatenaide kudasai."}],"replies":[],"note":"Stay calm and follow the instructions of staff.","level":"listen-only","romaji":"jishin desu. ochitsuite koudou shite kudasai."},{"id":"trouble-quake-03","speaker":"announcement","jp":"机の下に入ってください。頭を守ってください。","kana":"つくえ の した に はいって ください。 あたま を まもって ください。","meaning":"Get under the desk. Protect your head.","also_heard":[{"jp":"揺れが収まるまで動かないでください。","kana":"ゆれ が おさまる まで うごかないで ください。","meaning":"Do not move until the shaking stops.","romaji":"yure ga osamaru made ugokanaide kudasai."}],"replies":[],"note":"Cover your head with your arms or a bag if no desk is near.","level":"listen-only","romaji":"tsukue no shita ni haitte kudasai. atama o mamotte kudasai."},{"id":"trouble-quake-04","speaker":"announcement","jp":"エレベーターは使用しないでください。","kana":"エレベーター は しよう しないで ください。","meaning":"Do not use the elevators.","also_heard":[{"jp":"階段をご利用ください。","kana":"かいだん を ごりよう ください。","meaning":"Please use the stairs.","romaji":"kaidan o goriyou kudasai."}],"replies":[],"note":"After a quake, lifts may stop between floors. Use the stairs.","level":"listen-only","romaji":"erebeetaa wa shiyou shinaide kudasai."},{"id":"trouble-quake-05","speaker":"announcement","jp":"沿岸部の方は直ちに高台など安全な場所へ避難してください。","kana":"えんがんぶ の かた は ただち に たかだい など あんぜん な ばしょ へ ひなん して ください。","meaning":"People in coastal areas, go to high ground or another safe place at once.","also_heard":[{"jp":"至急高台に避難してください。","kana":"しきゅう たかだい に ひなん して ください。","meaning":"Evacuate to high ground at once.","romaji":"shikyuu takadai ni hinan shite kudasai."}],"replies":[],"note":"Tsunami warnings are for coastal areas. Follow the evacuation signs and do not go back to look at the sea.","level":"listen-only","romaji":"enganbu no kata wa tadachi ni takadai nado anzen na basho e hinan shite kudasai."},{"id":"trouble-quake-06","speaker":"announcement","jp":"避難してください。避難所はこちらです。","kana":"ひなん して ください。 ひなんじょ は こちら です。","meaning":"Please evacuate. The shelter is this way.","replies":[],"note":"避難場所 is an open gathering area, while 避難所 is a shelter building. Ask which one they mean.","level":"listen-only","romaji":"hinan shite kudasai. hinanjo wa kochira desu."},{"id":"trouble-quake-07","speaker":"announcement","jp":"火事です。火事です。非常口から避難してください。","kana":"かじ です。 かじ です。 ひじょうぐち から ひなん して ください。","meaning":"Fire! Fire! Evacuate through the emergency exit.","also_heard":[{"jp":"火災が発生しました。","kana":"かさい が はっせい しました。","meaning":"A fire has broken out.","romaji":"kasai ga hassei shimashita."}],"replies":[],"note":"Use the nearest 非常口 sign. Do not use the lift.","level":"listen-only","romaji":"kaji desu. kaji desu. hijouguchi kara hinan shite kudasai."},{"id":"trouble-quake-08","speaker":"you","jp":"安全ですか。","kana":"あんぜん です か。","meaning":"Is it safe?","also_heard":[{"jp":"大丈夫ですか。","kana":"だいじょうぶ です か。","meaning":"Are you all right?","romaji":"daijoubu desu ka."}],"replies":[{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"It is fine.","romaji":"daijoubu desu."},{"jp":"危険です。","kana":"きけん です。","meaning":"It is dangerous.","romaji":"kiken desu."}],"note":"Watch what staff do, not just their words. Follow their instructions.","level":"core","romaji":"anzen desu ka."},{"id":"trouble-quake-09","speaker":"you","jp":"どこに行けばいいですか。避難所はどこですか。","kana":"どこ に いけば いい です か。 ひなんじょ は どこ です か。","meaning":"Where should we go? Where is the shelter?","replies":[{"jp":"あちらです。ついてきてください。","kana":"あちら です。 ついて きて ください。","meaning":"That way. Please follow me.","romaji":"achira desu. tsuite kite kudasai."}],"note":"Follow staff and do not go back for your belongings.","level":"core","romaji":"doko ni ikeba ii desu ka. hinanjo wa doko desu ka."},{"id":"trouble-quake-10","speaker":"you","jp":"電車は動いていますか。","kana":"でんしゃ は うごいて います か。","meaning":"Are the trains running?","replies":[{"jp":"今、止まっています。","kana":"いま、 とまって います。","meaning":"They are stopped right now.","romaji":"ima, tomatte imasu."},{"jp":"運転を見合わせています。","kana":"うんてん を みあわせて います。","meaning":"Service is suspended for now.","romaji":"unten o miawasete imasu."}],"note":"Trains often stop for safety checks after a quake. Ask again later.","level":"core","romaji":"densha wa ugoite imasu ka."},{"id":"trouble-quake-11","speaker":"you","jp":"地震の情報はどこで見られますか。","kana":"じしん の じょうほう は どこ で みられます か。","meaning":"Where can I see earthquake information?","replies":[{"jp":"スタッフに聞いてください。","kana":"スタッフ に きいて ください。","meaning":"Please ask the staff.","romaji":"sutaffu ni kiite kudasai."}],"note":"気象庁 (JMA) publishes the official quake and tsunami information. Ask hotel staff which source to follow.","level":"useful","romaji":"jishin no jouhou wa doko de miraremasu ka."}]},{"title":"Weather and transport disruption","intro":"Winter brings heavy snow in the mountains and sometimes in cities. Trains, buses, highways and flights can be suspended.","phrases":[{"id":"trouble-weather-01","speaker":"announcement","jp":"大雪のため、運休しています。","kana":"おおゆき の ため、 うんきゅう して います。","meaning":"Due to heavy snow, service is suspended.","also_heard":[{"jp":"運転再開の見込みは立っていません。","kana":"うんてん さいかい の みこみ は たって いません。","meaning":"There is no set time for service to restart.","romaji":"unten saikai no mikomi wa tatte imasen."}],"replies":[],"note":"運休 means the service is not running at all. 見合わせ means it is on hold and may restart.","level":"listen-only","romaji":"ooyuki no tame, unkyuu shite imasu."},{"id":"trouble-weather-02","speaker":"announcement","jp":"大雪のため、高速道路は通行止めです。","kana":"おおゆき の ため、 こうそくどうろ は つうこうどめ です。","meaning":"The expressway is closed due to heavy snow.","also_heard":[{"jp":"全面通行止めです。","kana":"ぜんめん つうこうどめ です。","meaning":"It is closed completely.","romaji":"zenmen tsuukoudome desu."}],"replies":[],"note":"Buses on expressways stop too. Ask about another route.","level":"listen-only","romaji":"ooyuki no tame, kousokudouro wa tsuukoudome desu."},{"id":"trouble-weather-03","speaker":"announcement","jp":"悪天候のため、欠航となりました。","kana":"あくてんこう の ため、 けっこう と なりました。","meaning":"Due to bad weather, the flight has been cancelled.","also_heard":[{"jp":"この便は遅延しています。","kana":"この びん は ちえん して います。","meaning":"This flight is delayed.","romaji":"kono bin wa chien shite imasu."}],"replies":[],"note":"欠航 means cancelled. 遅延 means delayed but still flying.","level":"listen-only","romaji":"akutenkou no tame, kekkou to narimashita."},{"id":"trouble-weather-04","speaker":"you","jp":"雪で電車は動きますか。","kana":"ゆき で でんしゃ は うごきます か。","meaning":"Will the trains run in the snow?","replies":[{"jp":"動いています。","kana":"うごいて います。","meaning":"They are running.","romaji":"ugoite imasu."},{"jp":"止まっています。","kana":"とまって います。","meaning":"They have stopped.","romaji":"tomatte imasu."}],"note":"Check the station board and ask staff, since conditions change quickly.","level":"core","romaji":"yuki de densha wa ugokimasu ka."},{"id":"trouble-weather-05","speaker":"you","jp":"振替輸送はありますか。","kana":"ふりかえ ゆそう は あります か。","meaning":"Is there a replacement service on other lines?","replies":[{"jp":"別の線をご利用ください。","kana":"べつ の せん を ごりよう ください。","meaning":"Please use another line.","romaji":"betsu no sen o goriyou kudasai."}],"note":"振替輸送 means trains or buses on other lines that replace the stopped service. Ask the staff which line to take.","level":"core","romaji":"furikae yusou wa arimasu ka."},{"id":"trouble-weather-06","speaker":"you","jp":"他の行き方はありますか。","kana":"ほか の いきかた は あります か。","meaning":"Is there another way to get there?","replies":[{"jp":"新宿経由で行けます。","kana":"しんじゅく けいゆ で いけます。","meaning":"You can go via Shinjuku.","romaji":"shinjuku keiyu de ikemasu."}],"note":"Ask if a bus is possible too (バスで行けますか). A bus can be quicker than a long detour.","level":"core","romaji":"hoka no ikikata wa arimasu ka."},{"id":"trouble-weather-07","speaker":"you","jp":"今夜泊まるホテルが必要です。","kana":"こんや とまる ホテル が ひつよう です。","meaning":"I need a hotel for tonight.","replies":[{"jp":"近くのホテルが空いています。","kana":"ちかく の ホテル が あいて います。","meaning":"Some hotels nearby have rooms.","romaji":"chikaku no hoteru ga aite imasu."}],"note":"Ask at the 案内所 or the hotel desk. Have your passport ready for check-in.","level":"core","romaji":"kon'ya tomaru hoteru ga hitsuyou desu."},{"id":"trouble-weather-08","speaker":"you","jp":"高速バスを予約し直したいです。","kana":"こうそく バス を よやく し なおし たい です。","meaning":"I want to rebook the highway bus.","replies":[{"jp":"窓口でお願いします。","kana":"まどぐち で おねがい します。","meaning":"Please go to the counter.","romaji":"madoguchi de onegai shimasu."}],"note":"Keep your ticket and receipt. Ask 払い戻しはできますか to check whether a refund is possible.","level":"useful","romaji":"kousoku basu o yoyaku shi naoshi tai desu."},{"id":"trouble-weather-09","speaker":"you","jp":"いつ動きますか。","kana":"いつ うごきます か。","meaning":"When will it run?","replies":[{"jp":"未定です。","kana":"みてい です。","meaning":"It is not decided yet.","romaji":"mitei desu."},{"jp":"復旧の見込みは今夜十時ごろです。","kana":"ふっきゅう の みこみ は こんや じゅうじ ごろ です。","meaning":"We expect service to resume around 10 p.m. tonight.","romaji":"fukkyuu no mikomi wa kon'ya juuji goro desu."}],"note":"未定 means undecided. Expect updates, so check the station board and ask staff again later.","level":"useful","romaji":"itsu ugokimasu ka."},{"id":"trouble-weather-10","speaker":"you","jp":"河口湖のロープウェイは動いていますか。","kana":"かわぐちこ の ロープウェイ は うごいて います か。","meaning":"Is the ropeway at Kawaguchiko running?","replies":[{"jp":"強風のため、今日は運休しています。","kana":"きょうふう の ため、 きょう は うんきゅう して います。","meaning":"Due to strong wind, it is suspended today.","romaji":"kyoufuu no tame, kyou wa unkyuu shite imasu."}],"note":"Ask about the bus to Kawaguchiko (河口湖行きのバス) too, if the ropeway is closed.","level":"useful","romaji":"kawaguchiko no roopuwei wa ugoite imasu ka."},{"id":"trouble-weather-11","speaker":"you","jp":"大雪警報が出ています。","kana":"おおゆき けいほう が でて います。","meaning":"A heavy snow warning is in effect.","replies":[{"jp":"はい。今日は外出を控えてください。","kana":"はい。 きょう は がいしゅつ を ひかえて ください。","meaning":"Yes. Please avoid going out today.","romaji":"hai. kyou wa gaishutsu o hikaete kudasai."}],"note":"Warnings come from the Japan Meteorological Agency. Roads may be icy, so watch your step.","level":"useful","romaji":"ooyuki keihou ga dete imasu."}]},{"title":"Flight problems on the way home","intro":"Delays, cancellations and baggage problems at the airport. Airline staff may speak some English, so know the key words.","phrases":[{"id":"trouble-air-01","speaker":"you","jp":"飛行機が遅れています。","kana":"ひこうき が おくれて います。","meaning":"The flight is delayed.","also_heard":[{"jp":"何時に出ますか。","kana":"なんじ に でます か。","meaning":"What time will it leave?","romaji":"nanji ni demasu ka."}],"replies":[{"jp":"十九時半に変更になりました。","kana":"じゅうくじはん に へんこう に なりました。","meaning":"It has been changed to 7:30 p.m.","romaji":"juukujihan ni henkou ni narimashita."}],"note":"Ask 何時に出ますか to get the new time. The departure board also shows changes.","level":"core","romaji":"hikouki ga okurete imasu."},{"id":"trouble-air-02","speaker":"you","jp":"欠航になりました。","kana":"けっこう に なりました。","meaning":"The flight was cancelled.","replies":[{"jp":"振替便をご案内します。","kana":"ふりかえ びん を ごあんない します。","meaning":"I will guide you to a replacement flight.","romaji":"furikae bin o goannai shimasu."}],"note":"振替 means rebooking you onto another flight.","level":"core","romaji":"kekkou ni narimashita."},{"id":"trouble-air-03","speaker":"you","jp":"乗り継ぎに間に合いません。","kana":"のりつぎ に まにあいません。","meaning":"I will miss my connection.","replies":[{"jp":"別の便を調べます。","kana":"べつ の びん を しらべます。","meaning":"I will look for another flight.","romaji":"betsu no bin o shirabemasu."}],"note":"乗り継ぎ means connection. Give staff your connecting flight number.","level":"core","romaji":"noritsugi ni maniaimasen."},{"id":"trouble-air-04","speaker":"you","jp":"別の便に変更をお願いします。","kana":"べつ の びん に へんこう を おねがい します。","meaning":"Please change me to another flight.","replies":[{"jp":"明日の便でよろしいですか。","kana":"あした の びん で よろしい です か。","meaning":"Is tomorrow's flight all right?","romaji":"ashita no bin de yoroshii desu ka."}],"note":"Ask for the earliest option. Have your booking number and passport ready.","level":"core","romaji":"betsu no bin ni henkou o onegai shimasu."},{"id":"trouble-air-05","speaker":"you","jp":"航空会社のカウンターはどこですか。","kana":"こうくうがいしゃ の カウンター は どこ です か。","meaning":"Where is the airline counter?","replies":[{"jp":"三階です。","kana":"さんがい です。","meaning":"It is on the third floor.","romaji":"sangai desu."}],"note":"Check your ticket for the airline name, then follow the signs for that airline.","level":"core","romaji":"koukuugaisha no kauntaa wa doko desu ka."},{"id":"trouble-air-06","speaker":"you","jp":"ホテルのバウチャーをいただけますか。","kana":"ホテル の バウチャー を いただけます か。","meaning":"Could I have a hotel voucher?","replies":[{"jp":"欠航の場合は手配します。","kana":"けっこう の ばあい は てはい します。","meaning":"We arrange it if the flight was cancelled.","romaji":"kekkou no baai wa tehai shimasu."}],"note":"Whether you get a voucher depends on the cause and the airline, so ask the counter.","level":"useful","romaji":"hoteru no bauchaa o itadakemasu ka."},{"id":"trouble-air-07","speaker":"you","jp":"荷物が出てきません。","kana":"にもつ が でてきません。","meaning":"My baggage did not come out.","replies":[{"jp":"荷物の特徴を教えてください。","kana":"にもつ の とくちょう を おしえて ください。","meaning":"Please describe your bag.","romaji":"nimotsu no tokuchou o oshiete kudasai."}],"note":"Describe the colour, size and any marks. Keep the baggage claim tag.","level":"core","romaji":"nimotsu ga detekimasen."},{"id":"trouble-air-08","speaker":"you","jp":"荷物はいつ届きますか。ホテルに送ってください。","kana":"にもつ は いつ とどきます か。 ホテル に おくって ください。","meaning":"When will it arrive? Please send it to my hotel.","replies":[{"jp":"明日お届けします。","kana":"あした おとどけ します。","meaning":"We will deliver it tomorrow.","romaji":"ashita otodoke shimasu."}],"note":"Write the hotel name in Japanese and English, so the delivery is not delayed.","level":"useful","romaji":"nimotsu wa itsu todokimasu ka. hoteru ni okutte kudasai."},{"id":"trouble-air-09","speaker":"announcement","jp":"ただいま、三一二便は機材到着遅れのため遅れております。","kana":"ただいま、 さんいちに びん は きざい とうちゃく おくれ の ため おくれて おります。","meaning":"Flight 312 is delayed because the aircraft arrived late.","also_heard":[{"jp":"出発時刻が変更になりました。","kana":"しゅっぱつ じこく が へんこう に なりました。","meaning":"The departure time has changed.","romaji":"shuppatsu jikoku ga henkou ni narimashita."}],"replies":[],"note":"機材到着遅れ means the plane itself arrived late. Listen for the flight number and the new time.","level":"listen-only","romaji":"tadaima, san'ichini bin wa kizai touchaku okure no tame okurete orimasu."},{"id":"trouble-air-10","speaker":"you","jp":"払い戻しはできますか。","kana":"はらいもどし は できます か。","meaning":"Can I get a refund?","replies":[{"jp":"はい、払い戻しの手続きができます。","kana":"はい、 はらいもどし の てつづき が できます。","meaning":"Yes, we can process a refund.","romaji":"hai, haraimodoshi no tetsuzuki ga dekimasu."}],"note":"Have your booking number (予約番号) and boarding pass (搭乗券) ready.","level":"useful","romaji":"haraimodoshi wa dekimasu ka."}]},{"title":"Saying no and getting out of situations","intro":"Street touts (客引き) in Shinjuku, Kabukicho and Namba. Be firm, polite, and keep walking.","phrases":[{"id":"trouble-touts-01","speaker":"staff","jp":"お兄さん、飲みに行きませんか。安くしますよ。","kana":"おにいさん、 のみ に いきませんか。 やすく します よ。","meaning":"Hey, want to go for a drink? It is cheap.","also_heard":[{"jp":"マッサージどうですか？","kana":"マッサージ どう です か？","meaning":"How about a massage?","romaji":"massaaji dou desu ka?"}],"replies":[],"note":"Touts approach in busy nightlife areas. Keep walking and do not stop to argue.","level":"core","romaji":"oniisan, nomi ni ikimasenka. yasuku shimasu yo."},{"id":"trouble-touts-02","speaker":"you","jp":"結構です。","kana":"けっこう です。","meaning":"No, thank you.","replies":[],"note":"大丈夫です can mean yes or no, so avoid it here. 結構です is a clear polite no. Add いりません if they keep pushing.","level":"core","romaji":"kekkou desu."},{"id":"trouble-touts-03","speaker":"you","jp":"いりません。","kana":"いりません。","meaning":"I do not need it.","replies":[],"note":"Also: 興味ありません (I am not interested). Say it once, clearly, then keep walking.","level":"core","romaji":"irimasen."},{"id":"trouble-touts-04","speaker":"you","jp":"急いでいます。","kana":"いそいで います。","meaning":"I am in a hurry.","replies":[],"note":"Keep walking while you say it. 行かなきゃいけません (I have to go) also works.","level":"core","romaji":"isoide imasu."},{"id":"trouble-touts-05","speaker":"you","jp":"約束があります。","kana":"やくそく が あります。","meaning":"I have an appointment.","replies":[],"note":"友達が待っています (my friend is waiting) is another good excuse.","level":"core","romaji":"yakusoku ga arimasu."},{"id":"trouble-touts-06","speaker":"you","jp":"やめてください。","kana":"やめて ください。","meaning":"Please stop.","also_heard":[{"jp":"触らないでください。","kana":"さわらないで ください。","meaning":"Do not touch me.","romaji":"sawaranaide kudasai."},{"jp":"ついて来ないでください。","kana":"ついて こないで ください。","meaning":"Do not follow me.","romaji":"tsuite konaide kudasai."}],"replies":[],"note":"Say it firmly if someone touches or follows you. Then move to a shop or police box.","level":"core","romaji":"yamete kudasai."},{"id":"trouble-touts-07","speaker":"you","jp":"ほっといてください。","kana":"ほっといて ください。","meaning":"Leave me alone.","also_heard":[{"jp":"一人にしてください。","kana":"ひとり に して ください。","meaning":"Please leave me alone.","romaji":"hitori ni shite kudasai."}],"replies":[],"note":"This is strong. Use it only after you have already refused.","level":"core","romaji":"hottoite kudasai."},{"id":"trouble-touts-08","speaker":"you","jp":"頼んでいません。","kana":"たのんで いません。","meaning":"I did not order this.","replies":[],"note":"Use it when a bar brings something you did not order, such as an お通し snack with a cover charge.","level":"useful","romaji":"tanonde imasen."},{"id":"trouble-touts-09","speaker":"you","jp":"この料金は間違っています。","kana":"この りょうきん は まちがって います。","meaning":"This charge is wrong.","replies":[{"jp":"確認します。","kana":"かくにん します。","meaning":"I will check.","romaji":"kakunin shimasu."}],"note":"Ask for an itemised bill with 明細をください. Keep your receipt.","level":"useful","romaji":"kono ryoukin wa machigatte imasu."},{"id":"trouble-touts-10","speaker":"you","jp":"警察を呼びますよ。","kana":"けいさつ を よびます よ。","meaning":"I will call the police.","replies":[],"note":"Say it only when needed. 交番に行きます (I will go to the police box) is a calm alternative.","level":"useful","romaji":"keisatsu o yobimasu yo."},{"id":"trouble-touts-11","speaker":"you","jp":"払いません。","kana":"はらいません。","meaning":"I will not pay.","replies":[],"note":"Use only when a clear scam is happening. Then leave, and go to a police box if you feel unsafe.","level":"useful","romaji":"haraimasen."}]}],"dialogues":[{"title":"Asking the way on the street","lines":[{"speaker":"you","jp":"すみません、この住所に行きたいんですが。","kana":"すみません、 この じゅうしょ に いきたい ん です が。","meaning":"Excuse me, I want to go to this address.","romaji":"sumimasen, kono juusho ni ikitai n desu ga."},{"speaker":"staff","jp":"ええと、ここは…あ、近いですよ。","kana":"ええと、 ここ は… あ、 ちかい です よ。","meaning":"Let me see... oh, it is near.","romaji":"eeto, koko wa... a, chikai desu yo."},{"speaker":"you","jp":"歩いて行けますか。","kana":"あるいて いけます か。","meaning":"Can I walk?","romaji":"aruite ikemasu ka."},{"speaker":"staff","jp":"はい。まっすぐ行って、二つ目の信号を右に曲がってください。","kana":"はい。 まっすぐ いって、 ふたつめ の しんごう を みぎ に まがって ください。","meaning":"Yes. Go straight, then turn right at the second light.","romaji":"hai. massugu itte, futatsume no shingou o migi ni magatte kudasai."},{"speaker":"you","jp":"二つ目の信号を右ですね。","kana":"ふたつめ の しんごう を みぎ です ね。","meaning":"The second light, right?","romaji":"futatsume no shingou o migi desu ne."},{"speaker":"staff","jp":"そうです。コンビニの隣です。五分ぐらいです。","kana":"そう です。 コンビニ の となり です。 ごふん ぐらい です。","meaning":"Right. Next to a convenience store. About five minutes.","romaji":"sou desu. konbini no tonari desu. gofun gurai desu."},{"speaker":"you","jp":"ありがとうございます。助かりました。","kana":"ありがとうございます。 たすかりました。","meaning":"Thank you. You helped me.","romaji":"arigatougozaimasu. tasukarimashita."},{"speaker":"staff","jp":"気をつけて。","kana":"きをつけて。","meaning":"Take care.","romaji":"kiotsukete."}]},{"title":"Reporting a lost wallet at a police box","lines":[{"speaker":"you","jp":"すみません、財布をなくしました。","kana":"すみません、 さいふ を なくしました。","meaning":"Excuse me, I lost my wallet.","romaji":"sumimasen, saifu o nakushimashita."},{"speaker":"staff","jp":"いつ、どこでなくしましたか。","kana":"いつ、 どこ で なくしました か。","meaning":"When and where?","romaji":"itsu, doko de nakushimashita ka."},{"speaker":"you","jp":"今日の午後三時ごろ、あの駅の近くです。","kana":"きょう の ごご さんじ ごろ、 あの えき の ちかく です。","meaning":"Around 3 p.m. today, near that station.","romaji":"kyou no gogo sanji goro, ano eki no chikaku desu."},{"speaker":"staff","jp":"どんな財布ですか。","kana":"どんな さいふ です か。","meaning":"What kind of wallet?","romaji":"donna saifu desu ka."},{"speaker":"you","jp":"黒い革の長財布です。","kana":"くろい かわ の ながざいふ です。","meaning":"A long black leather wallet.","romaji":"kuroi kawa no nagazaifu desu."},{"speaker":"staff","jp":"中に何が入っていましたか。","kana":"なか に なに が はいって いました か。","meaning":"What was inside?","romaji":"naka ni nani ga haitte imashita ka."},{"speaker":"you","jp":"現金が二万円ぐらいと、カードが二枚です。","kana":"げんきん が にまんえん ぐらい と、 カード が にまい です。","meaning":"About 20,000 yen in cash and two cards.","romaji":"genkin ga niman'en gurai to, kaado ga nimai desu."},{"speaker":"staff","jp":"こちらの遺失届に書いてください。ホテルの名前と電話番号も。","kana":"こちら の いしつとどけ に かいて ください。 ホテル の なまえ と でんわばんごう も。","meaning":"Please fill in this lost property report. Include your hotel name and phone number too.","romaji":"kochira no ishitsutodoke ni kaite kudasai. hoteru no namae to denwabangou mo."},{"speaker":"you","jp":"見つかったら、ホテルにお願いします。","kana":"みつかったら、 ホテル に おねがい します。","meaning":"If it is found, please contact the hotel.","romaji":"mitsukattara, hoteru ni onegai shimasu."}]},{"title":"Card declined at a register","lines":[{"speaker":"staff","jp":"合計で八千円です。","kana":"ごうけい で はっせんえん です。","meaning":"The total is 8,000 yen.","romaji":"goukei de hassen'en desu."},{"speaker":"you","jp":"カードでお願いします。","kana":"カード で おねがい します。","meaning":"By card, please.","romaji":"kaado de onegai shimasu."},{"speaker":"staff","jp":"すみません、このカードはご利用になれません。","kana":"すみません、 この カード は ごりよう に なれません。","meaning":"Sorry, this card cannot be used.","romaji":"sumimasen, kono kaado wa goriyou ni naremasen."},{"speaker":"you","jp":"別のカードを試してもいいですか。","kana":"べつ の カード を ためして も いい です か。","meaning":"May I try another card?","romaji":"betsu no kaado o tameshite mo ii desu ka."},{"speaker":"staff","jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."},{"speaker":"you","jp":"これはどうですか。","kana":"これ は どう です か。","meaning":"How about this one?","romaji":"kore wa dou desu ka."},{"speaker":"staff","jp":"こちらも使えません。","kana":"こちら も つかえません。","meaning":"This one does not work either.","romaji":"kochira mo tsukaemasen."},{"speaker":"you","jp":"じゃあ、現金で払います。","kana":"じゃあ、 げんきん で はらいます。","meaning":"Then I will pay cash.","romaji":"jaa, genkin de haraimasu."},{"speaker":"staff","jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}]}],"signs":[{"jp":"交番","kana":"こうばん","meaning":"Police box","where":"Small police post in town. Ask here for directions or to report lost items.","romaji":"kouban"},{"jp":"警察","kana":"けいさつ","meaning":"Police","where":"Police station. Crimes and lost property are reported here too.","romaji":"keisatsu"},{"jp":"110番","kana":"ひゃくとおばん","meaning":"Police emergency number","where":"Police emergency number. Give your location first.","romaji":"hyakutooban"},{"jp":"119番","kana":"ひゃくじゅうきゅうばん","meaning":"Fire and ambulance emergency number","where":"Fire and ambulance emergency number.","romaji":"hyakujuukyuuban"},{"jp":"非常口","kana":"ひじょうぐち","meaning":"Emergency exit","where":"In buildings. Shows the way out in a fire.","romaji":"hijouguchi"},{"jp":"避難場所","kana":"ひなんばしょ","meaning":"Evacuation area","where":"Open space to gather in a disaster. Often on local maps.","romaji":"hinanbasho"},{"jp":"避難所","kana":"ひなんじょ","meaning":"Evacuation shelter","where":"Building where people stay if they cannot go home after a disaster.","romaji":"hinanjo"},{"jp":"津波","kana":"つなみ","meaning":"Tsunami","where":"Found on coastal warning boards.","romaji":"tsunami"},{"jp":"津波避難場所","kana":"つなみ ひなんばしょ","meaning":"Tsunami evacuation site","where":"High ground or buildings marked for tsunami evacuation in coastal towns.","romaji":"tsunami hinanbasho"},{"jp":"消火器","kana":"しょうかき","meaning":"Fire extinguisher","where":"Mounted on walls in shops, hotels and stations.","romaji":"shoukaki"},{"jp":"非常ボタン","kana":"ひじょう ボタン","meaning":"Emergency button","where":"In lifts, stations and toilets. Press only in an emergency.","romaji":"hijou botan"},{"jp":"AED","kana":"エーイーディー","meaning":"Automated external defibrillator","where":"Public places such as stations and malls. Staff can show you where it is.","romaji":"eeiidii"},{"jp":"危険","kana":"きけん","meaning":"Danger","where":"Warning at hazards and construction. Stay back.","romaji":"kiken"},{"jp":"注意","kana":"ちゅうい","meaning":"Caution","where":"On steps, floors and crossings.","romaji":"chuui"},{"jp":"立入禁止","kana":"たちいりきんし","meaning":"No entry","where":"Closed areas. Do not go past the barrier.","romaji":"tachiirikinshi"},{"jp":"工事中","kana":"こうじちゅう","meaning":"Under construction","where":"Road and station works. Expect detours.","romaji":"koujichuu"},{"jp":"通行止め","kana":"つうこうどめ","meaning":"Road closed","where":"On roads and expressways. Find another route.","romaji":"tsuukoudome"},{"jp":"故障中","kana":"こしょうちゅう","meaning":"Out of order","where":"Ticket machines, lifts or toilets that are not working.","romaji":"koshouchuu"},{"jp":"遺失物","kana":"いしつぶつ","meaning":"Lost property","where":"Lost property office, often at stations or police stations.","romaji":"ishitsubutsu"},{"jp":"お忘れ物","kana":"おわすれもの","meaning":"Forgotten items","where":"Stations and transport counters for items you left behind.","romaji":"owasuremono"},{"jp":"落とし物","kana":"おとしもの","meaning":"Dropped items","where":"Stations, malls and shops that collect lost items.","romaji":"otoshimono"},{"jp":"案内所","kana":"あんないじょ","meaning":"Information desk","where":"Big stations and malls. Ask here for help.","romaji":"annaijo"},{"jp":"迷子","kana":"まいご","meaning":"Lost child","where":"Child lost-and-found. Not used for adults.","romaji":"maigo"},{"jp":"両替","kana":"りょうがえ","meaning":"Currency exchange","where":"Airports, stations and some shops. Check the rate first.","romaji":"ryougae"},{"jp":"大使館","kana":"たいしかん","meaning":"Embassy","where":"Your country's diplomatic office. Keep its contact de
