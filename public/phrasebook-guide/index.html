,"meaning":"toothbrush","romaji":"haburashi"},{"jp":"シャンプー","kana":"シャンプー","meaning":"shampoo","romaji":"shanpuu"},{"jp":"加湿器","kana":"かしつき","meaning":"humidifier","romaji":"kashitsuki"},{"jp":"空気清浄機","kana":"くうきせいじょうき","meaning":"air purifier","romaji":"kuukiseijouki"},{"jp":"冷蔵庫","kana":"れいぞうこ","meaning":"fridge","romaji":"reizouko"},{"jp":"電気ケトル","kana":"でんき ケトル","meaning":"electric kettle","romaji":"denki ketoru"},{"jp":"スリッパ","kana":"スリッパ","meaning":"slippers","romaji":"surippa"},{"jp":"充電器","kana":"じゅうでんき","meaning":"charger","romaji":"juudenki"},{"jp":"変換プラグ","kana":"へんかんプラグ","meaning":"plug adapter","romaji":"henkanpuragu"},{"jp":"傘","kana":"かさ","meaning":"umbrella","romaji":"kasa"},{"jp":"金庫","kana":"きんこ","meaning":"safe","romaji":"kinko"}]},{"title":"Hotel words","items":[{"jp":"宿泊税","kana":"しゅくはくぜい","meaning":"accommodation tax","romaji":"shukuhakuzei"},{"jp":"領収書","kana":"りょうしゅうしょ","meaning":"receipt","romaji":"ryoushuusho"},{"jp":"予約","kana":"よやく","meaning":"reservation","romaji":"yoyaku"},{"jp":"満室","kana":"まんしつ","meaning":"fully booked","romaji":"manshitsu"},{"jp":"空室","kana":"くうしつ","meaning":"vacant room","romaji":"kuushitsu"},{"jp":"連泊","kana":"れんぱく","meaning":"staying several nights in a row","romaji":"renpaku"},{"jp":"素泊まり","kana":"すどまり","meaning":"room only, no meals","romaji":"sudomari"},{"jp":"朝食","kana":"ちょうしょく","meaning":"breakfast","romaji":"choushoku"},{"jp":"一泊","kana":"いっぱく","meaning":"one night","romaji":"ippaku"},{"jp":"二泊","kana":"にはく","meaning":"two nights","romaji":"nihaku"},{"jp":"荷物","kana":"にもつ","meaning":"luggage","romaji":"nimotsu"},{"jp":"預かる","kana":"あずかる","meaning":"to keep something for someone","romaji":"azukaru"},{"jp":"預ける","kana":"あずける","meaning":"to leave something with someone","romaji":"azukeru"},{"jp":"宅配便","kana":"たくはいびん","meaning":"parcel delivery","romaji":"takuhaibin"},{"jp":"伝票","kana":"でんぴょう","meaning":"slip or form","romaji":"denpyou"},{"jp":"控え","kana":"ひかえ","meaning":"copy kept by the customer","romaji":"hikae"},{"jp":"精算","kana":"せいさん","meaning":"settling the bill","romaji":"seisan"}]},{"title":"Bath words","items":[{"jp":"大浴場","kana":"だいよくじょう","meaning":"large public bath","romaji":"daiyokujou"},{"jp":"男湯","kana":"おとこゆ","meaning":"men's bath","romaji":"otokoyu"},{"jp":"女湯","kana":"おんなゆ","meaning":"women's bath","romaji":"onnayu"},{"jp":"貸切風呂","kana":"かしきりぶろ","meaning":"private bath you book","romaji":"kashikiriburo"},{"jp":"脱衣所","kana":"だついじょ","meaning":"changing room","romaji":"datsuijo"},{"jp":"湯船","kana":"ゆぶね","meaning":"bathtub","romaji":"yubune"},{"jp":"かけ湯","kana":"かけゆ","meaning":"pouring hot water over yourself before entering","romaji":"kakeyu"},{"jp":"入れ墨","kana":"いれずみ","meaning":"tattoo","romaji":"irezumi"},{"jp":"浴衣","kana":"ゆかた","meaning":"yukata, cotton robe worn at inns","romaji":"yukata"}]}],"_num":"05"},{"slug":"clothes","title":"Clothes and shoes","title_jp":"服・靴","summary":"Shop staff lines, sizes, fitting rooms, sales and tags","situations":[{"title":"Entering and browsing","intro":"Staff greet you and may come close. Know what they say and how to stay relaxed.","phrases":[{"id":"clothes-enter-01","speaker":"staff","jp":"いらっしゃいませ。","kana":"いらっしゃいませ。","meaning":"Welcome.","also_heard":[{"jp":"いらっしゃいませー。","kana":"いらっしゃいませー。","meaning":"Welcome (called out from across the shop).","romaji":"irasshaimasee."}],"note":"Not a question. A small nod is enough, no reply needed.","level":"core","romaji":"irasshaimase."},{"id":"clothes-enter-02","speaker":"staff","jp":"どうぞご覧くださいませ。","kana":"どうぞ ごらん くださいませ。","meaning":"Please take a look.","also_heard":[{"jp":"ごゆっくりご覧ください。","kana":"ごゆっくり ごらん ください。","meaning":"Take your time looking.","romaji":"goyukkuri goran kudasai."}],"replies":[{"jp":"はい、ありがとうございます。","kana":"はい、 ありがとうございます。","meaning":"Yes, thank you.","romaji":"hai, arigatougozaimasu."}],"note":"A gentle sign that they will not push. Keep browsing.","level":"core","romaji":"douzo goran kudasaimase."},{"id":"clothes-enter-03","speaker":"staff","jp":"何かお探しですか。","kana":"なに か おさがし です か。","meaning":"Are you looking for something?","also_heard":[{"jp":"何かお探しでしょうか。","kana":"なに か おさがし でしょう か。","meaning":"May I help you find something?","romaji":"nani ka osagashi deshou ka."}],"replies":[{"jp":"見ているだけです。","kana":"みて いる だけ です。","meaning":"I'm just looking.","romaji":"mite iru dake desu."},{"jp":"コートを探しています。","kana":"コート を さがしています。","meaning":"I'm looking for a coat.","romaji":"kooto o sagashiteimasu."}],"note":"The most common opening line. You can just say you are looking.","level":"core","romaji":"nani ka osagashi desu ka."},{"id":"clothes-enter-04","speaker":"you","jp":"大丈夫です、見ているだけです。","kana":"だいじょうぶ です、 みて いる だけ です。","meaning":"No thanks, I'm just looking.","replies":[{"jp":"はい、ごゆっくりどうぞ。","kana":"はい、 ごゆっくりどうぞ。","meaning":"Of course, take your time.","romaji":"hai, goyukkuridouzo."}],"note":"Basic just-looking is in Foundations. Add 何かあれば声をかけます (I'll call if I need you) to end politely.","level":"useful","romaji":"daijoubu desu, mite iru dake desu."},{"id":"clothes-enter-05","speaker":"you","jp":"すみません、ちょっといいですか。","kana":"すみません、 ちょっと いい です か。","meaning":"Excuse me, do you have a moment?","also_heard":[{"jp":"見てもらえますか。","kana":"みて もらえますか。","meaning":"Could you take a look and help me?","romaji":"mite moraemasuka."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"note":"Use すみません to get a clerk's attention. This is the usual way to call them over.","level":"core","romaji":"sumimasen, chotto ii desu ka."},{"id":"clothes-enter-06","speaker":"staff","jp":"よろしければご試着もできますので、お声がけください。","kana":"よろしければ ごしちゃく も できますので、 おこえがけ ください。","meaning":"If you like, you can try things on. Just call me.","also_heard":[{"jp":"ご試着どうぞ。","kana":"ごしちゃく どうぞ。","meaning":"Please try it on.","romaji":"goshichaku douzo."}],"note":"A soft offer. You do not have to try anything on.","level":"core","romaji":"yoroshikereba goshichaku mo dekimasunode, okoegake kudasai."},{"id":"clothes-enter-07","speaker":"staff","jp":"鏡で合わせてみてください。","kana":"かがみ で あわせて みて ください。","meaning":"Try holding it up to the mirror.","replies":[{"jp":"はい、見てみます。","kana":"はい、 みてみます。","meaning":"Yes, I'll take a look.","romaji":"hai, mitemimasu."}],"note":"Often they hold a jacket against you so you can see the fit.","level":"listen-only","romaji":"kagami de awasete mite kudasai."},{"id":"clothes-enter-08","speaker":"staff","jp":"こちら新作です。","kana":"こちら しんさく です。","meaning":"This is a new arrival.","also_heard":[{"jp":"新入荷です。","kana":"しんにゅうかです。","meaning":"New stock has just come in.","romaji":"shinnyuukadesu."}],"replies":[{"jp":"いいですね。","kana":"いい です ね。","meaning":"That's nice.","romaji":"ii desu ne."}],"level":"useful","romaji":"kochira shinsaku desu."},{"id":"clothes-enter-09","speaker":"staff","jp":"こちら人気です。","kana":"こちら にんき です。","meaning":"This one is popular.","also_heard":[{"jp":"大人気です。","kana":"だいにんき です。","meaning":"This one is very popular.","romaji":"daininki desu."}],"replies":[{"jp":"そうなんですね。","kana":"そう なん です ね。","meaning":"Oh, I see.","romaji":"sou nan desu ne."}],"note":"Sales talk. Popular does not mean you have to buy.","level":"useful","romaji":"kochira ninki desu."},{"id":"clothes-enter-10","speaker":"staff","jp":"最後の一点です。","kana":"さいご の いってん です。","meaning":"This is the last one.","also_heard":[{"jp":"残り一点です。","kana":"のこり いってん です。","meaning":"Only one left.","romaji":"nokori itten desu."}],"replies":[{"jp":"じゃあ、試着してもいいですか。","kana":"じゃあ、 しちゃく して も いい です か。","meaning":"Then may I try it on?","romaji":"jaa, shichaku shite mo ii desu ka."}],"note":"This may be real or a sales push. Take your time. 着 counts clothes and 足 counts shoes.","level":"useful","romaji":"saigo no itten desu."},{"id":"clothes-enter-11","speaker":"staff","jp":"色違いもございます。","kana":"いろちがい も ございます。","meaning":"We also have other colours.","replies":[{"jp":"見せてもらえますか。","kana":"みせて もらえますか。","meaning":"Could you show me?","romaji":"misete moraemasuka."}],"level":"useful","romaji":"irochigai mo gozaimasu."},{"id":"clothes-enter-12","speaker":"you","jp":"また後で来ます。","kana":"また あとで きます。","meaning":"I'll come back later.","replies":[{"jp":"ありがとうございました。","kana":"ありがとうございました。","meaning":"Thank you for coming.","romaji":"arigatougozaimashita."}],"note":"A polite way to leave when you are not buying now.","level":"useful","romaji":"mata atode kimasu."}]},{"title":"Finding the item","intro":"Floors, sections, stock, and what a special order really means.","phrases":[{"id":"clothes-find-01","speaker":"you","jp":"メンズはどこですか。","kana":"メンズ は どこ です か。","meaning":"Where is the men's section?","also_heard":[{"jp":"レディースはどこですか。","kana":"レディース は どこ です か。","meaning":"Where is the women's section?","romaji":"rediisu wa doko desu ka."},{"jp":"キッズはどこですか。","kana":"キッズ は どこ です か。","meaning":"Where is the kids' section?","romaji":"kizzu wa doko desu ka."}],"replies":[{"jp":"3階です。","kana":"さんがい です。","meaning":"It's on the 3rd floor.","romaji":"sangai desu."},{"jp":"あちらです。","kana":"あちら です。","meaning":"It's over there.","romaji":"achira desu."},{"jp":"エスカレーターで上がって右です。","kana":"エスカレーター で あがって みぎ です。","meaning":"Up the escalator, then on the right.","romaji":"esukareetaa de agatte migi desu."}],"note":"Listen for the floor number. Staff often point, so watch their hand.","level":"core","romaji":"menzu wa doko desu ka."},{"id":"clothes-find-02","speaker":"you","jp":"コートはどこにありますか。","kana":"コート は どこ に あります か。","meaning":"Where are the coats?","replies":[{"jp":"こちらです。","kana":"こちら です。","meaning":"It's this way.","romaji":"kochira desu."}],"note":"Swap the item: ジーンズ, 靴下, マフラー, 手袋 or 下着 all work the same way.","level":"core","romaji":"kooto wa doko ni arimasu ka."},{"id":"clothes-find-03","speaker":"you","jp":"これのメンズはありますか。","kana":"これ の メンズ は あります か。","meaning":"Is there a men's version of this?","also_heard":[{"jp":"これはユニセックスですか。","kana":"これ は ユニセックス です か。","meaning":"Is this unisex?","romaji":"kore wa yunisekkusu desu ka."}],"replies":[{"jp":"男女兼用です。","kana":"だんじょけんよう です。","meaning":"It's unisex.","romaji":"danjoken'you desu."},{"jp":"メンズのみです。","kana":"メンズ のみ です。","meaning":"Men's only.","romaji":"menzu nomi desu."}],"note":"On tags, 男女兼用 means unisex.","level":"core","romaji":"kore no menzu wa arimasu ka."},{"id":"clothes-find-04","speaker":"you","jp":"色違いはありますか。","kana":"いろちがい は あります か。","meaning":"Do you have other colours?","replies":[{"jp":"黒と紺がございます。","kana":"くろ と こん が ございます。","meaning":"We have black and navy.","romaji":"kuro to kon ga gozaimasu."}],"note":"紺 means navy blue. 黒 is black and 白 is white.","level":"core","romaji":"irochigai wa arimasu ka."},{"id":"clothes-find-05","speaker":"you","jp":"もう少し大きいサイズはありますか。","kana":"もう すこし おおきい サイズ は あります か。","meaning":"Do you have a slightly bigger size?","also_heard":[{"jp":"Mサイズはありますか。","kana":"エム サイズ は あります か。","meaning":"Do you have size M?","romaji":"emu saizu wa arimasu ka."}],"replies":[{"jp":"確認しますね。","kana":"かくにん しますね。","meaning":"Let me check.","romaji":"kakunin shimasune."}],"note":"For a smaller size, say もう少し小さいサイズはありますか.","level":"core","romaji":"mou sukoshi ookii saizu wa arimasu ka."},{"id":"clothes-find-06","speaker":"you","jp":"新品はありますか。","kana":"しんぴん は あります か。","meaning":"Do you have a new one, not the display item?","also_heard":[{"jp":"展示品ではないものはありますか。","kana":"てんじひん で は ない もの は あります か。","meaning":"Do you have one that is not a display item?","romaji":"tenjihin de wa nai mono wa arimasu ka."}],"replies":[{"jp":"在庫から出します。","kana":"ざいこ から だします。","meaning":"I'll bring one from stock.","romaji":"zaiko kara dashimasu."},{"jp":"展示品のみです。","kana":"てんじひん のみ です。","meaning":"Only the display item is left.","romaji":"tenjihin nomi desu."}],"note":"Display items can be marked down, but check their condition before you buy.","level":"useful","romaji":"shinpin wa arimasu ka."},{"id":"clothes-find-07","speaker":"staff","jp":"在庫を確認してまいります。","kana":"ざいこ を かくにん して まいります。","meaning":"I'll go and check the stock.","replies":[{"jp":"お願いします。","kana":"おねがいします。","meaning":"Yes, please.","romaji":"onegaishimasu."}],"note":"The clerk leaves to check. Wait where you are and they will come back to you.","level":"core","romaji":"zaiko o kakunin shite mairimasu."},{"id":"clothes-find-08","speaker":"staff","jp":"こちらが最後です。","kana":"こちら が さいご です。","meaning":"This is the last one.","also_heard":[{"jp":"在庫はこちらだけです。","kana":"ざいこ は こちら だけ です。","meaning":"This is the only stock we have.","romaji":"zaiko wa kochira dake desu."}],"replies":[{"jp":"分かりました。","kana":"わかりました。","meaning":"I understand.","romaji":"wakarimashita."}],"level":"useful","romaji":"kochira ga saigo desu."},{"id":"clothes-find-09","speaker":"staff","jp":"他の店舗にございます。","kana":"ほか の てんぽ に ございます。","meaning":"Another store has it.","also_heard":[{"jp":"お電話で確認しましょうか。","kana":"おでんわ で かくにん しましょうか。","meaning":"Shall I call and check?","romaji":"odenwa de kakunin shimashouka."}],"replies":[{"jp":"取り寄せられますか。","kana":"とりよせられますか。","meaning":"Can you order it in?","romaji":"toriyoseraremasuka."},{"jp":"結構です。","kana":"けっこうです。","meaning":"No thanks, that's fine.","romaji":"kekkoudesu."}],"note":"Stock at another branch may not be sent to your hotel. Do not count on it.","level":"useful","romaji":"hoka no tenpo ni gozaimasu."},{"id":"clothes-find-10","speaker":"staff","jp":"お取り寄せになります。","kana":"おとりよせ に なります。","meaning":"We would have to order it in.","also_heard":[{"jp":"1週間ほどかかります。","kana":"いっしゅうかん ほど かかります。","meaning":"It takes about a week.","romaji":"isshuukan hodo kakarimasu."}],"replies":[{"jp":"旅行中なので大丈夫です。","kana":"りょこう ちゅう なので だいじょうぶです。","meaning":"I'm travelling, so that's fine.","romaji":"ryokou chuu nanode daijoubudesu."},{"jp":"結構です。","kana":"けっこうです。","meaning":"No thanks.","romaji":"kekkoudesu."}],"note":"Ordering in mid-trip is usually not practical. A polite no is fine.","level":"useful","romaji":"otoriyose ni narimasu."},{"id":"clothes-find-11","speaker":"staff","jp":"申し訳ございません、売り切れです。","kana":"もうしわけ ございません、 うりきれ です。","meaning":"I'm sorry, it's sold out.","also_heard":[{"jp":"完売いたしました。","kana":"かんばい いたしました。","meaning":"It has sold out (formal).","romaji":"kanbai itashimashita."}],"replies":[{"jp":"そうですか、ありがとうございます。","kana":"そう です か、 ありがとうございます。","meaning":"I see, thank you.","romaji":"sou desu ka, arigatougozaimasu."}],"note":"You may also see 在庫切れ on signs. It means out of stock.","level":"listen-only","romaji":"moushiwake gozaimasen, urikire desu."},{"id":"clothes-find-12","speaker":"you","jp":"入荷の予定はありますか。","kana":"にゅうか の よてい は あります か。","meaning":"Will it be restocked?","replies":[{"jp":"未定です。","kana":"みてい です。","meaning":"It isn't decided yet.","romaji":"mitei desu."}],"note":"再入荷 on a tag means back in stock.","level":"useful","romaji":"nyuuka no yotei wa arimasu ka."}]},{"title":"Sizes","intro":"Japanese sizes often run small. Know the size words and the words for fit.","phrases":[{"id":"clothes-size-01","speaker":"staff","jp":"サイズはおいくつですか。","kana":"サイズ は おいくつ です か。","meaning":"What size are you?","also_heard":[{"jp":"普段のサイズは何ですか。","kana":"ふだん の サイズ は なん です か。","meaning":"What size do you usually wear?","romaji":"fudan no saizu wa nan desu ka."}],"replies":[{"jp":"普段はLです。","kana":"ふだん は エル です。","meaning":"I usually wear L.","romaji":"fudan wa eru desu."},{"jp":"分かりません、測ってもらえますか。","kana":"わかりません、 はかって もらえますか。","meaning":"I don't know, could you measure me?","romaji":"wakarimasen, hakatte moraemasuka."}],"note":"Staff may measure you. They will say 失礼します first.","level":"core","romaji":"saizu wa oikutsu desu ka."},{"id":"clothes-size-02","speaker":"you","jp":"普段は海外のLですが、日本のサイズはいくつですか。","kana":"ふだん は かいがい の エル です が、 にほん の サイズ は いくつ です か。","meaning":"I'm usually L abroad. What size is that in Japan?","replies":[{"jp":"LLかもしれません。","kana":"エルエル かもしれません。","meaning":"It might be LL.","romaji":"erueru kamoshiremasen."}],"note":"Japanese sizes often run small, so expect to go up a size.","level":"core","romaji":"fudan wa kaigai no eru desu ga, nihon no saizu wa ikutsu desu ka."},{"id":"clothes-size-03","speaker":"staff","jp":"LLサイズです。","kana":"エルエル サイズ です。","meaning":"It's LL size.","note":"LL is like XL and 3L is like XXL. Say エス, エム, エル, エルエル, スリーエル. フリーサイズ means one size, which may fit small.","level":"core","romaji":"erueru saizu desu."},{"id":"clothes-size-04","speaker":"staff","jp":"何号をお探しですか。","kana":"なんごう を おさがし です か。","meaning":"What number size are you looking for?","replies":[{"jp":"9号です。","kana":"きゅうごう です。","meaning":"Size 9.","romaji":"kyuugou desu."},{"jp":"7号です。","kana":"ななごう です。","meaning":"Size 7.","romaji":"nanagou desu."}],"note":"号 is the women's number size. Roughly 7 is S, 9 is M, 11 is L and 13 is LL, but brands differ.","level":"useful","romaji":"nangou o osagashi desu ka."},{"id":"clothes-size-05","speaker":"you","jp":"ウエストは何センチですか。","kana":"ウエスト は なん センチ です か。","meaning":"What is the waist in centimetres?","replies":[{"jp":"ウエストは68センチです。","kana":"ウエスト は ろくじゅうはち センチ です。","meaning":"The waist is 68 cm.","romaji":"uesuto wa rokujuuhachi senchi desu."}],"note":"Trousers may list the waist in cm. Measure your own waist before you shop.","level":"useful","romaji":"uesuto wa nan senchi desu ka."},{"id":"clothes-size-06","speaker":"you","jp":"丈が長いです。","kana":"たけ が ながい です。","meaning":"It's too long in length.","also_heard":[{"jp":"丈が短いです。","kana":"たけ が みじかい です。","meaning":"It's too short in length.","romaji":"take ga mijikai desu."}],"note":"丈 means length. 着丈 is overall length and 袖丈 is sleeve length. Use 長い for too long and 短い for too short.","level":"core","romaji":"take ga nagai desu."},{"id":"clothes-size-07","speaker":"you","jp":"ひとつ大きいサイズをお願いします。","kana":"ひとつ おおきい サイズ を おねがいします。","meaning":"One size up, please.","replies":[{"jp":"LLですね、お持ちします。","kana":"エルエル です ね、 おもちします。","meaning":"LL, I'll bring it.","romaji":"erueru desu ne, omochishimasu."}],"note":"The easiest and safest way to ask. Say ひとつ小さい for one size down.","level":"core","romaji":"hitotsu ookii saizu o onegaishimasu."},{"id":"clothes-size-08","speaker":"you","jp":"ちょっときついです。","kana":"ちょっと きつい です。","meaning":"It's a bit tight.","also_heard":[{"jp":"ゆるいです。","kana":"ゆるい です。","meaning":"It's loose.","romaji":"yurui desu."},{"jp":"ぶかぶかです。","kana":"ぶかぶか です。","meaning":"It's baggy.","romaji":"bukabuka desu."}],"replies":[{"jp":"では、大きいサイズをお持ちしますね。","kana":"では、 おおきい サイズ を おもちしますね。","meaning":"Then I'll bring a bigger size.","romaji":"dewa, ookii saizu o omochishimasune."}],"note":"きつい also works for shoes.","level":"core","romaji":"chotto kitsui desu."},{"id":"clothes-size-09","speaker":"you","jp":"肩がきついです。","kana":"かた が きつい です。","meaning":"The shoulders are tight.","also_heard":[{"jp":"袖が短いです。","kana":"そで が みじかい です。","meaning":"The sleeves are short.","romaji":"sode ga mijikai desu."},{"jp":"袖が長いです。","kana":"そで が ながい です。","meaning":"The sleeves are long.","romaji":"sode ga nagai desu."}],"note":"Shoulders and sleeves are the usual problem on jackets. Say which part does not fit.","level":"useful","romaji":"kata ga kitsui desu."},{"id":"clothes-size-10","speaker":"staff","jp":"ちょうどいいですね。","kana":"ちょうど いい です ね。","meaning":"That fits well.","also_heard":[{"jp":"よくお似合いです。","kana":"よく おにあい です。","meaning":"It suits you well.","romaji":"yoku oniai desu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"お似合いです is a sales line. It is nice to hear, but check the fit yourself.","level":"core","romaji":"choudo ii desu ne."},{"id":"clothes-size-11","speaker":"staff","jp":"ゆったりめのデザインです。","kana":"ゆったり め の デザイン です。","meaning":"This is a relaxed cut.","also_heard":[{"jp":"細身のデザインです。","kana":"ほそみ の デザイン です。","meaning":"This is a slim cut.","romaji":"hosomi no dezain desu."},{"jp":"オーバーサイズです。","kana":"オーバーサイズ です。","meaning":"It's an oversized cut.","romaji":"oobaasaizu desu."}],"replies":[{"jp":"普通のがいいです。","kana":"ふつう の が いい です。","meaning":"I'd prefer a regular fit.","romaji":"futsuu no ga ii desu."}],"note":"Oversized items are cut large on purpose. Do not size up without trying it on.","level":"useful","romaji":"yuttari me no dezain desu."},{"id":"clothes-size-12","speaker":"you","jp":"メンズのMとレディースのMは同じですか。","kana":"メンズ の エム と レディース の エム は おなじ です か。","meaning":"Is men's M the same as women's M?","replies":[{"jp":"同じです。","kana":"おなじ です。","meaning":"They're the same.","romaji":"onaji desu."},{"jp":"違います。","kana":"ちがいます。","meaning":"They're different.","romaji":"chigaimasu."}],"note":"Sizes differ by brand and cut. Check the measurements on the tag or ask staff.","level":"useful","romaji":"menzu no emu to rediisu no emu wa onaji desu ka."}]},{"title":"Fitting room","intro":"Fitting rooms follow a few local habits, such as taking off your shoes.","phrases":[{"id":"clothes-fit-01","speaker":"you","jp":"試着してもいいですか。","kana":"しちゃくしてもいいですか。","meaning":"May I try this on?","also_heard":[{"jp":"試着お願いします。","kana":"しちゃくおねがいします。","meaning":"I'd like to try it on, please.","romaji":"shichakuonegaishimasu."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"note":"Ask before you go into a fitting room. Staff usually show you to a free one.","level":"core","romaji":"shichakushitemoiidesuka."},{"id":"clothes-fit-02","speaker":"staff","jp":"何点お持ちですか。","kana":"なんてん おもちですか。","meaning":"How many items are you bringing in?","replies":[{"jp":"二つです。","kana":"ふたつ です。","meaning":"Two.","romaji":"futatsu desu."}],"note":"Some shops ask how many items you take into the room. Keep the count handy.","level":"core","romaji":"nanten omochidesuka."},{"id":"clothes-fit-03","speaker":"staff","jp":"空いている試着室へどうぞ。","kana":"あいている しちゃくしつ へ どうぞ。","meaning":"Please use any free fitting room.","also_heard":[{"jp":"順番にご案内します。","kana":"じゅんばん に ごあんないします。","meaning":"I'll show you in turn.","romaji":"junban ni goannaishimasu."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"At busy times you may have to wait for a room.","level":"useful","romaji":"aiteiru shichakushitsu e douzo."},{"id":"clothes-fit-04","speaker":"staff","jp":"靴をお脱ぎください。","kana":"くつ を おぬぎ ください。","meaning":"Please take off your shoes.","also_heard":[{"jp":"靴を脱いでお入りください。","kana":"くつ を ぬいで おはいり ください。","meaning":"Please take off your shoes and go in.","romaji":"kutsu o nuide ohairi kudasai."}],"note":"Most Japanese clothing shops ask you to remove your shoes in the fitting room. Leave them outside the room.","level":"core","romaji":"kutsu o onugi kudasai."},{"id":"clothes-fit-05","speaker":"staff","jp":"フェイスカバーをお使いください。","kana":"フェイスカバー を おつかい ください。","meaning":"Please use the face cover.","also_heard":[{"jp":"化粧が付かないようにお願いします。","kana":"けしょう が つかない よう に おねがいします。","meaning":"Please be careful that makeup does not stain the clothes.","romaji":"keshou ga tsukanai you ni onegaishimasu."}],"replies":[{"jp":"はい、使います。","kana":"はい、 つかいます。","meaning":"Yes, I'll use it.","romaji":"hai, tsukaimasu."}],"note":"A thin cover you pull over your head so makeup and sweat do not mark the clothes. Put it back on when you change.","level":"core","romaji":"feisukabaa o otsukai kudasai."},{"id":"clothes-fit-06","speaker":"staff","jp":"サイズはいかがですか。","kana":"サイズ は いかが です か。","meaning":"How is the size?","replies":[{"jp":"ちょうどいいです。","kana":"ちょうどいいです。","meaning":"It fits well.","romaji":"choudoiidesu."},{"jp":"少し小さいです。","kana":"すこし ちいさい です。","meaning":"It's a little small.","romaji":"sukoshi chiisai desu."},{"jp":"大きいです。","kana":"おおきい です。","meaning":"It's too big.","romaji":"ookii desu."}],"note":"Staff often ask from outside the curtain. Answer loudly enough for them to hear.","level":"core","romaji":"saizu wa ikaga desu ka."},{"id":"clothes-fit-07","speaker":"you","jp":"LLを持ってきてもらえますか。","kana":"エルエル を もってきてもらえますか。","meaning":"Could you bring me an LL?","replies":[{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"One moment, please.","romaji":"shoushou omachi kudasai."}],"note":"Call through the curtain. Keep it closed while you are changing.","level":"core","romaji":"erueru o mottekitemoraemasuka."},{"id":"clothes-fit-08","speaker":"you","jp":"ちょうどいいです。","kana":"ちょうど いい です。","meaning":"It fits well.","also_heard":[{"jp":"これをください。","kana":"これ を ください。","meaning":"I'll take this, please.","romaji":"kore o kudasai."}],"note":"これにします also means I'll take this one.","level":"core","romaji":"choudo ii desu."},{"id":"clothes-fit-09","speaker":"you","jp":"少し小さいので、やめておきます。","kana":"すこし ちいさい ので、 やめて おきます。","meaning":"It's a bit small, so I'll pass.","replies":[{"jp":"かしこまりました。","kana":"かしこまりました。","meaning":"Certainly.","romaji":"kashikomarimashita."}],"note":"A polite way to decline. You do not need to give a reason.","level":"core","romaji":"sukoshi chiisai node, yamete okimasu."},{"id":"clothes-fit-10","speaker":"you","jp":"ちょっと考えます。","kana":"ちょっと かんがえます。","meaning":"I'll think about it.","also_heard":[{"jp":"少し考えてもいいですか。","kana":"すこし かんがえて も いい です か。","meaning":"May I think about it for a bit?","romaji":"sukoshi kangaete mo ii desu ka."}],"replies":[{"jp":"では、お取り置きしましょうか。","kana":"では、 おとりおき しましょうか。","meaning":"Shall I hold it for you?","romaji":"dewa, otorioki shimashouka."}],"note":"Staff may offer to hold the item. Ask how long the hold lasts.","level":"core","romaji":"chotto kangaemasu."},{"id":"clothes-fit-11","speaker":"staff","jp":"いかがでしたか。","kana":"いかが でした か。","meaning":"How was it?","replies":[{"jp":"これをください。","kana":"これ を ください。","meaning":"I'll take this.","romaji":"kore o kudasai."},{"jp":"ありがとうございました。","kana":"ありがとうございました。","meaning":"Thank you, but no.","romaji":"arigatougozaimashita."}],"note":"A friendly check-in after a fitting. Answer with one of the replies.","level":"useful","romaji":"ikaga deshita ka."},{"id":"clothes-fit-12","speaker":"staff","jp":"そのままで大丈夫です。","kana":"そのままで だいじょうぶ です。","meaning":"You can leave them as they are.","replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"If staff say you can leave items, you do not have to hang them back up.","level":"useful","romaji":"sonomamade daijoubu desu."}]},{"title":"Shoes","intro":"Sizes in cm, width, slip-resistance and what staff do with the box.","phrases":[{"id":"clothes-shoe-01","speaker":"you","jp":"この靴を試してもいいですか。","kana":"この くつ を ためしても いい です か。","meaning":"May I try these shoes on?","also_heard":[{"jp":"履いてみてもいいですか。","kana":"はいてみても いい です か。","meaning":"May I put these on?","romaji":"haitemitemo ii desu ka."}],"replies":[{"jp":"サイズはおいくつですか。","kana":"サイズ は おいくつ です か。","meaning":"What size are you?","romaji":"saizu wa oikutsu desu ka."}],"note":"Staff may bring a pair from the back. Tell them your size in cm.","level":"core","romaji":"kono kutsu o tameshitemo ii desu ka."},{"id":"clothes-shoe-02","speaker":"you","jp":"27センチをお願いします。","kana":"にじゅうなな センチ を おねがいします。","meaning":"27 cm, please.","also_heard":[{"jp":"27.5はありますか。","kana":"にじゅうなな てん ごは あります か。","meaning":"Do you have 27.5?","romaji":"nijuunana ten goha arimasu ka."}],"replies":[{"jp":"少々お待ちください。","kana":"しょうしょう おまち ください。","meaning":"One moment, please.","romaji":"shoushou omachi kudasai."}],"note":"Shoe sizes are given in cm. Half sizes such as 27.5 exist, but not every model has them.","level":"core","romaji":"nijuunana senchi o onegaishimasu."},{"id":"clothes-shoe-03","speaker":"staff","jp":"足のサイズを測りましょうか。","kana":"あし の サイズ を はかりましょうか。","meaning":"Shall I measure your feet?","replies":[{"jp":"お願いします。","kana":"おねがいします。","meaning":"Yes, please.","romaji":"onegaishimasu."}],"note":"Useful if you do not know your size in cm.","level":"useful","romaji":"ashi no saizu o hakarimashouka."},{"id":"clothes-shoe-04","speaker":"you","jp":"幅は広いほうです。","kana":"はば は ひろい ほう です。","meaning":"My feet are on the wide side.","also_heard":[{"jp":"ワイドはありますか。","kana":"ワイド は あります か。","meaning":"Do you have a wide fit?","romaji":"waido wa arimasu ka."}],"replies":[{"jp":"幅広タイプもございます。","kana":"はばひろ タイプ も ございます。","meaning":"We also have a wide type.","romaji":"habahiro taipu mo gozaimasu."}],"note":"A wide fit may be marked ワイド or 幅広. Say so before you try the shoe on.","level":"core","romaji":"haba wa hiroi hou desu."},{"id":"clothes-shoe-05","speaker":"staff","jp":"反対側もどうぞ。","kana":"はんたいがわ も どうぞ。","meaning":"Please try the other one too.","also_heard":[{"jp":"もう片方も履いてみてください。","kana":"もう かたほう も はいてみて ください。","meaning":"Please try the other one on as well.","romaji":"mou katahou mo haitemite kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"note":"Feet can differ in size, so check both before you choose.","level":"useful","romaji":"hantaigawa mo douzo."},{"id":"clothes-shoe-06","speaker":"you","jp":"つま先がきついです。","kana":"つまさき が きつい です。","meaning":"My toes feel tight.","also_heard":[{"jp":"つま先が痛いです。","kana":"つまさき が いたい です。","meaning":"My toes hurt.","romaji":"tsumasaki ga itai desu."}],"replies":[{"jp":"では、大きいサイズをお持ちしますね。","kana":"では、 おおきい サイズ を おもちしますね。","meaning":"Then I'll bring a bigger size.","romaji":"dewa, ookii saizu o omochishimasune."}],"note":"Stand up and check with your heel pushed fully back. Your toes should have a little room.","level":"core","romaji":"tsumasaki ga kitsui desu."},{"id":"clothes-shoe-07","speaker":"you","jp":"かかとが脱げます。","kana":"かかと が ぬげます。","meaning":"My heel slips out.","also_heard":[{"jp":"かかとが浮きます。","kana":"かかと が うきます。","meaning":"My heel lifts up.","romaji":"kakato ga ukimasu."}],"replies":[{"jp":"中敷きを入れましょうか。","kana":"なかじき を いれましょうか。","meaning":"Shall I put in an insole?","romaji":"nakajiki o iremashouka."}],"note":"An insole (中敷き) can help a loose heel. Ask staff for one.","level":"core","romaji":"kakato ga nugemasu."},{"id":"clothes-shoe-08","speaker":"you","jp":"半サイズ大きいのはありますか。","kana":"はんサイズ おおきい の は あります か。","meaning":"Do you have half a size up?","also_heard":[{"jp":"半サイズ小さいのはありますか。","kana":"はんサイズ ちいさい の は あります か。","meaning":"Do you have half a size down?","romaji":"hansaizu chiisai no wa arimasu ka."}],"replies":[{"jp":"はい、確認しますね。","kana":"はい、 かくにんしますね。","meaning":"Yes, let me check.","romaji":"hai, kakuninshimasune."}],"note":"Half sizes are steps of 0.5 cm.","level":"core","romaji":"hansaizu ookii no wa arimasu ka."},{"id":"clothes-shoe-09","speaker":"you","jp":"滑りにくいですか。","kana":"すべりにくい です か。","meaning":"Are these slip-resistant?","also_heard":[{"jp":"雪道でも大丈夫ですか。","kana":"ゆきみち でも だいじょうぶ です か。","meaning":"Are they fine on snowy roads?","romaji":"yukimichi demo daijoubu desu ka."}],"replies":[{"jp":"防水です。","kana":"ぼうすい です。","meaning":"They're waterproof.","romaji":"bousui desu."},{"jp":"雪には向きません。","kana":"ゆき に は むきません。","meaning":"They aren't made for snow.","romaji":"yuki ni wa mukimasen."}],"note":"Ask what the shoe is made for before you rely on it in snow.","level":"useful","romaji":"suberinikui desu ka."},{"id":"clothes-shoe-10","speaker":"you","jp":"防水ですか。","kana":"ぼうすい です か。","meaning":"Is it waterproof?","replies":[{"jp":"はい、防水です。","kana":"はい、 ぼうすいです。","meaning":"Yes, it's waterproof.","romaji":"hai, bousuidesu."},{"jp":"撥水です。","kana":"はっすいです。","meaning":"It's water-repellent only.","romaji":"hassuidesu."}],"note":"撥水 only repels water and is not the same as 防水. Ask which one a shoe has.","level":"useful","romaji":"bousui desu ka."},{"id":"clothes-shoe-11","speaker":"you","jp":"靴べらはありますか。","kana":"くつべら は あります か。","meaning":"Do you have a shoehorn?","also_heard":[{"jp":"中敷きはありますか。","kana":"なかじき は あります か。","meaning":"Do you have insoles?","romaji":"nakajiki wa arimasu ka."}],"replies":[{"jp":"靴べらをどうぞ。","kana":"くつべら を どうぞ。","meaning":"Here's a shoehorn.","romaji":"kutsubera o douzo."}],"note":"Ask staff if you need one. It may not be on display.","level":"useful","romaji":"kutsubera wa arimasu ka."},{"id":"clothes-shoe-12","speaker":"staff","jp":"箱はご利用ですか。","kana":"はこ は ごりよう です か。","meaning":"Would you like the box?","replies":[{"jp":"箱は要りません。","kana":"はこ は いりません。","meaning":"No, I don't need the box.","romaji":"hako wa irimasen."},{"jp":"箱はお願いします。","kana":"はこ は おねがいします。","meaning":"Yes, please, with the box.","romaji":"hako wa onegaishimasu."}],"note":"A box is bulky to carry on a flight. Say いりません if you want to skip it.","level":"core","romaji":"hako wa goriyou desu ka."}]},{"title":"Alterations and details","intro":"Hemming, fabric, care and warmth.","phrases":[{"id":"clothes-alter-01","speaker":"you","jp":"裾上げはできますか。","kana":"すそあげ は できますか。","meaning":"Can you hem these trousers?","also_heard":[{"jp":"丈直しはできますか。","kana":"たけなおし は できますか。","meaning":"Can you alter the length?","romaji":"takenaoshi wa dekimasuka."}],"replies":[{"jp":"承ります。","kana":"うけたまわります。","meaning":"Yes, we can do that.","romaji":"uketamawarimasu."},{"jp":"無料です。","kana":"むりょう です。","meaning":"It's free.","romaji":"muryou desu."}],"note":"UNIQLO's machine hemming can often be done the same day, but GU trousers are not included. Rules and fees vary, so ask at the counter.","level":"core","romaji":"susoage wa dekimasuka."},{"id":"clothes-alter-02","speaker":"staff","jp":"当日お渡しできます。","kana":"とうじつ おわたし できます。","meaning":"We can hand it back the same day.","also_heard":[{"jp":"30分ほどでできます。","kana":"さんじゅっぷん ほど で できます。","meaning":"It takes about 30 minutes.","romaji":"sanjuppun hodo de dekimasu."}],"replies":[{"jp":"明日の夕方取りに来ます。","kana":"あしたの ゆうがた とりに きます。","meaning":"I'll pick it up tomorrow evening.","romaji":"ashitano yuugata torini kimasu."}],"note":"Same-day can slip when the shop is busy. Check holidays and your departure date before you leave it.","level":"core","romaji":"toujitsu owatashi dekimasu."},{"id":"clothes-alter-03","speaker":"staff","jp":"裾上げは無料です。","kana":"すそあげ は むりょう です。","meaning":"Hemming is free.","also_heard":[{"jp":"有料になります。","kana":"ゆうりょう に なります。","meaning":"There's a charge.","romaji":"yuuryou ni narimasu."}],"replies":[{"jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}],"note":"Free or paid can depend on the item's price, so ask before you hand the trousers over.","level":"core","romaji":"susoage wa muryou desu."},{"id":"clothes-alter-04","speaker":"staff","jp":"仕上がりは明日の夕方です。","kana":"しあがり は あしたの ゆうがた です。","meaning":"It will be ready tomorrow evening.","also_heard":[{"jp":"お引き取りはいつ頃になりますか。","kana":"おひきとり は いつごろ に なりますか。","meaning":"When will you collect it?","romaji":"ohikitori wa itsugoro ni narimasuka."}],"replies":[{"jp":"明日の夕方に取りに来ます。","kana":"あしたの ゆうがた に とりに きます。","meaning":"I'll collect it tomorrow evening.","romaji":"ashitano yuugata ni torini kimasu."}],"note":"Keep any ticket or receipt they give you, so you can collect the item.","level":"useful","romaji":"shiagari wa ashitano yuugata desu."},{"id":"clothes-alter-05","speaker":"staff","jp":"今の丈のままでよろしいですか。","kana":"いまの たけ の まま で よろしい です か。","meaning":"Is this length OK?","also_heard":[{"jp":"ピンで留めますね。","kana":"ピン で とめますね。","meaning":"I'll pin it.","romaji":"pin de tomemasune."}],"replies":[{"jp":"これで大丈夫です。","kana":"これで だいじょうぶ です。","meaning":"This is fine.","romaji":"korede daijoubu desu."},{"jp":"もう少し短くしてください。","kana":"もう すこし みじかく して ください。","meaning":"Please make them a bit shorter.","romaji":"mou sukoshi mijikaku shite kudasai."}],"note":"They pin the hem to mark the length. Say 短く or 長く before they pin.","level":"useful","romaji":"imano take no mama de yoroshii desu ka."},{"id":"clothes-alter-06","speaker":"you","jp":"素材は何ですか。","kana":"そざい は なん です か。","meaning":"What is it made of?","replies":[{"jp":"綿100%です。","kana":"めん ひゃく パーセント です。","meaning":"It's 100% cotton.","romaji":"men hyaku paasento desu."},{"jp":"ウールが混ざっています。","kana":"ウール が まざっています。","meaning":"It has some wool mixed in.","romaji":"uuru ga mazatteimasu."}],"note":"Tag words: 綿 is cotton, 毛 is wool, ポリエステル is polyester, 革 is leather, ダウン is down.","level":"core","romaji":"sozai wa nan desu ka."},{"id":"clothes-alter-07","speaker":"you","jp":"家で洗えますか。","kana":"いえ で あらえますか。","meaning":"Can I wash it at home?","replies":[{"jp":"洗えます。","kana":"あらえます。","meaning":"Yes, you can wash it.","romaji":"araemasu."},{"jp":"クリーニングが必要です。","kana":"クリーニング が ひつよう です。","meaning":"It needs dry cleaning.","romaji":"kuriiningu ga hitsuyou desu."}],"note":"Look for the small care symbols on the label. A tub shape means machine washing, and a crossed-out symbol means that treatment is not allowed.","level":"core","romaji":"ie de araemasuka."},{"id":"clothes-alter-08","speaker":"you","jp":"日本製ですか。","kana":"にほんせい です か。","meaning":"Is it made in Japan?","replies":[{"jp":"日本製です。","kana":"にほんせい です。","meaning":"Yes, it's made in Japan.","romaji":"nihonsei desu."},{"jp":"中国製です。","kana":"ちゅうごくせい です。","meaning":"It's made in China.","romaji":"chuugokusei desu."}],"note":"The label shows the country, such as 日本製 for Japan or 中国製 for China.","level":"useful","romaji":"nihonsei desu ka."},{"id":"clothes-alter-09","speaker":"you","jp":"暖かいですか。","kana":"あたたかい です か。","meaning":"Is it warm?","replies":[{"jp":"すごく暖かいです。","kana":"すごくあたたかいです。","meaning":"It's very warm.","romaji":"sugokuatatakaidesu."},{"jp":"薄いですが暖かいです。","kana":"うすい です が あたたかい です。","meaning":"It's thin, but warm.","romaji":"usui desu ga atatakai desu."}],"note":"薄手 means thin, 厚手 means thick, and 保温 means it keeps heat in.","level":"core","romaji":"atatakai desu ka."},{"id":"clothes-alter-10","speaker":"you","jp":"暖かいインナーはありますか。","kana":"あたたかい インナー は あります か。","meaning":"Do you have warm inner wear?","also_heard":[{"jp":"肌着はありますか。","kana":"はだぎ は あります か。","meaning":"Do you have undershirts?","romaji":"hadagi wa arimasu ka."}],"replies":[{"jp":"こちらです。","kana":"こちら です。","meaning":"It's this way.","romaji":"kochira desu."}],"note":"Warm base layers are sold under many brand names. Ask staff to show you the type you want.","level":"useful","romaji":"atatakai innaa wa arimasu ka."},{"id":"clothes-alter-11","speaker":"you","jp":"洗うと縮みますか。","kana":"あらう と ちぢみますか。","meaning":"Does it shrink when washed?","also_heard":[{"jp":"色落ちしますか。","kana":"いろおち しますか。","meaning":"Does the colour fade?","romaji":"iroochi shimasuka."}],"replies":[{"jp":"洗い方の表示を見てください。","kana":"あらいかた の ひょうじ を みて ください。","meaning":"Please check the care label.","romaji":"araikata no hyouji o mite kudasai."}],"note":"The care label is the first place to look. It shows how to wash the item.","level":"useful","romaji":"arau to chijimimasuka."},{"id":"clothes-alter-12","speaker":"you","jp":"ダウンですか。","kana":"ダウン です か。","meaning":"Is it down?","also_heard":[{"jp":"羽毛ですか。","kana":"うもう です か。","meaning":"Is it feather down?","romaji":"umou desu ka."}],"replies":[{"jp":"はい、ダウンです。","kana":"はい、 ダウンです。","meaning":"Yes, it's down.","romaji":"hai, daundesu."},{"jp":"フェザーです。","kana":"フェザー です。","meaning":"It's feathers.","romaji":"fezaa desu."}],"note":"The tag lists the down and feather mix. Check the percentages before you buy.","level":"useful","romaji":"daun desu ka."}]},{"title":"Price, sales and deciding","intro":"New Year sale words, lucky bags, holds and return rules.","phrases":[{"id":"clothes-price-01","speaker":"you","jp":"これはセール対象ですか。","kana":"これ は セール たいしょう です か。","meaning":"Is this part of the sale?","replies":[{"jp":"対象です。","kana":"たいしょう です。","meaning":"Yes, it's in the sale.","romaji":"taishou desu."},{"jp":"対象外です。","kana":"たいしょうがい です。","meaning":"No, it's not in the sale.","romaji":"taishougai desu."}],"note":"対象外 means not included in the sale.","level":"core","romaji":"kore wa seeru taishou desu ka."},{"id":"clothes-price-02","speaker":"staff","jp":"レジにて20%オフです。","kana":"レジ にて にじゅっ パーセント オフ です。","meaning":"The 20% discount is taken at the register.","replies":[{"jp":"分かりました。","kana":"わかりました。","meaning":"Got it.","romaji":"wakarimashita."}],"note":"The shelf price is not always the final price. Check the total at the till.","level":"core","romaji":"reji nite niju paasento ofu desu."},{"id":"clothes-price-03","speaker":"you","jp":"税込でいくらですか。","kana":"ぜいこみ で いくら です か。","meaning":"How much is it including tax?","replies":[{"jp":"税込で五千円です。","kana":"ぜいこみ で ごせんえん です。","meaning":"It's 5,000 yen including tax.","romaji":"zeikomi de gosen'en desu."}],"note":"税込 means tax included and 税抜 means before tax. 本体価格 is the price before tax.","level":"core","romaji":"zeikomi de ikura desu ka."},{"id":"clothes-price-04","speaker":"staff","jp":"2点お買い上げで10%オフです。","kana":"にてん おかいあげ で じゅっ パーセント オフ です。","meaning":"Ten percent off when you buy two.","also_heard":[{"jp":"2点目は半額です。","kana":"にてんめ は はんがく です。","meaning":"The second one is half price.","romaji":"nitenme wa hangaku desu."}],"replies":[{"jp":"じゃあ、2点お願いします。","kana":"じゃあ、 にてん おねがいします。","meaning":"Then I'll take two, please.","romaji":"jaa, niten onegaishimasu."}],"note":"Ask staff to explain the deal if you are not sure how it works.","level":"useful","romaji":"niten okaiage de ju paasento ofu desu."},{"id":"clothes-price-05","speaker":"you","jp":"もう少し安くなりませんか。","kana":"もう すこし やすく なりませんか。","meaning":"Could it be a bit cheaper?","replies":[{"jp":"申し訳ありません、これ以上は難しいです。","kana":"もうしわけありません、 これ いじょう は むずかしい です。","meaning":"I'm sorry, we can't go any lower.","romaji":"moushiwakearimasen, kore ijou wa muzukashii desu."}],"note":"Haggling is not normal in most Japanese shops, so expect a polite no.","level":"useful","romaji":"mou sukoshi yasuku narimasenka."},{"id":"clothes-price-06","speaker":"you","jp":"福袋はありますか。","kana":"ふくぶくろ は あります か。","meaning":"Do you have lucky bags?","replies":[{"jp":"初売りで販売します。","kana":"はつうり で はんばいします。","meaning":"We sell them at the New Year sale.","romaji":"hatsuuri de hanbaishimasu."},{"jp":"完売しました。","kana":"かんばいしました。","meaning":"They have all sold out.","romaji":"kanbaishimashita."}],"note":"Lucky bags (福袋) are sold at New Year, sometimes by lottery or advance reservation. Check each shop's method.","level":"core","romaji":"fukubukuro wa arimasu ka."},{"id":"clothes-price-07","speaker":"you","jp":"福袋のサイズは選べますか。","kana":"ふくぶくろ の サイズ は えらべますか。","meaning":"Can I choose the size in a lucky bag?","also_heard":[{"jp":"中身は何ですか。","kana":"なかみ は なん です か。","meaning":"What is inside?","romaji":"nakami wa nan desu ka."}],"replies":[{"jp":"選べません。","kana":"えらべません。","meaning":"No, you can't choose.","romaji":"erabemasen."},{"jp":"中身は分かりません。","kana":"なかみ は わかりません。","meaning":"The contents are not shown.","romaji":"nakami wa wakarimasen."}],"note":"Many listings show how much of the contents is revealed. Check the sign before you queue.","level":"core","romaji":"fukubukuro no saizu wa erabemasuka."},{"id":"clothes-price-08","speaker":"you","jp":"この商品は免税の対象ですか。","kana":"この しょうひん は めんぜい の たいしょう です か。","meaning":"Is this item eligible for tax-free?","replies":[{"jp":"免税カウンターへどうぞ。","kana":"めんぜい カウンター へ どうぞ。","meaning":"Please go to the tax-free counter.","romaji":"menzei kauntaa e douzo."}],"note":"This only asks about eligibility. The tax-free steps are in the Souvenirs topic.","level":"useful","romaji":"kono shouhin wa menzei no taishou desu ka."},{"id":"clothes-price-09","speaker":"you","jp":"取り置きできますか。","kana":"とりおき できますか。","meaning":"Can you hold this for me?","replies":[{"jp":"当日のみです。","kana":"とうじつ のみ です。","meaning":"Only for today.","romaji":"toujitsu nomi desu."}],"note":"Not every item can be held. Ask before you leave it.","level":"useful","romaji":"torioki dekimasuka."},{"id":"clothes-price-10","speaker":"staff","jp":"セール品は返品できません。","kana":"セールひん は へんぴん できません。","meaning":"Sale items cannot be returned.","also_heard":[{"jp":"返品交換不可です。","kana":"へんぴん こうかん ふか です。","meaning":"No returns or exchanges.","romaji":"henpin koukan fuka desu."}],"replies":[{"jp":"分かりました。","kana":"わかりました。","meaning":"Understood.","romaji":"wakarimashita."}],"note":"Ask about returns before you pay, especially for sale items. Keep your receipt.","level":"core","romaji":"seeruhin wa henpin dekimasen."},{"id":"clothes-price-11","speaker":"you","jp":"返品や交換はできますか。","kana":"へんぴん や こうかん は できますか。","meaning":"Can I return or exchange it?","replies":[{"jp":"店によって違います。","kana":"みせ に よって ちがいます。","meaning":"It depends on the shop.","romaji":"mise ni yotte chigaimasu."}],"note":"Rules vary by shop. Keep your receipt and ask about the time limit before you pay.","level":"useful","romaji":"henpin ya koukan wa dekimasuka."},{"id":"clothes-price-12","speaker":"you","jp":"いつからセールですか。","kana":"いつ から セール です か。","meaning":"When does the sale start?","also_heard":[{"jp":"値下げはありますか。","kana":"ねさげ は あります か。","meaning":"Are there any markdowns?","romaji":"nesage wa arimasu ka."}],"replies":[{"jp":"年明けからです。","kana":"としあけ から です。","meaning":"It starts after New Year.","romaji":"toshiake kara desu."}],"note":"New Year sale dates and opening hours differ by shop. Check the shop's notice or ask staff.","level":"useful","romaji":"itsu kara seeru desu ka."}]},{"title":"At the register","intro":"The questions you will hear at every till, and how to leave wearing your purchase.","phrases":[{"id":"clothes-till-01","speaker":"staff","jp":"ポイントカードはお持ちですか。","kana":"ポイントカード は おもち です か。","meaning":"Do you have a point card?","also_heard":[{"jp":"会員カードはお持ちですか。","kana":"かいいん カード は おもち です か。","meaning":"Do you have a member card?","romaji":"kaiin kaado wa omochi desu ka."}],"replies":[{"jp":"持っていません。","kana":"もっていません。","meaning":"No, I don't.","romaji":"motteimasen."},{"jp":"大丈夫です。","kana":"だいじょうぶです。","meaning":"No thanks, that's fine.","romaji":"daijoubudesu."}],"note":"They ask this almost every time. A short no is fine.","level":"core","romaji":"pointokaado wa omochi desu ka."},{"id":"clothes-till-02","speaker":"staff","jp":"袋はご利用ですか。","kana":"ふくろ は ごりよう です か。","meaning":"Do you need a bag?","also_heard":[{"jp":"紙袋は有料です。","kana":"かみぶくろ は ゆうりょう です。","meaning":"Paper bags cost extra.","romaji":"kamibukuro wa yuuryou desu."}],"replies":[{"jp":"お願いします。","kana":"おねがいします。","meaning":"Yes, please.","romaji":"onegaishimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶです。","meaning":"No, I'm fine.","romaji":"daijoubudesu."}],"note":"Bags often cost extra, and the price is shown at the till. Say 大丈夫です if you brought your own.","level":"core","romaji":"fukuro wa goriyou desu ka."},{"id":"clothes-till-03","speaker":"staff","jp":"ご自宅用ですか、プレゼント用ですか。","kana":"ごじたくよう です か、 プレゼント よう です か。","meaning":"Is it for home or a present?","replies":[{"jp":"自宅用です。","kana":"じたくよう です。","meaning":"It's for home.","romaji":"jitakuyou desu."},{"jp":"プレゼントです。","kana":"プレゼント です。","meaning":"It's a present.","romaji":"purezento desu."}],"note":"If it is a gift, they may offer gift wrap. Gift wrap details are in the Souvenirs topic.","level":"core","romaji":"gojitakuyou desu ka, purezento you desu ka."},{"id":"clothes-till-04","speaker":"you","jp":"このまま着て帰ります。","kana":"この まま きて かえります。","meaning":"I'll wear it home.","replies":[{"jp":"タグをお切りします。","kana":"タグ を おきります。","meaning":"I'll cut off the tags.","romaji":"tagu o okirimasu."}],"note":"Say this before you pay, so staff know to remove the tags.","level":"core","romaji":"kono mama kite kaerimasu."},{"id":"clothes-till-05","speaker":"you","jp":"タグを切ってください。","kana":"タグ を きって ください。","meaning":"Please cut off the tags.","also_heard":[{"jp":"タグを外してもらえますか。","kana":"タグ を はずして もらえますか。","meaning":"Could you remove the tag?","romaji":"tagu o hazushite moraemasuka."}],"replies":[{"jp":"失礼します。","kana":"しつれいします。","meaning":"Excuse me.","romaji":"shitsureishimasu."}],"note":"Ask before you pay so the tags can be removed at the till.","level":"core","romaji":"tagu o kitte kudasai."},{"id":"clothes-till-06","speaker":"staff","jp":"ハンガーは必要ですか。","kana":"ハンガー は ひつよう です か。","meaning":"Do you need a hanger?","replies":[{"jp":"要りません。","kana":"いりません。","meaning":"No, I don't need one.","romaji":"irimasen."}],"note":"Just say いりません if you do not want one.","level":"useful","romaji":"hangaa wa hitsuyou desu ka."},{"id":"clothes-till-07","speaker":"staff","jp":"袋を分けますか。","kana":"ふくろ を わけますか。","meaning":"Shall I put them in separate bags?","replies":[{"jp":"一緒で大丈夫です。","kana":"いっしょ で だいじょうぶです。","meaning":"Together is fine.","romaji":"issho de daijoubudesu."},{"jp":"分けてください。","kana":"わけて ください。","meaning":"Please separate them.","romaji":"wakete kudasai."}],"note":"Say 一緒で if one bag is fine with you.","level":"useful","romaji":"fukuro o wakemasuka."},{"id":"clothes-till-08","speaker":"staff","jp":"免税カウンターは4階です。","kana":"めんぜい カウンター は よんがい です。","meaning":"The tax-free counter is on the 4th floor.","replies":[{"jp":"パスポートを持っています。","kana":"パスポート を もっています。","meaning":"I have my passport.","romaji":"pasupooto o motteimasu."}],"note":"These are only directions. The tax-free steps are in the Souvenirs topic.","level":"useful","romaji":"menzei kauntaa wa yongai desu."},{"id":"clothes-till-09","speaker":"staff","jp":"パスポートを拝見してもよろしいですか。","kana":"パスポート を はいけん して も よろしい です か。","meaning":"May I see your passport?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you go.","romaji":"hai, douzo."}],"note":"Have your passport ready if you are buying tax-free items.","level":"listen-only","romaji":"pasupooto o haiken shite mo yoroshii desu ka."},{"id":"clothes-till-10","speaker":"staff","jp":"かごをこちらに置いてください。","kana":"かご を こちら に おいて ください。","meaning":"Please put your basket here.","note":"At self-checkout in the big chains, the machine reads every item in the basket at once. Check the list on the screen, then pay.","level":"core","romaji":"kago o kochira ni oite kudasai."},{"id":"clothes-till-11","speaker":"staff","jp":"お会計は5,000円です。","kana":"おかいけい は ごせんえん です。","meaning":"Your total is 5,000 yen.","note":"Check the total on the screen or at the till before you pay.","level":"listen-only","romaji":"okaikei wa gosen'en desu."},{"id":"clothes-till-12","speaker":"staff","jp":"レシートはご利用ですか。","kana":"レシート は ごりよう です か。","meaning":"Do you need a receipt?","replies":[{"jp":"お願いします。","kana":"おねがいします。","meaning":"Yes, please.","romaji":"onegaishimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶです。","meaning":"No, that's fine.","romaji":"daijoubudesu."}],"note":"Keep the receipt for returns and for tax-free.","level":"useful","romaji":"reshiito wa goriyou desu ka."}]}],"dialogues":[{"title":"A coat, one size bigger","lines":[{"speaker":"staff","jp":"何かお探しですか。","kana":"なに か おさがし です か。","meaning":"Are you looking for something?","romaji":"nani ka osagashi desu ka."},{"speaker":"you","jp":"コートを探しています。","kana":"コート を さがしています。","meaning":"I'm looking for a coat.","romaji":"kooto o sagashiteimasu."},{"speaker":"staff","jp":"こちらです。よろしければご試着もできますので、お声がけください。","kana":"こちら です。 よろしければ ごしちゃく も できますので、 おこえがけ ください。","meaning":"This way. If you like, you can try things on. Just call me.","romaji":"kochira desu. yoroshikereba goshichaku mo dekimasunode, okoegake kudasai."},{"speaker":"you","jp":"試着をお願いします。","kana":"しちゃく を おねがいします。","meaning":"I'd like to try it on, please.","romaji":"shichaku o onegaishimasu."},{"speaker":"staff","jp":"サイズはいかがですか。","kana":"サイズ は いかが です か。","meaning":"How is the size?","romaji":"saizu wa ikaga desu ka."},{"speaker":"you","jp":"ちょっと小さいです。一つ大きいサイズをお願いします。","kana":"ちょっと ちいさい です。 ひとつ おおきい サイズ を おねがいします。","meaning":"It's a bit small. One size bigger, please.","romaji":"chotto chiisai desu. hitotsu ookii saizu o onegaishimasu."},{"speaker":"staff","jp":"少々お待ちください。在庫を確認してまいります。","kana":"しょうしょう おまち ください。 ざいこ を かくにん して まいります。","meaning":"Please wait a moment. I'll check the stock.","romaji":"shoushou omachi kudasai. zaiko o kakunin shite mairimasu."},{"speaker":"you","jp":"ちょうどいいです。これにします。","kana":"ちょうど いい です。 これ に します。","meaning":"That fits well. I'll take this one.","romaji":"choudo ii desu. kore ni shimasu."}]},{"title":"Shoes, half a size and a wide fit","lines":[{"speaker":"you","jp":"この靴を試してもいいですか。","kana":"この くつ を ためしても いい です か。","meaning":"May I try these shoes on?","romaji":"kono kutsu o tameshitemo ii desu ka."},{"speaker":"staff","jp":"サイズはおいくつですか。","kana":"サイズ は おいくつ です か。","meaning":"What size are you?","romaji":"saizu wa oikutsu desu ka."},{"speaker":"you","jp":"27.5はありますか。幅は広いほうです。","kana":"にじゅうなな てん ごは あります か。 はば は ひろい ほう です。","meaning":"Do you have 27.5? My feet are on the wide side.","romaji":"nijuunana ten goha arimasu ka. haba wa hiroi hou desu."},{"speaker":"staff","jp":"確認してまいります。","kana":"かくにん して まいります。","meaning":"I'll go and check.","romaji":"kakunin shite mairimasu."},{"speaker":"you","jp":"つま先が少しきついです。","kana":"つまさき が すこし きつい です。","meaning":"My toes feel a bit tight.","romaji":"tsumasaki ga sukoshi kitsui desu."},{"speaker":"staff","jp":"反対側もどうぞ。ワイドもございます。","kana":"はんたいがわ も どうぞ。 ワイド も ございます。","meaning":"Please try the other one. We also have wide sizes.","romaji":"hantaiga ng","romaji":"nagai"},{"jp":"短い","kana":"みじかい","meaning":"short","romaji":"mijikai"},{"jp":"ちょうどいい","kana":"ちょうどいい","meaning":"just right","romaji":"choudoii"},{"jp":"細身","kana":"ほそみ","meaning":"slim cut","romaji":"hosomi"},{"jp":"ゆったり","kana":"ゆったり","meaning":"relaxed, roomy","romaji":"yuttari"},{"jp":"薄い","kana":"うすい","meaning":"thin","romaji":"usui"},{"jp":"厚い","kana":"あつい","meaning":"thick","romaji":"atsui"}]},{"title":"Materials","items":[{"jp":"綿","kana":"めん","meaning":"cotton","romaji":"men"},{"jp":"ウール","kana":"ウール","meaning":"wool","romaji":"uuru"},{"jp":"ダウン","kana":"ダウン","meaning":"down","romaji":"daun"},{"jp":"ポリエステル","kana":"ポリエステル","meaning":"polyester","romaji":"poriesuteru"},{"jp":"革","kana":"かわ","meaning":"leather","romaji":"kawa"},{"jp":"ナイロン","kana":"ナイロン","meaning":"nylon","romaji":"nairon"},{"jp":"カシミヤ","kana":"カシミヤ","meaning":"cashmere","romaji":"kashimiya"},{"jp":"麻","kana":"あさ","meaning":"linen or hemp","romaji":"asa"}]}],"_num":"06"},{"slug":"souvenirs","title":"Souvenirs and shopping","title_jp":"お土産","summary":"Souvenirs, gift wrapping, tax-free, electronics, returns","situations":[{"title":"Souvenir shops and station gift shops","intro":"Choosing boxed sweets and local specialities at station and airport shops.","phrases":[{"id":"souvenirs-shop-01","speaker":"you","jp":"これは何個入りですか。","kana":"これ は なんこいり です か。","meaning":"How many pieces are in this box?","also_heard":[{"jp":"何枚入りですか。","kana":"なんまいいり です か。","meaning":"How many pieces? (for flat items like crackers)","romaji":"nanmaiiri desu ka."}],"replies":[{"jp":"十二個入りです。","kana":"じゅうにこいり です。","meaning":"It is a box of 12.","romaji":"juunikoiri desu."},{"jp":"八個入りと十六個入りがあります。","kana":"はっこいり と じゅうろくこいり が あります。","meaning":"We have boxes of 8 and of 16.","romaji":"hakkoiri to juurokukoiri ga arimasu."}],"note":"入り means it contains. Use 個 for boxed sweets, 枚 for flat items like crackers, and 本 for long ones.","level":"core","romaji":"kore wa nankoiri desu ka."},{"id":"souvenirs-shop-02","speaker":"you","jp":"一つずつ包装されていますか。","kana":"ひとつずつ ほうそう されて います か。","meaning":"Is each one wrapped separately?","also_heard":[{"jp":"個包装ですか。","kana":"こほうそう です か。","meaning":"Are they individually wrapped?","romaji":"kohousou desu ka."},{"jp":"一個ずつ入っていますか。","kana":"いっこずつ はいって います か。","meaning":"Is each one packed separately?","romaji":"ikkozutsu haitte imasu ka."}],"replies":[{"jp":"はい、個包装になっています。","kana":"はい、 こほうそう に なって います。","meaning":"Yes, each one is individually wrapped.","romaji":"hai, kohousou ni natte imasu."},{"jp":"いいえ、箱に直接入っています。","kana":"いいえ、 はこ に ちょくせつ はいって います。","meaning":"No, they are packed loose in the box.","romaji":"iie, hako ni chokusetsu haitte imasu."}],"note":"個包装 means each piece has its own wrapper. Useful for sharing at an office or with family.","level":"core","romaji":"hitotsuzutsu housou sarete imasu ka."},{"id":"souvenirs-shop-03","speaker":"you","jp":"日持ちしますか。","kana":"ひもち します か。","meaning":"Does it keep well?","also_heard":[{"jp":"賞味期限はいつまでですか。","kana":"しょうみきげん は いつまで です か。","meaning":"Until when is the best-before date?","romaji":"shoumikigen wa itsumade desu ka."},{"jp":"どのくらい持ちますか。","kana":"どのくらい もちます か。","meaning":"How long does it last?","romaji":"donokurai mochimasu ka."}],"replies":[{"jp":"長く日持ちします。","kana":"ながく ひもち します。","meaning":"It keeps for a long time.","romaji":"nagaku himochi shimasu."},{"jp":"当日中にお召し上がりください。","kana":"とうじつちゅう に おめしあがり ください。","meaning":"Please eat it the same day.","romaji":"toujitsuchuu ni omeshiagari kudasai."}],"note":"賞味期限 is the best-before date for dry snacks. 消費期限 is the use-by date for fresh cakes and pudding. Do not mix them up.","level":"core","romaji":"himochi shimasu ka."},{"id":"souvenirs-shop-04","speaker":"staff","jp":"こちらは要冷蔵になります。","kana":"こちら は ようれいぞう に なります。","meaning":"This one needs to be kept refrigerated.","replies":[{"jp":"わかりました。","kana":"わかりました。","meaning":"I understand.","romaji":"wakarimashita."},{"jp":"常温で大丈夫ですか。","kana":"じょうおん で だいじょうぶ です か。","meaning":"Is room temperature fine?","romaji":"jouon de daijoubu desu ka."}],"note":"要冷蔵 means keep it cold. 常温 means room temperature. Ask if it can stay out for your trip.","level":"core","romaji":"kochira wa youreizou ni narimasu."},{"id":"souvenirs-shop-05","speaker":"you","jp":"飛行機に持ち込めますか。","kana":"ひこうき に もちこめます か。","meaning":"Can I take it on the plane?","also_heard":[{"jp":"機内に持ち込めますか。","kana":"きない に もちこめます か。","meaning":"Can I take it into the cabin?","romaji":"kinai ni mochikomemasu ka."},{"jp":"預け荷物に入れても大丈夫ですか。","kana":"あずけにもつ に いれても だいじょうぶ です か。","meaning":"Is it OK in checked luggage?","romaji":"azukenimotsu ni iretemo daijoubu desu ka."}],"replies":[{"jp":"大丈夫ですよ。","kana":"だいじょうぶ です よ。","meaning":"That is fine.","romaji":"daijoubu desu yo."},{"jp":"液体扱いになることがあるので、航空会社にご確認ください。","kana":"えきたい あつかい に なる こと が ある ので、 こうくうがいしゃ に ごかくにん ください。","meaning":"It may count as a liquid, so please check with the airline.","romaji":"ekitai atsukai ni naru koto ga aru node, koukuugaisha ni gokakunin kudasai."}],"note":"Carry-on liquids are limited to 100 ml or 100 g each, in one 1 litre bag. Jelly or pudding may count, so check with your airline.","level":"core","romaji":"hikouki ni mochikomemasu ka."},{"id":"souvenirs-shop-06","speaker":"you","jp":"一番人気はどれですか。","kana":"いちばん にんき は どれ です か。","meaning":"Which one is the most popular?","also_heard":[{"jp":"人気No.1はどれですか。","kana":"にんき ナンバーワン は どれ です か。","meaning":"Which is number one in popularity?","romaji":"ninki nanbaawan wa dore desu ka."},{"jp":"おすすめはどれですか。","kana":"おすすめ は どれ です か。","meaning":"Which one do you recommend?","romaji":"osusume wa dore desu ka."}],"replies":[{"jp":"こちらが一番人気です。","kana":"こちら が いちばん にんき です。","meaning":"This one is the most popular.","romaji":"kochira ga ichiban ninki desu."},{"jp":"定番はこちら、新商品はこちらです。","kana":"ていばん は こちら、 しんしょうひん は こちら です。","meaning":"This is the classic, and this is the new one.","romaji":"teiban wa kochira, shinshouhin wa kochira desu."}],"note":"定番 means the classic standard item. Classics are a safe choice for gifts.","level":"core","romaji":"ichiban ninki wa dore desu ka."},{"id":"souvenirs-shop-07","speaker":"you","jp":"この地域の名物はどれですか。","kana":"この ちいき の めいぶつ は どれ です か。","meaning":"Which one is the local speciality?","also_heard":[{"jp":"ここだけの限定はありますか。","kana":"ここ だけ の げんてい は あります か。","meaning":"Is there anything limited to here?","romaji":"koko dake no gentei wa arimasu ka."}],"replies":[{"jp":"こちらがご当地の名物です。","kana":"こちら が ごとうち の めいぶつ です。","meaning":"This is the local speciality.","romaji":"kochira ga gotouchi no meibutsu desu."},{"jp":"駅限定のものはこちらです。","kana":"えき げんてい の もの は こちら です。","meaning":"The station-only one is here.","romaji":"eki gentei no mono wa kochira desu."}],"note":"名物 is a local speciality and ご当地 means local to the area. 限定 means sold only here or for a limited time.","level":"core","romaji":"kono chiiki no meibutsu wa dore desu ka."},{"id":"souvenirs-shop-08","speaker":"you","jp":"あまり甘くないのはどれですか。","kana":"あまり あまく ない の は どれ です か。","meaning":"Which one is not too sweet?","also_heard":[{"jp":"甘さ控えめのものはありますか。","kana":"あまさ ひかえめ の もの は あります か。","meaning":"Do you have a lightly sweetened one?","romaji":"amasa hikaeme no mono wa arimasu ka."},{"jp":"しょっぱい系はありますか。","kana":"しょっぱい けい は あります か。","meaning":"Do you have something savoury?","romaji":"shoppai kei wa arimasu ka."}],"replies":[{"jp":"こちらは甘さ控えめです。","kana":"こちら は あまさ ひかえめ です。","meaning":"This one is lightly sweetened.","romaji":"kochira wa amasa hikaeme desu."},{"jp":"抹茶味はそんなに甘くないですよ。","kana":"まっちゃあじ は そんなに あまく ない です よ。","meaning":"The green tea flavour is not that sweet.","romaji":"matchaaji wa sonnani amaku nai desu yo."}],"note":"甘さ控えめ means lightly sweetened. 抹茶 is powdered green tea and is often less sweet.","level":"core","romaji":"amari amaku nai no wa dore desu ka."},{"id":"souvenirs-shop-09","speaker":"staff","jp":"よかったら、試食どうぞ。","kana":"よかったら、 ししょく どうぞ。","meaning":"Please try a sample if you like.","also_heard":[{"jp":"試食できますよ。","kana":"ししょく できます よ。","meaning":"You can try a sample.","romaji":"shishoku dekimasu yo."},{"jp":"お味見どうぞ。","kana":"おあじみ どうぞ。","meaning":"Please have a taste.","romaji":"oajimi douzo."}],"replies":[{"jp":"ありがとうございます、いただきます。","kana":"ありがとう ございます、 いただきます。","meaning":"Thank you, I will have one.","romaji":"arigatou gozaimasu, itadakimasu."},{"jp":"けっこうです、ありがとうございます。","kana":"けっこう です、 ありがとう ございます。","meaning":"No thanks, thank you.","romaji":"kekkou desu, arigatou gozaimasu."}],"note":"大丈夫です can mean yes or no here. けっこうです is clearer when you want to decline.","level":"core","romaji":"yokattara, shishoku douzo."},{"id":"souvenirs-shop-10","speaker":"you","jp":"もう少し小さい箱はありますか。","kana":"もう すこし ちいさい はこ は あります か。","meaning":"Do you have a slightly smaller box?","also_heard":[{"jp":"小箱はありますか。","kana":"こばこ は あります か。","meaning":"Do you have a small box?","romaji":"kobako wa arimasu ka."}],"replies":[{"jp":"八個入りと十二個入りがあります。","kana":"はっこいり と じゅうにこいり が あります。","meaning":"We have boxes of 8 and of 12.","romaji":"hakkoiri to juunikoiri ga arimasu."}],"level":"useful","romaji":"mou sukoshi chiisai hako wa arimasu ka."},{"id":"souvenirs-shop-11","speaker":"you","jp":"これを二つと、あれを三つください。","kana":"これ を ふたつ と、 あれ を みっつ ください。","meaning":"Two of these and three of those, please.","replies":[{"jp":"はい、こちらを二点、あちらを三点ですね。","kana":"はい、 こちら を にてん、 あちら を さんてん です ね。","meaning":"Yes, two of this one and three of that one, right?","romaji":"hai, kochira o niten, achira o santen desu ne."},{"jp":"はい、お願いします。","kana":"はい、 おねがい します。","meaning":"Yes, please.","romaji":"hai, onegai shimasu."}],"note":"Use ふたつ and みっつ for up to ten things. For boxes you can also say 箱 (はこ).","level":"core","romaji":"kore o futatsu to, are o mittsu kudasai."},{"id":"souvenirs-shop-12","speaker":"staff","jp":"こちらは数量限定になっております。","kana":"こちら は すうりょう げんてい に なって おります。","meaning":"This is a limited quantity item.","replies":[{"jp":"じゃあ、それにします。","kana":"じゃあ、 それ に します。","meaning":"Then I will take that one.","romaji":"jaa, sore ni shimasu."}],"note":"限定 comes up often: 期間限定 is for a set period, 駅限定 is for one station only. You only need to recognise them.","level":"useful","romaji":"kochira wa suuryou gentei ni natte orimasu."}]},{"title":"Gift questions at the register","intro":"Wrapping, bags, noshi paper and cold packs. Staff ask quick, set questions.","phrases":[{"id":"souvenirs-gift-01","speaker":"staff","jp":"ご自宅用ですか、贈り物ですか。","kana":"ごじたくよう です か、 おくりもの です か。","meaning":"Is this for home or a gift?","also_heard":[{"jp":"プレゼントですか。","kana":"プレゼント です か。","meaning":"Is it a present?","romaji":"purezento desu ka."},{"jp":"お土産ですか。","kana":"おみやげ です か。","meaning":"Is it a souvenir?","romaji":"omiyage desu ka."}],"replies":[{"jp":"贈り物です。","kana":"おくりもの です。","meaning":"It is a gift.","romaji":"okurimono desu."},{"jp":"自分用です。","kana":"じぶんよう です。","meaning":"It is for myself.","romaji":"jibun'you desu."},{"jp":"お土産です。","kana":"おみやげ です。","meaning":"It is a souvenir.","romaji":"omiyage desu."}],"note":"If it is a gift, expect questions about wrapping and bags next.","level":"core","romaji":"gojitakuyou desu ka, okurimono desu ka."},{"id":"souvenirs-gift-02","speaker":"staff","jp":"包装はどうなさいますか。","kana":"ほうそう は どう なさいます か。","meaning":"Would you like it wrapped?","also_heard":[{"jp":"ラッピングしますか。","kana":"ラッピング します か。","meaning":"Shall I gift-wrap it?","romaji":"rappingu shimasu ka."},{"jp":"包装しますか。","kana":"ほうそう します か。","meaning":"Shall I wrap it?","romaji":"housou shimasu ka."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"このままで大丈夫です。","kana":"この まま で だいじょうぶ です。","meaning":"No need, thanks, it is fine as it is.","romaji":"kono mama de daijoubu desu."}],"note":"Some shops charge for wrapping, so ask 無料ですか if you are not sure.","level":"core","romaji":"housou wa dou nasaimasu ka."},{"id":"souvenirs-gift-03","speaker":"you","jp":"包装は無料ですか。","kana":"ほうそう は むりょう です か。","meaning":"Is wrapping free?","also_heard":[{"jp":"有料ですか。","kana":"ゆうりょう です か。","meaning":"Is it charged?","romaji":"yuuryou desu ka."}],"replies":[{"jp":"無料です。","kana":"むりょう です。","meaning":"It is free.","romaji":"muryou desu."},{"jp":"一つ有料になります。","kana":"ひとつ ゆうりょう に なります。","meaning":"Each one costs extra.","romaji":"hitotsu yuuryou ni narimasu."}],"note":"Fees differ by shop. Ask before the staff start wrapping.","level":"useful","romaji":"housou wa muryou desu ka."},{"id":"souvenirs-gift-04","speaker":"staff","jp":"紙袋はおつけしますか。","kana":"かみぶくろ は おつけ します か。","meaning":"Would you like a paper bag?","also_heard":[{"jp":"手提げ袋はご入り用ですか。","kana":"てさげぶくろ は ごいりよう です か。","meaning":"Do you need a carry bag?","romaji":"tesagebukuro wa goiriyou desu ka."},{"jp":"袋は有料ですが。","kana":"ふくろ は ゆうりょう ですが。","meaning":"The bag costs extra, though.","romaji":"fukuro wa yuuryou desuga."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No thanks.","romaji":"daijoubu desu."}],"note":"Plastic and paper bags may cost a few yen. To decline, say 大丈夫です or いりません.","level":"core","romaji":"kamibukuro wa otsuke shimasu ka."},{"id":"souvenirs-gift-05","speaker":"you","jp":"小分けの袋をいただけますか。","kana":"こわけ の ふくろ を いただけます か。","meaning":"Could I have some small separate bags?","also_heard":[{"jp":"手提げ袋を人数分お願いします。","kana":"てさげぶくろ を にんずうぶん おねがい します。","meaning":"One carry bag per person, please.","romaji":"tesagebukuro o ninzuubun onegai shimasu."},{"jp":"袋を三つください。","kana":"ふくろ を みっつ ください。","meaning":"Three bags, please.","romaji":"fukuro o mittsu kudasai."}],"replies":[{"jp":"何枚ご入り用ですか。","kana":"なんまい ごいりよう です か。","meaning":"How many do you need?","romaji":"nanmai goiriyou desu ka."},{"jp":"三つですね。","kana":"みっつ です ね。","meaning":"Three, right?","romaji":"mittsu desu ne."}],"note":"人数分 means one for each person. Answer with a number and 枚 or つ.","level":"core","romaji":"kowake no fukuro o itadakemasu ka."},{"id":"souvenirs-gift-06","speaker":"you","jp":"値札を外してもらえますか。","kana":"ねふだ を はずして もらえます か。","meaning":"Could you remove the price tag?","also_heard":[{"jp":"シールをはがしてもらえますか。","kana":"シール を はがして もらえます か。","meaning":"Could you peel off the sticker?","romaji":"shiiru o hagashite moraemasu ka."}],"replies":[{"jp":"はがしておきますね。","kana":"はがして おきます ね。","meaning":"I will take it off.","romaji":"hagashite okimasu ne."},{"jp":"外せないので、ご了承ください。","kana":"はずせない ので、 ごりょうしょう ください。","meaning":"I cannot remove it, so please understand.","romaji":"hazusenai node, goryoushou kudasai."}],"note":"Some tags and stickers cannot come off. Ask first if the item is a gift.","level":"useful","romaji":"nefuda o hazushite moraemasu ka."},{"id":"souvenirs-gift-07","speaker":"staff","jp":"のしはお付けしますか。","kana":"のし は おつけ します か。","meaning":"Would you like noshi paper?","also_heard":[{"jp":"のし紙はいかがなさいますか。","kana":"のしがみ は いかが なさいます か。","meaning":"How would you like the noshi paper?","romaji":"noshigami wa ikaga nasaimasu ka."},{"jp":"表書きはどうしますか。","kana":"おもてがき は どう します か。","meaning":"What should the front writing say?","romaji":"omotegaki wa dou shimasu ka."}],"replies":[{"jp":"いいえ、大丈夫です。","kana":"いいえ、 だいじょうぶ です。","meaning":"No, thanks.","romaji":"iie, daijoubu desu."},{"jp":"のしはいりません。","kana":"のし は いりません。","meaning":"I do not need noshi.","romaji":"noshi wa irimasen."}],"note":"Noshi is formal paper for special gifts. Most visitors decline it.","level":"core","romaji":"noshi wa otsuke shimasu ka."},{"id":"souvenirs-gift-08","speaker":"staff","jp":"保冷剤はお付けしますか。","kana":"ほれいざい は おつけ します か。","meaning":"Would you like a cold pack?","also_heard":[{"jp":"保冷バッグもありますよ。","kana":"ほれい バッグ も あります よ。","meaning":"We also have insulated bags.","romaji":"horei baggu mo arimasu yo."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No thanks.","romaji":"daijoubu desu."}],"note":"The answer depends on how long you will carry the item. The staff will ask next.","level":"core","romaji":"horeizai wa otsuke shimasu ka."},{"id":"souvenirs-gift-09","speaker":"staff","jp":"お持ち歩きのお時間はどのくらいですか。","kana":"おもちあるき の おじかん は どのくらい です か。","meaning":"How long will you be carrying it?","also_heard":[{"jp":"何時間くらいですか。","kana":"なんじかん くらい です か。","meaning":"About how many hours?","romaji":"nanjikan kurai desu ka."},{"jp":"何時間お持ちですか。","kana":"なんじかん おもち です か。","meaning":"How many hours will you carry it?","romaji":"nanjikan omochi desu ka."}],"replies":[{"jp":"三時間くらいです。","kana":"さんじかん くらい です。","meaning":"About three hours.","romaji":"sanjikan kurai desu."},{"jp":"飛行機に乗ります。","kana":"ひこうき に のります。","meaning":"I am flying.","romaji":"hikouki ni norimasu."},{"jp":"明日までです。","kana":"あした まで です。","meaning":"Until tomorrow.","romaji":"ashita made desu."}],"note":"Answer honestly. The staff pick the cold pack to match the time you will carry it.","level":"core","romaji":"omochiaruki no ojikan wa donokurai desu ka."},{"id":"souvenirs-gift-10","speaker":"staff","jp":"お包みしますので、少々お待ちください。","kana":"おつつみ します ので、 しょうしょう おまち ください。","meaning":"I will wrap it, so please wait a moment.","also_heard":[{"jp":"お時間を少しいただきます。","kana":"おじかん を すこし いただきます。","meaning":"This will take a little time.","romaji":"ojikan o sukoshi itadakimasu."}],"replies":[{"jp":"はい、大丈夫です。","kana":"はい、 だいじょうぶ です。","meaning":"Yes, that is fine.","romaji":"hai, daijoubu desu."},{"jp":"急ぎません。","kana":"いそぎません。","meaning":"I am not in a hurry.","romaji":"isogimasen."}],"note":"Gift wrapping can take a few minutes. Say 急ぎません if you have time.","level":"core","romaji":"otsutsumi shimasu node, shoushou omachi kudasai."},{"id":"souvenirs-gift-11","speaker":"you","jp":"別々に包んでもらえますか。","kana":"べつべつ に つつんで もらえます か。","meaning":"Could you wrap them separately?","also_heard":[{"jp":"一つずつ包んでもらえますか。","kana":"ひとつずつ つつんで もらえます か。","meaning":"Could you wrap each one separately?","romaji":"hitotsuzutsu tsutsunde moraemasu ka."}],"replies":[{"jp":"はい、かしこまりました。","kana":"はい、 かしこまりました。","meaning":"Yes, certainly.","romaji":"hai, kashikomarimashita."}],"note":"Useful when the gifts are for different people.","level":"useful","romaji":"betsubetsu ni tsutsu ","speaker":"staff","jp":"夕方から割引になります。","kana":"ゆうがた から わりびき に なります。","meaning":"There is a discount from the evening.","also_heard":[{"jp":"値引きシールをお貼りします。","kana":"ねびき シール を おはり します。","meaning":"I will put on a discount sticker.","romaji":"nebiki shiiru o ohari shimasu."},{"jp":"半額シールをお貼りします。","kana":"はんがく シール を おはり します。","meaning":"I will put on a half-price sticker.","romaji":"hangaku shiiru o ohari shimasu."}],"replies":[{"jp":"これはいつまでですか。","kana":"これ は いつまで です か。","meaning":"Until when does this apply?","romaji":"kore wa itsumade desu ka."}],"note":"Evening discounts often apply to fresh food. Ask which items are included.","level":"useful","romaji":"yuugata kara waribiki ni narimasu."},{"id":"souvenirs-depa-07","speaker":"staff","jp":"最後尾はこちらです。","kana":"さいこうび は こちら です。","meaning":"The end of the line is here.","also_heard":[{"jp":"こちらにお並びください。","kana":"こちら に おならび ください。","meaning":"Please line up here.","romaji":"kochira ni onarabi kudasai."}],"replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, I understand.","romaji":"hai, wakarimashita."}],"note":"最後尾 is the back of the line. Join there and ask how long the wait is if you need to.","level":"useful","romaji":"saikoubi wa kochira desu."},{"id":"souvenirs-depa-08","speaker":"staff","jp":"整理券をお取りください。","kana":"せいりけん を おとり ください。","meaning":"Please take a numbered ticket.","also_heard":[{"jp":"番号札をお取りください。","kana":"ばんごうふだ を おとり ください。","meaning":"Please take a number card.","romaji":"bangoufuda o otori kudasai."},{"jp":"十番の方、どうぞ。","kana":"じゅうばん の かた、 どうぞ。","meaning":"Number ten, please come forward.","romaji":"juuban no kata, douzo."}],"replies":[{"jp":"はい、ありがとうございます。","kana":"はい、 ありがとう ございます。","meaning":"Yes, thank you.","romaji":"hai, arigatou gozaimasu."}],"note":"Popular sweet shops hand out numbered tickets and call the numbers. Keep your ticket and listen for it.","level":"core","romaji":"seiriken o otori kudasai."},{"id":"souvenirs-depa-09","speaker":"staff","jp":"本日分は完売いたしました。","kana":"ほんじつぶん r?","also_heard":[{"jp":"免税はできますか。","kana":"めんぜい は できます か。","meaning":"Can I do tax-free here?","romaji":"menzei wa dekimasu ka."},{"jp":"免税レジはどこですか。","kana":"めんぜい レジ は どこ です か。","meaning":"Where is the tax-free till?","romaji":"menzei reji wa doko desu ka."}],"replies":[{"jp":"七階です。","kana":"ななかい です。","meaning":"It is on the seventh floor.","romaji":"nanakai desu."},{"jp":"こちらで大丈夫です。","kana":"こちら で だいじょうぶ です。","meaning":"You can do it here.","romaji":"kochira de daijoubu desu."},{"jp":"先にレジでお会計をお願いします。","kana":"さき に レジ で おかいけい を おねがい します。","meaning":"Please pay at the till first.","romaji":"saki ni reji de okaikei o onegai shimasu."}],"note":"Some shops take the normal payment first and send you to a separate desk for the tax-free step.","level":"core","romaji":"menzei kauntaa wa doko desu ka."},{"id":"souvenirs-disc-10","speaker":"staff","jp":"免税は別のレジになります。","kana":"めんぜい は べつ の レジ に なります。","meaning":"Tax-free is at a separate till.","also_heard":[{"jp":"別会計です。","kana":"べっかいけい です。","meaning":"It is a separate payment.","romaji":"bekkaikei desu."},{"jp":"免税カウンターでお願いします。","kana":"めんぜい カウンター で おねがい します。","meaning":"Please go to the tax-free counter.","romaji":"menzei kauntaa de onegai shimasu."}],"replies":[{"jp":"免税でお願いします。","kana":"めんぜい で おねがい します。","meaning":"Tax-free, please.","romaji":"menzei de onegai shimasu."},{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, I understand.","romaji":"hai, wakarimashita."}],"note":"Since November 2026 you pay the tax-included price and the refund comes later. The shop will explain the steps.","level":"core","romaji":"menzei wa betsu no reji ni narimasu."},{"id":"souvenirs-disc-11","speaker":"staff","jp":"カゴはこちらにお預けください。","kana":"かご は こちら に おあずけ ください。","meaning":"Please leave the basket here.","also_heard":[{"jp":"かごをこちらに置いてください。","kana":"かご を こちら に おいて ください。","meaning":"Please put the basket here.","romaji":"kago o kochira ni oite kudasai."}],"replies":[{"jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."}],"level":"listen-only","romaji":"kago wa kochira ni oazuke kudasai."},{"id":"souvenirs-disc-12","speaker":"you","jp":"全部でいくらですか。","kana":"ぜんぶ で いくら です か。","meaning":"What is the total?","also_heard":[{"jp":"税込でいくらですか。","kana":"ぜいこみ で いくら です か。","meaning":"How much with tax included?","romaji":"zeikomi de ikura desu ka."}],"replies":[{"jp":"全部で千円です。","kana":"ぜんぶ で せん えん です。","meaning":"The total is 1,000 yen.","romaji":"zenbu de sen en desu."}],"level":"useful","romaji":"zenbu de ikura desu ka."}]},{"title":"Electronics","intro":"Voltage, language settings, warranty and plugs. Ask before you buy.","phrases":[{"id":"souvenirs-elec-01","speaker":"you","jp":"これは海外で使えますか。","kana":"これ は かいがい で つかえます か。","meaning":"Does this work overseas?","also_heard":[{"jp":"海外でも使えますか。","kana":"かいがい でも つかえます か。","meaning":"Does it work abroad too?","romaji":"kaigai demo tsukaemasu ka."}],"replies":[{"jp":"海外対応です。","kana":"かいがいたいおう です。","meaning":"It is compatible with overseas power.","romaji":"kaigaitaiou desu."},{"jp":"百ボルトのみなので、海外では使えません。","kana":"ひゃく ボルト の み なので、 かいがい で は つかえません。","meaning":"It is 100 volts only, so it does not work abroad.","romaji":"hyaku boruto no mi nanode, kaigai de wa tsukaemasen."}],"note":"Japan uses 100 V. Many hair dryers and kitchen items only run on 100 V. Check the label before you buy.","level":"core","romaji":"kore wa kaigai de tsukaemasu ka."},{"id":"souvenirs-elec-02","speaker":"you","jp":"変圧器が必要ですか。","kana":"へんあつき が ひつよう です か。","meaning":"Do I need a transformer?","also_heard":[{"jp":"電圧は何ボルトですか。","kana":"でんあつ は なん ボルト です か。","meaning":"What is the voltage?","romaji":"den'atsu wa nan boruto desu ka."}],"replies":[{"jp":"必要です。","kana":"ひつよう です。","meaning":"Yes, you need one.","romaji":"hitsuyou desu."},{"jp":"変圧器があれば使えます。","kana":"へんあつき が あれば つかえます。","meaning":"You can use it if you have a transformer.","romaji":"hen'atsuki ga areba tsukaemasu."},{"jp":"必要ありません。","kana":"ひつよう ありません。","meaning":"No, you do not need one.","romaji":"hitsuyou arimasen."}],"note":"A transformer changes the voltage. Items that handle both voltages do not need one.","level":"useful","romaji":"hen'atsuki ga hitsuyou desu ka."},{"id":"souvenirs-elec-03","speaker":"you","jp":"英語に設定できますか。","kana":"えいご に せってい できます か。","meaning":"Can it be set to English?","also_heard":[{"jp":"言語は変えられますか。","kana":"げんご は かえられます か。","meaning":"Can the language be changed?","romaji":"gengo wa kaeraremasu ka."}],"replies":[{"jp":"英語にも切り替えられます。","kana":"えいご に も きりかえ られます。","meaning":"It can also switch to English.","romaji":"eigo ni mo kirikae raremasu."},{"jp":"日本語のみです。","kana":"にほんご のみ です。","meaning":"It is Japanese only.","romaji":"nihongo nomi desu."}],"level":"core","romaji":"eigo ni settei dekimasu ka."},{"id":"souvenirs-elec-04","speaker":"you","jp":"海外で保証は受けられますか。","kana":"かいがい で ほしょう は うけられます か。","meaning":"Can I get the warranty honoured abroad?","also_heard":[{"jp":"海外保証はありますか。","kana":"かいがい ほしょう は あります か。","meaning":"Is there an overseas warranty?","romaji":"kaigai hoshou wa arimasu ka."}],"replies":[{"jp":"国内のみになります。","kana":"こくない の み に なります。","meaning":"It is for Japan only.","romaji":"kokunai no mi ni narimasu."},{"jp":"海外保証付きです。","kana":"かいがいほしょうつき です。","meaning":"It comes with an overseas warranty.","romaji":"kaigaihoshoutsuki desu."}],"note":"Warranties are often valid in Japan only. Ask before you buy an expensive item.","level":"core","romaji":"kaigai de hoshou wa ukeraremasu ka."},{"id":"souvenirs-elec-05","speaker":"you","jp":"プラグの形は何ですか。","kana":"プラグ の かたち は なん です か。","meaning":"What shape is the plug?","also_heard":[{"jp":"変換プラグは必要ですか。","kana":"へんかんプラグ は ひつよう です か。","meaning":"Do I need a plug adapter?","romaji":"henkanpuragu wa hitsuyou desu ka."}],"replies":[{"jp":"日本のAタイプです。","kana":"にほん の エー タイプ です。","meaning":"It is Japan's type A plug.","romaji":"nihon no ee taipu desu."}],"note":"Japan uses type A, two flat pins. Check your own plug type before you buy an adapter.","level":"useful","romaji":"puragu no katachi wa nan desu ka."},{"id":"souvenirs-elec-06","speaker":"staff","jp":"ポイントカードはお持ちですか。","kana":"ポイントカード は おもち です か。","meaning":"Do you have a points card?","also_heard":[{"jp":"ポイントカードはありますか。","kana":"ポイントカード は あります か。","meaning":"Do you have a points card?","romaji":"pointokaado wa arimasu ka."}],"replies":[{"jp":"いいえ、持っていません。","kana":"いいえ、 もって いません。","meaning":"No, I do not have one.","romaji":"iie, motte imasen."},{"jp":"免税でお願いします。","kana":"めんぜい で おねがい します。","meaning":"Tax-free, please.","romaji":"menzei de onegai shimasu."}],"note":"Ask whether points and the tax-free process can be used together, since they may not be.","level":"core","romaji":"pointokaado wa omochi desu ka."},{"id":"souvenirs-elec-07","speaker":"you","jp":"試してもいいですか。","kana":"ためして も いい です か。","meaning":"May I try it?","also_heard":[{"jp":"触ってもいいですか。","kana":"さわって も いい です か。","meaning":"May I touch it?","romaji":"sawatte mo ii desu ka."}],"replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Please go ahead.","romaji":"douzo."},{"jp":"展示品です、お試しください。","kana":"てんじひん です、 おためし ください。","meaning":"It is a display model, please try it.","romaji":"tenjihin desu, otameshi kudasai."}],"note":"Display models are usually open to try. Ask before you use a demo item that is plugged in.","level":"useful","romaji":"tameshite mo ii desu ka."},{"id":"souvenirs-elec-08","speaker":"staff","jp":"在庫を確認してまいります。","kana":"ざいこ を かくにん して まいります。","meaning":"I will go and check the stock.","also_heard":[{"jp":"在庫をお持ちします。","kana":"ざいこ を おもち します。","meaning":"I will bring the stock.","romaji":"zaiko o omochi shimasu."},{"jp":"倉庫から持ってきます。","kana":"そうこ から もって きます。","meaning":"I will bring it from the storeroom.","romaji":"souko kara motte kimasu."}],"replies":[{"jp":"お願いします。","kana":"おねがい します。","meaning":"Yes, please.","romaji":"onegai shimasu."}],"note":"The item comes from the storeroom, so wait a few minutes.","level":"core","romaji":"zaiko o kakunin shite mairimasu."},{"id":"souvenirs-elec-09","speaker":"you","jp":"SIMカードはありますか。","kana":"シムカード は あります か。","meaning
