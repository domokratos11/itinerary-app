さい。","kana":"じどう てにもつ あずけき の つかいかた を おしえて ください。","meaning":"Please show me how to use the self bag drop machine.","replies":[{"jp":"タグを貼ってください。","kana":"タグ を はって ください。","meaning":"Please attach the tag.","romaji":"tagu o hatte kudasai."},{"jp":"ベルトに載せてください。","kana":"ベルト に のせて ください。","meaning":"Please put the bag on the belt.","romaji":"beruto ni nosete kudasai."}],"level":"useful","romaji":"jidou tenimotsu azukeki no tsukaikata o oshiete kudasai."},{"id":"airport-security-02","speaker":"staff","jp":"免税品はお持ちですか。","kana":"めんぜいひん は おもち です か。","meaning":"Do you have any tax-free goods?","replies":[{"jp":"はい、持っています。","kana":"はい、 もっています。","meaning":"Yes, I have some.","romaji":"hai, motteimasu."},{"jp":"いいえ、持っていません。","kana":"いいえ、 もっていません。","meaning":"No, I don't have any.","romaji":"iie, motteimasen."}],"note":"Since November 2026 tax-free works as a refund. You pay full price, and the tax is refunded after customs confirm at departure. Keep the goods and receipts ready.","level":"core","romaji":"menzeihin wa omochi desu ka."},{"id":"airport-security-03","speaker":"staff","jp":"免税品は手荷物に入っていますか。","kana":"めんぜいひん は てにもつ に はいっています か。","meaning":"Are the tax-free goods in your carry-on?","replies":[{"jp":"はい、手荷物に入れています。","kana":"はい、 てにもつ に いれています。","meaning":"Yes, they are in my carry-on.","romaji":"hai, tenimotsu ni ireteimasu."}],"level":"useful","romaji":"menzeihin wa tenimotsu ni haitteimasu ka."},{"id":"airport-security-04","speaker":"staff","jp":"液体物はありますか。","kana":"えきたいぶつ は あります か。","meaning":"Do you have any liquids?","replies":[{"jp":"はい、透明の袋に入れています。","kana":"はい、 とうめい の ふくろ に いれています。","meaning":"Yes, I have them in a clear bag.","romaji":"hai, toumei no fukuro ni ireteimasu."},{"jp":"いいえ、ありません。","kana":"いいえ、 ありません。","meaning":"No, I don't have any.","romaji":"iie, arimasen."}],"note":"Each container must be 100 ml or less, in one clear zip bag per person (max 1 litre). Bigger liquids must go in the checked bag.","level":"core","romaji":"ekitaibutsu wa arimasu ka."},{"id":"airport-security-05","speaker":"staff","jp":"100ミリリットル以下ですか。","kana":"ひゃく ミリリットル いか です か。","meaning":"Is it 100 millilitres or less?","level":"core","romaji":"hyaku miririttoru ika desu ka."},{"id":"airport-security-06","speaker":"staff","jp":"パソコンを出してください。","kana":"パソコン を だして ください。","meaning":"Please take out your laptop.","note":"Follow the staff signals at the checkpoint. Rules for laptops and shoes depend on the checkpoint.","level":"core","romaji":"pasokon o dashite kudasai."},{"id":"airport-security-07","speaker":"staff","jp":"ジャケット、ベルト、靴を脱いでください。","kana":"ジャケット、 ベルト、 くつ を ぬいで ください。","meaning":"Please take off your jacket, belt and shoes.","also_heard":[{"jp":"上着、ベルト、ブーツを脱いでください。","kana":"うわぎ、 ベルト、 ブーツ を ぬいで ください。","meaning":"Please take off your coat, belt and boots.","romaji":"uwagi, beruto, buutsu o nuide kudasai."}],"level":"core","romaji":"jaketto, beruto, kutsu o nuide kudasai."},{"id":"airport-security-08","speaker":"staff","jp":"ポケットの中のものを全部出してください。","kana":"ポケット の なか の もの を ぜんぶ だして ください。","meaning":"Please empty everything out of your pockets.","level":"core","romaji":"poketto no naka no mono o zenbu dashite kudasai."},{"id":"airport-security-09","speaker":"staff","jp":"金属類はありますか。","kana":"きんぞくるい は あります か。","meaning":"Do you have any metal items?","note":"Keys, coins and metal belt buckles are common triggers. Put them in the tray when asked.","level":"core","romaji":"kinzokurui wa arimasu ka."},{"id":"airport-security-10","speaker":"staff","jp":"ペットボトルの水は捨ててください。","kana":"ペットボトル の みず は すてて ください。","meaning":"Please throw away your water bottle.","replies":[{"jp":"はい、捨てます。","kana":"はい、 すてます。","meaning":"Yes, I will throw it away.","romaji":"hai, sutemasu."}],"note":"Buy water after the security check.","level":"core","romaji":"pettobotoru no mizu wa sutete kudasai."},{"id":"airport-security-11","speaker":"staff","jp":"飲み物は持ち込めません。","kana":"のみもの は もちこめません。","meaning":"You cannot take drinks through.","level":"useful","romaji":"nomimono wa mochikomemasen."},{"id":"airport-security-12","speaker":"staff","jp":"手荷物をもう一度確認させていただきます。","kana":"てにもつ を もういちど かくにん させて いただきます。","meaning":"We would like to check your carry-on bag once more.","level":"core","romaji":"tenimotsu o mouichido kakunin sasete itadakimasu."},{"id":"airport-security-13","speaker":"staff","jp":"開けてもよろしいですか。","kana":"あけても よろしい です か。","meaning":"May we open it?","replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."}],"level":"core","romaji":"aketemo yoroshii desu ka."},{"id":"airport-security-14","speaker":"staff","jp":"両手を上げてください。","kana":"りょうて を あげて ください。","meaning":"Please raise both hands.","level":"useful","romaji":"ryoute o agete kudasai."},{"id":"airport-security-15","speaker":"staff","jp":"金属探知機です。","kana":"きんぞくたんちき です。","meaning":"This is a metal detector.","level":"useful","romaji":"kinzokutanchiki desu."},{"id":"airport-security-16","speaker":"staff","jp":"カメラを見てください。","kana":"カメラ を みて ください。","meaning":"Please look at the camera.","note":"At the exit immigration face gate, look at the camera and wait for the gate to open.","level":"core","romaji":"kamera o mite kudasai."},{"id":"airport-security-17","speaker":"you","jp":"出国スタンプをお願いします。","kana":"しゅっこく スタンプ を おねがい します。","meaning":"Could you stamp my passport for departure, please?","note":"Automated gates may not stamp passports. If you want a stamp, ask an officer at the counter.","level":"useful","romaji":"shukkoku sutanpu o onegai shimasu."}]},{"title":"Gate and duty-free","intro":"Boarding calls and everyday gate announcements, plus buying at the duty-free shop.","phrases":[{"id":"airport-gate-01","speaker":"announcement","jp":"ロサンゼルス行きのご搭乗を、ただいまより開始いたします。","kana":"ロサンゼルス いき の ごとうじょう を、 ただいま より かいし いたします。","meaning":"Boarding for the flight to Los Angeles starts now.","note":"The flight number is usually said too. Listen for it and check it against your boarding pass.","level":"listen-only","romaji":"rosanzerusu iki no gotoujou o, tadaima yori kaishi itashimasu."},{"id":"airport-gate-02","speaker":"announcement","jp":"優先搭乗のお客様からご案内いたします。","kana":"ゆうせんとうじょう の おきゃくさま から ごあんない いたします。","meaning":"We will start with priority boarding passengers.","level":"core","romaji":"yuusentoujou no okyakusama kara goannai itashimasu."},{"id":"airport-gate-03","speaker":"announcement","jp":"グループ2のお客様からご案内いたします。","kana":"グループ に の おきゃくさま から ごあんない いたします。","meaning":"We will now board group 2.","note":"Find your group number on your boarding pass. Wait until your group is called.","level":"core","romaji":"guruupu ni no okyakusama kara goannai itashimasu."},{"id":"airport-gate-04","speaker":"announcement","jp":"最終のご案内です。","kana":"さいしゅう の ごあんない です。","meaning":"This is the final call.","also_heard":[{"jp":"最終案内です。","kana":"さいしゅう あんない です。","meaning":"This is the last call.","romaji":"saishuu annai desu."}],"level":"core","romaji":"saishuu no goannai desu."},{"id":"airport-gate-05","speaker":"announcement","jp":"お急ぎください。","kana":"おいそぎ ください。","meaning":"Please hurry.","level":"core","romaji":"oisogi kudasai."},{"id":"airport-gate-06","speaker":"announcement","jp":"お客様、お客様、至急三十二番ゲートまでお越しください。","kana":"おきゃくさま、 おきゃくさま、 しきゅう さんじゅうにばん ゲート まで おこし ください。","meaning":"Passenger, passenger, please come to gate 32 right away.","note":"They may call your name in katakana. Listen for your name and go to the gate quickly.","level":"useful","romaji":"okyakusama, okyakusama, shikyuu sanjuuniban geeto made okoshi kudasai."},{"id":"airport-gate-07","speaker":"announcement","jp":"搭乗口が三十四番に変更になりました。","kana":"とうじょうぐち が さんじゅうよんばん に へんこう に なりました。","meaning":"The gate has changed to number 34.","note":"Check the screens for the new gate, then walk there.","level":"core","romaji":"toujouguchi ga sanjuuyonban ni henkou ni narimashita."},{"id":"airport-gate-08","speaker":"announcement","jp":"出発が遅れております。","kana":"しゅっぱつ が おくれて おります。","meaning":"Our departure is delayed.","level":"core","romaji":"shuppatsu ga okurete orimasu."},{"id":"airport-gate-09","speaker":"announcement","jp":"午後二時二十分に変更になりました。","kana":"ごご に じ にじゅっぷん に へんこう に なりました。","meaning":"The departure has been changed to 2:20 in the afternoon.","level":"core","romaji":"gogo ni ji nijuppun ni henkou ni narimashita."},{"id":"airport-gate-10","speaker":"announcement","jp":"機材の到着が遅れております。","kana":"きざい の とうちゃく が おくれて おります。","meaning":"The aircraft has arrived late.","note":"This means the plane is delayed coming in from another flight. Keep checking the gate screen for updates.","level":"listen-only","romaji":"kizai no touchaku ga okurete orimasu."},{"id":"airport-gate-11","speaker":"you","jp":"この搭乗券で合っていますか。","kana":"この とうじょうけん で あっています か。","meaning":"Is this the right boarding pass?","replies":[{"jp":"はい、合っています。","kana":"はい、 あっています。","meaning":"Yes, that is correct.","romaji":"hai, atteimasu."}],"level":"core","romaji":"kono toujouken de atteimasu ka."},{"id":"airport-gate-12","speaker":"you","jp":"ゲートはここですか。","kana":"ゲート は ここ です か。","meaning":"Is this the gate?","replies":[{"jp":"はい、ここです。","kana":"はい、 ここ です。","meaning":"Yes, this is it.","romaji":"hai, koko desu."},{"jp":"いいえ、あちらです。","kana":"いいえ、 あちら です。","meaning":"No, it is over there.","romaji":"iie, achira desu."}],"level":"core","romaji":"geeto wa koko desu ka."},{"id":"airport-gate-13","speaker":"staff","jp":"パスポートと搭乗券をお願いします。","kana":"パスポート と とうじょうけん を おねがい します。","meaning":"Passport and boarding pass, please.","replies":[{"jp":"はい、わかりました。","kana":"はい、 わかりました。","meaning":"Yes, understood.","romaji":"hai, wakarimashita."}],"note":"Duty-free shops check your passport and boarding pass before they sell you goods.","level":"useful","romaji":"pasupooto to toujouken o onegai shimasu."},{"id":"airport-gate-14","speaker":"staff","jp":"袋に封をします。","kana":"ふくろ に ふう を します。","meaning":"We will seal the bag.","level":"useful","romaji":"fukuro ni fuu o shimasu."},{"id":"airport-gate-15","speaker":"staff","jp":"開けないでください。","kana":"あけないで ください。","meaning":"Please do not open it.","note":"The sealed bag is for the flight. Keep it closed until you have passed the checks.","level":"useful","romaji":"akenaide kudasai."},{"id":"airport-gate-16","speaker":"you","jp":"これを一つください。","kana":"これ を ひとつ ください。","meaning":"I will have this one, please.","level":"useful","romaji":"kore o hitotsu kudasai."},{"id":"airport-gate-17","speaker":"you","jp":"試食してもいいですか。","kana":"ししょく して も いい です か。","meaning":"May I try a sample?","level":"useful","romaji":"shishoku shite mo ii desu ka."}]}],"dialogues":[{"title":"Immigration desk","lines":[{"speaker":"staff","jp":"パスポートをお願いします。","kana":"パスポート を おねがい します。","meaning":"Passport, please.","romaji":"pasupooto o onegai shimasu."},{"speaker":"you","jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."},{"speaker":"staff","jp":"入国の目的は何ですか。","kana":"にゅうこく の もくてき は なん です か。","meaning":"What is the purpose of your visit?","romaji":"nyuukoku no mokuteki wa nan desu ka."},{"speaker":"you","jp":"観光です。","kana":"かんこう です。","meaning":"Sightseeing.","romaji":"kankou desu."},{"speaker":"staff","jp":"何日間、滞在しますか。","kana":"なんにちかん、 たいざい します か。","meaning":"How many days will you stay?","romaji":"nannichikan, taizai shimasu ka."},{"speaker":"you","jp":"約四週間です。","kana":"やく よんしゅうかん です。","meaning":"About four weeks.","romaji":"yaku yonshuukan desu."},{"speaker":"staff","jp":"どこに泊まりますか。","kana":"どこ に とまります か。","meaning":"Where will you stay?","romaji":"doko ni tomarimasu ka."},{"speaker":"you","jp":"上野のホテルに泊まります。","kana":"うえの の ホテル に とまります。","meaning":"I will stay at a hotel in Ueno.","romaji":"ueno no hoteru ni tomarimasu."},{"speaker":"staff","jp":"指紋を採ります。両手の人差し指をここに置いてください。","kana":"しもん を とります。 りょうて の ひとさしゆび を ここ に おいて ください。","meaning":"We will take your fingerprints. Please place both index fingers here.","romaji":"shimon o torimasu. ryoute no hitosashiyubi o koko ni oite kudasai."},{"speaker":"you","jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."},{"speaker":"staff","jp":"カメラを見てください。","kana":"カメラ を みて ください。","meaning":"Please look at the camera.","romaji":"kamera o mite kudasai."},{"speaker":"you","jp":"はい。","kana":"はい。","meaning":"Yes.","romaji":"hai."},{"speaker":"staff","jp":"はい、結構です。ようこそ日本へ。","kana":"はい、 けっこう です。 ようこそ にほん へ。","meaning":"That is fine. Welcome to Japan.","romaji":"hai, kekkou desu. youkoso nihon e."},{"speaker":"you","jp":"ありがとうございます。","kana":"ありがとうございます。","meaning":"Thank you.","romaji":"arigatougozaimasu."}]},{"title":"Customs","lines":[{"speaker":"staff","jp":"申告するものはありますか。","kana":"しんこく する もの は あります か。","meaning":"Do you have anything to declare?","romaji":"shinkoku suru mono wa arimasu ka."},{"speaker":"you","jp":"いいえ、ありません。","kana":"いいえ、 ありません。","meaning":"No, I have nothing.","romaji":"iie, arimasen."},{"speaker":"staff","jp":"食べ物はありますか。","kana":"たべもの は あります か。","meaning":"Do you have any food?","romaji":"tabemono wa arimasu ka."},{"speaker":"you","jp":"お菓子だけです。","kana":"おかし だけ です。","meaning":"Only some snacks.","romaji":"okashi dake desu."},{"speaker":"staff","jp":"荷物を開けてもいいですか。","kana":"にもつ を あけて も いい です か。","meaning":"May I open your bag?","romaji":"nimotsu o akete mo ii desu ka."},{"speaker":"you","jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, go ahead.","romaji":"hai, douzo."},{"speaker":"staff","jp":"結構です。ありがとうございました。","kana":"けっこう です。 ありがとうございました。","meaning":"That is fine. Thank you.","romaji":"kekkou desu. arigatougozaimashita."},{"speaker":"you","jp":"ありがとうございました。","kana":"ありがとうございました。","meaning":"Thank you.","romaji":"arigatougozaimashita."}]},{"title":"Departure check-in (ANA)","lines":[{"speaker":"staff","jp":"パスポートをお願いします。","kana":"パスポート を おねがい します。","meaning":"Passport, please.","romaji":"pasupooto o onegai shimasu."},{"speaker":"you","jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Here you are.","romaji":"hai, douzo."},{"speaker":"staff","jp":"お預けのお荷物はいくつですか。","kana":"おあずけ の おにもつ は いくつ です か。","meaning":"How many bags are you checking?","romaji":"oazuke no onimotsu wa ikutsu desu ka."},{"speaker":"you","jp":"二つです。","kana":"ふたつ です。","meaning":"Two.","romaji":"futatsu desu."},{"speaker":"staff","jp":"モバイルバッテリーは入っていますか。","kana":"モバイルバッテリー は はいっています か。","meaning":"Is there a power bank inside?","romaji":"mobairubatterii wa haitteimasu ka."},{"speaker":"you","jp":"はい、手荷物に入れています。","kana":"はい、 てにもつ に いれています。","meaning":"Yes, it is in my carry-on.","romaji":"hai, tenimotsu ni ireteimasu."},{"speaker":"staff","jp":"窓側と通路側、どちらがよろしいですか。","kana":"まどがわ と つうろがわ、 どちら が よろしい です か。","meaning":"Window or aisle, which would you prefer?","romaji":"madogawa to tsuurogawa, dochira ga yoroshii desu ka."},{"speaker":"you","jp":"妻と隣で、窓側をお願いします。","kana":"つま と となり で、 まどがわ を おねがい します。","meaning":"Next to my wife, a window seat, please.","romaji":"tsuma to tonari de, madogawa o onegai shimasu."},{"speaker":"staff","jp":"かしこまりました。搭乗口は三十二番です。","kana":"かしこまりました。 とうじょうぐち は さんじゅうにばん です。","meaning":"Certainly. Your gate is number 32.","romaji":"kashikomarimashita. toujouguchi wa sanjuuniban desu."}]}],"signs":[{"jp":"到着","kana":"とうちゃく","meaning":"Arrivals","where":"Direction signs in the arrivals area","romaji":"touchaku"},{"jp":"出発","kana":"しゅっぱつ","meaning":"Departures","where":"Departures hall and direction signs","romaji":"shuppatsu"},{"jp":"入国審査","kana":"にゅうこく しんさ","meaning":"Immigration","where":"Arrivals immigration area","romaji":"nyuukoku shinsa"},{"jp":"外国人","kana":"がいこくじん","meaning":"Foreign nationals","where":"Immigration queue for foreign passports","romaji":"gaikokujin"},{"jp":"日本人","kana":"にほんじん","meaning":"Japanese nationals","where":"Immigration queue for Japanese passports","romaji":"nihonjin"},{"jp":"再入国","kana":"さいにゅうこく","meaning":"Re-entry","where":"Re-entry permit desks, for residents, not for you","romaji":"sainyuukoku"},{"jp":"手荷物受取所","kana":"てにもつうけとりじょ","meaning":"Baggage claim","where":"Arrivals hall, before customs","romaji":"tenimotsuuketorijo"},{"jp":"税関","kana":"ぜいかん","meaning":"Customs","where":"Customs area after baggage claim","romaji":"zeikan"},{"jp":"免税","kana":"めんぜい","meaning":"Nothing to declare","where":"Customs channel for travellers with nothing to declare","romaji":"menzei"},{"jp":"課税","kana":"かぜい","meaning":"Taxable goods","where":"Customs channel for travellers with goods to declare","romaji":"kazei"},{"jp":"検疫","kana":"けんえき","meaning":"Quarantine","where":"Health check area after immigration","romaji":"ken'eki"},{"jp":"乗り継ぎ","kana":"のりつぎ","meaning":"Transfer","where":"Signs for connecting passengers","romaji":"noritsugi"},{"jp":"国際線","kana":"こくさいせん","meaning":"International flights","where":"Terminal and check-in signs","romaji":"kokusaisen"},{"jp":"国内線","kana":"こくないせん","meaning":"Domestic flights","where":"Terminal and check-in signs","romaji":"kokunaisen"},{"jp":"搭乗口","kana":"とうじょうぐち","meaning":"Gate","where":"Airside signs and gate screens","romaji":"toujouguchi"},{"jp":"保安検査場","kana":"ほあんけんさじょう","meaning":"Security checkpoint","where":"Before the departure lounge","romaji":"hoankensajou"},{"jp":"出国審査","kana":"しゅっこくしんさ","meaning":"Exit immigration","where":"Departures, before the gate area","romaji":"shukkokushinsa"},{"jp":"両替","kana":"りょうがえ","meaning":"Currency exchange","where":"Arrivals hall and departures hall","romaji":"ryougae"},{"jp":"手荷物預かり","kana":"てにもつあずかり","meaning":"Baggage storage and drop","where":"Terminal lobby, for storing luggage","romaji":"tenimotsuazukari"},{"jp":"宅配","kana":"たくはい","meaning":"Luggage delivery","where":"Delivery counter in the arrivals hall","romaji":"takuhai"},{"jp":"案内","kana":"あんない","meaning":"Information","where":"Information desks","romaji":"annai"},{"jp":"出口","kana":"でぐち","meaning":"Exit","where":"Exit signs throughout the airport","romaji":"deguchi"},{"jp":"非常口","kana":"ひじょうぐち","meaning":"Emergency exit","where":"Emergency exit signs, do not block them","romaji":"hijouguchi"}],"vocab":[{"title":"Documents","items":[{"jp":"パスポート","kana":"パスポート","meaning":"passport","romaji":"pasupooto"},{"jp":"搭乗券","kana":"とうじょうけん","meaning":"boarding pass","romaji":"toujouken"},{"jp":"航空券","kana":"こうくうけん","meaning":"plane ticket","romaji":"koukuuken"},{"jp":"入国カード","kana":"にゅうこく カード","meaning":"landing card","romaji":"nyuukoku kaado"},{"jp":"税関申告書","kana":"ぜいかん しんこくしょ","meaning":"customs declaration form","romaji":"zeikan shinkokusho"}]},{"title":"Bags","items":[{"jp":"手荷物","kana":"てにもつ","meaning":"carry-on bag","romaji":"tenimotsu"},{"jp":"預け入れ荷物","kana":"あずけいれ にもつ","meaning":"checked bag","romaji":"azukeire nimotsu"},{"jp":"機内持ち込み","kana":"きない もちこみ","meaning":"carry-on, taken into the cabin","romaji":"kinai mochikomi"},{"jp":"通路側","kana":"つうろがわ","meaning":"aisle side","romaji":"tsuurogawa"},{"jp":"窓側","kana":"まどがわ","meaning":"window side","romaji":"madogawa"}]},{"title":"Places","items":[{"jp":"搭乗口","kana":"とうじょうぐち","meaning":"gate","romaji":"toujouguchi"},{"jp":"保安検査場","kana":"ほあんけんさじょう","meaning":"security checkpoint","romaji":"hoankensajou"},{"jp":"出国審査","kana":"しゅっこくしんさ","meaning":"exit immigration","romaji":"shukkokushinsa"},{"jp":"両替所","kana":"りょうがえじょ","meaning":"currency exchange counter","romaji":"ryougaejo"}]}],"_num":"02"},{"slug":"trains","title":"Trains and transit","title_jp":"電車","summary":"Tickets, Shinkansen seats, platforms and announcements","situations":[{"title":"IC cards","intro":"One IC card works on most trains, subways and many buses. Here is how to buy, top up and fix problems.","phrases":[{"id":"trains-ic-01","speaker":"you","jp":"スイカを買いたいんですが。","kana":"スイカ を かいたい ん です が。","meaning":"I'd like to buy a Suica.","replies":[{"jp":"券売機で買えます。","kana":"けんばいき で かえます。","meaning":"You can buy it at the ticket machine.","romaji":"kenbaiki de kaemasu."}],"note":"Physical card sales vary by station. Visitors can also use the Welcome Suica app on an iPhone, which needs no deposit.","level":"core","romaji":"suika o kaitai n desu ga."},{"id":"trains-ic-02","speaker":"you","jp":"ICカードはどこで買えますか。","kana":"アイシーカード は どこ で かえます か。","meaning":"Where can I buy an IC card?","replies":[{"jp":"券売機か、窓口で買えます。","kana":"けんばいき か、 まどぐち で かえます。","meaning":"You can buy it at a machine or at the window.","romaji":"kenbaiki ka, madoguchi de kaemasu."}],"level":"useful","romaji":"aishiikaado wa doko de kaemasu ka."},{"id":"trains-ic-03","speaker":"you","jp":"チャージしたいんですが。","kana":"チャージ したい ん です が。","meaning":"I want to top up.","replies":[{"jp":"券売機でできます。","kana":"けんばいき で できます。","meaning":"You can do it at the machine.","romaji":"kenbaiki de dekimasu."},{"jp":"「チャージ」ボタンを押してください。","kana":"「チャージ」 ボタン を おして ください。","meaning":"Press the top-up button.","romaji":"\"chaaji\" botan o oshite kudasai."}],"note":"Many top-up machines take cash only. Some machines write 入金 (にゅうきん, deposit) instead of チャージ.","level":"core","romaji":"chaaji shitai n desu ga."},{"id":"trains-ic-04","speaker":"announcement","jp":"金額を選んでください。","kana":"きんがく を えらんで ください。","meaning":"Please choose the amount.","also_heard":[{"jp":"お金を入れてください。","kana":"おかね を いれて ください。","meaning":"Please insert the money.","romaji":"okane o irete kudasai."}],"level":"listen-only","romaji":"kingaku o erande kudasai."},{"id":"trains-ic-05","speaker":"announcement","jp":"残高が不足しています。","kana":"ざんだか が ふそく して います。","meaning":"Your balance is insufficient.","also_heard":[{"jp":"チャージしてください。","kana":"チャージ して ください。","meaning":"Please top up.","romaji":"chaaji shite kudasai."},{"jp":"精算してください。","kana":"せいさん して ください。","meaning":"Please make the fare adjustment.","romaji":"seisan shite kudasai."}],"note":"Go to the fare adjustment machine beside the gates, or to the staffed window.","level":"core","romaji":"zandaka ga fusoku shite imasu."},{"id":"trains-ic-06","speaker":"announcement","jp":"もう一度タッチしてください。","kana":"もういちど タッチ して ください。","meaning":"Please touch again.","also_heard":[{"jp":"カードを1枚だけタッチしてください。","kana":"カード を いちまい だけ タッチ して ください。","meaning":"Please touch only one card.","romaji":"kaado o ichimai dake tatchi shite kudasai."}],"note":"Often caused by two IC cards in one wallet or a tap that was too quick. Hold the card still on the reader for a moment.","level":"listen-only","romaji":"mouichido tatchi shite kudasai."},{"id":"trains-ic-07","speaker":"announcement","jp":"係員のいる窓口へお越しください。","kana":"かかりいん の いる まどぐち へ おこし ください。","meaning":"Please go to the window where staff are.","also_heard":[{"jp":"駅係員にお尋ねください。","kana":"えきかかりいん に おたずね ください。","meaning":"Please ask the station staff.","romaji":"ekikakariin ni otazune kudasai."}],"level":"listen-only","romaji":"kakariin no iru madoguchi e okoshi kudasai."},{"id":"trains-ic-08","speaker":"you","jp":"カードが通らないんですが。","kana":"カード が とおらない ん です が。","meaning":"My card won't go through.","replies":[{"jp":"カードをお預かりします。","kana":"カード を おあずかり します。","meaning":"I'll take your card.","romaji":"kaado o oazukari shimasu."},{"jp":"どちらから乗られましたか。","kana":"どちら から のられました か。","meaning":"Where did you get on?","romaji":"dochira kara noraremashita ka."}],"note":"Answer with the station you boarded at, such as 上野からです (from Ueno).","level":"core","romaji":"kaado ga tooranai n desu ga."},{"id":"trains-ic-09","speaker":"staff","jp":"どちらから乗られましたか。","kana":"どちら から のられました か。","meaning":"Which station did you get on at?","replies":[{"jp":"上野からです。","kana":"うえの から です。","meaning":"From Ueno.","romaji":"ueno kara desu."},{"jp":"名古屋からです。","kana":"なごや から です。","meaning":"From Nagoya.","romaji":"nagoya kara desu."}],"level":"core","romaji":"dochira kara noraremashita ka."},{"id":"trains-ic-10","speaker":"you","jp":"乗り越し精算機はどこですか。","kana":"のりこし せいさんき は どこ です か。","meaning":"Where is the fare adjustment machine?","replies":[{"jp":"改札の手前、右側にあります。","kana":"かいさつ の てまえ、 みぎがわ に あります。","meaning":"It's on the right, just before the gates.","romaji":"kaisatsu no temae, migigawa ni arimasu."}],"note":"Insert your card or ticket, then pay the shortfall (不足額, ふそくがく) shown on the screen.","level":"useful","romaji":"norikoshi seisanki wa doko desu ka."},{"id":"trains-ic-11","speaker":"announcement","jp":"精算が完了しました。","kana":"せいさん が かんりょう しました。","meaning":"The fare adjustment is complete.","note":"The screen also shows 不足額 (shortfall) and 精算額 (amount to pay).","level":"listen-only","romaji":"seisan ga kanryou shimashita."},{"id":"trains-ic-12","speaker":"you","jp":"残高を確認したいです。","kana":"ざんだか を かくにん したい です。","meaning":"I want to check the balance.","note":"Gates and machines show the remaining balance after you tap.","level":"useful","romaji":"zandaka o kakunin shitai desu."}]},{"title":"Ticket machines, fare maps and paper tickets","intro":"Where IC cards are not enough, or for special tickets, read the fare map and buy a paper ticket.","phrases":[{"id":"trains-ticket-01","speaker":"you","jp":"浅草までいくらですか。","kana":"あさくさ まで いくら です か。","meaning":"How much is it to Asakusa?","replies":[{"jp":"上の路線図で確認してください。","kana":"うえ の ろせんず で かくにん して ください。","meaning":"Please check on the route map above.","romaji":"ue no rosenzu de kakunin shite kudasai."}],"note":"The fare map above the machine shows the fare under each station. Find your stop, then press that fare. Swap 浅草 for 上野 or 品川.","level":"core","romaji":"asakusa made ikura desu ka."},{"id":"trains-ticket-02","speaker":"you","jp":"どの切符を買えばいいですか。","kana":"どの きっぷ を かえば いい です か。","meaning":"Which ticket should I buy?","replies":[{"jp":"こちらの券売機で「河口湖」を押してください。","kana":"こちら の けんばいき で「かわぐちこ」 を おして ください。","meaning":"Press 河口湖 on this machine.","romaji":"kochira no kenbaiki de\"kawaguchiko\" o oshite kudasai."},{"jp":"乗車券と特急券が必要です。","kana":"じょうしゃけん と とっきゅうけん が ひつよう です。","meaning":"You need a base fare ticket and an express ticket.","romaji":"joushaken to tokkyuuken ga hitsuyou desu."}],"note":"A limited express needs a base fare ticket plus an express ticket. Some machines sell both as one ticket.","level":"core","romaji":"dono kippu o kaeba ii desu ka."},{"id":"trains-ticket-03","speaker":"you","jp":"河口湖まで行きたいんですが、どの切符ですか。","kana":"かわぐちこ まで いき たい ん です が、 どの きっぷ です か。","meaning":"I want to go to Kawaguchiko. Which ticket is it?","level":"useful","romaji":"kawaguchiko made iki tai n desu ga, dono kippu desu ka."},{"id":"trains-ticket-04","speaker":"announcement","jp":"行き先を選んでください。","kana":"いきさき を えらんで ください。","meaning":"Please select your destination.","level":"listen-only","romaji":"ikisaki o erande kudasai."},{"id":"trains-ticket-05","speaker":"announcement","jp":"人数を選んでください。","kana":"にんずう を えらんで ください。","meaning":"Please select the number of people.","note":"Buttons read 大人 (adult) and 小人 (child).","level":"listen-only","romaji":"ninzuu o erande kudasai."},{"id":"trains-ticket-06","speaker":"you","jp":"片道を2枚ください。","kana":"かたみち を に まい ください。","meaning":"Two one-way tickets, please.","note":"For a round trip, say 往復 (おうふく) instead of 片道 (かたみち).","level":"useful","romaji":"katamichi o ni mai kudasai."},{"id":"trains-ticket-07","speaker":"you","jp":"乗り換えがありますが、この切符で大丈夫ですか。","kana":"のりかえ が あります が、 この きっぷ で だいじょうぶ です か。","meaning":"There is a transfer. Is this ticket OK?","replies":[{"jp":"はい、そのまま乗り換えられます。","kana":"はい、 そのまま のりかえ られます。","meaning":"Yes, you can transfer as it is.","romaji":"hai, sonomama norikae raremasu."},{"jp":"地下鉄は別の切符になります。","kana":"ちかてつ は べつ の きっぷ に なります。","meaning":"The subway needs a separate ticket.","romaji":"chikatetsu wa betsu no kippu ni narimasu."}],"note":"A JR ticket to a subway or private line usually needs a separate ticket, unless it is a joint ticket. An IC card avoids this.","level":"useful","romaji":"norikae ga arimasu ga, kono kippu de daijoubu desu ka."},{"id":"trains-ticket-08","speaker":"staff","jp":"どうされましたか。","kana":"どう されました か。","meaning":"What's the matter?","note":"This is the intercom reply after you press the call button, labelled 呼出 (よびだし).","level":"useful","romaji":"dou saremashita ka."},{"id":"trains-ticket-09","speaker":"you","jp":"切符が出てこないんですが。","kana":"きっぷ が でて こない ん です が。","meaning":"The ticket didn't come out.","note":"Press the call button for staff if the machine does not release your ticket.","level":"useful","romaji":"kippu ga dete konai n desu ga."},{"id":"trains-ticket-10","speaker":"staff","jp":"切符をお取りください。","kana":"きっぷ を おとり ください。","meaning":"Please take your ticket.","also_heard":[{"jp":"おつりをお取り忘れのないようご注意ください。","kana":"おつり を おとりわすれ の ない よう ごちゅうい ください。","meaning":"Please don't forget your change.","romaji":"otsuri o otoriwasure no nai you gochuui kudasai."}],"level":"listen-only","romaji":"kippu o otori kudasai."},{"id":"trains-ticket-11","speaker":"staff","jp":"切符は改札機に入れてください。","kana":"きっぷ は かいさつき に いれて ください。","meaning":"Please put the ticket into the gate.","note":"The ticket is collected at the exit gate. If you transfer, keep it. With two tickets, insert them together.","level":"listen-only","romaji":"kippu wa kaisatsuki ni irete kudasai."},{"id":"trains-ticket-12","speaker":"you","jp":"一日乗車券はありますか。","kana":"いちにち じょうしゃけん は あります か。","meaning":"Is there a one-day pass?","note":"Passes differ by company and city. Ask which lines the pass covers before you buy.","level":"useful","romaji":"ichinichi joushaken wa arimasu ka."}]},{"title":"Buying Shinkansen tickets","intro":"At みどりの窓口 or the reserved-seat machine, say the destination, date, time, number of people and seat type.","phrases":[{"id":"trains-buy-01","speaker":"you","jp":"名古屋まで、大人2枚お願いします。","kana":"なごや まで、 おとな に まい おねがい します。","meaning":"Two adults to Nagoya, please.","note":"Swap 名古屋 for 新大阪, 広島 or 東京. For children, say 小人 (こども) instead of 大人.","level":"core","romaji":"nagoya made, otona ni mai onegai shimasu."},{"id":"trains-buy-02","speaker":"staff","jp":"いつのご利用ですか。","kana":"いつ の ごりよう です か。","meaning":"When will you travel?","also_heard":[{"jp":"何日の何時ごろですか。","kana":"なんにち の なんじ ごろ です か。","meaning":"Which day, and about what time?","romaji":"nannichi no nanji goro desu ka."}],"replies":[{"jp":"12月17日の、10時ごろです。","kana":"じゅうにがつ じゅうしちにち の、 じゅうじ ごろ です。","meaning":"December 17, around 10 o'clock.","romaji":"juunigatsu juushichinichi no, juuji goro desu."},{"jp":"今日の、一番早いのをお願いします。","kana":"きょう の、 いちばん はやい の を おねがい します。","meaning":"Today, the earliest one, please.","romaji":"kyou no, ichiban hayai no o onegai shimasu."}],"note":"Know your date and a rough time before you reach the counter.","level":"core","romaji":"itsu no goriyou desu ka."},{"id":"trains-buy-03","speaker":"staff","jp":"指定席と自由席、どちらになさいますか。","kana":"していせき と じゆうせき、 どちら に なさいます か。","meaning":"Reserved or non-reserved?","also_heard":[{"jp":"グリーン車もございますが。","kana":"グリーンしゃ も ございます が。","meaning":"We also have Green car seats.","romaji":"guriinsha mo gozaimasu ga."}],"replies":[{"jp":"指定席でお願いします。","kana":"していせき で おねがい します。","meaning":"Reserved, please.","romaji":"shiteiseki de onegai shimasu."},{"jp":"一番安いのでいいです。","kana":"いちばん やすい の で いい です。","meaning":"The cheapest one is fine.","romaji":"ichiban yasui no de ii desu."}],"note":"A reserved seat is guaranteed. Non-reserved is cheaper, but you may have to stand if the train is full.","level":"core","romaji":"shiteiseki to jiyuuseki, dochira ni nasaimasu ka."},{"id":"trains-buy-04","speaker":"you","jp":"2人並びの席でお願いします。","kana":"ふたり ならび の せき で おねがい します。","meaning":"Two seats together, please.","replies":[{"jp":"並びのお席はご用意できません。前後でもよろしいですか。","kana":"ならび の おせき は ごよういできません。 ぜんご でも よろしい です か。","meaning":"We can't offer seats together. Is one in front of the other OK?","romaji":"narabi no oseki wa goyouidekimasen. zengo demo yoroshii desu ka."}],"note":"Seats together are not always free, so ask early. Same idea as 隣同士で (となりどうし, next to each other).","level":"core","romaji":"futari narabi no seki de onegai shimasu."},{"id":"trains-buy-05","speaker":"staff","jp":"窓側と通路側、どちらがよろしいですか。","kana":"まどがわ と つうろがわ、 どちら が よろしい です か。","meaning":"Window or aisle?","replies":[{"jp":"窓側がいいです。","kana":"まどがわ が いい です。","meaning":"Window, please.","romaji":"madogawa ga ii desu."},{"jp":"通路側でお願いします。","kana":"つうろがわ で おねがい します。","meaning":"Aisle, please.","romaji":"tsuurogawa de onegai shimasu."}],"level":"core","romaji":"madogawa to tsuurogawa, dochira ga yoroshii desu ka."},{"id":"trains-buy-06","speaker":"you","jp":"富士山が見える側の席はありますか。","kana":"ふじさん が みえる がわ の せき は あります か。","meaning":"Is there a seat on the Mt Fuji side?","replies":[{"jp":"E席でよろしいですか。","kana":"イーせき で よろしい です か。","meaning":"Is seat E all right?","romaji":"iiseki de yoroshii desu ka."}],"note":"On the Tokaido Shinkansen, the D and E seats face the mountain side. E is the usual pick for the view.","level":"useful","romaji":"fujisan ga mieru gawa no seki wa arimasu ka."},{"id":"trains-buy-07","speaker":"you","jp":"大きいスーツケースがあるので、特大荷物スペースつき座席をお願いします。","kana":"おおきい スーツケース が ある ので、 とくだい にもつ スペース つき ざせき を おねがい します。","meaning":"We have large suitcases, so please give us seats with large-baggage space.","replies":[{"jp":"スーツケースの3辺の合計は何センチですか。","kana":"スーツケース の さんぺん の ごうけい は なん センチ です か。","meaning":"What is the total of the three sides of the suitcase?","romaji":"suutsukeesu no sanpen no goukei wa nan senchi desu ka."},{"jp":"一番後ろの席になります。","kana":"いちばん うしろ の せき に なります。","meaning":"It will be the last row.","romaji":"ichiban ushiro no seki ni narimasu."}],"note":"Tokaido, Sanyo and Kyushu lines: bags with three sides totalling 160 to 250 cm need this seat. Without a reservation, a 1,000 yen fee applies. Over 250 cm cannot be taken on.","level":"core","romaji":"ookii suutsukeesu ga aru node, tokudai nimotsu supeesu tsuki zaseki o onegai shimasu."},{"id":"trains-buy-08","speaker":"staff","jp":"この期間、のぞみは全席指定です。自由席はございません。","kana":"この きかん、 のぞみ は ぜんせきしてい です。 じゆうせき は ございません。","meaning":"During this period all Nozomi seats are reserved. There are no non-reserved seats.","also_heard":[{"jp":"ひかり・こだまには自由席がございます。","kana":"ひかり・こだま に は じゆうせき が ございます。","meaning":"Hikari and Kodama have non-reserved seats.","romaji":"hikari kodama ni wa jiyuuseki ga gozaimasu."}],"note":"Around New Year all Nozomi seats are reserved (reported as 25 Dec to 5 Jan this winter). Your Nagoya to Hiroshima and Hiroshima to Osaka legs fall in that window, so reserve early.","level":"listen-only","romaji":"kono kikan, nozomi wa zensekishitei desu. jiyuuseki wa gozaimasen."},{"id":"trains-buy-09","speaker":"staff","jp":"その列車は満席です。","kana":"その れっしゃ は まんせき です。","meaning":"That train is full.","also_heard":[{"jp":"指定席は売り切れです。","kana":"していせき は うりきれ です。","meaning":"Reserved seats are sold out.","romaji":"shiteiseki wa urikire desu."}],"level":"core","romaji":"sono ressha wa manseki desu."},{"id":"trains-buy-10","speaker":"staff","jp":"次の列車でもよろしいですか。","kana":"つぎ の れっしゃ でも よろしい です か。","meaning":"Is the next train OK?","also_heard":[{"jp":"11時の便なら空いております。","kana":"じゅういちじ の びん なら あいて おります。","meaning":"The 11 o'clock has seats.","romaji":"juuichiji no bin nara aite orimasu."}],"replies":[{"jp":"はい、それでお願いします。","kana":"はい、 それで おねがい します。","meaning":"Yes, that one, please.","romaji":"hai, sorede onegai shimasu."},{"jp":"一番早い空いている列車をお願いします。","kana":"いちばん はやい あいて いる れっしゃ を おねがい します。","meaning":"The earliest train with seats, please.","romaji":"ichiban hayai aite iru ressha o onegai shimasu."}],"level":"core","romaji":"tsugi no ressha demo yoroshii desu ka."},{"id":"trains-buy-11","speaker":"announcement","jp":"列車を選んでください。","kana":"れっしゃ を えらんで ください。","meaning":"Please select a train.","also_heard":[{"jp":"座席表から選んでください。","kana":"ざせきひょう から えらんで ください。","meaning":"Please select from the seat map.","romaji":"zasekihyou kara erande kudasai."}],"note":"Machine steps: choose the train, pick a seat on the map, then confirm. The base fare and express ticket are printed together or separately.","level":"listen-only","romaji":"ressha o erande kudasai."},{"id":"trains-buy-12","speaker":"staff","jp":"お支払いはどうされますか。","kana":"おしはらい は どう されます か。","meaning":"How will you pay?","also_heard":[{"jp":"こちらでよろしいですか。ご確認ください。","kana":"こちら で よろしい です か。 ごかくにん ください。","meaning":"Is this correct? Please check.","romaji":"kochira de yoroshii desu ka. gokakunin kudasai."}],"replies":[{"jp":"カードでお願いします。","kana":"カード で おねがい します。","meaning":"By card, please.","romaji":"kaado de onegai shimasu."},{"jp":"現金でお願いします。","kana":"げんきん で おねがい します。","meaning":"Cash, please.","romaji":"genkin de onegai shimasu."}],"note":"Before you leave the counter, check the date, time, car number (号車) and seat on the ticket.","level":"core","romaji":"oshiharai wa dou saremasu ka."},{"id":"trains-buy-13","speaker":"staff","jp":"乗車券と特急券、2枚重ねて改札にお通しください。","kana":"じょうしゃけん と とっきゅうけん、 にまい かさねて かいさつ に おとおし ください。","meaning":"Please put the base fare ticket and the express ticket through the gate together.","level":"listen-only","romaji":"joushaken to tokkyuuken, nimai kasanete kaisatsu ni otooshi kudasai."}]},{"title":"Changing, refunding and picking up Shinkansen tickets","intro":"Changing the time, cancelling, and collecting tickets booked online.","phrases":[{"id":"trains-change-01","speaker":"you","jp":"時間を変更したいんですが。","kana":"じかん を へんこう したい ん です が。","meaning":"I'd like to change the time.","replies":[{"jp":"発車時刻前でしたら変更可能です。","kana":"はっしゃじこく まえ でしたら へんこう かのう です。","meaning":"You can change it before the departure time.","romaji":"hasshajikoku mae deshitara henkou kanou desu."}],"note":"Changes are only possible before departure. A fee may apply, so ask for the amount before you agree.","level":"core","romaji":"jikan o henkou shitai n desu ga."},{"id":"trains-change-02","speaker":"you","jp":"もっと早い列車に変更できますか。","kana":"もっと はやい れっしゃ に へんこう できます か。","meaning":"Can I change to an earlier train?","level":"useful","romaji":"motto hayai ressha ni henkou dekimasu ka."},{"id":"trains-change-03","speaker":"you","jp":"払い戻しできますか。","kana":"はらいもどし できます か。","meaning":"Can I get a refund?","replies":[{"jp":"手数料がかかります。","kana":"てすうりょう が かかります。","meaning":"A fee applies.","romaji":"tesuuryou ga kakarimasu."}],"note":"Refunds carry a fee. Ask the staff for the exact amount before you agree.","level":"useful","romaji":"haraimodoshi dekimasu ka."},{"id":"trains-change-04","speaker":"staff","jp":"乗り遅れた場合、当日の後続列車の自由席にご乗車いただけます。","kana":"のりおくれた ばあい、 とうじつ の こうぞく れっしゃ の じゆうせき に ごじょうしゃ いただけます。","meaning":"If you miss your train, you can board a non-reserved seat on a later train that day.","note":"This may not apply on all-Nozomi days (25 Dec to 5 Jan). Hikari and Kodama still have non-reserved seats. Confirm at the window.","level":"listen-only","romaji":"noriokureta baai, toujitsu no kouzoku ressha no jiyuuseki ni gojousha itadakemasu."},{"id":"trains-change-05","speaker":"you","jp":"ネットで予約した切符を受け取りたいです。","kana":"ネット で よやく した きっぷ を うけとり たい です。","meaning":"I'd like to pick up a ticket I booked online.","replies":[{"jp":"予約番号はありますか。","kana":"よやく ばんごう は あります か。","meaning":"Do you have the reservation number?","romaji":"yoyaku bangou wa arimasu ka."},{"jp":"指定席券売機で受け取れます。","kana":"していせきけんばいき で うけとれます。","meaning":"You can collect it at the reserved-seat machine.","romaji":"shiteisekikenbaiki de uketoremasu."},{"jp":"QRコードをかざしてください。","kana":"キューアールコード を かざして ください。","meaning":"Please hold up the QR code.","romaji":"kyuuaarukoodo o kazashite kudasai."}],"note":"Have the reservation number or the QR code ready on your phone or on paper.","level":"core","romaji":"netto de yoyaku shita kippu o uketori tai desu."},{"id":"trains-change-06","speaker":"you","jp":"これが予約番号です。","kana":"これ が よやく ばんごう です。","meaning":"Here is the reservation number.","level":"core","romaji":"kore ga yoyaku bangou desu."},{"id":"trains-change-07","speaker":"you","jp":"QRコードはこれです。","kana":"キューアールコード は これ です。","meaning":"Here is the QR code.","level":"core","romaji":"kyuuaarukoodo wa kore desu."},{"id":"trains-change-08","speaker":"announcement","jp":"QRコードを読み取ってください。","kana":"キューアールコード を よみとって ください。","meaning":"Please scan the QR code.","note":"The machine menu item 予約した切符の受け取り means collecting a reserved ticket.","level":"listen-only","romaji":"kyuuaarukoodo o yomitotte kudasai."},{"id":"trains-change-09","speaker":"announcement","jp":"予約に使ったクレジットカードを入れてください。","kana":"よやく に つかった クレジットカード を いれて ください。","meaning":"Please insert the credit card you used to book.","note":"Some machines need the same card that paid for the booking.","level":"listen-only","romaji":"yoyaku ni tsukatta kurejittokaado o irete kudasai."},{"id":"trains-change-10","speaker":"staff","jp":"交通系ICカードでそのままご乗車いただけます。","kana":"こうつうけい アイシーカード で そのまま ごじょうしゃ いただけます。","meaning":"You can board directly with your IC card.","note":"Ticketless boarding depends on how the app is set up. If the gate will not accept your card, ask staff.","level":"listen-only","romaji":"koutsuukei aishiikaado de sonomama gojousha itadakemasu."},{"id":"trains-change-11","speaker":"staff","jp":"変更は発車時刻の前までです。発車後は変更できません。","kana":"へんこう は はっしゃじこく の まえ まで です。 はっしゃご は へんこう できません。","meaning":"Changes are only possible until departure. After departure you cannot change.","level":"listen-only","romaji":"henkou wa hasshajikoku no mae made desu. hasshago wa henkou dekimasen."},{"id":"trains-change-12","speaker":"you","jp":"指定席を自由席に変えられますか。","kana":"していせき を じゆうせき に かえられます か。","meaning":"Can I change from reserved to non-reserved?","note":"Ask at the window before the train leaves. The answer depends on your ticket.","level":"useful","romaji":"shiteiseki o jiyuuseki ni kaeraremasu ka."}]},{"title":"Gates and platforms: finding the right train","intro":"Which platform, which car, where to line up, and whether this is the right train.","phrases":[{"id":"trains-platform-01","speaker":"you","jp":"名古屋行きは何番線ですか。","kana":"なごや いき は なんばんせん です か。","meaning":"Which platform is the train for Nagoya?","replies":[{"jp":"階段を上がって右です。","kana":"かいだん を あがって みぎ です。","meaning":"Up the stairs, on the right.","romaji":"kaidan o agatte migi desu."},{"jp":"新幹線のホームは、あちらです。","kana":"しんかんせん の ホーム は、 あちら です。","meaning":"The Shinkansen platform is over there.","romaji":"shinkansen no hoomu wa, achira desu."}],"note":"Platform numbers change, so check the board above the gate. Swap 名古屋 for 新大阪, 広島 or 東京.","level":"core","romaji":"nagoya iki wa nanbansen desu ka."},{"id":"trains-platform-02","speaker":"you","jp":"新幹線ののりばはどこですか。","kana":"しんかんせん の のりば は どこ です か。","meaning":"Where is the Shinkansen boarding area?","level":"useful","romaji":"shinkansen no noriba wa doko desu ka."},{"id":"trains-platform-03","speaker":"you","jp":"この電車は三ノ宮に止まりますか。","kana":"この でんしゃ は さんのみや に とまります か。","meaning":"Does this train stop at Sannomiya?","replies":[{"jp":"はい、止まります。","kana":"はい、 とまります。","meaning":"Yes, it stops there.","romaji":"hai, tomarimasu."},{"jp":"いいえ、止まりません。次の普通に乗ってください。","kana":"いいえ、 とまりません。 つぎ の ふつう に のって ください。","meaning":"No, it doesn't. Take the next local train.","romaji":"iie, tomarimasen. tsugi no futsuu ni notte kudasai."},{"jp":"快速なら止まります。","kana":"かいそく なら とまります。","meaning":"A rapid train does stop there.","romaji":"kaisoku nara tomarimasu."}],"note":"Local trains stop at every station. Read the train type sign before you board.","level":"core","romaji":"kono densha wa sannomiya ni tomarimasu ka."},{"id":"trains-platform-04","speaker":"you","jp":"これは舞浜に行きますか。","kana":"これ は まいはま に いきます か。","meaning":"Does this one go to Maihama?","replies":[{"jp":"はい、行きます。","kana":"はい、 いきます。","meaning":"Yes, it does.","romaji":"hai, ikimasu."},{"jp":"反対側のホームです。","kana":"はんたいがわ の ホーム です。","meaning":"It's the platform on the other side.","romaji":"hantaigawa no hoomu desu."}],"note":"Maihama (Disney) is on the Keiyo line. Check the destination on the front sign of the train.","level":"core","romaji":"kore wa maihama ni ikimasu ka."},{"id":"trains-platform-05","speaker":"you","jp":"これは浅草行きですか。","kana":"これ は あさくさ いき です か。","meaning":"Is this the train for Asakusa?","note":"Swap 浅草 for 上野, 東京 or 品川.","level":"useful","romaji":"kore wa asakusa iki desu ka."},{"id":"trains-platform-06","speaker":"you","jp":"何号車ですか。","kana":"なんごうしゃ です か。","meaning":"Which car is this?","level":"useful","romaji":"nangousha desu ka."},{"id":"trains-platform-07","speaker":"you","jp":"7号車はどのあたりですか。","kana":"ななごうしゃ は どの あたり です か。","meaning":"Where does car 7 stop?","replies":[{"jp":"足元の表示を見てください。","kana":"あしもと の ひょうじ を みて ください。","meaning":"Look at the markings on the floor.","romaji":"ashimoto no hyouji o mite kudasai."},{"jp":"7号車はこの辺りです。","kana":"ななごうしゃ は この あたり です。","meaning":"Car 7 is around here.","romaji":"nanagousha wa kono atari desu."}],"note":"Floor markings show where each car stops and where the queue lines are.","level":"useful","romaji":"nanagousha wa dono atari desu ka."},{"id":"trains-platform-08","speaker":"you","jp":"どこに並べばいいですか。","kana":"どこ に ならべば いい です か。","meaning":"Where should I line up?","note":"Follow the queue lines on the platform floor.","level":"useful","romaji":"doko ni narabeba ii desu ka."},{"id":"trains-platform-09","speaker":"you","jp":"次の電車は何時ですか。","kana":"つぎ の でんしゃ は なんじ です か。","meaning":"When is the next train?","level":"useful","romaji":"tsugi no densha wa nanji desu ka."},{"id":"trains-platform-10","speaker":"you","jp":"終電は何時ですか。","kana":"しゅうでん は なんじ です か。","meaning":"What time is the last train?","level":"useful","romaji":"shuuden wa nanji desu ka."},{"id":"trains-platform-11","speaker":"you","jp":"始発は何時ですか。","kana":"しはつ は なんじ です か。","meaning":"What time is the first train?","note":"On departure boards, 先発 is the first train, 次発 the next and 次々発 the one after.","level":"useful","romaji":"shihatsu wa nanji desu ka."},{"id":"trains-platform-12","speaker":"you","jp":"一番早く着くのはどれですか。","kana":"いちばん はやく つく の は どれ です か。","meaning":"Which one gets there fastest?","level":"useful","romaji":"ichiban hayaku tsuku no wa dore desu ka."},{"id":"trains-platform-13","speaker":"staff","jp":"この電車は当駅止まりです。","kana":"この でんしゃ は とうえきどまり です。","meaning":"This train terminates here.","also_heard":[{"jp":"回送電車です。ご乗車になれません。","kana":"かいそう でんしゃ です。 ごじょうしゃ に なれません。","meaning":"This is an out-of-service train, so you cannot board.","romaji":"kaisou densha desu. gojousha ni naremasen."}],"note":"The train is going to the depot. Do not board it.","level":"listen-only","romaji":"kono densha wa touekidomari desu."},{"id":"trains-platform-14","speaker":"staff","jp":"前の方が空いていますよ。","kana":"まえ の ほう が あいて います よ。","meaning":"It's emptier toward the front.","level":"listen-only","romaji":"mae no hou ga aite imasu yo."}]},{"title":"Platform and in-train announcements","intro":"Standard recorded wording. Listen for the keywords: 番線, まいります, 行き, 次は, お出口, 乗り換え, 見合わせ.","phrases":[{"id":"trains-announce-01","speaker":"announcement","jp":"まもなく、2番線に、東京方面行きの電車がまいります。","kana":"まもなく、 にばんせん に、 とうきょう ほうめん いき の でんしゃ が まいります。","meaning":"Soon, a train bound for the Tokyo direction will arrive at platform 2.","note":"まいります means the train is coming in. Listen for the platform number and the direction.","level":"listen-only","romaji":"mamonaku, nibansen ni, toukyou houmen iki no densha ga mairimasu."},{"id":"trains-announce-02","speaker":"announcement","jp":"危ないですから、黄色い線の内側までお下がりください。","kana":"あぶない です から、 きいろい せん の うちがわ まで おさがり ください。","meaning":"For your safety, please step back behind the yellow line.","also_heard":[{"jp":"ホームドアから離れてください。","kana":"ホームドア から はなれて ください。","meaning":"Please move away from the platform door.","romaji":"hoomudoa kara hanarete kudasai."}],"note":"The yellow line is the edge warning. Some stations say 黄色い点字ブロック, but 黄色い線 is the common wording.","level":"listen-only","romaji":"abunai desu kara, kiiroi sen no uchigawa made osagari kudasai."},{"id":"trains-announce-03","speaker":"announcement","jp":"ドアが閉まります。ご注意ください。","kana":"ドア が しまります。 ごちゅうい ください。","meaning":"The doors are closing. Please be careful.","also_heard":[{"jp":"駆け込み乗車はおやめください。","kana":"かけこみじょうしゃ は おやめ ください。","meaning":"Please don't rush onto the train.","romaji":"kakekomijousha wa oyame kudasai."}],"level":"listen-only","romaji":"doa ga shimarimasu. gochuui kudasai."},{"id":"trains-announce-04","speaker":"announcement","jp":"次は、浅草、浅草です。","kana":"つぎ は、 あさくさ、 あさくさ です。","meaning":"The next stop is Asakusa, Asakusa.","note":"次は is the key phrase. The station name follows it.","level":"core","romaji":"tsugi wa, asakusa, asakusa desu."},{"id":"trains-announce-05","speaker":"announcement","jp":"お出口は右側です。","kana":"おでぐち は みぎがわ です。","meaning":"The doors open on the right side.","note":"Listen for 右側 (right) and 左側 (left). Check which side your exit is on.","level":"core","romaji":"odeguchi wa migigawa desu."},{"id":"trains-announce-06","speaker":"announcement","jp":"銀座線はお乗り換えです。","kana":"ぎんざせん は おのりかえ です。","meaning":"Transfer here for the Ginza line.","also_heard":[{"jp":"東京メトロ線、都営浅草線はお乗り換えください。","kana":"とうきょう メトロ せん、 とえい あさくさせん は おのりかえ ください。","meaning":"Please transfer here for the Tokyo Metro and Toei Asakusa lines.","romaji":"toukyou metoro sen, toei asakusasen wa onorikae kudasai."}],"level":"listen-only","romaji":"ginzasen wa onorikae desu."},{"id":"trains-announce-07","speaker":"announcement","jp":"この電車は、各駅停車、品川行きです。","kana":"この でんしゃ は、 かくえきていしゃ、 しながわ いき です。","meaning":"This is a local train bound for Shinagawa.","level":"listen-only","romaji":"kono densha wa, kakuekiteisha, shinagawa iki desu."},{"id":"trains-announce-08","speaker":"announcement","jp":"終点、東京です。","kana":"しゅうてん、 とうきょう です。","meaning":"This is the last stop, Tokyo.","level":"listen-only","romaji":"shuuten, toukyou desu."},{"id":"trains-announce-09","speaker":"announcement","jp":"お忘れ物のないようご注意ください。","kana":"おわすれもの の ない よう ごちゅうい ください。","meaning":"Please take care not to leave anything behind.","level":"listen-only","romaji":"owasuremono no nai you gochuui kudasai."},{"id":"trains-announce-10","speaker":"announcement","jp":"ただいま、人身事故の影響で、運転を見合わせております。","kana":"ただいま、 じんしん じこ の えいきょう で、 うんてん を みあわせて おります。","meaning":"Right now, service is suspended because of a person-related accident.","also_heard":[{"jp":"強風の影響で、運転を見合わせております。","kana":"きょうふう の えいきょう で、 うんてん を みあわせて おります。","meaning":"Service is suspended because of strong winds.","romaji":"kyoufuu no eikyou de, unten o miawasete orimasu."}],"note":"見合わせ means suspended, not cancelled. Listen for when it will restart.","level":"core","romaji":"tadaima, jinshin jiko no eikyou de, unten o miawasete orimasu."},{"id":"trains-announce-11","speaker":"announcement","jp":"ただいま、遅れが出ております。","kana":"ただいま、 おくれ が でて おります。","meaning":"Right now, there are delays.","level":"listen-only","romaji":"tadaima, okure ga dete orimasu."},{"id":"trains-announce-12","speaker":"announcement","jp":"運転を再開しました。","kana":"うんてん を さいかい しました。","meaning":"Service has resumed.","level":"listen-only","romaji":"unten o saikai shimashita."},{"id":"trains-announce-13","speaker":"announcement","jp":"現在、振替輸送を実施しております。","kana":"げんざい、 ふりかえ ゆそう を じっし して おります。","meaning":"Alternative transport is now in operation.","note":"Other lines or buses take over. Ask staff how your ticket is handled, as IC card users usually just pay the other line.","level":"listen-only","romaji":"genzai, furikae yusou o jisshi shite orimasu."},{"id":"trains-announce-14","speaker":"announcement","jp":"今日も新幹線をご利用くださいまして、ありがとうございます。","kana":"きょう も しんかんせん を ごりよう くださいまして、 ありがとう ございます。","meaning":"Thank you for riding the Shinkansen today.","level":"listen-only","romaji":"kyou mo shinkansen o goriyou kudasaimashite, arigatou gozaimasu."},{"id":"trains-announce-15","speaker":"announcement","jp":"この電車は、のぞみ号、新大阪行きです。","kana":"この でんしゃ は、 のぞみごう、 しんおおさか いき です。","meaning":"This is the Nozomi train bound for Shin-Osaka.","also_heard":[{"jp":"途中の停車駅は、品川、新横浜、名古屋、京都です。","kana":"とちゅう の ていしゃえき は、 しながわ、 しんよこはま、 なごや、 きょうと です。","meaning":"The stops on the way are Shinagawa, Shin-Yokohama, Nagoya and Kyoto.","romaji":"tochuu no teishaeki wa, shinagawa, shin'yokohama, nagoya, kyouto desu."}],"level":"listen-only","romaji":"kono densha wa, nozomigou, shin'oosaka iki desu."},{"id":"trains-announce-16","speaker":"announcement","jp":"まもなく、名古屋に到着します。","kana":"まもなく、 なごや に とうちゃく します。","meaning":"We will arrive at Nagoya soon.","note":"Get your bags and check the door side before the stop.","level":"listen-only","romaji":"mamonaku, nagoya ni touchaku shimasu."},{"id":"trains-announce-17","speaker":"announcement","jp":"揺れることがありますので、ご注意ください。","kana":"ゆれる こと が あります ので、 ごちゅうい ください。","meaning":"The train may shake, so please be careful.","also_heard":[{"jp":"車内での喫煙はご遠慮ください。","kana":"しゃない で の きつえん は ごえんりょ ください。","meaning":"Please refrain from smoking on board.","romaji":"shanai de no kitsuen wa goenryo kudasai."}],"level":"listen-only","romaji":"yureru koto ga arimasu node, gochuui kudasai."}]},{"title":"On board","intro":"Seats, luggage, ticket checks and manners on the train.","phrases":[{"id":"trains-board-01","speaker":"you","jp":"この席、空いていますか。","kana":"この せき、 あいて います か。","meaning":"Is this seat free?","replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Please, go ahead.","romaji":"douzo."},{"jp":"すみません、連れがいます。","kana":"すみません、 つれ が います。","meaning":"Sorry, someone is with me.","romaji":"sumimasen, tsure ga imasu."}],"level":"core","romaji":"kono seki, aite imasu ka."},{"id":"trains-board-02","speaker":"you","jp":"すみません、ここ、私の席だと思うんですが。","kana":"すみません、 ここ、 わたし の せき だ と おもう ん です が。","meaning":"Excuse me, I think this is my seat.","replies":[{"jp":"あ、すみません。","kana":"あ、 すみません。","meaning":"Oh, sorry.","romaji":"a, sumimasen."},{"jp":"何号車ですか。","kana":"なんごうしゃ です か。","meaning":"Which car are you in?","romaji":"nangousha desu ka."}],"note":"Show your ticket. Often the other person is in the wrong car.","level":"core","romaji":"sumimasen, koko, watashi no seki da to omou n desu ga."},{"id":"trains-board-03","speaker":"you","jp":"席を倒してもいいですか。","kana":"せき を たおして も いい です か。","meaning":"May I recline the seat?","replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Go ahead.","romaji":"douzo."}],"level":"core","romaji":"seki o taoshite mo ii desu ka."},{"id":"trains-board-04","speaker":"you","jp":"荷物をここに置いてもいいですか。","kana":"にもつ を ここ に おいて も いい です か。","meaning":"May I put my bag here?","replies":[{"jp":"そこは特大荷物スペースです。","kana":"そこ は とくだい にもつ スペース です。","meaning":"That is the large-baggage space.","romaji":"soko wa tokudai nimotsu supeesu desu."}],"note":"The large-baggage space is for reserved seats. Ask staff before you use it if you are unsure.","level":"core","romaji":"nimotsu o koko ni oite mo ii desu ka."},{"id":"trains-board-05","speaker":"you","jp":"網棚に載せてもいいですか。","kana":"あみだな に のせて も いい です か。","meaning":"May I put it on the overhead rack?","level":"useful","romaji":"amidana ni nosete mo ii desu ka."},{"id":"trains-board-06","speaker":"staff","jp":"失礼いたします。乗車券を拝見します。","kana":"しつれい いたします。 じょうしゃけん を はいけん します。","meaning":"Excuse me. May I see your ticket?","also_heard":[{"jp":"切符を拝見いたします。","kana":"きっぷ を はいけん いたします。","meaning":"May I see your ticket?","romaji":"kippu o haiken itashimasu."}],"replies":[{"jp":"はい、どうぞ。","kana":"はい、 どうぞ。","meaning":"Yes, here you are.","romaji":"hai, douzo."}],"note":"Checks are not always made on Shinkansen reserved seats, but they still happen, so have your ticket ready.","level":"listen-only","romaji":"shitsurei itashimasu. joushaken o haiken shimasu."},{"id":"trains-board-07","speaker":"staff","jp":"お客様、お荷物のサイズを確認させていただけますか。","kana":"おきゃくさま、 おにもつ の サイズ を かくにん させて いただけます か。","meaning":"May I check the size of your luggage?","replies":[{"jp":"予約しています。これがきっぷです。","kana":"よやく して います。 これ が きっぷ です。","meaning":"I have a reservation. This is my ticket.","romaji":"yoyaku shite imasu. kore ga kippu desu."}],"level":"listen-only","romaji":"okyakusama, onimotsu no saizu o kakunin sasete itadakemasu ka."},{"id":"trains-board-08","speaker":"staff","jp":"車内販売です。お弁当、お飲み物はいかがですか。","kana":"しゃないはんばい です。 おべんとう、 おのみもの は いかが です か。","meaning":"Onboard sales. Would you like a bento or a drink?","replies":[{"jp":"コーヒーを一つください。","kana":"コーヒー を ひとつ ください。","meaning":"One coffee, please.","romaji":"koohii o hitotsu kudasai."},{"jp":"大丈夫です。","kana":"だいじょうぶ です。","meaning":"No, thanks.","romaji":"daijoubu desu."}],"note":"The trolley sales on the Tokaido Shinkansen ended in October 2023. Green car passengers can order by phone, and standard cars buy from platform vending machines.","level":"listen-only","romaji":"shanaihanbai desu. obentou, onomimono wa ikaga desu ka."},{"id":"trains-board-09","speaker":"announcement","jp":"携帯電話はマナーモードに設定のうえ、通話はデッキでお願いいたします。","kana":"けいたいでんわ は マナーモード に せってい の うえ、 つうわ は デッキ で おねがい いたします。","meaning":"Please set your phone to silent mode, and take calls in the vestibule.","note":"デッキ is the vestibule between cars, where calls are allowed.","level":"listen-only","romaji":"keitaidenwa wa manaamoodo ni settei no ue, tsuuwa wa dekki de onegai itashimasu."},{"id":"trains-board-10","speaker":"announcement","jp":"優先席付近では混雑時には携帯電話の電源をお切りください。","kana":"ゆうせんせき ふきん では こんざつじ に は けいたいでんわ の でんげん を おきり ください。","meaning":"Near the priority seats, please turn off your phone when the train is crowded.","level":"listen-only","romaji":"yuusenseki fukin dewa konzatsuji ni wa keitaidenwa no dengen o okiri kudasai."},{"id":"trains-board-11","speaker":"announcement","jp":"優先席","kana":"ゆうせんせき","meaning":"Priority seat.","note":"Fine to sit if empty. Give up the seat when someone who needs it arrives.","level":"useful","romaji":"yuusenseki"},{"id":"trains-board-12","speaker":"you","jp":"次は名古屋ですか。","kana":"つぎ は なごや です か。","meaning":"Is the next stop Nagoya?","level":"useful","romaji":"tsugi wa nagoya desu ka."},{"id":"trains-board-13","speaker":"you","jp":"すみません、降ります。","kana":"すみません、 おります。","meaning":"Excuse me, I'm getting off.","note":"Say this to get through a crowd near the doors.","level":"core","romaji":"sumimasen, orimasu."},{"id":"trains-board-14","speaker":"you","jp":"席を替わりましょうか。","kana":"せき を かわりましょう か。","meaning":"Would you like my seat?","replies":[{"jp":"どうぞ。","kana":"どうぞ。","meaning":"Please, go ahead.","romaji":"douzo."}],"level":"useful","romaji":"seki o kawarimashou ka."}]},{"title":"Transfers, exits and big stations","intro":"Tokyo, Umeda and Nagoya stations are huge. Ask for the exit and line by name.","phrases":[{"id":"trains-transfer-01","speaker":"you","jp":"浅草線への乗り換えはどこですか。","kana":"あさくさせん へ の のりかえ は どこ です か。","meaning":"Where is the transfer to the Asakusa line?","replies":[{"jp":"案内に従って進んでください。","kana":"あんない に したがって すすんで ください。","meaning":"Please follow the signs.","romaji":"annai ni shitagatte susunde kudasai."},{"jp":"突き当たりを左です。","kana":"つきあたり を ひだり です。","meaning":"Turn left at the end.","romaji":"tsukiatari o hidari desu."},{"jp":"一度改札を出てください。","kana":"いちど かいさつ を でて ください。","meaning":"Please exit the gates once.","romaji":"ichido kaisatsu o dete kudasai."}],"level":"core","romaji":"asakusasen e no norikae wa doko desu ka."},{"id":"trains-transfer-02","speaker":"you","jp":"京葉線に乗り換えたいんですが。","kana":"けいようせん に のりかえ たい ん です が。","meaning":"I want to transfer to the Keiyo line.","note":"The Keiyo line goes to Maihama, for Disney. Swap the line name for the one you need.","level":"useful","romaji":"keiyousen ni norikae tai n desu ga."},{"id":"trains-transfer-03","speaker":"you","jp":"中央口はどっちですか。","kana":"ちゅうおうぐち は どっち です か。","meaning":"Which way is the central exit?","replies":[{"jp":"北口が近いです。","kana":"きたぐち が ちかい です。","meaning":"The north exit is closer.","romaji":"kitaguchi ga chikai desu."}],"note":"Exit names are on the signs, such as 丸の内口 and 八重洲口 at Tokyo, or 桜通口 at Nagoya.","level":"core","romaji":"chuuouguchi wa dotchi desu ka."},{"id":"trains-transfer-04","speaker":"you","jp":"何口から出ればいいですか。","kana":"なにぐち から でれば いい です か。","meaning":"Which exit should I use?","level":"core","romaji":"naniguchi kara dereba ii desu ka."},{"id":"trains-transfer-05","speaker":"you","jp":"ホテルに一番近い出口はどこですか。","kana":"ホテル に いちばん ちかい でぐち は どこ です か。","meaning":"Which exit is closest to the hotel?","note":"Show the hotel address on your phone, and say the hotel name in its place.","level":"core","romaji":"hoteru ni ichiban chikai deguchi wa doko desu ka."},{"id":"trains-transfer-06","speaker":"you","jp":"エレベーターはありますか。","kana":"エレベーター は あります か。","meaning":"Is there an elevator?","replies":[{"jp":"あちらにございます。","kana":"あちら に ございます。","meaning":"It's over there.","romaji":"achira ni gozaimasu."},{"jp":"ホームの端にあります。","kana":"ホーム の はし に あります。","meaning":"It's at the end of the platform.","romaji":"hoomu no hashi ni arimasu."}],"level":"core","romaji":"erebeetaa wa arimasu ka."},{"id":"trains-transfer-07","speaker":"you","jp":"スーツケースがあるので、エレベーターを使いたいです。","kana":"スーツケース が ある ので、 エレベーター を つかい たい です。","meaning":"We have suitcases, so we want to use the elevator.","level":"core","romaji":"suutsukeesu ga aru node, erebeetaa o tsukai tai desu."},{"id":"trains-transfer-08","speaker":"you","jp":"道に迷いました。今どこにいますか。","kana":"みち に まよいました。 いま どこ に います か。","meaning":"I'm lost. Where am I now?","level":"core","romaji":"michi ni mayoimashita. ima doko ni imasu ka."},{"id":"trains-transfer-09","speaker":"you","jp":"ここはどこですか。","kana":"ここ は どこ です か。","meaning":"Where is this?","note":"Point at your place on the station map and show it to staff.","level":"core","romaji":"koko wa doko desu ka."},{"id":"trains-transfer-10","speaker":"staff","jp":"一度改札を出て、乗り換えてください。","kana":"いちど かいさつ を でて、 のりかえて ください。","meaning":"Please exit the gates once, then transfer.","level":"listen-only","romaji":"ichido kaisatsu o dete, norikaete kudasai."},{"id":"trains-transfer-11","speaker":"staff","jp":"乗り換え改札をご利用ください。","kana":"のりかえかいさつ を ごりよう ください。","meaning":"Please use the transfer gate.","note":"Transfer gates between JR lines accept more than one ticket type. If you are unsure which gate to use, ask staff.","level":"listen-only","romaji":"norikaekaisatsu o goriyou kudasai."},{"id":"trains-transfer-12","speaker":"you","jp":"大阪駅と梅田駅は同じですか。","kana":"おおさかえき と うめだえき は おなじ です か。","meaning":"Are Osaka Station and Umeda Station the same?","note":"JR Osaka and the Hankyu or Hanshin Umeda stations are a walk apart, with separate gates. Subway Umeda is another station again.","level":"useful","romaji":"oosakaeki to umedaeki wa onaji desu ka."},{"id":"trains-transfer-13","speaker":"you","jp":"階段しかないですか。","kana":"かいだん しか ない です か。","meaning":"Are there only stairs?","level":"useful","romaji":"kaidan shika nai desu ka."},{"id":"trains-transfer-15","speaker":"staff","jp":"改札を出ずに乗り換えられます。","kana":"かいさつ を でず に のりかえ られます。","meaning":"You can transfer without leaving the gates.","level":"listen-only","romaji":"kaisatsu o dezu ni norikae raremasu."}]},{"title":"Coin lockers and luggage services","intro":"Store suitcases for a day trip, such as to Kobe, or send luggage ahead to your hotel.","phrases":[{"id":"trains-locker-01","speaker":"you","jp":"コインロッカーはどこですか。","kana":"コインロッカー は どこ です か。","meaning":"Where are the coin lockers?","replies":[{"jp":"改札を出て左です。","kana":"かいさつ を でて ひだり です。","meaning":"Left after the gates.","romaji":"kaisatsu o dete hidari desu."},{"jp":"南口の近くにあります。","kana":"みなみぐち の ちかく に あります。","meaning":"They are near the south exit.","romaji":"minamiguchi no chikaku ni arimasu."}],"level":"core","romaji":"koinrokkaa wa doko desu ka."},{"id":"trains-locker-02","speaker":"you","jp":"大きいロッカーはありますか。","kana":"おおきい ロッカー は あります か。","meaning":"Is there a large locker?","replies":[{"jp":"大型は全部使われています。","kana":"おおがた は ぜんぶ つかわれて います。","meaning":"All the large ones are in use.","romaji":"oogata wa zenbu tsukawarete imasu."}],"level":"core","romaji":"ookii rokkaa wa arimasu ka."},{"id":"trains-locker-03","speaker":"you","jp":"スーツケースが入るサイズのロッカーはありますか。","kana":"スーツケース が はいる サイズ の ロッカー は あります か。","meaning":"Is there a locker big enough for a suitcase?","note":"Lockers come in sizes labelled 大, 中 and 小 (large, medium, small). Suitcases need 大.","level":"core","romaji":"suutsukeesu ga hairu saizu no rokkaa wa arimasu ka."},{"id":"trains-locker-04","speaker":"announcement","jp":"ICカードで鍵をかけてください。","kana":"アイシーカード で かぎ を かけて ください。","meaning":"Please lock it with your IC card.","note":"On IC-card lockers, the same card opens and locks it. Do not lose the card.","level":"listen-only","romaji":"aishiikaado de kagi o kakete kudasai."},{"id":"trains-locker-05","speaker":"announcement","jp":"暗証番号を入力してください。","kana":"あんしょうばんごう を にゅうりょく して ください。","meaning":"Please enter your PIN.","note":"Some lockers use a PIN instead of a card. Keep the receipt in case you forget.","level":"listen-only","romaji":"anshoubangou o nyuuryoku shite kudasai."},{"id":"trains-locker-06","speaker":"announcement","jp":"レシートを取ってください。","kana":"レシート を とって ください。","meaning":"Please take the receipt.","note":"The receipt can show the locker code. Keep it safe until you collect your bags.","level":"listen-only","romaji":"reshiito o totte kudasai."},{"id":"trains-locker-07","speaker":"you","jp":"ロッカーが全部いっぱいなんですが、荷物を預けられる所はありますか。","kana":"ロッカー が ぜんぶ いっぱい な ん です が、 にもつ を あずけられる ところ は あります か。","meaning":"All the lockers are full. Is there anywhere I can leave my luggage?","replies":[{"jp":"手荷物預かり所があります。","kana":"てにもつあずかりじょ が あります。","meaning":"There is a baggage storage office.","romaji":"tenimotsuazukarijo ga arimasu."}],"level":"core","romaji":"rokkaa ga zenbu ippai na n desu ga, nimotsu o azukerareru tokoro wa arimasu ka."},{"id":"trains-locker-08","speaker":"staff","jp":"何時までにお受け取りですか。","kana":"なんじ まで に おうけとり です か。","meaning":"By what time will you collect them?","also_heard":[{"jp":"営業時間は20時までです。","kana":"えいぎょうじかん は にじゅうじ まで です。","meaning":"Opening hours are until 8 pm.","romaji":"eigyoujikan wa nijuuji made desu."}],"replies":[{"jp":"夕方6時ごろです。","kana":"ゆうがた ろくじ ごろ です。","meaning":"Around 6 pm.","romaji":"yuugata rokuji goro desu."}],"note":"Storage offices have opening hours. Check the closing time before you drop off your bags.","level":"listen-only","romaji":"nanji made ni ouketori desu ka."},{"id":"trains-locker-09","speaker":"you","jp":"荷物をホテルに送りたいです。","kana":"にもつ を ホテル に おくり たい です。","meaning":"I'd like to send my luggage to the hotel.","replies":[{"jp":"何時のお届けになりますか。","kana":"なんじ の おとどけ に なります か。","meaning":"What time would you like delivery?","romaji":"nanji no otodoke ni narimasu ka."},{"jp":"伝票に記入してください。","kana":"でんぴょう に きにゅう して ください。","meaning":"Please fill in the slip.","romaji":"denpyou ni kinyuu shite kudasai."}],"note":"Services are called 手ぶら観光 or 宅配便 (takuhaibin, parcel delivery). Ask for the price and date before you pay.","level":"useful","romaji":"nimotsu o hoteru ni okuri tai desu."},{"id":"trains-locker-10","speaker":"staff","jp":"届くのは明後日になります。","kana":"とどく の は あさって に なります。","meaning":"It will arrive the day after tomorrow.","note":"Forwarding often takes one or two days. Holidays such as New Year can cause delays, so send early.","level":"listen-only","romaji":"todoku no wa asatte ni narimasu."},{"id":"trains-locker-11","speaker":"you","jp":"ロッカーが開かないんですが。","kana":"ロッカー が あかない ん です が。","meaning":"The locker won't open.","note":"Check that you are using the same IC card that locked it, or ask staff at the station office.","level":"useful","romaji":"rokkaa ga akanai n desu ga."},{"id":"trains-locker-12","speaker":"you","jp":"荷物を宅配便で送りたいです。","kana":"にもつ を たくはいびん で おくり たい です。","meaning":"I'd like to send my luggage by parcel delivery.","level":"useful","romaji":"nimotsu o takuhaibin de okuri tai desu."}]},{"title":"Buses and streetcars","intro":"Boarding and paying rules differ by region and operator, so learn the cues.","phrases":[{"id":"trains-bus-01","speaker":"announcement","jp":"前乗り","kana":"まえのり","meaning":"Board at the front.","note":"Front or rear boarding (後ろ乗り) tells you which door to use. 中乗り (middle) and 前降り (exit at the front) are also used.","level":"core","romaji":"maenori"},{"id":"trains-bus-02","speaker":"announcement","jp":"後ろ乗り","kana":"うしろのり","meaning":"Board at the rear.","note":"Most city buses use one of three patterns: front boarding and pay on exit, rear boarding and pay on exit, or front boarding and pay on entry.","level":"core","romaji":"ushironori"},{"id":"trains-bus-03","speaker":"announcement","jp":"後払い","kana":"あとばらい","meaning":"Pay when you get off.","note":"Pay on exit (後払い) or on entry (先払い). The sign tells you which applies.","level":"core","romaji":"atobarai"},{"id":"trains-bus-04","speaker":"announcement","jp":"先払い","kana":"さきばらい","meaning":"Pay when you get on.","level":"core","romaji":"sakibarai"},{"id":"trains-bus-05","speaker":"announcement","jp":"整理券をお取りください。","kana":"せいりけん を おとり ください。","meaning":"Please take a numbered ticket.","note":"Match the number to the fare board at the front. Many city buses still use this. On Hiroden buses from 1 July 2026, no numbered ticket is needed.","level":"core","romaji":"seiriken o otori kudasai."},{"id":"trains-bus-06","speaker":"you","jp":"このバスは河口湖駅に行きますか。","kana":"この バス は かわぐちこえき に いきます か。","meaning":"Does this bus go to Kawaguchiko Station?","replies":[{"jp":"行きますよ。","kana":"いきます よ。","meaning":"Yes, it does.","romaji":"ikimasu yo."},{"jp":"反対側のバス停です。","kana":"はんたいがわ の バスてい です。","meaning":"That bus stop is on the other side.","romaji":"hantaigawa no basutei desu."}],"level":"core","romaji":"kono basu wa kawaguchikoeki ni ikimasu ka."},{"id":"trains-bus-07","speaker":"announcement","jp":"次は、河口湖駅です。","kana":"つぎ は、 かわぐちこえき です。","meaning":"The next stop is Kawaguchiko Station.","note":"次は is the cue for the next stop. Get ready to press the button if you need to get off.","level":"listen-only","romaji":"tsugi wa, kawaguchikoeki desu."},{"id":"trains-bus-08","speaker":"announcement","jp":"お降りの方はボタンでお知らせください。","kana":"おおり の かた は ボタン で おしらせ ください。","meaning":"If you are getting off, please press the button.","level":"listen-only","romaji":"oori no kata wa botan de oshirase kudasai."},{"id":"trains-bus-09","speaker":"announcement","jp":"バスが止まるまで、席を立たないでください。","kana":"バス が とまる まで、 せき を たたない で ください。","meaning":"Please stay seated until the bus stops.","level":"listen-only","romaji":"basu ga tomaru made, seki o tatanai de kudasai."},{"id":"trains-bus-10","speaker":"you","jp":"両替できますか。","kana":"りょうがえ できます か。","meaning":"Can I get change?","replies":[{"jp":"走行中の両替はできません。","kana":"そうこう ちゅう の りょうがえ は できません。","meaning":"You cannot change money while the bus is moving.","romaji":"soukou chuu no ryougae wa dekimasen."}],"note":"Have the exact fare ready when you can. Change machines may not accept large notes.","level":"core","romaji":"ryougae dekimasu ka."},{"id":"trains-bus-11","speaker":"announcement","jp":"ICカードはここにタッチしてください。","kana":"アイシーカード は ここ に タッチ して ください。","meaning":"Please tap your IC card here.","also_heard":[{"jp":"乗るときと降りるときにタッチしてください。","kana":"のる とき と おりる とき に タッチ して ください。","meaning":"Please tap when you get on and when you get off.","romaji":"noru toki to oriru toki ni tatchi shite kudasai."}],"note":"On Hiroden, tap when you board and again when you get off. Keep the card on the reader until the chime sounds.","level":"listen-only","romaji":"aishiikaado wa koko ni tatchi shite kudasai."},{"id":"trains-bus-12","speaker":"you","jp":"河口湖から新宿まで、高速バスの切符を2枚ください。","kana":"かわぐちこ から しんじゅく まで、 こうそく バス の きっぷ を にまい ください。","meaning":"Two highway bus tickets from Kawaguchiko to Shinjuku, please.","replies":[{"jp":"予約はされていますか。","kana":"よやく は されて います か。","meaning":"Do you have a reservation?","romaji":"yoyaku wa sarete imasu ka."},{"jp":"何時の便ですか。","kana":"なんじ の びん です か。","meaning":"Which departure time?","romaji":"nanji no bin desu ka."}],"note":"Highway buses often need a booking. Ask for the departure time you want.","level":"core","romaji":"kawaguchiko kara shinjuku made, kousoku basu no kippu o nimai kudasai."},{"id":"trains-bus-13","speaker":"staff","jp":"大きいお荷物はトランクにお預けください。","kana":"おおきい おにもつ は トランク に おあずけ ください。","meaning":"Please leave big bags in the luggage hold.","also_heard":[{"jp":"荷物の引換券です。","kana":"にもつ の ひきかえけん です。","meaning":"Here is your luggage claim tag.","romaji":"nimotsu no hikikaeken desu."}],"level":"listen-only","romaji":"ookii onimotsu wa toranku ni oazuke kudasai."},{"id":"trains-bus-14","speaker":"staff","jp":"集合時間は14時です。時間厳守でお願いします。","kana":"しゅうごう じかん は じゅうよじ です。 じかん げんしゅ で おねがい します。","meaning":"The meeting time is 2 pm. Please be on time.","note":"集合 means meeting point or time. Tour guides use it often.","level":"listen-only","romaji":"shuugou jikan wa juuyoji desu. jikan genshu de onegai shimasu."},{"id":"trains-bus-15","speaker":"you","jp":"何時にどこに戻ればいいですか。","kana":"なんじ に どこ に もどれば いい です か。","meaning":"What time and where should we come back?","level":"core","romaji":"nanji ni doko ni modoreba ii desu ka."},{"id":"trains-bus-16","speaker":"announcement","jp":"次は原爆ドーム前です。","kana":"つぎ は げんばくドーム まえ です。","meaning":"The next stop is in front of the Atomic Bomb Dome.","note":"Hiroden streetcars announce each stop. Listen for 次は, then the stop name.","level":"listen-only","romaji":"tsugi wa genbakudoomu mae desu."}]},{"title":"Taxis","intro":"Show the address on your phone. Doors open and close automatically, and many taxis take cards, but ask first.","phrases":[{"id":"trains-taxi-01","speaker":"staff","jp":"どちらまでですか。","kana":"どちら まで です か。","meaning":"Where to?","replies":[{"jp":"ここまでお願いします。","kana":"ここ まで おねがい します。","meaning":"To here, please.","romaji":"koko made onegai shimasu."},{"jp":"蔵前のホテルまでお願いします。","kana":"くらまえ の ホテル まで おねがい します。","meaning":"To the hotel in Kuramae, please.","romaji":"kuramae no hoteru made onegai shimasu."}],"note":"If you can't say the place, show the address or map on your phone.","level":"core","romaji":"dochira made desu ka."},{"id":"trains-taxi-02","speaker":"you","jp":"この住所までお願いします。","kana":"この じゅうしょ まで おねがい します。","meaning":"To this address, please.","level":"core","romaji":"kono juusho made onegai shimasu."},{"id":"trains-taxi-03","speaker":"you","jp":"トランクお願いします。","kana":"トランク おねがい します。","meaning":"Trunk, please.","level":"core","romaji":"toranku onegai shimasu."},{"id":"trains-taxi-04","speaker":"you","jp":"荷物を入れてもらえますか。","kana":"にもつ を いれて もらえます か。","meaning":"Could you put the luggage in?","level":"core","romaji":"nimotsu o irete moraemasu ka."},{"id":"trains-taxi-05","speaker":"staff","jp":"ドアが開きます。ご注意ください。","kana":"ドア が あきます。 ごちゅうい ください。","meaning":"The door is opening. Please be careful.","also_heard":[{"jp":"ドアが閉まります。ご注意ください。","kana":"ドア が しまります。 ごちゅうい ください。","meaning":"The door is closing. Please be careful.","romaji":"doa ga shimarimasu. gochuui kudasai."}],"note":"The rear door opens and closes by itself. Don't operate it yourself.","level":"listen-only","romaji":"doa ga akimasu. gochuui kudasai."},{"id":"trains-taxi-06","speaker":"staff","jp":"シートベルトをお締めください。","kana":"シートベルト を おしめ ください。","meaning":"Please fasten your seatbelt.","level":"listen-only","romaji":"shiitoberuto o oshime kudasai."},{"id":"trains-taxi-07","speaker":"you","jp":"どのくらいかかりますか。","kana":"どの くらい かかります か。","meaning":"How long will it take?","replies":[{"jp":"15分ぐらいですね。","kana":"じゅうごふん ぐらい です ね。","meaning":"About 15 minutes.","romaji":"juugofun gurai desu ne."},{"jp":"混んでいるのでもう少しかかります。","kana":"こんで いる ので もうすこし かかります。","meaning":"The traffic is heavy, so it will take a bit longer.","romaji":"konde iru node mousukoshi kakarimasu."}],"level":"core","romaji":"dono kurai kakarimasu ka."},{"id":"trains-taxi-08","speaker":"you","jp":"だいたいいくらぐらいですか。","kana":"だいたい いくら ぐらい です か。","meaning":"Roughly how much will it be?","note":"Ask before you get in if the fare matters to you. Taxi meters show the fare as you go.","level":"core","romaji":"daitai ikura gurai desu ka."},{"id":"trains-taxi-09","speaker":"you","jp":"カード使えますか。","kana":"カード つかえます か。","meaning":"Can I pay by card?","replies":[{"jp":"はい、使えます。","kana":"はい、 つかえます。","meaning":"Yes, you can.","romaji":"hai, tsukaemasu."},{"jp":"現金のみです。","kana":"げんきん のみ です。","meaning":"Cash only.","romaji":"genkin nomi desu."}],"level":"core","romaji":"kaado tsukaemasu ka."},{"id":"trains-taxi-10","speaker":"you","jp":"スイカで払えますか。","kana":"スイカ で はらえます か。","meaning":"Can I pay with Suica?","note":"Ask before you get in. Not every taxi accepts IC cards.","level":"useful","romaji":"suika de haraemasu ka."},{"id":"trains-taxi-11","speaker":"you","jp":"ここで止めてください。","kana":"ここ で とめて ください。","meaning":"Please stop here.","level":"core","romaji":"koko de tomete kudasai."},{"id":"trains-taxi-12","speaker":"you","jp":"ここで大丈夫です。","kana":"ここ で だいじょうぶ です。","meaning":"Here is fine.","level":"core","romaji":"koko de daijoubu desu."},{"id":"trains-taxi-13","speaker":"you","jp":"この辺でいいです。","kana":"この へん で いい です。","meaning":"Around here is fine.","level":"core","romaji":"kono hen de ii desu."},{"id":"trains-taxi-14","speaker":"staff","jp":"入口の前でよろしいですか。","kana":"いりぐち の まえ で よろしい です か。","meaning":"Is in front of the entrance OK?","also_heard":[{"jp":"どちら側につけますか。","kana":"どちら がわ に つけます か。","meaning":"Which side shall I pull up on?","romaji":"dochira gawa ni tsukemasu ka."}],"replies":[{"jp":"はい、そこでお願いします。","kana":"はい、 そこ で おねがい します。","meaning":"Yes, there, please.","romaji":"hai, soko de onegai shimasu."}],"level":"listen-only","romaji":"iriguchi no mae de yoroshii desu ka."},{"id":"trains-taxi-15","speaker":"you","jp":"領収書をください。","kana":"りょうしゅうしょ を ください。","meaning":"A receipt, please.","also_heard":[{"jp":"レシートお願いします。","kana":"レシート おねがい します。","meaning":"A receipt, please.","romaji":"reshiito onegai shimasu."}],"note":"Ask for 領収書 when you need a formal receipt for expenses. The driver may hand you a slip to sign or fill.","level":"useful","romaji":"ryoushuusho o kudasai."},{"id":"trains-taxi-16","speaker":"you","jp":"タクシー乗り場はどこですか。","kana":"タクシー のりば は どこ です か。","meaning":"Where is the taxi stand?","level":"useful","romaji":"takushii noriba wa doko desu ka."}]},{"title":"Trouble","intro":"Missed trains, wrong trains, lost tickets and things left on board.","phrases":[{"id":"trains-trouble-01","speaker":"you","jp":"電車に乗り遅れました。","kana":"でんしゃ に のりおくれました。","meaning":"I missed my train.","replies":[{"jp":"切符を見せてください。","kana":"きっぷ を みせて ください。","meaning":"Please show me your ticket.","romaji":"kippu o misete kudasai."},{"jp":"後の列車の自由席にご乗車ください。","kana":"あと の れっしゃ の じゆうせき に ごじょうしゃ ください。","meaning":"Please board a non-reserved seat on a later train.","romaji":"ato no ressha no jiyuuseki ni gojousha kudasai."},{"jp":"変更が必要です。","kana":"へんこう が ひつよう です。","meaning":"A change is needed.","romaji":"henkou ga hitsuyou desu."}],"note":"Rules differ on all-Nozomi days. Ask at the window before you decide.","level":"core","romaji":"densha ni noriokuremashita."},{"id":"trains-trouble-02","speaker":"you","jp":"間違えて反対の電車に乗ってしまいました。","kana":"まちがえて はんたい の でんしゃ に のって しまいました。","meaning":"I got on the wrong train by mistake, going the opposite way.","replies":[{"jp":"反対のホームから戻ってください。","kana":"はんたい の ホーム から もどって ください。","meaning":"Please go back from the opposite platform.","romaji":"hantai no hoomu kara modotte kudasai."},{"jp":"精算は不要です。","kana":"せいさん は ふよう です。","meaning":"No fare adjustment is needed.","romaji":"seisan wa fuyou desu."}],"level":"core","romaji":"machigaete hantai no densha ni notte shimaimashita."},{"id":"trains-trouble-03","speaker":"you","jp":"降りる駅を過ぎてしまいました。","kana":"おりる えき を すぎて しまいました。","meaning":"I passed my stop.","note":"Staff may ask you to go back on the opposite platform. Keep your ticket.","level":"useful","romaji":"oriru eki o sugite shimaimashita."},{"id":"trains-trouble-04","speaker":"you","jp":"切符をなくしてしまいました。","kana":"きっぷ を なくして しまいました。","meaning":"I lost my ticket.","replies":[{"jp":"申し訳ありませんが、もう一度お買い求めいただくことになります。","kana":"もうしわけ ありません が、 もういちど おかいもとめ いただく こと に なります。","meaning":"I'm sorry, but you will need to buy a new ticket.","romaji":"moushiwake arimasen ga, mouichido okaimotome itadaku koto ni narimasu."},{"jp":"再収受証明を発行します。","kana":"さいしゅうじゅしょうめい を はっこう します。","meaning":"I will issue a certificate of re-collection.","romaji":"saishuujushoumei o hakkou shimasu."}],"note":"You usually buy a new ticket. The certificate may help you claim a refund if the ticket is found. Ask about it at the window.","level":"core","romaji":"kippu o nakushite shimaimashita."},{"id":"trains-trouble-05","speaker":"you","jp":"電車に忘れ物をしてしまいました。","kana":"でんしゃ に わすれもの を して しまいました。","meaning":"I left something on the train.","level":"core","romaji":"densha ni wasuremono o shite shimaimashita."},{"id":"trains-trouble-06","speaker":"staff","jp":"何時ごろの、どちら行きの電車ですか。","kana":"なんじ ごろ の、 どちら いき の でんしゃ です か。","meaning":"What time, and which direction was the train?","also_heard":[{"jp":"何号車ですか。","kana":"なんごうしゃ です か。","meaning":"Which car was it?","romaji":"nangousha desu ka."},{"jp":"どんな物ですか。色は？","kana":"どんな もの です か。 いろ は？","meaning":"What is it? What colour?","romaji":"donna mono desu ka. iro wa?"}],"replies":[{"jp":"10時ごろの、名古屋行きの、7号車です。","kana":"じゅうじ ごろ の、 なごや いき の、 ななごうしゃ です。","meaning":"Around 10 o'clock, the train for Nagoya, car 7.","romaji":"juuji goro no, nagoya iki no, nanagousha desu."},{"jp":"黒いリュックです。","kana":"くろい リュック です。","meaning":"A black backpack.","romaji":"kuroi ryukku desu."}],"level":"core","romaji":"nanji goro no, dochira iki no densha desu ka."},{"id":"trains-trouble-07","
