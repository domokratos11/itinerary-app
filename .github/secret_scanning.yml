# These files hold the two Google browser keys, which ship in the page by
# design and are protected by their restrictions in Google Cloud, not by
# secrecy (see docs/maps-setup.md). The Maps script key stays in the
# git-ignored .env and is still scanned everywhere else.
paths-ignore:
  - "src/lib/firebase.config.ts"
  - "src/lib/maps.config.ts"
